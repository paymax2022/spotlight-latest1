name: mobile-crypto-typecheck

# Scoped TypeScript gate for the crypto module (mirrors tsconfig.cryptocheck.json).
on:
  push:
    paths:
      - 'src/features/crypto/**'
      - 'app/crypto/**'
      - 'tsconfig.cryptocheck.json'
      - '.github/workflows/mobile-crypto-typecheck.yml'
  pull_request:
    paths:
      - 'src/features/crypto/**'
      - 'app/crypto/**'
      - 'tsconfig.cryptocheck.json'

permissions:
  contents: read

jobs:
  typecheck:
    name: tsc (crypto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Typecheck crypto module
        run: npx tsc -p tsconfig.cryptocheck.json
