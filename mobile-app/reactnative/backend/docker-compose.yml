# Full local stack: Postgres → migrate → crypto service.
#   docker compose up --build      # service on http://localhost:8080
#
# Omit DATABASE_URL (or run the binary directly) to use the in-memory store.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paymax
      POSTGRES_PASSWORD: paymax
      POSTGRES_DB: paymax
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymax"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://paymax:paymax@postgres:5432/paymax?sslmode=disable"
      - "up"
    restart: on-failure

  crypto-service:
    build:
      context: .
    image: paymax/crypto-service:local
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    # Values below are interpolated from a `.env` file next to this compose file
    # (copy .env.example → .env and fill it in). Any unset var defaults to empty,
    # which keeps that module on the built-in mock — so real keys are opt-in and
    # never committed.
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://paymax:paymax@postgres:5432/paymax?sslmode=disable
      # Auth
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL:-}
      - ALLOW_DEV_AUTH=${ALLOW_DEV_AUTH:-}
      - TRUST_ADMIN_ROLE_HEADER=${TRUST_ADMIN_ROLE_HEADER:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-}
      # Webhook auth (fail-closed): unset → 503 unless ALLOW_DEV_AUTH=true. Set in prod.
      - CRYPTO_WEBHOOK_SECRET=${CRYPTO_WEBHOOK_SECRET:-}
      # Stocks venue: Alpaca Broker API (blank → mock broker)
      - ALPACA_BASE_URL=${ALPACA_BASE_URL:-}
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET:-}
      - ALPACA_ACCOUNT_ID=${ALPACA_ACCOUNT_ID:-}
      # Crypto venue: Quidax (blank → mock adapters)
      - QUIDAX_BASE_URL=${QUIDAX_BASE_URL:-}
      - QUIDAX_API_KEY=${QUIDAX_API_KEY:-}
      - QUIDAX_API_SECRET=${QUIDAX_API_SECRET:-}
      # Money-core ledger consolidation
      - LEDGER_BACKEND=${LEDGER_BACKEND:-}
      - LEDGER_BASE_URL=${LEDGER_BASE_URL:-}
      - LEDGER_SERVICE_TOKEN=${LEDGER_SERVICE_TOKEN:-}
    restart: unless-stopped
