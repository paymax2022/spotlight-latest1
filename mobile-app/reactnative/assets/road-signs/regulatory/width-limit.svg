<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="t">
  <title id="t">Width limit</title>
  <desc>White circle, red ring, inward-pointing arrows and a black dimension; maximum vehicle width.</desc>
  <circle cx="120" cy="120" r="112" fill="#C81E2D"/>
  <circle cx="120" cy="120" r="88" fill="#FFFFFF"/>
  <g fill="#141414">
    <polygon points="60,104 60,136 88,120"/>
    <polygon points="180,104 180,136 152,120"/>
    <text x="120" y="121" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="34" text-anchor="middle" dominant-baseline="central">2.1m</text>
  </g>
</svg>
