<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="t"><title id="t">End of minimum speed</title><desc>Mandatory blue circle with the white number 30 crossed by a red diagonal bar, ending the minimum speed requirement.</desc><circle cx="120" cy="120" r="112" fill="#0B5FB0"/><text x="120" y="120" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="120" text-anchor="middle" dominant-baseline="central">30</text><line x1="52" y1="188" x2="188" y2="52" stroke="#D0021B" stroke-width="14" stroke-linecap="round"/></svg>
