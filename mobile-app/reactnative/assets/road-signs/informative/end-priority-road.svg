<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="t">
  <title id="t">End of priority road</title>
  <desc>Yellow diamond with a diagonal black bar indicating the end of a priority road.</desc>
  <rect x="30" y="30" width="180" height="180" rx="10" transform="rotate(45 120 120)" fill="#FFFFFF"/>
  <rect x="48" y="48" width="144" height="144" rx="8" transform="rotate(45 120 120)" fill="#F4C400"/>
  <line x1="70" y1="170" x2="170" y2="70" stroke="#1A1A1A" stroke-width="12"/>
</svg>
