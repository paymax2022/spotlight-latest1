openapi: 3.0.3
info:
  title: Telemedicine admin - finance oversight
  version: 1.1.0
  description: |
    Oversight of doctor earnings and payouts for the admin console, plus four
    admin workflow decisions (payout approve/hold, dispute resolve, commission
    override). No endpoint here moves money, writes a wallet balance or posts to
    the ledger: the doctor's ledger debit is posted when the payout is requested.
    Every decision requires an Idempotency-Key (a repeated key replays the first
    result), runs in one transaction with a doctor_compliance_audit row
    (action `admin.finance.*`), and requires telemedicine.admin.manage.

    Money is always an integer in kobo (minor units). Never a float, never a string.

    Derivation (matches telemedicine CompleteAppointment's settlement.Split):
    for each COMPLETED appointment, commission = floor(fee_kobo * 15 / 100) and the
    doctor net = fee_kobo - commission. The platform booking fee (platform_fee_kobo)
    is a separate 100%-platform leg on top. Figures are derived from the appointments
    table for oversight; the ledger remains the source of truth for balances.
servers:
  - url: /api/v1/telemedicine/admin
security:
  - bearerAuth: []
paths:
  /finance/summary:
    get:
      summary: KPI strip - consult fees, commission, payouts by status, open disputes
      description: Requires permission telemedicine.admin.view.
      parameters:
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FinanceSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /finance/payouts:
    get:
      summary: Payout list across all doctors
      description: Requires permission telemedicine.admin.view.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, processing, paid, failed, reversed] }
        - name: doctor_user_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Payout' }
                      total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /finance/payouts/{id}:
    get:
      summary: One payout with its settlement disputes
      description: Requires permission telemedicine.admin.view.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PayoutDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /finance/earnings:
    get:
      summary: Per-doctor earnings derived from completed appointments
      description: |
        Requires permission telemedicine.admin.view. Earnings are windowed by
        from/to (appointment created_at); paid_out_kobo and in_flight_kobo are
        all-time payout totals. No balance is computed here - the ledger is
        authoritative.
      parameters:
        - name: doctor_user_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/DoctorEarnings' }
                      total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
  /finance/invoices:
    get:
      summary: Doctor invoices
      description: Requires permission telemedicine.admin.view.
      parameters:
        - name: doctor_user_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Invoice' }
                      total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
  /finance/disputes:
    get:
      summary: Settlement-dispute queue (read-only)
      description: Requires permission telemedicine.admin.view.
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Dispute' }
                      total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
  /finance/disputes/{id}:
    get:
      summary: One dispute with its payout
      description: Requires permission telemedicine.admin.view.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DisputeDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /finance/commission-config:
    get:
      summary: Platform commission default and per-doctor overrides
      description: |
        Requires permission telemedicine.admin.view. The settlement split is fixed
        at 85/15 in code; per-doctor rows are the stored configuration the doctor
        app displays and are reported as-is.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CommissionConfigView' }
  /finance/payouts/{id}/approve:
    post:
      summary: Approve a pending payout for disbursement (pending -> processing)
      description: Requires telemedicine.admin.manage. Clears any hold.
      parameters:
        - $ref: '#/components/parameters/idPath'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/KeyReuse' }
  /finance/payouts/{id}/hold:
    post:
      summary: Put a pending payout on hold (status stays pending, held_at set)
      description: Requires telemedicine.admin.manage.
      parameters:
        - $ref: '#/components/parameters/idPath'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/KeyReuse' }
  /finance/disputes/{id}/resolve:
    post:
      summary: Close an open settlement dispute as resolved or rejected
      description: |
        Requires telemedicine.admin.manage. Records the decision only; any money
        correction is a separate reversing ledger entry, never made here.
      parameters:
        - $ref: '#/components/parameters/idPath'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, note]
              properties:
                outcome: { type: string, enum: [resolved, rejected] }
                note: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/KeyReuse' }
  /finance/commission-config/{doctorUserId}:
    put:
      summary: Upsert a doctor's commission override
      description: Requires telemedicine.admin.manage. The audit row keeps previous and next values.
      parameters:
        - name: doctorUserId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commission_bps, vat_bps, payout_cycle]
              properties:
                commission_bps: { type: integer, minimum: 0, maximum: 10000 }
                vat_bps: { type: integer, minimum: 0, maximum: 10000 }
                payout_cycle: { type: string, enum: [weekly, biweekly, monthly] }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/KeyReuse' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    idPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    from:
      name: from
      in: query
      description: Inclusive lower bound, RFC 3339 or YYYY-MM-DD
      schema: { type: string }
    to:
      name: to
      in: query
      description: Exclusive upper bound, RFC 3339 or YYYY-MM-DD
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
    offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
  responses:
    Action:
      description: Decision applied (or replayed for a repeated Idempotency-Key)
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/ActionResult' }
    Conflict:
      description: The entity is not in a state that allows this decision
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    KeyReuse:
      description: Idempotency-Key already used for a different action or entity
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid query or path parameter
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Missing telemedicine.admin.view
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    ActionResult:
      type: object
      properties:
        action: { type: string, example: admin.finance.payout.approve }
        entity_id: { type: string }
        status: { type: string }
        audit_id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        replayed: { type: boolean }
    Error:
      type: object
      properties:
        error: { type: string }
    Kobo:
      type: integer
      format: int64
      description: Integer minor units (kobo)
    PayoutStatusTotal:
      type: object
      properties:
        status: { type: string }
        count: { type: integer }
        amount_kobo: { $ref: '#/components/schemas/Kobo' }
    FinanceSummary:
      type: object
      properties:
        currency: { type: string, example: NGN }
        completed_consultations: { type: integer }
        gross_consult_fees_kobo: { $ref: '#/components/schemas/Kobo' }
        platform_commission_kobo: { $ref: '#/components/schemas/Kobo' }
        platform_booking_fees_kobo: { $ref: '#/components/schemas/Kobo' }
        doctor_net_kobo: { $ref: '#/components/schemas/Kobo' }
        payouts_by_status:
          type: array
          items: { $ref: '#/components/schemas/PayoutStatusTotal' }
        open_disputes: { type: integer }
    BankAccountMasked:
      type: object
      description: Account number is never returned in full - last four digits only.
      properties:
        bank_name: { type: string, nullable: true }
        account_last4: { type: string, nullable: true }
        is_verified: { type: boolean }
    Payout:
      type: object
      properties:
        id: { type: string, format: uuid }
        doctor_user_id: { type: string, format: uuid }
        doctor_name: { type: string }
        ref: { type: string, nullable: true }
        amount_kobo: { $ref: '#/components/schemas/Kobo' }
        currency: { type: string }
        status: { type: string, enum: [pending, processing, paid, failed, reversed] }
        consult_count: { type: integer }
        period_label: { type: string, nullable: true }
        failure_reason: { type: string, nullable: true }
        requested_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
        bank_account: { $ref: '#/components/schemas/BankAccountMasked' }
        open_disputes: { type: integer }
        held_at: { type: string, format: date-time, nullable: true }
        hold_reason: { type: string, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
    PayoutDetail:
      allOf:
        - $ref: '#/components/schemas/Payout'
        - type: object
          properties:
            ledger_ref: { type: string, nullable: true }
            provider_reference: { type: string, nullable: true }
            disputes:
              type: array
              items: { $ref: '#/components/schemas/Dispute' }
    DoctorEarnings:
      type: object
      properties:
        doctor_id: { type: string, format: uuid }
        doctor_user_id: { type: string, format: uuid }
        doctor_name: { type: string }
        specialty: { type: string }
        completed_consultations: { type: integer }
        gross_kobo: { $ref: '#/components/schemas/Kobo' }
        commission_kobo: { $ref: '#/components/schemas/Kobo' }
        platform_booking_fees_kobo: { $ref: '#/components/schemas/Kobo' }
        net_kobo: { $ref: '#/components/schemas/Kobo' }
        paid_out_kobo: { $ref: '#/components/schemas/Kobo' }
        in_flight_kobo: { $ref: '#/components/schemas/Kobo' }
    Invoice:
      type: object
      properties:
        id: { type: string, format: uuid }
        doctor_user_id: { type: string, format: uuid }
        doctor_name: { type: string }
        ref: { type: string, nullable: true }
        appointment_id: { type: string, format: uuid, nullable: true }
        gross_kobo: { $ref: '#/components/schemas/Kobo' }
        commission_kobo: { $ref: '#/components/schemas/Kobo' }
        vat_kobo: { $ref: '#/components/schemas/Kobo' }
        net_kobo: { $ref: '#/components/schemas/Kobo' }
        currency: { type: string }
        status: { type: string }
        issued_at: { type: string, format: date-time }
    Dispute:
      type: object
      properties:
        id: { type: string, format: uuid }
        doctor_user_id: { type: string, format: uuid }
        doctor_name: { type: string }
        payout_id: { type: string, format: uuid, nullable: true }
        status: { type: string }
        reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DisputeDetail:
      allOf:
        - $ref: '#/components/schemas/Dispute'
        - type: object
          properties:
            detail:
              type: object
              additionalProperties: true
            payout: { $ref: '#/components/schemas/Payout' }
    DoctorCommissionOverride:
      type: object
      properties:
        doctor_user_id: { type: string, format: uuid }
        doctor_name: { type: string }
        commission_bps: { type: integer }
        vat_bps: { type: integer }
        payout_cycle: { type: string }
        updated_at: { type: string, format: date-time }
    CommissionConfigView:
      type: object
      properties:
        platform_commission_bps: { type: integer, example: 1500 }
        doctor_share_bps: { type: integer, example: 8500 }
        overrides:
          type: array
          items: { $ref: '#/components/schemas/DoctorCommissionOverride' }
