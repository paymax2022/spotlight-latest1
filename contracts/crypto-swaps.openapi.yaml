openapi: 3.1.0
info:
  title: Paymax × Spotlight — Crypto Swaps API
  version: 1.0.0
  description: >
    Provider-driven crypto buy (NGN to crypto) swaps over the Quidax adapter: quote, confirm
    (second factor), read, plus the provider webhook. Behind FEATURE_CRYPTO_ENABLED and
    FEATURE_CRYPTO_SWAPS_ENABLED (default off). ADR-PR708, ADR-PR709, ADR-PR710, ADR-PR716,
    ADR-PR727.

    Conventions:
      - NGN amounts are integers in kobo. Never floats. Crypto amounts are decimal STRINGS.
      - Quote requires an Idempotency-Key; the same key with a different body is 409.
      - Confirm requires the user's transaction PIN in the body. A missing PIN is 400 and is
        never verified (it must not count toward the PIN lockout).
      - Confirm moves the NGN into a ledger hold BEFORE the provider executes; the final
        settlement arrives by webhook or reconciler and is visible by polling GET.
      - Another user's swap is always 404. Provider ids and internal fields are never returned.
      - Auth: Bearer JWT (Supabase). Member routes need the crypto.trade permission.

servers:
  - url: /api/v1
    description: Crypto swap routes (Go backend)

tags:
  - name: Swaps
  - name: Withdrawals
  - name: Webhooks
  - name: Admin

paths:
  /crypto/swaps/quote:
    post:
      tags: [Swaps]
      summary: Price a buy or a sell and persist the quote
      description: >-
        A buy names the NGN to spend (ngn_kobo; the fee is added on top). A sell names the
        crypto to sell (amount, a decimal string); the NGN is the provider's price, floored to
        whole kobo, and the wallet is credited ngn_kobo - fee_kobo only once the provider
        confirms. A sell holds no NGN. Sending the other side's amount field is a 400.
      operationId: quoteCryptoSwap
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset]
              additionalProperties: false
              properties:
                side: { type: string, enum: [buy, sell], default: buy }
                asset: { type: string, example: USDT }
                ngn_kobo: { type: integer, format: int64, minimum: 1, description: 'Buy only (required): NGN to spend, in kobo (fee is added on top)' }
                amount: { type: string, pattern: '^[0-9]{1,20}(\.[0-9]{1,18})?$', example: '10.5', description: 'Sell only (required): crypto units to sell, a plain positive decimal string' }
      responses:
        '201': { $ref: '#/components/responses/Swap' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { description: Idempotency-Key reused with a different request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429':
          description: >-
            Per-user rate limit exceeded (code rate_limited). Quote and confirm have separate
            per-minute budgets (defaults 20 and 5). Retry after the next minute; the
            X-RateLimit-Limit and X-RateLimit-Remaining headers report the budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': { $ref: '#/components/responses/Error' }
  /crypto/swaps/{id}/confirm:
    post:
      tags: [Swaps]
      summary: Confirm a quoted swap (second factor required)
      operationId: confirmCryptoSwap
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SwapId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              additionalProperties: false
              properties:
                pin: { type: string, description: The user's transaction PIN }
      responses:
        '200': { $ref: '#/components/responses/Swap' }
        '202':
          description: The provider outcome is unknown; the swap is parked for review with the NGN held.
          content: { application/json: { schema: { $ref: '#/components/schemas/SwapEnvelope' } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { description: pin_not_set, pin_invalid or trading_not_allowed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '410': { description: quote_expired, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: insufficient_funds or limit_exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429':
          description: >-
            Per-user rate limit exceeded (code rate_limited). Quote and confirm have separate
            per-minute budgets (defaults 20 and 5). Retry after the next minute; the
            X-RateLimit-Limit and X-RateLimit-Remaining headers report the budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': { $ref: '#/components/responses/Error' }
  /crypto/swaps/config:
    get:
      tags: [Swaps]
      summary: Trading rail the app should use
      description: >-
        Exists only when the provider swap pipeline is mounted (FEATURE_CRYPTO_SWAPS_ENABLED and
        fully wired). A 404 tells the app to stay on the legacy internal-ledger endpoints.
      operationId: getCryptoSwapConfig
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Pipeline is live
          content:
            application/json:
              schema:
                type: object
                required: [success, config]
                properties:
                  success: { type: boolean }
                  config:
                    type: object
                    required: [rail, sides, max_quote_kobo]
                    properties:
                      rail: { type: string, enum: [provider] }
                      sides: { type: array, items: { type: string, enum: [buy, sell] } }
                      max_quote_kobo: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Error' }
  /crypto/swaps/balances:
    get:
      tags: [Swaps]
      summary: Crypto held in the caller's provider sub-account
      description: >-
        Never provisions a provider account; none yet returns an empty list. NGN and empty
        wallets are omitted. A provider failure is 502 (never an empty list).
      operationId: listCryptoSwapBalances
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Holdings
          content:
            application/json:
              schema:
                type: object
                required: [success, balances]
                properties:
                  success: { type: boolean }
                  balances:
                    type: array
                    items:
                      type: object
                      required: [asset, available, locked, total]
                      properties:
                        asset: { type: string, example: USDT }
                        available: { type: string, description: Spendable/sellable units (decimal string) }
                        locked: { type: string, description: Reserved by the provider (decimal string) }
                        total: { type: string, description: available + locked (decimal string) }
        '401': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /crypto/swaps/deposit-address:
    get:
      tags: [Swaps]
      summary: The caller's deposit address for an asset (provider rail)
      description: >-
        Provisions the provider sub-account and address on first use (KYC trade gate applies,
        fail-closed) and returns the same address afterwards. 202 address_pending while the
        provider is still generating it; ask again shortly. Deposits credit the provider
        sub-account directly and post no platform ledger entries (ADR-PR855).
      operationId: getCryptoDepositAddress
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: asset, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9]{2,10}$' } }
        - { name: network, in: query, required: false, schema: { type: string, pattern: '^[A-Za-z0-9_-]{0,20}$' } }
      responses:
        '200':
          description: Address
          content:
            application/json:
              schema:
                type: object
                required: [success, deposit_address]
                properties:
                  success: { type: boolean }
                  deposit_address:
                    type: object
                    required: [asset, network, address]
                    properties:
                      asset: { type: string }
                      network: { type: string }
                      address: { type: string }
                      tag: { type: string, description: Memo/destination tag some networks require }
        '202': { description: 'Address is being generated (error: address_pending)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /crypto/swaps/deposits:
    get:
      tags: [Swaps]
      summary: The caller's recorded deposits, newest first (max 50)
      description: Each row is the provider's state from a re-query, never a webhook payload.
      operationId: listCryptoDeposits
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Deposits
          content:
            application/json:
              schema:
                type: object
                required: [success, deposits]
                properties:
                  success: { type: boolean }
                  deposits:
                    type: array
                    items:
                      type: object
                      required: [id, asset, amount, status, confirmations, required_confirmations]
                      properties:
                        id: { type: string }
                        asset: { type: string }
                        network: { type: string }
                        amount: { type: string, description: Decimal string }
                        status: { type: string, enum: [pending, accepted, rejected] }
                        txid: { type: string }
                        confirmations: { type: integer }
                        required_confirmations: { type: integer }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /crypto/swaps/{id}:
    get:
      tags: [Swaps]
      summary: Read one of your swaps
      operationId: getCryptoSwap
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SwapId'
      responses:
        '200': { $ref: '#/components/responses/Swap' }
        '404': { $ref: '#/components/responses/Error' }
  /crypto/withdrawals:
    post:
      tags: [Withdrawals]
      summary: Withdraw crypto to an allow-listed address (transaction PIN required)
      description: >-
        Opens an on-chain withdrawal to one of the caller's own active, allow-listed addresses for
        the asset and parks the units. Requires an Idempotency-Key header AND the user's transaction
        PIN, verified on the server before anything moves (no units parked, no fee charged on a
        refusal). A missing PIN is 400 and is never verified, so it does not count toward the PIN
        lockout. Withdrawals are refused (503) when the server has no PIN verifier wired.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address_id, units, pin]
              properties:
                asset_id: { type: string, description: 'Asset id, or use symbol' }
                symbol: { type: string }
                address_id: { type: string, description: "An id from GET /crypto/addresses (the caller's own allow-list)" }
                units: { type: integer, format: int64, description: Integer asset minor units }
                pin: { type: string, description: "The user's transaction PIN" }
      responses:
        '200': { description: Withdrawal opened (see its state; high-risk ones park at pending review) }
        '400': { description: 'pin_required, or an invalid body / amount' }
        '403': { description: 'pin_invalid (wrong or locked PIN), pin_not_set (create a PIN first), or a tier-limit refusal' }
        '500': { description: The PIN could not be verified; nothing moved }
        '503': { description: 'stepup_unavailable: no PIN verifier wired; withdrawals refused' }
  /admin/crypto/swaps/review:
    get:
      tags: [Admin]
      summary: List swaps parked in needs_review (admin, read-only)
      description: >
        Operational surface for swaps the pipeline could not auto-resolve and parked in
        needs_review with the user's NGN still held. Read-only in this round — it lets ops SEE
        held money; the settle/release/retry decision controls are a follow-up. Returns
        user_id and the provider swap id (hidden from members) because the surface is gated by
        the crypto.admin permission. has_provider_id = false means the provider outcome is
        unknown, so the swap must never be blindly settled. Oldest-parked first. Flag-gated by
        FEATURE_CRYPTO_SWAPS_ENABLED; when the flag is off the route is not mounted (404).
      operationId: listCryptoSwapsForReview
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Parked swaps, oldest first
          content: { application/json: { schema: { $ref: '#/components/schemas/ReviewQueue' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /admin/crypto/reconciler:
    get:
      tags: [Admin]
      summary: Reconciler status and swap backlog (admin, read-only)
      description: >
        What the reconciler has been doing and what is waiting on it. `replica` is the in-process
        state of the replica that answered: only the elected leader does work, so a follower mostly
        shows skipped passes, and the counters reset when the process restarts. `backlog` is read
        from the database and is the same whichever replica answers; it has one row per open state
        (needs_review, confirming, processing, quoted), zero-filled. Counts, integer kobo and alert
        text only: no swap, user or provider identifiers. Requires crypto.admin. 503 when the
        reconciler is not running on the serving replica.
      operationId: getCryptoReconcilerStatus
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Reconciler status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcilerStatus'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/crypto/fee-schedule:
    get:
      tags: [Admin]
      summary: Active markup schedule, ceiling and recent changes (admin, read-only)
      description: >
        The platform markup in basis points per asset: a rate for majors, a rate for every other asset
        and per-asset overrides. `version` 0 is the configured default (nothing stored yet). The
        history lists the last 20 versions, newest first, with who changed them and why. Requires
        crypto.admin.
      operationId: getCryptoFeeSchedule
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeScheduleResponse'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      tags: [Admin]
      summary: Replace the markup schedule with a new version (admin)
      description: >
        Appends a new, immutable version; history is never edited. Requires crypto.admin, an
        Idempotency-Key, a non-empty `reason` (max 500 characters) and `expected_version`, the
        version the editor read: a different current version is refused with 409 version_conflict,
        so two admins cannot silently overwrite each other. Every rate must be within 0 and
        ceiling_bps (150); the ceiling is fixed in code, not editable here. A new version prices NEW
        quotes only: a swap that is already quoted keeps the bps stored on it. A retry with the same
        Idempotency-Key and body returns the stored version (200); the same key with a different body
        is 409 idempotency_conflict. Each applied change is audited with the old and new values.
      operationId: updateCryptoFeeSchedule
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeeScheduleUpdate'
      responses:
        '200':
          description: The applied (or replayed) version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeScheduleResponse'
        '400':
          description: Missing or invalid Idempotency-Key, unknown field, or a schedule outside the allowed range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: version_conflict or idempotency_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/crypto/swaps/{id}/resolve:
    post:
      tags: [Admin]
      summary: Resolve a parked swap (admin)
      description: >
        Apply a human decision to a swap parked in needs_review. The decision is state-dependent
        and enforced server-side:
          - `retry`  — allowed ONLY when the swap has a provider swap id: re-poll the provider and
            apply the authoritative outcome (which itself settles or releases).
          - `release` — allowed ONLY when the swap has NO provider swap id (provider outcome
            unknown): reverse the NGN hold back to the user's wallet and fail the swap. There is no
            manual "settle/capture": we never credit crypto we cannot prove was bought.
        An Idempotency-Key and a non-empty operator note are required. Idempotent — a repeat is a
        no-op (the swap is no longer parked). crypto.admin; flag-gated by FEATURE_CRYPTO_SWAPS_ENABLED.
        ADR-PR728.
      operationId: resolveCryptoSwap
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SwapId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, note]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [release, retry] }
                note: { type: string, minLength: 1, description: Operator reason, audited }
      responses:
        '200':
          description: The resolved swap
          content: { application/json: { schema: { $ref: '#/components/schemas/ResolvedSwap' } } }
        '400': { description: 'idempotency_key_required, note_required or bad_decision', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { description: swap_not_found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'not_parked or settlement_conflict', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'nothing_to_retry (no provider id) or release_unsafe (has provider id)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { $ref: '#/components/responses/Error' }
  /webhooks/crypto/{provider}:
    post:
      tags: [Webhooks]
      summary: Provider event delivery (signature-authenticated, no session)
      operationId: cryptoProviderWebhook
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, example: quidax } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { description: Processed, or an already-processed duplicate }
        '401': { description: Bad signature }
        '404': { description: Unknown provider }
        '413': { description: Body over 1 MiB }
        '500': { description: Processing failed; the provider should redeliver }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1 } }
    SwapId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Swap:
      description: A swap
      content: { application/json: { schema: { $ref: '#/components/schemas/SwapEnvelope' } } }
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    FeeScheduleVersion:
      type: object
      required: [version, major_bps, other_bps, majors, overrides, reason, created_by, created_at]
      properties:
        version: { type: integer, format: int64, description: 0 is the configured default }
        major_bps: { type: integer, minimum: 0, maximum: 150 }
        other_bps: { type: integer, minimum: 0, maximum: 150 }
        majors:
          type: array
          items: { type: string }
        overrides:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 150 }
        reason: { type: string }
        created_by: { type: string }
        created_at: { type: string }
    FeeScheduleResponse:
      type: object
      required: [success, current, ceiling_bps]
      properties:
        success: { type: boolean }
        current: { $ref: '#/components/schemas/FeeScheduleVersion' }
        ceiling_bps: { type: integer, example: 150 }
        history:
          type: array
          items: { $ref: '#/components/schemas/FeeScheduleVersion' }
    FeeScheduleUpdate:
      type: object
      additionalProperties: false
      required: [expected_version, major_bps, other_bps, majors, reason]
      properties:
        expected_version: { type: integer, format: int64, minimum: 0, description: The version the editor read }
        major_bps: { type: integer, minimum: 0, maximum: 150 }
        other_bps: { type: integer, minimum: 0, maximum: 150 }
        majors:
          type: array
          maxItems: 50
          items: { type: string, pattern: '^[A-Za-z0-9]{2,12}$' }
        overrides:
          type: object
          maxProperties: 50
          additionalProperties: { type: integer, minimum: 0, maximum: 150 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ReconcilerStatus:
      type: object
      required: [success, note, replica, backlog]
      properties:
        success: { type: boolean }
        note: { type: string }
        replica:
          type: object
          properties:
            started_at: { type: string }
            runs: { type: integer, format: int64 }
            led_runs: { type: integer, format: int64 }
            skipped_runs: { type: integer, format: int64 }
            last_run_at: { type: string }
            last_led_at: { type: string }
            last_led: { type: boolean }
            last_error: { type: string }
            last_result:
              type: object
              properties:
                resolved: { type: integer }
                released: { type: integer }
                parked: { type: integer }
                expired: { type: integer }
                errors: { type: integer }
                clearing_negative: { type: boolean }
            totals:
              type: object
              properties:
                resolved: { type: integer, format: int64 }
                released: { type: integer, format: int64 }
                parked: { type: integer, format: int64 }
                expired: { type: integer, format: int64 }
                errors: { type: integer, format: int64 }
                clearing_negative_runs: { type: integer, format: int64 }
            recent_alerts:
              type: array
              items:
                type: object
                properties:
                  at: { type: string }
                  kind: { type: string }
                  message: { type: string }
        backlog:
          type: array
          items:
            type: object
            required: [state, count, held_kobo, oldest_age_seconds]
            properties:
              state: { type: string, enum: [needs_review, confirming, processing, quoted] }
              count: { type: integer, format: int64 }
              held_kobo: { type: integer, format: int64 }
              oldest_updated_at: { type: string }
              oldest_age_seconds: { type: integer, format: int64 }
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error: { type: string, description: Stable machine code (never provider or database text) }
    SwapEnvelope:
      type: object
      required: [success, swap]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        swap: { $ref: '#/components/schemas/Swap' }
    ResolvedSwap:
      type: object
      required: [success, swap]
      properties:
        success: { type: boolean, const: true }
        swap: { $ref: '#/components/schemas/AdminReviewSwap' }
    ReviewQueue:
      type: object
      required: [success, swaps, count]
      properties:
        success: { type: boolean, const: true }
        count: { type: integer, description: Number of swaps in this page }
        swaps:
          type: array
          items: { $ref: '#/components/schemas/AdminReviewSwap' }
    AdminReviewSwap:
      type: object
      required: [id, user_id, status, asset, ngn_kobo, fee_kobo, held_kobo, provider, has_provider_id, age_seconds]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status: { type: string, enum: [needs_review] }
