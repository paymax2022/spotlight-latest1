openapi: 3.1.0
info:
  title: Doctor (Telemedicine, provider) Module
  version: 1.0.0
  description: >
    Provider-side telemedicine module inside the Paymax super app. Covers the
    doctor / specialist / veterinarian provider experience: profile &
    verification, schedule, appointments & consults, chat / calls / clinical
    notes, prescriptions & pharmacy, lab orders & results, HMO, referrals & care
    plans, emergency escalation, vet/pet care, records & reputation, earnings &
    payouts, notifications, support, compliance, security and settings.

    Conventions:
      * Feature-flagged off in the app layer (FEATURE_DOCTOR_ENABLED). No flag, no route.
      * All monetary amounts are integers in MINOR units (kobo). Never floats, never strings.
      * Every state-changing mutation requires an `Idempotency-Key` header and is deduped
        server-side; replaying the same key returns the original result (409 on conflict).
      * Earnings/wallet balances are PROJECTIONS of the double-entry ledger — payout
        requests and invoices are stored; balances are never directly mutated.
      * Auth: Bearer (Supabase-issued JWT). Every route is scoped to the calling provider.
      * Response envelope on the wire is `res.data.data ?? res.data`; schemas below describe
        the unwrapped payload.

    NOTE: This fragment documents the doctor module's routes. Merge into / reference
    alongside the master contracts/openapi.yaml `paths:` block when integrating.

servers:
  - url: /api/v1
    description: Go backend (Gin) — doctor (telemedicine, provider) module

security:
  - bearerAuth: []

tags:
  - { name: doctor-mvp,          description: "MVP — core provider consult flow" }
  - { name: doctor-phase2,       description: "Phase 2 — pharmacy, referrals, HMO, care, reputation" }
  - { name: doctor-phase3,       description: "Phase 3 — vet, AI assist, multi-clinic practice" }
  - { name: doctor-profile,      description: "Profile & verification builder (Section B)" }
  - { name: doctor-onboarding,   description: "Onboarding — provider type, consents, permissions" }
  - { name: doctor-batch1,       description: "Vet profile, dashboard, schedule, queue, appointments" }
  - { name: doctor-batch2,       description: "Patient profile, chat, calls, clinical notes" }
  - { name: doctor-batch3,       description: "Prescriptions, pharmacy, lab orders & results" }
  - { name: doctor-batch4,       description: "HMO, referrals, care plans, emergency" }
  - { name: doctor-batch5,       description: "Vet consults, Rx, lab, records, store" }
  - { name: doctor-batch6,       description: "Records, notifications, earnings, quality" }
  - { name: doctor-batch7,       description: "Support, privacy, security, account" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-issued JWT for the authenticated provider.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: Globally unique key per mutation (prevents duplicate retries / double charges).

  responses:
    BadRequest:   { description: Invalid request / validation error }
    Unauthorized: { description: Missing or invalid bearer token }
    Forbidden:    { description: "Not a verified/eligible provider, or row not owned by caller" }
    NotFound:     { description: Resource not found }
    Conflict:     { description: Idempotency-Key replay conflict (different payload for same key) }

  schemas:
    # ── Primitives ──────────────────────────────────────────────────────────────
    Money:
      type: integer
      format: int64
      description: Amount in kobo (minor units).
    Generic:
      type: object
      description: Pragmatic catch-all for large nested shapes; key fields plus open extension.
      additionalProperties: true

    PatientSummary:
      type: object
      properties:
        id:          { type: string }
        name:        { type: string }
        initials:    { type: string }
        avatarColor: { type: string }
        age:         { type: integer }
        gender:      { type: string, enum: [male, female, other] }

    # ── MVP: profile & verification ──────────────────────────────────────────────
    DoctorProfile:
      type: object
      properties:
        id:              { type: string }
        name:            { type: string }
        title:           { type: string }
        specialtyId:     { type: string }
        specialties:     { type: array, items: { type: string } }
        subSpecialties:  { type: array, items: { type: string } }
        bio:             { type: string }
        initials:        { type: string }
        avatarColor:     { type: string }
        email:           { type: string }
        phone:           { type: string }
        mdcnNumber:      { type: string }
        feeKobo:         { $ref: '#/components/schemas/Money' }
        rating:          { type: number }
        reviewCount:     { type: integer }
        yearsExperience: { type: integer }
        languages:       { type: array, items: { type: string } }
        isOnline:        { type: boolean }
        verification:    { type: string, enum: [unsubmitted, pending, approved, rejected] }
        hospital:        { type: string }
        state:           { type: string }
    VerificationDocument:
      type: object
      properties:
        type:       { type: string, enum: [mdcn_certificate, medical_license, degree_certificate, government_id, passport_photo, cv] }
        label:      { type: string }
        fileName:   { type: string }
        uploadedAt: { type: string, format: date-time }
    VerificationSubmission:
      type: object
      properties:
        id:              { type: string }
        status:          { type: string, enum: [unsubmitted, pending, approved, rejected] }
        submittedAt:     { type: string, format: date-time }
        reviewedAt:      { type: string, format: date-time }
        documents:       { type: array, items: { $ref: '#/components/schemas/VerificationDocument' } }
        rejectionReason: { type: string }
        notes:           { type: string }
    SubmitVerificationRequest:
      type: object
      required: [mdcnNumber, documents]
      properties:
        mdcnNumber: { type: string }
        documents:  { type: array, items: { type: string } }
    SubmitVerificationResult:
      type: object
      properties:
        submissionId: { type: string }
        status:       { type: string, enum: [unsubmitted, pending, approved, rejected] }

    # ── MVP: availability ────────────────────────────────────────────────────────
    WorkingDay:
      type: object
      properties:
        day:       { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        enabled:   { type: boolean }
        startTime: { type: string }
        endTime:   { type: string }
    ScheduleBreak:
      type: object
      properties:
        id:        { type: string }
        day:       { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        startTime: { type: string }
        endTime:   { type: string }
        label:     { type: string }
    AvailabilitySchedule:
      type: object
      properties:
        doctorId:            { type: string }
        workingDays:         { type: array, items: { $ref: '#/components/schemas/WorkingDay' } }
        breaks:              { type: array, items: { $ref: '#/components/schemas/ScheduleBreak' } }
        consultDurationMins: { type: integer }
        bufferMins:          { type: integer }
        acceptsInstant:      { type: boolean }
    UpdateAvailabilityRequest:
      type: object
      required: [schedule]
      properties:
        schedule: { $ref: '#/components/schemas/AvailabilitySchedule' }

    # ── MVP: appointments ────────────────────────────────────────────────────────
    DoctorAppointment:
      type: object
      properties:
        id:          { type: string }
        ref:         { type: string }
        patient:     { $ref: '#/components/schemas/PatientSummary' }
        consultType: { type: string }
        status:      { type: string }
        slotDate:    { type: string, format: date }
        slotTime:    { type: string }
        feeKobo:     { $ref: '#/components/schemas/Money' }
        createdAt:   { type: string, format: date-time }
        reason:      { type: string }
        isHmo:       { type: boolean }
        hmoProvider: { type: string }
    UpdateAppointmentStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string }
    UpdateAppointmentStatusResult:
      type: object
      properties:
        status: { type: string }

    # ── MVP: patient medical profile ─────────────────────────────────────────────
    PatientVital:
      type: object
      properties:
        label: { type: string }
        value: { type: string }
    PatientHistoryItem:
      type: object
      properties:
        id:         { type: string }
        date:       { type: string, format: date }
        summary:    { type: string }
        doctorName: { type: string }
    PatientMedicalProfile:
      type: object
      properties:
        patient:            { $ref: '#/components/schemas/PatientSummary' }
        bloodGroup:         { type: string }
        genotype:           { type: string }
        allergies:          { type: array, items: { type: string } }
        chronicConditions:  { type: array, items: { type: string } }
        currentMedications: { type: array, items: { type: string } }
        vitals:             { type: array, items: { $ref: '#/components/schemas/PatientVital' } }
        history:            { type: array, items: { $ref: '#/components/schemas/PatientHistoryItem' } }

    # ── MVP: chat ────────────────────────────────────────────────────────────────
    ChatMessage:
      type: object
      properties:
        id:             { type: string }
        threadId:       { type: string }
        author:         { type: string, enum: [doctor, patient] }
        body:           { type: string }
        createdAt:      { type: string, format: date-time }
        attachmentUrl:  { type: string }
        attachmentName: { type: string }
    ChatThread:
      type: object
      properties:
        id:            { type: string }
        appointmentId: { type: string }
        patient:       { $ref: '#/components/schemas/PatientSummary' }
        lastMessage:   { type: string }
        lastMessageAt: { type: string, format: date-time }
        unreadCount:   { type: integer }
        consultType:   { type: string }
        status:        { type: string }
    SendChatMessageRequest:
      type: object
      required: [body]
      properties:
        body:           { type: string }
        attachmentUrl:  { type: string }
        attachmentName: { type: string }

    # ── MVP: call session ────────────────────────────────────────────────────────
    CallSession:
      type: object
      properties:
        id:            { type: string }
        appointmentId: { type: string }
        patient:       { $ref: '#/components/schemas/PatientSummary' }
        mode:          { type: string, enum: [audio, video] }
        status:        { type: string, enum: [connecting, ringing, live, ended, failed] }
        startedAt:     { type: string, format: date-time }
        durationSecs:  { type: integer }
        roomToken:     { type: string, description: Short-lived signed RTC token; empty when rtcConfigured is false }
        provider:      { type: string, enum: [agora, videosdk] }
        tokenUid:      { type: string, description: Deterministic uid the RTC token is bound to }
        tokenExpiresAt: { type: string, format: date-time }
        rtcConfigured: { type: boolean, description: "false when the provider has no server-side creds (roomToken empty, do not join)" }

    # ── MVP: SOAP note ───────────────────────────────────────────────────────────
    SoapNote:
      type: object
      properties:
        id:            { type: string }
        appointmentId: { type: string }
        patientId:     { type: string }
        subjective:    { type: string }
        objective:     { type: string }
        assessment:    { type: string }
        plan:          { type: string }
        diagnosis:     { type: array, items: { type: string } }
        createdAt:     { type: string, format: date-time }
        updatedAt:     { type: string, format: date-time }
    SaveSoapNoteRequest:
      type: object
      required: [patientId, subjective, objective, assessment, plan, diagnosis]
      properties:
        patientId:  { type: string }
        subjective: { type: string }
        objective:  { type: string }
        assessment: { type: string }
        plan:       { type: string }
        diagnosis:  { type: array, items: { type: string } }

    # ── MVP: prescriptions ───────────────────────────────────────────────────────
    PrescriptionDrugItem:
      type: object
      properties:
        name:      { type: string }
        dosage:    { type: string }
        route:     { type: string }
        frequency: { type: string }
        duration:  { type: string }
        notes:     { type: string }
    DoctorPrescription:
      type: object
      properties:
        id:            { type: string }
        ref:           { type: string }
        appointmentId: { type: string }
        patient:       { $ref: '#/components/schemas/PatientSummary' }
        doctorName:    { type: string }
        diagnosis:     { type: string }
        items:         { type: array, items: { $ref: '#/components/schemas/PrescriptionDrugItem' } }
        issuedAt:      { type: string, format: date-time }
        status:        { type: string, enum: [draft, issued, dispensed] }
    CreatePrescriptionRequest:
      type: object
      required: [appointmentId, patientId, diagnosis, items]
      properties:
        appointmentId: { type: string }
        patientId:     { type: string }
        diagnosis:     { type: string }
        items:         { type: array, items: { $ref: '#/components/schemas/PrescriptionDrugItem' } }
    CreatePrescriptionResult:
      type: object
      properties:
        prescriptionId: { type: string }
        ref:            { type: string }
        status:         { type: string, enum: [draft, issued, dispensed] }

    # ── MVP: lab orders & results ────────────────────────────────────────────────
    LabTest:
      type: object
      properties:
        id:       { type: string }
        name:     { type: string }
        code:     { type: string }
        category: { type: string }
    LabOrder:
      type: object
      properties:
        id:            { type: string }
        ref:           { type: string }
        appointmentId: { type: string }
        patient:       { $ref: '#/components/schemas/PatientSummary' }
        tests:         { type: array, items: { $ref: '#/components/schemas/LabTest' } }
        clinicalNote:  { type: string }
        status:        { type: string, enum: [ordered, collected, resulted, reviewed] }
        orderedAt:     { type: string, format: date-time }
        priority:      { type: string, enum: [routine, urgent] }
    LabResultValue:
      type: object
      properties:
        testName: { type: string }
        value:    { type: string }
        unit:     { type: string }
        refRange: { type: string }
        flag:     { type: string, enum: [normal, low, high] }
    LabResult:
      type: object
      properties:
        id:         { type: string }
        orderId:    { type: string }
        ref:        { type: string }
        patient:    { $ref: '#/components/schemas/PatientSummary' }
        values:     { type: array, items: { $ref: '#/components/schemas/LabResultValue' } }
        reportedAt: { type: string, format: date-time }
        labName:    { type: string }
        reviewed:   { type: boolean }
    CreateLabOrderRequest:
      type: object
      required: [appointmentId, patientId, testIds, priority]
      properties:
        appointmentId: { type: string }
        patientId:     { type: string }
        testIds:       { type: array, items: { type: string } }
        clinicalNote:  { type: string }
        priority:      { type: string, enum: [routine, urgent] }
    CreateLabOrderResult:
      type: object
      properties:
        orderId: { type: string }
        ref:     { type: string }
        status:  { type: string, enum: [ordered, collected, resulted, reviewed] }
    MarkReviewedResult:
      type: object
      properties:
        reviewed: { type: boolean }

    # ── MVP: HMO eligibility ─────────────────────────────────────────────────────
    HmoCoverage:
      type: object
      properties:
        provider:        { type: string }
        planName:        { type: string }
        memberId:        { type: string }
        validUntil:      { type: string, format: date }
        coveredServices: { type: array, items: { type: string } }
    HmoEligibility:
      type: object
      properties:
        appointmentId: { type: string }
        patient:       { $ref: '#/components/schemas/PatientSummary' }
        status:        { type: string, enum: [eligible, ineligible, pending] }
        coverage:      { $ref: '#/components/schemas/HmoCoverage' }
        copayKobo:     { $ref: '#/components/schemas/Money' }
        authCode:      { type: string }
        checkedAt:     { type: string, format: date-time }

    # ── MVP: earnings & payouts ──────────────────────────────────────────────────
    PayoutItem:
      type: object
      properties:
        id:           { type: string }
        ref:          { type: string }
        amountKobo:   { $ref: '#/components/schemas/Money' }
        status:       { type: string, enum: [pending, paid, processing] }
        consultCount: { type: integer }
        periodLabel:  { type: string }
        paidAt:       { type: string, format: date-time }
    EarningsSummary:
      type: object
      description: Projection of the ledger. availableKobo/pendingKobo/lifetimeKobo are computed, never stored balances.
      properties:
        availableKobo:     { $ref: '#/components/schemas/Money' }
        pendingKobo:       { $ref: '#/components/schemas/Money' }
        lifetimeKobo:      { $ref: '#/components/schemas/Money' }
        thisMonthKobo:     { $ref: '#/components/schemas/Money' }
        consultsThisMonth: { type: integer }
        payouts:           { type: array, items: { $ref: '#/components/schemas/PayoutItem' } }
    RequestPayoutRequest:
      type: object
      required: [amountKobo]
      properties:
        amountKobo: { $ref: '#/components/schemas/Money' }
    RequestPayoutResult:
      type: object
      properties:
        payoutId: { type: string }
        ref:      { type: string }
        status:   { type: string, enum: [pending, paid, processing] }

    # ── MVP: notifications, support, settings ────────────────────────────────────
    DoctorNotification:
      type: object
      properties:
        id:        { type: string }
        type:      { type: string, enum: [appointment, message, lab_result, payout, verification, system] }
        title:     { type: string }
        body:      { type: string }
        createdAt: { type: string, format: date-time }
        read:      { type: boolean }
    SupportTicket:
      type: object
      properties:
        id:        { type: string }
        ref:       { type: string }
        subject:   { type: string }
        category:  { type: string }
        status:    { type: string, enum: [open, in_progress, resolved, closed] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastReply: { type: string }
    CreateSupportTicketRequest:
      type: object
      required: [subject, category, body]
      properties:
        subject:  { type: string }
        category: { type: string }
        body:     { type: string }
    CreateSupportTicketResult:
      type: object
      properties:
        ticketId: { type: string }
        ref:      { type: string }
        status:   { type: string, enum: [open, in_progress, resolved, closed] }
    DoctorSettings:
      type: object
      properties:
        doctorId:             { type: string }
        notifyAppointments:   { type: boolean }
        notifyMessages:       { type: boolean }
        notifyPayouts:        { type: boolean }
        pushEnabled:          { type: boolean }
        emailEnabled:         { type: boolean }
        smsEnabled:           { type: boolean }
        showOnlineStatus:     { type: boolean }
        autoAcceptInstant:    { type: boolean }
        payoutBankName:       { type: string }
        payoutAccountMasked:  { type: string }
        preferredCurrency:    { type: string }
    UpdateSettingsRequest:
      type: object
      properties:
        settings: { type: object, additionalProperties: true }

paths:
  # ════════════════════════════════════════════════════════════════════════════
  # MVP (doctor.api.ts)
  # ════════════════════════════════════════════════════════════════════════════
  /doctor/profile:
    get:
      tags: [doctor-mvp]
      summary: Get doctor profile
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DoctorProfile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /doctor/verification:
    get:
      tags: [doctor-mvp]
      summary: Get current verification submission
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VerificationSubmission' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [doctor-mvp]
      summary: Submit verification documents
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SubmitVerificationRequest' } } }
      responses:
        '201': { description: Submitted, content: { application/json: { schema: { $ref: '#/components/schemas/SubmitVerificationResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /doctor/availability:
    get:
      tags: [doctor-mvp]
      summary: Get availability schedule
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilitySchedule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [doctor-mvp]
      summary: Update availability schedule
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAvailabilityRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilitySchedule' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /doctor/appointments:
    get:
      tags: [doctor-mvp]
      summary: List appointments
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: from,   in: query, schema: { type: string, format: date } }
        - { name: to,     in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DoctorAppointment' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /doctor/appointments/{id}:
    get:
      tags: [doctor-mvp]
      summary: Get an appointment
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DoctorAppointment' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /doctor/appointments/{appointmentId}/status:
    post:
      tags: [doctor-mvp]
      summary: Update appointment status
      parameters:
        - { name: appointmentId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAppointmentStatusRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAppointmentStatusResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /doctor/appointments/{appointmentId}/notes:
    get:
      tags: [doctor-mvp]
      summary: Get the SOAP note for an appointment
      parameters: [{ name: appointmentId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SoapNote' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [doctor-mvp]
      summary: Save (create/update) the SOAP note for an appointment
      parameters:
        - { name: appointmentId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaveSoapNoteRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SoapNote' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /doctor/appointments/{appointmentId}/hmo-eligibility:
    get:
      tags: [doctor-mvp]
      summary: Check HMO eligibility for an appointment
      parameters: [{ name: appointmentId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HmoEligibility' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /doctor/patients/{patientId}:
    get:
      tags: [doctor-mvp]
      summary: Get patient medical profile
      parameters: [{ name: patientId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PatientMedicalProfile' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /doctor/chat/threads:
    get:
      tags: [doctor-mvp]
      summary: List chat threads
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChatThread' } } } } }
