  # Profile & Verification — Section B (doctor.profile.api.ts)
  # ════════════════════════════════════════════════════════════════════════════
  /doctor/profile/draft:
    get: { tags: [doctor-profile], summary: Get the profile draft, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Generic' } } } } } }
    put:
      tags: [doctor-profile]
      summary: Save the profile draft (patch merge)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Generic' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Generic' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /doctor/uploads/presign:
    post:
      tags: [doctor-profile]
      summary: Issue a backend-owned presigned Cloudflare R2 PUT URL for a binary upload
      description: >-
        Returns a short-lived presigned R2 PUT URL plus a server-chosen object key.
        The client PUTs the binary directly to R2 (with the exact returned Content-Type),
        then records metadata via the matching endpoint (profile photo / document /
        licence renewal / chat attachment / dispute evidence). Returns 503 when R2 is
        not configured. Covers uploadProfilePhoto, uploadDocument, renewLicence,
        sendAttachment, uploadDisputeEvidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, fileName, contentType]
              properties:
                kind: { type: string, enum: [profile_photo, document, licence, chat_attachment, dispute_evidence] }
                fileName: { type: string, description: Used only for its file extension }
                contentType: { type: string, description: 'Bound into the signature; the PUT must send exactly this' }
      responses:
        '200':
          description: Presigned upload URL issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      uploadUrl: { type: string }
                      objectKey: { type: string }
                      bucket: { type: string }
                      contentType: { type: string }
                      expiresIn: { type: integer }
                      method: { type: string, enum: [PUT] }
        '400': { description: Invalid kind / content type / extension }
        '503': { description: Uploads not configured (R2 credentials absent) }
  /doctor/profile/documents:
    get: { tags: [doctor-profile], summary: List profile document slots, responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Generic' } } } } } } }
    post:
      tags: [doctor-profile]
      summary: Upload a profile document
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Generic' } } } }
      responses: { '201': { description: Uploaded, content: { application/json: { schema: { $ref: '#/components/schemas/Generic' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /doctor/profile/photo:
    post:
      tags: [doctor-profile]
      summary: Upload the profile photo
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Generic' } } } }
