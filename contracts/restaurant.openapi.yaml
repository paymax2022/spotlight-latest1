openapi: 3.0.3
info:
  title: Paymax × Spotlight Restaurant / Delivery API (drift-closing fragment)
  version: 1.0.0
  description: >
    Standalone OpenAPI fragment documenting the live Restaurant & Delivery
    endpoints served by the Go backend (Gin) under /api/finance/restaurant.
    Handler signatures live in backend/internal/finance/restaurant/*_handler.go.

    All monetary amounts are integers in minor units (kobo). Every financial
    mutation that escrows, settles, or refunds (place order, cancel+refund, rate
    with tip) MUST carry an `Idempotency-Key` header (prevents duplicate retries /
    double charge), posts balanced double-entry ledger entries via the shared
    settlement service, and emits an audit event. Endpoints that require the key
    are marked below with the `IdempotencyKey` parameter; read-only GETs and
    non-money mutations omit it.

    Auth: every route requires a Bearer JWT (bearerAuth). Routes resolve the
    caller's role (customer / restaurant operator / rider) from the auth context.

    Order state machine:
      placed → accepted → preparing → ready → (assigned → picked_up → delivered)
    with branches: cancelled, refunded, no_rider. Cancellation refunds the
    customer's escrow; delivery settles the restaurant and rider splits.

    NOTE: This fragment is kept SEPARATE to avoid clobbering the large master
    contract. Merge these `paths:` and `components:` into the master
    `contracts/openapi.yaml` when integrating. Same style/auth/component
    conventions as contracts/transport.openapi.yaml and
    contracts/voting.openapi.yaml.

    NOTE: GET /orders/{orderId}/ws is a WebSocket upgrade endpoint, NOT a REST
    resource. It responds 101 Switching Protocols and then streams JSON frames
    of type `order.status` | `order.location` | `order.message`. It is documented
    here for completeness but is not callable as a normal request/response op.

servers:
  - url: /api/finance/restaurant
    description: Go backend (Gin) — restaurant / delivery module
  - url: /api/restaurant/admin
    description: >
      Operator surface, mounted on a DIFFERENT root and fail-closed behind RBAC.
      Paths documented against it are prefixed `x-admin:` in their description.

security:
  - bearerAuth: []

tags:
  - name: customer
    description: Customer-facing browse / order / chat / rate endpoints
  - name: restaurant
    description: Restaurant-operator endpoints (create restaurant, menu, fulfil orders)
  - name: rider
    description: Rider / courier endpoints (offers, accept, location, active)
  - name: admin
    description: >
      Platform-operator surfaces under /api/restaurant/admin, fail-closed behind
      RBAC (restaurant.manage / restaurant.admin.*). NOT reachable on the member
      root above.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: Globally unique key per financial mutation (prevents duplicate retries / double charge).
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Restaurant id.
    OrderIdParam:
      name: orderId
      in: path
      required: true
      schema: { type: string }
      description: Order id.
    ItemIdParam:
      name: itemId
      in: path
      required: true
      schema: { type: string }
      description: Menu item id.
    CategoryIdParam:
      name: categoryId
      in: path
      required: true
      schema: { type: string }
      description: Menu category id.
  schemas:
    Money: { type: integer, format: int64, description: Amount in kobo (minor units) }
    Error:
      type: object
      properties:
        error: { type: string }
    OrderStatus:
      description: >
        Order lifecycle state. Identical to AdminOrderStatus — the member and
        admin surfaces read the same `orders.status` column, so there is one
        vocabulary, not two.


        This enum previously read
        `[placed, accepted, preparing, ready, assigned, picked_up, delivered, cancelled, refunded, no_rider]`,
        which was the ADMIN CONSOLE's invented list, not the column's. Five of
        those values — placed, accepted, assigned, refunded, no_rider — are
        rejected outright by the `orders_status_check` CHECK constraint, so the
        contract was documenting states no order can ever be in, while five real
        ones (pending, confirmed, rejected, dispatch_failed, delivery_failed)
        went undocumented.
      allOf:
        - $ref: '#/components/schemas/AdminOrderStatus'
    Restaurant:
      type: object
      properties:
        id: { type: string }
        owner_id: { type: string }
        name: { type: string }
        description: { type: string }
        address: { type: string }
        phone: { type: string }
        cuisine: { type: string }
        image_url: { type: string }
        is_open: { type: boolean }
        rating: { type: number, description: Average restaurant star rating }
        rating_count: { type: integer }
        created_at: { type: string, format: date-time }
        min_order_kobo: { $ref: '#/components/schemas/Money' }
        packaging_fee_kobo: { $ref: '#/components/schemas/Money' }
        prep_time_minutes: { type: integer, description: "Kitchen prep time; the client's ETA is derived from it." }
        geo_lat: { type: number }
        geo_lng: { type: number }
        has_promo:
          type: boolean
          description: >
            True when the restaurant has an offer that is live right now. Only the
            flag is exposed, never the offer's terms — a discount is validated and
            priced server-side at order placement.
    RestaurantPage:
      type: object
      description: One page of the discovery list plus the totals a client needs to keep paging.
      properties:
        restaurants: { type: array, items: { $ref: '#/components/schemas/Restaurant' } }
        total: { type: integer, description: 'Restaurants matching the filters — not just the returned page.' }
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
    AdminRestaurantRow:
      description: >
        A register row: the public Restaurant plus the operational columns the
        storefront never exposes.
      allOf:
        - $ref: '#/components/schemas/Restaurant'
        - type: object
          properties:
            kyb_status: { type: string }
            listing_review_status: { type: string, enum: [DRAFT, PENDING_REVIEW, APPROVED, CHANGES_REQUESTED, REJECTED] }
            listing_review_reason: { type: string }
            updated_at: { type: string, format: date-time }
            menu_item_count: { type: integer }
    AdminRestaurantPage:
      type: object
      properties:
        restaurants: { type: array, items: { $ref: '#/components/schemas/AdminRestaurantRow' } }
        total: { type: integer, description: 'Rows matching the current filters.' }
        open_total: { type: integer, description: 'How many of those are open.' }
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
    AdminOrderStatus:
      type: string
      description: >
        The authoritative order vocabulary, mirroring the `orders_status_check`
        CHECK constraint on `orders.status` (and `restaurant.AdminOrderStatuses`
        in Go).


        This is NOT the legacy `OrderStatus` enum above. The admin console had
        invented its own list — `placed`, `accepted`, `assigned`, `refunded`,
        `no_rider` — none of which are values this column can hold, so five of its
        ten filter chips could never match a row, while five real states
        (`pending`, `confirmed`, `rejected`, `dispatch_failed`, `delivery_failed`)
        had no chip at all. An unrecognised `?status=` is rejected with a 400.
      enum: [pending, confirmed, preparing, ready, picked_up, delivered, cancelled, rejected, dispatch_failed, delivery_failed]
    AdminRider:
      type: object
      description: One courier on the dispatch roster, from the shared transport `drivers` pool.
      properties:
        id: { type: string, format: uuid, description: 'drivers.user_id — the same id carried on orders.rider_id.' }
        name: { type: string }
        phone: { type: string }
        vehicle: { type: string, enum: [bike, car, foot] }
        status: { type: string, enum: [available, on_delivery, offline, suspended], description: 'Derived from the driver status, verification state, and whether a non-terminal order is held.' }
        active_order_id: { type: string, format: uuid, description: 'The non-terminal order this rider is carrying, if any.' }
        lat: { type: number }
        lng: { type: number }
        rating: { type: number }
        last_seen_at: { type: string, format: date-time }
    AdminRiderPage:
      type: object
      description: One page of the rider roster plus counts over the whole filtered set.
      properties:
        riders: { type: array, items: { $ref: '#/components/schemas/AdminRider' } }
        total: { type: integer, description: 'Riders matching the current filters — not just the returned page.' }
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
        status_counts:
          type: object
          additionalProperties: { type: integer }
          description: >
            Every rider status and its count under the current filters EXCLUDING the
            status filter itself, so the tabs show what selecting them would yield.
            Statuses with no matching riders are present with a 0. Returned because a
            console that counts the page it rendered reports "available among the 25 on
            screen" while appearing to report the platform.
    AdminDispatchPage:
      type: object
      description: One page of the dispatch queue plus aggregates over the whole filtered set.
      properties:
        orders: { type: array, items: { $ref: '#/components/schemas/AdminDispatchOrder' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
        dispatch_counts:
          type: object
          additionalProperties: { type: integer }
          description: 'Every dispatch_status and its count under the current filters excluding the dispatch filter itself.'
        stalled_total: { type: integer, description: 'Orders still searching past the threshold, counted over the whole filtered set.' }
        stalled_after_minutes:
          type: integer
          description: >
            The SERVER's stall threshold, in minutes. Returned so the console renders
            this number rather than keeping its own copy to drift out of sync with the
            filter the server actually applies.
    AdminDispatchOrder:
      type: object
      description: An order awaiting or undergoing courier dispatch.
      properties:
        id: { type: string, format: uuid }
        restaurant_id: { type: string, format: uuid }
        restaurant_name: { type: string }
        status: { $ref: '#/components/schemas/AdminOrderStatus' }
        dispatch_status:
          type: string
          enum: [none, searching, assigned, delivered]
          description: >
            Courier-sourcing state — what this board is actually about. The query
            filtered on this column but never projected it, so the console could not
            tell "ready, nobody looking yet" from "actively searching" from "assigned",
            and its own type declared a field the server never sent.
        rider_id: { type: string, format: uuid, description: 'The rider who ACCEPTED, if any.' }
        rider_name: { type: string }
        rider_candidate_id: { type: string, format: uuid, description: 'A rider this order was OFFERED to who has not accepted yet. Without it an offer in flight looks identical to no offer at all.' }
        dispatch_attempts: { type: integer, description: 'How many sourcing rounds have run.' }
        first_offered_at: { type: string, format: date-time }
        delivery_address: { type: string }
        total_kobo: { $ref: '#/components/schemas/Money' }
        delivery_fee_kobo: { $ref: '#/components/schemas/Money' }
        ready_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        waiting_minutes: { type: integer, description: 'Minutes since ready_at, or since created_at when the kitchen has not marked it ready.' }
    AdminOrderRow:
      type: object
      description: >
        One row of the platform-wide feed: the order, plus the restaurant and rider
        names an operator would otherwise need a second lookup to resolve. All
        money is integer kobo and is a display-only projection of what was already
        charged — this endpoint posts no ledger entries and moves no money.
      properties:
        id: { type: string, format: uuid, description: Order id. }
        restaurant_id: { type: string, format: uuid, description: Restaurant that received the order. }
        restaurant_name: { type: string, description: 'Joined from restaurants.name so the console need not resolve ids.' }
        customer_id: { type: string, format: uuid, description: User who placed the order. }
        rider_id: { type: string, format: uuid, nullable: true, description: 'Assigned rider; absent while the order is unassigned.' }
        rider_name: { type: string, nullable: true, description: 'Joined from drivers.name for the assigned rider; absent when unassigned.' }
        status: { $ref: '#/components/schemas/AdminOrderStatus' }
        dispatch_status:
          type: string
          enum: [none, searching, assigned, delivered]
          description: 'Courier-side state, independent of the order status. NULL in the database is projected as `none`.'
        status_reason: { type: string, nullable: true, description: 'Operator-visible why for a rejected or failed order.' }
        item_count: { type: integer, description: 'SUM(order_items.quantity) — the number of things being delivered, not the number of distinct lines.' }
        subtotal_kobo: { $ref: '#/components/schemas/Money' }
        delivery_fee_kobo: { $ref: '#/components/schemas/Money' }
        service_fee_kobo: { $ref: '#/components/schemas/Money' }
        packaging_fee_kobo: { $ref: '#/components/schemas/Money' }
        surge_kobo: { $ref: '#/components/schemas/Money' }
        tip_kobo: { $ref: '#/components/schemas/Money' }
        discount_kobo: { $ref: '#/components/schemas/Money' }
        total_kobo: { $ref: '#/components/schemas/Money' }
        delivery_address: { type: string, description: Destination address as captured at placement. }
        created_at: { type: string, format: date-time, description: When the order was placed. }
        updated_at: { type: string, format: date-time, description: Last state change. }
        ready_at: { type: string, format: date-time, nullable: true, description: When the kitchen marked it ready. }
        delivered_at: { type: string, format: date-time, nullable: true, description: When delivery completed. }
        disputed_at: { type: string, format: date-time, nullable: true, description: When a dispute was raised against this order. }
        age_minutes:
          type: integer
          description: >
            How long the order has been open, computed server-side so every
            operator's console agrees regardless of clock skew. Zero once the order
            reaches a terminal state — a delivered order is not waiting.
    AdminOrderPage:
      type: object
      description: >
        One page of the feed plus aggregates computed over the WHOLE filtered set.


        The aggregates are returned here rather than summed by the client because
        the console's KPI tiles used to count the array they held: once the feed is
        paged, "active orders" would have meant "active orders among the 25
        currently on screen".
      properties:
        orders: { type: array, items: { $ref: '#/components/schemas/AdminOrderRow' }, description: The requested page of rows. }
        total: { type: integer, description: 'Orders matching the full filter set (status included) — the basis for paging arithmetic.' }
        limit: { type: integer, description: Page size actually applied after clamping. }
        offset: { type: integer, description: Page offset actually applied. }
        has_more: { type: boolean, description: True when offset + returned rows is still short of total. }
        status_counts:
          type: object
          additionalProperties: { type: integer }
          description: >
            Every status and its count under the current filters EXCLUDING the
            status filter itself, so the status tabs keep showing what selecting
            them would yield instead of collapsing to the one in effect. Statuses
            with no matching rows are present with a 0, never absent.
        active_total: { type: integer, description: 'Sum of status_counts over the pre-terminal states (pending, confirmed, preparing, ready, picked_up).' }
        gross_delivered_kobo: { $ref: '#/components/schemas/Money' }
    MenuCategory:
      type: object
      properties:
        id: { type: string }
        restaurant_id: { type: string }
        name: { type: string }
        sort_order: { type: integer }
    MenuItem:
      type: object
      properties:
        id: { type: string }
        restaurant_id: { type: string }
        category_id: { type: string }
        name: { type: string }
        description: { type: string }
        price_kobo: { $ref: '#/components/schemas/Money' }
        image_url: { type: string }
        available:
          type: boolean
          description: "false = 86'd (out of stock / unavailable)."
        created_at: { type: string, format: date-time }
    OrderItem:
      type: object
      properties:
        item_id: { type: string }
        name: { type: string }
        unit_price_kobo: { $ref: '#/components/schemas/Money' }
        quantity: { type: integer }
        notes: { type: string }
        modifiers_kobo:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: >-
            Per-unit surcharge from the chosen modifiers. The line's subtotal is
            (unit_price_kobo + modifiers_kobo) × quantity.
        modifiers:
          type: array
          description: >-
            Immutable snapshot of the options chosen on this line, with the name and
            price delta as they were at order time — a later menu edit never rewrites
            what the customer was charged.
          items:
            type: object
            properties:
              modifier_id: { type: string }
              name: { type: string }
              price_delta_kobo: { $ref: '#/components/schemas/Money' }
    Order:
      type: object
      properties:
        id: { type: string }
        restaurant_id: { type: string }
        restaurant_name: { type: string }
        customer_id: { type: string }
        rider_id: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/OrderStatus' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        subtotal_kobo: { $ref: '#/components/schemas/Money' }
        delivery_fee_kobo: { $ref: '#/components/schemas/Money' }
        surge_kobo:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: >-
            Peak dynamic pricing added to the item subtotal from the restaurant's
            surge_bp at order time. It sits INSIDE the settlement gross, so it splits
            80/10/10 like any other food revenue.
        service_fee_kobo:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: >-
            Platform service fee from the restaurant's service_fee_bp at order time,
            charged on the surged item subtotal. Escrowed on top of the gross and paid
            100% to the platform at settlement (the mirror of a rider tip), so neither
            the restaurant nor the rider takes a cut of it. Both knobs are snapshotted
            at placement — a later config change never reprices an existing order.
        tip_kobo:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: >-
            Rider tip, escrowed with the order total and paid 100% to the rider at
            settlement (the 80/10/10 percentages price total − tip).
        discount_kobo:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: >-
            Promo discount applied at placement and already deducted from total_kobo.
            At settlement the pre-discount gross is reconstructed and the discount is
            charged wholly to promo_funder; the other parties settle on the full gross.
        promo_id:
          type: string
          nullable: true
          description: The promo that was applied, or null when no code was used.
        promo_funder:
          type: string
          nullable: true
          enum: [platform, restaurant]
          description: >-
            Snapshot of who bore the discount, taken at placement. Later edits to the
            promo never move who paid for an order that has already settled its terms.
        total_kobo: { $ref: '#/components/schemas/Money' }
        special_instructions:
          type: string
          nullable: true
          description: >-
            Customer's free-text order note, sanitized server-side (control characters
            stripped, whitespace collapsed, capped at 500 characters). Null when none
            was given.
        scheduled_for:
          type: string
          format: date-time
          nullable: true
          description: >-
            The future slot this order was booked for, or null for an immediate order.
            While set the order waits in `pending`; at the slot the sweeper either
            clears this field (releasing it into the live queue) or cancels and refunds
            it if the restaurant is closed.
        delivery_address: { type: string }
        delivery_lat: { type: number }
        delivery_lng: { type: number }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrderMessage:
      type: object
      properties:
        id: { type: string }
        order_id: { type: string }
        sender_id: { type: string }
        sender_role: { type: string, enum: [customer, restaurant, rider] }
        body: { type: string }
        attachment_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    Rating:
      type: object
      properties:
        order_id: { type: string }
        restaurant_stars: { type: integer, minimum: 1, maximum: 5 }
        rider_stars: { type: integer, minimum: 1, maximum: 5, nullable: true }
        comment: { type: string, nullable: true }

paths:
  # ═══════════════════════════════════════════════════════════════════════════
  # RESTAURANTS & MENU
  # ═══════════════════════════════════════════════════════════════════════════
  /:
    post:
      tags: [restaurant]
      summary: Create a restaurant (operator)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Restaurant' }
      responses:
        '200': { description: Restaurant created, content: { application/json: { schema: { $ref: '#/components/schemas/Restaurant' } } } }
        '401': { description: Not authenticated }
    get:
      tags: [customer]
      summary: Browse open restaurants (paged)
      description: >
        Customer discovery. Only OPEN restaurants, and — when listing moderation is
        enabled — only APPROVED listings. Every filter is applied in SQL BEFORE the
        page is cut, so a client must not narrow the result locally: that would hide
        matches sitting on a later page.


        Operators must NOT use this endpoint to enumerate restaurants; it cannot see
        closed or unreviewed shops. Use GET /api/restaurant/admin/restaurants.
      parameters:
        - { name: cuisine, in: query, schema: { type: string }, description: 'Exact (case-insensitive) cuisine tag. "all" or omitted = no filter.' }
        - { name: q, in: query, schema: { type: string }, description: 'Free-text search over name, description and cuisine.' }
        - { name: promo, in: query, schema: { type: string, enum: ['1', 'true'] }, description: 'Keep only restaurants running a live offer.' }
        - { name: sort, in: query, schema: { type: string, enum: [newest, rating, name, eta], default: newest }, description: 'eta sorts by kitchen prep time.' }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 }, description: 'Page size.' }
        - { name: offset, in: query, schema: { type: integer, default: 0 }, description: 'Page offset. Page with the offset the server reports, never a locally accumulated count.' }
      responses:
        '200':
          description: One page of open restaurants
          content: { application/json: { schema: { $ref: '#/components/schemas/RestaurantPage' } } }
        '401': { description: Not authenticated }
  /{id}:
    get:
      tags: [customer]
      summary: Restaurant detail + full menu (categories and items)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: Restaurant detail with menu
          content:
            application/json:
              schema:
                type: object
                properties:
                  restaurant: { $ref: '#/components/schemas/Restaurant' }
                  categories: { type: array, items: { $ref: '#/components/schemas/MenuCategory' } }
                  items: { type: array, items: { $ref: '#/components/schemas/MenuItem' } }
        '401': { description: Not authenticated }
        '404': { description: Not found }
    patch:
      tags: [restaurant]
      summary: Update store profile (operator)
      description: Owner-only partial update of name/description/address/logo_url (unset fields are left unchanged; changing the address re-geocodes the pin).
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                address: { type: string }
                logo_url: { type: string }
      responses:
        '200': { description: Updated store, content: { application/json: { schema: { $ref: '#/components/schemas/Restaurant' } } } }
        '401': { description: Not authenticated }
        '403': { description: Not the restaurant owner }
        '404': { description: Not found }
  /{id}/availability:
    patch:
      tags: [restaurant]
      summary: Open or close the store (operator)
      description: Owner-only operational open/close switch. Eligibility/KYC gating is handled upstream by the merchant-onboarding engine.
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_open]
              properties:
                is_open: { type: boolean }
      responses:
        '200': { description: Updated store, content: { application/json: { schema: { $ref: '#/components/schemas/Restaurant' } } } }
        '400': { description: is_open is required }
        '401': { description: Not authenticated }
        '403': { description: Not the restaurant owner }
  /mine:
    get:
      tags: [restaurant]
      summary: List the caller's own stores (operator)
      description: The stores owned by the authenticated caller, newest first.
      responses:
        '200':
          description: The caller's stores
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Restaurant' } }
        '401': { description: Not authenticated }
  /earnings:
    get:
      tags: [restaurant]
      summary: Merchant earnings summary (operator)
      description: >
        Owner-scoped, read-only. Projects the payout/settlement tables — moves no
        money. Paid-out is the net of PAID payout runs; pending is settled provider
        shares not yet claimed by a payout line (what the next run would disburse).
      responses:
        '200':
          description: Earnings summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      paid_out_kobo: { $ref: '#/components/schemas/Money' }
                      pending_kobo: { $ref: '#/components/schemas/Money' }
                      runs:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            period_key: { type: string }
                            net_kobo: { $ref: '#/components/schemas/Money' }
                            status: { type: string, enum: [draft, processing, paid, failed] }
                            processed_at: { type: string, format: date-time, nullable: true }
        '401': { description: Not authenticated }
  /{id}/menu/categories:
    post:
      tags: [restaurant]
      summary: Create a menu category
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuCategory' }
      responses:
        '200': { description: Category created, content: { application/json: { schema: { $ref: '#/components/schemas/MenuCategory' } } } }
        '401': { description: Not authenticated }
        '403': { description: Not the restaurant owner }
  /{id}/menu/categories/{categoryId}:
    delete:
      tags: [restaurant]
      summary: Delete an empty menu category (operator)
      description: Blocked (403) while the category still has items — remove them first.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/CategoryIdParam' }
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean } } } } } }
        '401': { description: Not authenticated }
        '403': { description: Not the restaurant owner / category not empty }
        '404': { description: Category not found }
  /{id}/menu/items:
    post:
      tags: [restaurant]
      summary: Create a menu item
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuItem' }
      responses:
        '200': { description: Item created, content: { application/json: { schema: { $ref: '#/components/schemas/MenuItem' } } } }
        '401': { description: Not authenticated }
        '403': { description: Not the restaurant owner }
  /{id}/menu/items/{itemId}:
    patch:
      tags: [restaurant]
      summary: Update a menu item (price / 86-availability)
      description: Patch price_kobo and/or available (false = 86'd / out of stock).
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/ItemIdParam' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                price_kobo: { $ref: '#/components/schemas/Money' }
                available: { type: boolean }
      responses:
        '200': { description: Updated item, content: { application/json: { schema: { $ref: '#/components/schemas/MenuItem' } } } }
        '401': { description: Not authenticated }
        '403': { description: Not the restaurant owner }
        '404': { description: Item not found }
    delete:
      tags: [restaurant]
      summary: Delete a menu item (operator)
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/ItemIdParam' }
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean } } } } } }
        '401': { description: Not authenticated }
        '403': { description: Not the restaurant owner }
        '404': { description: Item not found }

  # ═══════════════════════════════════════════════════════════════════════════
  # ORDERS
  # ═══════════════════════════════════════════════════════════════════════════
  /{id}/orders:
    post:
      tags: [customer]
      summary: Place an order (escrows total) — money mutation
      description: >-
        Money mutation — escrows the order total and posts balanced ledger entries.
        Requires an Idempotency-Key. The escrow debits the customer's wallet, so it is
        gated fail-closed on the caller's KYC tier: a Tier 0 customer (wallet disabled)
        and an order that would take the caller past their daily wallet debit cap are
        both refused with 403 BEFORE any money moves. The gate prices the FULL escrowed
        total (subtotal + delivery + tip), and a refused order creates no ledger entry,
        no settlement and no order row.


        Idempotency: a repeat of an Idempotency-Key this caller already used returns that
        original order and moves no money — the request body is NOT re-read, so replaying
        a key with a different body returns the original order rather than placing the new
        one. Keys are scoped per caller: replaying another customer's key does not resolve
        to their order.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      item_id: { type: string }
                      quantity: { type: integer }
                      notes: { type: string }
                      modifier_ids:
                        type: array
                        items: { type: string }
                        description: >-
                          Chosen menu_modifiers for this line. Validated fail-closed
                          against the item's own modifier groups — an unknown or
                          unavailable option, a duplicate, or a group whose
                          required/min_select/max_select rule is broken rejects the
                          whole order with 400, before anything is escrowed. Each
                          chosen option adds its price_delta_kobo per unit.
                delivery_address: { type: string }
                delivery_lat: { type: number }
                delivery_lng: { type: number }
                tip_kobo:
                  type: integer
                  format: int64
                  minimum: 0
                  description: >-
                    Optional rider tip in whole kobo. Escrowed with the order total and
                    paid 100% to the rider at settlement. A negative value is clamped to
                    0; a tip greater than the order's own value (subtotal + delivery) is
                    rejected.
                promo_code:
                  type: string
                  description: >-
                    Optional discount code, matched case-insensitively against this
                    restaurant's promos and platform-wide ones. The discount is deducted
                    from the escrowed total, snapshotted onto the order
                    (discount_kobo / promo_id / promo_funder) and a redemption is
                    recorded so usage_limit / per_user_limit are enforced.


                    A code that cannot be applied FAILS the order with 422 — it is never
                    silently ignored, which would charge the customer full price. Reasons:
                    unknown code, inactive or outside its window, order below the promo's
                    minimum, usage limit reached, the discount rounds to zero, or the
                    discount exceeds what the declared funder's settlement share can bear.
                special_instructions:
                  type: string
                  maxLength: 500
                  description: >-
                    Free-text note for the kitchen and the rider. Sanitized server-side
                    rather than rejected: control characters are stripped, whitespace runs
                    collapsed, and the result is trimmed to 500 characters.
                scheduled_for:
                  type: string
                  format: date-time
                  description: >-
                    Book the order for a future slot. The slot must be at least 15 minutes
                    ahead, at most 7 days out, and — when the restaurant has weekly hours
                    configured — fall inside an opening window; otherwise the order is
                    rejected before anything is escrowed.


                    Scheduling defers the kitchen, not the money: the total is escrowed at
                    placement. A scheduled order MAY be placed while the restaurant is
                    currently closed (the slot, not the switch, is what is checked). If the
                    restaurant is still closed when the slot arrives, the order is
                    automatically cancelled and refunded in full.
      responses:
        '201': { description: Order placed (also returned for an idempotent replay of the same Idempotency-Key), content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '400': { description: "Malformed cart — missing item_id/quantity, or an invalid modifier selection" }
        '401': { description: Not authenticated }
        '402': { description: Insufficient wallet balance }
        '403': { description: KYC tier forbids this debit — wallet disabled (Tier 0) or daily debit limit exceeded }
        '422': { description: Item unavailable (86'd) / promo code cannot be applied / validation error }
        '503': { description: Tier gate not wired on this deployment — ordering is disabled fail-closed }
  /orders/{orderId}:
    get:
      tags: [customer, restaurant, rider]
      summary: Get an order by id
      parameters: [{ $ref: '#/components/parameters/OrderIdParam' }]
      responses:
        '200': { description: Order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '401': { description: Not authenticated }
        '404': { description: Not found }
  /orders:
    get:
      tags: [customer, restaurant, rider]
      summary: List orders for the caller in a given role
      parameters:
        - name: role
          in: query
          required: true
          schema: { type: string, enum: [customer, restaurant, rider] }
          description: Which side of the order to list for the authenticated user.
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
      responses:
        '200':
          description: Order list
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Order' } } } }
        '401': { description: Not authenticated }
  /{id}/orders/{orderId}/status:
    patch:
      tags: [restaurant]
      summary: Advance order status (accepted → preparing → ready)
      description: Restaurant operator advances the fulfilment state machine. Delivery settlement is triggered downstream on delivered.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/OrderIdParam' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200': { description: Updated order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '401': { description: Not authenticated }
        '403': { description: Not the restaurant owner }
        '422': { description: Illegal state transition }
  /{id}/orders/{orderId}:
    delete:
      tags: [customer, restaurant]
      summary: Cancel an order (refunds escrow) — money mutation
      description: Money mutation — cancels the order and refunds the customer's escrow per policy. Requires an Idempotency-Key.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/OrderIdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Cancelled (refunded) order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '401': { description: Not authenticated }
        '422': { description: Not cancellable in current state }

  # ═══════════════════════════════════════════════════════════════════════════
  # RIDER
  # ═══════════════════════════════════════════════════════════════════════════
  /orders/{orderId}/assign:
    post:
      tags: [rider, restaurant]
      summary: Offer / assign an order to a rider
      parameters: [{ $ref: '#/components/parameters/OrderIdParam' }]
      responses:
        '200': { description: Order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '401': { description: Not authenticated }
  /orders/{orderId}/accept:
    post:
      tags: [rider]
      summary: Rider accepts a delivery offer (binds rider to order)
      parameters: [{ $ref: '#/components/parameters/OrderIdParam' }]
      responses:
        '200': { description: Order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '401': { description: Not authenticated }
        '409': { description: Offer already taken }
  /orders/{orderId}/location:
    post:
      tags: [rider]
      summary: Rider posts a GPS location for live tracking
      description: Fanned out to customer via the order WebSocket as an `order.location` frame.
      parameters: [{ $ref: '#/components/parameters/OrderIdParam' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }
      responses:
        '200': { description: Accepted }
        '401': { description: Not authenticated }
  /rider/offers:
    get:
      tags: [rider]
      summary: List open delivery offers for the rider
      responses:
        '200':
          description: Offers
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Order' } } } }
        '401': { description: Not authenticated }
  /rider/active:
    get:
      tags: [rider]
      summary: The rider's active delivery (or null)
      responses:
        '200': { description: Active order or null, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '401': { description: Not authenticated }

  # ═══════════════════════════════════════════════════════════════════════════
  # CHAT
  # ═══════════════════════════════════════════════════════════════════════════
  /orders/{orderId}/messages:
    get:
      tags: [customer, restaurant, rider]
      summary: List chat messages on an order
      parameters: [{ $ref: '#/components/parameters/OrderIdParam' }]
      responses:
        '200':
          description: Messages
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OrderMessage' } } } }
        '401': { description: Not authenticated }
    post:
      tags: [customer, restaurant, rider]
      summary: Post a chat message on an order
      description: Fanned out to other participants via the order WebSocket as an `order.message` frame.
      parameters: [{ $ref: '#/components/parameters/OrderIdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                attachmentUrl: { type: string }
      responses:
        '200': { description: Message created, content: { application/json: { schema: { $ref: '#/components/schemas/OrderMessage' } } } }
        '401': { description: Not authenticated }
        '403': { description: Not a participant on this order }

  # ═══════════════════════════════════════════════════════════════════════════
  # RATINGS
  # ═══════════════════════════════════════════════════════════════════════════
  /orders/{orderId}/rate:
    post:
      tags: [customer]
      summary: Rate a delivered order (restaurant + optional rider)
      description: >
        Rates the restaurant (and optionally the rider) on a delivered order.
        If a tip is included downstream this becomes a money mutation; the
        Idempotency-Key is required to keep rating idempotent.
      parameters:
        - { $ref: '#/components/parameters/OrderIdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [restaurant_stars]
              properties:
                restaurant_stars: { type: integer, minimum: 1, maximum: 5 }
                rider_stars: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        '200': { description: Rating, content: { application/json: { schema: { $ref: '#/components/schemas/Rating' } } } }
        '401': { description: Not authenticated }
        '403': { description: Not the customer / order not delivered }

  # ═══════════════════════════════════════════════════════════════════════════
  # REALTIME (WebSocket — NOT a REST endpoint)
  # ═══════════════════════════════════════════════════════════════════════════
  /orders/{orderId}/ws:
    get:
      tags: [customer, restaurant, rider]
      summary: Real-time order tracking WebSocket
      description: >
        Upgrades to a WebSocket (NOT a REST request/response). After the 101
        upgrade the server streams JSON frames of type `order.status`,
        `order.location`, and `order.message` to the order's participants.
      parameters: [{ $ref: '#/components/parameters/OrderIdParam' }]
      responses:
        '101': { description: Switching Protocols (WS upgrade) }
        '401': { description: Not authenticated }
  /restaurants:
    get:
      tags: [admin]
      summary: 'x-admin: the operator restaurant register (paged)'
      description: >
        Served on the ADMIN root (`GET /api/restaurant/admin/restaurants`), fail-closed
        behind RBAC `restaurant.manage`.


        Unlike customer discovery this applies NO availability filter and NO listing
        moderation gate — every row in `restaurants` is visible, which is the point: a
        console that lists shops off the discovery endpoint cannot see the closed or
        unreviewed ones, and those are the rows an operator needs to act on.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'Free-text search over name, address and cuisine.' }
        - { name: status, in: query, schema: { type: string, enum: [open, closed, all], default: all }, description: 'Availability filter. Default shows closed shops too.' }
        - { name: review, in: query, schema: { type: string, enum: [DRAFT, PENDING_REVIEW, APPROVED, CHANGES_REQUESTED, REJECTED] }, description: 'Filter by listing_review_status.' }
        - { name: sort, in: query, schema: { type: string, enum: [newest, name, rating, updated], default: newest }, description: 'Ordering; every option ends in a unique tiebreaker so pages cannot repeat or skip rows.' }
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 200 }, description: 'Page size.' }
        - { name: offset, in: query, schema: { type: integer, default: 0 }, description: 'Page offset.' }
      responses:
        '200':
          description: One page of the register
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminRestaurantPage' } } }
        '401': { description: Not authenticated }
        '403': { description: Missing the restaurant.manage permission }
  # NOTE: keyed `/admin/orders` rather than `/orders` because the member root
  # already documents `/orders` above and both servers share one `paths:` map — a
  # second `/orders:` key is a duplicate mapping key and the file stops parsing.
  # The path-item `servers` below pins the base so the resolved URL is still
  # exactly `/api/restaurant/admin/orders`, the same surface as `/restaurants`.
  /admin/orders:
    servers:
      - url: /api/restaurant
        description: Go backend (Gin) — admin surface root for the order feed
    get:
      tags: [admin]
      summary: 'x-admin: the platform-wide order feed (paged + aggregated)'
      description: >
        Served on the ADMIN root (`GET /api/restaurant/admin/orders`), fail-closed
        behind RBAC `restaurant.manage`. Every order on the platform, joined to its
        restaurant and rider, filtered and paged in SQL.


        WHY THIS EXISTS: the ops console had no admin order feed at all. It read the
        owner-scoped MEMBER route `GET /api/finance/restaurant/orders?role=restaurant`,
        whose query is `JOIN restaurants r ON r.id = o.restaurant_id WHERE r.owner_id = $1`
        — so an operator saw the orders of restaurants they personally own, which is
        none. 2,174 orders existed and the console could see zero of them. That
        handler also ignored `?status` outright, so the filter chips did nothing even
        where rows were returned.


        READ-ONLY. It projects money (integer kobo) for display and moves none: no
        ledger entries, no state transitions, so no `Idempotency-Key` applies here.
        Order mutations keep going through the existing member / rider / dispatch
        routes.


        Aggregates (`status_counts`, `active_total`, `gross_delivered_kobo`) are
        computed over the whole filtered set with the status predicate removed, so
        the status tabs show the counts selecting them would yield.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'Free-text search over order id prefix, restaurant name and delivery address. The uuid is cast to text first, so a partial id such as `3f2a` matches.' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AdminOrderStatus' }, description: 'Exact order status; omit for any. A value outside the enum is a 400, never a silently empty page.' }
        - { name: dispatch, in: query, schema: { type: string, enum: [none, searching, assigned, delivered] }, description: 'Filter by courier dispatch_status; omit for any.' }
        - { name: restaurant_id, in: query, schema: { type: string, format: uuid }, description: Restrict the feed to one restaurant. }
        - { name: rider_id, in: query, schema: { type: string, format: uuid }, description: Restrict the feed to one rider. }
        - { name: unassigned, in: query, schema: { type: boolean, default: false }, description: 'Dispatch worklist: orders with no rider that are NOT already delivered, cancelled or rejected. An unassigned closed order is not a dispatch problem.' }
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest, total, updated], default: newest }, description: 'Ordering; every option ends in a unique `o.id` tiebreaker so pages cannot repeat or skip rows.' }
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 200 }, description: 'Page size. Values <= 0 or above the maximum fall back to the default.' }
        - { name: offset, in: query, schema: { type: integer, default: 0 }, description: 'Page offset; negative values floor at 0.' }
      responses:
        '200':
          description: One page of the platform-wide order feed plus its aggregates
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminOrderPage' } } }
        '400': { description: Unknown status filter }
        '401': { description: Not authenticated }
        '403': { description: Missing the restaurant.manage permission }
  # Dispatch-board surfaces, also on the ADMIN root. Same `/admin/...` keying and
  # `servers` override as /admin/orders above, and for the same reason: the member
  # root already owns bare `/orders`, and one duplicate mapping key stops the whole
  # file parsing.
  /admin/riders:
    servers:
      - url: /api/restaurant
        description: Go backend (Gin) — admin surface root for the dispatch board
    get:
      tags: [admin]
      summary: 'x-admin: the rider roster'
      description: >
        Couriers available to food delivery, read from the shared transport `drivers`
        pool, each with the order they are currently carrying. Fail-closed behind RBAC
        `restaurant.admin.dispatch`.


        A rider counts as on_delivery only while holding a NON-terminal order. That
        predicate used to read `status NOT IN ('delivered','cancelled')` — written
        before the lifecycle gained rejected / dispatch_failed / delivery_failed — so a
        rider whose last job ended in one of those three would have been pinned
        on_delivery forever and never offered another.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [available, on_delivery, offline, suspended] }, description: 'Filter by the derived rider status; omit for any. A value outside the enum is a 400, never a silently empty roster.' }
        - { name: vehicle, in: query, schema: { type: string, enum: [bike, car, foot] }, description: 'Filter by vehicle type.' }
        - { name: q, in: query, schema: { type: string }, description: 'Free-text search over rider name and phone.' }
        - { name: sort, in: query, schema: { type: string, enum: [recent, name, rating], default: recent }, description: 'Ordering; every option ends in a unique user_id tiebreaker so pages cannot repeat or skip riders.' }
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 200 }, description: 'Page size.' }
        - { name: offset, in: query, schema: { type: integer, default: 0 }, description: 'Page offset.' }
      responses:
        '200':
          description: One page of the rider roster plus status counts
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminRiderPage' } } }
        '400': { description: Unknown rider status filter }
        '401': { description: Not authenticated }
        '403': { description: Missing the restaurant.admin.dispatch permission }
  /admin/dispatch/queue:
    servers:
      - url: /api/restaurant
        description: Go backend (Gin) — admin surface root for the dispatch board
    get:
      tags: [admin]
      summary: 'x-admin: orders awaiting or undergoing courier dispatch'
      description: >
        Orders that still need a courier or are mid-delivery. Fail-closed behind RBAC
        `restaurant.admin.dispatch`.


        Only OPEN orders appear. The predicate previously excluded just delivered and
        cancelled, so an order that had been searching or assigned when it closed as
        rejected / dispatch_failed / delivery_failed stayed on the board permanently —
        183 of 345 rows, burying the orders a dispatcher could still act on. An order
        whose sourcing has already given up needs a refund or a dispute, not a rider.
      parameters:
        - { name: dispatch, in: query, schema: { type: string, enum: [none, searching, assigned, delivered] }, description: 'Filter by courier dispatch_status; omit for any. A value outside the enum is a 400.' }
        - { name: q, in: query, schema: { type: string }, description: 'Free-text search over order id prefix, restaurant name and delivery address.' }
        - { name: restaurant_id, in: query, schema: { type: string, format: uuid }, description: 'Restrict the queue to one restaurant.' }
        - { name: stalled, in: query, schema: { type: boolean, default: false }, description: 'Only orders still SEARCHING past stalled_after_minutes. An assigned order is not stalled however long it takes — a rider already has it.' }
        - { name: sort, in: query, schema: { type: string, enum: [waiting, newest, oldest], default: waiting }, description: 'Default is longest-waiting first: a dispatch board is worked worst-first, not newest-first.' }
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 200 }, description: 'Page size.' }
        - { name: offset, in: query, schema: { type: integer, default: 0 }, description: 'Page offset.' }
      responses:
        '200':
          description: One page of the dispatch queue plus its aggregates
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminDispatchPage' } } }
        '400': { description: Unknown dispatch status filter }
        '401': { description: Not authenticated }
        '403': { description: Missing the restaurant.admin.dispatch permission }
  /admin/orders/{id}/dispatch:
    servers:
      - url: /api/restaurant
        description: Go backend (Gin) — admin surface root for the dispatch board
    post:
      tags: [admin]
      summary: 'x-admin: re-run courier sourcing for an order'
      description: >
        Re-runs auto-dispatch for an order still looking for a rider. Fail-closed behind
        RBAC `restaurant.admin.dispatch`.


        Exists because the member route `POST /api/finance/restaurant/orders/{orderId}/dispatch`
        is OWNER-gated in its handler (`only the restaurant may re-dispatch`) and a
        platform operator is never the owner — so the ops console's Re-dispatch button
        could only ever answer 403, on the one intervention a dispatcher exists to make.
        RBAC is the boundary here, as it is for the admin store routes; the same
        idempotent DispatchOrder runs underneath, so this is not a second sourcing path.


        Restarts courier SOURCING only: `dispatch_status` returns to searching and the
        kitchen `status` is untouched.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: Order id. }
      responses:
