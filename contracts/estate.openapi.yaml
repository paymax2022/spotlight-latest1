      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Eligibility decision
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Eligibility' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: setEligibilityRules
      summary: Configure an election's voter eligibility rules (estate admin only)
      tags: [Elections]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EligibilityRules' }
      responses:
        '200':
          description: Rules saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/EligibilityRules' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

