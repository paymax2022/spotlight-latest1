        '200': { description: Resolved, content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyAlert' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Documents (Block 36) ──
  /estate/documents:
    get:
      operationId: listDocuments
      summary: List estate documents (restricted docs visible to admins only)
      tags: [Documents]
      responses:
        '200': { description: Documents, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Document' } } } } }
    post:
      operationId: createDocument
      summary: Record a document (estate admin only)
      tags: [Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, fileUrl]
              properties:
                title: { type: string }
                category: { type: string }
                fileUrl: { type: string, format: uri }
                objectKey: { type: string, description: Server-chosen R2 key returned by POST /estate/uploads/presign. Stored so the document can be served via a presigned GET. }
                restricted: { type: boolean }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /estate/documents/{id}/download-url:
    get:
      operationId: getDocumentDownloadUrl
      summary: Mint a short-lived (60-min) presigned GET URL for a document
      description: >
        Returns a presigned Cloudflare R2 GET URL valid for 60 minutes. The caller
        must be an estate member; restricted documents are admin-only. Legacy
        documents without a server-controlled object key return their stored URL
        unchanged (expiresIn=0, legacy=true). Returns 503 when R2 is not configured.
      tags: [Documents]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Presigned download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DownloadUrl' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Object storage (R2) is not configured }

  # ── Uploads (Blocks 25/28/35/39) ──
  /estate/uploads/presign:
    post:
      operationId: presignUpload
      summary: Mint a short-lived presigned R2 PUT URL for a media upload
      description: >
        Returns a presigned Cloudflare R2 PUT URL (valid 10 minutes) plus a
        server-controlled object key. The caller must be a member of the estate.
        The binary is PUT directly to R2 by the client; the API never receives it.
        The Content-Type is bound into the signature, and content type/extension
        are allowlisted (png, jpeg, webp, pdf). Returns 503 when R2 is not configured.
      tags: [Uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, fileName, contentType]
              properties:
                kind:
                  type: string
                  enum: [profile_photo, vehicle_doc, incident_evidence, repair_evidence, document]
                  description: Upload category — determines the object-key prefix.
                fileName: { type: string, description: Used only for its extension. }
                contentType:
                  type: string
                  enum: [image/png, image/jpeg, image/webp, application/pdf]
      responses:
        '200':
          description: Presigned upload URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PresignUpload' }
        '400': { description: "Unsupported kind, content type, or extension" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: Object storage (R2) is not configured }

