  /estate/vendor/jobs/{id}/start:
    post: { operationId: startVendorJob, summary: Start work (in progress), tags: [Vendors], parameters: [{ $ref: '#/components/parameters/PathId' }], responses: { '200': { description: Updated }, '400': { $ref: '#/components/responses/BadRequest' } } }
  /estate/vendor/jobs/{id}/complete:
    post: { operationId: completeVendorJob, summary: Mark the job complete, tags: [Vendors], parameters: [{ $ref: '#/components/parameters/PathId' }], responses: { '200': { description: Updated }, '400': { $ref: '#/components/responses/BadRequest' } } }
  /estate/vendor/jobs/{id}/quote:
    post:
      operationId: submitVendorQuote
      summary: Submit a quote/agreed amount for the job
      tags: [Vendors]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [amount_kobo], properties: { amount_kobo: { type: integer } } } } } }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/VendorJob' } } } } }
  /estate/vendor/jobs/{id}/invoice:
    post:
      operationId: submitVendorInvoice
      summary: Attach an invoice URL
      tags: [Vendors]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } } } } }
      responses: { '200': { description: Updated } }
  /estate/vendor/jobs/{id}/evidence:
    post:
      operationId: submitVendorEvidence
      summary: Attach completion-evidence URL
      tags: [Vendors]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } } } } }
      responses: { '200': { description: Updated } }
  /estate/vendor/jobs/{id}/payout:
    post:
      operationId: requestVendorPayout
      summary: Pay a completed job to the vendor's wallet (idempotent)
      description: Requires an Idempotency-Key header. Posts a balanced ledger entry (debit estate settlement → credit vendor wallet) and marks the job paid.
      tags: [Vendors]
      parameters:
        - { $ref: '#/components/parameters/PathId' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Paid, content: { application/json: { schema: { $ref: '#/components/schemas/VendorJob' } } } }
        '400': { description: Missing key or job not payable }
        '503': { description: Ledger not configured }

  # ── Properties (Block 29/38) ──
  /estate/properties:
    get:
      operationId: listProperties
      summary: Property directory + occupancy summary (excludes archived)
      tags: [Properties]
      responses:
        '200': { description: Properties, content: { application/json: { schema: { $ref: '#/components/schemas/PropertiesResponse' } } } }

  /estate/properties/{id}:
    get:
      operationId: getProperty
      summary: Property detail
      tags: [Properties]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200': { description: Property, content: { application/json: { schema: { $ref: '#/components/schemas/Property' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateProperty
      summary: Update property details (estate admin only)
      tags: [Properties]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                unit_label: { type: string }
                property_type: { type: string, enum: [apartment, house, commercial, land, other] }
                floor: { type: string }
                block: { type: string }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Property' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /estate/properties/{id}/landlord:
    post:
      operationId: assignLandlord
      summary: Assign a property's landlord (estate admin only)
      tags: [Properties]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [user_id], properties: { user_id: { type: string, format: uuid } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Property' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /estate/properties/{id}/tenant:
    post:
      operationId: assignTenant
      summary: Assign a property's tenant and mark it occupied (estate admin only)
      tags: [Properties]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [user_id], properties: { user_id: { type: string, format: uuid } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Property' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /estate/properties/{id}/occupancy:
    post:
      operationId: setOccupancyStatus
      summary: Set a property's occupancy status (estate admin only)
      tags: [Properties]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [vacant, occupied, reserved] } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Property' } } } }
        '400': { description: Invalid status }

  /estate/properties/{id}/archive:
    post:
      operationId: archiveProperty
      summary: Soft-retire a property (estate admin only)
      tags: [Properties]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200': { description: Archived }
        '403': { $ref: '#/components/responses/Forbidden' }

  /estate/properties/{id}/transfer-request:
    post:
      operationId: requestPropertyTransfer
      summary: File a property transfer (ownership/tenancy) request
      tags: [Properties]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_user_id, transfer_type]
              properties:
                to_user_id: { type: string, format: uuid }
                transfer_type: { type: string, enum: [ownership, tenancy] }
                reason: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyTransferRequest' } } } }
        '400': { description: Invalid request }

  /estate/properties/{id}/analytics:
    get:
      operationId: getPropertyAnalytics
      summary: Per-property analytics (estate admin only)
      tags: [Properties]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200': { description: Analytics, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyAnalytics' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /estate/property-transfers:
    get:
      operationId: listPropertyTransfers
      summary: List property transfer requests (estate admin only)
      tags: [Properties]
      responses:
        '200':
          description: Transfer requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PropertyTransferRequest' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /estate/property-transfers/{id}/review:
    post:
      operationId: reviewPropertyTransfer
      summary: Approve/reject a property transfer (estate admin only)
      tags: [Properties]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [approved, rejected] } } }
      responses:
        '200': { description: Reviewed, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyTransferRequest' } } } }
        '400': { description: Invalid decision or already reviewed }

  # ── AI notes (Block 39) ──
  /estate/ai-notes:
    get:
      operationId: listAiNotes
      summary: List AI meeting-note summaries
      tags: [AINotes]
      responses:
        '200': { description: Notes, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AiNote' } } } } }
  /estate/ai-notes/generate:
    post:
      operationId: generateAiNoteFromMeeting
      summary: Generate an AI meeting-note summary from a meeting's recorded minutes (admin only)
      description: >
        Concatenates all recorded minutes for the given meeting and produces a structured
        summary plus action items via the deterministic extractive summariser, persisting
        the result as a 'generated' note. Admin-only; 409 when no minutes exist yet.
      tags: [AINotes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meetingId]
              properties:
                meetingId: { type: string, format: uuid }
      responses:
        '201': { description: Generated, content: { application/json: { schema: { $ref: '#/components/schemas/AiNote' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: No minutes have been recorded for the meeting yet }
  /estate/meetings/{id}/ai-notes:
    post:
      operationId: generateAiNote
      summary: Generate structured minutes from a transcript via claude-sonnet-4-6 (admin only)
      description: >
        Creates a processing session, sends the transcript to the model, and stores
        the returned summary, action items and decisions. Fails closed (503) when the
        LLM is not configured; the session is marked 'failed' on any model error.
      tags: [AINotes]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transcript]
              properties:
                title: { type: string }
                transcript: { type: string, minLength: 20 }
      responses:
        '201': { description: Generated, content: { application/json: { schema: { $ref: '#/components/schemas/AiNote' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: AI note-taking is not configured }
  /estate/ai-notes/{id}:
    get:
      operationId: getAiNote
      summary: One AI-note session
      tags: [AINotes]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200': { description: Note, content: { application/json: { schema: { $ref: '#/components/schemas/AiNote' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /estate/ai-notes/{id}/approve:
    post:
      operationId: approveAiNote
      summary: Approve a completed AI-note session (admin only)
      tags: [AINotes]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200': { description: Approved }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ── Finance dashboard (Block 40) ──
  /estate/finance:
    get:
      operationId: getFinanceDashboard
      summary: Estate finance dashboard (admin only)
      tags: [Finance]
      responses:
        '200': { description: Dashboard, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceDashboard' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Admin panel (Block 41) ──
  /estate/admin/summary:
    get:
      operationId: getAdminSummary
      summary: Counts of items needing admin attention (admin only)
      tags: [EstateAdmin]
      responses:
        '200': { description: Summary, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSummary' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Notifications (Block 43) ──
  /estate/notifications:
    get:
      operationId: listNotifications
      summary: The caller's notification feed
      tags: [Notifications]
      responses:
        '200': { description: Notifications, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Notification' } } } } }
  /estate/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: Mark one notification read
      tags: [Notifications]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '204': { description: Marked read }
        '404': { $ref: '#/components/responses/NotFound' }
  /estate/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark all unread notifications read
      tags: [Notifications]
      responses:
        '204': { description: All marked read }

  # ── Reports (Block 44) ──
  /estate/reports:
    get:
      operationId: getReports
      summary: Computed estate reports (admin only)
      tags: [Reports]
      responses:
        '200': { description: Reports, content: { application/json: { schema: { $ref: '#/components/schemas/ReportsResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /estate/analytics/{type}:
    get:
      operationId: getAnalytics
      summary: Date-filtered, chart-ready analytics (estate admin only)
      description: >
        Returns a chart-ready series plus summary stats for the given analytics
        type. Window defaults to the last 30 days; override with from/to
        (YYYY-MM-DD, `to` inclusive).
      tags: [Reports]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [visitors, gate, payments, repairs, facilities, meetings, elections, security, vendors]
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200': { description: Analytics, content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsResult' } } } }
        '400': { description: Unknown analytics type }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Member settings (Block 45) ──
  /estate/settings:
    get:
      operationId: getMemberSettings
      summary: The caller's estate notification settings (defaults if unset)
      tags: [EstateSettings]
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/MemberSettings' } } } }
    patch:
      operationId: updateMemberSettings
      summary: Partially update settings (merges onto saved row)
      tags: [EstateSettings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberSettings' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/MemberSettings' } } } }

  /estate/account:
    delete:
      operationId: deleteEstateAccount
      summary: Soft-delete the caller's account — anonymises PII, keeps membership history
      description: >
        Scrubs the caller's personal data (profile bio/photo/contacts, household
        members, domestic staff, vehicles), sets profile visibility to admin_only,
        and marks the membership deleted. Auth credentials are managed by Supabase
        Auth and are not affected here. Audited.
      tags: [EstateSettings]
      responses:
        '200': { description: Account soft-deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
