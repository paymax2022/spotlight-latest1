openapi: 3.0.3
info:
  title: Paymax Connect — Phase 1 Core (profile / verification / matching / discovery / search)
  version: 1.0.0
  description: >
    Phase-1 vertical slice of Paymax Connect. All member routes sit under
    /api/v1/connect/* behind RequireAuthContext and the FeatureConnectEnabled gate
    (OFF by default). Admin routes sit under /api/connect/admin/* and require the
    relevant connect.* RBAC permission. Safety invariants enforced server-side:
    18+ age gate (Phase 0), per-mode visibility, mutual-only matches, idempotent
    likes, no plaintext verification PII, approximate (bucketed) distance only.
servers:
  - url: /api/v1/connect
    description: Member (versioned) base path
  - url: /api/connect/admin
    description: Admin base path

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: Recommended on POST /likes; uniqueness is also enforced in the DB.
  schemas:
    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        display_name: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        city: { type: string, nullable: true }
        gender: { type: string, nullable: true }
        headline: { type: string, nullable: true }
        interests: { type: array, items: { type: string } }
        preferences: { type: object, additionalProperties: true }
        age: { type: integer, description: "derived from the DOB captured at the age gate" }
        verified_badge: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      description: dob and exact geo are never serialised; only the derived age is.
    ProfilePhoto:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, description: "viewable URL (short-lived signed URL when stored in R2)" }
        moderation_status: { type: string, enum: [pending, approved, rejected] }
        sort_order: { type: integer, description: "0 is the primary photo" }
    FullProfile:
      description: The caller's own complete profile — Profile fields plus modes and photos.
      allOf:
        - $ref: '#/components/schemas/Profile'
        - type: object
          properties:
            modes: { type: array, items: { $ref: '#/components/schemas/Mode' } }
            photos: { type: array, items: { $ref: '#/components/schemas/ProfilePhoto' } }
    ProfileUpdate:
      type: object
      properties:
        display_name: { type: string }
        bio: { type: string }
        city: { type: string }
        geo_lat: { type: number, description: approximate centroid latitude }
        geo_lng: { type: number, description: approximate centroid longitude }
        gender: { type: string }
        headline: { type: string }
        interests: { type: array, items: { type: string }, description: "omit to leave unchanged; [] clears" }
        preferences: { type: object, additionalProperties: true, description: "REPLACES the stored object when present" }
    Mode:
      type: object
      properties:
        mode: { type: string, enum: [dating, friendship, professional, creator, event] }
        visible: { type: boolean }
        intent_tags: { type: array, items: { type: string } }
        privacy: { type: object, additionalProperties: true }
        updated_at: { type: string, format: date-time }
    ModeUpdate:
      type: object
      properties:
        visible: { type: boolean }
        intent_tags: { type: array, items: { type: string } }
        privacy: { type: object, additionalProperties: true }
    VerificationRecord:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        level: { type: string, enum: [l0, l1] }
        status: { type: string, enum: [none, pending, l0_passed, l1_passed, failed, rejected] }
        reason_code: { type: string }
        provider: { type: string }
        badge: { type: boolean }
        verified_at: { type: string, format: date-time, nullable: true }
        has_evidence: { type: boolean, description: whether an encrypted ref exists (never the ref itself) }
    SelfieRequest:
      type: object
      required: [selfie_ref]
      properties:
        level: { type: string, enum: [l0, l1] }
        selfie_ref: { type: string, description: opaque client upload handle }
        liveness_token: { type: string, description: sensitive transient token; never persisted or logged }
    LikeRequest:
      type: object
      required: [to_profile]
      properties:
        to_profile: { type: string, format: uuid }
        kind: { type: string, enum: [like, super], default: like }
    LikeResult:
      type: object
      properties:
        liked: { type: boolean }
        matched: { type: boolean, description: true only when a mutual like created/exists }
        match_id: { type: string, format: uuid }
        kind: { type: string }
        replayed: { type: boolean, description: true on idempotent duplicate (no-op) }
    Match:
      type: object
      properties:
        id: { type: string, format: uuid }
        other_profile_id: { type: string, format: uuid }
        other_display_name: { type: string, nullable: true }
        status: { type: string, enum: [matched, unmatched, blocked] }
        reason: { type: object, additionalProperties: true, description: match-reason card }
        matched_at: { type: string, format: date-time }
    MatchReason:
      type: object
      properties:
        headline: { type: string }
        factors: { type: array, items: { type: string } }
        score: { type: number }
    Candidate:
      type: object
      properties:
        profile_id: { type: string, format: uuid }
        display_name: { type: string, nullable: true }
        city: { type: string, nullable: true }
        verified: { type: boolean }
        intent_tags: { type: array, items: { type: string } }
        distance_label: { type: string, description: coarse bucketed label e.g. "within 25 km" }
        match_reason: { $ref: '#/components/schemas/MatchReason' }
    DiscoveryResponse:
      type: object
      properties:
        mode: { type: string }
        daily_limit: { type: integer, description: anti-fatigue limit from connect_config }
        candidates: { type: array, items: { $ref: '#/components/schemas/Candidate' } }

security:
  - bearerAuth: []

paths:
  /onboarding/phone/request:
    post:
      summary: Start phone verification — stores the number pending verification and SMSes an OTP (Termii). Requesting a code for a different number resets phone_verified until the new one verifies.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [phone], properties: { phone: { type: string, description: "E.164 or national format; normalised server-side" } } } } }
      responses:
        '200': { description: Code sent, content: { application/json: { schema: { type: object, properties: { sent: { type: boolean } } } } } }
        '400': { description: invalid phone }
        '429': { description: resend cooldown / rate limited }
        '503': { description: phone verification not configured (OTP_PEPPER / TERMII_API_KEY unset) }

  /onboarding/phone/verify:
    post:
      summary: Confirm phone verification — checks the SMS code and flips phone_verified, unblocking the onboarding 'complete' status
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        '200': { description: Verified — returns updated OnboardingStatus }
        '400': { description: invalid/expired code, or no pending phone }
        '429': { description: too many attempts }
        '503': { description: phone verification not configured }

  /profile:
    get:
      summary: Get the caller's identity profile (creates an empty one on first access)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Profile' } } } } }
    patch:
      summary: Update the caller's identity profile
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfileUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Profile' } } } } } }

  /profile/me:
    get:
      summary: The caller's complete profile (details, modes, photos in display order)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/FullProfile' } } } } } }

  /profile/modes:
    get:
      summary: List per-mode visibility/intent/privacy for the caller
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Mode' } } } } } } }

  /profile/modes/{mode}:
    patch:
      summary: Set per-mode visibility/intent/privacy (independent per mode)
      parameters:
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [dating, friendship, professional, creator, event] }
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ModeUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Mode' } } } } } }
        '400': { description: invalid mode }

  /profile/media:
    post:
      summary: Add profile media (returns moderation_status=pending; not public until moderated)
      requestBody:
        content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string }, kind: { type: string, enum: [photo, clip] } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { id: { type: string }, moderation_status: { type: string } } } } } } } }
        '400': { description: "invalid reference (an R2 object key must be under the caller own prefix)" }
        '409': { description: photo limit reached (9) }

  /profile/media/presign:
    post:
      summary: Issue a short-lived presigned PUT for one profile photo (the server chooses the key)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [content_type], properties: { file_name: { type: string }, content_type: { type: string, enum: [image/jpeg, image/png, image/webp] } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { upload_url: { type: string }, object_key: { type: string, description: "send back as url to POST /profile/media" }, content_type: { type: string }, expires_in: { type: integer }, method: { type: string } } } } } } } }
        '400': { description: unsupported content type }
        '503': { description: photo uploads are not configured }

  /profile/media/order:
    put:
      summary: Set photo display order; the first id is the primary photo
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string, format: uuid }, description: "exactly the caller photo ids, each once" } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ProfilePhoto' } } } } } } }
        '400': { description: "list is not exactly the caller photos" }

  /profile/media/{id}:
    delete:
      summary: Remove one of the caller's media items
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Removed }
        '404': { description: "not the caller media" }

  /verification/selfie:
    post:
      summary: Submit an L0–L1 selfie/liveness check (evidence stored encrypted/opaque, never raw)
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/SelfieRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/VerificationRecord' } } } } } }
        '400': { description: could not be processed }

  /verification/status:
    get:
      summary: Get the caller's verification level + badge
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/VerificationRecord' } } } } } }

  /discovery:
    get:
      summary: Curated daily matches with match-reason cards (anti-fatigue limit from config)
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [dating, friendship, professional, creator, event], default: dating }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/DiscoveryResponse' } } } } } }

  /likes:
    post:
      summary: Like / super-like a profile (idempotent; mutual like creates a match)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/LikeRequest' } } }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/LikeResult' } } } } } }
        '400': { description: invalid / self-like / no profile }

  /matches:
    get:
      summary: List the caller's mutual matches
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Match' } } } } } } }

  /search:
    get:
      summary: Search with privacy-preserving filters (verified-only, intent, bucketed distance)
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [dating, friendship, professional, creator, event], default: dating }
        - name: verified
          in: query
          schema: { type: boolean }
          description: when true, only L0/L1-verified profiles are returned
        - name: intent
          in: query
          schema: { type: string }
          description: a single intent tag to match
        - name: max_distance_km
          in: query
          schema: { type: integer }
          description: requested radius; snapped up to the nearest configured distance bucket
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Candidate' } } } } } } }

  # --- Admin (base path /api/connect/admin) ---
  /verification/status#admin:
    get:
      summary: 'Admin: verification status read (RBAC connect.verification.view)'
      description: Served at GET /api/connect/admin/verification/status.
      responses:
        '200': { description: OK }
        '403': { description: forbidden }
