openapi: 3.1.0
info:
  title: Paymax × Spotlight — Telemedicine Pre-Consultation Intake API
  version: 1.0.0
  description: >
    Pre-Consultation Health Intake for the Telemedicine module: a guarded
    prerequisite on an appointment that captures the patient's key health details
    (chief complaint, symptoms, medications, allergies, conditions, pregnancy,
    lifestyle, vitals, attachments) before the consultation begins, so the doctor
    walks in informed.

    Conventions:
      - Intake is a GUARD on the appointment, not a new booking flow. IN_CONSULT is
        structurally unreachable until the intake status is SUBMITTED.
      - Red-flag triage runs server-side at submit: emergency / urgent / self-harm
        answers surface urgent-care or crisis guidance + routing instead of silently
        queuing a routine consult. Product-safety gate, not a form field.
      - Intake is sensitive health data: visible only to the ASSIGNED doctor for the
        appointment (object-level access) plus the patient. Every doctor access is
        audit-logged. Explicit, versioned consent is captured at first intake.
      - Intake is patient-reported decision-support for the clinician, NOT a
        diagnosis. Allergies & current medications are surfaced prominently to the
        doctor and carried into any e-prescribing step.
      - Auth: Bearer JWT issued by Supabase Auth.
    Module spec — mirrors contracts/nutrition.openapi.yaml. Served under /api/v1
    via Next.js route handlers that proxy to the Go backend (/api/finance/health/*).

servers:
  - url: /api/v1
    description: Intake module routes (Next.js route handlers proxying to Go /api/finance/health/*)

tags:
  - { name: Intake, description: 'Member pre-consultation intake: draft, submit, attachments, doctor summary, health profile.' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    # No Idempotency-Key component: no intake route reads that header. Draft saves are
    # naturally replay-safe (last write wins); submit is not — a replay hits the
    # already-SUBMITTED guard and answers 400, which the submit path says out loud.

  responses:
    Unauthorized: { description: Missing or invalid bearer token }
    Forbidden: { description: Not the assigned doctor / not permitted (object-level access denied) }
    NotFound: { description: Resource not found }
    UnprocessableEntity: { description: Required-field validation failed }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        status: { type: integer }

    IntakeAttachment:
      type: object
      description: >
        One stored upload — the three fields the server persists on the intake row. The
        doctor summary projects the same row differently (kind + content_type + a
        short-lived signed url, with the key withheld).
      required: [kind, storage_key, content_type]
      properties:
        kind: { type: string, enum: [photo, lab_result, prescription, other] }
        storage_key: { type: string, description: 'Server-issued R2 key under intake/<patient>/<appointment>/.' }
        content_type: { type: string, description: 'From the allow-list: image/png, image/jpeg, image/webp, application/pdf.' }

    ConsultIntake:
      type: object
      description: >
        A patient's pre-consultation health intake bound to one appointment.
        IN_CONSULT is unreachable until status=SUBMITTED. Visible only to the
        assigned doctor (object-level) + patient. Patient-reported, not a diagnosis.

        One shape serves both appointment planes. appointment_id echoes the id the
        caller used; appointment_source says which plane it resolved on, and
        provider_id follows it — health_providers.id on the health plane,
        doctors.id on the telemedicine plane. Optional keys are omitted (not null)
        while unset, and consult_id stays absent on the telemedicine plane because
        those sessions live in consult_sessions, not health_consults.
      required:
        - id
        - appointment_id
        - appointment_source
        - patient_id
        - provider_id
        - status
        - red_flag_hits
        - attachments
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        appointment_id: { type: string, format: uuid }
        appointment_source:
          type: string
          enum: [health, telemedicine]
        consult_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        provider_id: { type: string, format: uuid }
        response_id: { type: string, format: uuid }
        schema_id: { type: string, format: uuid }
        status:
          type: string
          enum: [DRAFT, SUBMITTED]
        consent_version: { type: integer, description: Version of the consent text the patient accepted; omitted until they have. }
        consent_at: { type: string, format: date-time }
        red_flag_level:
          type: integer
          description: Most urgent triage level across the hits (1 = emergency).
        red_flag_severity:
          type: string
          enum: [emergency, urgent]
        red_flag_hits:
          type: array
          items:
            type: object
            required: [rule_code, level, severity, routing]
            properties:
              rule_code: { type: string }
              level:
                type: integer
                description: Triage level, 1 = emergency.
              severity: { type: string, enum: [emergency, urgent] }
              routing: { type: string, enum: [EMERGENCY, URGENT_CARE, CRISIS] }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/IntakeAttachment' }
        submitted_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    IntakeFormField:
      type: object
      required: [name, type, required]
      properties:
        name: { type: string }
        type: { type: string, description: 'Widget/value type, e.g. text, textarea, number, single_select, multi_select, slider, boolean, file.' }
        required: { type: boolean }
        label: { type: string }
        options:
          type: array
          items: { type: string }

    IntakeSchema:
      type: object
      description: Versioned, schema-driven intake form (admin Form Builder drives it without code).
      required: [version, fields]
      properties:
        version: { type: integer }
        fields:
          type: array
          items: { $ref: '#/components/schemas/IntakeFormField' }

    ConsentVersion:
      type: object
      description: Versioned consent text ("shared with your doctor to provide care"); the accepted version is tracked per patient.
      required: [version, body]
      properties:
        version: { type: string }
        body: { type: string }
        active: { type: boolean }
        published_at: { type: string, format: date-time }

    IntakeBundle:
      type: object
      description: >
        Everything the patient app needs to render/resume intake: current intake,
        active form schema, server-computed prefill (profile + last intake), and
        the consent text/version to show. Never re-asks known profile data.
      required: [intake, schema, consent]
      properties:
        intake: { $ref: '#/components/schemas/ConsultIntake' }
        schema: { $ref: '#/components/schemas/IntakeSchema' }
        prefill:
          type: object
          additionalProperties: true
        consent: { $ref: '#/components/schemas/ConsentVersion' }
        draft:
          type: object
          description: >
            Answers from a previous auto-save so the wizard resumes where the patient
            stopped. Omitted (not empty) when there is no draft yet.
          additionalProperties: true

    IntakeDraft:
      type: object
      description: Partial intake answers (offline-first auto-save). Never runs triage, never submits.
      required: [answers]
      properties:
        answers:
          type: object
          additionalProperties: true
        consent_version:
          type: integer
          description: >
            The consent screen's "I agree", recorded at draft time because the wizard
            gates the questionnaire on the row already carrying the active version.
            Absent keeps whatever consent is stored (a keystroke autosave cannot wipe a
            fresh agreement); present must equal the active version. An integer — the
            server binds *int, so "1" would not bind.
        schema_version: { type: integer, description: 'Informational only — the server ignores it and validates answers against the active schema.' }

    IntakeSubmitRequest:
      type: object
      description: >
        The full answer set with the accepted consent version. Unlike the draft save,
        consent is required here: submit compares it to the active version and refuses
        a mismatch, so a client that cannot send it can never unlock a consult.
      required: [answers, consent_version]
      properties:
        answers:
          type: object
          description: Keys the active schema does not declare are rejected.
          additionalProperties: true
        consent_version: { type: integer }

    RedFlagResult:
      type: object
      description: >
        Outcome of the red-flag triage gate at submit. Surfaces urgent-care / crisis
        guidance + routing instead of silently queuing a routine consult.
      required: [severity, routing, guidance]
      properties:
        severity:
          type: string
          enum: [emergency, urgent]
        routing:
          type: string
          enum: [EMERGENCY, URGENT_CARE, CRISIS]
        guidance:
          type: object
          required: [title, body]
          properties:
            title: { type: string }
            body: { type: string }
            crisis_line: { type: string }
            show_emergency_number: { type: boolean }

    IntakeSubmitResult:
      type: object
      description: Result of submitting intake. Clean submit → READY_FOR_CONSULT; red flag → guidance/routing. A failed submit answers 4xx, never this object with status=DRAFT.
      required: [status, intake, response_id]
      properties:
        status:
          type: string
          enum: [SUBMITTED]
        intake: { $ref: '#/components/schemas/ConsultIntake' }
        response_id: { type: string, description: The health_intake_responses row the validated answers were persisted into. }
        red_flag: { $ref: '#/components/schemas/RedFlagResult' }

    PresignResult:
      type: object
      description: >
        Presigned upload target for an intake attachment (R2 / S3-compatible), as the
        server marshals it. There is no `key` and no `expires_at`: the field is
        storage_key and the lifetime is a relative second count.
      required: [upload_url, storage_key, content_type, bucket, expires_in, method]
      properties:
        upload_url: { type: string, format: uri }
        storage_key: { type: string, description: The key to echo back to the record call after the PUT. }
        content_type: { type: string }
        bucket: { type: string }
        expires_in: { type: integer, description: 'Seconds until the presigned PUT stops working — a duration, not a timestamp.' }
        method:
          type: string
          enum: [PUT]

    DoctorSummary:
      type: object
      description: >
        One-screen structured intake summary for the ASSIGNED doctor at consult
        start, ordered for clinical use (chief complaint → symptom detail →
        allergies & current meds [highlighted] → chronic conditions → pregnancy →
        vitals → attachments). Object-level access only; every read is audit-logged.
        Patient-reported decision-support, NOT a diagnosis.
      required: [sections, allergies, current_medications, patient_reported, disclaimer]
      properties:
        sections:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title: { type: string }
              body: { type: string }
              highlight: { type: boolean }
        allergies:
          type: array
          items: { type: string }
        current_medications:
          type: array
          items: { type: string }
        patient_reported:
          type: boolean
          const: true
        disclaimer: { type: string }

    HealthProfile:
      type: object
      description: >
        Pre-fill source for future intakes, read off the patient's latest SUBMITTED
        response under the schema's own field names. Nothing is required: each key is
        marshalled with omitempty, so a patient with no prior response gets {} and a
        partial one gets only what that response actually answered.
      properties:
        current_medications:
          description: >
            Raw answer text, not a parsed array. The seeded form teaches newline and ';'
            as the only separators, so one entry may itself contain a comma.
        allergies:
          description: Raw answer text, keyed exactly as the schema names the field.
        chronic_conditions:
          description: Raw answer text, keyed exactly as the schema names the field.
        chronic_other:
          description: Free text captured when chronic_conditions includes "other".
        last_updated: { type: [string, 'null'], format: date-time, description: 'Never assigned server-side — absence is the norm, not an error.' }

    ComplaintSuggestion:
      type: object
      description: >
        Optional AI pre-fill of the chief-complaint fields, offered before the wizard
        starts. It restructures the patient's own words — it does not diagnose, assess,
        or advise. Every value is patient-reported text.
      required: [patient_reported, reason_for_visit, source]
      properties:
        patient_reported:
          type: boolean
          description: Always true, including on the AI path.
        reason_for_visit:
          type: string
          description: >
            The complaint in plain words. On the fallback path this is the patient's own
            text clipped to 200 characters; the AI path is prompted to the same limit.
        reason_category:
          type: string
          enum: [general, skin, respiratory, digestive, mental_health, sexual_health, pain, injury, chronic_followup, other]
          description: Omitted when nothing was recognised.
        symptom_onset:
          type: string
          enum: [today, few_days, about_a_week, few_weeks, over_a_month]
          description: Omitted unless the patient's words gave a timeframe.
        source:
          type: string
          enum: [ai, mock]
          description: >
            mock = the deterministic keyword fallback, used whenever the AI model is not
            configured or its answer was unusable. The call never fails for that reason,
            so intake is never blocked behind the AI.

security:
  - bearerAuth: []

paths:
  /health/intake/appointments/{appointmentId}:
    get:
      operationId: intakeGetBundle
      summary: Get the intake bundle for an appointment (intake + schema + prefill + consent)
      tags: [Intake]
      parameters: [{ $ref: '#/components/parameters/AppointmentId' }]
      responses:
        '200': { description: Intake bundle, content: { application/json: { schema: { type: object, required: [success, data], properties: { success: { type: boolean }, data: { $ref: '#/components/schemas/IntakeBundle' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /health/intake/appointments/{appointmentId}/draft:
    put:
      operationId: intakeSaveDraft
      summary: Auto-save a partial intake draft (no triage, no submit)
      tags: [Intake]
      parameters: [{ $ref: '#/components/parameters/AppointmentId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IntakeDraft' } } }
      responses:
        '200': { description: Draft saved, content: { application/json: { schema: { type: object, required: [success, intake], properties: { success: { type: boolean }, intake: { $ref: '#/components/schemas/ConsultIntake' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /health/intake/appointments/{appointmentId}/submit:
    post:
      operationId: intakeSubmit
      summary: Submit intake (runs red-flag triage; unlocks READY_FOR_CONSULT)
      description: IN_CONSULT remains structurally unreachable until this succeeds. Red-flag triage may return urgent-care/crisis guidance + routing.
      tags: [Intake]
      parameters: [{ $ref: '#/components/parameters/AppointmentId' }]
      requestBody:
        required: true
        description: >
          Answers plus the accepted consent version — both required, and consent is what
          the server refuses on: a version other than the active one fails the submit.
        content: { application/json: { schema: { $ref: '#/components/schemas/IntakeSubmitRequest' } } }
      responses:
        '201': { description: Intake submitted (may carry red-flag guidance), content: { application/json: { schema: { type: object, required: [success, data], properties: { success: { type: boolean }, data: { $ref: '#/components/schemas/IntakeSubmitResult' } } } } } }
        '400': { description: 'Invalid body, non-uuid id, an answer key the active schema does not declare, a stale consent_version, or an intake already SUBMITTED (submit is not idempotent — no Idempotency-Key is read).' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /health/intake/appointments/{appointmentId}/attachments/presign:
    post:
      operationId: intakePresignAttachment
      summary: Presign an upload URL for an intake attachment (photo / lab result / prescription)
      description: >
        Step 1 of an upload. The answer carries a server-issued storage_key — the client
        never proposes one — and step 2 (record) is what puts the attachment on the intake.
      tags: [Intake]
      parameters: [{ $ref: '#/components/parameters/AppointmentId' }]
      requestBody:
        required: true
        description: >
          camelCase: the server binds {kind, fileName, contentType}. Unknown keys bind to
          empty rather than being rejected, so filename/content_type fails the kind check
          first and the call 400s before any URL is issued.
        content:
          application/json:
            schema:
              type: object
              required: [kind, fileName, contentType]
              properties:
                kind: { type: string, enum: [photo, lab_result, prescription, other] }
                fileName: { type: string, description: 'Only the extension is read: .png .jpg .jpeg .webp .pdf.' }
                contentType: { type: string, description: 'image/png, image/jpeg, image/webp or application/pdf.' }
      responses:
        '200': { description: Presigned upload target, content: { application/json: { schema: { type: object, required: [success, data], properties: { success: { type: boolean }, data: { $ref: '#/components/schemas/PresignResult' } } } } } }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Uploads unconfigured on this host (no R2 presigner) — intake itself still works. }
  /health/intake/appointments/{appointmentId}/attachments:
    post:
      operationId: intakeRecordAttachment
      summary: Record a completed R2 upload on the intake (step 2 — the upload is not attached until this succeeds)
      description: >
        Called after the PUT to upload_url returns. The storage key must sit under this
        patient + appointment prefix, so a key from another intake is refused rather than
        silently listed. The whole updated intake comes back, so the wizard re-renders from
        the response it already has.
      tags: [Intake]
      parameters: [{ $ref: '#/components/parameters/AppointmentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, storage_key, content_type]
              properties:
                kind: { type: string, enum: [photo, lab_result, prescription, other] }
                storage_key: { type: string, description: The key presign issued — echoed straight back. }
                content_type: { type: string }
      responses:
        '200': { description: Intake with the attachment appended, content: { application/json: { schema: { type: object, required: [success, intake], properties: { success: { type: boolean }, intake: { $ref: '#/components/schemas/ConsultIntake' } } } } } }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /health/intake/appointments/{appointmentId}/doctor-summary:
    get:
      operationId: intakeGetDoctorSummary
      summary: Doctor-facing intake summary (assigned doctor only; access-logged)
      description: Object-level access (assigned doctor for this appointment only); every read is audit-logged. Allergies & current meds highlighted. Patient-reported, not a diagnosis.
      tags: [Intake]
      parameters: [{ $ref: '#/components/parameters/AppointmentId' }]
      responses:
        '200': { description: Doctor summary (access audit-logged), content: { application/json: { schema: { type: object, required: [success, summary], properties: { success: { type: boolean }, summary: { $ref: '#/components/schemas/DoctorSummary' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /health/intake/health-profile:
    get:
      operationId: intakeGetHealthProfile
      summary: Get the patient's longitudinal health profile (pre-fills future intakes)
      description: >
        `{success, profile}` where profile carries the RAW answer text of the patient's
        latest submitted response under the schema's own field names (allergies,
        current_medications, chronic_conditions, chronic_other). Newline and ';' are the
        only separators the seeded schema teaches, so a condition name may itself contain
        a comma. `last_updated` is never assigned server-side — absence is the norm, not
        an error.
      tags: [Intake]
      responses:
        '200': { description: Health profile, content: { application/json: { schema: { type: object, required: [success, profile], properties: { success: { type: boolean }, profile: { $ref: '#/components/schemas/HealthProfile' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /health/intake/symptom-assist:
    post:
      operationId: intakeSuggestComplaint
      summary: 'Optional AI pre-fill of the chief complaint from the patient''s own words'
      description: >
        `{success, suggestion}`. A convenience step offered before the wizard: it
        restructures what the patient typed into the complaint fields — it does not
        diagnose, and an unusable AI answer falls back to a deterministic keyword parse
        rather than failing, so intake is never blocked behind the model. Not required
        to save or submit a draft.
      tags: [Intake]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                The server binds a single {text} field and validates nothing on it, so an
                absent or empty text is accepted rather than rejected — it answers 200 with
                reason_for_visit "".
              properties:
                text: { type: string, description: 'The patient''s words, verbatim. The fallback path clips this to 200 characters into reason_for_visit.' }
      responses:
        '200': { description: Suggestion, content: { application/json: { schema: { type: object, required: [success, suggestion], properties: { success: { type: boolean }, suggestion: { $ref: '#/components/schemas/ComplaintSuggestion' } } } } } }
        '400': { description: Malformed body — the only way this call fails. }
        '401': { $ref: '#/components/responses/Unauthorized' }
