  # PATHS_END

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
      description: Client-generated unique key; identical replays are no-ops (money/reward/write paths).

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, description: snake_case error code }
        message: { type: string }
    # ── Identity ──
    IdentityRoleGrant:
      type: object
      properties:
        user_id: { type: string }
        role: { type: string, enum: [learner, parent, tutor, staff] }
        granted_at: { type: string, format: date-time }
    IdentityProfile:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        role: { type: string, enum: [learner, parent, tutor, staff] }
        class_id: { type: string, nullable: true }
        stream: { type: string, nullable: true }
        trade_track: { type: string, nullable: true }
        school: { type: string, nullable: true }
        display_name: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        entry_year: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IdentityGuardianLink:
      type: object
      properties:
        id: { type: string }
        guardian_user_id: { type: string }
        minor_user_id: { type: string }
        consent_record_id: { type: string, nullable: true }
        status: { type: string, enum: [pending, active, revoked] }
        created_at: { type: string, format: date-time }
    IdentityMe:
      type: object
      properties:
        user_id: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/IdentityRoleGrant' } }
        profiles: { type: array, items: { $ref: '#/components/schemas/IdentityProfile' } }
        guardian_links: { type: array, items: { $ref: '#/components/schemas/IdentityGuardianLink' } }
        guarded_by: { type: array, items: { $ref: '#/components/schemas/IdentityGuardianLink' } }
    IdentityGrantRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [learner, parent, tutor, staff] }
    IdentityUpsertProfileRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [learner, parent, tutor, staff] }
        class_id: { type: string, nullable: true }
        stream: { type: string, nullable: true }
        trade_track: { type: string, nullable: true }
        school: { type: string, nullable: true }
        display_name: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        entry_year: { type: integer, nullable: true }
    IdentityLinkGuardianRequest:
      type: object
      required: [minor_user_id]
      properties:
        minor_user_id: { type: string }
    IdentityRecordConsentRequest:
      type: object
      required: [scope]
      properties:
        scope: { type: object, additionalProperties: true }

    # ── Curriculum ──
    CurriculumVersion:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        effective_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [draft, active, retired] }
    CurriculumClass:
      type: object
      properties:
        id: { type: string }
        version_id: { type: string }
        phase: { type: string, enum: [ECCE, LowerPrimary, UpperPrimary, JSS, SSS] }
        code: { type: string }
        name: { type: string }
        ordinal: { type: integer }
    CurriculumStream:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
    CurriculumTradeTrack:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        status: { type: string }
    CurriculumSubject:
      type: object
      properties:
        id: { type: string }
        version_id: { type: string }
        class_id: { type: string }
        code: { type: string }
        name: { type: string }
        kind: { type: string, enum: [core, elective, optional] }
        stream: { type: string, nullable: true }
        exam_relevance: { type: array, items: { type: string } }
    CurriculumTopic:
      type: object
      properties:
        id: { type: string }
        subject_id: { type: string }
        code: { type: string }
        title: { type: string }
        ordinal: { type: integer }
    CurriculumObjective:
      type: object
      properties:
        id: { type: string }
        topic_id: { type: string }
        code: { type: string }
        title: { type: string }
        exam_tags: { type: array, items: { type: string } }
        ordinal: { type: integer }
    CurriculumCreateVersionRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        effective_date: { type: string, format: date, nullable: true }
        status: { type: string }
    CurriculumUpdateVersionRequest:
      type: object
      properties:
        name: { type: string }
        effective_date: { type: string, format: date, nullable: true }
        status: { type: string }
    CurriculumCreateClassRequest:
      type: object
      required: [version_id, phase, code, name]
      properties:
        version_id: { type: string }
        phase: { type: string }
        code: { type: string }
        name: { type: string }
        ordinal: { type: integer }
    CurriculumUpdateClassRequest:
      type: object
      properties:
        phase: { type: string }
        name: { type: string }
        ordinal: { type: integer }
    CurriculumCreateSubjectRequest:
      type: object
      required: [version_id, class_id, code, name]
      properties:
        version_id: { type: string }
        class_id: { type: string }
        code: { type: string }
        name: { type: string }
        kind: { type: string }
        stream: { type: string, nullable: true }
        exam_relevance: { type: array, items: { type: string } }
    CurriculumUpdateSubjectRequest:
      type: object
      properties:
        name: { type: string }
        kind: { type: string }
        stream: { type: string, nullable: true }
        exam_relevance: { type: array, items: { type: string } }
    CurriculumCreateTopicRequest:
      type: object
      required: [subject_id, code, title]
      properties:
        subject_id: { type: string }
        code: { type: string }
        title: { type: string }
        ordinal: { type: integer }
    CurriculumUpdateTopicRequest:
      type: object
      properties:
        title: { type: string }
        ordinal: { type: integer }
    CurriculumCreateObjectiveRequest:
      type: object
      required: [topic_id, code, title]
      properties:
        topic_id: { type: string }
        code: { type: string }
        title: { type: string }
        exam_tags: { type: array, items: { type: string } }
        ordinal: { type: integer }
    CurriculumUpdateObjectiveRequest:
      type: object
      properties:
        title: { type: string }
        exam_tags: { type: array, items: { type: string } }
        ordinal: { type: integer }

    # ── Commerce (money-path) ──
    CommercePlan:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        priceMinor: { type: integer, format: int64 }
        period: { type: string }
        features: { type: object, additionalProperties: true }
        status: { type: string }
    CommerceExamBundle:
      type: object
      properties:
        id: { type: string }
        arenaId: { type: string, nullable: true }
        name: { type: string }
        priceMinor: { type: integer, format: int64 }
        contents: { type: object, additionalProperties: true }
        season: { type: string, nullable: true }
        status: { type: string }
    CommerceOrder:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        kind: { type: string, enum: [plan, bundle] }
        refId: { type: string }
        amountMinor: { type: integer, format: int64 }
        currency: { type: string }
        state: { type: string }
        paymentRef: { type: string, nullable: true }
        bnplRef: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    CommerceEntitlement:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        kind: { type: string, enum: [plan, bundle, arena] }
        refId: { type: string, nullable: true }
        state: { type: string, enum: [active, revoked] }
        source: { type: string, enum: [order, bnpl, access_card, reward, scholarship] }
        grantedAt: { type: string, format: date-time }
    CommerceSubscription:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        planId: { type: string }
        state: { type: string }
        startedAt: { type: string, format: date-time }
        renewsAt: { type: string, format: date-time, nullable: true }
    CommerceBundleManifest:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        versionId: { type: string, nullable: true }
        arenaCode: { type: string, nullable: true }
        sizeBudgetBytes: { type: integer, format: int64 }
        lessonIds: { type: array, items: { type: string } }
        status: { type: string }
        manifest: { type: object, additionalProperties: true }
    CommerceCreateOrderRequest:
      type: object
      required: [kind, refId]
      properties:
        kind: { type: string, enum: [plan, bundle] }
        refId: { type: string }
    CommerceActivateCardRequest:
      type: object
      required: [serial, pin]
      properties:
        serial: { type: string }
        pin: { type: string }
    CommerceSubscribeRequest:
      type: object
      required: [planId]
      properties:
        planId: { type: string }
    CommerceSubscribeResult:
      type: object
      properties:
        order: { $ref: '#/components/schemas/CommerceOrder' }
        subscription: { $ref: '#/components/schemas/CommerceSubscription' }
    CommerceSyncEvent:
      type: object
      required: [clientEventId, kind]
      properties:
        clientEventId: { type: string }
        kind: { type: string, enum: [progress, attempt_queued, reward_eligible] }
        payload: { type: object, additionalProperties: true }
        clientTs: { type: string, format: date-time, nullable: true }
    CommerceSyncRequest:
      type: object
      properties:
        events: { type: array, items: { $ref: '#/components/schemas/CommerceSyncEvent' } }
    CommerceSyncResolution:
      type: object
      properties:
        clientEventId: { type: string }
        kind: { type: string }
        resolution: { type: string, enum: [accepted, superseded, rejected] }
        serverTs: { type: string, format: date-time }
        note: { type: string }
    CommerceSyncResult:
      type: object
      properties:
        reconciled: { type: array, items: { $ref: '#/components/schemas/CommerceSyncResolution' } }
    CommerceGenerateCardsRequest:
      type: object
      required: [batch, grantKind, grantRefId, count]
      properties:
        batch: { type: string }
        grantKind: { type: string, enum: [plan, bundle] }
        grantRefId: { type: string }
        count: { type: integer }
        pinDigits: { type: integer, default: 6 }
    CommerceGeneratedCard:
      type: object
      properties:
        id: { type: string }
        serial: { type: string }
        pin: { type: string, description: one-time plaintext PIN }
    CommerceAllocateCardsRequest:
      type: object
      required: [agentId]
      properties:
        agentId: { type: string }
        batch: { type: string }
        serials: { type: array, items: { type: string } }
    # ── Gamification ──
    GamProfile:
      type: object
      properties:
        user_id: { type: string }
        xp: { type: integer, format: int64 }
        level: { type: integer }
        streak_days: { type: integer }
        freezes: { type: integer }
        last_active: { type: string, nullable: true }
        updated_at: { type: string, format: date-time }
    GamBadge:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        criteria: { type: object, additionalProperties: true }
        icon: { type: string, nullable: true }
    GamChallenge:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        kind: { type: string }
