openapi: 3.1.0
info:
  title: Paymax × Spotlight — Academy (K-12 EdTech) Module API
  version: 1.0.0
  description: >
    Spotlight Academy vertical — K-12 EdTech super-app on the Paymax rails.
    Covers identity/guardianship, curriculum spine, assessment + CBT exam arenas,
    gamification, learn-to-earn rewards, commerce (plans/bundles/BNPL), CMS content,
    adaptive progression, the parent layer, EduPay (school fees / savings pots /
    disbursements / scholarships), the trade → credentials → earning moat, live
    classes + community + moderation, B2B2C institutions, the tutor marketplace,
    the EdTech School-Fees subsystem (invoices, vault, promotion, competition,
    scholarship, trust-score, compliance export), and the platform super-admin.

    Conventions:
      - All monetary amounts are integers in minor units (kobo). Never floats. Fields
        ending `_minor` / `Minor` / `_kobo` are int64 minor units.
      - Money / reward / disbursement / payout mutations require an `Idempotency-Key`
        header and post balanced, tier-checked, fail-closed ledger entries. The header
        is documented on each such operation.
      - Auth: Bearer JWT issued by Supabase Auth. Member routes sit under
        /api/finance/academy/* behind RequireAuthContext + the FeatureAcademyEnabled
        gate. Admin routes sit under /api/academy/* (and /api/academy/admin/*) and
        require the relevant academy.* RBAC permission (noted per operation).
      - Most handlers wrap the success payload in `{ "data": <schema> }`. The fees
        competition package returns the DTO unwrapped (noted inline).
      - Error envelope: `{ "error": "<snake_case_code>", "message": "<detail>" }`.

    This spec documents the Go/Gin backend surface registered by
    backend/internal/app/academy_routes.go, academy_platform_routes.go and the
    academy/* + academy/fees/* handler packages. Paths are absolute.

servers:
  - url: /
    description: Root — academy member routes are /api/finance/academy/*, admin routes /api/academy/*

security:
  - bearerAuth: []

tags:
  - { name: Identity, description: "Academy identity, roles, profiles, guardianship & consent" }
  - { name: Curriculum, description: Curriculum spine — versions, classes, subjects, topics, objectives }
  - { name: Assessment, description: Practice, mastery, progress & the question bank }
  - { name: Exam, description: CBT exam arenas, blueprints, attempts (money-idempotent) }
  - { name: Gamification, description: XP, badges, leaderboards, challenges }
  - { name: Rewards, description: Learn-to-earn reward wallet, catalog, redemption (money-path) }
  - { name: Commerce, description: Plans, exam bundles, orders, BNPL, access cards (money-path) }
  - { name: Content, description: CMS — lessons, bundles, production board, localizations }
  - { name: Progression, description: Adaptive learning paths, adaptive practice, recommendations }
  - { name: Parent, description: Parent layer — child dashboards, controls, reports, purchase approvals }
  - { name: EduPay, description: School fees, savings pots, disbursements, scholarships (money-path) }
  - { name: Trade, description: Trade tracks — modules, projects, skill assessments, mentors }
  - { name: Credentials, description: Issued credentials, public verification, earning opportunities }
  - { name: Live, description: Live classes }
  - { name: Community, description: Study groups, discussions, moderation }
  - { name: Schools, description: B2B2C institutions — licences, enrolment, billing (money-path) }
  - { name: Tutor, description: Tutor marketplace — onboarding, assignments, grading, payouts (money-path) }
  - { name: Fees, description: EdTech School-Fees — schools, sessions, fee schedules, students, invoices, vault, promotion, competition, scholarship, trust-score, hardship, export (money-path) }
  - { name: Platform, description: EdTech platform super-admin oversight (platform_edtech_admin RBAC) }

paths:
  # ══════════ Identity ══════════
  /api/finance/academy/me:
    get:
      tags: [Identity]
      summary: Get the caller's academy identity (roles, profiles, guardian links)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityMe' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/roles:
    post:
      tags: [Identity]
      summary: Grant the caller an academy role
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityGrantRoleRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, role: { type: string } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/profile:
    put:
      tags: [Identity]
      summary: Upsert the caller's academy profile
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityUpsertProfileRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityProfile' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/guardians/link:
    post:
      tags: [Identity]
      summary: Link a minor to the caller (guardian)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityLinkGuardianRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityGuardianLink' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/guardians/{minorId}/consent:
    post:
      tags: [Identity]
      summary: Record guardian consent for a minor
      parameters: [ { name: minorId, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityRecordConsentRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { consent_id: { type: string }, status: { type: string } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/admin/users/{id}:
    get:
      tags: [Identity]
      summary: Admin lookup of a user's academy identity (RBAC academy.identity)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityMe' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/admin/guardians/{id}/revoke:
    post:
      tags: [Identity]
      summary: Admin revoke a guardian link (RBAC academy.identity)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityGuardianLink' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ══════════ Curriculum ══════════
  /api/finance/academy/curriculum/versions:
    get:
      tags: [Curriculum]
      summary: List curriculum versions
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { versions: { type: array, items: { $ref: '#/components/schemas/CurriculumVersion' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/curriculum/classes:
    get:
      tags: [Curriculum]
      summary: List classes
      parameters: [ { name: version, in: query, required: false, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { classes: { type: array, items: { $ref: '#/components/schemas/CurriculumClass' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/curriculum/classes/{id}/subjects:
    get:
      tags: [Curriculum]
      summary: List subjects for a class
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { subjects: { type: array, items: { $ref: '#/components/schemas/CurriculumSubject' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/curriculum/subjects/{id}/topics:
    get:
      tags: [Curriculum]
      summary: List topics for a subject
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { topics: { type: array, items: { $ref: '#/components/schemas/CurriculumTopic' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/curriculum/topics/{id}/objectives:
    get:
      tags: [Curriculum]
      summary: List objectives for a topic
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { objectives: { type: array, items: { $ref: '#/components/schemas/CurriculumObjective' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/curriculum/streams:
    get:
      tags: [Curriculum]
      summary: List streams
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { streams: { type: array, items: { $ref: '#/components/schemas/CurriculumStream' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/curriculum/trade-tracks:
    get:
      tags: [Curriculum]
      summary: List trade tracks
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { trade_tracks: { type: array, items: { $ref: '#/components/schemas/CurriculumTradeTrack' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/admin/curriculum/versions:
    post:
      tags: [Curriculum]
      summary: Create curriculum version (RBAC academy.curriculum)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumCreateVersionRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumVersion' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/admin/curriculum/versions/{id}:
    patch:
      tags: [Curriculum]
      summary: Update curriculum version (RBAC academy.curriculum)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumUpdateVersionRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumVersion' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/admin/curriculum/versions/{id}/publish:
    post:
      tags: [Curriculum]
      summary: Publish curriculum version (RBAC academy.curriculum)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumVersion' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/admin/curriculum/classes:
    post:
      tags: [Curriculum]
      summary: Create class (RBAC academy.curriculum)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumCreateClassRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumClass' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/admin/curriculum/classes/{id}:
    patch:
      tags: [Curriculum]
      summary: Update class (RBAC academy.curriculum)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumUpdateClassRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumClass' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/admin/curriculum/subjects:
    post:
      tags: [Curriculum]
      summary: Create subject (RBAC academy.curriculum)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumCreateSubjectRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumSubject' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/admin/curriculum/subjects/{id}:
    patch:
      tags: [Curriculum]
      summary: Update subject (RBAC academy.curriculum)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumUpdateSubjectRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumSubject' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/admin/curriculum/topics:
    post:
      tags: [Curriculum]
      summary: Create topic (RBAC academy.curriculum)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumCreateTopicRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumTopic' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/admin/curriculum/topics/{id}:
    patch:
      tags: [Curriculum]
      summary: Update topic (RBAC academy.curriculum)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumUpdateTopicRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumTopic' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/admin/curriculum/objectives:
    post:
      tags: [Curriculum]
      summary: Create objective (RBAC academy.curriculum)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumCreateObjectiveRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumObjective' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/admin/curriculum/objectives/{id}:
    patch:
      tags: [Curriculum]
      summary: Update objective (RBAC academy.curriculum)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumUpdateObjectiveRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CurriculumObjective' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ══════════ Commerce (money-path) ══════════
  /api/finance/academy/commerce/plans:
    get:
      tags: [Commerce]
      summary: List subscription plans
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/CommercePlan' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/commerce/bundles:
    get:
      tags: [Commerce]
      summary: List exam bundles
      parameters: [ { name: arena, in: query, required: false, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/CommerceExamBundle' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/commerce/bundles/{id}/manifest:
    get:
      tags: [Commerce]
      summary: Get bundle manifest
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CommerceBundleManifest' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/commerce/orders:
    post:
      tags: [Commerce]
      summary: Create a commerce order (plan or bundle)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CommerceCreateOrderRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CommerceOrder' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/commerce/orders/{id}/pay:
    post:
      tags: [Commerce]
      summary: Pay an order now (wallet). Minor may require guardian approval.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CommerceOrder' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/commerce/orders/{id}/bnpl:
    post:
      tags: [Commerce]
      summary: Start BNPL on an order
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CommerceOrder' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/commerce/access-cards/activate:
    post:
      tags: [Commerce]
      summary: Activate an access card (serial + PIN)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CommerceActivateCardRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CommerceEntitlement' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/commerce/subscribe:
    post:
      tags: [Commerce]
      summary: Subscribe to a plan
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CommerceSubscribeRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CommerceSubscribeResult' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/commerce/sync:
    post:
      tags: [Commerce]
      summary: Reconcile offline client events (idempotent on clientEventId)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CommerceSyncRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CommerceSyncResult' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/commerce/admin/orders/{id}/refund:
    post:
      tags: [Commerce]
      summary: Admin refund an order (RBAC academy.commerce)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CommerceOrder' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/commerce/admin/access-cards/generate:
    post:
      tags: [Commerce]
      summary: Admin generate access cards (RBAC academy.commerce)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CommerceGenerateCardsRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/CommerceGeneratedCard' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/commerce/admin/access-cards/allocate:
    post:
      tags: [Commerce]
      summary: Admin allocate access cards to an agent (RBAC academy.commerce)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CommerceAllocateCardsRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { allocated: { type: integer, format: int64 } } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/commerce/admin/plans:
    get:
      tags: [Commerce]
      summary: Admin list plans (RBAC academy.commerce)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/CommercePlan' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/commerce/admin/bundles:
    get:
      tags: [Commerce]
      summary: Admin list bundles (RBAC academy.commerce)
      parameters: [ { name: arena, in: query, required: false, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/CommerceExamBundle' } } } } } } }
        default: { $ref: '#/components/responses/Error' }

  # ══════════ Gamification ══════════
  /api/finance/academy/gamification/profile:
    get:
      tags: [Gamification]
      summary: Get the caller's gamification profile (XP/level/streak)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/GamProfile' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/gamification/badges:
    get:
      tags: [Gamification]
      summary: Get the caller's badges
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { badges: { type: array, items: { $ref: '#/components/schemas/GamBadge' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/gamification/leaderboards/{id}:
    get:
      tags: [Gamification]
      summary: Get a leaderboard with entries
      parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { name: period_key, in: query, required: false, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { leaderboard: { $ref: '#/components/schemas/GamLeaderboard' }, entries: { type: array, items: { $ref: '#/components/schemas/GamLeaderboardEntry' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/finance/academy/gamification/challenges:
    get:
      tags: [Gamification]
      summary: List active challenges
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { challenges: { type: array, items: { $ref: '#/components/schemas/GamChallenge' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/academy/admin/gamification/badges:
    get:
      tags: [Gamification]
      summary: Admin list badges (RBAC academy.content)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { badges: { type: array, items: { $ref: '#/components/schemas/GamBadge' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
