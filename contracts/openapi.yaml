  # ── Telemedicine Pre-Consultation Intake (member) ─────────────────────────────
  # Guarded prerequisite on the appointment. IN_CONSULT is structurally blocked
  # until intake status=SUBMITTED. Intake is sensitive health data — visible only
  # to the assigned doctor (object-level) + patient; doctor access is audit-logged.
  # Patient-reported decision-support, NOT a diagnosis.
  /api/finance/health/intake/appointments/{appointmentId}:
    get:
      operationId: intakeGetBundle
      summary: Get the intake bundle for an appointment (intake + schema + prefill + consent)
      description: >
        Returns everything the patient app needs to render/resume intake: the
        current ConsultIntake, the active versioned IntakeSchema, server-computed
        prefill (from profile + last intake — never re-asks known data), and the
        consent text/version to display.
      tags: [Intake]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: appointmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Intake bundle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntakeBundle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/finance/health/intake/appointments/{appointmentId}/draft:
    put:
      operationId: intakeSaveDraft
      summary: Auto-save a partial intake draft (no triage, no submit)
      description: >
        Persists partial answers as the patient progresses (offline-first,
        auto-save). Keeps status=DRAFT; never runs red-flag triage and never
        transitions the appointment.
      tags: [Intake]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: appointmentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntakeDraft' }
      responses:
        '200':
          description: Draft saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultIntake' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/finance/health/intake/appointments/{appointmentId}/submit:
    post:
      operationId: intakeSubmit
      summary: Submit intake (runs red-flag triage; unlocks READY_FOR_CONSULT)
      description: >
        Validates required fields and runs the red-flag triage gate. On a clean
        submit, status→SUBMITTED and the appointment becomes READY_FOR_CONSULT —
        IN_CONSULT remains structurally unreachable until this succeeds. If a
        red flag fires, the response carries urgent-care / crisis guidance and
        routing instead of silently queuing a routine consult.
      tags: [Intake]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: appointmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Intake submitted (may carry red-flag guidance)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntakeSubmitResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/finance/health/intake/appointments/{appointmentId}/attachments/presign:
    post:
      operationId: intakePresignAttachment
      summary: Presign an upload URL for an intake attachment
      description: Returns a presigned R2/S3 upload target for a photo, lab result, or prior prescription.
      tags: [Intake]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: appointmentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_type]
              properties:
                filename: { type: string }
                content_type: { type: string }
                size_bytes: { type: integer }
      responses:
        '200':
          description: Presigned upload target
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresignResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/finance/health/intake/appointments/{appointmentId}/doctor-summary:
    get:
      operationId: intakeGetDoctorSummary
      summary: Doctor-facing intake summary (assigned doctor only; access-logged)
      description: >
        One-screen ordered, expandable summary for the ASSIGNED doctor at consult
        start. Object-level access (assigned doctor for this appointment only);
        every read is audit-logged. Allergies & current medications are highlighted
        and carried into any e-prescribing step. Patient-reported decision-support,
        NOT a diagnosis.
      tags: [Intake]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: appointmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Doctor summary (access audit-logged)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DoctorSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/finance/health/intake/health-profile:
    get:
      operationId: intakeGetHealthProfile
      summary: Get the patient's longitudinal health profile (pre-fills future intakes)
      description: Patient-owned record of conditions/medications/allergies used to pre-fill future intakes; never exposed beyond the care relationship.
      tags: [Intake]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Health profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

