          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportSession' }

  /support/sessions/{id}/messages:
    post:
      operationId: sendSupportMessage
      summary: Send a message and receive AI reply
      tags: [AIcare]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
