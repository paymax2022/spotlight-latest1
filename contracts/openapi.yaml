      responses:
        '200':
          description: Message history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SupportMessage' } }

  /support/sessions/{id}/escalate:
    post:
      operationId: escalateSupportSession
