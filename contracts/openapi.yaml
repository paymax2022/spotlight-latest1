          description: Prometheus text exposition format
          content:
            text/plain:
              schema: { type: string }

  # ── Real-time trip tracking ───────────────────────────────────────────────
  # Driver streams GPS here; the backend snaps it via MapService.MatchToRoad and
  # pushes "trip.position" messages to the rider + driver over the WebSocket at
  /api/finance/mobility/ws:
    get:
      operationId: mobilityTripWS
      summary: WebSocket handshake for live trip tracking (rider/driver channel)
      description: >-
        Upgrades to a WebSocket. Auth is carried on the handshake via the
        Authorization bearer header. The server fans out driver GPS (snapped to
        road) to the trip's rider and driver over Redis pub/sub. Documented here
        for completeness; the payload is a WS stream, not a JSON response.
      tags: [Mobility]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: trip_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '101': { description: Switching Protocols — WebSocket established }
        '401': { description: Unauthenticated handshake }

  /api/finance/mobility/public/track/{token}:
    get:
      operationId: mobilityResolveShare
      summary: Resolve a live-share link (public, unauthenticated)
      description: >-
        Opens a rider's live-share link without an account. Returns only
        non-sensitive tracking fields (never the trip PIN) and enforces the
        token TTL / revocation. Registered outside the auth-gated finance group.
      tags: [Mobility]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Live tracking view for the shared trip
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareTrackView' }
        '404': { description: Token unknown, expired, or revoked }

  /api/finance/mobility/trips/{id}/track:
    post:
      operationId: mobilityTrackPosition
      summary: Stream one driver GPS sample for a trip (driver-only)
      tags: [Mobility]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, format: double }
                lng: { type: number, format: double }
                heading: { type: number, format: double }
                speed_mps: { type: number, format: double }
      responses:
        '202': { description: Accepted — position fanned out to participants }
        '403': { description: Caller is not the trip's driver }

