      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FxTransferRequest' }
      responses:
        '201':
          description: Transfer queued/processing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxTransfer' }
        '409':
          description: rate_expired / conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxError' }
  /api/v1/fx/collections/virtual-accounts:
    get:
      operationId: fxListVirtualAccounts
      summary: List provisioned virtual accounts / IBANs
      tags: [FX Orchestration]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Virtual account list
