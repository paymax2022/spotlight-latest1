    SubmitSOAPNoteRequest:
      type: object
      required: [appointment_id, subjective, assessment, plan]
      properties:
        appointment_id: { type: string, format: uuid }
        subjective: { type: string }
        objective: { type: string }
        assessment: { type: string }
        plan: { type: string }
        prescriptions:
          type: array
          items:
            type: object
            properties:
              drug: { type: string }
              dosage: { type: string }
              duration: { type: string }
