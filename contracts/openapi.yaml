openapi: 3.1.0
info:
  title: Paymax × Spotlight Super App API
  version: 2.0.0
  description: >
    Fintech super-app layer — wallet, KYC, FX, transfers, referrals, VA, and vertical modules.
    All monetary amounts are integers in minor units (kobo / currency-minor-unit).
    All mutation endpoints require an Idempotency-Key header.
    Authentication: Bearer JWT issued by Supabase Auth.
    Go backend routes: /api/finance/* (feature-flagged, gated on DATABASE_URL).
    Legacy Next.js routes: /api/v1/* (stable, unchanged).

servers:
  - url: /api/finance
    description: Go backend — financial core (Paymax v2)
  - url: /api/v1
    description: Stable fintech API (Next.js route handlers, v1 blocks 0-12)
  - url: /api/v2
    description: Bridge API (wraps protected legacy vote engine)

# ── Shared components ──────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: >
        Client-generated unique key. Identical requests with the same key
        within 24 hours return the cached response without side effects.

  schemas:
    # ── MapService (provider-agnostic maps abstraction) ───────────────────────
    # Every result carries `provider` + `source`. `source` is the licensing
    # stack ('openstack' | 'google' | 'mapbox' | 'own'); the client may only
    # render a point on a basemap with a matching source (license coherence).
    MapPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        source:
          type: string
          enum: [openstack, google, mapbox, own]
          description: Licensing stack the coordinate originated from.
    MapGeoResult:
      type: object
      required: [lat, lng, provider, source, cacheable]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        address: { type: string }
        plus_code: { type: string, description: Open Location Code (Plus Code) }
        provider: { type: string }
        source: { type: string, enum: [openstack, google, mapbox, own] }
        cacheable:
          type: boolean
          description: >
            false for Google-sourced results, which are NEVER persisted (the
            backend cache writer refuses them).
    MapSuggestion:
      type: object
      required: [label, provider, source]
      properties:
        label: { type: string }
        place_id: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        has_coords: { type: boolean }
        provider: { type: string }
        source: { type: string, enum: [openstack, google, mapbox, own] }
    MapPlace:
      type: object
      required: [name, lat, lng, provider, source]
      properties:
        name: { type: string }
        address: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        category: { type: string }
        place_id: { type: string }
        provider: { type: string }
        source: { type: string, enum: [openstack, google, mapbox, own] }
    MapRoute:
      type: object
      required: [distance_m, duration_s, provider, source]
      properties:
        distance_m: { type: integer }
        duration_s: { type: integer }
        polyline: { type: string, description: Encoded polyline geometry }
        provider: { type: string }
        source: { type: string, enum: [openstack, google, mapbox, own] }
        degraded:
          type: boolean
          description: true when served by a degraded fallback provider (cost guard).
    MapMatrixCell:
      type: object
      properties:
        distance_m: { type: integer }
        duration_s: { type: integer }
    MapMatrix:
      type: object
      required: [rows, provider, source]
      properties:
        rows:
          type: array
          items:
            type: array
            items: { $ref: '#/components/schemas/MapMatrixCell' }
          description: rows[i][j] is origins[i] -> dests[j].
        provider: { type: string }
        source: { type: string, enum: [openstack, google, mapbox, own] }
    MapPolyline:
      type: object
      required: [provider, source]
      properties:
        points:
          type: array
          items: { $ref: '#/components/schemas/MapPoint' }
        encoded: { type: string }
        provider: { type: string }
        source: { type: string, enum: [openstack, google, mapbox, own] }
    MapStyleConfig:
      type: object
      required: [style_url, attribution, provider, source]
      properties:
        style_url: { type: string, description: MapLibre GL style URL }
        attribution: { type: string }
        provider: { type: string }
        source: { type: string, enum: [openstack, google, mapbox, own] }
    MapOwnEntity:
      type: object
      required: [entity_id, entity_type, lat, lng, distance_m]
      properties:
        entity_id: { type: string }
        entity_type: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        plus_code: { type: string }
        distance_m: { type: number, format: double }
    MapUsageRow:
      type: object
      properties:
        provider: { type: string }
        primitive: { type: string }
        month: { type: string }
        count: { type: integer, format: int64 }
        cap: { type: integer, format: int64 }
        pct: { type: integer }

    # ── Mobility (ride-hailing) ───────────────────────────────────────────────
    Place:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        address: { type: string }

    PricingConfig:
      type: object
      description: Admin-configurable per zone + service_type. Money in kobo; pct as fractions.
      properties:
        zone: { type: string }
        service_type: { type: string }
        currency: { type: string, default: NGN }
        base_fare_kobo: { type: integer, format: int64 }
        per_km_kobo: { type: integer, format: int64 }
        per_min_kobo: { type: integer, format: int64 }
        min_fare_kobo: { type: integer, format: int64 }
        fare_floor_pct: { type: number, description: "offers must be >= system_fare * this" }
        fare_ceiling_pct: { type: number, description: "offers must be <= system_fare * this" }
        driver_profit_floor_kobo: { type: integer, format: int64, description: "accepted fare net of commission must be >= this" }
        surge_multiplier: { type: number }
        cancellation_fee_kobo: { type: integer, format: int64 }
        waiting_fee_per_min_kobo: { type: integer, format: int64 }
        active: { type: boolean }

    EstimateRequest:
      type: object
      required: [pickup, dest]
      properties:
        pickup: { $ref: '#/components/schemas/Place' }
        dest: { $ref: '#/components/schemas/Place' }
        service_type: { type: string, default: ride_hailing }

    FareEstimate:
      type: object
      properties:
        distance_m: { type: integer }
        duration_s: { type: integer }
        system_fare_kobo: { type: integer, format: int64 }
        offer_min_kobo: { type: integer, format: int64 }
        offer_max_kobo: { type: integer, format: int64 }
        polyline: { type: string }

    MobilityError:
      type: object
      properties:
        error: { type: string }
        code:
          type: string
          enum: [FARE_BELOW_FLOOR, FARE_ABOVE_CEILING, INVALID_STATE, PIN_MISMATCH, DRIVER_NOT_APPROVED, NOT_FOUND, FORBIDDEN]

    # ── FX Orchestration (normalized, provider-agnostic) ──────────────────────
    FxMoney:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, format: int64, description: Integer minor units (kobo/cents) }
        currency: { type: string, description: ISO-4217 code }
    FxFee:
      type: object
      properties:
        type: { type: string, enum: [provider_fee, rail_fee, paymax_spread] }
        amount: { $ref: '#/components/schemas/FxMoney' }
    FxRoute:
      type: object
      properties:
        provider: { type: string }
        corridor: { type: string }
        rail: { type: string, enum: [bank_transfer, mobile_money, iban, wallet, stablecoin] }
    FxAlternative:
      type: object
      properties:
        provider: { type: string }
        corridor: { type: string }
        rail: { type: string }
        all_in_rate: { type: number, format: double }
        destination: { $ref: '#/components/schemas/FxMoney' }
    FxQuoteRequest:
      type: object
      required: [source, destination, amount, intent]
      properties:
        source: { type: string, description: ISO-4217 }
        destination: { type: string, description: ISO-4217 }
        amount: { type: integer, format: int64, description: minor units of the amount_type side }
        amount_type: { type: string, enum: [source, destination], default: source }
        intent: { type: string, enum: [conversion, transfer, collection] }
        destination_rail: { type: string, enum: [bank_transfer, mobile_money, iban, wallet, stablecoin] }
        lock: { type: boolean, default: false }
    FxQuote:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [quoted, locked, consumed, expired] }
        amount_type: { type: string }
        source: { $ref: '#/components/schemas/FxMoney' }
        destination: { $ref: '#/components/schemas/FxMoney' }
        rate: { type: number, format: double, description: indicative mid }
        all_in_rate: { type: number, format: double, description: effective rate after spread+fees }
        fees: { type: array, items: { $ref: '#/components/schemas/FxFee' } }
        route: { $ref: '#/components/schemas/FxRoute' }
        alternatives: { type: array, items: { $ref: '#/components/schemas/FxAlternative' } }
        locked: { type: boolean }
        expires_at: { type: string, format: date-time }
    FxConversionRequest:
      type: object
      required: [quote_id]
      properties:
        quote_id: { type: string }
        customer_id: { type: string }
        reference: { type: string }
    FxConversion:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        status: { type: string, enum: [pending, settled, failed] }
        source: { $ref: '#/components/schemas/FxMoney' }
        destination: { $ref: '#/components/schemas/FxMoney' }
        rate: { type: number, format: double }
        all_in_rate: { type: number, format: double }
        fees: { type: array, items: { $ref: '#/components/schemas/FxFee' } }
        route: { $ref: '#/components/schemas/FxRoute' }
        provider_ref: { type: string }
        transaction_id: { type: string }
        created_at: { type: string, format: date-time }
    FxDestination:
      type: object
      required: [rail, currency, account_number]
      properties:
        rail: { type: string }
        currency: { type: string }
        scheme: { type: string }
        account_number: { type: string }
        bank_code: { type: string }
        counterparty:
          type: object
          properties: { name: { type: string } }
    FxTransferRequest:
      type: object
      properties:
        quote_id: { type: string, description: omit for same-currency transfer }
        customer_id: { type: string }
        beneficiary_id: { type: string }
        destination: { $ref: '#/components/schemas/FxDestination' }
        amount: { $ref: '#/components/schemas/FxMoney' }
        narration: { type: string }
        reference: { type: string }
    FxTransfer:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        status: { type: string, enum: [queued, processing, paid, failed, reversed] }
        source: { $ref: '#/components/schemas/FxMoney' }
        destination: { $ref: '#/components/schemas/FxMoney' }
        quoted_rate: { type: number, format: double }
        executed_rate: { type: number, format: double }
        fees: { type: array, items: { $ref: '#/components/schemas/FxFee' } }
        route: { $ref: '#/components/schemas/FxRoute' }
        provider_ref: { type: string }
        transaction_id: { type: string }
        status_history:
          type: array
          items:
            type: object
            properties: { status: { type: string }, at: { type: string, format: date-time } }
        created_at: { type: string, format: date-time }
    FxCollectionRequest:
      type: object
      required: [currency, type]
      properties:
        customer_id: { type: string }
        currency: { type: string }
        type: { type: string, enum: [virtual_account, iban] }
    FxVirtualAccount:
      type: object
      properties:
        id: { type: string }
        currency: { type: string }
        type: { type: string }
        provider: { type: string }
        status: { type: string }
        details: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    FxError:
      type: object
      properties:
        error:
          type: object
          properties:
            type: { type: string, enum: [invalid_request, authentication, rate_expired, insufficient_float, insufficient_balance, routing_unavailable, provider_error, compliance_block, conflict, rate_limited, internal] }
            code: { type: string }
            message: { type: string }
            param: { type: string, nullable: true }
            provider_ref: { type: string, nullable: true }
            request_id: { type: string }
    Error:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string

    KycTier:
      type: integer
      enum: [0, 1, 2, 3]
      description: "0=Unverified, 1=Basic, 2=Standard, 3=Premium"

    KycStatus:
      type: string
      enum: [unverified, pending, verified, failed, suspended]

    WalletBalance:
      type: object
      required: [available_kobo, pending_kobo, currency]
      properties:
        available_kobo:
          type: integer
          format: int64
          description: Spendable balance in kobo (projection of ledger)
        pending_kobo:
          type: integer
          format: int64
          description: Balance locked in pending topup intents
        currency:
          type: string
          enum: [NGN]

    LedgerEntry:
      type: object
      required: [id, type, amount_kobo, reference, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [CREDIT, DEBIT, REVERSAL_CREDIT, REVERSAL_DEBIT]
        amount_kobo:
          type: integer
          format: int64
        reference:
          type: string
          description: Human-readable reference (e.g. PAY_xxx, VOTE_xxx)
        description:
          type: string
        created_at:
          type: string
          format: date-time

    VirtualAccount:
      type: object
      required: [account_number, bank_name, bank_code, provisioned_at]
      properties:
        account_number:
          type: string
        bank_name:
          type: string
        bank_code:
          type: string
        provisioned_at:
          type: string
          format: date-time

    ReferralSummary:
      type: object
      required: [code, total_referrals, total_earned_kobo]
      properties:
        code:
          type: string
          description: Unique share code (e.g. SPOT-A1B2C3)
        total_referrals:
          type: integer
        total_earned_kobo:
          type: integer
          format: int64

    PaymaxTransferRecipient:
      type: object
      required: [user_id, display_name, masked_phone]
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
          description: Recipient's full name
        masked_phone:
          type: string
          description: Phone number with middle digits masked (e.g. 0801****678)
        avatar_url:
          type: string
          nullable: true

    WalletTransfer:
      type: object
      required: [id, reference, amount_kobo, fee_kobo, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        amount_kobo:
          type: integer
          format: int64
        fee_kobo:
          type: integer
          format: int64
        narration:
          type: string
          nullable: true
        status:
          type: string
          enum: [successful, failed, reversed]
        sender_display_name:
          type: string
          nullable: true
        receiver_display_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Bank:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          description: Paystack bank code (e.g. "058" for GTBank)
        name:
          type: string
        slug:
          type: string
          nullable: true
        type:
          type: string
          nullable: true

    BankTransfer:
      type: object
      required: [id, reference, amount_kobo, fee_kobo, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        amount_kobo:
          type: integer
          format: int64
        fee_kobo:
          type: integer
          format: int64
        account_name:
          type: string
        account_number_last4:
          type: string
        bank_name:
          type: string
        narration:
          type: string
          nullable: true
        status:
          type: string
          enum: [funds_reserved, provider_initiated, successful, failed, reversed]
        created_at:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not authorized (KYC tier or RBAC)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate or daily limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - bearerAuth: []

# ── KYC endpoints ─────────────────────────────────────────────────────────────

paths:
  # ╔══════════════════════════════════════════════════════════════════════╗
  # ║ SESSION HARDENING — #19 (refresh rotation + suspicious-login response)  ║
  # ║ Feature flag: FEATURE_SESSION_HARDENING_ENABLED (default OFF).          ║
  # ║ When OFF, every endpoint below returns 503 { error: feature_disabled }. ║
  # ║ Self routes require bearerAuth; admin routes additionally require the    ║
  # ║ users.suspend permission. Tokens are stored hashed only.                 ║
  # ╚══════════════════════════════════════════════════════════════════════╝
  /api/auth/sessions:
    get:
      operationId: listMySessions
      summary: List the caller's active auth sessions
      tags: [SessionHardening]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active sessions (no token material is ever returned)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        device: { type: string, description: non-PII device fingerprint }
                        ip: { type: string }
                        userAgent: { type: string }
                        rotationCounter: { type: integer }
                        lastSeenAt: { type: string, format: date-time, nullable: true }
                        expiresAt: { type: string, format: date-time }
                        createdAt: { type: string, format: date-time }
        '401': { description: Unauthenticated }
        '503': { description: Feature disabled (flag off) }
  /api/auth/sessions/{id}:
    delete:
      operationId: revokeMySession
      summary: Revoke one of the caller's own sessions
      tags: [SessionHardening]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Session revoked }
        '400': { description: Invalid / foreign session (object-level authz) }
        '401': { description: Unauthenticated }
        '503': { description: Feature disabled (flag off) }
  /api/auth/sessions/revoke-all:
    post:
      operationId: revokeAllMySessions
      summary: Revoke all of the caller's active sessions
      tags: [SessionHardening]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  revoked: { type: integer }
        '401': { description: Unauthenticated }
        '503': { description: Feature disabled (flag off) }
  /api/admin/users/{id}/force-logout:
    post:
      operationId: adminForceLogout
      summary: Admin — revoke all of a user's sessions (force logout)
      description: Requires the users.suspend permission. Audited; raises a security event.
      tags: [SessionHardening]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  revoked: { type: integer }
        '403': { description: Missing users.suspend permission }
        '503': { description: Feature disabled (flag off) }
  /api/admin/users/{id}/force-password-reset:
    post:
      operationId: adminForcePasswordReset
      summary: Admin — force a password reset and revoke the user's sessions
      description: Sets force_password_reset, revokes all sessions, notifies the user, audited as critical.
      tags: [SessionHardening]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Reset enforced; sessions revoked }
        '403': { description: Missing users.suspend permission }
        '503': { description: Feature disabled (flag off) }
  # ╔══════════════════════════════════════════════════════════════════════╗
  # ║ ESTATE SUPER-APP — Blocks 29-44 (Backend Agent 2)                      ║
  # ║ Base: /api/finance/estate/:id/...  ·  bearerAuth  ·  money in kobo.    ║
  # ║ Dues pay is the money path: Idempotency-Key header REQUIRED.           ║
  # ╚══════════════════════════════════════════════════════════════════════╝
  /api/finance/estate/{id}/dues/invoices:
    get:
      operationId: estateListInvoices
      summary: List dues invoices (own; admin sees all)
      tags: [Estate]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, paid, overdue, waived] } }
      responses:
        '200': { description: Invoice list }
    post:
      operationId: estateCreateInvoice
      summary: Bill a resident (estate admin only)
      tags: [Estate]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resident_id, category, amount_kobo, due_date]
              properties:
                resident_id: { type: string, format: uuid }
                property_id: { type: string, format: uuid }
                category: { type: string, enum: [service_charge, security_levy, waste, water, electricity, rent, facility, penalty, other] }
                amount_kobo: { type: integer, format: int64, minimum: 1, description: Minor units (kobo) }
                due_date: { type: string, format: date-time }
      responses:
        '201': { description: Invoice created }
        '403': { description: Not an estate admin }
  /api/finance/estate/{id}/dues/invoices/{invoiceId}/pay:
    post:
      operationId: estatePayDues
      summary: Pay a dues invoice from wallet (balanced double-entry; immutable receipt)
      description: >
        Debits the payer wallet and credits the estate settlement account in one
        balanced ledger journal. The Idempotency-Key header is REQUIRED and fails
        closed if absent (HTTP 400). Tier-limit checked fail-closed. Retries with
        the same key are no-ops returning the original receipt.
      tags: [Estate]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string }, description: Required — money mutation fails closed without it }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
