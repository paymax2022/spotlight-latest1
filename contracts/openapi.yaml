  /api/finance/fractionalre/offerings/{id}/subscribe:
    post:
      operationId: freSubscribe
      summary: Subscribe to an open round (MONEY PATH — wallet → escrow; idempotent replay per key)
      description: >
        Fail-closed order: idempotency replay, KYC tier >= 1, per-offer risk-ack,
        10%-income retail cap, tier wallet-debit limit, then a balanced
        double-entry escrow. Duplicate Idempotency-Key returns the existing
        subscription (never a second escrow).
      tags: [FractionalRE]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FreSubscribeRequest' }
      responses:
        '201': { description: Subscription escrowed (or replayed), content: { application/json: { schema: { $ref: '#/components/schemas/FreSubscription' } } } }
        '400': { description: Missing Idempotency-Key }
        '402': { description: Insufficient wallet balance }
        '403': { description: KYC / risk-ack / profile gate failed }
        '409': { description: Offering not open }
        '422': { description: Ticket range or annual cap exceeded }
