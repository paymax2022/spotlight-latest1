        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, default: 1 }
                idempotency_key: { type: string }
      responses:
        '201':
          description: Cart item added / updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CartItem' }
    delete:
      operationId: clearCart
      summary: Remove all items from the cart
      tags: [Pharmacy]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Cart cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /pharmacy/cart/{product_id}:
    patch:
      operationId: updateCartItem
      summary: Set quantity for a specific cart item
      tags: [Pharmacy]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: product_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Quantity updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CartItem' }
    delete:
      operationId: removeFromCart
      summary: Remove a single product from the cart
      tags: [Pharmacy]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: product_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Item removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /pharmacy/orders:
    post:
      operationId: createPharmacyOrder
      summary: Create a pharmacy order (payment HELD in escrow)
      description: >
        Prices every line server-side in kobo from the pharmacy catalog (never
        trusts the client), HOLDs the total on the escrow rail (HL-9) and opens
        the pharmacist review case. When `search_event_id` links the order to a
        prior symptom search, the review-case triage tier is resolved from that
        logged search (T1 auto-clears; T2+ routes to pharmacist review). Any
        rx_required line without search context still opens a PHARMACIST_REVIEW
        case — the POM gate applies regardless of entry path. Replay-safe on the
        idempotency key.
      tags: [Pharmacy]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pharmacy_provider_id, fulfilment_method, lines]
              properties:
                pharmacy_provider_id: { type: string, format: uuid }
                prescription_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Required when any line is rx_required (HL-3 e-Rx gate).
                fulfilment_method: { type: string, enum: [DELIVERY, PICKUP] }
                idempotency_key: { type: string, description: Fallback when the Idempotency-Key header is absent. }
                search_event_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    Optional link to the originating symptom search
                    (SymptomSearchResult.search_event_id). Drives review-case
                    tier resolution server-side and surfaces the search context
                    (terms, concepts, cluster, cohort) in the pharmacist console.
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Order created; payment HELD (HL-9)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  order: { $ref: '#/components/schemas/PharmacyOrder' }
        '422':
          description: >
            Validation / catalog / prescription / funds failure — or a per-SKU
            rolling-window quantity-cap rejection (code QTY_CAP_EXCEEDED with
            the remaining allowance; PRD §5.5, enforced fail-closed BEFORE the
            escrow hold).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/QuantityCapError'

  # ── Pharmacy — multi-pharmacy discovery + ratings ─────────────────────────────
  # A customer browses ALL APPROVED + discoverable pharmacies and picks one to
  # shop from — by proximity (PostGIS, mirroring the vet vertical's discovery
  # endpoint), by rating, or a plain list — rather than transacting against a
  # single pre-selected pharmacy_provider_id.
  /pharmacy/pharmacies:
    get:
      operationId: discoverPharmacies
      summary: Browse discoverable pharmacies (proximity, location, or rating)
      description: >
        Returns APPROVED + discoverable PHARMACY providers (HL-2). When `lat`
        and `lng` are both supplied (and sort is `distance` or omitted), results
        are ranked by PostGIS distance within `radius_m` (default 25km).
        Otherwise results are ranked by the server-computed rating aggregate or
        display name. avg_rating/rating_count are read-only projections of
        PharmacyReview — never client-set.
      tags: [Pharmacy]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: lat, in: query, schema: { type: number, format: double }, description: Caller latitude (WGS84). }
        - { name: lng, in: query, schema: { type: number, format: double }, description: Caller longitude (WGS84). }
        - { name: radius_m, in: query, schema: { type: number, format: double, default: 25000 }, description: Search radius in meters (distance sort only). }
        - { name: sort, in: query, schema: { type: string, enum: [distance, rating, name] }, description: Defaults to distance when lat/lng are present, otherwise rating. }
      responses:
        '200':
          description: Discoverable pharmacies, ranked per the resolved sort
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  pharmacies: { type: array, items: { $ref: '#/components/schemas/PharmacyProfile' } }

  /pharmacy/pharmacies/{id}:
    get:
      operationId: getPharmacy
      summary: Get a single discoverable pharmacy's detail
      tags: [Pharmacy]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pharmacy detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  pharmacy: { $ref: '#/components/schemas/PharmacyProfile' }
        '404': { description: Not found, or not currently discoverable }

  /pharmacy/pharmacies/{id}/reviews:
    get:
      operationId: listPharmacyReviews
      summary: List a pharmacy's public reviews
      tags: [Pharmacy]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Reviews, most recent first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  reviews: { type: array, items: { $ref: '#/components/schemas/PharmacyReview' } }

  /pharmacy/pharmacies/{id}/profile:
    post:
      operationId: upsertPharmacyProfile
      summary: Set the pharmacy's storefront profile (verified owner only)
      description: >
        HL-2: only the verified owner of this pharmacy provider may set its
        address, fulfilment support, and delivery fee. Rating fields are never
        accepted here — they are exclusively server-computed from
        PharmacyReview via a database trigger.
      tags: [Pharmacy]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address: { type: string }
                supports_pickup: { type: boolean }
                supports_delivery: { type: boolean }
                delivery_fee_kobo: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Profile saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  pharmacy: { $ref: '#/components/schemas/PharmacyProfile' }
        '422': { description: Not a verified pharmacy owner, or invalid input }

  /pharmacy/orders/{id}/reviews:
    post:
      operationId: submitPharmacyReview
      summary: Rate a completed pharmacy order
      description: >
        The order must belong to the caller and be DELIVERED, COLLECTED, or
        CLOSED — a review reflects a fulfilled experience, not an in-flight
        order. One review per order (replay-safe: a duplicate submit is
        rejected, not double-counted into the rating aggregate).
      tags: [Pharmacy]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: pharmacy_orders.id }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                body: { type: string }
      responses:
        '201':
          description: Review recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  review: { $ref: '#/components/schemas/PharmacyReview' }
        '422': { description: Order not found/owned, not yet completed, or already reviewed }

  # ── Pharmacy — symptom-based medication search ────────────────────────────────
  # Symptom-guided product discovery with professional review — NOT diagnosis and
  # NOT prescribing. Resolution: term → concept → condition cluster (triage tier
  # T1–T4) → therapeutic class → live SKUs. T3/T4 return an escalation_card and
  # NO class_groups. Gated by FEATURE_PHARMACY_SYMPTOM_SEARCH_ENABLED.
  # NDPR: symptom queries + refiners are sensitive health data — rate-limited per
  # device and excluded from general analytics.
  /pharmacy/symptom-search:
    post:
      operationId: pharmacySymptomSearch
      summary: Resolve symptom terms to triage tier + therapeutic-class product groups
      description: >
        Resolves free-text/chip symptom terms (English, Pidgin, Hausa, Yoruba, Igbo)
        against the pharmacist-approved taxonomy. T1 returns class_groups; T2 returns
        class_groups with pharmacist_confirmation_required=true; T3/T4 return an
        escalation_card and never products. Cohort exclusions (e.g. NSAIDs in
        pregnancy) SUPPRESS a class group entirely — never shown-but-disabled.
      tags: [Pharmacy]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terms]
              properties:
                terms:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, minLength: 2, maxLength: 80 }
                  description: Raw symptom terms as typed/tapped (any supported language).
                refiners:
                  type: object
                  properties:
                    who:
                      type: string
                      enum: [ADULT, CHILD_6_12, CHILD_UNDER_6, PREGNANT_OR_BF]
                      description: Cohort refiner. Absent ⇒ treated as ADULT for rules, but T2 cohort rules only fire when explicitly selected.
                    duration:
                      type: string
                      enum: [TODAY, D2_3, GT_3D]
                      description: Symptom duration bucket (maps to days 1 / 3 / 4 for rule comparators).
      responses:
        '200':
          description: Resolution result — exactly one triage tier
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SymptomSearchResult' }
        '404':
          description: No term matched the taxonomy (logged server-side for the curation loop)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { description: Per-device rate limit exceeded (mapping-IP scraping guard) }

  /pharmacy/classes/{id}/skus:
    get:
      operationId: listTherapeuticClassSkus
      summary: List in-stock, NAFDAC-registered SKUs for a therapeutic class
      description: >
        Resolves a therapeutic class to live SKUs at query time (stock, region, price).
        Only SKUs with classification OTC or PHARMACY_ONLY are returned from symptom
        search; POM and BLOCKED_ONLINE SKUs are never listed on this surface.
      tags: [Pharmacy]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: therapeutic_class id }
        - { name: region, in: query, schema: { type: string }, description: Fulfilment region filter (e.g. lagos) }
        - { name: who, in: query, schema: { type: string, enum: [ADULT, CHILD_6_12, CHILD_UNDER_6, PREGNANT_OR_BF] }, description: Cohort — applies age_min / pregnancy_safe SKU suppression }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: In-stock SKUs for the class (cohort-filtered)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PharmacySkuOption' } }
        '404':
          description: Unknown or inactive therapeutic class
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Pharmacy — admin (pharmacist console) · RBAC health.pharmacy.symptom.* ─────
  /admin/pharmacy/mappings:
    get:
      operationId: admListPharmacyMappings
      summary: List taxonomy rows for the mapping workbench (all statuses)
      description: >
        Console-read surface for the pharmacist mapping workbench. Returns taxonomy
        rows across ALL statuses (AI_SUGGESTED | APPROVED | RETIRED) so pharmacists
        can review AI-drafted entries before approval. entity=term returns term rows;
        entity=cluster returns clusters with their rules and cluster→class maps.
        RBAC: PHARMACIST / SUPERINTENDENT (health.pharmacy.symptom.mappings).
      tags: [Pharmacy Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: entity, in: query, required: true, schema: { type: string, enum: [term, cluster] }, description: Taxonomy entity to list. }
      responses:
        '200':
          description: Taxonomy rows for the requested entity (shape depends on entity)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/PharmacyMappingTerm'
                        - $ref: '#/components/schemas/PharmacyMappingCluster'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: admUpsertPharmacyMapping
      summary: Pharmacist console CRUD for symptom taxonomy mappings (audited)
      description: >
        Single suggest-approve write surface for the taxonomy: terms, concepts,
        clusters, cluster rules, therapeutic classes and cluster→class maps.
        RBAC: PHARMACIST / SUPERINTENDENT (health.pharmacy.symptom.mappings).
        Approving an AI_SUGGESTED term records approved_by + approved_at — nothing
        AI-drafted is user-visible until approved. All writes audit-logged.
      tags: [Pharmacy Admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity, action, payload]
              properties:
                entity:
                  type: string
                  enum: [term, concept, cluster, cluster_rule, therapeutic_class, cluster_class_map]
                action:
                  type: string
                  enum: [create, update, approve, retire]
                  description: retire (not delete) — taxonomy rows are never hard-deleted.
                payload:
                  type: object
                  description: Entity-shaped body (e.g. term = {term, language, concept_id}; cluster_rule = {cluster_id, expression, priority}).
      responses:
        '200':
          description: Mapping written (returns the affected row with version/approval stamps)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Version conflict or illegal transition (e.g. approving an already-retired term) }

  /admin/pharmacy/reviews:
    get:
      operationId: admListPharmacyReviewCases
      summary: List review cases for the pharmacist queue
      description: >
        Console-read surface for the pharmacist review queue. Object-level authz:
        results are scoped to cases assigned to the caller's premises tenant.
        RBAC: health.pharmacy.symptom.reviews.
      tags: [Pharmacy Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: state, in: query, required: false, schema: { type: string, enum: [SUBMITTED, AUTO_CLEARED, PHARMACIST_REVIEW, NEEDS_INFO, APPROVED, REJECTED] }, description: Filter by case state; absent ⇒ all states. }
      responses:
        '200':
          description: Review cases (tenant-scoped, optionally filtered by state)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PharmacyReviewCase' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/pharmacy/reviews/{id}:
    get:
      operationId: admGetPharmacyReviewCase
      summary: Review case detail with cart lines and state history
      description: >
        Full case detail for the pharmacist console: the review case plus the order's
        cart lines (with classification) and the audited state-transition history.
        Object-level authz: a pharmacist may only read cases assigned to their
        premises tenant. RBAC: health.pharmacy.symptom.reviews.
      tags: [Pharmacy Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: pharmacy_review_case id }
      responses:
        '200':
          description: Case detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PharmacyReviewCaseDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Case not found (or outside caller's premises tenant) }

  /admin/pharmacy/reviews/{id}/decision:
    post:
      operationId: admDecidePharmacyReviewCase
      summary: Pharmacist decides a gated review case (guarded state machine, audited)
      description: >
        Guarded transition on pharmacy_review_case: PHARMACIST_REVIEW → APPROVED |
        REJECTED | NEEDS_INFO (NEEDS_INFO may return to PHARMACIST_REVIEW).
        Object-level authz: a pharmacist may only decide cases assigned to their
        premises tenant. REJECT triggers the order refund path (ledger reversal
        entries — never a balance edit). RBAC: health.pharmacy.symptom.reviews.
      tags: [Pharmacy Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: pharmacy_review_case id }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT, NEEDS_INFO] }
                note: { type: string, maxLength: 2000, description: Required for REJECT and NEEDS_INFO. }
      responses:
        '200':
          description: Case transitioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PharmacyReviewCase' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Case not found (or outside caller's premises tenant) }
        '409': { description: Illegal state transition }

  /admin/pharmacy/symptom/metrics:
    get:
      operationId: admPharmacySymptomMetrics
      summary: Safety KPIs for the pharmacist console (PRD §9)
      description: >
        Aggregated safety metrics over the review-case machine and the symptom
        query log — review-case volume by state and tier (last 7 days), open
        cases past SLA, median decision latency, 24h search volume and the
        share of searches resolving T2+ (last 7 days). Aggregate-safe only:
        no per-user rows, no terms, no PII (NDPR). Mounted at
        GET /api/health/pharmacy/admin/symptom/metrics.
        RBAC: health.pharmacy.symptom.reviews.
      tags: [Pharmacy Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Safety metrics snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SymptomSafetyMetrics' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Transport ─────────────────────────────────────────────────────────────────
  /transport/trips:
    post:
      operationId: requestTrip
      summary: Request a ride (escrows fare)
      tags: [Transport]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup_address, dest_address, fare_kobo, idempotency_key]
              properties:
                pickup_address: { type: string }
                dest_address: { type: string }
                fare_kobo: { type: integer, format: int64, minimum: 150000 }
                idempotency_key: { type: string }
      responses:
        '201':
          description: Trip requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }

  /transport/trips/{id}/accept:
    post:
      operationId: acceptTrip
      summary: Driver accepts a trip request
      tags: [Transport]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Trip accepted }

  /transport/trips/{id}/status:
    patch:
      operationId: updateTripStatus
      summary: Advance trip status (driver/system)
      tags: [Transport]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [accepted, picked_up, completed, cancelled]
      responses:
        '200': { description: Status updated }

  # Driver-profile routes (no money; self-scoped by user_id). These are the
  # currently-registered /transport endpoints; the legacy money-path trip routes
  # above were REMOVED from the backend and supersede by /mobility + /driver.
  /transport/drivers:
    post:
      operationId: registerDriver
      summary: Register the caller as a driver (basic profile)
      tags: [Transport]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDriverRequest' }
      responses:
        '201':
          description: Driver profile created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Driver' }

  /transport/drivers/status:
    patch:
      operationId: setDriverStatus
      summary: Set driver online/offline status
      tags: [Transport]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [online, offline, on_trip] }
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Driver' }

  # ── Mobility (ride-hailing) — customer ────────────────────────────────────────
  /mobility/home:
    get:
      operationId: mobilityHome
      summary: Rider mobility landing payload
      tags: [Mobility]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Home payload (active trip, profile, tiles, safety reminder) }

  /mobility/config/pricing:
    get:
      operationId: mobilityPricingConfig
      summary: Active pricing config for a zone + service type
      tags: [Mobility]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: zone, in: query, schema: { type: string } }
        - { name: service_type, in: query, schema: { type: string } }
      responses:
        '200':
          description: Pricing config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingConfig' }

  /mobility/rides/estimate:
    post:
      operationId: estimateRide
      summary: Fare estimate + negotiable offer range
      tags: [Mobility]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstimateRequest' }
      responses:
        '200':
          description: Estimate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FareEstimate' }

  /mobility/rides/request:
    post:
      operationId: requestRide
      summary: Request a ride (escrows fare; instant or offer mode)
      tags: [Mobility]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
