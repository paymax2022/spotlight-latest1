    # ── Featured Placement (paid promotion of subjects into curated zones) ─────
    # Money fields are integers in minor units (kobo). Campaigns move through a
    # review → payment → serving state machine; the public landing resolver and
    # the events ingest endpoint are the read/serving surface.
    PlacementZone:
      type: object
      required: [code, label, layout_type, capacity, base_daily_rate_kobo, tier_multiplier, position]
      properties:
        code: { type: string, description: Stable zone identifier (e.g. home_hero). }
        label: { type: string }
        layout_type:
          type: string
          enum: [EXCLUSIVE, POOLED]
          description: EXCLUSIVE = one campaign owns the slot; POOLED = rotated set.
        capacity: { type: integer, description: Max concurrent campaigns the zone serves. }
        base_daily_rate_kobo: { type: integer, format: int64 }
        tier_multiplier: { type: number, format: double, description: Merchant-tier price multiplier. }
        position: { type: integer, description: Render order of the zone on the surface. }
        creative_spec:
          type: object
          description: Per-zone creative constraints (image dimensions, copy limits).
          additionalProperties: true
    Creative:
      type: object
      required: [headline]
      properties:
        headline: { type: string }
        image_ref: { type: string, description: Storage ref (R2 key) for the creative image. }
        cta: { type: string, description: Call-to-action label. }
        deep_link: { type: string, description: In-app deep link the tap resolves to. }
    FeaturedCampaign:
      type: object
      required: [id, merchant_id, subject_type, subject_id, zone_code, window_start, window_end, duration_days, state, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        subject_type: { type: string, description: Kind of entity being promoted (e.g. listing, event). }
        subject_id: { type: string, description: Identifier of the promoted subject. }
        zone_code: { type: string }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        duration_days: { type: integer }
        creative: { $ref: '#/components/schemas/Creative' }
        quoted_price_kobo: { type: integer, format: int64 }
        rate_version: { type: string, description: Version of the rate card used for the quote. }
        state:
          type: string
          enum: [DRAFT, SUBMITTED, UNDER_REVIEW, NEEDS_MORE_INFO, REJECTED, PENDING_PAYMENT, SCHEDULED, ACTIVE, PAUSED, SUSPENDED, CANCELLED, CANCELLED_EARLY, COMPLETED]
        payment_ref: { type: string, description: Ledger / provider payment reference once paid. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PlacementQuote:
      type: object
      required: [quoted_price_kobo, rate_version, breakdown]
      properties:
        quoted_price_kobo: { type: integer, format: int64 }
        rate_version: { type: string }
        breakdown:
          type: object
          required: [base_daily_rate_kobo, duration_days, tier_multiplier]
          properties:
            base_daily_rate_kobo: { type: integer, format: int64 }
            duration_days: { type: integer }
            tier_multiplier: { type: number, format: double }
            duration_discount_pct: { type: number, format: double }
            fees_kobo: { type: integer, format: int64 }
    CampaignCreate:
      type: object
      required: [subject_type, subject_id, zone_code, window_start, duration_days]
      properties:
        subject_type: { type: string }
        subject_id: { type: string }
        zone_code: { type: string }
        window_start: { type: string, format: date-time }
        duration_days: { type: integer }
        creative: { $ref: '#/components/schemas/Creative' }
    ServedPlacement:
      type: object
      required: [campaign_id, placement_token, subject_type, subject_id]
      properties:
        campaign_id: { type: string, format: uuid }
        placement_token: { type: string, description: Opaque token bound to this serve; echoed back on events. }
        subject_type: { type: string }
        subject_id: { type: string }
        creative: { $ref: '#/components/schemas/Creative' }
        label: { type: string, description: Disclosure label (e.g. "Sponsored"). }
    LandingPlacements:
      type: object
      required: [zones]
      properties:
        zones:
          type: array
          items:
            type: object
            required: [zone_code, layout_type, items]
            properties:
              zone_code: { type: string }
              layout_type: { type: string, enum: [EXCLUSIVE, POOLED] }
              items:
                type: array
                items: { $ref: '#/components/schemas/ServedPlacement' }
    PlacementEventsBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            type: object
            required: [campaign_id, type, placement_token]
            properties:
              campaign_id: { type: string, format: uuid }
              type: { type: string, enum: [impression, tap] }
              placement_token: { type: string }
              session_id: { type: string }

    # ── Nutrition Resolution Engine ───────────────────────────────────────────
    # Resolves a dish to a per-serving nutrient profile + allergen declarations.
    # Nutrient quantities are NUMBERS (grams/kcal/mg), NOT integers (kobo).
    # Each value carries a low/high band to express estimation uncertainty.
    NutrientValue:
      type: object
      required: [value, low, high]
      properties:
        value: { type: number, description: Point estimate for the nutrient. }
        low: { type: number, description: Lower bound of the estimation band. }
        high: { type: number, description: Upper bound of the estimation band. }
    DishNutritionProfile:
      type: object
      description: >
        Resolved nutrition output bound to a menu item. At menu upload the engine
        auto-estimates every dish and AUTO-PUBLISHES it as AI_ESTIMATE — nutrition
        is live from Day 1 with zero vendor action. The vendor may later approve
        (status → RESTAURANT_CONFIRMED) or lightly edit; RESTAURANT_CONFIRMED is
        higher trust but STILL an estimate (approval ≠ exact). EXACT is reserved
        for packaged/barcoded items resolved from a real label. `grounding`
        records which knowledge source the AI used; `confidence` and the per-serving
        low/high band express estimation uncertainty.
      required: [dish_id, grounding, confidence, status, portion_label, portion_size_g, per_serving, composition_version, display, disclaimer]
      properties:
        dish_id: { type: string, format: uuid }
        grounding:
          type: string
          description: >
            Which knowledge source the AI grounded the estimate in. LABEL =
            packaged-goods barcode/label fast-path; LIBRARY_MATCHED = matched the
            Nigerian grounding library (WAFCT/NFCT-backed); FREE_ESTIMATED = no
            library match, estimated from name/description/photo; RECIPE =
            optional power-user ingredient declaration.
          enum: [LABEL, LIBRARY_MATCHED, FREE_ESTIMATED, RECIPE]
        confidence: { type: string, enum: [EXACT, MEDIUM, LOW] }
        status:
          type: string
          description: >
            Honesty state. AI_ESTIMATE = auto-published estimate, no vendor action
            needed; RESTAURANT_CONFIRMED = vendor approved but STILL an estimate;
            EXACT = label-only (packaged/barcoded); STALE = name/photo/portion or
            composition-version change invalidated the profile, pending re-estimate.
          enum: [AI_ESTIMATE, RESTAURANT_CONFIRMED, EXACT, STALE]
        portion_label:
          type: string
          description: Selected portion size; rescales all per-serving values.
          enum: [small, regular, large]
        portion_size_g: { type: number }
        per_serving:
          type: object
          required: [energy_kcal, protein_g, carb_g, sugar_g, fat_g, sat_fat_g, fiber_g, sodium_mg]
          properties:
            energy_kcal: { $ref: '#/components/schemas/NutrientValue' }
            protein_g: { $ref: '#/components/schemas/NutrientValue' }
            carb_g: { $ref: '#/components/schemas/NutrientValue' }
            sugar_g: { $ref: '#/components/schemas/NutrientValue' }
            fat_g: { $ref: '#/components/schemas/NutrientValue' }
            sat_fat_g: { $ref: '#/components/schemas/NutrientValue' }
            fiber_g: { $ref: '#/components/schemas/NutrientValue' }
            sodium_mg: { $ref: '#/components/schemas/NutrientValue' }
        composition_version: { type: integer }
        display:
          type: object
          required: [band, traffic_lights]
          properties:
            band: { type: string, enum: [Light, Balanced, Heavy] }
            traffic_lights:
              type: object
              required: [sodium_mg, sugar_g, sat_fat_g]
              properties:
                sodium_mg: { type: string, enum: [green, amber, red] }
                sugar_g: { type: string, enum: [green, amber, red] }
                sat_fat_g: { type: string, enum: [green, amber, red] }
        allergens:
          type: array
          items: { $ref: '#/components/schemas/AllergenDeclaration' }
        badges:
          type: array
          items: { type: string }
        disclaimer: { type: string }
    AllergenDeclaration:
      type: object
      required: [dish_id, allergen, declaration_type, source, cross_contamination_ack]
      properties:
        dish_id: { type: string, format: uuid }
        allergen:
          type: string
          enum: [peanut, tree_nut, milk, egg, fish, crustacean_shellfish, soy, wheat_gluten, sesame, mustard, celery, sulphites, lupin]
        declaration_type: { type: string, enum: [CONTAINS, MAY_CONTAIN, FREE_FROM] }
        source: { type: string, enum: [VENDOR, AI] }
        attested_by: { type: string }
        attested_at: { type: string, format: date-time }
        cross_contamination_ack: { type: boolean }
    AllergenAttest:
      type: object
      required: [allergen, declaration_type, cross_contamination_ack]
      properties:
        allergen:
          type: string
          enum: [peanut, tree_nut, milk, egg, fish, crustacean_shellfish, soy, wheat_gluten, sesame, mustard, celery, sulphites, lupin]
        declaration_type: { type: string, enum: [CONTAINS, MAY_CONTAIN, FREE_FROM] }
        cross_contamination_ack: { type: boolean }
    RecipeDeclare:
      type: object
      required: [ingredients, portion_size_g]
      properties:
        ingredients:
          type: array
          items:
            type: object
            required: [food_code, source, quantity_g]
            properties:
              food_code: { type: string }
              source: { type: string }
              quantity_g: { type: number }
              prep_method: { type: string }
        portion_size_g: { type: number }
        cook_method: { type: string }
    CartNutritionSummary:
      type: object
      required: [total, items, disclaimer]
      properties:
        total:
          type: object
          required: [energy_kcal, protein_g, carb_g, sugar_g, fat_g, sat_fat_g, fiber_g, sodium_mg]
          properties:
            energy_kcal: { $ref: '#/components/schemas/NutrientValue' }
            protein_g: { $ref: '#/components/schemas/NutrientValue' }
            carb_g: { $ref: '#/components/schemas/NutrientValue' }
            sugar_g: { $ref: '#/components/schemas/NutrientValue' }
            fat_g: { $ref: '#/components/schemas/NutrientValue' }
            sat_fat_g: { $ref: '#/components/schemas/NutrientValue' }
            fiber_g: { $ref: '#/components/schemas/NutrientValue' }
            sodium_mg: { $ref: '#/components/schemas/NutrientValue' }
        items:
          type: array
          items: { $ref: '#/components/schemas/DishNutritionProfile' }
        worst_traffic_lights:
          type: object
          properties:
            sodium_mg: { type: string, enum: [green, amber, red] }
            sugar_g: { type: string, enum: [green, amber, red] }
            sat_fat_g: { type: string, enum: [green, amber, red] }
        disclaimer: { type: string }
    CompositionReferenceInput:
      type: object
      required: [food_code, per_100g]
      properties:
        food_code: { type: string }
        name: { type: string }
        source: { type: string }
        per_100g:
          type: object
          additionalProperties: { type: number }
        composition_version: { type: integer }
    DishLibraryInput:
      type: object
      required: [name, per_serving]
      properties:
        name: { type: string }
        category: { type: string }
        portion_size_g: { type: number }
        per_serving:
          type: object
          additionalProperties: { type: number }
        default_allergens:
          type: array
          items: { type: string }
    ReresolveRequest:
      type: object
      properties:
        dish_ids:
          type: array
          items: { type: string, format: uuid }
        reason: { type: string }
        force: { type: boolean }
    EditNutritionRequest:
      type: object
      description: >
        Lightweight vendor edit — portion selector and/or direct macro nudge only.
        NEVER asks for ingredients; ingredient entry is an optional hidden
        power-user path via the recipe endpoint. Applying an edit and approving
        moves the profile to RESTAURANT_CONFIRMED (still an estimate).
      properties:
        portion_label:
          type: string
          description: Rescales all per-serving values automatically.
          enum: [small, regular, large]
        macros:
          type: array
          description: Direct macro nudges if the vendor knows better.
          items:
            type: object
            required: [nutrient, value]
            properties:
              nutrient:
                type: string
                enum: [energy_kcal, protein_g, carb_g, sugar_g, fat_g, sat_fat_g, fiber_g, sodium_mg]
              value: { type: number }
    AutoSuggestResponse:
      type: object
      description: >
        Result of batch auto-estimating + auto-publishing a restaurant's whole menu
        at upload. Each dish is published as AI_ESTIMATE with zero vendor action.
      required: [published, dishes]
      properties:
        published: { type: integer, description: Number of dishes auto-estimated and published as AI_ESTIMATE. }
        dishes:
          type: array
          items: { $ref: '#/components/schemas/DishNutritionProfile' }

    # ── Telemedicine Pre-Consultation Intake ──────────────────────────────────
    # Patient-reported decision-support captured BEFORE the consult. IN_CONSULT is
    # structurally blocked until the appointment's intake status is SUBMITTED.
    # Intake is sensitive health data: visible only to the assigned doctor for the
    # appointment (object-level access) plus the patient, and every doctor access
    # is audit-logged. Intake is NOT a diagnosis — it is clinician decision-support.
    ConsultIntake:
      type: object
      description: >
        A patient's pre-consultation health intake bound to one appointment.
        Status gates the consult: IN_CONSULT is unreachable until status=SUBMITTED.
        Red-flag triage runs at submit (see RedFlagResult). Patient-reported data,
        not a diagnosis. Visible only to the assigned doctor (object-level) + patient.
      required: [appointment_id, consult_id, status, consent_version]
      properties:
        appointment_id: { type: string, format: uuid }
        consult_id: { type: string, format: uuid }
        status:
          type: string
          description: DRAFT auto-saves as the patient fills the wizard; SUBMITTED unlocks READY_FOR_CONSULT.
          enum: [DRAFT, SUBMITTED]
        consent_version: { type: string, description: Version of the consent text the patient accepted (shared-with-doctor consent). }
        red_flag_level: { type: string, nullable: true, description: Triage level assigned at submit, if any (e.g. NONE/URGENT/EMERGENCY). }
        red_flag_severity:
          type: string
          nullable: true
          description: Severity of the highest red-flag hit at submit, if triggered.
          enum: [emergency, urgent]
        red_flag_hits:
          type: array
          description: Codes of red-flag rules that matched at submit (decision-support, not diagnosis).
          items: { type: string }
        attachments:
          type: array
          description: Patient-uploaded photos / lab results / prior prescriptions (object-keyed; access-controlled).
          items: { $ref: '#/components/schemas/IntakeAttachment' }
        submitted_at: { type: string, format: date-time, nullable: true }

    IntakeAttachment:
      type: object
      required: [key, content_type]
      properties:
        key: { type: string, description: Storage object key (R2). }
        content_type: { type: string }
        filename: { type: string }
        size_bytes: { type: integer }
        uploaded_at: { type: string, format: date-time }

    IntakeFormField:
      type: object
      required: [name, type, required]
      properties:
        name: { type: string }
        type: { type: string, description: 'Widget/value type, e.g. text, textarea, number, single_select, multi_select, slider, boolean, file.' }
        required: { type: boolean }
        label: { type: string }
        options:
          type: array
          description: Choices for select-type fields.
          items: { type: string }

    IntakeSchema:
      type: object
      description: >
        Versioned, schema-driven intake form. Admin-managed via the Form Builder
        so questions/ordering/required can change WITHOUT code. The form renders
        only what the profile doesn't already know (pre-fill from profile + last intake).
      required: [version, fields]
      properties:
        version: { type: integer }
        fields:
          type: array
          items: { $ref: '#/components/schemas/IntakeFormField' }

    IntakeBundle:
      type: object
      description: >
        Everything the patient app needs to render + resume intake for an
        appointment: the current intake, the active form schema, server-computed
        pre-fill (from profile + last intake), and the consent text/version to show.
      required: [intake, schema, consent]
      properties:
        intake: { $ref: '#/components/schemas/ConsultIntake' }
        schema: { $ref: '#/components/schemas/IntakeSchema' }
        prefill:
          type: object
          description: Pre-filled answers (keyed by field name) from the patient's profile and last intake; never re-asks known data.
          additionalProperties: true
        consent: { $ref: '#/components/schemas/ConsentVersion' }

    IntakeDraft:
      type: object
      description: >
        Partial intake answers saved as the patient progresses (offline-first,
        auto-save). PUT-ing a draft never runs red-flag triage and never submits.
      required: [answers]
      properties:
        answers:
          type: object
          description: Field-name → value map of answers captured so far.
          additionalProperties: true
        schema_version: { type: integer, description: Schema version the draft was authored against. }

    RedFlagResult:
      type: object
      description: >
        Outcome of the red-flag triage gate run at submit. Surfaces urgent-care /
        crisis guidance and routing instead of silently queuing a routine consult.
        Product-safety gate — decision-support, not a diagnosis.
      required: [severity, routing, guidance]
      properties:
        severity:
          type: string
          enum: [emergency, urgent]
        routing:
          type: string
          enum: [EMERGENCY, URGENT_CARE, CRISIS]
        guidance:
          type: object
          required: [title, body]
          properties:
            title: { type: string }
            body: { type: string }
            crisis_line: { type: string, description: Crisis/self-harm helpline number to surface (CRISIS routing). }
            show_emergency_number: { type: boolean, description: Whether the app should prominently surface the local emergency number. }

    IntakeSubmitResult:
      type: object
      description: >
        Result of submitting an intake. On a clean submit the appointment moves to
        READY_FOR_CONSULT. If red-flag triage fires, red_flag carries urgent-care /
        crisis guidance + routing (the consult is not silently queued as routine).
      required: [status]
      properties:
        status:
          type: string
          enum: [DRAFT, SUBMITTED]
        red_flag: { $ref: '#/components/schemas/RedFlagResult' }

    PresignResult:
      type: object
      description: Presigned upload target for an intake attachment (R2 / S3-compatible).
      required: [upload_url, key]
      properties:
        upload_url: { type: string, format: uri }
        key: { type: string }
        method: { type: string, default: PUT }
        headers:
          type: object
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }

    DoctorSummary:
      type: object
      description: >
        One-screen structured intake summary for the ASSIGNED doctor at consult
        start, ordered for clinical use (chief complaint → symptom detail →
        allergies & current meds [highlighted] → chronic conditions → pregnancy →
        vitals → attachments). Object-level access only; every read is audit-logged.
        Patient-reported throughout — decision-support, NOT a diagnosis.
      required: [sections, allergies, current_medications, patient_reported, disclaimer]
      properties:
        sections:
          type: array
          description: Ordered, expandable summary sections.
          items:
            type: object
            required: [title]
            properties:
              title: { type: string }
              body: { type: string }
              highlight: { type: boolean, description: Safety-critical section surfaced prominently (e.g. allergies, current meds). }
        allergies:
          type: array
          description: Safety-critical — surfaced prominently and carried into any e-prescribing step.
          items: { type: string }
        current_medications:
          type: array
          description: Safety-critical — surfaced prominently and carried into any e-prescribing step.
          items: { type: string }
        patient_reported:
          type: boolean
          const: true
          description: Always true — intake is patient-reported, not clinician-assessed.
        disclaimer: { type: string }

    HealthProfile:
      type: object
      description: >
        The patient's longitudinal health record used to pre-fill future intakes
        (never re-ask known data). Patient-owned; never exposed beyond the care
        relationship.
      required: [conditions, medications, allergies]
      properties:
        conditions:
          type: array
          items: { type: string }
        medications:
          type: array
          items: { type: string }
        allergies:
          type: array
          items: { type: string }

    RedFlagRule:
      type: object
      description: Admin-defined rule that triggers the triage gate and the guidance/routing it produces.
      required: [code, severity, routing]
      properties:
        code: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        severity:
          type: string
          enum: [emergency, urgent]
        routing:
          type: string
          enum: [EMERGENCY, URGENT_CARE, CRISIS]
        match:
          type: object
          description: Condition that fires the rule (field/operator/value), evaluated at submit.
          additionalProperties: true
        guidance:
          type: object
          properties:
            title: { type: string }
            body: { type: string }
            crisis_line: { type: string }
            show_emergency_number: { type: boolean }

    ConsentVersion:
      type: object
      description: A versioned consent text ("shared with your doctor to provide care"); each patient's accepted version is tracked.
      required: [version, body]
      properties:
        version: { type: string }
        body: { type: string }
        active: { type: boolean }
        published_at: { type: string, format: date-time }

    ClinicalVocabItem:
      type: object
      description: An entry in a maintained clinical vocabulary (conditions, allergens, or the medication lookup source).
      required: [kind, code, label]
      properties:
        kind: { type: string, enum: [condition, allergen, medication] }
        code: { type: string }
        label: { type: string }
        active: { type: boolean }

    IntakeConfig:
      type: object
      description: A keyed intake configuration value (e.g. reminder cadence, doctor-summary template, localization copy).
      required: [key, value]
      properties:
        key: { type: string }
        value:
          description: Arbitrary JSON config payload for the key.
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }

    MonitoringRow:
      type: object
      description: One row of the intake monitoring view — appointment + intake status, with incomplete-near-appointment alerting.
      properties:
        appointment_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        doctor_id: { type: string, format: uuid, nullable: true }
        intake_status:
          type: string
          enum: [INTAKE_PENDING, DRAFT, SUBMITTED]
        appointment_at: { type: string, format: date-time }
        incomplete_near_appointment: { type: boolean }
        red_flag_severity:
          type: string
          nullable: true
          enum: [emergency, urgent]

    AccessLogEntry:
      type: object
      description: One audit-log entry for an intake (who accessed which intake when; consent + red-flag events).
      required: [actor_id, action, occurred_at]
      properties:
        actor_id: { type: string, format: uuid }
        actor_role: { type: string }
        appointment_id: { type: string, format: uuid }
        action: { type: string, description: 'e.g. DOCTOR_VIEW_INTAKE, CONSENT_ACCEPTED, RED_FLAG_TRIGGERED, ADMIN_VIEW_RECORD.' }
        occurred_at: { type: string, format: date-time }

    IntakeAnalytics:
      type: object
      description: Completion + clinical analytics (completion rate, per-step drop-off, time-to-complete, common complaints/conditions, red-flag rate). De-identified/aggregated.
      properties:
        completion_rate: { type: number }
        avg_time_to_complete_seconds: { type: number }
        step_dropoff:
          type: array
          items:
            type: object
            properties:
              step: { type: string }
              dropoff_rate: { type: number }
        top_complaints:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              count: { type: integer }
        top_conditions:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              count: { type: integer }
        red_flag_trigger_rate: { type: number }


    # ── Relocated schemas (were appended under paths: by a merge step that
    #    never ran; moved here so $ref targets resolve). ─────────────────

    KYCProfile:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        kyc_tier: { type: integer, minimum: 0, maximum: 3 }
        kyc_status: { type: string, enum: [none, pending, submitted, verified, failed] }
        kyc_submitted_at: { type: string, format: date-time, nullable: true }
        kyc_verified_at: { type: string, format: date-time, nullable: true }
        phone_verified: { type: boolean }
        document_type: { type: string, nullable: true }
        requested_tier: { type: integer, nullable: true }

    FXQuote:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        source_currency: { type: string }
        target_currency: { type: string }
        source_amount_kobo: { type: integer, format: int64 }
        target_amount_minor: { type: integer, format: int64 }
        rate: { type: number, format: double }
        fee_kobo: { type: integer, format: int64 }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    FXConversion:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        quote_id: { type: string, format: uuid }
        source_currency: { type: string }
        target_currency: { type: string }
        source_amount_kobo: { type: integer, format: int64 }
        target_amount_minor: { type: integer, format: int64 }
        rate: { type: number, format: double }
        fee_kobo: { type: integer, format: int64 }
        status: { type: string, enum: [pending, completed, failed, reversed] }
        reference: { type: string }
        created_at: { type: string, format: date-time }

    CurrencyWallet:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        currency: { type: string, minLength: 3, maxLength: 3 }
        balance_minor: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    # ── Groups ──────────────────────────────────────────────────────────────────
    Group:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        created_by: { type: string, format: uuid }
        avatar_url: { type: string, nullable: true }
        is_public: { type: boolean }
        member_count: { type: integer }
        created_at: { type: string, format: date-time }

    SubscriptionPayment:
      type: object
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        amount_kobo: { type: integer, format: int64 }
        status: { type: string, enum: [paid, pending, overdue, refunded] }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    # ── Events (Top-5 Phase 2 — event ticketing + cashless event wallet) ─────────
    # Supersedes the old 2-endpoint stub. Canonical implementation:
    # backend/internal/top5events (model.go / service.go / handler.go). Money
    # fields are integer kobo; timestamps are ISO8601; enums match model.go exactly.
    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        organiser_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        venue: { type: string, nullable: true }
        state:
          type: string
          enum: [DRAFT, SUBMITTED, APPROVED, LIVE, CLOSED, SUSPENDED]
        category: { type: string, nullable: true, description: "Discovery filter, e.g. music/tech/sports/comedy/faith" }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        fee_bps: { type: integer, description: "Platform fee in basis points on vendor settlement (0-10000)" }
        created_at: { type: string, format: date-time }

    EventSummary:
      description: Lightweight discovery-feed projection returned by GET /events.
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        venue: { type: string, nullable: true }
        state:
          type: string
          enum: [DRAFT, SUBMITTED, APPROVED, LIVE, CLOSED, SUSPENDED]
        category: { type: string, nullable: true }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        min_price_kobo: { type: integer, format: int64, description: "MIN(price_kobo) across active tiers; 0 if free/no active tiers" }
        sold_out: { type: boolean }

    TicketTier:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        name: { type: string }
        price_kobo: { type: integer, format: int64 }
        capacity: { type: integer, description: "0 = unlimited" }
        sold: { type: integer }
        active: { type: boolean }

    PromoCode:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        code: { type: string }
        version: { type: integer }
        percent_off: { type: integer, minimum: 0, maximum: 100 }
        max_uses: { type: integer, description: "0 = unlimited" }
        used: { type: integer }
        active: { type: boolean }

    EventOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        buyer_id: { type: string, format: uuid }
        total_kobo: { type: integer, format: int64 }
        status: { type: string, enum: [PAID, REFUNDED] }
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }

    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        tier_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        state:
          type: string
          enum: [ISSUED, TRANSFERRED, USED, REFUNDED]
        credential_id: { type: string, format: uuid }
        price_paid_kobo: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    EventWallet:
      description: Per-attendee closed-loop cashless sub-balance for one event (NL-3).
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        state:
          type: string
          enum: [OPEN, SPENDING, CLOSED]
        balance_kobo: { type: integer, format: int64, description: "Projection of event_wallet_ledger" }
        credential_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    EventWalletEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        type: { type: string, enum: [TOPUP, CHARGE, REFUND] }
        amount_kobo: { type: integer, format: int64 }
        reference: { type: string }
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }

    Vendor:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, description: "Payout beneficiary" }
        name: { type: string }
        active: { type: boolean }
        credential_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    VendorCharge:
      type: object
      properties:
        id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        amount_kobo: { type: integer, format: int64 }
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }

