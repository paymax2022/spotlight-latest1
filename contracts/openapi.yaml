      responses:
        '200':
          description: Offer declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktOffer' }

  # ── Orders + Disputes REMOVED (ADR-023 listings-and-connect pivot) ─────
  # The escrow order FSM (/orders, /orders/{id}, /orders/{id}/{fund,accept,
  # confirm-delivery,cancel,dispute,review}) and the dispute endpoints
  # (/disputes/{id}, /disputes/{id}/{evidence,appeal}) were removed: the
  # Marketplace no longer holds funds or manages orders/disputes. Parties list
  # services and connect, then transact off-platform (Meetup Mode). The Mkt*Order*
  # / Mkt*Dispute* schemas are retained under components (additive-only; still
  # referenced by seller reviews and internal models) but are no longer reachable
  # via any path.

  # ── Boosts ─────────────────────────────────────────────────────────────
  /v1/marketplace/boosts/tiers:
    get:
      operationId: mktListBoostTiers
      summary: List boost tiers/pricing (backend-owned)
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Boost tier list
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MktBoostTier' } }
  /v1/marketplace/boosts:
    post:
      operationId: mktPurchaseBoost
      summary: Purchase a boost (charges wallet directly, no separate ad balance)
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MktBoostPurchaseRequest' }
      responses:
        '201':
          description: Boost purchased (auto-activates)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktBoost' }
        '402':
          description: INSUFFICIENT_WALLET_BALANCE
          content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceError' } } }
        '409': { $ref: '#/components/responses/MktConflict' }
  /v1/marketplace/boosts/{id}:
    get:
      operationId: mktGetBoost
      summary: Get boost detail
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Boost detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktBoost' }
        '404': { $ref: '#/components/responses/MktNotFound' }

  # ── Saved searches ─────────────────────────────────────────────────────
  /v1/marketplace/saved-searches:
    post:
      operationId: mktCreateSavedSearch
      summary: Save a search with alerting
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MktSavedSearchCreateRequest' }
      responses:
        '201':
          description: Saved search created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktSavedSearch' }
    get:
      operationId: mktListSavedSearches
      summary: List the caller's saved searches
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Saved search list
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MktSavedSearch' } }
  /v1/marketplace/saved-searches/{id}:
    delete:
      operationId: mktDeleteSavedSearch
      summary: Delete a saved search
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Deleted }
        '404': { $ref: '#/components/responses/MktNotFound' }
    patch:
      operationId: mktUpdateSavedSearch
      summary: Toggle alert_enabled / update filters on a saved search
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MktSavedSearchCreateRequest' }
      responses:
        '200':
          description: Updated saved search
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktSavedSearch' }

  # ── Sellers ────────────────────────────────────────────────────────────
  /v1/marketplace/sellers/{id}/profile:
    get:
      operationId: mktGetSellerProfile
      summary: Get seller trust/profile summary
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Seller profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktSellerSummary' }
        '404': { $ref: '#/components/responses/MktNotFound' }
  /v1/marketplace/sellers/{id}/listings:
    get:
      operationId: mktGetSellerListings
      summary: List a seller's active listings
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
