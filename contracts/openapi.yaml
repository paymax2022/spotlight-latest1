    get:
      operationId: listDisputes
      summary: List the authenticated user's disputes
      tags: [Disputes]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Disputes list
          content:
