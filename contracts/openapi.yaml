  /api/finance/fractionalre/auto-invest:
    get:
      operationId: freListAutoInvest
      summary: List my auto-invest plans (incl. execution state)
      tags: [FractionalRE]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  auto_invest: { type: array, items: { $ref: '#/components/schemas/FreAutoInvestPlan' } }
    post:
      operationId: freCreateAutoInvest
      summary: Create an auto-invest plan (executed hourly by a background runner through the subscribe money path)
      description: >
        Each execution uses the deterministic idempotency key
        autoinvest:{plan_id}:{scheduled_run_iso}, so crash re-runs replay
        instead of double-investing. Failures (cap, KYC, funds) flip the plan
        to status=failed with last_error — fail-closed, never retried in-loop.
      tags: [FractionalRE]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_kobo]
              properties:
                amount_kobo: { $ref: '#/components/schemas/Money' }
                cadence: { type: string, enum: [weekly, monthly], default: monthly }
                asset_type: { type: string, enum: [income_property, development_debt, land] }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/FreAutoInvestPlan' } } } }
