        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FxQuoteRequest' }
      responses:
        '200':
          description: Quote with chosen route, alternatives and itemized fees
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxQuote' }
        '422':
          description: routing_unavailable / unsupported corridor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxError' }
  /api/v1/fx/quotes/{id}/lock:
    post:
      operationId: fxLockQuote
      summary: Lock a quote's rate for the lock window
      tags: [FX Orchestration]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Locked quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxQuote' }
  /api/v1/fx/conversions:
    post:
      operationId: fxCreateConversion
