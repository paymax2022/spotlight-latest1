    Appointment:
      type: object
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        doctor_id: { type: string, format: uuid }
        doctor_name: { type: string }
        doctor_specialty: { type: string }
        consultation_type: { type: string, enum: [video, audio, chat, in_person] }
        scheduled_at: { type: string, format: date-time }
        starts_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [booked, confirmed, completed, cancelled] }
        notes: { type: string }
        fee_kobo: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    Slot:
      type: object
      properties:
        id: { type: string }
        doctor_id: { type: string, format: uuid }
        date: { type: string, format: date }
        time: { type: string, description: "e.g. 09:00 AM" }
        available: { type: boolean }

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        appointment_id: { type: string, format: uuid }
        doctor_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        is_hidden: { type: boolean }
        created_at: { type: string, format: date-time }

