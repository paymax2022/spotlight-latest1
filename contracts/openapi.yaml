    # ── Pharmacy ──────────────────────────────────────────────────────────────────
    PharmacyProduct:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category:
          type: string
          enum: [pain, vitamins, first_aid, baby, skincare, devices, prescription, otc]
        price_kobo: { type: integer, format: int64 }
        unit: { type: string }
        is_bestseller: { type: boolean }
        is_essential: { type: boolean }
        in_stock: { type: boolean }
        image_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    CartItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        product: { $ref: '#/components/schemas/PharmacyProduct', nullable: true }

    PharmacyOrder:
      type: object
      description: >
        A pharmacy order. Money is HELD in escrow on creation (HL-9); amounts are
        integer kobo, never floats. search_event_id links the order to the
        originating symptom search when it came from that surface.
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        pharmacy_provider_id: { type: string, format: uuid }
        prescription_id: { type: string, format: uuid, nullable: true }
        state:
          type: string
          enum: [CREATED, RX_PENDING_VERIFICATION, CONFIRMED, DISPENSED, IN_DELIVERY,
                 READY_FOR_PICKUP, DELIVERED, COLLECTED, CLOSED, CANCELLED, REFUNDED]
        fulfilment_method: { type: string, enum: [DELIVERY, PICKUP] }
        total_kobo: { type: integer, format: int64 }
        search_event_id: { type: string, format: uuid, nullable: true, description: Originating symptom search event, when the order came from symptom search. }
        idempotency_key: { type: string }
        lines:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              product_name: { type: string }
              rx_required: { type: boolean }
              quantity: { type: integer, minimum: 1 }
              unit_price_kobo: { type: integer, format: int64 }
              line_total_kobo: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    PharmacyProfile:
      type: object
      description: >
        A discoverable pharmacy (HL-2: APPROVED + discoverable health_providers
        row, domain=PHARMACY), enriched with its optional storefront profile and
        rating aggregate. avg_rating/rating_count are server-computed from
        PharmacyReview rows and are never client-writable. distance_m/lat/lng
        are populated only when the discovery request was geo-ranked.
      properties:
        provider_id: { type: string, format: uuid }
        display_name: { type: string }
        address: { type: string }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        distance_m: { type: number, format: double, nullable: true, description: Meters from the caller's supplied lat/lng; present only for distance-sorted results. }
        supports_pickup: { type: boolean }
        supports_delivery: { type: boolean }
        delivery_fee_kobo: { type: integer, format: int64 }
        avg_rating: { type: number, format: float, minimum: 0, maximum: 5 }
        rating_count: { type: integer, minimum: 0 }

    PharmacyReview:
      type: object
      description: >
        A patient's rating of a completed pharmacy order. One review per order
        (order_id is unique) — the reviewer's identity is never exposed to
        other readers (HL-8).
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        pharmacy_provider_id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string }
        created_at: { type: string, format: date-time }

    # ── Pharmacy symptom search (symptom-guided discovery, NOT diagnosis) ──────
    SymptomSearchResult:
      type: object
      required: [tier, disclaimer]
      properties:
        tier:
          type: string
          enum: [T1, T2, T3, T4]
          description: >
            T1 self-care · T2 pharmacist-guided (mandatory confirmation) ·
            T3 consult required (no products) · T4 emergency (no commerce UI).
        clusters:
          type: array
          items: { $ref: '#/components/schemas/SymptomClusterMatch' }
        class_groups:
          type: array
          description: Present for T1/T2 only. Cohort-excluded classes are suppressed, never disabled.
          items: { $ref: '#/components/schemas/SymptomClassGroup' }
        escalation_card:
          $ref: '#/components/schemas/SymptomEscalationCard'
        pharmacist_confirmation_required:
          type: boolean
          description: true for every T2 result — checkout is blocked until a pharmacist confirms.
        disclaimer:
          type: string
          description: Versioned copy — always "options for your symptoms", never "treatment for your condition".
        search_event_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Id of the server-side symptom_search_events log row for this search.
            The client attaches it to POST /pharmacy/orders (search_event_id) so
            the pharmacist review case carries the search context and its tier is
            resolved from the actual search. Absent when event logging failed
            (best-effort — never blocks the search).

    SymptomClusterMatch:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        triage_tier: { type: string, enum: [T1, T2, T3, T4] }
        matched_concepts:
          type: array
          items: { type: string }
          description: Canonical concept names the user's terms resolved to.

    SymptomClassGroup:
      type: object
      properties:
        class_id: { type: string, format: uuid }
        name: { type: string, description: 'e.g. "Pain & fever relief (Paracetamol-based)"' }
        rank: { type: integer, minimum: 1 }
        usage_note: { type: string, description: 'Label-level guidance only, e.g. "not on an empty stomach". Never dosing advice.' }
        skus_url: { type: string, description: 'Link to /pharmacy/classes/{id}/skus for live stock.' }

    SymptomEscalationCard:
      type: object
      description: Returned for T3/T4 — explains what was flagged and routes to care; no products.
      properties:
        severity: { type: string, enum: [CONSULT, EMERGENCY] }
        flagged: { type: array, items: { type: string }, description: Human-readable reasons (e.g. "fever for more than 3 days"). }
        actions:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [PHARMACIST_CHAT, TELEHEALTH_CONSULT, EMERGENCY_GUIDANCE, NEAREST_FACILITY] }
              label: { type: string }
              target: { type: string, description: Deep link / route into the existing intake or MapService surface. }

    PharmacySkuOption:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid, description: pharmacy_products.id }
        name: { type: string }
        brand: { type: string }
        pack_size: { type: string }
        price_kobo: { type: integer, format: int64 }
        nafdac_reg_no: { type: string }
        classification: { type: string, enum: [OTC, PHARMACY_ONLY] , description: POM/BLOCKED_ONLINE never appear on this surface. }
        therapeutic_class_id: { type: string, format: uuid }
        in_stock: { type: boolean }
        max_qty_per_window: { type: integer, nullable: true, description: Rolling-window abuse cap; null = uncapped. Enforced SERVER-SIDE at order creation (422 QTY_CAP_EXCEEDED) — the mobile stepper cap is cosmetic only. }
        qty_window_days: { type: integer, default: 30, description: Rolling-window length (days) for max_qty_per_window. }

    QuantityCapError:
      type: object
      description: >
        422 body when a per-SKU rolling-window quantity cap rejects an order
        line (PRD §5.5). Enforced server-side at order creation, fail-closed,
        BEFORE any funds are held. Only SKUs with a non-null max_qty_per_window
        are gated; the window sum excludes CANCELLED / REFUNDED orders.
      required: [success, code, error]
      properties:
        success: { type: boolean, description: Always false. }
        code: { type: string, enum: [QTY_CAP_EXCEEDED] }
        error: { type: string, description: Human-readable rejection message. }
        product_id: { type: string, format: uuid, description: The capped catalog product. }
        max_qty: { type: integer, description: Cap over the rolling window (pharmacy_skus.max_qty_per_window, strictest SKU of the product wins). }
        window_days: { type: integer, description: Rolling-window length in days (pharmacy_skus.qty_window_days). }
        remaining: { type: integer, minimum: 0, description: Quantity the user may still order in the current window. }

    SymptomSafetyMetrics:
      type: object
      description: >
        Safety KPIs for the pharmacist console (PRD §9). Review-case counts
        (by_state / by_tier) are scoped to cases created in the last 7 days;
        open_overdue counts ALL currently open cases past their SLA deadline
        regardless of age. All keys are always present (zero-filled).
      required: [by_state, by_tier, open_overdue, median_decision_seconds, searches_24h, gated_share_7d]
      properties:
        by_state:
          type: object
          description: Review cases created in the last 7 days, per state. All six keys always present.
          required: [SUBMITTED, AUTO_CLEARED, PHARMACIST_REVIEW, NEEDS_INFO, APPROVED, REJECTED]
          properties:
            SUBMITTED: { type: integer }
            AUTO_CLEARED: { type: integer }
            PHARMACIST_REVIEW: { type: integer }
            NEEDS_INFO: { type: integer }
            APPROVED: { type: integer }
            REJECTED: { type: integer }
        by_tier:
          type: object
          description: Review cases created in the last 7 days, per triage tier. All four keys always present.
          required: [T1, T2, T3, T4]
          properties:
            T1: { type: integer }
            T2: { type: integer }
            T3: { type: integer }
            T4: { type: integer }
        open_overdue:
          type: integer
          description: Open cases (SUBMITTED / PHARMACIST_REVIEW / NEEDS_INFO) whose sla_deadline has passed, any age.
        median_decision_seconds:
          type: number
          nullable: true
          description: >
            Median creation→decision latency in seconds over cases decided
            APPROVED or REJECTED in the last 7 days (decision timestamp read
            from the evented history). Null when no decisions in the window.
        searches_24h:
          type: integer
          description: Symptom searches logged in the last 24 hours.
        gated_share_7d:
          type: number
          nullable: true
          description: >
            Share (0..1) of searches in the last 7 days that resolved to tier
            T2 or higher (pharmacist-gated or escalated). Null when there were
            no searches in the window.

    PharmacyReviewCase:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        tier: { type: string, enum: [T1, T2, T3, T4] }
        state:
          type: string
          enum: [SUBMITTED, AUTO_CLEARED, PHARMACIST_REVIEW, NEEDS_INFO, APPROVED, REJECTED]
        pharmacist_id: { type: string, format: uuid, nullable: true }
        decision_note: { type: string, nullable: true }
        sla_deadline: { type: string, format: date-time }
        search_event_id:
          type: string
          format: uuid
          nullable: true
          description: Originating symptom search event; null for orders without search context (e.g. catalogue POM orders).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PharmacyReviewCaseDetail:
      allOf:
        - $ref: '#/components/schemas/PharmacyReviewCase'
        - type: object
          properties:
            symptom_terms:
              type: array
              nullable: true
              items: { type: string }
              description: Normalised search terms from the linked search event. Empty/null when the case has no search context.
            matched_concepts:
              type: array
              nullable: true
              items: { type: string }
              description: Canonical concept names the search resolved to (snapshot at search time).
            cluster_name:
              type: string
              nullable: true
              description: Primary matched condition cluster (highest-tier) at search time.
            cohort_flags:
              type: array
              nullable: true
              items: { type: string, enum: [ADULT, CHILD_6_12, CHILD_UNDER_6, PREGNANT_OR_BF] }
              description: Explicitly selected cohort refiners from the linked search event.
            cart_lines:
              type: array
              description: Order lines under review, with classification at time of order.
              items:
                type: object
                properties:
                  sku_name: { type: string }
                  qty: { type: integer, minimum: 1 }
                  price_kobo: { type: integer, format: int64 }
                  classification: { type: string, enum: [OTC, PHARMACY_ONLY] }
            state_history:
              type: array
              description: >
                Audited state transitions, oldest first — read from the
                pharmacy_review_case_events table (one row per transition, written
                in the same transaction as the state change). For cases predating
                the events table the history is derived from the case row
                (accurate for the happy path, coarse for NEEDS_INFO loops).
              items:
                type: object
                properties:
                  from_state:
                    type: string
                    nullable: true
                    enum: [SUBMITTED, AUTO_CLEARED, PHARMACIST_REVIEW, NEEDS_INFO, APPROVED, REJECTED]
                    description: Null on the case-creation event.
                  state:
                    type: string
                    enum: [SUBMITTED, AUTO_CLEARED, PHARMACIST_REVIEW, NEEDS_INFO, APPROVED, REJECTED]
                  at: { type: string, format: date-time }
                  actor: { type: string, description: 'Acting user id, or "system" for automated transitions.' }
                  note: { type: string, nullable: true, description: Decision note carried by the transition (REJECT / NEEDS_INFO). }

    PharmacyMappingTerm:
      type: object
      description: Workbench row for a symptom term (any status, including AI_SUGGESTED drafts).
      properties:
        id: { type: string, format: uuid }
        term: { type: string }
        language: { type: string, enum: [en, pcm, ha, yo, ig], description: 'English, Pidgin, Hausa, Yoruba, Igbo.' }
        concept: { type: string, description: Canonical concept name the term maps to. }
        status: { type: string, enum: [AI_SUGGESTED, APPROVED, RETIRED] }
        approved_by: { type: string, format: uuid, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }

    PharmacyMappingCluster:
      type: object
      description: Workbench row for a condition cluster with its rules and cluster→class maps.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        triage_tier: { type: string, enum: [T1, T2, T3, T4] }
        status: { type: string, enum: [AI_SUGGESTED, APPROVED, RETIRED] }
        approved_by: { type: string, format: uuid, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        rules:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              expression: { type: string, description: Rule expression (e.g. duration/cohort comparators). }
              priority: { type: integer }
              status: { type: string, enum: [AI_SUGGESTED, APPROVED, RETIRED] }
        class_maps:
          type: array
          items:
            type: object
            properties:
              class_id: { type: string, format: uuid }
              class_name: { type: string }
              rank: { type: integer, minimum: 1 }
              status: { type: string, enum: [AI_SUGGESTED, APPROVED, RETIRED] }

    Appointment:
      type: object
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        doctor_id: { type: string, format: uuid }
        doctor_name: { type: string }
        doctor_specialty: { type: string }
        consultation_type: { type: string, enum: [video, audio, chat, in_person] }
        scheduled_at: { type: string, format: date-time }
        starts_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [booked, confirmed, completed, cancelled] }
        notes: { type: string }
        fee_kobo: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    Slot:
      type: object
      properties:
        id: { type: string }
        doctor_id: { type: string, format: uuid }
        date: { type: string, format: date }
        time: { type: string, description: "e.g. 09:00 AM" }
        available: { type: boolean }

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        appointment_id: { type: string, format: uuid }
        doctor_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        is_hidden: { type: boolean }
        created_at: { type: string, format: date-time }

    VisitSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        appointment_id: { type: string, format: uuid }
        doctor_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        diagnosis: { type: string }
        notes: { type: string }
        follow_up: { type: string }
        created_at: { type: string, format: date-time }

    # ── Transport ────────────────────────────────────────────────────────────────
    # ── Transport / Mobility response DTOs (camelCase wire format) ───────────────
    # IMPORTANT: transport/mobility RESPONSE bodies are camelCase (Go json tags).
    # Request bodies remain snake_case (see *Request schemas below and inline
    # requestBody definitions). Money is always integer minor units (kobo).
    Trip:
      type: object
      description: >-
        Ride/trip record. The coarse `status` is retained for back-compat; `phase`
        carries the full ride-hailing state machine. `settlementStatus` is the
        durable crash-safety marker.
      properties:
        id: { type: string, format: uuid }
        riderId: { type: string, format: uuid }
        driverId: { type: string, format: uuid, nullable: true }
        pickupAddress: { type: string }
        destAddress: { type: string }
        fareKobo: { type: integer, format: int64 }
        finalFareKobo: { type: integer, format: int64, nullable: true }
        status:
          type: string
          enum: [requested, accepted, picked_up, completed, cancelled]
        phase:
          type: string
          enum: [requested, fare_negotiating, driver_assigned, driver_arriving, pin_verified, in_progress, completed, cancelled, no_show, safety_hold]
        serviceType: { type: string }
        pricingMode: { type: string, enum: [instant, offer, scheduled] }
        paymentMethod: { type: string }
        safetyStatus: { type: string, enum: [normal, sos, route_deviation, unexpected_stop, resolved] }
        settlementStatus: { type: string, enum: [settled, settlement_pending, settlement_failed] }
        distanceM: { type: integer, nullable: true }
        durationS: { type: integer, nullable: true }
        settlementId: { type: string, format: uuid, nullable: true }
        idempotencyKey: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RegisterDriverRequest:
      type: object
      required: [name, vehicle_reg, vehicle_type]
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        vehicle_reg: { type: string }
        vehicle_type: { type: string, enum: [car, bike, tricycle] }

    Driver:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        vehicleReg: { type: string }
        vehicleType: { type: string, enum: [car, bike, tricycle] }
        status: { type: string, enum: [online, offline, on_trip] }
        verificationStatus: { type: string, enum: [draft, submitted, under_review, approved, rejected, suspended] }
        rating: { type: number, format: double }
        completedTrips: { type: integer }
        cancelledTrips: { type: integer }
        commissionTier: { type: string }
        serviceCategories: { type: array, items: { type: string } }
        currentLat: { type: number, format: double, nullable: true }
        currentLng: { type: number, format: double, nullable: true }
        createdAt: { type: string, format: date-time }

    Vehicle:
      type: object
      properties:
        id: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        plateNumber: { type: string }
        make: { type: string, nullable: true }
        model: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        color: { type: string, nullable: true }
        category: { type: string }
        capacity: { type: integer }
        inspectionStatus: { type: string, enum: [pending, passed, failed, expired] }
        insuranceStatus: { type: string, enum: [pending, valid, expired] }
        status: { type: string, enum: [pending, approved, rejected, suspended] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DriverDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        docType: { type: string, enum: [government_id, drivers_licence, proof_of_address, vehicle_licence, roadworthiness, insurance, driver_photo] }
        fileUrl: { type: string }
        status: { type: string, enum: [submitted, approved, rejected, expired] }
        expiryDate: { type: string, format: date, nullable: true }
        createdAt: { type: string, format: date-time }

    MobilityProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        trustLevel: { type: string, enum: [basic, verified, business] }
        defaultPayment: { type: string }
        homeAddress: { type: string, nullable: true }
        workAddress: { type: string, nullable: true }
        rating: { type: number, format: double }
        completedTrips: { type: integer }
        status: { type: string, enum: [active, restricted, suspended] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CommissionConfig:
      type: object
      description: Provider/platform revenue split per tier. pct as fractions summing to 1.
      properties:
        tier: { type: string, enum: [standard, low, subscription, fleet, performance] }
        providerPct: { type: number, format: double }
        platformPct: { type: number, format: double }
        active: { type: boolean }

    FareOffer:
      type: object
      description: Hybrid fare negotiation loop (rider offer ↔ driver counter).
      properties:
        id: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        systemFareKobo: { type: integer, format: int64 }
        riderOfferKobo: { type: integer, format: int64, nullable: true }
        driverCounterKobo: { type: integer, format: int64, nullable: true }
        acceptedFareKobo: { type: integer, format: int64, nullable: true }
        status: { type: string, enum: [pending, rider_offered, driver_countered, accepted, rejected, expired] }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    SafetyIncident:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        tripId: { type: string, format: uuid, nullable: true }
        type: { type: string, enum: [sos, route_deviation, unexpected_stop, unsafe_driver, unsafe_rider, harassment, accident, offline_trip, lost_item] }
        severity: { type: string, enum: [low, medium, high, critical] }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        description: { type: string, nullable: true }
        status: { type: string, enum: [open, investigating, escalated, resolved, closed] }
        assignedAdmin: { type: string, format: uuid, nullable: true }
        resolutionNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    TrustedContact:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        createdAt: { type: string, format: date-time }

    RateRequest:
      type: object
      required: [stars]
      properties:
        stars: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        tip_kobo: { type: integer, format: int64, minimum: 0 }

    TripRating:
      type: object
      properties:
        id: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        raterId: { type: string, format: uuid }
        rateeId: { type: string, format: uuid }
        role: { type: string, enum: [rider, driver] }
        stars: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        tipKobo: { type: integer, format: int64 }

    ShareTrackView:
      type: object
      description: Non-sensitive live-tracking payload returned by the public share resolve. Never includes the trip PIN.
      properties:
        tripId: { type: string }
        phase: { type: string }
        driverLat: { type: number, format: double, nullable: true }
        driverLng: { type: number, format: double, nullable: true }
        pickupAddress: { type: string, nullable: true }
        destAddress: { type: string, nullable: true }
        etaSeconds: { type: integer, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }

    # ── Mode DTOs (parcel · bus · towing · movers · car hire · logistics · event) ─
    Parcel:
      type: object
      properties:
        id: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        courierId: { type: string, format: uuid, nullable: true }
        pickupAddress: { type: string }
        dropoffAddress: { type: string }
        receiverName: { type: string }
        receiverPhone: { type: string }
        category: { type: string, enum: [document, small, medium, large, fragile, food, electronics, fashion, custom] }
        size: { type: string }
        speed: { type: string, enum: [standard, express, scheduled] }
        declaredValueKobo: { type: integer, format: int64 }
        fareKobo: { type: integer, format: int64 }
        status: { type: string, enum: [created, courier_assigned, pickup_pin_verified, picked_up, in_transit, dropoff_verified, delivered, failed, disputed, cancelled] }
        distanceM: { type: integer, nullable: true }
        settlementId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BusTicket:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        scheduleId: { type: string, format: uuid }
        seatNumber: { type: integer }
        passengerName: { type: string }
        passengerPhone: { type: string, nullable: true }
        qrCode: { type: string }
        fareKobo: { type: integer, format: int64 }
        paymentStatus: { type: string, enum: [paid, refunded] }
        boardingStatus: { type: string, enum: [issued, boarded, no_show] }
        status: { type: string, enum: [booked, issued, boarding, boarded, completed, rescheduled, cancelled, refunded] }
        settlementId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    TowingJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        operatorId: { type: string, format: uuid, nullable: true }
        serviceType: { type: string, enum: [tow, flatbed, jumpstart, tire_change, fuel, battery, unlock, mechanic] }
        vehicleType: { type: string, nullable: true }
        issueType: { type: string, nullable: true }
        pickupAddress: { type: string }
        destAddress: { type: string, nullable: true }
        fareKobo: { type: integer, format: int64 }
        status: { type: string, enum: [requested, operator_accepted, operator_en_route, pin_verified, in_progress, completed, cancelled] }
        settlementId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MoverJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        providerId: { type: string, format: uuid, nullable: true }
        pickupAddress: { type: string }
        dropoffAddress: { type: string }
        propertyType: { type: string, nullable: true }
