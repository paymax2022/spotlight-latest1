                pickup_address: { type: string }
                dest_address: { type: string }
                fare_kobo: { type: integer, format: int64, minimum: 150000 }
                idempotency_key: { type: string }
      responses:
        '201':
          description: Trip requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }

  /transport/trips/{id}/accept:
    post:
      operationId: acceptTrip
      summary: Driver accepts a trip request
      tags: [Transport]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Trip accepted }

  /transport/trips/{id}/status:
    patch:
      operationId: updateTripStatus
