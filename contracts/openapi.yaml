  # ── Nutrition Resolution Engine ───────────────────────────────────────────
  # Onboarding-first: menu upload auto-estimates + auto-publishes every dish as
  # AI_ESTIMATE (zero vendor action). The vendor later approves or lightly edits.
  # Member surface = read-mostly buyer view + async vendor approve/edit/attest.
  # Admin surface (/api/nutrition/admin/*) is RBAC-gated server-side.
  /api/finance/nutrition/dishes/{dishId}:
    get:
      operationId: nutritionGetDishProfile
      summary: Get the resolved nutrition profile for a dish (buyer view)
      description: >
        Returns the resolved per-serving nutrient profile, allergen declarations
        and display hints (band + traffic lights) for a dish. The buyer view is
        READ-ONLY. AI_ESTIMATE profiles are shown as a range; RESTAURANT_CONFIRMED
        is approved but still an estimate; EXACT is label-only. Allergens that have
        not been explicitly attested by the vendor default to a MAY_CONTAIN
        declaration (fail-safe), so the absence of an attestation must never be
        read as FREE_FROM.
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dishId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resolved dish nutrition profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DishNutritionProfile' }
        '404': { description: Dish not found }
  /api/finance/nutrition/dishes/{dishId}/recipe:
    post:
      operationId: nutritionDeclareRecipe
      summary: Declare a dish recipe (optional hidden power-user path; not part of onboarding)
      description: >
        OPTIONAL hidden power-user path for vendors who want maximum accuracy.
        Never required, never shown during onboarding. Submitting ingredients
        resolves the profile with grounding=RECIPE for a top-tier accuracy badge.
        The standard edit path NEVER asks for ingredients.
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dishId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipeDeclare' }
      responses:
        '200':
          description: Recipe accepted; dish re-resolved (grounding=RECIPE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DishNutritionProfile' }
        '404': { description: Dish not found }
  /api/finance/nutrition/dishes/{dishId}/approve:
    post:
      operationId: nutritionApproveDish
      summary: Vendor approves the AI-suggested nutrition profile for a dish
      description: >
        One-tap approval of the auto-published AI estimate. Moves the profile to
        RESTAURANT_CONFIRMED — higher trust and a point value allowed, but STILL
        labelled an estimate (approval ≠ exact). Grants the "Nutrition-Verified"
        badge. Object-level authZ: vendor may only approve their own dishes.
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dishId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Profile approved (status → RESTAURANT_CONFIRMED, still an estimate)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DishNutritionProfile' }
        '404': { description: Dish not found }
  /api/finance/nutrition/dishes/{dishId}/edit:
    post:
      operationId: nutritionEditDish
      summary: Lightweight vendor edit — portion + macro nudge (NEVER ingredients)
      description: >
        Adjust the portion selector (small/regular/large, rescales all values) or
        nudge individual macros. NEVER asks for ingredients — that is the optional
        hidden recipe path. Editing then approving moves the profile to
        RESTAURANT_CONFIRMED (still an estimate). Object-level authZ: own dishes only.
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dishId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditNutritionRequest' }
      responses:
        '200':
          description: Profile edited and re-scaled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DishNutritionProfile' }
        '404': { description: Dish not found }
  /api/finance/nutrition/dishes/{dishId}/allergens:
    post:
      operationId: nutritionAttestAllergen
      summary: Attest an allergen declaration for a dish (vendor)
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dishId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllergenAttest' }
      responses:
        '200':
          description: Allergen declaration recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllergenDeclaration' }
        '404': { description: Dish not found }
  /api/finance/nutrition/cart/summary:
    get:
      operationId: nutritionCartSummary
      summary: Aggregate nutrition + worst-case allergens across cart items
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ids, in: query, required: true, description: 'Comma-separated dish ids in the cart.', schema: { type: string } }
      responses:
        '200':
          description: Aggregated cart nutrition summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartNutritionSummary' }
  /api/finance/nutrition/menus/{menuId}/auto-suggest:
    post:
      operationId: nutritionAutoSuggestMenu
      summary: Batch auto-estimate + auto-publish a restaurant's whole menu (onboarding)
      description: >
        Onboarding-first entrypoint. Auto-estimates every dish on a menu from the
        names/photos the vendor is uploading anyway, grounding each estimate in the
        Nigerian composition library, and AUTO-PUBLISHES each as AI_ESTIMATE — zero
        vendor action, nutrition live from Day 1. Never blocks onboarding.
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: menuId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Menu auto-estimated and published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoSuggestResponse' }
        '404': { description: Menu not found }
  /api/finance/nutrition/menus/{menuId}/approve-all:
    post:
      operationId: nutritionApproveAllMenu
      summary: Approve all AI_ESTIMATE dishes on a menu (one-tap)
      description: >
        One-tap "Approve all" — moves every AI_ESTIMATE dish on the menu to
        RESTAURANT_CONFIRMED (still estimates) and grants the Nutrition-Verified
        badge. Object-level authZ: own menu only.
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: menuId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: All AI_ESTIMATE dishes approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoSuggestResponse' }
        '404': { description: Menu not found }
  # ── Nutrition admin (RBAC enforced server-side) ───────────────────────────
  /api/nutrition/admin/composition:
    post:
      operationId: nutritionAdminUpsertComposition
      summary: Upsert a food-composition reference row (per-100g nutrients)
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompositionReferenceInput' }
      responses:
        '200': { description: Composition reference upserted }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/nutrition/admin/library:
    post:
      operationId: nutritionAdminUpsertLibrary
      summary: Upsert a dish-library entry (fallback profile for common dishes)
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DishLibraryInput' }
      responses:
        '200': { description: Library entry upserted }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/nutrition/admin/reresolve:
    post:
      operationId: nutritionAdminReresolve
      summary: Re-resolve a set of dishes (e.g. after a composition update)
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReresolveRequest' }
      responses:
        '202': { description: Re-resolution job accepted }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/nutrition/admin/resolve:
    post:
      operationId: nutritionAdminResolve
      summary: Force an immediate resolution pass for a dish
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReresolveRequest' }
      responses:
        '200':
          description: Resolution result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DishNutritionProfile' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── FX Orchestration (provider-agnostic normalized API) ───────────────────
  /api/v1/fx/quotes:
    post:
      operationId: fxCreateQuote
      summary: Create a provider-agnostic FX quote (best route + alternatives)
      tags: [FX Orchestration]
      security: [{ bearerAuth: [] }]
