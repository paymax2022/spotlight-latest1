    post: { operationId: cancelBusinessDelivery, summary: Cancel + refund/void, tags: [Mobility Logistics], security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Cancelled } } }
  /mobility/business/batches:
    post:
      operationId: createDeliveryBatch
      summary: Bulk batch (creates batch + N deliveries)
      tags: [Mobility Logistics]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Batch created } }
    get: { operationId: listDeliveryBatches, summary: Batches, tags: [Mobility Logistics], security: [{ bearerAuth: [] }], responses: { '200': { description: Batches } } }
  /mobility/business/batches/{id}:
    get: { operationId: getDeliveryBatch, summary: Batch detail + stops, tags: [Mobility Logistics], security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Batch } } }
  /mobility/business/invoices:
    get: { operationId: listBusinessInvoices, summary: Monthly invoices, tags: [Mobility Logistics], security: [{ bearerAuth: [] }], responses: { '200': { description: Invoices } } }
  /mobility/business/analytics:
    get: { operationId: businessAnalytics, summary: Counts, success rate, COD totals, tags: [Mobility Logistics], security: [{ bearerAuth: [] }], responses: { '200': { description: Analytics } } }
  /driver/business/requests:
    get: { operationId: businessCourierRequests, summary: Open business delivery requests, tags: [Mobility Logistics], security: [{ bearerAuth: [] }], responses: { '200': { description: Requests } } }
  /driver/business/{id}/accept:
    post: { operationId: businessAccept, summary: Courier accepts, tags: [Mobility Logistics], security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Assigned } } }
  /driver/business/{id}/picked-up:
    post: { operationId: businessPickedUp, summary: Confirm pickup, tags: [Mobility Logistics], security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Picked up } } }
  /driver/business/{id}/deliver:
    post: { operationId: businessDeliver, summary: "Deliver (PIN/proof then settle or accrue)", tags: [Mobility Logistics], security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Delivered }, '422': { description: PIN mismatch } } }
  /driver/business/{id}/fail:
    post: { operationId: businessFail, summary: Mark failed (reason), tags: [Mobility Logistics], security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Failed } } }

  # ── Event transport (Spotlight) ───────────────────────────────────────────────
  /mobility/events/transport:
    get: { operationId: listEventTransport, summary: Transport offers for an event, tags: [Mobility Event], security: [{ bearerAuth: [] }], parameters: [{ name: event_id, in: query, required: true, schema: { type: string } }], responses: { '200': { description: Offers } } }
    post: { operationId: createEventTransport, summary: Organizer creates an offer, tags: [Mobility Event], security: [{ bearerAuth: [] }], responses: { '201': { description: Offer created } } }
  /mobility/events/transport/{id}:
    get: { operationId: getEventTransport, summary: Offer detail, tags: [Mobility Event], security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Offer } } }
  /mobility/events/transport/{id}/book:
    post:
      operationId: bookEventTransport
      summary: Book seats (escrow→settle organizer, QR; capacity enforced)
      tags: [Mobility Event]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Booked }, '409': { description: Capacity exceeded } }
  /mobility/events/bookings:
    get: { operationId: listEventBookings, summary: My event bookings (QR), tags: [Mobility Event], security: [{ bearerAuth: [] }], responses: { '200': { description: Bookings } } }
  /mobility/events/bookings/{id}/cancel:
    post: { operationId: cancelEventBooking, summary: Cancel + refund, tags: [Mobility Event], security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Cancelled } } }
  /driver/events/validate:
    post: { operationId: validateEventBooking, summary: Validate QR → boarded (organizer/driver), tags: [Mobility Event], security: [{ bearerAuth: [] }], responses: { '200': { description: Boarded }, '404': { description: Invalid QR } } }

  # ── AI Customer Care ──────────────────────────────────────────────────────────
  /support/sessions:
    post:
      operationId: createSupportSession
      summary: Open a new AI support session
      tags: [AIcare]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                topic: { type: string }
      responses:
        '201':
          description: Session opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportSession' }

  /support/sessions/{id}/messages:
    post:
      operationId: sendSupportMessage
      summary: Send a message and receive AI reply
      tags: [AIcare]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201':
          description: Message sent and AI reply returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_message: { $ref: '#/components/schemas/SupportMessage' }
                  ai_reply: { $ref: '#/components/schemas/SupportMessage' }
    get:
      operationId: getSupportHistory
      summary: Get full message history for a session
      tags: [AIcare]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Message history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SupportMessage' } }

  /support/sessions/{id}/escalate:
    post:
      operationId: escalateSupportSession
      summary: Escalate session to human agent
      tags: [AIcare]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { description: Session escalated }

  # ── Disputes ─────────────────────────────────────────────────────────────────
  /disputes:
    post:
      operationId: openDispute
      summary: Open a new dispute ticket
      tags: [Disputes]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenDisputeRequest' }
      responses:
        '201':
          description: Dispute created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '400': { description: Validation error }
    get:
      operationId: listDisputes
      summary: List the authenticated user's disputes
      tags: [Disputes]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Disputes list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Dispute' } }
                  count: { type: integer }

  # ── Ratings ───────────────────────────────────────────────────────────────────
  /ratings:
    post:
      operationId: submitRating
      summary: Submit a post-transaction rating for an entity
      tags: [Ratings]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRatingRequest' }
      responses:
        '201':
          description: Rating submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rating' }
        '400': { description: Validation error }

  /ratings/{entity_id}:
    get:
      operationId: getRatingSummary
      summary: Get aggregated rating summary for an entity
      tags: [Ratings]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: entity_id, in: path, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [doctor, pharmacy, restaurant, rider, driver, bus_operator, event_organiser, campaign, group_admin] } }
      responses:
        '200':
          description: Rating summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingSummary' }

  # ── Vote Bridge ───────────────────────────────────────────────────────────────
  /vote-bridge/debit:
    post:
      operationId: voteWalletDebit
      summary: Debit wallet for paid vote (called by Next.js bridge, not end users)
      tags: [VoteBridge]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoteDebitRequest' }
      responses:
        '200':
          description: Debit successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoteDebitResponse' }
        '402':
          description: Insufficient balance or tier limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

