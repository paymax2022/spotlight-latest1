    MoverBid:
      type: object
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        providerId: { type: string, format: uuid }
        amountKobo: { type: integer, format: int64 }
        note: { type: string, nullable: true }
