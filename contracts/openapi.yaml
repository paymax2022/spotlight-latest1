        '200':
          description: Appointment cancelled and refunded
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }

  /telemedicine/appointments/{id}/summary:
    get:
      operationId: getVisitSummary
      summary: Get the patient-facing visit summary (diagnosis, notes, follow-up)
      tags: [Telemedicine]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Visit summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/VisitSummary' }

  /telemedicine/appointments/{id}/review:
    post:
      operationId: addReview
      summary: Leave a rating and comment for a completed appointment
      tags: [Telemedicine]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
