              schema: { type: array, items: { $ref: '#/components/schemas/MktListing' } }
  /v1/marketplace/sellers/{id}/reviews:
    get:
      operationId: mktGetSellerReviews
      summary: List a seller's reviews
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Seller reviews
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MktReview' } }

  # ── Verification ───────────────────────────────────────────────────────
  /v1/marketplace/verification/id:
    post:
      operationId: mktVerifyId
      summary: Submit ID verification (delegates to existing SmileID/Dojah adapter)
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MktVerificationIdRequest' }
      responses:
        '202':
          description: Verification queued
          content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [pending] } } } } }
  /v1/marketplace/verification/business:
    post:
      operationId: mktVerifyBusiness
      summary: Submit business (CAC) verification for Tier-3 sellers
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MktVerificationBusinessRequest' }
      responses:
        '202':
          description: Verification queued
          content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [pending] } } } } }

  # ── Escrow webhooks REMOVED (ADR-023 listings-and-connect pivot) ──────
  # The two inbound webhooks (/webhooks/logistics/delivery-confirmed and
  # /webhooks/payments/funding-confirmed) drove the escrow order FSM. With no
  # escrow orders they advance no state and were removed. The Mkt*Webhook schemas
  # are retained under components (additive-only).

  # ── Admin (guard("marketplace.admin.<perm>"); reason_code mandatory on ─
  # ── every mutating action; writes mkt_admin_audit_log automatically) ──
  /v1/marketplace/admin/moderation/queue:
    get:
      operationId: mktAdminModerationQueue
      summary: List pending_review listings
      tags: [MarketplaceAdmin]
      security: [{ bearerAuth: [] }]
      description: "Requires marketplace.admin.moderation"
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Moderation queue
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MktListing' } }
        '403': { $ref: '#/components/responses/MktForbidden' }
  /v1/marketplace/admin/listings/{id}/approve:
    post:
      operationId: mktAdminApproveListing
      summary: Approve a pending_review listing
      tags: [MarketplaceAdmin]
      security: [{ bearerAuth: [] }]
      description: "Requires marketplace.admin.approve. reason_code optional (approval doesn't require one)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MktAdminReasonCodeRequest' }
      responses:
        '200':
          description: Listing approved (active)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktListing' }
        '403': { $ref: '#/components/responses/MktForbidden' }
  /v1/marketplace/admin/listings/{id}/reject:
    post:
      operationId: mktAdminRejectListing
      summary: Reject a pending_review listing (reason_code MANDATORY)
      tags: [MarketplaceAdmin]
      security: [{ bearerAuth: [] }]
      description: "Requires marketplace.admin.reject"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MktAdminReasonCodeRequest' }
      responses:
        '200':
          description: Listing rejected (removed_policy)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktListing' }
        '400':
          description: reason_code is required
          content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceError' } } }
        '403': { $ref: '#/components/responses/MktForbidden' }
  # Admin dispute queue/detail/decide/approve REMOVED (ADR-023): no disputes exist.
  # Mkt*Dispute* schemas + dispute.* RBAC perms retained (additive-only), unreachable.
  /v1/marketplace/admin/flags:
    get:
      operationId: mktAdminListFlags
      summary: List open safety/content flags
      tags: [MarketplaceAdmin]
      security: [{ bearerAuth: [] }]
      description: "Requires marketplace.admin.flags.action"
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, actioned, dismissed] } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Flag list
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MktFlag' } }
        '403': { $ref: '#/components/responses/MktForbidden' }
  /v1/marketplace/admin/flags/{id}/action:
    post:
      operationId: mktAdminActionFlag
      summary: Action or dismiss a flag (reason_code MANDATORY)
      tags: [MarketplaceAdmin]
      security: [{ bearerAuth: [] }]
      description: "Requires marketplace.admin.flags.action"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MktFlagActionRequest' }
      responses:
        '200':
          description: Flag actioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktFlag' }
        '400':
          description: reason_code is required
          content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceError' } } }
        '403': { $ref: '#/components/responses/MktForbidden' }
  /v1/marketplace/admin/audit-log:
    get:
      operationId: mktAdminAuditLog
      summary: Read the Marketplace admin audit log
      tags: [MarketplaceAdmin]
      security: [{ bearerAuth: [] }]
      description: "Requires marketplace.admin.audit.read"
      parameters:
        - { name: target_type, in: query, required: false, schema: { type: string } }
        - { name: target_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: admin_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MktAdminAuditLogEntry' } }
        '403': { $ref: '#/components/responses/MktForbidden' }
  # Admin orders/aging REMOVED (ADR-023): no orders to age. MktOrder schema +
  # orders.aging RBAC perm retained (additive-only), unreachable.

  # ── Trust & Account gap endpoints (Mobile-UX-Flows.md §28–34; ADR-021) ──
  # Non-money metadata (no Idempotency-Key). Bearer auth; owner-scoped (OLA).
  /v1/marketplace/media/presign:
    post:
      operationId: mktPresignMedia
      summary: Presign a listing-photo upload (Sell Smart Composer)
      description: >
        Returns a short-lived presigned R2 PUT URL scoped to the authenticated
        seller (object key marketplace/<userId>/<uuid>.<ext>). The client PUTs the
        binary directly to R2, then passes file_url in media_ids on listing create.
        NOTE: mounted at /media/presign (NOT /listings/media/presign) — Gin's radix
        router forbids a static "media" segment alongside the existing /listings/:id
        param. Fails 503 UPLOADS_NOT_CONFIGURED when R2 env is absent (never a
        fabricated URL).
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MktMediaPresignRequest' }
      responses:
        '200':
          description: Presigned upload URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktMediaPresignResponse' }
        '400': { $ref: '#/components/responses/MktBadRequest' }
        '401': { $ref: '#/components/responses/MktUnauthorized' }
        '503':
          description: "UPLOADS_NOT_CONFIGURED — R2 not configured; fails closed"
          content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceError' } } }
  /v1/marketplace/listings/{id}/save:
    post:
      operationId: mktSaveListing
      summary: Save a listing to the buyer's wishlist
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktSavedItem' }
        '401': { $ref: '#/components/responses/MktUnauthorized' }
        '404': { $ref: '#/components/responses/MktNotFound' }
        '409':
          description: "ALREADY_SAVED"
          content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceError' } } }
    delete:
      operationId: mktUnsaveListing
      summary: Remove a listing from the wishlist
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Removed
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } }
        '401': { $ref: '#/components/responses/MktUnauthorized' }
        '404':
          description: "SAVED_ITEM_NOT_FOUND"
          content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceError' } } }
  /v1/marketplace/saved-items:
    get:
      operationId: mktListSavedItems
      summary: The buyer's saved listings (wishlist)
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Saved items (each joined to its current listing)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MktSavedItem' } }
        '401': { $ref: '#/components/responses/MktUnauthorized' }
  /v1/marketplace/reports:
    post:
      operationId: mktCreateReport
      summary: Report a listing, seller, or chat (safety valve)
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MktReportCreateRequest' }
      responses:
        '201':
          description: Report filed (status open)
          content:
            application/json:
              schema:
                type: object
                required: [report]
                properties:
                  report: { $ref: '#/components/schemas/MktReport' }
        '400': { $ref: '#/components/responses/MktBadRequest' }
        '401': { $ref: '#/components/responses/MktUnauthorized' }
  /v1/marketplace/blocks:
    get:
      operationId: mktListBlocks
      summary: The caller's blocked users
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Blocked users
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MktBlock' } }
        '401': { $ref: '#/components/responses/MktUnauthorized' }
    post:
      operationId: mktBlockUser
      summary: Block another user
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked_user_id]
              properties:
                blocked_user_id: { type: string, format: uuid }
      responses:
        '201':
          description: Blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktBlock' }
        '401': { $ref: '#/components/responses/MktUnauthorized' }
        '409':
          description: "ALREADY_BLOCKED"
          content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceError' } } }
        '422':
          description: "CANNOT_BLOCK_SELF"
          content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceError' } } }
  /v1/marketplace/blocks/{id}:
    delete:
      operationId: mktUnblockUser
      summary: Unblock a user (id = the block row id)
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Unblocked
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } }
        '401': { $ref: '#/components/responses/MktUnauthorized' }
        '403': { $ref: '#/components/responses/MktForbidden' }
        '404':
          description: "BLOCK_NOT_FOUND"
          content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceError' } } }
  /v1/marketplace/notification-prefs:
    get:
      operationId: mktGetNotificationPrefs
      summary: The caller's per-category notification toggles
      description: "Defaults (all on except promotional) are returned when no row exists yet."
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Notification preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktNotificationPrefs' }
        '401': { $ref: '#/components/responses/MktUnauthorized' }
    patch:
      operationId: mktUpdateNotificationPrefs
      summary: Partial update of notification toggles
      description: "Only the supplied toggles change; omitted ones are left as-is (upsert)."
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MktNotificationPrefsPatch' }
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktNotificationPrefs' }
        '400': { $ref: '#/components/responses/MktBadRequest' }
        '401': { $ref: '#/components/responses/MktUnauthorized' }
  /v1/marketplace/meetup/safe-spots:
    get:
      operationId: mktMeetupSafeSpots
      summary: Curated verified-safe meetup locations (Meetup Mode)
      description: "Static curated partner list (police forecourts, bank branches, malls). Optional state/lga filter."
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: lga, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Safe spots
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MktSafeSpot' } }
        '401': { $ref: '#/components/responses/MktUnauthorized' }

  # ══════════════════════════════════════════════════════════════════════════
  # ║ Transport Scheduling — user trip scheduling layer OVER the existing    ║
  # ║ `transport`/mobility module (ride_hail, ride_share, parcel_intra,      ║
  # ║ parcel_inter, airport_pickup, bus). One-time scheduling only; a        ║
  # ║ scheduler worker materializes the real trip/parcel/bus ticket at      ║
  # ║ dispatch time (lead_time_minutes before scheduled_pickup_at), escrowing║
  # ║ via `settlement` at that point. See                                   ║
  # ║ docs/prd/transport-scheduling/SWARM_INTEGRATION_CONTRACT.md (frozen    ║
  # ║ data model + FSM) and docs/prd/transport-scheduling/DATA_MODEL.md.     ║
  # ║ Feature flag: FEATURE_TRANSPORT_SCHEDULING_ENABLED (off by default;    ║
  # ║ when off, endpoints below return 503 { error: { code: "FEATURE_DISABLED" } }).║
  # ══════════════════════════════════════════════════════════════════════════

  # ── Member: /api/finance/mobility/scheduled — auth required, OLA to owner ──
  /mobility/scheduled:
    post:
      operationId: createScheduledBooking
      summary: Schedule a future logistics movement (ride/parcel/airport/bus)
      description: >
        Creates a scheduled booking; does NOT charge or escrow the wallet —
        escrow happens at dispatch (lead_time_minutes before
        scheduled_pickup_at). Returns the created booking plus a fare
        estimate (reuses the existing pricing/estimate path).
      tags: [Transport Scheduling]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduledBookingCreateRequest' }
      responses:
        '201':
          description: Booking scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledBooking' }
        '422':
          description: Invalid mode_payload / scheduled_pickup_at in the past / lead time out of range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobilityError' }
        '503': { description: Feature disabled }
    get:
      operationId: listScheduledBookings
      summary: List the caller's scheduled bookings
      tags: [Transport Scheduling]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [upcoming, past, all], default: upcoming } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Scheduled bookings
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ScheduledBooking' } }

  /mobility/scheduled/estimate:
    post:
      operationId: estimateScheduledBooking
      summary: Fare/ETA quote for a prospective scheduled booking (reuses pricing.go)
      tags: [Transport Scheduling]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduledBookingEstimateRequest' }
      responses:
        '200':
          description: Estimate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FareEstimate' }

  /mobility/scheduled/{id}:
    get:
      operationId: getScheduledBooking
      summary: Scheduled booking detail (OLA — owner only)
      tags: [Transport Scheduling]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Booking detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledBooking' }
        '403': { description: Not the booking owner }
        '404': { description: Not found }
    patch:
      operationId: updateScheduledBooking
      summary: Reschedule pickup time / edit params
      description: 409 if status is not `scheduled` (illegal transition — booking already dispatching/terminal).
      tags: [Transport Scheduling]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduledBookingUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledBooking' }
        '403': { description: Not the booking owner }
        '404': { description: Not found }
        '409':
          description: Illegal state transition (status != scheduled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobilityError' }

  /mobility/scheduled/{id}/cancel:
    post:
      operationId: cancelScheduledBooking
      summary: Cancel a scheduled booking (refunds escrow if already dispatched)
      tags: [Transport Scheduling]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledBooking' }
        '403': { description: Not the booking owner }
        '404': { description: Not found }
        '409':
          description: Illegal state transition (already terminal)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobilityError' }

  # ── Admin: /api/finance/admin/transport/scheduled ───────────────────────────
  # guard("transport.admin.scheduled.*"); every mutation writes a transport
  # audit entry with reason_code (immutable admin audit per house doctrine).
  /admin/transport/scheduled:
    get:
      operationId: admListScheduledBookings
      summary: Scheduled bookings ops board (upcoming + failed_no_driver aging)
      description: "Requires transport.admin.scheduled.read"
      tags: [Mobility Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Scheduled bookings ops board
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ScheduledBooking' } }
        '403': { description: Missing transport.admin.scheduled.read }

  /admin/transport/scheduled/{id}:
    get:
      operationId: admGetScheduledBooking
      summary: Scheduled booking detail (admin)
      description: "Requires transport.admin.scheduled.read"
      tags: [Mobility Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Booking detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledBooking' }
        '403': { description: Missing transport.admin.scheduled.read }
        '404': { description: Not found }

  /admin/transport/scheduled/{id}/force-dispatch:
    post:
      operationId: admForceDispatchScheduledBooking
      summary: Manually retry materialization (escrow + create trip/parcel/ticket)
      description: "Requires transport.admin.scheduled.reassign. Audited with reason_code."
      tags: [Mobility Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduledAdminActionRequest' }
      responses:
        '200':
          description: Dispatch retried
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledBooking' }
        '400': { description: reason_code is required }
        '403': { description: Missing transport.admin.scheduled.reassign }
        '409':
          description: Illegal state transition / dispatch attempts exhausted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobilityError' }

  /admin/transport/scheduled/{id}/reassign:
    post:
      operationId: admReassignScheduledBooking
      summary: Hand a scheduled booking to a specific driver/courier where applicable
      description: "Requires transport.admin.scheduled.reassign. Audited with reason_code."
      tags: [Mobility Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/ScheduledAdminActionRequest' }
                - type: object
                  required: [driver_id]
                  properties:
                    driver_id: { type: string, format: uuid }
      responses:
        '200':
          description: Reassigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledBooking' }
        '400': { description: reason_code is required }
        '403': { description: Missing transport.admin.scheduled.reassign }
        '409':
          description: Illegal state transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobilityError' }

  /admin/transport/scheduled/{id}/cancel:
    post:
      operationId: admCancelScheduledBooking
      summary: Admin-cancel a scheduled booking (+ refund if escrowed)
      description: "Requires transport.admin.scheduled.cancel. Audited with reason_code."
      tags: [Mobility Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduledAdminActionRequest' }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledBooking' }
        '400': { description: reason_code is required }
        '403': { description: Missing transport.admin.scheduled.cancel }
        '409':
          description: Illegal state transition (already terminal)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobilityError' }

  # ╔══════════════════════════════════════════════════════════════════════╗
  # ║ DIRECT REFERRAL REWARDS — ADR-022                                       ║
  # ║ Single-level, purchase-triggered revenue share. Money is integer kobo. ║
  # ║ User mount /api/v1/referrals (own data only); admin mount              ║
  # ║ /api/v1/admin/referrals (deny-by-default referral.admin.* permissions).║
  # ║ Every mutation requires an Idempotency-Key and is audited.             ║
  # ╚══════════════════════════════════════════════════════════════════════╝
  # ── User surface (own data only) ─────────────────────────────────────────
  /api/v1/referrals/link:
    post:
      operationId: getMyReferralLink
      summary: Generate or fetch the caller's referral code + link
      tags: [Referral]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The caller's referral link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferralLinkResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/referrals/attribute:
    post:
      operationId: applyReferralCode
      summary: Apply a referral code (once, at signup — idempotent per user)
      description: Creates a permanent referral_attributions row for the caller. Invisible to the referred user by design. No reward is created here.
      tags: [Referral]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferralAttributeRequest' }
      responses:
        '200':
          description: Attribution recorded (or idempotent replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Caller already has an attribution (permanent, one per user for life) }
  /api/finance/referral/withdraw:
    post:
      operationId: withdrawReferralEarnings
      summary: Sweep the caller's eligible referral rewards into their wallet
      description: >
        Referral Earning System (§7A) member endpoint. Reachable from clients via the
        proxy alias POST /api/v1/referral/withdraw → Go POST /api/finance/referral/withdraw.
        Moves ALL of the caller's eligible reward-ledger rows (state=eligible, non-house)
        to state=paid, posting a balanced double-entry per row (DR referral_reward_expense
        / CR user_wallet). Money mutation — requires an Idempotency-Key header and a
        verified KYC tier (fail-closed). Idempotent per key; serialized per user.
      tags: [Referral]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Withdrawal completed (or idempotent replay). Amounts are integer kobo.
          content:
            application/json:
              schema:
                type: object
                required: [beneficiary_id, withdrawn_kobo, rewards_paid, remaining_eligible_kobo, currency]
                properties:
                  beneficiary_id: { type: string, format: uuid }
                  withdrawn_kobo: { type: integer, format: int64, description: Total moved to wallet, minor units }
                  rewards_paid: { type: integer, description: Number of eligible reward rows swept }
                  remaining_eligible_kobo: { type: integer, format: int64 }
                  currency: { type: string, example: NGN }
        '400': { description: Missing Idempotency-Key header }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Verified KYC tier below the withdrawal floor }
  /api/v1/referrals/me/dashboard:
    get:
      operationId: getMyReferralDashboard
      summary: Tier, active count, this-month + lifetime earnings, next milestone
      tags: [Referral]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The caller's referral dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferralUserDashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/referrals/me/referrals:
    get:
      operationId: listMyReferredUsers
      summary: List the caller's referred users + active status (masked contact)
      tags: [Referral]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Referred users
          content:
            application/json:
              schema:
                type: object
                properties:
                  referrals: { type: array, items: { $ref: '#/components/schemas/ReferralReferredUser' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/referrals/me/earnings:
    get:
      operationId: listMyReferralEarnings
      summary: Paginated reward transaction history for the caller
      tags: [Referral]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Reward history
          content:
            application/json:
              schema:
                type: object
                properties:
                  rewards: { type: array, items: { $ref: '#/components/schemas/ReferralReward' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/referrals/me/milestones:
    get:
      operationId: listMyReferralMilestones
      summary: Achieved + upcoming milestones for the caller
      tags: [Referral]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Milestones
          content:
            application/json:
              schema:
                type: object
                properties:
                  milestones: { type: array, items: { $ref: '#/components/schemas/ReferralMilestone' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  # ── Admin surface (referral.admin.* deny-by-default) ─────────────────────
  /api/v1/admin/referrals/config:
    get:
      operationId: getReferralAdminConfig
      summary: A1 — current live program config (tier + milestone tables)
      tags: [Referral Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Live program config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferralProgramConfig' }
        '403': { description: Missing referral.admin.config }
    put:
      operationId: publishReferralAdminConfig
      summary: A1 — publish a NEW versioned config (forward-only)
      description: Creates a new version applied only to transactions from effective_from onward. Never recomputes already-earned rewards. Returns the future-only warning surfaced by the UI banner.
      tags: [Referral Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferralConfigPublishRequest' }
      responses:
        '200':
          description: Published new config version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferralConfigPublishResponse' }
        '403': { description: Missing referral.admin.config }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/admin/referrals/analytics:
    get:
      operationId: getReferralAdminAnalytics
      summary: A2 — program metrics incl. reward-cost-as-%-of-margin (north-star)
      tags: [Referral Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Analytics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferralAnalytics' }
        '403': { description: Missing referral.admin.analytics }
  /api/v1/admin/referrals/fraud-queue:
    get:
      operationId: getReferralFraudQueue
      summary: A3 — flagged referrer/referred pairs (may be empty initially)
      tags: [Referral Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, CLEARED, VOIDED, SUSPENDED] } }
      responses:
        '200':
          description: Fraud flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  flags: { type: array, items: { $ref: '#/components/schemas/ReferralFraudFlag' } }
        '403': { description: Missing referral.admin.fraud }
    post:
      operationId: actionReferralFraudFlag
      summary: A3 — clear / void / suspend a flag (note required, logged)
      tags: [Referral Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferralFraudActionRequest' }
      responses:
        '200':
          description: Flag actioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '400': { description: note is required }
        '403': { description: Missing referral.admin.fraud }
  /api/v1/admin/referrals/ledger:
    get:
      operationId: getReferralAdminLedger
      summary: A4 — every reward row, filterable (CSV exported client-side)
      tags: [Referral Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, CREDITED, REVERSED] } }
        - { name: module, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Reward ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  ledger: { type: array, items: { $ref: '#/components/schemas/ReferralReward' } }
        '403': { description: Missing referral.admin.ledger }
  /api/v1/admin/referrals/{referrerId}/case:
    get:
      operationId: getReferralReferrerCase
      summary: A5 — one referrer's tier / reward / milestone history
      tags: [Referral Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: referrerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Referrer case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferralReferrerCase' }
        '403': { description: Missing referral.admin.case }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: adjustReferralReferrerCase
      summary: A5 — manual reward adjustment (reason required; Idempotency-Key)
      description: Money mutation — posts a balanced double-entry ledger correction, requires a logged reason, and is audited. Support Lead only.
      tags: [Referral Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: referrerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferralCaseAdjustmentRequest' }
      responses:
        '200':
          description: Adjustment applied (ledger correction + audit)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '400': { description: reason is required }
        '403': { description: Missing referral.admin.case (Support Lead) }
  /api/v1/admin/referrals/milestones-log:
    get:
      operationId: getReferralMilestonesLog
      summary: A6 — chronological milestone payout log
      tags: [Referral Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Milestone payouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  milestones: { type: array, items: { $ref: '#/components/schemas/ReferralMilestone' } }
        '403': { description: Missing referral.admin.milestones }
  /api/v1/admin/referrals/module-status:
    get:
      operationId: getReferralModuleStatus
      summary: A7 — per-module PurchaseSettled last-event + volume health
      tags: [Referral Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Module integration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  modules: { type: array, items: { $ref: '#/components/schemas/ReferralModuleRewardStat' } }
        '403': { description: Missing referral.admin.module }
