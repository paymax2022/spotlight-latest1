  # ── END ESTATE SUPER-APP block ────────────────────────────────────────────
  # ── MapService (provider-agnostic maps abstraction) ───────────────────────
  # All provider keys are server-side; the client calls ONLY these endpoints.
  # findNearbyOwn (/nearby) and isInZone (/in-zone) run on PostGIS, not a maps API.
  /api/finance/maps/basemap:
    get:
      operationId: mapsGetBasemap
      summary: MapLibre GL style + attribution for a surface
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: surface, in: query, required: false, schema: { type: string }, description: 'e.g. default | checkout | delivery' }
      responses:
        '200':
          description: Basemap style config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapStyleConfig' }
  /api/finance/maps/geocode:
    post:
      operationId: mapsGeocode
      summary: Geocode an address (cache-first; OpenStack results cached in PostGIS)
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string }
                surface: { type: string }
      responses:
        '200':
          description: Resolved coordinate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapGeoResult' }
  /api/finance/maps/reverse:
    post:
      operationId: mapsReverseGeocode
      summary: Reverse-geocode a coordinate (cache-first; OpenStack only cached)
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, format: double }
                lng: { type: number, format: double }
                surface: { type: string }
      responses:
        '200':
          description: Resolved address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapGeoResult' }
  /api/finance/maps/autocomplete:
    post:
      operationId: mapsAutocomplete
      summary: Address autocomplete (Google on consumer surfaces, else OpenStack)
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                session_token: { type: string, description: Per-session billing token }
                surface: { type: string }
                near: { $ref: '#/components/schemas/MapPoint' }
      responses:
        '200':
          description: Address suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items: { $ref: '#/components/schemas/MapSuggestion' }
  /api/finance/maps/places:
    post:
      operationId: mapsSearchPlaces
      summary: Search external world POIs (Google; degrades to OSM at soft cap)
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                near: { $ref: '#/components/schemas/MapPoint' }
      responses:
        '200':
          description: External places
          content:
            application/json:
              schema:
                type: object
                properties:
                  places:
                    type: array
                    items: { $ref: '#/components/schemas/MapPlace' }
  /api/finance/maps/route:
    post:
      operationId: mapsGetRoute
      summary: Route geometry + ETA (OSRM/OpenStack)
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin, dest]
              properties:
                origin: { $ref: '#/components/schemas/MapPoint' }
