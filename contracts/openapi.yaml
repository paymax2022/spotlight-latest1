  # ── Merchant Onboarding & Role-Upgrade (PRD: Identity/Upgrade/Onboarding) ──
  /api/v1/onboarding/modules:
    get:
      operationId: listOnboardingModules
      summary: List modules open for merchant onboarding
      tags: [Onboarding]
      responses:
        '200':
          description: Modules open for onboarding
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/onboarding/modules/{id}/merchant-types:
    get:
      operationId: listMerchantTypes
      summary: List open merchant types within a module
      tags: [Onboarding]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Merchant types, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { type: object } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/onboarding/merchant-types/{id}:
    get:
      operationId: getMerchantType
      summary: Get a merchant type
      tags: [Onboarding]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Merchant type, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/onboarding/form-schemas/{id}:
    get:
      operationId: getFormSchema
      summary: Get the current published form schema for a merchant type
      tags: [Onboarding]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Versioned form schema (steps/fields/validation/conditions), content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/onboarding/applications:
    post:
      operationId: createOnboardingApplication
      summary: Create a DRAFT onboarding application (blocks duplicate active app/profile)
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchantTypeId]
              properties:
                merchantTypeId: { type: string }
      responses:
        '201': { description: Draft created, content: { application/json: { schema: { type: object } } } }
        '409': { description: Duplicate active application or profile for this (module, merchant type) }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/onboarding/applications/{id}:
    get:
      operationId: getOnboardingApplication
      summary: Get an onboarding application
      tags: [Onboarding]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Application, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: saveOnboardingDraft
      summary: Save draft application data (resumable)
      tags: [Onboarding]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { data: { type: object } } }
      responses:
        '200': { description: Draft saved, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/onboarding/applications/{id}/submit:
    post:
      operationId: submitOnboardingApplication
      summary: Submit a DRAFT application (validated server-side against its schema version)
      tags: [Onboarding]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { data: { type: object } } }
      responses:
        '200': { description: Submitted (DRAFT -> SUBMITTED), content: { application/json: { schema: { type: object } } } }
        '409': { description: Illegal state transition }
        '422': { description: Validation failed against the form schema }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/onboarding/applications/{id}/resubmit:
    post:
      operationId: resubmitOnboardingApplication
      summary: Resubmit after NEEDS_MORE_INFO (-> UNDER_REVIEW)
      tags: [Onboarding]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } }
      responses:
        '200': { description: Resubmitted, content: { application/json: { schema: { type: object } } } }
        '409': { description: Illegal state transition }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/capabilities:
    get:
      operationId: getMyCapabilities
      summary: Get the caller's Customer profile + all merchant profiles + in-flight applications
      tags: [Onboarding]
      responses:
        '200': { description: Capabilities, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/onboarding/review-queue:
    get:
      operationId: getReviewQueue
      summary: Routed review queue (RBAC onboarding.review)
      tags: [Onboarding Admin]
      parameters:
        - { name: module, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: age, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Queue rows, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { type: object } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/onboarding/applications/{id}/approve:
    post:
      operationId: approveApplication
      summary: Approve — idempotently create/activate MerchantProfile, grant role, audit (RBAC onboarding.review)
      tags: [Onboarding Admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Approved; profile active + role granted }
        '409': { description: Illegal state transition }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/onboarding/applications/{id}/reject:
    post:
      operationId: rejectApplication
      summary: Reject with reason (RBAC onboarding.review)
      tags: [Onboarding Admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } }
      responses:
        '200': { description: Rejected }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/onboarding/applications/{id}/request-info:
    post:
      operationId: requestMoreInfo
      summary: Request more info with checklist (-> NEEDS_MORE_INFO) (RBAC onboarding.review)
      tags: [Onboarding Admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { checklist: { type: array, items: { type: string } } } } } }
      responses:
        '200': { description: Marked NEEDS_MORE_INFO }
        '403': { $ref: '#/components/responses/Unauthorized' }
  /kyc/me:
    get:
      operationId: getMyKyc
      summary: Get current user's KYC status and tier
      tags: [KYC]
      responses:
        '200':
          description: KYC profile
          content:
            application/json:
              schema:
                type: object
                required: [success, kyc_tier, kyc_status]
                properties:
                  success: { type: boolean }
                  kyc_tier: { $ref: '#/components/schemas/KycTier' }
                  kyc_status: { $ref: '#/components/schemas/KycStatus' }
                  phone_verified: { type: boolean }
                  submitted_at: { type: string, format: date-time, nullable: true }
                  verified_at: { type: string, format: date-time, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /kyc/initiate:
    post:
      operationId: initiateKyc
      summary: Submit KYC documents to advance to a higher tier
      tags: [KYC]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_type, document_ref]
              properties:
                document_type:
                  type: string
                  enum: [BVN, NIN, PASSPORT, DRIVERS_LICENSE]
                document_ref:
                  type: string
                  description: Provider reference or encrypted document ID
                phone:
                  type: string
      responses:
        '202':
          description: KYC submission accepted; verification is asynchronous
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  kyc_status: { $ref: '#/components/schemas/KycStatus' }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

# ── Wallet endpoints ───────────────────────────────────────────────────────────

  /wallet/balance:
    get:
      operationId: getWalletBalance
      summary: Get real-time wallet balance (derived from ledger)
      tags: [Wallet]
      responses:
        '200':
          description: Current balance
          content:
            application/json:
              schema:
                type: object
                required: [success, balance]
                properties:
                  success: { type: boolean }
                  balance: { $ref: '#/components/schemas/WalletBalance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Wallet disabled — KYC tier 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /wallet/transactions:
    get:
      operationId: listWalletTransactions
      summary: Paginated ledger transaction history
      tags: [Wallet]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque cursor for keyset pagination
      responses:
        '200':
          description: Ledger entries
          content:
            application/json:
              schema:
                type: object
                required: [success, entries]
                properties:
                  success: { type: boolean }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/LedgerEntry' }
                  next_cursor: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /wallet/topup:
    post:
      operationId: initiateWalletTopup
      summary: Initiate a Paystack payment to top up the wallet
      tags: [Wallet]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_kobo]
              properties:
                amount_kobo:
                  type: integer
                  format: int64
                  minimum: 10000
                  description: Amount to top up in kobo (min ₦100)
      responses:
        '200':
          description: Paystack payment initialized
          content:
            application/json:
              schema:
                type: object
                required: [success, authorization_url, reference]
                properties:
                  success: { type: boolean }
                  authorization_url: { type: string, format: uri }
                  reference: { type: string }
                  amount_kobo: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

# ── Virtual accounts ───────────────────────────────────────────────────────────

  /virtual-accounts/me:
    get:
      operationId: getMyVirtualAccount
      summary: Get the authenticated user's dedicated virtual bank account
      tags: [VirtualAccounts]
      responses:
        '200':
          description: Virtual account details
          content:
            application/json:
              schema:
                type: object
                required: [success, account]
                properties:
                  success: { type: boolean }
                  account: { $ref: '#/components/schemas/VirtualAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not available — KYC tier below 1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not yet provisioned (auto-provisioning in progress)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

# ── Bank Transfers ─────────────────────────────────────────────────────────────

  /banks:
    get:
      operationId: listBanks
      summary: List all Nigerian banks supported for outbound transfers
      tags: [BankTransfers]
      responses:
        '200':
          description: Bank list (cached up to 1 hour)
          content:
            application/json:
              schema:
                type: object
                required: [success, banks]
                properties:
                  success: { type: boolean }
                  banks:
                    type: array
                    items: { $ref: '#/components/schemas/Bank' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /banks/resolve:
    post:
      operationId: resolveBankAccount
      summary: Resolve a bank account number to get the account holder name
      tags: [BankTransfers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_code, account_number]
              properties:
                bank_code: { type: string }
                account_number: { type: string, minLength: 10, maxLength: 10 }
      responses:
        '200':
          description: Resolved account name
          content:
            application/json:
              schema:
                type: object
                required: [success, account_name, account_number]
                properties:
                  success: { type: boolean }
                  account_name: { type: string }
                  account_number: { type: string }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Account not found at the bank
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /transfers/bank:
    post:
      operationId: initiateWalletToBankTransfer
      summary: >
        Transfer funds from the authenticated user's wallet to any Nigerian
        bank account. Funds are reserved atomically before calling Paystack.
        Transfer result is delivered via webhook (transfer.success / transfer.failed).
      tags: [BankTransfers]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_code, account_number, amount_kobo]
              properties:
                bank_code:
                  type: string
                account_number:
                  type: string
                  minLength: 10
                  maxLength: 10
                amount_kobo:
                  type: integer
                  format: int64
                  minimum: 100000
                  description: Minimum ₦1,000 (100,000 kobo)
                narration:
                  type: string
                  maxLength: 100
                save_beneficiary:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Transfer initiated — final status via webhook
          content:
            application/json:
              schema:
                type: object
                required: [success, transfer]
                properties:
                  success: { type: boolean }
                  already_processed: { type: boolean }
                  transfer: { $ref: '#/components/schemas/BankTransfer' }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Insufficient wallet balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        # MONEY-PATH AGENT 1 — go-live gate: FEATURE_BANK_TRANSFERS_ENABLED=false → 503
        '503':
          description: Bank transfers feature disabled (FEATURE_BANK_TRANSFERS_ENABLED=false)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

# ── Bank Transfer schemas ──────────────────────────────────────────────────────

  /transfers/paymax/resolve:
    get:
      operationId: resolvePaymaxRecipient
      summary: Resolve a Paymax user by phone, email, or username for transfer
      tags: [Transfers]
      parameters:
        - name: identifier
          in: query
          required: true
          schema: { type: string }
          description: Phone number, email address, or Paymax username
      responses:
        '200':
          description: Recipient preview (safe — no PII exposed)
          content:
            application/json:
              schema:
                type: object
                required: [success, recipient]
                properties:
                  success: { type: boolean }
                  recipient: { $ref: '#/components/schemas/PaymaxTransferRecipient' }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No Paymax user found for this identifier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        # MONEY-PATH AGENT 1 — go-live gate: FEATURE_WALLET_TRANSFERS_ENABLED=false → 503
        '503':
          description: Wallet transfers feature disabled (FEATURE_WALLET_TRANSFERS_ENABLED=false)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /transfers/paymax:
    post:
      operationId: initiateWalletToWalletTransfer
      summary: >
        Instantly transfer funds from the authenticated user's wallet to another
        Paymax user. Atomic — sender is debited and receiver is credited in a
        single DB transaction. Idempotent on the provided key.
      tags: [Transfers]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_identifier, amount_kobo]
              properties:
                recipient_identifier:
                  type: string
                  description: Recipient's phone, email, or Paymax username
                amount_kobo:
                  type: integer
                  format: int64
                  minimum: 100
                  description: Amount to transfer in kobo (min ₦1)
                narration:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Transfer successful (or already processed — idempotent)
          content:
            application/json:
              schema:
                type: object
                required: [success, transfer]
                properties:
                  success: { type: boolean }
                  already_processed: { type: boolean }
                  transfer: { $ref: '#/components/schemas/WalletTransfer' }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Insufficient wallet balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Recipient not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        # MONEY-PATH AGENT 1 — go-live gate: FEATURE_WALLET_TRANSFERS_ENABLED=false → 503
        '503':
          description: Wallet transfers feature disabled (FEATURE_WALLET_TRANSFERS_ENABLED=false)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

# ── Referrals ──────────────────────────────────────────────────────────────────

  /referrals/me:
    get:
      operationId: getMyReferrals
      summary: Get the authenticated user's referral code and earnings summary
      tags: [Referrals]
      responses:
        '200':
          description: Referral summary
          content:
            application/json:
              schema:
                type: object
                required: [success, referral]
                properties:
                  success: { type: boolean }
                  referral: { $ref: '#/components/schemas/ReferralSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

# ── Vote bridge (v2) ───────────────────────────────────────────────────────────

  /api/v2/votes/free:
    post:
      operationId: castFreeVoteBridged
      summary: Cast a free vote through the bridge (idempotent, KYC-gated)
      tags: [VoteBridge]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contestId, contestantId]
              properties:
                contestId: { type: string }
                contestantId: { type: string }
                shareCode: { type: string, description: Referrer's share code }
      responses:
        '200':
          description: Vote cast
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  votesAdded: { type: integer }
                  freeVotesRemaining: { type: integer }
                  newTotalVotes: { type: integer }
                  fraudStatus: { type: string }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v2/votes/paid/verify:
    post:
      operationId: verifyPaidVoteBridged
      summary: Verify and credit paid votes through the bridge (SELECT FOR UPDATE locked)
      tags: [VoteBridge]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId, paymentReference]
              properties:
                transactionId: { type: string, format: uuid }
                paymentReference: { type: string }
      responses:
        '200':
          description: Votes credited (or already credited — idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  alreadyProcessed: { type: boolean }
                  votesCredited: { type: integer }
                  newTotalVotes: { type: integer }
                  receiptNumber: { type: string }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Payment not completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

# ── Admin fintech ──────────────────────────────────────────────────────────────

  /admin/adjustments:
    post:
      operationId: initiateAdjustment
      summary: >
        Finance maker: propose a manual wallet credit or debit.
        Amounts ≥ ₦100,000 require checker approval before execution.
      tags: [AdminFintech]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, type, amount_kobo, reason]
              properties:
                user_id: { type: string, format: uuid }
                type: { type: string, enum: [CREDIT, DEBIT] }
                amount_kobo: { type: integer, format: int64, minimum: 1 }
                reason: { type: string, minLength: 10 }
      responses:
        '201':
          description: Adjustment initiated (pending approval if ≥ ₦100,000)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  adjustment_id: { type: string, format: uuid }
                  status: { type: string, enum: [pending_approval, executed] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/adjustments/{id}/approve:
    post:
      operationId: approveAdjustment
      summary: Finance checker approves a pending adjustment (self-approval blocked)
      tags: [AdminFintech]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Adjustment approved and executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  adjustment_id: { type: string, format: uuid }
                  ledger_entry_id: { type: string, format: uuid }
        '403':
          description: Self-approval attempted or insufficient role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Adjustment not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

# ── Go Finance API (/api/finance) ─────────────────────────────────────────────
# All routes require Bearer JWT. Feature-flagged server-side (FEATURE_*_ENABLED).
  /va/me:
    get:
      summary: Get or provision virtual account
      operationId: getVirtualAccount
      tags: [VirtualAccount]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Virtual account details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualAccount' }
        '403': { description: KYC tier 0 — provisioning not allowed }

  /fx/quote:
    post:
      summary: Get an FX rate quote (valid for 5 minutes)
      operationId: getFXQuote
      tags: [FX]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_currency, target_currency, amount_kobo]
              properties:
                source_currency: { type: string, minLength: 3, maxLength: 3, example: NGN }
                target_currency: { type: string, minLength: 3, maxLength: 3, example: USD }
                amount_kobo: { type: integer, format: int64, minimum: 100 }
      responses:
        '200':
          description: FX quote (expires in 5 min — quote_id required for convert)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FXQuote' }
        '400': { description: Invalid currencies or amount }

  /fx/convert:
    post:
      summary: Execute an FX conversion using a valid quote
      operationId: convertFX
      tags: [FX]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id, idempotency_key]
              properties:
                quote_id: { type: string, format: uuid }
                idempotency_key: { type: string, minLength: 8 }
      responses:
        '200':
          description: Conversion result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FXConversion' }
        '400': { description: Expired or invalid quote }
        '402': { description: Insufficient balance }

  /fx/history:
    get:
      summary: List FX conversion history
      operationId: listFXHistory
      tags: [FX]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Paginated conversion history
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversions:
                    type: array
                    items: { $ref: '#/components/schemas/FXConversion' }

  /fx/wallets/{currency}:
    get:
      summary: Get or create a foreign currency wallet
      operationId: getFXWallet
      tags: [FX]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: currency
          in: path
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        '200':
          description: Currency wallet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrencyWallet' }

  # ── Groups ────────────────────────────────────────────────────────────────────
  /groups:
    post:
      operationId: createGroup
      summary: Create a community group
      tags: [Groups]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                description: { type: string }
                is_public: { type: boolean }
                avatar_url: { type: string, nullable: true }
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: listMyGroups
      summary: List groups the authenticated user belongs to
      tags: [Groups]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Groups list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Group' } }

  /groups/{id}/dues:
    post:
      operationId: payGroupDues
      summary: Pay subscription dues for a group
      tags: [Groups]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id, idempotency_key]
              properties:
                plan_id: { type: string, format: uuid }
                idempotency_key: { type: string }
      responses:
        '201':
          description: Dues paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionPayment' }

  # ── Events (Top-5 Phase 2 — event ticketing + cashless event wallet) ─────────
  # SUPERSEDES the old 2-endpoint stub (createEvent/purchaseTicket against the
  # legacy backend/internal/events package, which is now unwired from the
  # router). Canonical implementation: backend/internal/top5events, mounted at
  # member /api/finance/events/* and admin /api/events/admin/*. This is the
  # surface the mobile app's 17 event/wallet screens are built against.
  /events:
    get:
      operationId: listEvents
      summary: Discovery feed — list events with optional category/state filters
      tags: [Events]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: category
          in: query
          schema: { type: string }
          description: Optional category filter (e.g. music, tech, sports, comedy, faith)
        - name: state
          in: query
          schema: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, LIVE, CLOSED, SUSPENDED] }
          description: Optional state filter. Non-public states are only honoured for the caller's own organised events.
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: Event summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/EventSummary' }
    post:
      operationId: createEvent
      summary: Create a ticketed event (organiser capability; starts in DRAFT)
      tags: [Events]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, starts_at, ends_at]
              properties:
                title: { type: string, minLength: 2, maxLength: 200 }
                description: { type: string }
                venue: { type: string }
                category: { type: string }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                fee_bps: { type: integer, minimum: 0, maximum: 10000 }
      responses:
        '200':
          description: Event created (state DRAFT)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Event' }

  /events/{id}:
    get:
      operationId: getEvent
      summary: Get an event by id (public read)
      tags: [Events]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Event
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Event' }

  /events/{id}/submit:
    post:
      operationId: submitEvent
      summary: Organiser submits a DRAFT event for admin approval (DRAFT -> SUBMITTED)
      tags: [Events]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: State transitioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }

  /events/{id}/golive:
    post:
      operationId: goLiveEvent
      summary: Organiser opens ticket sales (APPROVED -> LIVE)
      tags: [Events]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: State transitioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }

  /events/{id}/close:
    post:
      operationId: closeEvent
      summary: Organiser closes the event (LIVE -> CLOSED); triggers residual refunds on all event wallets
      tags: [Events]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: State transitioned, wallets closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }

  /events/{id}/tiers:
    post:
      operationId: addTicketTier
      summary: Organiser adds a ticket inventory tier
      tags: [Events]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price_kobo]
              properties:
                name: { type: string }
                price_kobo: { type: integer, format: int64, minimum: 0 }
                capacity: { type: integer, minimum: 0, description: "0 = unlimited" }
      responses:
        '200':
          description: Tier created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/TicketTier' }

  /events/{id}/promos:
    post:
      operationId: addPromoCode
      summary: Organiser adds a versioned promo code
      tags: [Events]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, percent_off]
              properties:
                code: { type: string }
                percent_off: { type: integer, minimum: 0, maximum: 100 }
                max_uses: { type: integer, minimum: 0, description: "0 = unlimited" }
      responses:
        '200':
          description: Promo code created (new version if code already existed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/PromoCode' }

  /events/{id}/vendors:
    post:
      operationId: addEventVendor
      summary: Organiser registers a POS-lite vendor
      tags: [Events]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, name]
              properties:
                user_id: { type: string, format: uuid, description: "Payout beneficiary" }
                name: { type: string }
      responses:
        '200':
          description: Vendor registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Vendor' }

  /events/{id}/purchase:
    post:
      operationId: purchaseEventTicket
      summary: Purchase a ticket for an event (wallet.Debit into escrow; tier-limit enforced fail-closed)
      tags: [Events]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier_id]
              properties:
                tier_id: { type: string, format: uuid }
                promo: { type: string, description: "Optional promo code" }
      responses:
        '200':
          description: Ticket issued (state ISSUED) with a rotating-QR gate-entry credential
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Ticket' }

  /events/tickets/{ticketId}/gift:
    post:
      operationId: giftEventTicket
      summary: Transfer an ISSUED ticket to another user via their cashtag handle
      tags: [Events]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ticketId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient]
              properties:
                recipient: { type: string, description: "Recipient cashtag handle" }
      responses:
        '200':
          description: Ticket transferred (state TRANSFERRED); a fresh credential is issued and the giver's old one is revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Ticket' }

  /events/my/tickets:
    get:
      operationId: myEventTickets
      summary: List the caller's tickets
      tags: [Events]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ticket list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  tickets:
                    type: array
                    items: { $ref: '#/components/schemas/Ticket' }

  /events/scan:
    post:
      operationId: scanEventTicket
      summary: Steward gate scan — validates a rotating-QR/NFC token (single-use, replay-rejected)
      tags: [Events]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: "credential.Token — the presented rotating-QR/NFC token" }
                gate: { type: string, description: "credential.Gate — the scanning gate identifier" }
      responses:
        '200':
          description: Scan result (accepted tickets flip ISSUED/TRANSFERRED -> USED)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  result: { type: object }

  /events/{id}/wallet:
    post:
      operationId: openEventWallet
      summary: Open (or fetch existing) cashless event wallet for the caller at this event
      tags: [Events]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Event wallet (state OPEN)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/EventWallet' }

  /events/wallet/{walletId}/topup:
    post:
      operationId: topUpEventWallet
      summary: Add float to an event wallet (closed-loop — wallet source debits the main Paymax wallet into escrow)
      tags: [Events]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_kobo]
              properties:
                amount_kobo: { type: integer, format: int64, minimum: 1 }
                source: { type: string, enum: [wallet, agent, card], default: wallet }
      responses:
        '200':
          description: Event wallet with updated balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/EventWallet' }

  /events/wallet/{walletId}:
    get:
      operationId: getEventWallet
      summary: Get an event wallet with its projected balance (owner-only)
      tags: [Events]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Event wallet
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/EventWallet' }

  /events/wallet/{walletId}/close:
    post:
      operationId: closeEventWallet
      summary: Close an event wallet; unspent residual refunds to the owner's main wallet (NL-3)
      tags: [Events]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Wallet closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }

  /events/vendors/{vendorId}/charge:
    post:
      operationId: tapChargeEventVendor
      summary: POS-lite tap-charge — moves float from an attendee's event wallet to a vendor's accrued float
      tags: [Events]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: vendorId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet_id, amount_kobo]
              properties:
                wallet_id: { type: string, format: uuid }
                amount_kobo: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Charge recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/VendorCharge' }

  # ── Events admin (RBAC events.*) — mounted at /api/events/admin/*, OUTSIDE the
  # /api/finance server base (see `servers:` above). Documented here as full
  # absolute paths, matching this spec's existing convention for admin routes
  # that live outside /api/finance (e.g. /api/admin/users/*, /api/auth/sessions/*).
  /api/events/admin/{id}/approve:
    post:
      operationId: approveEvent
      summary: Admin approves a SUBMITTED event (SUBMITTED -> APPROVED)
      tags: [Events Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: State transitioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }

  /api/events/admin/{id}/suspend:
    post:
      operationId: suspendEvent
      summary: Admin suspends any non-terminal event (-> SUSPENDED)
      tags: [Events Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: State transitioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }

  /api/events/admin/{id}/vendors/{vendorId}/settle:
    post:
      operationId: settleEventVendor
      summary: Admin settles a vendor's accrued float net of the platform fee (KYC-gated, NL-10)
      tags: [Events Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: vendorId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Settlement posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  net_kobo: { type: integer, format: int64 }
        '403':
          description: Vendor has not completed KYC (fail-closed, NL-10)

  # ── Crowdfunding ──────────────────────────────────────────────────────────────
  /crowdfunding/campaigns:
    post:
      operationId: createCampaign
      summary: Create a fundraising campaign
      tags: [Crowdfunding]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, goal_kobo, deadline]
              properties:
                title: { type: string, minLength: 2, maxLength: 200 }
                description: { type: string }
                goal_kobo: { type: integer, format: int64, minimum: 100 }
                deadline: { type: string, format: date-time }
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }

  /crowdfunding/campaigns/{id}:
    get:
      operationId: getCampaign
      summary: Get a campaign with live raised total
      tags: [Crowdfunding]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }

  /crowdfunding/campaigns/{id}/contribute:
    post:
      operationId: contributeToСampaign
      summary: Contribute to a campaign (escrows funds)
      tags: [Crowdfunding]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_kobo, idempotency_key]
              properties:
                amount_kobo: { type: integer, format: int64, minimum: 100 }
                idempotency_key: { type: string }
      responses:
        '201':
          description: Contribution escrowed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contribution' }

  # ── Telemedicine ──────────────────────────────────────────────────────────────
  /telemedicine/doctors:
    get:
      operationId: listDoctors
      summary: List available doctors, optionally filtered by specialty
      tags: [Telemedicine]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: specialty, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Doctors list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Doctor' } }
    post:
      operationId: registerDoctor
      summary: Register as a healthcare provider
      tags: [Telemedicine]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, specialty, consult_fee_kobo]
              properties:
                name: { type: string }
                specialty: { type: string }
                bio: { type: string }
                consult_fee_kobo: { type: integer, format: int64, minimum: 100 }
      responses:
        '201':
          description: Doctor registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doctor' }

  /telemedicine/appointments:
    post:
      operationId: bookAppointment
