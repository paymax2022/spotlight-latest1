            schema:
              type: object
              required: [pickup, dest, pricing_mode]
              properties:
                pickup: { $ref: '#/components/schemas/Place' }
                dest: { $ref: '#/components/schemas/Place' }
                service_type: { type: string, default: ride_hailing }
                pricing_mode: { type: string, enum: [instant, offer] }
                offer_kobo: { type: integer, format: int64, description: required when pricing_mode=offer }
                payment_method: { type: string, default: wallet }
                idempotency_key: { type: string }
      responses:
        '201': { description: Trip created }
        '422':
          description: Offer outside floor/ceiling
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobilityError' }

