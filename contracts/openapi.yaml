        acceptedBidId: { type: string, format: uuid, nullable: true }
        quoteAmountKobo: { type: integer, format: int64, nullable: true }
        status: { type: string, enum: [quote_requested, bids_received, bid_accepted, crew_assigned, in_progress, completion_confirmed, disputed, cancelled] }
        escrowStatus: { type: string, enum: [none, funded, released, refunded] }
        settlementId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
