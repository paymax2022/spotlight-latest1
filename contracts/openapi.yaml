  /driver/parcels/{id}/accept:
    post: { operationId: parcelAccept, summary: Courier accepts, tags: [Mobility Parcel], security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Assigned } } }
  /driver/parcels/{id}/verify-pickup-pin:
    post: { operationId: parcelVerifyPickup, summary: Verify pickup PIN, tags: [Mobility Parcel], security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Verified }, '422': { description: PIN mismatch } } }
