            application/json:
              schema: { $ref: '#/components/schemas/MapPolyline' }
  /api/finance/maps/nearby:
    post:
      operationId: mapsFindNearbyOwn
      summary: Near-me over OUR records via PostGIS (ST_DWithin) — not a maps API
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_type, point, radius_m]
              properties:
                entity_type: { type: string }
                point: { $ref: '#/components/schemas/MapPoint' }
                radius_m: { type: number, format: double }
                limit: { type: integer }
      responses:
        '200':
          description: Nearby own entities, nearest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/MapOwnEntity' }
  /api/finance/maps/in-zone:
    post:
      operationId: mapsIsInZone
      summary: Geofence check via PostGIS (ST_Contains) — not a maps API
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [point, zone_id]
              properties:
                point: { $ref: '#/components/schemas/MapPoint' }
                zone_id: { type: string }
      responses:
        '200':
          description: Geofence result
          content:
            application/json:
              schema:
                type: object
                properties:
                  in_zone: { type: boolean }
  /api/finance/maps/locations:
    post:
      operationId: mapsUpsertLocation
      summary: Persist a confirmed map pin + Plus Code (source of truth)
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_id, entity_type, lat, lng]
              properties:
                entity_id: { type: string }
                entity_type: { type: string }
                lat: { type: number, format: double }
                lng: { type: number, format: double }
                plus_code: { type: string }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  plus_code: { type: string }
  /api/finance/maps/usage:
    get:
      operationId: mapsUsage
      summary: Per-provider/per-primitive monthly usage (cost-guard metrics)
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current-month usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  usage:
                    type: array
                    items: { $ref: '#/components/schemas/MapUsageRow' }

  /api/finance/maps/metrics:
    get:
      operationId: mapsMetrics
      summary: Prometheus metrics (RED + cache/degradation + monthly usage)
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema: { type: string }

  # ── Real-time trip tracking ───────────────────────────────────────────────
  # Driver streams GPS here; the backend snaps it via MapService.MatchToRoad and
  # pushes "trip.position" messages to the rider + driver over the WebSocket at
  # GET /api/finance/mobility/ws (auth via Authorization header on handshake).
  /api/finance/mobility/trips/{id}/track:
    post:
      operationId: mobilityTrackPosition
      summary: Stream one driver GPS sample for a trip (driver-only)
      tags: [Mobility]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, format: double }
                lng: { type: number, format: double }
                heading: { type: number, format: double }
                speed_mps: { type: number, format: double }
      responses:
        '202': { description: Accepted — position fanned out to participants }
        '403': { description: Caller is not the trip's driver }

  # ── FX Orchestration (provider-agnostic normalized API) ───────────────────
  /api/v1/fx/quotes:
    post:
      operationId: fxCreateQuote
      summary: Create a provider-agnostic FX quote (best route + alternatives)
      tags: [FX Orchestration]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FxQuoteRequest' }
      responses:
        '200':
          description: Quote with chosen route, alternatives and itemized fees
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxQuote' }
        '422':
          description: routing_unavailable / unsupported corridor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxError' }
  /api/v1/fx/quotes/{id}/lock:
    post:
      operationId: fxLockQuote
      summary: Lock a quote's rate for the lock window
      tags: [FX Orchestration]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Locked quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxQuote' }
  /api/v1/fx/conversions:
    post:
      operationId: fxCreateConversion
      summary: Execute a conversion against a quote (requires Idempotency-Key)
      tags: [FX Orchestration]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FxConversionRequest' }
      responses:
        '201':
          description: Conversion settled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxConversion' }
        '409':
          description: rate_expired / duplicate-key conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxError' }
        '422':
          description: insufficient_balance / compliance_block
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxError' }
  /api/v1/fx/transfers:
    post:
      operationId: fxCreateTransfer
      summary: Execute a payout, optionally with embedded FX (requires Idempotency-Key)
      tags: [FX Orchestration]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FxTransferRequest' }
      responses:
        '201':
          description: Transfer queued/processing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxTransfer' }
        '409':
          description: rate_expired / conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxError' }
  /api/v1/fx/collections/virtual-accounts:
    post:
      operationId: fxCreateCollection
      summary: Provision an inbound virtual account / IBAN
      tags: [FX Orchestration]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FxCollectionRequest' }
      responses:
        '201':
          description: Virtual account / IBAN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxVirtualAccount' }
  /api/v1/fx/rates:
    get:
      operationId: fxGetRates
      summary: Indicative mid + Paymax sell rates (display/alerts only)
      tags: [FX Orchestration]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Indicative rates
  /api/v1/fx/balances:
    get:
      operationId: fxGetBalances
      summary: Customer multi-currency balances
      tags: [FX Orchestration]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Balances array
  /api/v1/fx/transactions:
    get:
      operationId: fxListTransactions
      summary: Unified ledger view (conversions, transfers, collections)
      tags: [FX Orchestration]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Transaction list
  /api/v1/fx/transactions/{id}:
    get:
      operationId: fxGetTransaction
      summary: Single unified transaction by id/reference
      tags: [FX Orchestration]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Transaction detail

  # ── Merchant Onboarding & Role-Upgrade (PRD: Identity/Upgrade/Onboarding) ──
  /api/v1/onboarding/modules:
    get:
      operationId: listOnboardingModules
      summary: List modules open for merchant onboarding
      tags: [Onboarding]
      responses:
        '200':
          description: Modules open for onboarding
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/onboarding/modules/{id}/merchant-types:
    get:
      operationId: listMerchantTypes
      summary: List open merchant types within a module
      tags: [Onboarding]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Merchant types, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { type: object } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/onboarding/merchant-types/{id}:
    get:
      operationId: getMerchantType
      summary: Get a merchant type
      tags: [Onboarding]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Merchant type, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/onboarding/form-schemas/{id}:
    get:
      operationId: getFormSchema
      summary: Get the current published form schema for a merchant type
      tags: [Onboarding]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Versioned form schema (steps/fields/validation/conditions), content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/onboarding/applications:
    post:
      operationId: createOnboardingApplication
      summary: Create a DRAFT onboarding application (blocks duplicate active app/profile)
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchantTypeId]
              properties:
                merchantTypeId: { type: string }
      responses:
        '201': { description: Draft created, content: { application/json: { schema: { type: object } } } }
        '409': { description: Duplicate active application or profile for this (module, merchant type) }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/onboarding/applications/{id}:
    get:
      operationId: getOnboardingApplication
      summary: Get an onboarding application
      tags: [Onboarding]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Application, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: saveOnboardingDraft
      summary: Save draft application data (resumable)
      tags: [Onboarding]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { data: { type: object } } }
      responses:
        '200': { description: Draft saved, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/onboarding/applications/{id}/submit:
    post:
      operationId: submitOnboardingApplication
      summary: Submit a DRAFT application (validated server-side against its schema version)
      tags: [Onboarding]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { data: { type: object } } }
      responses:
        '200': { description: Submitted (DRAFT -> SUBMITTED), content: { application/json: { schema: { type: object } } } }
        '409': { description: Illegal state transition }
        '422': { description: Validation failed against the form schema }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/onboarding/applications/{id}/resubmit:
    post:
      operationId: resubmitOnboardingApplication
      summary: Resubmit after NEEDS_MORE_INFO (-> UNDER_REVIEW)
      tags: [Onboarding]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } }
      responses:
        '200': { description: Resubmitted, content: { application/json: { schema: { type: object } } } }
        '409': { description: Illegal state transition }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/capabilities:
    get:
      operationId: getMyCapabilities
      summary: Get the caller's Customer profile + all merchant profiles + in-flight applications
      tags: [Onboarding]
      responses:
        '200': { description: Capabilities, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/onboarding/review-queue:
    get:
      operationId: getReviewQueue
      summary: Routed review queue (RBAC onboarding.review)
      tags: [Onboarding Admin]
      parameters:
        - { name: module, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: age, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Queue rows, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { type: object } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/onboarding/applications/{id}/approve:
    post:
      operationId: approveApplication
      summary: Approve — idempotently create/activate MerchantProfile, grant role, audit (RBAC onboarding.review)
      tags: [Onboarding Admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Approved; profile active + role granted }
        '409': { description: Illegal state transition }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/onboarding/applications/{id}/reject:
    post:
      operationId: rejectApplication
      summary: Reject with reason (RBAC onboarding.review)
      tags: [Onboarding Admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } }
      responses:
        '200': { description: Rejected }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/onboarding/applications/{id}/request-info:
    post:
      operationId: requestMoreInfo
      summary: Request more info with checklist (-> NEEDS_MORE_INFO) (RBAC onboarding.review)
      tags: [Onboarding Admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { checklist: { type: array, items: { type: string } } } } } }
      responses:
        '200': { description: Marked NEEDS_MORE_INFO }
        '403': { $ref: '#/components/responses/Unauthorized' }
  /kyc/me:
    get:
      operationId: getMyKyc
      summary: Get current user's KYC status and tier
      tags: [KYC]
      responses:
        '200':
          description: KYC profile
          content:
            application/json:
              schema:
                type: object
                required: [success, kyc_tier, kyc_status]
                properties:
                  success: { type: boolean }
                  kyc_tier: { $ref: '#/components/schemas/KycTier' }
                  kyc_status: { $ref: '#/components/schemas/KycStatus' }
                  phone_verified: { type: boolean }
                  submitted_at: { type: string, format: date-time, nullable: true }
                  verified_at: { type: string, format: date-time, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /kyc/initiate:
    post:
      operationId: initiateKyc
      summary: Submit KYC documents to advance to a higher tier
      tags: [KYC]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_type, document_ref]
              properties:
                document_type:
                  type: string
                  enum: [BVN, NIN, PASSPORT, DRIVERS_LICENSE]
                document_ref:
                  type: string
                  description: Provider reference or encrypted document ID
                phone:
                  type: string
      responses:
        '202':
          description: KYC submission accepted; verification is asynchronous
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  kyc_status: { $ref: '#/components/schemas/KycStatus' }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

# ── Wallet endpoints ───────────────────────────────────────────────────────────

  /wallet/balance:
    get:
      operationId: getWalletBalance
      summary: Get real-time wallet balance (derived from ledger)
      tags: [Wallet]
      responses:
        '200':
          description: Current balance
          content:
            application/json:
              schema:
                type: object
                required: [success, balance]
                properties:
                  success: { type: boolean }
                  balance: { $ref: '#/components/schemas/WalletBalance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Wallet disabled — KYC tier 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /wallet/transactions:
    get:
      operationId: listWalletTransactions
      summary: Paginated ledger transaction history
      tags: [Wallet]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque cursor for keyset pagination
      responses:
        '200':
          description: Ledger entries
          content:
            application/json:
              schema:
                type: object
                required: [success, entries]
                properties:
                  success: { type: boolean }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/LedgerEntry' }
                  next_cursor: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /wallet/topup:
    post:
      operationId: initiateWalletTopup
      summary: Initiate a Paystack payment to top up the wallet
      tags: [Wallet]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_kobo]
              properties:
                amount_kobo:
                  type: integer
                  format: int64
                  minimum: 10000
                  description: Amount to top up in kobo (min ₦100)
      responses:
        '200':
          description: Paystack payment initialized
          content:
            application/json:
              schema:
                type: object
                required: [success, authorization_url, reference]
                properties:
                  success: { type: boolean }
                  authorization_url: { type: string, format: uri }
                  reference: { type: string }
                  amount_kobo: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

# ── Virtual accounts ───────────────────────────────────────────────────────────

  /virtual-accounts/me:
    get:
      operationId: getMyVirtualAccount
      summary: Get the authenticated user's dedicated virtual bank account
      tags: [VirtualAccounts]
      responses:
        '200':
          description: Virtual account details
          content:
            application/json:
              schema:
                type: object
                required: [success, account]
                properties:
                  success: { type: boolean }
                  account: { $ref: '#/components/schemas/VirtualAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not available — KYC tier below 1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not yet provisioned (auto-provisioning in progress)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

# ── Bank Transfers ─────────────────────────────────────────────────────────────

  /banks:
    get:
      operationId: listBanks
      summary: List all Nigerian banks supported for outbound transfers
      tags: [BankTransfers]
      responses:
        '200':
          description: Bank list (cached up to 1 hour)
          content:
            application/json:
              schema:
                type: object
                required: [success, banks]
                properties:
                  success: { type: boolean }
                  banks:
                    type: array
                    items: { $ref: '#/components/schemas/Bank' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /banks/resolve:
    post:
      operationId: resolveBankAccount
      summary: Resolve a bank account number to get the account holder name
      tags: [BankTransfers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_code, account_number]
              properties:
                bank_code: { type: string }
                account_number: { type: string, minLength: 10, maxLength: 10 }
      responses:
        '200':
          description: Resolved account name
          content:
            application/json:
              schema:
                type: object
                required: [success, account_name, account_number]
                properties:
                  success: { type: boolean }
                  account_name: { type: string }
                  account_number: { type: string }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Account not found at the bank
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /transfers/bank:
    post:
      operationId: initiateWalletToBankTransfer
      summary: >
        Transfer funds from the authenticated user's wallet to any Nigerian
        bank account. Funds are reserved atomically before calling Paystack.
        Transfer result is delivered via webhook (transfer.success / transfer.failed).
      tags: [BankTransfers]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_code, account_number, amount_kobo]
              properties:
                bank_code:
                  type: string
                account_number:
                  type: string
                  minLength: 10
                  maxLength: 10
                amount_kobo:
                  type: integer
                  format: int64
                  minimum: 100000
                  description: Minimum ₦1,000 (100,000 kobo)
                narration:
                  type: string
                  maxLength: 100
                save_beneficiary:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Transfer initiated — final status via webhook
          content:
            application/json:
              schema:
                type: object
                required: [success, transfer]
                properties:
                  success: { type: boolean }
                  already_processed: { type: boolean }
                  transfer: { $ref: '#/components/schemas/BankTransfer' }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Insufficient wallet balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        # MONEY-PATH AGENT 1 — go-live gate: FEATURE_BANK_TRANSFERS_ENABLED=false → 503
        '503':
          description: Bank transfers feature disabled (FEATURE_BANK_TRANSFERS_ENABLED=false)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

# ── Bank Transfer schemas ──────────────────────────────────────────────────────

  /transfers/paymax/resolve:
    get:
      operationId: resolvePaymaxRecipient
      summary: Resolve a Paymax user by phone, email, or username for transfer
      tags: [Transfers]
      parameters:
        - name: identifier
          in: query
          required: true
          schema: { type: string }
          description: Phone number, email address, or Paymax username
      responses:
        '200':
          description: Recipient preview (safe — no PII exposed)
          content:
            application/json:
              schema:
                type: object
                required: [success, recipient]
                properties:
                  success: { type: boolean }
                  recipient: { $ref: '#/components/schemas/PaymaxTransferRecipient' }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No Paymax user found for this identifier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        # MONEY-PATH AGENT 1 — go-live gate: FEATURE_WALLET_TRANSFERS_ENABLED=false → 503
        '503':
          description: Wallet transfers feature disabled (FEATURE_WALLET_TRANSFERS_ENABLED=false)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /transfers/paymax:
    post:
      operationId: initiateWalletToWalletTransfer
      summary: >
        Instantly transfer funds from the authenticated user's wallet to another
        Paymax user. Atomic — sender is debited and receiver is credited in a
        single DB transaction. Idempotent on the provided key.
      tags: [Transfers]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_identifier, amount_kobo]
              properties:
                recipient_identifier:
                  type: string
                  description: Recipient's phone, email, or Paymax username
                amount_kobo:
                  type: integer
                  format: int64
                  minimum: 100
                  description: Amount to transfer in kobo (min ₦1)
                narration:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Transfer successful (or already processed — idempotent)
          content:
            application/json:
              schema:
                type: object
                required: [success, transfer]
                properties:
                  success: { type: boolean }
                  already_processed: { type: boolean }
                  transfer: { $ref: '#/components/schemas/WalletTransfer' }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Insufficient wallet balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Recipient not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        # MONEY-PATH AGENT 1 — go-live gate: FEATURE_WALLET_TRANSFERS_ENABLED=false → 503
        '503':
          description: Wallet transfers feature disabled (FEATURE_WALLET_TRANSFERS_ENABLED=false)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

# ── Referrals ──────────────────────────────────────────────────────────────────

  /referrals/me:
    get:
      operationId: getMyReferrals
      summary: Get the authenticated user's referral code and earnings summary
      tags: [Referrals]
      responses:
        '200':
          description: Referral summary
          content:
            application/json:
              schema:
                type: object
                required: [success, referral]
                properties:
                  success: { type: boolean }
                  referral: { $ref: '#/components/schemas/ReferralSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

# ── Vote bridge (v2) ───────────────────────────────────────────────────────────

  /api/v2/votes/free:
    post:
      operationId: castFreeVoteBridged
      summary: Cast a free vote through the bridge (idempotent, KYC-gated)
      tags: [VoteBridge]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contestId, contestantId]
              properties:
                contestId: { type: string }
                contestantId: { type: string }
                shareCode: { type: string, description: Referrer's share code }
      responses:
        '200':
          description: Vote cast
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  votesAdded: { type: integer }
                  freeVotesRemaining: { type: integer }
                  newTotalVotes: { type: integer }
                  fraudStatus: { type: string }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v2/votes/paid/verify:
    post:
      operationId: verifyPaidVoteBridged
      summary: Verify and credit paid votes through the bridge (SELECT FOR UPDATE locked)
      tags: [VoteBridge]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId, paymentReference]
              properties:
                transactionId: { type: string, format: uuid }
                paymentReference: { type: string }
      responses:
        '200':
          description: Votes credited (or already credited — idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  alreadyProcessed: { type: boolean }
                  votesCredited: { type: integer }
                  newTotalVotes: { type: integer }
                  receiptNumber: { type: string }
        '400': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Payment not completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

# ── Admin fintech ──────────────────────────────────────────────────────────────

  /admin/adjustments:
    post:
      operationId: initiateAdjustment
      summary: >
        Finance maker: propose a manual wallet credit or debit.
        Amounts ≥ ₦100,000 require checker approval before execution.
      tags: [AdminFintech]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, type, amount_kobo, reason]
              properties:
                user_id: { type: string, format: uuid }
                type: { type: string, enum: [CREDIT, DEBIT] }
                amount_kobo: { type: integer, format: int64, minimum: 1 }
                reason: { type: string, minLength: 10 }
      responses:
        '201':
          description: Adjustment initiated (pending approval if ≥ ₦100,000)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  adjustment_id: { type: string, format: uuid }
                  status: { type: string, enum: [pending_approval, executed] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/adjustments/{id}/approve:
    post:
      operationId: approveAdjustment
      summary: Finance checker approves a pending adjustment (self-approval blocked)
      tags: [AdminFintech]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Adjustment approved and executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  adjustment_id: { type: string, format: uuid }
                  ledger_entry_id: { type: string, format: uuid }
        '403':
          description: Self-approval attempted or insufficient role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Adjustment not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

# ── Go Finance API (/api/finance) ─────────────────────────────────────────────
# All routes require Bearer JWT. Feature-flagged server-side (FEATURE_*_ENABLED).

  /wallet/balance:
    get:
