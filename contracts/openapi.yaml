        customer_id: { type: string, format: uuid }
        restaurant_id: { type: string, format: uuid }
        subtotal_kobo: { type: integer, format: int64 }
        delivery_kobo: { type: integer, format: int64 }
        total_kobo: { type: integer, format: int64 }
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, picked_up, delivered, cancelled]
        created_at: { type: string, format: date-time }

    # ── Telemedicine ─────────────────────────────────────────────────────────────
    Doctor:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        specialty:
          type: string
          enum: [general, cardiology, dermatology, paediatrics, veterinary, pharmacy,
                 mental_health, womens_health, neurology, eye_care, nutrition, dentistry,
                 oncology, orthopedic]
        consult_fee_kobo: { type: integer, format: int64 }
        is_available: { type: boolean }
        is_online: { type: boolean }
        is_hmo_verified: { type: boolean }
        rating: { type: number, format: float }
        review_count: { type: integer }
        patients_count: { type: integer }
        experience_years: { type: integer }
        success_rate: { type: integer }
        about: { type: string }
        education:
          type: array
          items:
            type: object
            properties:
              institution: { type: string }
              degree: { type: string }
              year: { type: integer }

    DoctorProfile:
      allOf:
        - $ref: '#/components/schemas/Doctor'
        - type: object
          properties:
            mdcn_number: { type: string, nullable: true }
            phone: { type: string, nullable: true }
            sub_specialty: { type: string, nullable: true }
            avatar_url: { type: string, nullable: true }
            created_at: { type: string, format: date-time }

    ConsultationSpecialty:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        doctor_count: { type: integer }
        is_featured: { type: boolean }

    DoctorDashboard:
      type: object
      properties:
        stats:
          type: object
          properties:
            weekly_revenue_kobo: { type: integer, format: int64 }
            revenue_growth_pct: { type: number, format: float }
            patients_seen: { type: integer }
            rating: { type: number, format: float }
            is_online: { type: boolean }
        pending_requests:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              patient_name: { type: string }
              request_type: { type: string }
              created_at: { type: string, format: date-time }
        todays_appointments:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              patient_name: { type: string }
              time: { type: string }
              type: { type: string, enum: [video, in_person] }
              reason: { type: string }
              status: { type: string }

    SOAPNote:
      type: object
      properties:
        id: { type: string, format: uuid }
        appointment_id: { type: string, format: uuid }
        doctor_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        subjective: { type: string }
        objective: { type: string }
        assessment: { type: string }
        plan: { type: string }
        prescriptions:
          type: array
          items:
            type: object
            properties:
              drug: { type: string }
              dosage: { type: string }
              duration: { type: string }
