        chauffeur: { type: boolean }
        startAt: { type: string, format: date-time }
        durationHours: { type: integer }
        pickupAddress: { type: string, nullable: true }
        depositKobo: { type: integer, format: int64 }
        fareKobo: { type: integer, format: int64 }
        status: { type: string, enum: [requested, quoted, confirmed, active, extended, completed, cancelled] }
        settlementId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BusinessDelivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        batchId: { type: string, format: uuid, nullable: true }
        businessId: { type: string, format: uuid }
        courierId: { type: string, format: uuid, nullable: true }
        sequence: { type: integer }
        pickupAddress: { type: string }
        dropoffAddress: { type: string }
        receiverName: { type: string }
        receiverPhone: { type: string }
        parcelSize: { type: string }
        codKobo: { type: integer, format: int64 }
        fareKobo: { type: integer, format: int64 }
        status: { type: string, enum: [created, assigned, picked_up, delivered, failed, cancelled] }
        failureReason: { type: string, nullable: true }
        settlementId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BusinessInvoice:
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        deliveryCount: { type: integer }
        totalKobo: { type: integer, format: int64 }
        status: { type: string, enum: [open, issued, paid, void] }
        createdAt: { type: string, format: date-time }

    EventTransportOffer:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, nullable: true }
        organizerId: { type: string, format: uuid }
        type: { type: string, enum: [group_ride, fan_bus, shuttle, artist, crew, equipment_van] }
        title: { type: string }
        venueAddress: { type: string, nullable: true }
        venueLat: { type: number, format: double, nullable: true }
        venueLng: { type: number, format: double, nullable: true }
        geofenceRadiusM: { type: integer }
        capacity: { type: integer }
        bookedCount: { type: integer }
        fareKobo: { type: integer, format: int64 }
        departureTime: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [draft, open, full, departed, completed, cancelled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EventTransportBooking:
      type: object
      properties:
        id: { type: string, format: uuid }
        offerId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        ticketRef: { type: string, nullable: true }
        seats: { type: integer }
        fareKobo: { type: integer, format: int64 }
        qrCode: { type: string }
        status: { type: string, enum: [booked, confirmed, boarded, completed, cancelled, refunded] }
        settlementId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    # ── AI Customer Care ─────────────────────────────────────────────────────────
    SupportSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status: { type: string, enum: [open, escalated, resolved] }
        topic: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    SupportMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        role: { type: string, enum: [user, ai, agent] }
        content: { type: string }
        created_at: { type: string, format: date-time }

    # ── Vote bridge ──────────────────────────────────────────────────────────────
    VoteDebitRequest:
      type: object
      required: [contest_id, contestant_id, vote_count, cost_kobo, idempotency_key]
      properties:
        contest_id: { type: string, format: uuid }
        contestant_id: { type: string, format: uuid }
        vote_count: { type: integer, minimum: 1 }
        cost_kobo: { type: integer, format: int64, minimum: 1 }
        idempotency_key: { type: string }

    VoteDebitResponse:
      type: object
      properties:
        ok: { type: boolean }
        balance_kobo: { type: integer, format: int64 }
        idempotency_key: { type: string }

    # ── Disputes ─────────────────────────────────────────────────────────────────
    OpenDisputeRequest:
      type: object
      required: [reference, module_type, type, description]
      properties:
        reference: { type: string, description: "Transaction reference being disputed" }
        module_type: { type: string, description: "e.g. wallet, transport, restaurant" }
        type:
          type: string
          enum: [transfer, topup, vote, order, ticket, ride, contribution]
        description: { type: string, minLength: 20 }

    Dispute:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        reference: { type: string }
        module_type: { type: string }
        type: { type: string }
        description: { type: string }
        status: { type: string, enum: [open, investigating, resolved, closed] }
        resolution: { type: string, enum: [refund, partial_refund, no_action], nullable: true }
        admin_note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── Ratings ───────────────────────────────────────────────────────────────────
    CreateRatingRequest:
      type: object
      required: [entity_id, entity_type, transaction_ref, score]
      properties:
        entity_id: { type: string }
        entity_type:
          type: string
          enum: [doctor, pharmacy, restaurant, rider, driver, bus_operator, event_organiser, campaign, group_admin]
        transaction_ref: { type: string, description: "Prevents duplicate ratings per order/appointment/trip" }
        score: { type: number, format: float, minimum: 1.0, maximum: 5.0 }
        comment: { type: string, nullable: true }

    Rating:
      type: object
      properties:
        id: { type: string, format: uuid }
        rater_id: { type: string, format: uuid }
        entity_id: { type: string }
        entity_type: { type: string }
        transaction_ref: { type: string }
        score: { type: number, format: float }
        comment: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    RatingSummary:
      type: object
      properties:
        entity_id: { type: string }
        entity_type: { type: string }
        average: { type: number, format: float }
        count: { type: integer }

    # ── Bank transfers — multi-provider (ADR-011) ─────────────────────────────
    BankList:
      type: object
      required: [banks]
      properties:
        banks:
          type: array
          items: { $ref: '#/components/schemas/Bank' }
    AccountResolution:
      type: object
      required: [account_name, account_number, bank_code]
      properties:
        account_name: { type: string }
        account_number: { type: string }
        bank_code: { type: string }
    BankTransferRequest:
      type: object
      description: >
        wallet→bank payout request. `pin` is the transaction PIN (verified
        server-side, never logged). An Idempotency-Key header is required.
      required: [bank_code, account_number, amount_kobo, pin]
      properties:
        bank_code: { type: string }
        account_number: { type: string }
        amount_kobo: { type: integer, format: int64, description: Amount in minor units (kobo). }
        narration: { type: string }
        save_beneficiary: { type: boolean, description: Persist the destination as a saved beneficiary. }
        provider: { type: string, enum: [paystack, monnify], description: Optional — pin a provider; defaults to the registry default with failover. }
        pin: { type: string, description: Transaction PIN; verified server-side, never logged. }
    BankToBankRequest:
      type: object
      description: >
        bank→bank pass-through request (collection pay-in → payout). `pin` is the
        transaction PIN. An Idempotency-Key header is required.
      required: [source_bank_code, source_account_number, bank_code, account_number, amount_kobo, pin]
      properties:
        source_bank_code: { type: string }
        source_account_number: { type: string }
        bank_code: { type: string }
        account_number: { type: string }
        amount_kobo: { type: integer, format: int64, description: Amount in minor units (kobo). }
        narration: { type: string }
        provider: { type: string, enum: [paystack, monnify] }
        pin: { type: string, description: Transaction PIN; verified server-side, never logged. }
    BankTransfer:
      type: object
      required: [id, reference, user_id, type, source_type, status, amount_kobo, created_at]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        user_id: { type: string, format: uuid }
        type: { type: string, description: Transfer type (e.g. wallet→bank, bank→bank). }
        source_type:
          type: string
          enum: [wallet, bank]
          description: Funding source — wallet debit, or bank collection pass-through.
        provider:
          type: string
          enum: [paystack, monnify]
          description: Provider that handled the transfer; persisted for webhook routing.
        status:
          type: string
          description: >
            funds_reserved (wallet src) | awaiting_funding → funded (bank src) →
            provider_initiated → successful | failed | reversed.
          enum: [funds_reserved, awaiting_funding, funded, provider_initiated, successful, failed, reversed]
        amount_kobo: { type: integer, format: int64 }
        fee_kobo: { type: integer, format: int64 }
        bank_name: { type: string }
        account_name: { type: string }
        account_number_last4: { type: string }
        provider_transfer_ref: { type: string }
        narration: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Beneficiary:
      type: object
      required: [id, bank_code, account_number_last4, account_name]
      properties:
        id: { type: string, format: uuid }
        bank_code: { type: string }
        bank_name: { type: string }
        account_number_last4: { type: string }
        account_name: { type: string }
        nickname: { type: string }
        provider: { type: string, enum: [paystack, monnify] }
    ProviderHealth:
      type: object
      required: [provider, healthy]
      properties:
        provider: { type: string, enum: [paystack, monnify] }
        healthy: { type: boolean }
        last_checked: { type: string, format: date-time }

    # ── KYC verification (multi-provider, ADR-013) ────────────────────────────
    VerificationSession:
      type: object
      required: [id, user_id, target_tier, status, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        target_tier: { type: integer, minimum: 1, maximum: 3 }
        status:
          type: string
          enum: [UNVERIFIED, TIER_PENDING, TIER_VERIFIED, TIER_FAILED, NEEDS_REVIEW, APPROVED, REJECTED]
        created_at: { type: string, format: date-time }
    VerificationCheck:
      type: object
      required: [id, session_id, type, provider, status, created_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        type:
          type: string
          enum: [ID_NUMBER, ID_FACIAL, LIVENESS, DOCUMENT, AML]
        provider:
          type: string
          enum: [dojah, smileid, youverify]
          description: Provider that served the check (routing may failover across providers).
        status:
          type: string
          enum: [INITIATED, PENDING, PASSED, FAILED, REVIEW]
          description: >
            PENDING for async checks until the webhook/callback sets a terminal
            status. Confidence below threshold yields REVIEW (never a silent fail).
        match:
          type: boolean
          nullable: true
          description: Whether the identity/biometric matched (null until resolved).
        confidence:
          type: number
          nullable: true
          description: Provider confidence score (e.g. face match), gated by the routing threshold.
        extracted_fields:
          type: object
          additionalProperties: true
          description: Normalized OCR/lookup fields (never the raw provider DTO).
        reason:
          type: string
          nullable: true
          description: Human-readable reason for FAILED/REVIEW.
        created_at: { type: string, format: date-time }
    KycConsentRequest:
      type: object
      required: [scope, version]
      properties:
        scope:
          type: string
          description: Consent scope (e.g. identity_verification, biometric, aml_screening).
        version:
          type: string
          description: Version of the consent text the member agreed to.
    KycRoutingRule:
      type: object
      required: [check_type, ordered_providers, enabled]
      properties:
        check_type:
          type: string
          enum: [ID_NUMBER, ID_FACIAL, LIVENESS, DOCUMENT, AML]
        ordered_providers:
          type: array
          description: Provider failover order for this check type.
          items: { type: string, enum: [dojah, smileid, youverify] }
        threshold:
          type: number
          description: PASS/REVIEW confidence gate for this check type.
        enabled: { type: boolean }

    # ── Arena competition engine (ADR-014) ────────────────────────────────────
    Competition:
      type: object
      required: [id, slug, name, status]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [DRAFT, OPEN, SCREENING, RUNNING, FINALE, CLOSED]
    Contestant:
      type: object
      required: [id, competition_id, user_id, state]
      properties:
        id: { type: string, format: uuid }
        competition_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        state:
          type: string
          enum: [APPLIED, SCREENED, TRAINED, THEORY_ASSIGNED, THEORY_TAKEN, QUALIFIED, FINALIST, CROWNED, ELIMINATED, REJECTED, WITHDRAWN]
        home_state: { type: string, nullable: true }
        theory_batch: { type: string, nullable: true }
    MeritLeaderboardRow:
      type: object
      required: [contestant_id, stage, total_score, rank]
      description: >
        A row of the signed Merit ledger projection. NDC-1: the crown is a pure
        function of these rows only — Support / Play-Along / Sponsor never affect them.
      properties:
        contestant_id: { type: string, format: uuid }
        stage: { type: string }
        total_score: { type: number }
        rank: { type: integer }
    SupportRequest:
      type: object
      required: [contestant_id, amount_kobo]
      description: >
        Support-rail gifting (real Naira, integer kobo). NDC-1: never touches the
        Merit ledger and can never affect the crown.
      properties:
        contestant_id: { type: string, format: uuid }
        amount_kobo: { type: integer, format: int64, minimum: 1 }
    PotView:
      type: object
      required: [competition_id, total_kobo, split_formula, disbursement_status]
      properties:
        competition_id: { type: string, format: uuid }
        total_kobo: { type: integer, format: int64 }
        split_formula: { type: string }
        disbursement_status: { type: string }
    CredentialVerify:
      type: object
      required: [type, status, issued_at, verifiable_hash, valid]
      properties:
        type: { type: string, enum: [CERTIFIED_SAFE_DRIVER, NAIJA_DRIVER] }
        status: { type: string, enum: [ISSUED, REVOKED] }
        issued_at: { type: string, format: date-time }
        verifiable_hash: { type: string }
        valid: { type: boolean }

    # ── Fractional Real Estate / Land crowd-investing (fractionalre) ──────────
    # Merged from contracts/fractionalre.openapi.yaml on 2026-07-03 and aligned
    # to the shipped implementation (backend/internal/fractionalre). All money
    # is integer kobo; every money-moving POST requires Idempotency-Key.
    Money:
      type: integer
      format: int64
      description: Amount in kobo (minor units) — never floats, never strings.
    FreOffering:
      type: object
      description: A funding round over a vetted asset (fre_offerings).
      properties:
        id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        name: { type: string }
        unit_price_kobo: { $ref: '#/components/schemas/Money' }
        share_count: { type: integer, format: int64 }
        target_kobo: { $ref: '#/components/schemas/Money' }
        min_threshold_kobo: { $ref: '#/components/schemas/Money' }
        ticket_min_kobo: { $ref: '#/components/schemas/Money' }
        ticket_max_kobo: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [draft, open, closing, funded, refunding, refunded, closed] }
        opens_at: { type: string, format: date-time }
        closes_at: { type: string, format: date-time }
        extension_days: { type: integer, maximum: 30 }
        raised_kobo: { $ref: '#/components/schemas/Money' }
        units_sold: { type: integer, format: int64 }
        investor_count: { type: integer }
        escrow_reference: { type: string }
        created_at: { type: string, format: date-time }
    FreSubscription:
      type: object
      description: An investor's escrowed commitment into a round (fre_subscriptions).
      properties:
        id: { type: string, format: uuid }
        offering_id: { type: string, format: uuid }
        user_id: { type: string }
        units: { type: integer, format: int64 }
        amount_kobo: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [escrowed, allocated, refunded] }
        settlement_id: { type: string }
        idempotency_key: { type: string }
        risk_ack_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    FreSubscribeRequest:
      type: object
      required: [units]
      properties:
        units: { type: integer, format: int64, minimum: 1 }
    FreCapTableEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        offering_id: { type: string, format: uuid }
        user_id: { type: string }
        units: { type: integer, format: int64 }
        cost_kobo: { $ref: '#/components/schemas/Money' }
        pct_bps: { type: integer, description: Ownership in basis points (projection) }
        source: { type: string, enum: [primary, secondary] }
        cert_ref: { type: string }
        acquired_at: { type: string, format: date-time }
    FreInvestorProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string }
        classification: { type: string, enum: [retail, hni, qualified] }
        declared_annual_income_kobo: { $ref: '#/components/schemas/Money' }
        ytd_invested_kobo: { $ref: '#/components/schemas/Money' }
        ytd_year: { type: integer }
        suitability_score: { type: integer }
        suitability_completed_at: { type: string, format: date-time }
        master_risk_ack_id: { type: string, format: uuid }
        status: { type: string, enum: [inactive, active, suspended] }
        activated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    FreLimitCheck:
      type: object
      description: Result of the retail 10%-of-annual-income cap check (fail-closed server-side).
      properties:
        user_id: { type: string }
        classification: { type: string, enum: [retail, hni, qualified] }
        exempt: { type: boolean }
        annual_income_kobo: { $ref: '#/components/schemas/Money' }
        cap_kobo: { $ref: '#/components/schemas/Money' }
        ytd_invested_kobo: { $ref: '#/components/schemas/Money' }
        remaining_kobo: { $ref: '#/components/schemas/Money' }
        requested_kobo: { $ref: '#/components/schemas/Money' }
        allowed: { type: boolean }
        soft_warn: { type: boolean, description: true when >= 80% of the cap after this investment }
        reason: { type: string }
    FreDistribution:
      type: object
      description: A maker-checker payout run (fre_distributions).
      properties:
        id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        offering_id: { type: string, format: uuid }
        period_label: { type: string }
        gross_kobo: { $ref: '#/components/schemas/Money' }
        fee_kobo: { $ref: '#/components/schemas/Money' }
        withholding_kobo: { $ref: '#/components/schemas/Money' }
        net_kobo: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [draft, submitted, approved, paid, partial, failed] }
        maker_id: { type: string }
        checker_id: { type: string, description: Must differ from maker_id (SoD) }
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }
    FreSecondaryListing:
      type: object
      properties:
        id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        seller_id: { type: string }
        units: { type: integer, format: int64 }
        units_remaining: { type: integer, format: int64 }
        unit_price_kobo: { $ref: '#/components/schemas/Money' }
        nav_at_list_kobo: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [active, filled, cancelled, halted] }
        idempotency_key: { type: string, description: Client key honoured with replay semantics }
        created_at: { type: string, format: date-time }
    FreSecondaryOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        buyer_id: { type: string }
        seller_id: { type: string }
        units: { type: integer, format: int64 }
        amount_kobo: { $ref: '#/components/schemas/Money' }
        fee_kobo: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [escrowed, settled, refunded, failed] }
        settlement_id: { type: string }
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }
    FreMarketControls:
      type: object
      properties:
        trading_enabled: { type: boolean }
        fee_bps: { type: integer, minimum: 0 }
        updated_by: { type: string }
    FreAutoInvestPlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string }
        amount_kobo: { $ref: '#/components/schemas/Money' }
        cadence: { type: string, enum: [weekly, monthly] }
        asset_type: { type: string, enum: [income_property, development_debt, land] }
        status: { type: string, enum: [active, paused, failed] }
        next_run_at: { type: string, format: date-time }
        last_run_at: { type: string, format: date-time }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
    FreBeneficiary:
      type: object
      description: Next-of-kin designation on FRE holdings (per-user share total <= 100%, max 10).
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 80 }
        relationship: { type: string, minLength: 2, maxLength: 40 }
        share_pct: { type: integer, minimum: 1, maximum: 100 }
        created_at: { type: string, format: date-time }
    FreBeneficiaryCreate:
      type: object
      required: [name, relationship, share_pct]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        relationship: { type: string, minLength: 2, maxLength: 40 }
        share_pct: { type: integer, minimum: 1, maximum: 100 }
    FreReferralSummary:
      type: object
      description: Thin projection over the platform referral engine; enabled=false renders "coming soon".
      required: [enabled]
      properties:
        enabled: { type: boolean }
        code: { type: string }
        invited: { type: integer, description: Mirrors joined — the engine records completed referrals only }
        joined: { type: integer }
        earned_kobo: { $ref: '#/components/schemas/Money' }
    FreReconciliationRow:
      type: object
      description: Per-offering escrow reconciliation — raised_kobo projection vs recomputed subscription sum.
      properties:
        offering_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [open, closing, funded] }
        raised_kobo: { $ref: '#/components/schemas/Money' }
        subscribed_kobo: { $ref: '#/components/schemas/Money' }
        delta_kobo: { $ref: '#/components/schemas/Money' }
        mismatch: { type: boolean }
    FreAuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: string }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    # ── Connect (discovery / swipe / matching / boosts) ──────────────────────
    # camelCase responses (the Connect member API returns camelCase, unlike the
    # snake_case finance modules). ProfileCard carries NO raw lat/lng — location
    # is exposed only as an opaque distanceLabel + coarse distanceBucket (privacy
    # by design; see ADR-019). Boosts are a money-path feature (kobo, ledger).
    ConnectProfileCard:
      type: object
      description: >
        A discovery card. Privacy-preserving projection of a Connect profile —
        never exposes raw coordinates. Distance is a human label plus a coarse
        bucket only.
      required: [id, displayName, photos, modes, verified]
      properties:
        id:            { type: string, description: Opaque profile id }
        displayName:   { type: string }
        age:           { type: integer, minimum: 18, nullable: true, description: Derived from dob server-side; raw dob never exposed }
        bio:           { type: string, nullable: true }
        photos:
          type: array
          items: { type: string, format: uri }
          description: Moderation-approved photo/clip URLs only
        modes:
          type: array
          description: Modes this profile is discoverable in
          items: { type: string, enum: [dating, friendship, professional, creator, event] }
        verified:      { type: boolean, description: L0/L1 verification passed }
        distanceLabel: { type: string, nullable: true, example: "Within 5 km", description: Human-readable coarse distance; NEVER raw coordinates }
        distanceBucket:
          type: string
          nullable: true
          enum: [here, near, city, region, far]
          description: Coarse distance bucket (privacy by design); the only machine-readable proximity signal
    ConnectStackResponse:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items: { $ref: '#/components/schemas/ConnectProfileCard' }
    ConnectLikesYouResponse:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items: { $ref: '#/components/schemas/ConnectProfileCard' }
    ConnectNearbyResponse:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items: { $ref: '#/components/schemas/ConnectProfileCard' }
    ConnectSwipeRequest:
      type: object
      required: [targetId, direction]
      properties:
        targetId:  { type: string, description: Opaque id of the swiped profile }
        direction:
          type: string
          enum: [like, pass, superlike]
          description: like/superlike record interest; pass persists to connect_passes so the card is not re-shown
    ConnectSwipeResult:
      type: object
      required: [match]
      properties:
        match:   { type: boolean, description: True when the swipe produced a mutual match }
        matchId: { type: string, nullable: true, description: Present only when match is true }
    ConnectBoost:
      type: object
      description: A discovery visibility boost. Money-path artefact (charged in kobo).
      required: [id, status, priceKobo, durationMinutes, startedAt, expiresAt]
      properties:
        id:              { type: string }
        status:
          type: string
          enum: [active, expired, refunded]
        priceKobo:       { type: integer, format: int64, minimum: 0, description: Minor units (kobo) }
        durationMinutes: { type: integer, minimum: 1 }
        startedAt:       { type: string, format: date-time }
        expiresAt:       { type: string, format: date-time }
    ConnectBoostStatusResponse:
      type: object
      description: Current boost status plus purchase parameters (backend-owned price).
      required: [priceKobo, durationMinutes]
      properties:
        activeBoost:     { allOf: [ { $ref: '#/components/schemas/ConnectBoost' } ], nullable: true }
        priceKobo:       { type: integer, format: int64, minimum: 0 }
        durationMinutes: { type: integer, minimum: 1 }
    ConnectBoostPurchaseResponse:
      type: object
      required: [boost]
      properties:
        boost: { $ref: '#/components/schemas/ConnectBoost' }
    ConnectRewindResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    # ── Marketplace (Agent C — marketplace swarm) ────────────────────────────
    # Base path /v1/marketplace. Uniform error shape per
    # docs/prd/marketplace/SWARM_INTEGRATION_CONTRACT.md §3 — distinct from the
    # legacy { success, error } Error schema above; every Marketplace endpoint
    # below uses MarketplaceError instead. All money fields are integer kobo.
    MarketplaceError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: "Machine-readable error code, e.g. LISTING_NOT_ESCROW_ELIGIBLE" }
