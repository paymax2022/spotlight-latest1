  # ╔══════════════════════════════════════════════════════════════════════╗
  # ║ Connect — discovery / swipe / matching / boosts (camelCase responses) ║
  # ║ Bearer-authed member routes under /api/v1/connect. No raw coordinates ║
  # ║ leave the server (ADR-019). Boost purchase is a money path.           ║
  # ╚══════════════════════════════════════════════════════════════════════╝
  /api/v1/connect/discovery/stack:
    get:
      operationId: connectDiscoveryStack
      summary: Fetch the next discovery stack of profile cards
      description: >
        Returns a ranked stack of privacy-preserving profile cards for the
        signed-in member. Cards never contain raw lat/lng — only a coarse
        distanceLabel/distanceBucket.
      tags: [Connect]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Discovery stack
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectStackResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing connect.discovery.access permission or module flag off }
  /api/v1/connect/discovery/swipe:
    post:
      operationId: connectDiscoverySwipe
      summary: Record a swipe (like / pass / superlike) and resolve a match
      description: >
        Records the member's swipe on a target profile. like/superlike persist to
        connect_likes; pass persists to connect_passes so the card is not re-shown.
        Returns whether a mutual match was created.
      tags: [Connect]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectSwipeRequest' }
      responses:
        '200':
          description: Swipe result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectSwipeResult' }
        '400': { description: Invalid request (missing targetId/direction) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing connect.discovery.access permission }
  /api/v1/connect/discovery/likes-you:
    get:
      operationId: connectDiscoveryLikesYou
      summary: Profiles that have liked the signed-in member (premium surface)
      tags: [Connect]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profiles who liked you
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectLikesYouResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing connect.discovery.access permission or entitlement }
  /api/v1/connect/discovery/nearby:
    get:
      operationId: connectDiscoveryNearby
      summary: Nearby profiles by coarse distance bucket (no raw coordinates)
      description: >
        Returns nearby profile cards ordered by proximity, exposed ONLY as a
        coarse distanceBucket/distanceLabel. Raw coordinates never leave the
        server (ADR-019 privacy decision).
      tags: [Connect]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Nearby profiles (bucketed distance only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectNearbyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing connect.discovery.access permission }
  /api/v1/connect/discovery/rewind:
    post:
      operationId: connectDiscoveryRewind
      summary: Undo the last swipe (premium)
      description: >
        Reverts the member's most recent swipe (removes the like/pass row so the
        card returns to the stack). Premium/entitlement gated.
      tags: [Connect]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Rewind acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectRewindResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Premium entitlement or connect.discovery.access missing }
        '409': { description: No swipe to rewind }
  /api/v1/connect/discovery/boosts:
    get:
      operationId: connectDiscoveryBoostStatus
      summary: Current boost status and purchase parameters
      description: >
        Returns the member's active boost (if any) plus the backend-owned price
        and duration for purchasing a new one. Price is never client-supplied.
      tags: [Connect]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Boost status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectBoostStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing connect.discovery.access permission }
    post:
      operationId: connectDiscoveryBoostPurchase
      summary: Purchase a discovery boost (MONEY — wallet charge, double-entry ledger)
      description: >
        Charges the member's wallet in kobo for a discovery boost and posts a
        balanced double-entry ledger journal, emits an audit event, and enforces
        tier limits fail-closed. The Idempotency-Key header is REQUIRED and fails
        closed (HTTP 400) if absent. Price/duration are backend-owned; the client
        never supplies the amount. Retries with the same key return the original
        boost with no double-charge. Requires connect.boost.purchase.
      tags: [Connect]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Boost purchased
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectBoostPurchaseResponse' }
        '400': { description: Idempotency-Key missing / invalid }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { description: Insufficient wallet balance }
        '403': { description: Missing connect.boost.purchase permission }
        '409': { description: Tier-limit exceeded or boost already active }
        '503': { description: Ledger/wallet unavailable (fail-closed) }

  # ── Flat legacy Connect routes (kept for existing clients) ────────────────
  /api/v1/connect/discovery:
    get:
      operationId: connectDiscoveryFlat
      summary: Flat discovery feed (legacy alias of discovery/stack)
      tags: [Connect]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Discovery profiles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectStackResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/connect/search:
    get:
      operationId: connectSearch
      summary: Search profiles (privacy-preserving profile cards)
      tags: [Connect]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: Free-text query }
        - { name: mode, in: query, required: false, schema: { type: string, enum: [dating, friendship, professional, creator, event] } }
      responses:
        '200':
          description: Matching profiles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectStackResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/connect/likes:
    post:
      operationId: connectLikesFlat
      summary: Record a like on a target profile (flat alias)
      tags: [Connect]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectSwipeRequest' }
      responses:
        '200':
          description: Swipe/like result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectSwipeResult' }
        '400': { description: Invalid request (missing targetId/direction) }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/connect/matches:
    get:
      operationId: connectMatches
      summary: List the member's mutual matches
      tags: [Connect]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Mutual matches (profile cards)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectStackResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ╔══════════════════════════════════════════════════════════════════════╗
  # ║ MARKETPLACE — Agent C (marketplace swarm, appended, does not modify   ║
  # ║ any path above). Base path /v1/marketplace. Feature flag:             ║
  # ║ FEATURE_MARKETPLACE_ENABLED (default OFF — when OFF every route below ║
  # ║ returns 503 { error: { code: "FEATURE_DISABLED", ... } }).             ║
  # ║ Auth: Bearer JWT (RequireAuthContext). Admin routes additionally      ║
  # ║ require guard("marketplace.admin.<perm>") RBAC and MUST include       ║
  # ║ reason_code in the body on every mutating action (writes              ║
  # ║ mkt_admin_audit_log automatically via middleware, never optionally).  ║
  # ║ Idempotency-Key header is REQUIRED on every money-touching POST/PUT   ║
  # ║ (order create/fund, dispute open, boost purchase) — 24h Redis dedupe  ║
  # ║ window; a replay with the same key returns the ORIGINAL response      ║
  # ║ body with 409, not a fresh mutation. Pagination: ?cursor&limit        ║
  # ║ (1-50, default 20), response includes next_cursor. Source of truth:   ║
  # ║ docs/prd/marketplace/SWARM_INTEGRATION_CONTRACT.md +                  ║
  # ║ docs/prd/marketplace/Paymax_Marketplace_CLAUDE_BUILD_CONTRACT.md §3.   ║
  # ╚══════════════════════════════════════════════════════════════════════╝

  # ── Listings ───────────────────────────────────────────────────────────
  /v1/marketplace/listings:
    post:
      operationId: mktCreateListing
      summary: Create a listing (Smart Composer submit)
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MktListingCreateRequest' }
      responses:
        '201':
          description: Listing created (pending_review or auto-approved active)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktListingCreateResponse' }
        '400':
          description: "SCHEMA_VALIDATION_FAILED (field-level errors array included)"
          content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceError' } } }
        '401': { $ref: '#/components/responses/MktUnauthorized' }
        '422':
          description: "DESCRIPTION_TOO_SHORT | INSUFFICIENT_PHOTOS | PRICE_OUT_OF_BAND | DUPLICATE_PHOTO_DETECTED"
          content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceError' } } }
  /v1/marketplace/listings/{id}:
    get:
      operationId: mktGetListing
      summary: Get listing detail
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Listing detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktListingDetail' }
        '404': { $ref: '#/components/responses/MktNotFound' }
    put:
      operationId: mktUpdateListing
      summary: Update a listing (owner only; blocked while a non-terminal order references it)
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MktListingCreateRequest' }
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktListing' }
        '403': { $ref: '#/components/responses/MktForbidden' }
        '404': { $ref: '#/components/responses/MktNotFound' }
        '409':
          description: "LISTING_HAS_ACTIVE_ORDER — price/core-attribute changes blocked while a non-terminal order references this listing"
          content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceError' } } }
  /v1/marketplace/listings/{id}/submit:
    post:
      operationId: mktSubmitListing
      summary: Submit a draft listing for review/auto-approval
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Listing transitioned to pending_review or active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktListing' }
        '422': { $ref: '#/components/responses/MktUnprocessable' }

  # ── Search & categories ───────────────────────────────────────────────
  /v1/marketplace/search:
    get:
      operationId: mktSearch
      summary: Search listings (function_score ranked, boosts additive per §4)
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: category_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: price_min, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: price_max, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: condition, in: query, required: false, schema: { type: string, enum: [new, used, foreign_used, local_used, refurbished] } }
        - { name: lat, in: query, required: false, schema: { type: number, format: double } }
        - { name: lng, in: query, required: false, schema: { type: number, format: double } }
        - { name: radius_km, in: query, required: false, schema: { type: number, format: double } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: lga, in: query, required: false, schema: { type: string } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [relevance, price_asc, price_desc, newest, trusted_first], default: relevance } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Search results (p95<250ms budget monitored via took_ms)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktSearchResponse' }
  /v1/marketplace/categories:
    get:
      operationId: mktListCategories
      summary: List categories
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MktCategory' } }
  /v1/marketplace/categories/{id}:
    get:
      operationId: mktGetCategory
      summary: Get category (incl. attribute_schema for Smart Composer forms)
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Category detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktCategory' }
        '404': { $ref: '#/components/responses/MktNotFound' }

  # ── Offers ─────────────────────────────────────────────────────────────
  /v1/marketplace/offers:
    post:
      operationId: mktCreateOffer
      summary: Make an offer on a listing
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MktOfferCreateRequest' }
      responses:
        '201':
          description: Offer created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktOffer' }
        '422': { $ref: '#/components/responses/MktUnprocessable' }
  /v1/marketplace/offers/{id}/accept:
    post:
      operationId: mktAcceptOffer
      summary: Accept an offer (seller)
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
