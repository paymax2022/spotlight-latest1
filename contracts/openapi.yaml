  # ── Bus provider marketplace (interstate, self-service) ───────────────────────
  # Customer discovery = bearerAuth. Provider routes = bearerAuth + ownership
  # (owner_user_id); a non-provider caller gets 403. See ADR-020 and
  # supabase/migrations/20260907000000_bus_provider_marketplace.sql.
  /mobility/bus/search:
    get:
      operationId: busSearch
      summary: Search bookable interstate trips (state pair / provider / date)
      tags: [Mobility Bus]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: fromState, in: query, schema: { type: string } }
        - { name: toState, in: query, schema: { type: string } }
        - { name: providerId, in: query, schema: { type: string, format: uuid } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Matching trips
          content:
            application/json:
              schema:
                type: object
                properties:
                  trips: { type: array, items: { $ref: '#/components/schemas/BusTrip' } }
        '400':
          description: fromState and toState are both present and equal (interstate only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobilityError' }
  /mobility/bus/providers:
    get:
      operationId: busProviders
      summary: List active bus providers (state / free-text filters)
      tags: [Mobility Bus]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers: { type: array, items: { $ref: '#/components/schemas/BusProviderCard' } }
  /mobility/bus/providers/{id}:
    get:
      operationId: busProviderDetail
      summary: Provider profile + published routes
      tags: [Mobility Bus]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Provider detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { $ref: '#/components/schemas/BusProviderDetail' }
                  routes: { type: array, items: { $ref: '#/components/schemas/BusRoute' } }
        '404': { description: Unknown provider }
  /mobility/bus/provider/register:
    post:
      operationId: busProviderRegister
      summary: Register the caller as a bus provider (active on register, verification pending)
      tags: [Mobility Bus]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusProviderRegisterRequest' }
      responses:
        '201':
          description: Provider created
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { $ref: '#/components/schemas/BusProviderDetail' }
        '409': { description: Caller is already a registered bus provider }
  /mobility/bus/provider/me:
    get:
      operationId: busProviderMe
      summary: Caller's provider profile, routes, and upcoming schedules
      tags: [Mobility Bus]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Provider dashboard (provider may be null if not registered)
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { oneOf: [ { $ref: '#/components/schemas/BusProviderDetail' }, { type: 'null' } ] }
                  routes: { type: array, items: { $ref: '#/components/schemas/BusRoute' } }
                  upcomingSchedules: { type: array, items: { $ref: '#/components/schemas/BusSchedule' } }
    patch:
      operationId: busProviderUpdate
      summary: Update the caller's provider profile
      tags: [Mobility Bus]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Partial update (snake_case). All fields optional.
              properties:
                business_name: { type: string }
                contact_phone: { type: string }
                contact_email: { type: string, nullable: true }
                logo_url: { type: string, nullable: true }
                description: { type: string, nullable: true }
                base_state: { type: string, nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { $ref: '#/components/schemas/BusProviderDetail' }
        '403': { description: Caller is not a registered bus provider }
  /mobility/bus/provider/routes:
    post:
      operationId: busProviderRouteCreate
      summary: Publish an interstate route (from_state <> to_state)
      tags: [Mobility Bus]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusRouteCreateRequest' }
      responses:
        '201':
          description: Route created
          content:
            application/json:
              schema:
                type: object
                properties:
                  route: { $ref: '#/components/schemas/BusRoute' }
        '400':
          description: from_state == to_state (interstate constraint)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobilityError' }
        '403': { description: Caller is not a registered bus provider }
  /mobility/bus/provider/routes/{id}:
    patch:
      operationId: busProviderRouteUpdate
      summary: Update one of the caller's routes (ownership enforced)
      tags: [Mobility Bus]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Partial route update (snake_case). All fields optional.
              properties:
                from_city: { type: string, nullable: true }
                to_city: { type: string, nullable: true }
                bus_type: { type: string, nullable: true }
                base_fare_kobo: { type: integer, format: int64, minimum: 0 }
                amenities: { type: array, items: { type: string } }
                active: { type: boolean }
      responses:
        '200':
          description: Route updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  route: { $ref: '#/components/schemas/BusRoute' }
        '403': { description: Route is not owned by the caller }
        '404': { description: Unknown route }
  /mobility/bus/provider/routes/{id}/schedules:
    post:
      operationId: busProviderScheduleCreate
      summary: Post a specific departure on one of the caller's routes
      tags: [Mobility Bus]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusScheduleCreateRequest' }
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedule: { $ref: '#/components/schemas/BusSchedule' }
        '403': { description: Route is not owned by the caller }
        '404': { description: Unknown route }
  /mobility/bus/provider/bookings:
    get:
      operationId: busProviderBookings
      summary: Boarding manifest for one of the caller's schedules
      tags: [Mobility Bus]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: scheduleId, in: query, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings: { type: array, items: { $ref: '#/components/schemas/BusManifestEntry' } }
        '403': { description: Schedule is not owned by the caller }

