      responses:
        '200':
          description: Offer accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MktOffer' }
        '403': { $ref: '#/components/responses/MktForbidden' }
        '409': { $ref: '#/components/responses/MktConflict' }
  /v1/marketplace/offers/{id}/counter:
    post:
      operationId: mktCounterOffer
      summary: Counter an offer (seller)
      tags: [Marketplace]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MktOfferCreateRequest' }
      responses:
        '201':
          description: Counter-offer created (chained via parent_offer_id)
