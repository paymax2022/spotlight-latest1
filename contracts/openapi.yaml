openapi: 3.1.0
info:
  title: Paymax × Spotlight Super App API
  version: 2.0.0
  description: >
    Fintech super-app layer — wallet, KYC, FX, transfers, referrals, VA, and vertical modules.
    All monetary amounts are integers in minor units (kobo / currency-minor-unit).
    All mutation endpoints require an Idempotency-Key header.
    Authentication: Bearer JWT issued by Supabase Auth.
    Go backend routes: /api/finance/* (feature-flagged, gated on DATABASE_URL).
    Legacy Next.js routes: /api/v1/* (stable, unchanged).

servers:
  - url: /api/finance
    description: Go backend — financial core (Paymax v2)
  - url: /api/v1
    description: Stable fintech API (Next.js route handlers, v1 blocks 0-12)
  - url: /api/v2
    description: Bridge API (wraps protected legacy vote engine)

# ── Shared components ──────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: >
        Client-generated unique key. Identical requests with the same key
        within 24 hours return the cached response without side effects.

  schemas:
    SuccessResponse:
      description: Generic success acknowledgement for state-transition/action endpoints with no payload.
      type: object
      properties:
        success: { type: boolean }

    # ── MapService (provider-agnostic maps abstraction) ───────────────────────
    # Every result carries `provider` + `source`. `source` is the licensing
    # stack ('openstack' | 'google' | 'mapbox' | 'own'); the client may only
    # render a point on a basemap with a matching source (license coherence).
    MapPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        source:
          type: string
          enum: [openstack, google, mapbox, own]
          description: Licensing stack the coordinate originated from.
    MapGeoResult:
      type: object
      required: [lat, lng, provider, source, cacheable]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        address: { type: string }
        plus_code: { type: string, description: Open Location Code (Plus Code) }
        provider: { type: string }
        source: { type: string, enum: [openstack, google, mapbox, own] }
        cacheable:
          type: boolean
          description: >
            false for Google-sourced results, which are NEVER persisted (the
            backend cache writer refuses them).
    MapSuggestion:
      type: object
      required: [label, provider, source]
      properties:
        label: { type: string }
        place_id: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        has_coords: { type: boolean }
        provider: { type: string }
        source: { type: string, enum: [openstack, google, mapbox, own] }
    MapPlace:
      type: object
      required: [name, lat, lng, provider, source]
      properties:
        name: { type: string }
        address: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        category: { type: string }
        place_id: { type: string }
        provider: { type: string }
        source: { type: string, enum: [openstack, google, mapbox, own] }
    MapRoute:
      type: object
      required: [distance_m, duration_s, provider, source]
      properties:
        distance_m: { type: integer }
        duration_s: { type: integer }
        polyline: { type: string, description: Encoded polyline geometry }
        provider: { type: string }
        source: { type: string, enum: [openstack, google, mapbox, own] }
        degraded:
          type: boolean
          description: true when served by a degraded fallback provider (cost guard).
    MapMatrixCell:
      type: object
      properties:
        distance_m: { type: integer }
        duration_s: { type: integer }
    MapMatrix:
      type: object
      required: [rows, provider, source]
      properties:
        rows:
          type: array
          items:
            type: array
            items: { $ref: '#/components/schemas/MapMatrixCell' }
          description: rows[i][j] is origins[i] -> dests[j].
        provider: { type: string }
        source: { type: string, enum: [openstack, google, mapbox, own] }
    MapPolyline:
      type: object
      required: [provider, source]
      properties:
        points:
          type: array
          items: { $ref: '#/components/schemas/MapPoint' }
        encoded: { type: string }
        provider: { type: string }
        source: { type: string, enum: [openstack, google, mapbox, own] }
    MapStyleConfig:
      type: object
      required: [style_url, attribution, provider, source]
      properties:
        style_url: { type: string, description: MapLibre GL style URL }
        attribution: { type: string }
        provider: { type: string }
        source: { type: string, enum: [openstack, google, mapbox, own] }
    MapOwnEntity:
      type: object
      required: [entity_id, entity_type, lat, lng, distance_m]
      properties:
        entity_id: { type: string }
        entity_type: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        plus_code: { type: string }
        distance_m: { type: number, format: double }
    MapUsageRow:
      type: object
      properties:
        provider: { type: string }
        primitive: { type: string }
        month: { type: string }
        count: { type: integer, format: int64 }
        cap: { type: integer, format: int64 }
        pct: { type: integer }

    # ── Mobility (ride-hailing) ───────────────────────────────────────────────
    Place:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        address: { type: string }

    PricingConfig:
      type: object
      description: Admin-configurable per zone + service_type. Money in kobo; pct as fractions.
      properties:
        zone: { type: string }
        service_type: { type: string }
        currency: { type: string, default: NGN }
        base_fare_kobo: { type: integer, format: int64 }
        per_km_kobo: { type: integer, format: int64 }
        per_min_kobo: { type: integer, format: int64 }
        min_fare_kobo: { type: integer, format: int64 }
        fare_floor_pct: { type: number, description: "offers must be >= system_fare * this" }
        fare_ceiling_pct: { type: number, description: "offers must be <= system_fare * this" }
        driver_profit_floor_kobo: { type: integer, format: int64, description: "accepted fare net of commission must be >= this" }
        surge_multiplier: { type: number }
        cancellation_fee_kobo: { type: integer, format: int64 }
        waiting_fee_per_min_kobo: { type: integer, format: int64 }
        active: { type: boolean }

    EstimateRequest:
      type: object
      required: [pickup, dest]
      properties:
        pickup: { $ref: '#/components/schemas/Place' }
        dest: { $ref: '#/components/schemas/Place' }
        service_type: { type: string, default: ride_hailing }

    FareEstimate:
      type: object
      properties:
        distance_m: { type: integer }
        duration_s: { type: integer }
        system_fare_kobo: { type: integer, format: int64 }
        offer_min_kobo: { type: integer, format: int64 }
        offer_max_kobo: { type: integer, format: int64 }
        polyline: { type: string }

    MobilityError:
      type: object
      properties:
        error: { type: string }
        code:
          type: string
          enum: [FARE_BELOW_FLOOR, FARE_ABOVE_CEILING, INVALID_STATE, PIN_MISMATCH, DRIVER_NOT_APPROVED, NOT_FOUND, FORBIDDEN]

    # ── Transport Scheduling ───────────────────────────────────────────────────
    # Reuses the transport CodedError shape ({code,message} + HTTP status) via
    # MobilityError above for error responses. All money is BIGINT kobo.
    ScheduledPlace:
      type: object
      required: [label, lat, lng]
      properties:
        label: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }

    ScheduledBookingModePayload:
      type: object
      description: >
        Mode-specific fields. ride_hail/ride_share: pricing_mode, vehicle_class.
        parcel_intra/parcel_inter: dims, weight, inter_state flag.
        airport_pickup: flight_number, arrival_time, terminal (if arrival_time
        is set, scheduled_pickup_at is derived from it + buffer, adjustable).
        bus: schedule_id, seat_number (reuses the existing bus seat-booking flow).
      properties:
        pricing_mode: { type: string, enum: [instant, offer] }
        vehicle_class: { type: string }
        dims: { type: string }
        weight_kg: { type: number }
        inter_state: { type: boolean }
        flight_number: { type: string }
        arrival_time: { type: string, format: date-time }
        terminal: { type: string }
        schedule_id: { type: string, format: uuid }
        seat_number: { type: integer }
      additionalProperties: true

    ScheduledBookingCreateRequest:
      type: object
      required: [mode, scheduled_pickup_at, pickup]
      properties:
        mode:
          type: string
          enum: [ride_hail, ride_share, parcel_intra, parcel_inter, airport_pickup, bus]
        scheduled_pickup_at: { type: string, format: date-time }
        lead_time_minutes: { type: integer, description: "Per-mode default applied when omitted." }
        pickup: { $ref: '#/components/schemas/ScheduledPlace' }
        dropoff: { $ref: '#/components/schemas/ScheduledPlace' }
        mode_payload: { $ref: '#/components/schemas/ScheduledBookingModePayload' }
        payment_method: { type: string, default: wallet }

    ScheduledBookingUpdateRequest:
      type: object
      description: Reschedule time / edit params. Only permitted while status = scheduled.
      properties:
        scheduled_pickup_at: { type: string, format: date-time }
        lead_time_minutes: { type: integer }
        pickup: { $ref: '#/components/schemas/ScheduledPlace' }
        dropoff: { $ref: '#/components/schemas/ScheduledPlace' }
        mode_payload: { $ref: '#/components/schemas/ScheduledBookingModePayload' }
        payment_method: { type: string }

    ScheduledBookingEstimateRequest:
      type: object
      required: [mode, pickup]
      properties:
        mode:
          type: string
          enum: [ride_hail, ride_share, parcel_intra, parcel_inter, airport_pickup, bus]
        pickup: { $ref: '#/components/schemas/ScheduledPlace' }
        dropoff: { $ref: '#/components/schemas/ScheduledPlace' }
        mode_payload: { $ref: '#/components/schemas/ScheduledBookingModePayload' }

    ScheduledAdminActionRequest:
      type: object
      required: [reason_code]
      properties:
        reason_code: { type: string, description: Required on every admin mutation; written to the immutable transport audit log. }
        note: { type: string }

    ScheduledBooking:
      type: object
      description: >
        Mirrors supabase/migrations/20260906000000_transport_scheduled_bookings.sql
        (transport_scheduled_bookings) 1:1. Response bodies are camelCase (Go
        json tags), matching the rest of the transport/mobility API surface.
      properties:
        id: { type: string, format: uuid }
        marketId: { type: string, default: NG }
        userId: { type: string, format: uuid }
        mode:
          type: string
          enum: [ride_hail, ride_share, parcel_intra, parcel_inter, airport_pickup, bus]
        status:
          type: string
          enum: [scheduled, dispatch_pending, dispatched, completed, cancelled, failed_no_driver, expired]
        scheduledPickupAt: { type: string, format: date-time }
        leadTimeMinutes: { type: integer }
        timezone: { type: string, default: Africa/Lagos }
        pickupLabel: { type: string, nullable: true }
        pickup: { $ref: '#/components/schemas/ScheduledPlace' }
        dropoffLabel: { type: string, nullable: true }
        dropoff: { $ref: '#/components/schemas/ScheduledPlace' }
        modePayload: { $ref: '#/components/schemas/ScheduledBookingModePayload' }
        estimatedFareKobo: { type: integer, format: int64, nullable: true }
        currency: { type: string, default: NGN }
        paymentMethod: { type: string, default: wallet }
        materializedRef: { type: string, nullable: true, description: "id of the created Trip / parcel job / bus ticket once dispatched" }
        materializedKind: { type: string, nullable: true, enum: [trip, parcel, bus_ticket] }
        settlementId: { type: string, nullable: true, description: Escrow settlement ref, set at dispatch }
        dispatchAttempts: { type: integer }
        lastDispatchError: { type: string, nullable: true }
        reminder24hSentAt: { type: string, format: date-time, nullable: true }
        reminder1hSentAt: { type: string, format: date-time, nullable: true }
        cancelReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        dispatchedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }

    # ── Bus Provider Marketplace ─────────────────────────────────────────────────
    # Interstate (state→state) bus marketplace layered additively over bus_routes /
    # bus_schedules / bus_tickets. See supabase/migrations/
    # 20260907000000_bus_provider_marketplace.sql and backend/internal/transport/
    # bus_provider.go / bus_handler.go. RESPONSE bodies are camelCase (Go json
    # tags); *Request bodies are snake_case. Money is integer minor units (kobo).
    BusTrip:
      type: object
      description: A bookable interstate departure (schedule) surfaced by /mobility/bus/search.
      properties:
        scheduleId: { type: string, format: uuid }
        routeId: { type: string, format: uuid }
        provider:
          type: object
          properties:
            id: { type: string, format: uuid }
            businessName: { type: string }
            verified: { type: boolean, description: "true when the provider's verificationStatus is 'verified'." }
            ratingAvg: { type: number, format: double }
        fromState: { type: string }
        toState: { type: string }
        fromCity: { type: string, nullable: true }
        toCity: { type: string, nullable: true }
        busType: { type: string, nullable: true }
        departureTime: { type: string, format: date-time }
        seatsAvailable: { type: integer }
        fareKobo: { type: integer, format: int64 }
        amenities: { type: array, items: { type: string } }

    BusProviderCard:
      type: object
      description: Provider summary row from /mobility/bus/providers.
      properties:
        id: { type: string, format: uuid }
        businessName: { type: string }
        baseState: { type: string, nullable: true }
        verified: { type: boolean }
        ratingAvg: { type: number, format: double }
        routeCount: { type: integer }

    BusProviderDetail:
      type: object
      description: Full provider profile from /mobility/bus/providers/{id}.
      properties:
        id: { type: string, format: uuid }
        businessName: { type: string }
        baseState: { type: string, nullable: true }
        verified: { type: boolean }
        verificationStatus: { type: string, enum: [pending, verified, suspended] }
        ratingAvg: { type: number, format: double }
        ratingCount: { type: integer }
        slug: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        contactEmail: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        description: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }

    BusRoute:
      type: object
      description: An interstate route owned by a provider (from_state <> to_state enforced at UI, service, and DB CHECK).
      properties:
        id: { type: string, format: uuid }
        providerId: { type: string, format: uuid }
        fromState: { type: string }
        toState: { type: string }
        fromCity: { type: string, nullable: true }
        toCity: { type: string, nullable: true }
        busType: { type: string, nullable: true }
        baseFareKobo: { type: integer, format: int64 }
        amenities: { type: array, items: { type: string } }
        active: { type: boolean }
        nextDepartureTime: { type: string, format: date-time, nullable: true }

    BusSchedule:
      type: object
      description: A specific posted departure on a route. fareApproved gates go-live pricing trust.
      properties:
        id: { type: string, format: uuid }
        routeId: { type: string, format: uuid }
        departureTime: { type: string, format: date-time }
        totalSeats: { type: integer }
        fareKobo: { type: integer, format: int64 }
        fareApproved: { type: boolean }
        status: { type: string, enum: [scheduled, departed, cancelled] }

    BusManifestEntry:
      type: object
      description: One booked seat on a schedule (provider boarding manifest, /mobility/bus/provider/bookings).
      properties:
        ticketId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        seatNumber: { type: integer }
        passengerName: { type: string, nullable: true }
        passengerPhone: { type: string, nullable: true }
        boardingStatus: { type: string, enum: [not_boarded, boarded, no_show] }
        status: { type: string }
        qrCode: { type: string }

    BusProviderRegisterRequest:
      type: object
      required: [business_name, contact_phone, base_state]
      description: POST /mobility/bus/provider/register (snake_case). 409 if already a provider.
      properties:
        business_name: { type: string, minLength: 2, maxLength: 200 }
        contact_phone: { type: string }
        contact_email: { type: string, nullable: true }
        base_state: { type: string }
        description: { type: string, nullable: true }

    BusRouteCreateRequest:
      type: object
      required: [from_state, to_state, base_fare_kobo]
      description: >-
        POST /mobility/bus/provider/routes (snake_case). 400 when
        from_state == to_state (interstate constraint).
      properties:
        from_state: { type: string }
        to_state: { type: string }
        from_city: { type: string, nullable: true }
        to_city: { type: string, nullable: true }
        bus_type: { type: string, nullable: true }
        base_fare_kobo: { type: integer, format: int64, minimum: 0 }
        amenities: { type: array, items: { type: string } }

    BusScheduleCreateRequest:
      type: object
      required: [departure_time, total_seats, fare_kobo]
      description: POST /mobility/bus/provider/routes/{id}/schedules (snake_case).
      properties:
        departure_time: { type: string, format: date-time, description: RFC3339 }
        total_seats: { type: integer, minimum: 1, maximum: 80 }
        fare_kobo: { type: integer, format: int64, minimum: 0 }

    # ── FX Orchestration (normalized, provider-agnostic) ──────────────────────
    FxMoney:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, format: int64, description: Integer minor units (kobo/cents) }
        currency: { type: string, description: ISO-4217 code }
    FxFee:
      type: object
      properties:
        type: { type: string, enum: [provider_fee, rail_fee, paymax_spread] }
        amount: { $ref: '#/components/schemas/FxMoney' }
    FxRoute:
      type: object
      properties:
        provider: { type: string }
        corridor: { type: string }
        rail: { type: string, enum: [bank_transfer, mobile_money, iban, wallet, stablecoin] }
    FxAlternative:
      type: object
      properties:
        provider: { type: string }
        corridor: { type: string }
        rail: { type: string }
        allInRate: { type: number, format: double }
        destination: { $ref: '#/components/schemas/FxMoney' }
    FxQuoteRequest:
      type: object
      required: [source, destination, amount, intent]
      properties:
        source: { type: string, description: ISO-4217 }
        destination: { type: string, description: ISO-4217 }
        amount: { type: integer, format: int64, description: minor units of the amountType side }
        amountType: { type: string, enum: [source, destination], default: source }
        intent: { type: string, enum: [conversion, transfer, collection] }
        destinationRail: { type: string, enum: [bank_transfer, mobile_money, iban, wallet, stablecoin] }
        lock: { type: boolean, default: false }
    FxQuote:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [quoted, locked, consumed, expired] }
        amountType: { type: string }
        source: { $ref: '#/components/schemas/FxMoney' }
        destination: { $ref: '#/components/schemas/FxMoney' }
        rate: { type: number, format: double, description: indicative mid }
        allInRate: { type: number, format: double, description: effective rate after spread+fees }
        fees: { type: array, items: { $ref: '#/components/schemas/FxFee' } }
        route: { $ref: '#/components/schemas/FxRoute' }
        alternatives: { type: array, items: { $ref: '#/components/schemas/FxAlternative' } }
        locked: { type: boolean }
        expiresAt: { type: string, format: date-time }
    FxConversionRequest:
      type: object
      required: [quote_id]
      properties:
        quote_id: { type: string }
        customer_id: { type: string }
        reference: { type: string }
    FxConversion:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        status: { type: string, enum: [pending, settled, failed] }
        source: { $ref: '#/components/schemas/FxMoney' }
        destination: { $ref: '#/components/schemas/FxMoney' }
        rate: { type: number, format: double }
        allInRate: { type: number, format: double }
        fees: { type: array, items: { $ref: '#/components/schemas/FxFee' } }
        route: { $ref: '#/components/schemas/FxRoute' }
        providerRef: { type: string }
        transactionId: { type: string }
        createdAt: { type: string, format: date-time }
    FxDestination:
      type: object
      required: [rail, currency, account_number]
      properties:
        rail: { type: string }
        currency: { type: string }
        scheme: { type: string }
        account_number: { type: string }
        bank_code: { type: string }
        counterparty:
          type: object
          properties: { name: { type: string } }
    FxTransferRequest:
      type: object
      properties:
        quote_id: { type: string, description: omit for same-currency transfer }
        customer_id: { type: string }
        beneficiary_id: { type: string }
        destination: { $ref: '#/components/schemas/FxDestination' }
        amount: { $ref: '#/components/schemas/FxMoney' }
        narration: { type: string }
        reference: { type: string }
    FxTransfer:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        status: { type: string, enum: [queued, processing, paid, failed, reversed] }
        source: { $ref: '#/components/schemas/FxMoney' }
        destination: { $ref: '#/components/schemas/FxMoney' }
        quotedRate: { type: number, format: double }
        executedRate: { type: number, format: double }
        fees: { type: array, items: { $ref: '#/components/schemas/FxFee' } }
        route: { $ref: '#/components/schemas/FxRoute' }
        providerRef: { type: string }
        transactionId: { type: string }
        statusHistory:
          type: array
          items:
            type: object
            properties: { status: { type: string }, at: { type: string, format: date-time } }
        createdAt: { type: string, format: date-time }
    FxCollectionRequest:
      type: object
      required: [currency, type]
      properties:
        customer_id: { type: string }
        currency: { type: string }
        type: { type: string, enum: [virtual_account, iban] }
    FxVirtualAccount:
      type: object
      properties:
        id: { type: string }
        currency: { type: string }
        type: { type: string }
        provider: { type: string }
        status: { type: string }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    FxError:
      type: object
      properties:
        error:
          type: object
          properties:
            type: { type: string, enum: [invalid_request, authentication, rate_expired, insufficient_float, insufficient_balance, routing_unavailable, provider_error, compliance_block, conflict, rate_limited, internal] }
            code: { type: string }
            message: { type: string }
            param: { type: string, nullable: true }
            providerRef: { type: string, nullable: true }
            requestId: { type: string }
    FxNewBeneficiaryRequest:
      type: object
      required: [name, rail, scheme, currency, accountNumber, countryCode]
      properties:
        name: { type: string }
        rail: { type: string, enum: [bank_transfer, mobile_money, iban, wallet, stablecoin] }
        scheme: { type: string, enum: [BANK, MOBILEMONEY, IBAN, WALLET, STABLECOIN] }
        currency: { type: string, description: ISO-4217 }
        accountNumber: { type: string, description: account / IBAN / phone / wallet address }
        bankName: { type: string, nullable: true }
        countryCode: { type: string, description: ISO-3166 alpha-2 }
        favorite: { type: boolean, default: false }
    FxBeneficiary:
      type: object
