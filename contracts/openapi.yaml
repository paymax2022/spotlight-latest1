      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Trip detail }
        '403': { description: Not a trip participant }
        '404': { description: Not found }

