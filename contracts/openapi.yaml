          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Review' }

  # ── Pharmacy ───────────────────────────────────────────────────────────────────
  /pharmacy/products:
    get:
      operationId: listPharmacyProducts
      summary: List in-stock pharmacy products
      tags: [Pharmacy]
