        '201':
          description: Conversion settled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxConversion' }
        '409':
          description: rate_expired / duplicate-key conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxError' }
        '422':
          description: insufficient_balance / compliance_block
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxError' }
  /api/v1/fx/transfers:
    post:
      operationId: fxCreateTransfer
