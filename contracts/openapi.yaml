    # ── Telemedicine ─────────────────────────────────────────────────────────────
    Doctor:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        specialty:
          type: string
          enum: [general, cardiology, dermatology, paediatrics, veterinary, pharmacy]
        consult_fee_kobo: { type: integer, format: int64 }
        is_available: { type: boolean }

    Appointment:
      type: object
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        doctor_id: { type: string, format: uuid }
        scheduled_at: { type: string, format: date-time }
        status: { type: string, enum: [booked, confirmed, completed, cancelled] }
        fee_kobo: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    # ── Transport ────────────────────────────────────────────────────────────────
    Trip:
      type: object
      properties:
        id: { type: string, format: uuid }
        rider_id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid, nullable: true }
        pickup_address: { type: string }
        dest_address: { type: string }
        fare_kobo: { type: integer, format: int64 }
        status:
          type: string
          enum: [requested, accepted, picked_up, completed, cancelled]
        created_at: { type: string, format: date-time }

    # ── AI Customer Care ─────────────────────────────────────────────────────────
    SupportSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status: { type: string, enum: [open, escalated, resolved] }
        topic: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    SupportMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        role: { type: string, enum: [user, ai, agent] }
        content: { type: string }
        created_at: { type: string, format: date-time }

    # ── Vote bridge ──────────────────────────────────────────────────────────────
    VoteDebitRequest:
      type: object
      required: [contest_id, contestant_id, vote_count, cost_kobo, idempotency_key]
      properties:
        contest_id: { type: string, format: uuid }
        contestant_id: { type: string, format: uuid }
        vote_count: { type: integer, minimum: 1 }
        cost_kobo: { type: integer, format: int64, minimum: 1 }
        idempotency_key: { type: string }

    VoteDebitResponse:
      type: object
      properties:
        ok: { type: boolean }
        balance_kobo: { type: integer, format: int64 }
        idempotency_key: { type: string }

    # ── Disputes ─────────────────────────────────────────────────────────────────
    OpenDisputeRequest:
      type: object
      required: [reference, module_type, type, description]
      properties:
        reference: { type: string, description: "Transaction reference being disputed" }
        module_type: { type: string, description: "e.g. wallet, transport, restaurant" }
        type:
          type: string
          enum: [transfer, topup, vote, order, ticket, ride, contribution]
        description: { type: string, minLength: 20 }

    Dispute:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        reference: { type: string }
        module_type: { type: string }
        type: { type: string }
        description: { type: string }
        status: { type: string, enum: [open, investigating, resolved, closed] }
        resolution: { type: string, enum: [refund, partial_refund, no_action], nullable: true }
        admin_note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── Ratings ───────────────────────────────────────────────────────────────────
    CreateRatingRequest:
      type: object
      required: [entity_id, entity_type, transaction_ref, score]
      properties:
        entity_id: { type: string }
        entity_type:
          type: string
          enum: [doctor, pharmacy, restaurant, rider, driver, bus_operator, event_organiser, campaign, group_admin]
        transaction_ref: { type: string, description: "Prevents duplicate ratings per order/appointment/trip" }
        score: { type: number, format: float, minimum: 1.0, maximum: 5.0 }
        comment: { type: string, nullable: true }

    Rating:
      type: object
      properties:
        id: { type: string, format: uuid }
        rater_id: { type: string, format: uuid }
        entity_id: { type: string }
        entity_type: { type: string }
        transaction_ref: { type: string }
        score: { type: number, format: float }
        comment: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    RatingSummary:
      type: object
      properties:
        entity_id: { type: string }
        entity_type: { type: string }
        average: { type: number, format: float }
        count: { type: integer }
