      tags: [Telemedicine]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doctor_id, scheduled_at, idempotency_key]
              properties:
                doctor_id: { type: string, format: uuid }
                scheduled_at: { type: string, format: date-time }
                notes: { type: string }
                idempotency_key: { type: string }
      responses:
        '201':
          description: Appointment booked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }

  /telemedicine/appointments/{id}/complete:
    post:
      operationId: completeAppointment
      summary: Mark appointment completed and settle fee (doctor only)
      tags: [Telemedicine]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Appointment completed, fee settled

  # ── Telemedicine v1 (Health Premium — mobile-facing) ──────────────────────────
  /telemedicine/specialties:
    get:
      operationId: listSpecialties
      summary: List consultation specialty categories
      tags: [Telemedicine]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Specialty list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ConsultationSpecialty' } }

  /telemedicine/doctors/{id}:
    get:
      operationId: getDoctorProfile
      summary: Get a single doctor's full profile
      tags: [Telemedicine]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Doctor profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DoctorProfile' }

  /telemedicine/appointments/{id}:
    get:
      operationId: getAppointment
      summary: Get a single appointment
      tags: [Telemedicine]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Appointment detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Appointment' }

  /telemedicine/doctor/register:
    post:
      operationId: registerDoctorV2
      summary: Register as a doctor (Health Premium onboarding flow)
      tags: [Telemedicine]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, phone, specialty, mdcn_number]
              properties:
                full_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                specialty: { type: string }
