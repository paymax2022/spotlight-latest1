                mdcn_number: { type: string }
      responses:
        '201':
          description: Doctor record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      doctor_id: { type: string, format: uuid }

  /telemedicine/doctor/dashboard:
    get:
      operationId: getDoctorDashboard
      summary: Get doctor's dashboard stats, pending requests, and today's schedule
      tags: [Telemedicine]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Doctor dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DoctorDashboard' }

  /telemedicine/doctor/availability:
    patch:
      operationId: toggleDoctorAvailability
      summary: Set doctor's online / availability status
      tags: [Telemedicine]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_online: { type: boolean }
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /telemedicine/doctor/notes:
    post:
      operationId: submitSOAPNote
      summary: Submit or update a SOAP note for an appointment (doctor only)
      tags: [Telemedicine]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitSOAPNoteRequest' }
      responses:
        '201':
          description: SOAP note saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SOAPNote' }

  /telemedicine/doctor/licence:
    post:
      operationId: uploadLicenceDoc
      summary: Upload a medical licence or credential document (doctor only)
      tags: [Telemedicine]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_type, filename]
              properties:
                document_type:
                  type: string
                  enum: [mdcn, degree, specialisation, passport, final_submission]
                filename: { type: string }
                base64: { type: string, description: "Base64-encoded file content" }
                idempotency_key: { type: string }
      responses:
        '201':
          description: Document record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      upload_id: { type: string, format: uuid }

