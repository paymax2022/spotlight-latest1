        target_id:    { type: string }
        reason:       { type: string }
        evidence_url: { type: string, nullable: true }
        note:         { type: string, nullable: true }
        status:       { type: string, enum: [open, reviewing, actioned, dismissed] }
        created_at:   { type: string, format: date-time }
    MktReportCreateRequest:
      type: object
      required: [target_type, target_id, reason]
      properties:
        target_type:  { type: string, enum: [listing, seller, chat] }
        target_id:    { type: string }
        reason:       { type: string }
        evidence_url: { type: string }
        note:         { type: string }
    MktBlock:
      type: object
      required: [id, user_id, blocked_user_id, created_at]
      properties:
        id:              { type: string, format: uuid }
        user_id:         { type: string, format: uuid }
        blocked_user_id: { type: string, format: uuid }
        created_at:      { type: string, format: date-time }
    MktNotificationPrefs:
      type: object
      required: [new_offer, price_drop, order_status, boost_expiry, promotional]
      properties:
        user_id:      { type: string, format: uuid }
        new_offer:    { type: boolean }
        price_drop:   { type: boolean }
        order_status: { type: boolean }
        boost_expiry: { type: boolean }
        promotional:  { type: boolean }
        updated_at:   { type: string, format: date-time }
    MktNotificationPrefsPatch:
      type: object
      description: "All fields optional — only supplied toggles change (upsert)."
      properties:
        new_offer:    { type: boolean }
        price_drop:   { type: boolean }
        order_status: { type: boolean }
        boost_expiry: { type: boolean }
        promotional:  { type: boolean }
    MktSafeSpot:
      type: object
      required: [id, name, kind, address, state, lga, lat, lng, verified]
      properties:
        id:       { type: string }
        name:     { type: string }
        kind:     { type: string, enum: [police_station, bank_branch, mall, public_landmark] }
        address:  { type: string }
        state:    { type: string }
        lga:      { type: string }
        lat:      { type: number, format: double }
        lng:      { type: number, format: double }
        verified: { type: boolean }

    # ── Direct Referral Rewards (ADR-022) ─────────────────────────────────────
    # Single-level, purchase-triggered revenue share. Money is integer kobo.
    ReferralTierRow:
      type: object
      required: [tier, min_count, max_count, rate]
      properties:
        tier:      { type: string, enum: [STARTER, GROWTH, PRO, ELITE] }
        min_count: { type: integer, description: Inclusive lower bound of active direct referrals }
        max_count: { type: integer, nullable: true, description: Inclusive upper bound; null = open-ended (Elite) }
        rate:      { type: number, format: double, description: Fraction of platform margin, e.g. 0.05 }
    ReferralMilestoneRow:
      type: object
      required: [threshold, bonus_kobo]
      properties:
        threshold:  { type: integer, description: Active-referral count that triggers the one-time bonus }
        bonus_kobo: { type: integer, format: int64, description: One-time bonus in kobo }
    ReferralProgramConfig:
      type: object
      required: [version, tier_table, milestone_table, is_active, effective_from]
      properties:
        version:         { type: integer }
        tier_table:      { type: array, items: { $ref: '#/components/schemas/ReferralTierRow' } }
        milestone_table: { type: array, items: { $ref: '#/components/schemas/ReferralMilestoneRow' } }
        is_active:       { type: boolean }
        effective_from:  { type: string, format: date-time }
    ReferralConfigPublishRequest:
      type: object
      required: [tier_table, milestone_table]
      properties:
        tier_table:      { type: array, items: { $ref: '#/components/schemas/ReferralTierRow' } }
        milestone_table: { type: array, items: { $ref: '#/components/schemas/ReferralMilestoneRow' } }
        effective_from:  { type: string, format: date-time, description: Defaults to now server-side; forward-only }
    ReferralConfigPublishResponse:
      type: object
      required: [config, warning]
      properties:
        config:  { $ref: '#/components/schemas/ReferralProgramConfig' }
        warning: { type: string, description: Future-only advisory — already-computed rewards are never recomputed }
    ReferralModuleRewardStat:
      type: object
      required: [module, reward_kobo, reward_count]
      properties:
        module:        { type: string }
        reward_kobo:   { type: integer, format: int64 }
        reward_count:  { type: integer }
        last_event_at: { type: string, format: date-time, nullable: true }
    ReferralTierReferrerStat:
      type: object
      required: [tier, referrer_count]
      properties:
        tier:           { type: string, enum: [STARTER, GROWTH, PRO, ELITE] }
        referrer_count: { type: integer }
    ReferralAnalytics:
      type: object
      required: [active_referrers, active_referred_users, total_rewards_paid_kobo, total_margin_kobo, reward_cost_pct, by_module, by_tier]
      properties:
        active_referrers:        { type: integer }
        active_referred_users:   { type: integer }
        total_rewards_paid_kobo: { type: integer, format: int64 }
        total_margin_kobo:       { type: integer, format: int64 }
        reward_cost_pct:         { type: number, format: double, description: North-star — rewards divided by margin, as a percent }
        by_module:               { type: array, items: { $ref: '#/components/schemas/ReferralModuleRewardStat' } }
        by_tier:                 { type: array, items: { $ref: '#/components/schemas/ReferralTierReferrerStat' } }
    ReferralReward:
      type: object
      required: [id, referrer_id, referred_user_id, source_transaction_id, module, margin_amount_kobo, applied_rate, reward_amount_kobo, status, created_at]
      properties:
        id:                    { type: string, format: uuid }
        referrer_id:           { type: string, format: uuid }
        referred_user_id:      { type: string, format: uuid }
        source_transaction_id: { type: string, format: uuid, description: Unique — one reward per purchase, ever (idempotency) }
        module:                { type: string }
        margin_amount_kobo:    { type: integer, format: int64 }
        applied_rate:          { type: number, format: double, description: Tier rate in effect at time of the transaction }
        reward_amount_kobo:    { type: integer, format: int64 }
        status:                { type: string, enum: [PENDING, CREDITED, REVERSED] }
        created_at:            { type: string, format: date-time }
        credited_at:           { type: string, format: date-time, nullable: true }
        reversed_at:           { type: string, format: date-time, nullable: true }
    ReferralTierStatus:
      type: object
      required: [referrer_id, active_referral_count, current_tier, current_rate, last_recalculated_at]
      properties:
        referrer_id:           { type: string, format: uuid }
        active_referral_count: { type: integer }
        current_tier:          { type: string, enum: [STARTER, GROWTH, PRO, ELITE] }
        current_rate:          { type: number, format: double }
        last_recalculated_at:  { type: string, format: date-time }
    ReferralMilestone:
      type: object
      required: [id, referrer_id, threshold, bonus_kobo, status]
      properties:
        id:          { type: string, format: uuid }
        referrer_id: { type: string, format: uuid }
        threshold:   { type: integer }
        bonus_kobo:  { type: integer, format: int64 }
        status:      { type: string, enum: [ACHIEVED, PAID, VOIDED] }
        achieved_at: { type: string, format: date-time, nullable: true }
        paid_at:     { type: string, format: date-time, nullable: true }
        voided_at:   { type: string, format: date-time, nullable: true }
    ReferralFraudFlag:
      type: object
      required: [flag_id, referrer_id, referred_user_id, reason, evidence, status, flagged_at]
      properties:
        flag_id:          { type: string }
        referrer_id:      { type: string, format: uuid }
        referred_user_id: { type: string, format: uuid }
        reason:           { type: string, description: 'e.g. self_referral, circular_funding' }
        evidence:         { type: object, additionalProperties: true }
        status:           { type: string, enum: [OPEN, CLEARED, VOIDED, SUSPENDED] }
        flagged_at:       { type: string, format: date-time }
    ReferralFraudActionRequest:
      type: object
      required: [flag_id, action, note]
      properties:
        flag_id: { type: string }
        action:  { type: string, enum: [CLEARED, VOIDED, SUSPENDED] }
        note:    { type: string, minLength: 1, description: Required reviewer note; logged with reviewer ID }
    ReferralCaseAdjustmentRequest:
      type: object
      required: [adjust_kobo, reason]
      properties:
        adjust_kobo: { type: integer, format: int64, description: Signed; positive = credit, negative = debit }
        reason:      { type: string, minLength: 1, description: Required; logged to the audit trail }
    ReferralReferrerCase:
      type: object
      required: [referrer_id, tier, rewards, milestones]
      properties:
        referrer_id: { type: string, format: uuid }
        tier:        { $ref: '#/components/schemas/ReferralTierStatus' }
        rewards:     { type: array, items: { $ref: '#/components/schemas/ReferralReward' } }
        milestones:  { type: array, items: { $ref: '#/components/schemas/ReferralMilestone' } }
    ReferralUserDashboard:
      type: object
      required: [tier, active_referral_count, this_month_earnings_kobo, lifetime_earnings_kobo]
      properties:
        tier:                     { $ref: '#/components/schemas/ReferralTierStatus' }
        active_referral_count:    { type: integer }
        this_month_earnings_kobo: { type: integer, format: int64 }
        lifetime_earnings_kobo:   { type: integer, format: int64 }
        next_milestone:           { $ref: '#/components/schemas/ReferralMilestoneRow' }
    ReferralLinkResponse:
      type: object
      required: [code, url]
      properties:
        code: { type: string }
        url:  { type: string }
    ReferralAttributeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    ReferralReferredUser:
      type: object
      required: [referred_user_id, display_name, active, attributed_at]
      properties:
        referred_user_id:           { type: string, format: uuid }
        display_name:               { type: string, description: First name only; contact info masked for privacy }
        active:                     { type: boolean, description: Made a qualifying purchase in the trailing 30 days }
        attributed_at:              { type: string, format: date-time }
        lifetime_contribution_kobo: { type: integer, format: int64 }

  responses:
    MktBadRequest:
      description: Marketplace validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MarketplaceError' }
    MktUnauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MarketplaceError' }
    MktForbidden:
      description: Authenticated but not authorized (OLA/RBAC/KYC tier)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MarketplaceError' }
    MktNotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MarketplaceError' }
    MktConflict:
      description: Conflict or idempotency replay
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MarketplaceError' }
    MktUnprocessable:
      description: Business-rule rejection
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MarketplaceError' }
    MktTooManyRequests:
      description: Rate-limited
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MarketplaceError' }
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not authorized (KYC tier or RBAC)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate or daily limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - bearerAuth: []

# ── KYC endpoints ─────────────────────────────────────────────────────────────

paths:
  # ╔══════════════════════════════════════════════════════════════════════╗
  # ║ SESSION HARDENING — #19 (refresh rotation + suspicious-login response)  ║
  # ║ Feature flag: FEATURE_SESSION_HARDENING_ENABLED (default OFF).          ║
  # ║ When OFF, every endpoint below returns 503 { error: feature_disabled }. ║
  # ║ Self routes require bearerAuth; admin routes additionally require the    ║
  # ║ users.suspend permission. Tokens are stored hashed only.                 ║
  # ╚══════════════════════════════════════════════════════════════════════╝
  /api/auth/sessions:
    get:
      operationId: listMySessions
      summary: List the caller's active auth sessions
      tags: [SessionHardening]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active sessions (no token material is ever returned)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        device: { type: string, description: non-PII device fingerprint }
                        ip: { type: string }
                        userAgent: { type: string }
                        rotationCounter: { type: integer }
                        lastSeenAt: { type: string, format: date-time, nullable: true }
                        expiresAt: { type: string, format: date-time }
                        createdAt: { type: string, format: date-time }
        '401': { description: Unauthenticated }
        '503': { description: Feature disabled (flag off) }
  /api/auth/sessions/{id}:
    delete:
      operationId: revokeMySession
      summary: Revoke one of the caller's own sessions
      tags: [SessionHardening]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Session revoked }
        '400': { description: Invalid / foreign session (object-level authz) }
        '401': { description: Unauthenticated }
        '503': { description: Feature disabled (flag off) }
  /api/auth/sessions/revoke-all:
    post:
      operationId: revokeAllMySessions
      summary: Revoke all of the caller's active sessions
      tags: [SessionHardening]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  revoked: { type: integer }
        '401': { description: Unauthenticated }
        '503': { description: Feature disabled (flag off) }
  /api/admin/users/{id}/force-logout:
    post:
      operationId: adminForceLogout
      summary: Admin — revoke all of a user's sessions (force logout)
      description: Requires the users.suspend permission. Audited; raises a security event.
      tags: [SessionHardening]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  revoked: { type: integer }
        '403': { description: Missing users.suspend permission }
        '503': { description: Feature disabled (flag off) }
  /api/admin/users/{id}/force-password-reset:
    post:
      operationId: adminForcePasswordReset
      summary: Admin — force a password reset and revoke the user's sessions
      description: Sets force_password_reset, revokes all sessions, notifies the user, audited as critical.
      tags: [SessionHardening]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Reset enforced; sessions revoked }
        '403': { description: Missing users.suspend permission }
        '503': { description: Feature disabled (flag off) }
  # ╔══════════════════════════════════════════════════════════════════════╗
  # ║ ADMIN USER / RBAC ENDPOINT PARITY — #23 (Backend remainder)            ║
  # ║ Base: /api/admin/...  ·  bearerAuth  ·  deny-by-default permissions.   ║
  # ║ Every mutation is audited via audit_service. Composes (not duplicates) ║
  # ║ the #19 session surface for the read-only per-user session view.       ║
  # ╚══════════════════════════════════════════════════════════════════════╝
  /api/admin/users/export:
    get:
      operationId: exportAdminUsers
      summary: Export the scoped admin-user list as a JSON attachment
      description: >-
        Requires the `users.view` permission. Honours the same scope filtering as
        the list endpoint (state/program/contest/school). The export action itself
        is audited (`user.export`, high) because it surfaces PII in bulk.
      tags: [AdminUsers]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: role, in: query, required: false, schema: { type: string } }
        - { name: userType, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: program, in: query, required: false, schema: { type: string } }
        - { name: contest, in: query, required: false, schema: { type: string } }
        - { name: school, in: query, required: false, schema: { type: string } }
        - { name: country, in: query, required: false, schema: { type: string } }
        - { name: search, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: JSON attachment of scoped admin users
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        '403': { description: Missing users.view permission }
  /api/admin/users/bulk-roles:
    post:
      operationId: bulkAssignRoleToUsers
      summary: Assign ONE role to MANY users
      description: >-
        Requires `users.roles.assign`. Targets the caller cannot access under
        their scope are silently dropped (deny-by-default object-level authz).
        Each successful grant is audited (`user.role.assign`, high).
      tags: [AdminUsers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId, userIds]
              properties:
                roleId: { type: string, format: uuid }
                userIds: { type: array, items: { type: string, format: uuid } }
                scopeType: { type: string, enum: [global, program, contest, state, school, cohort, season] }
                scopeId: { type: string, nullable: true }
      responses:
        '200':
          description: Per-item results (partial failures reported, not fatal)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        success: { type: boolean }
                        error: { type: string, nullable: true }
        '400': { description: roleId and userIds are required }
        '403': { description: Missing users.roles.assign permission }
  /api/admin/users/{id}/roles/bulk:
    post:
      operationId: bulkAssignRolesToUser
      summary: Assign MANY roles to ONE user
      description: >-
        Requires `users.roles.assign`. Object-level authz on the target user runs
        first. Last-super-admin / critical-role invariants are preserved per item.
        Each successful grant is audited (`user.role.assign`, high).
      tags: [AdminUsers]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleIds]
              properties:
                roleIds: { type: array, items: { type: string, format: uuid } }
                scopeType: { type: string, enum: [global, program, contest, state, school, cohort, season] }
                scopeId: { type: string, nullable: true }
      responses:
        '200': { description: Per-item results }
        '400': { description: roleIds is required }
        '403': { description: Missing users.roles.assign permission }
        '404': { description: Target user not found / out of scope }
  /api/admin/users/{id}/sessions:
    get:
      operationId: getAdminUserSessions
      summary: Read-only per-user session / security view
      description: >-
        Requires `users.view`. Composes the #19 session surface (no duplicate
        routes). Object-level scope authz matches the user-detail endpoint. The
        view is audited (`user.sessions.view`, info). Returns 503 when
        FEATURE_SESSION_HARDENING_ENABLED is off (deny-by-default).
      tags: [AdminUsers]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The target user's active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        device: { type: string }
                        ip: { type: string }
                        userAgent: { type: string }
                        rotationCounter: { type: integer }
                        lastSeenAt: { type: string, format: date-time, nullable: true }
                        expiresAt: { type: string, format: date-time }
                        createdAt: { type: string, format: date-time }
        '403': { description: Missing users.view permission / out of scope }
        '404': { description: User not found }
        '503': { description: Feature disabled (flag off) }
  /api/admin/roles/{id}/permissions/bulk:
    post:
      operationId: bulkAssignPermissionsToRole
      summary: Assign MANY permissions to ONE role
      description: >-
        Requires `permissions.assign`. The critical-permission super-admin gate is
        enforced per item (a non-super admin assigning e.g. `votes.override` fails
        that item only). Each successful assignment is audited
        (`role.permission.assign`, high).
      tags: [AdminUsers]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionIds]
              properties:
                permissionIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '200': { description: Per-item results }
        '400': { description: permissionIds is required }
        '403': { description: Missing permissions.assign permission }
  # ╔══════════════════════════════════════════════════════════════════════╗
  # ║ ESTATE SUPER-APP — Blocks 29-44 (Backend Agent 2)                      ║
  # ║ Base: /api/finance/estate/:id/...  ·  bearerAuth  ·  money in kobo.    ║
  # ║ Dues pay is the money path: Idempotency-Key header REQUIRED.           ║
  # ╚══════════════════════════════════════════════════════════════════════╝
  /api/finance/estate/{id}/dues/invoices:
    get:
      operationId: estateListInvoices
      summary: List dues invoices (own; admin sees all)
      tags: [Estate]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, paid, overdue, waived] } }
      responses:
        '200': { description: Invoice list }
    post:
      operationId: estateCreateInvoice
      summary: Bill a resident (estate admin only)
      tags: [Estate]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resident_id, category, amount_kobo, due_date]
              properties:
                resident_id: { type: string, format: uuid }
                property_id: { type: string, format: uuid }
                category: { type: string, enum: [service_charge, security_levy, waste, water, electricity, rent, facility, penalty, other] }
                amount_kobo: { type: integer, format: int64, minimum: 1, description: Minor units (kobo) }
                due_date: { type: string, format: date-time }
      responses:
        '201': { description: Invoice created }
        '403': { description: Not an estate admin }
  /api/finance/estate/{id}/dues/invoices/{invoiceId}/pay:
    post:
      operationId: estatePayDues
      summary: Pay a dues invoice from wallet (balanced double-entry; immutable receipt)
      description: >
        Debits the payer wallet and credits the estate settlement account in one
        balanced ledger journal. The Idempotency-Key header is REQUIRED and fails
        closed if absent (HTTP 400). Tier-limit checked fail-closed. Retries with
        the same key are no-ops returning the original receipt.
      tags: [Estate]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string }, description: Required — money mutation fails closed without it }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [wallet, card, transfer, ussd], default: wallet }
                amount_kobo: { type: integer, format: int64, description: Optional; must equal the invoice amount }
      responses:
        '201': { description: Payment receipt (immutable) }
        '400': { description: Idempotency-Key missing }
        '409': { description: Invoice state / amount / tier-limit conflict }
        '503': { description: Ledger unavailable }
