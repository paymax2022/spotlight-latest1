              patient_name: { type: string }
              request_type: { type: string }
              created_at: { type: string, format: date-time }
        todays_appointments:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              patient_name: { type: string }
              time: { type: string }
              type: { type: string, enum: [video, in_person] }
              reason: { type: string }
              status: { type: string }

    SOAPNote:
      type: object
