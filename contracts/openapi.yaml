      responses:
        '200':
          description: Route
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapRoute' }
  /api/finance/maps/matrix:
    post:
      operationId: mapsGetDistanceMatrix
      summary: Many-to-many distance/ETA matrix for dispatch (OSRM/OpenStack)
      tags: [Maps]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origins, dests]
              properties:
                origins: { type: array, items: { $ref: '#/components/schemas/MapPoint' } }
                dests: { type: array, items: { $ref: '#/components/schemas/MapPoint' } }
      responses:
        '200':
          description: Distance/ETA matrix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapMatrix' }
  /api/finance/maps/match:
    post:
      operationId: mapsMatchToRoad
      summary: Snap a GPS trace to roads for live tracking (OSRM/OpenStack)
