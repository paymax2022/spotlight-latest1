      tags: [Pharmacy]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Cart items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
    post:
      operationId: addToCart
      summary: Add a product to the cart (upserts — increments quantity if already in cart)
      tags: [Pharmacy]
      security: [{ bearerAuth: [] }]
