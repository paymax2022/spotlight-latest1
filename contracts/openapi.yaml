  # ╔══════════════════════════════════════════════════════════════════════╗
  # ║ Bank transfers — multi-provider (wallet→bank, bank→bank) — ADR-011    ║
  # ╚══════════════════════════════════════════════════════════════════════╝
  # Member surface. Money-path: integer kobo, balanced double-entry ledger,
  # idempotency, fail-closed tier limits, immutable audit. A transaction PIN
  # (ADR-011 §3) MUST be verified server-side before any transfer is initiated.
  # bank→bank is a provider pass-through (collection pay-in → payout). Provider
  # is auto-selected from a registry with failover and persisted on the row.
  # Member routes gated by FEATURE_BANK_TRANSFERS_ENABLED.
  /api/finance/transfers/banks:
    get:
      operationId: transfersListBanks
      summary: List supported destination banks (provider-backed, payment_banks fallback)
      description: >
        Returns the bank list backing the bank picker. Sourced from the active
        provider's ListBanks (Paystack/Monnify) with the local payment_banks
        reference table as fallback.
      tags: [Transfers]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Supported banks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/finance/transfers/resolve-account:
    post:
      operationId: transfersResolveAccount
      summary: Resolve a bank account name (name enquiry)
      description: >
        Provider name-enquiry for the (bank_code, account_number) pair. Optional
        `provider` pins a specific provider; otherwise the registry default is
        used. Read-only — no funds move, so no Idempotency-Key is required.
      tags: [Transfers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_code, account_number]
              properties:
                bank_code: { type: string }
                account_number: { type: string }
                provider: { type: string, enum: [paystack, monnify], description: Optional — pin a specific provider; defaults to the registry default. }
      responses:
        '200':
          description: Resolved account name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResolution' }
        '400': { description: Invalid request (missing targetId/direction) }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/finance/transfers/bank:
    post:
      operationId: transfersBankPayout
      summary: Initiate a wallet→bank transfer (payout)
      description: >
        Debits the caller's wallet (amount + fee) into suspense and initiates a
        provider payout to the destination bank. Money-path initiate — REQUIRES an
        Idempotency-Key (replay returns the prior result) and a valid transaction
        `pin` (verified server-side, never logged). Tier limits are enforced
        fail-closed on the wallet-out leg. Settlement is webhook-driven; the row
        moves funds_reserved → provider_initiated → successful | failed | reversed.
      tags: [Transfers]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankTransferRequest' }
      responses:
        '201':
          description: Transfer accepted (funds reserved, provider initiated)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankTransfer' }
        '400': { description: Invalid request (missing targetId/direction) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: PIN invalid, tier limit exceeded, or feature disabled }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/finance/transfers/bank-to-bank:
    post:
      operationId: transfersBankToBank
      summary: Initiate a bank→bank transfer (provider pass-through)
      description: >
        Provider pass-through (ADR-011 §1): the source bank funds the transfer
        through the provider into a clearing account (pay-in), and once funded it
        is disbursed to the destination bank (payout). Two legs, webhook-settled;
        the row moves awaiting_funding → funded → provider_initiated → successful |
        failed | reversed. Money-path initiate — REQUIRES an Idempotency-Key and a
        valid transaction `pin`.
      tags: [Transfers]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankToBankRequest' }
      responses:
        '201':
          description: Transfer accepted (awaiting funding / provider initiated)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankTransfer' }
        '400': { description: Invalid request (missing targetId/direction) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: PIN invalid, tier limit exceeded, or feature disabled }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/finance/transfers/beneficiaries:
    get:
      operationId: transfersListBeneficiaries
      summary: List the caller's saved bank beneficiaries
      tags: [Transfers]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Saved beneficiaries
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Beneficiary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: transfersCreateBeneficiary
      summary: Save a bank beneficiary
      tags: [Transfers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_code, account_number]
              properties:
                bank_code: { type: string }
                account_number: { type: string }
                account_name: { type: string }
                nickname: { type: string }
                provider: { type: string, enum: [paystack, monnify] }
      responses:
        '201':
          description: Beneficiary saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Beneficiary' }
        '400': { description: Invalid request (missing targetId/direction) }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/finance/transfers/beneficiaries/{id}:
    delete:
      operationId: transfersDeleteBeneficiary
      summary: Delete a saved beneficiary (own beneficiaries only)
      tags: [Transfers]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Beneficiary deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/finance/transfers/pin/status:
    get:
      operationId: transfersPinStatus
      summary: Whether the caller has set a transaction PIN
      tags: [Transfers]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: PIN status
          content:
            application/json:
              schema:
                type: object
                required: [has_pin]
                properties:
                  has_pin: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/finance/transfers/pin:
    post:
      operationId: transfersSetPin
      summary: Set (or change) the caller's transaction PIN
      description: >
        Stores a salted hash of the transaction PIN (ADR-011 §3). The PIN gates
        all money movement and is never logged or returned.
      tags: [Transfers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, description: Plaintext PIN; hashed server-side, never stored or logged in the clear. }
      responses:
        '204': { description: PIN set }
        '400': { description: Invalid request (missing targetId/direction) }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/finance/transfers/pin/verify:
    post:
      operationId: transfersVerifyPin
      summary: Verify the caller's transaction PIN
      description: >
        Verifies the supplied PIN against the stored salted hash. Subject to
        attempt-lockout; never logged. Returns { ok }.
      tags: [Transfers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string }
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ── Bank transfers — admin console (RBAC: finance.admin.transfers) ────────────
  # All routes role-gated (finance.admin.transfers) and audit-logged server-side.
  /api/finance/admin/transfers:
    get:
      operationId: admTransfersList
      summary: List bank transfers (type/provider/status/amount/fee/ref filters)
      tags: [TransfersAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: source_type, in: query, schema: { type: string, enum: [wallet, bank] } }
        - { name: provider, in: query, schema: { type: string, enum: [paystack, monnify] } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200':
          description: Transfer rows
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BankTransfer' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/finance/admin/transfers/provider-health:
    get:
      operationId: admTransfersProviderHealth
      summary: Provider health strip (per-provider reachability)
      tags: [TransfersAdmin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Per-provider health
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ProviderHealth' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/finance/admin/transfers/{id}:
    get:
      operationId: admTransfersGet
      summary: Get one transfer (detail + ledger inspect)
      tags: [TransfersAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Transfer detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankTransfer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/finance/admin/transfers/{id}/retry:
    post:
      operationId: admTransfersRetry
      summary: Re-attempt a failed transfer (allows provider failover)
      description: >
        Re-initiates a failed payout; the registry may fail over to the other
        provider (ADR-011 §2). Idempotent on a per-leg key; audit-logged.
      tags: [TransfersAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Retry accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankTransfer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/finance/admin/transfers/{id}/reverse:
    post:
      operationId: admTransfersReverse
      summary: Reverse a transfer (posts a reversing ledger entry)
      description: >
        Reverses the hold/disbursement back to the source by posting a reversing
        ledger entry (ledger entries are immutable; corrections = reversals only).
        Moves the row to reversed. Idempotent; audit-logged.
      tags: [TransfersAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Reversal posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankTransfer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ╔══════════════════════════════════════════════════════════════════════╗
  # ║ KYC verification (multi-provider, ADR-013)                             ║
  # ║ Base: /api/finance/kyc/...  ·  admin at /api/finance/admin/kyc/...     ║
  # ║ Provider-agnostic: adapters (dojah|smileid|youverify) are routed by a  ║
  # ║ per-check-type routing rule and normalize into VerificationCheck.      ║
  # ║ Consent (/kyc/consent) MUST precede any check. Every check POST needs  ║
  # ║ an Idempotency-Key header — it becomes the provider client_ref.        ║
  # ║ Webhooks/callbacks set the TERMINAL status; sync responses are PENDING ║
  # ║ unless the provider returns an authoritative inline result.            ║
  # ║ Feature flag: FEATURE_KYC_VERIFY_ENABLED (default OFF → 503).          ║
  # ╚══════════════════════════════════════════════════════════════════════╝
  /api/finance/kyc/session:
    post:
      operationId: kycCreateSession
      summary: Open a verification session for a target tier
      description: >
        Creates (or returns the caller's active) verification session for the
        requested target tier. The session aggregates the checks required to
        reach that tier under the tier policy.
      tags: [KYCVerification]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_tier]
              properties:
                target_tier: { type: integer, minimum: 1, maximum: 3, description: Tier the member is verifying up to. }
      responses:
        '201':
          description: Session created (or existing active session returned)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { description: Feature disabled (flag off) }
  /api/finance/kyc/session/{id}:
    get:
      operationId: kycGetSession
      summary: Get a verification session with its embedded checks
      description: Object-level authz — the caller may only read their own session.
      tags: [KYCVerification]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Session with embedded checks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/VerificationSession'
                  - type: object
                    properties:
                      checks:
                        type: array
                        items: { $ref: '#/components/schemas/VerificationCheck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Feature disabled (flag off) }
  /api/finance/kyc/consent:
    post:
      operationId: kycRecordConsent
      summary: Record the member's consent (must precede any check)
      description: >
        Records an auditable consent grant for a given scope/version. A stored
        consent for the relevant scope is a precondition for every check POST
        below (providers such as Youverify require isSubjectConsent=true).
      tags: [KYCVerification]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KycConsentRequest' }
      responses:
        '204': { description: Consent recorded (no content) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { description: Feature disabled (flag off) }
  /api/finance/kyc/checks/id-number:
    post:
      operationId: kycCheckIdNumber
      summary: ID-number lookup (BVN/NIN/vNIN/passport/DL/PVC/phone)
      description: >
        Routed through the IdNumberPort. Requires prior consent and an
        Idempotency-Key header (reused as the provider client_ref).
      tags: [KYCVerification]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, id_type, id_number]
              properties:
                session_id: { type: string, format: uuid }
                id_type: { type: string, description: 'e.g. BVN, NIN, VNIN, PASSPORT, DRIVERS_LICENSE, PVC, PHONE' }
                id_number: { type: string }
                first_name: { type: string }
                last_name: { type: string }
                dob: { type: string, format: date }
      responses:
        '200':
          description: Normalized check result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationCheck' }
        '400': { description: Idempotency-Key missing or consent not recorded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { description: Feature disabled (flag off) }
  /api/finance/kyc/checks/facial:
    post:
      operationId: kycCheckFacial
      summary: ID + face match (facial verification)
      description: >
        Routed through the FacialPort. Compares a selfie against the ID record.
        Confidence below KYC_FACIAL_MATCH_THRESHOLD yields REVIEW, not FAILED.
        Requires prior consent and an Idempotency-Key header.
      tags: [KYCVerification]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, id_type, id_number, selfie_b64]
              properties:
                session_id: { type: string, format: uuid }
                id_type: { type: string }
                id_number: { type: string }
                selfie_b64: { type: string, description: Base64-encoded selfie image. }
      responses:
        '200':
          description: Normalized check result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationCheck' }
        '400': { description: Idempotency-Key missing or consent not recorded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { description: Feature disabled (flag off) }
  /api/finance/kyc/checks/liveness:
    post:
      operationId: kycCheckLiveness
      summary: Selfie liveness / anti-spoof
      description: >
        Routed through the LivenessPort. Requires prior consent and an
        Idempotency-Key header.
      tags: [KYCVerification]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, selfie_b64]
              properties:
                session_id: { type: string, format: uuid }
                selfie_b64: { type: string, description: Base64-encoded selfie image. }
      responses:
        '200':
          description: Normalized check result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationCheck' }
        '400': { description: Idempotency-Key missing or consent not recorded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { description: Feature disabled (flag off) }
  /api/finance/kyc/checks/document:
    post:
      operationId: kycCheckDocument
      summary: Document OCR + authenticity
      description: >
        Routed through the DocumentPort. Requires prior consent and an
        Idempotency-Key header.
      tags: [KYCVerification]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, doc_type, front_b64]
              properties:
                session_id: { type: string, format: uuid }
                doc_type: { type: string, description: 'e.g. PASSPORT, DRIVERS_LICENSE, ID_CARD, RESIDENCE_PERMIT' }
                front_b64: { type: string, description: Base64-encoded front image. }
                back_b64: { type: string, description: Base64-encoded back image (optional for single-sided docs). }
      responses:
        '200':
          description: Normalized check result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationCheck' }
        '400': { description: Idempotency-Key missing or consent not recorded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { description: Feature disabled (flag off) }
  /api/finance/kyc/checks/aml:
    post:
      operationId: kycCheckAml
      summary: AML / PEP / sanctions screening
      description: >
        Routed through the AmlPort. Requires prior consent and an
        Idempotency-Key header.
      tags: [KYCVerification]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string, format: uuid }
      responses:
        '200':
          description: Normalized check result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationCheck' }
        '400': { description: Idempotency-Key missing or consent not recorded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { description: Feature disabled (flag off) }
  /api/finance/kyc/sdk-token:
    post:
      operationId: kycIssueSdkToken
      summary: Issue a short-lived provider SDK token
      description: >
        Mints a server-issued token for an in-app provider SDK (e.g. Smile ID
        Web/Mobile SDK). Secrets never leave the server.
      tags: [KYCVerification]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string, enum: [dojah, smileid, youverify] }
      responses:
        '200':
          description: SDK token
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { description: Feature disabled (flag off) }
  # ── KYC webhooks (no bearerAuth; per-provider signature verified) ──────────
  # Provider-agnostic async callbacks that set the TERMINAL check/session status.
  # No user session — proxied WITHOUT auth. Each provider signs differently:
  #   dojah    → X-Dojah-Signature header (HMAC over the raw body)
  #   smileid  → Smile ID signature (partner_id + timestamp + API-key HMAC) in body
  #   youverify→ X-Youverify-Signature header (HMAC over the raw body)
  # Always return 200 on receipt to suppress provider retries.
  /api/kyc/webhooks/{provider}:
    post:
      operationId: kycProviderWebhook
      summary: Provider async callback (signature-verified, no bearerAuth)
      tags: [KYCVerification]
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [dojah, smileid, youverify] } }
        - { name: X-Dojah-Signature, in: header, required: false, schema: { type: string }, description: HMAC signature for provider=dojah. }
        - { name: X-Youverify-Signature, in: header, required: false, schema: { type: string }, description: HMAC signature for provider=youverify. }
      requestBody:
        required: true
        description: >
          Raw provider event payload. Smile ID includes its signature (with
          partner_id + timestamp) inside the body rather than a header.
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Received (always 200 to suppress provider retries) }
  # ── KYC admin (RBAC finance.admin.kyc enforced server-side) ────────────────
  /api/finance/admin/kyc/review-queue:
    get:
      operationId: admKycReviewQueue
      summary: List sessions/checks awaiting manual review
      description: Requires the finance.admin.kyc permission. Returns items in NEEDS_REVIEW / REVIEW.
      tags: [KYCAdmin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Review queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/VerificationSession' }
                  checks:
                    type: array
                    items: { $ref: '#/components/schemas/VerificationCheck' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/finance/admin/kyc/cases/{id}:
    get:
      operationId: admKycCaseDetail
      summary: Case detail (checks, provider, confidence, extracted fields, evidence refs)
      description: Requires the finance.admin.kyc permission.
      tags: [KYCAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Case detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/VerificationSession'
                  - type: object
                    properties:
                      checks:
                        type: array
                        items: { $ref: '#/components/schemas/VerificationCheck' }
                      evidence_refs:
                        type: array
                        description: References (not payloads) to raw provider evidence in the encrypted blob store.
                        items: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/finance/admin/kyc/cases/{id}/approve:
    post:
      operationId: admKycApproveCase
      summary: Approve a case (manual override; audited)
      description: Requires the finance.admin.kyc permission. Audited.
      tags: [KYCAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Case approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/finance/admin/kyc/cases/{id}/reject:
    post:
      operationId: admKycRejectCase
      summary: Reject a case (manual override; audited)
      description: Requires the finance.admin.kyc permission. Audited.
      tags: [KYCAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Case rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/finance/admin/kyc/routing-rules:
    get:
      operationId: admKycListRoutingRules
      summary: List provider routing rules (per check type)
      description: Requires the finance.admin.kyc permission.
      tags: [KYCAdmin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Routing rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KycRoutingRule' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/finance/admin/kyc/routing-rules/{check_type}:
    put:
      operationId: admKycUpdateRoutingRule
      summary: Update the routing rule for one check type
      description: >
        Requires the finance.admin.kyc permission. Sets the ordered provider
        failover list, match threshold, and enabled flag for the check type. Audited.
      tags: [KYCAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: check_type, in: path, required: true, schema: { type: string, enum: [ID_NUMBER, ID_FACIAL, LIVENESS, DOCUMENT, AML] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ordered_providers, enabled]
              properties:
                ordered_providers:
                  type: array
                  items: { type: string, enum: [dojah, smileid, youverify] }
                threshold: { type: number, description: PASS/REVIEW confidence gate (e.g. facial match threshold). }
                enabled: { type: boolean }
      responses:
        '200':
          description: Rule updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycRoutingRule' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/finance/admin/kyc/events:
    get:
      operationId: admKycEventMonitor
      summary: Webhook event monitor
      description: >
        Requires the finance.admin.kyc permission. Feed of inbound provider
        webhook/callback events for observability and replay triage.
      tags: [KYCAdmin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Webhook events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    provider: { type: string, enum: [dojah, smileid, youverify] }
                    check_id: { type: string, format: uuid, nullable: true }
                    signature_valid: { type: boolean }
                    status: { type: string }
                    received_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Arena competition engine (ADR-014) ────────────────────────────────────────
  # Config-driven contest engine on the Go backend (base /api/arena/...). "Vote" is
  # polymorphic across four firewalled rails: Merit (signed judging), Support (real
  # Naira gifting → wallet ledger + pot), Play-Along (free quiz → engagement), and
  # Sponsor (branded). NDC-1: the crown is a PURE FUNCTION of the signed Merit ledger
  # ONLY — Support / Play-Along / Sponsor never affect advancement or the crown. The
  # Merit ledger is append-only, Ed25519-signed and hash-chained (publicly verifiable
  # by hash). Feature flag: FEATURE_ARENA_ENABLED (default OFF → 503). Money-path
  # endpoints (Support, Play-Along attempts) require an Idempotency-Key.

  # ── Arena — public (no auth) ──────────────────────────────────────────────────
  /api/arena/competitions:
    get:
      operationId: arenaListCompetitions
      summary: List competitions (public)
      description: Public catalogue of competitions and their lifecycle status. No auth required.
      tags: [Arena]
      responses:
        '200':
          description: Competitions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Competition' } }
  /api/arena/competitions/{id}:
    get:
      operationId: arenaGetCompetition
      summary: Get a competition (public)
      description: Public competition detail. No auth required.
      tags: [Arena]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Competition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Competition' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/arena/competitions/{id}/leaderboard/merit:
    get:
      operationId: arenaGetMeritLeaderboard
      summary: Public Merit leaderboard (the only tally that determines the crown)
      description: >
        Public ranking derived solely from the signed, hash-chained Merit ledger.
        NDC-1: this is the ONLY input to advancement and the crown — Support,
        Play-Along and Sponsor rails are structurally walled off and never appear here.
      tags: [Arena]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: stage, in: query, schema: { type: string } }
      responses:
        '200':
          description: Merit leaderboard rows
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MeritLeaderboardRow' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/arena/competitions/{id}/pot:
    get:
      operationId: arenaGetPot
      summary: Prize-pot transparency view (public)
      description: >
        Public transparency view of the Support pot — total contributed (kobo), the
        split formula, and disbursement status. NDC-1: the pot is a Support-rail
        artifact and never influences the Merit crown.
      tags: [Arena]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pot view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PotView' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/arena/credentials/{hash}/verify:
    get:
      operationId: arenaVerifyCredential
      summary: Publicly verify a credential by its hash (no auth)
      description: >
        Verifies a Certified Safe Driver or Naija Driver credential from its
        verifiable hash using public keys only. Returns validity + issuance metadata;
        revoked or forged hashes return valid=false.
      tags: [Arena]
      parameters:
        - { name: hash, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Credential verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialVerify' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Arena — member (bearerAuth) ───────────────────────────────────────────────
  /api/arena/competitions/{id}/applications:
    post:
      operationId: arenaApply
      summary: Apply to a competition as a contestant
      description: >
        Creates the caller's contestant application (state APPLIED). KYC-tier
        identity gate (NDC-3) is enforced server-side.
      tags: [Arena]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                home_state: { type: string }
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contestant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/arena/competitions/{id}/me:
    get:
      operationId: arenaGetMyContestant
      summary: Get the caller's contestant record for this competition
      tags: [Arena]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Contestant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contestant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/arena/competitions/{id}/me/merit:
    get:
      operationId: arenaGetMyMerit
      summary: Get the caller's own Merit standing
      description: The caller's Merit leaderboard row(s) — derived from the signed Merit ledger only (NDC-1).
      tags: [Arena]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Caller's Merit rows
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MeritLeaderboardRow' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/arena/competitions/{id}/support:
    post:
      operationId: arenaSupport
      summary: Back a driver — Support rail (real-Naira gifting, money-path)
      description: >
        Wallet-to-wallet Naira gifting attributed to a contestant, tagged rail=SUPPORT
        and added to the prize pot. Money-path: integer kobo, balanced double-entry
        ledger, idempotency, fail-closed tier limits, immutable audit. REQUIRES an
        Idempotency-Key. NDC-1: Support NEVER touches the Merit ledger and can never
        affect advancement or the crown.
      tags: [Arena]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportRequest' }
      responses:
        '201':
          description: Support contribution recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PotView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { description: Insufficient balance or tier limit exceeded }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/arena/competitions/{id}/playalong/attempt:
    post:
      operationId: arenaPlayAlongAttempt
      summary: Submit a Play-Along quiz attempt (free engagement rail)
      description: >
        Records a free "Are You a Naija Driver?" quiz attempt (engagement ledger +
        Certified Safe Driver credential progress). Rate-limited and abuse-monitored;
        REQUIRES an Idempotency-Key for replay safety. NDC-1: Play-Along feeds
        engagement/credentials only — never the Merit crown.
      tags: [Arena]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      question_id: { type: string }
                      choice: { type: string }
      responses:
        '201':
          description: Attempt recorded (may unlock Certified Safe Driver credential)
          content:
            application/json:
              schema:
                type: object
                properties:
                  score: { type: integer }
                  passed: { type: boolean }
                  credential_hash: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/arena/competitions/{id}/predictions:
    post:
      operationId: arenaPredict
      summary: Predict-the-Champion (spectator engagement)
      description: >
        Records a spectator's champion prediction. Engagement only — NDC-1: never
        affects the Merit leaderboard or the crown.
      tags: [Arena]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contestant_id]
              properties:
                contestant_id: { type: string, format: uuid }
      responses:
        '201': { description: Prediction recorded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ── Arena — admin (bearerAuth + scoped RBAC; audited) ─────────────────────────
  /api/arena/admin/competitions:
    post:
      operationId: arenaAdminCreateCompetition
      summary: Create a competition (RBAC arena.admin.config)
      description: Requires the arena.admin.config permission. Creates a DRAFT competition. Audited.
      tags: [ArenaAdmin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { type: string }
                name: { type: string }
      responses:
        '201':
          description: Competition created (DRAFT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Competition' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/arena/admin/competitions/{id}/config/publish:
    post:
      operationId: arenaAdminPublishConfig
      summary: Publish an immutable versioned competition config (RBAC arena.admin.config)
      description: >
        Requires the arena.admin.config permission. Publishes an immutable versioned
        config (rails/awards/eligibility); every submission is validated against the
        exact schema version it was submitted under (NDC-6). Audited.
      tags: [ArenaAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Config version published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Competition' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/arena/admin/competitions/{id}/screening:
    get:
      operationId: arenaAdminListScreening
      summary: Screening review queue (RBAC arena.reviewer.screen)
      description: Requires the arena.reviewer.screen permission (object-level scoped to the reviewer's queue).
      tags: [ArenaAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Screening queue
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Contestant' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/arena/admin/competitions/{id}/screening/{cid}/decide:
    post:
      operationId: arenaAdminScreeningDecide
      summary: Approve/reject a screening application (RBAC arena.reviewer.screen; audited)
      description: Requires the arena.reviewer.screen permission. Moves the contestant APPLIED→SCREENED or →REJECTED. Audited.
      tags: [ArenaAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason: { type: string }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contestant' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/arena/admin/competitions/{id}/proctor/attest:
    post:
      operationId: arenaAdminProctorAttest
      summary: Proctor attestation for a theory batch (RBAC arena.proctor.attest; audited)
      description: Requires the arena.proctor.attest permission (object-level scoped to the batch). Attests exam integrity for a theory batch. Audited.
      tags: [ArenaAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theory_batch, contestant_id]
              properties:
                theory_batch: { type: string }
                contestant_id: { type: string, format: uuid }
                attestation: { type: string }
      responses:
        '201': { description: Attestation recorded }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/arena/admin/competitions/{id}/judge/score:
    post:
      operationId: arenaAdminJudgeScore
      summary: Submit a signed Merit score (RBAC arena.judge.score; audited)
      description: >
        Requires the arena.judge.score permission. Submits a score through the
        ScoringGateway; the signed adapter appends an Ed25519-signed, hash-chained
        entry to the Merit ledger (NDC-2). Only signed entries from authorized
        adapters are accepted — this is the ONLY write path to the crown (NDC-1). Audited.
      tags: [ArenaAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contestant_id, stage, score]
              properties:
                contestant_id: { type: string, format: uuid }
                stage: { type: string }
                score: { type: number }
      responses:
        '201':
          description: Signed Merit entry appended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeritLeaderboardRow' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/arena/admin/competitions/{id}/transitions/{cid}:
    post:
      operationId: arenaAdminTransition
      summary: Execute a guarded lifecycle transition (RBAC arena.admin.transition; audited)
      description: >
        Requires the arena.admin.transition permission. Executes a guarded contestant
        transition (APPLIED→SCREENED→TRAINED→THEORY_ASSIGNED→THEORY_TAKEN→QUALIFIED→
        FINALIST→CROWNED|ELIMINATED, +WITHDRAWN). Illegal transitions are unreachable;
        advancement (→QUALIFIED/FINALIST/CROWNED) reads the Merit leaderboard ONLY
        (NDC-1). Side effects are atomic with the transition. Audited.
      tags: [ArenaAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_state]
              properties:
                to_state:
                  type: string
                  enum: [SCREENED, TRAINED, THEORY_ASSIGNED, THEORY_TAKEN, QUALIFIED, FINALIST, CROWNED, ELIMINATED, WITHDRAWN]
      responses:
        '200':
          description: Transition applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contestant' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Illegal transition or merit cutoff not met }
  /api/arena/admin/competitions/{id}/merit:
    get:
      operationId: arenaAdminMeritLedger
      summary: Merit ledger + integrity/audit view (RBAC arena.auditor.read)
      description: >
        Requires the arena.auditor.read permission. Read-only view of the signed,
        hash-chained Merit ledger with integrity proofs. NDC-1: the sole determinant
        of the crown.
      tags: [ArenaAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Merit ledger rows
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MeritLeaderboardRow' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/arena/admin/competitions/{id}/awards/finalize:
    post:
      operationId: arenaAdminFinalizeAwards
      summary: Finalize awards / crown from Merit state (RBAC arena.admin.transition; audited)
      description: >
        Requires the arena.admin.transition permission. Computes and finalizes awards
        (crown, People's Champion, State Pride) from the signed Merit ledger and
        writes signed award_result rows. NDC-1: the crown is a pure function of Merit
        — Support/Play-Along/Sponsor are excluded. Audited.
      tags: [ArenaAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Awards finalized }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Competition not in a finalizable state }
  /api/arena/admin/competitions/{id}/pot/disburse:
    post:
      operationId: arenaAdminDisbursePot
      summary: Disburse the prize pot via guarded PotDisbursement (RBAC arena.admin.disburse; audited)
      description: >
        Requires the arena.admin.disburse permission. Money-path: disburses the
        Support pot to winners per the published split formula via the guarded
        PotDisbursement (NDC-4) — integer kobo, balanced double-entry ledger,
        idempotency, immutable audit. REQUIRES an Idempotency-Key. NDC-1: disbursement
        follows Merit-decided results; it never influences them.
      tags: [ArenaAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Disbursement executed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PotView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Awards not finalized or pot already disbursed }
  /api/arena/admin/competitions/{id}/credentials/issue:
    post:
      operationId: arenaAdminIssueCredential
      summary: Issue a verifiable credential (RBAC arena.admin.credential; audited)
      description: >
        Requires the arena.admin.credential permission. Issues a Certified Safe Driver
        or Naija Driver credential from Merit state (NDC-7) as a verifiable-by-hash,
        independently revocable attestation. Audited.
      tags: [ArenaAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contestant_id, type]
              properties:
                contestant_id: { type: string, format: uuid }
                type: { type: string, enum: [CERTIFIED_SAFE_DRIVER, NAIJA_DRIVER] }
      responses:
        '201':
          description: Credential issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialVerify' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/arena/admin/competitions/{id}/credentials/{cid}/revoke:
    post:
      operationId: arenaAdminRevokeCredential
      summary: Revoke an issued credential (RBAC arena.admin.credential; audited)
      description: Requires the arena.admin.credential permission. Revokes a credential (public verify then returns valid=false). Audited.
      tags: [ArenaAdmin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { description: Credential revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

