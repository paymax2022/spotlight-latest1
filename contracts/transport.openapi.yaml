openapi: 3.1.0
info:
  title: Paymax × Spotlight Transport / Mobility API (drift-closing fragment)
  version: 1.0.0
  description: >
    Standalone OpenAPI fragment documenting the live Transport / Mobility
    endpoints served by the Go backend (Gin) under /api/finance. These routes are
    registered in backend/internal/app/finance_routes.go inside the
    FeatureTransportEnabled block (customer /mobility/*, driver /driver/*, admin
    /api/finance/admin/transport/*) and the nested FeatureTransportModesEnabled
    block (car-hire, parcel, bus, towing, movers, event transport, business
    logistics). Handler signatures live in backend/internal/transport/*_handler.go.

    All monetary amounts are integers in minor units (kobo). Every financial
    mutation that escrows, settles, refunds, or tips MUST carry an
    `Idempotency-Key` header (prevents duplicate retries / double charge), posts
    balanced double-entry ledger entries via the shared settlement service, and
    emits an audit event. Endpoints that require the key are marked below with the
    `IdempotencyKey` parameter; read-only GETs and non-money mutations omit it.

    Auth: every route requires a Bearer JWT (bearerAuth). Customer + driver routes
    use requireUserID(); admin routes add RequireAdmin(AdminAPIKey) plus per-area
    RBAC permission slugs (mobility.view for reads, mobility[.area].manage for
    mutations) seeded by supabase/migrations/20260621090000_mobility_rbac.sql.

    NOTE: This fragment is kept SEPARATE to avoid clobbering the large master
    contract. Merge these `paths:` and `components:` into the master
    `contracts/openapi.yaml` paths block when integrating. Same style/auth/component
    conventions as contracts/voting.openapi.yaml.

servers:
  - url: /api/finance
    description: Go backend (Gin) — transport / mobility module

security:
  - bearerAuth: []

tags:
  - name: mobility-customer
    description: Rider-facing ride-hailing endpoints (/mobility/*)
  - name: mobility-driver
    description: Driver-facing endpoints (/driver/*)
  - name: mobility-admin
    description: Admin control plane (/admin/transport/*) — RBAC-gated, audited
  - name: car-hire
    description: Car hire mode (FeatureTransportModesEnabled)
  - name: parcel
    description: Parcel delivery mode (FeatureTransportModesEnabled)
  - name: bus
    description: Bus booking mode (FeatureTransportModesEnabled)
  - name: towing
    description: Towing / roadside mode (FeatureTransportModesEnabled)
  - name: movers
    description: Movers (bid-based) mode (FeatureTransportModesEnabled)
  - name: event-transport
    description: Event transport mode (FeatureTransportModesEnabled)
  - name: business-logistics
    description: Business logistics mode (FeatureTransportModesEnabled)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: Globally unique key per financial mutation (prevents duplicate retries / double charge).
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string }
    TripIdParam:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Trip id.
  schemas:
    Money: { type: integer, format: int64, description: Amount in kobo (minor units) }
    LatLng:
      type: object
      properties:
        lat: { type: number }
        lng: { type: number }
    Error:
      type: object
      properties:
        error: { type: string }
    BusTicket:
      type: object
      description: A wallet-booked bus ticket (camelCase keys). Money fields are integer kobo.
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        scheduleId: { type: string, format: uuid }
        seatNumber: { type: integer }
        passengerName: { type: string }
        passengerPhone: { type: string, nullable: true }
        qrCode: { type: string }
        fareKobo: { type: integer, format: int64 }
        paymentStatus: { type: string, enum: [paid, refunded], description: "'refunded' only after the wallet credit actually posted" }
        boardingStatus: { type: string, enum: [issued, boarded, no_show] }
        status: { type: string, enum: [booked, issued, boarding, boarded, completed, rescheduled, cancelled, refunded] }
        refundStatus: { type: string, enum: [none, pending, refunded, failed, manual_required] }
        departureTime: { type: string, format: date-time }
        cancelCutoffMinutes: { type: integer, nullable: true, description: Cutoff before departure after which self-service cancel is refused (null for immediate-settlement tickets) }
        cancelDeadline: { type: string, format: date-time, nullable: true }
        routeLabel: { type: string, description: 'Origin → destination label' }
        originTerminal: { type: string }
        destTerminal: { type: string }
        operatorName: { type: string }
        arriveAt: { type: string, format: date-time, nullable: true }
        cancellable: { type: boolean, description: Server verdict - would a self-service cancel + refund be accepted right now }
        createdAt: { type: string, format: date-time }
    BusCancelResult:
      type: object
      required: [ok, status, refund_status]
      properties:
        ok: { type: boolean }
        status: { type: string, example: cancelled }
        refund_status: { type: string, enum: [none, pending, refunded, failed, manual_required] }
        refunded_kobo: { type: integer, format: int64, description: Kobo actually credited back to the wallet (0 unless refund_status=refunded) }
        message: { type: string }
    BusScheduleCancelResult:
      type: object
      properties:
        schedule_id: { type: string, format: uuid }
        status: { type: string, example: cancelled }
        tickets_total: { type: integer }
        refunded: { type: integer }
        pending: { type: integer, description: Cancelled, refund still to be (re)tried }
        failed: { type: integer }
        manual_required: { type: integer, description: Already paid out to the operator - refund must be handled by support/ops }
        complete: { type: boolean, description: true when no ticket is left pending/failed (manual_required counts as handled-by-ops) }
    Ok:
      type: object
      description: Generic success envelope. Most handlers wrap the payload in a `data` key or a named key (trip/offers/schedules/…).
      additionalProperties: true

paths:
  # ═══════════════════════════════════════════════════════════════════════════
  # CUSTOMER — Ride-hailing (/mobility/*)   [FeatureTransportEnabled]
  # ═══════════════════════════════════════════════════════════════════════════
  /mobility/ws:
    get:
      tags: [mobility-customer]
      summary: Real-time trip tracking WebSocket (rider/driver channel)
      description: Upgrades to a WebSocket; driver GPS is snapped to road and fanned out to rider + driver via Redis pub/sub.
      responses: { '101': { description: Switching Protocols (WS upgrade) }, '401': { description: Not authenticated } }
  /mobility/trips/{id}/track:
    post:
      tags: [mobility-customer]
      summary: Ingest a driver GPS position for a trip
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Accepted }, '401': { description: Not authenticated } }
  /mobility/home:
    get:
      tags: [mobility-customer]
      summary: Mobility home (wallet balance, active trip, saved/recent places, quick tiles)
      responses: { '200': { description: Home payload }, '401': { description: Not authenticated } }
  /mobility/config/pricing:
    get:
      tags: [mobility-customer]
      summary: Server-owned pricing config (fare floors/ceilings/commission) for a service type + zone
      parameters:
        - { name: service_type, in: query, schema: { type: string } }
        - { name: zone, in: query, schema: { type: string } }
      responses: { '200': { description: Pricing config }, '401': { description: Not authenticated } }
  /mobility/rides/estimate:
    post:
      tags: [mobility-customer]
      summary: Estimate fare/distance/duration for a ride (no money moves)
      responses: { '200': { description: Estimate }, '401': { description: Not authenticated } }
  /mobility/rides/request:
    post:
      tags: [mobility-customer]
      summary: Request a ride (escrows fare) — money mutation
      description: Money mutation — escrows the fare and posts balanced ledger entries. Requires an Idempotency-Key.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Trip created }
        '401': { description: Not authenticated }
        '402': { description: Insufficient wallet balance }
        '422': { description: Offer out of allowed range / validation error }
  /mobility/rides/active:
    get:
      tags: [mobility-customer]
      summary: Get the caller's active trip (or null)
      responses: { '200': { description: Active trip or null }, '401': { description: Not authenticated } }
  /mobility/rides/{id}/offer:
    post:
      tags: [mobility-customer]
      summary: Rider makes/updates a fare offer (negotiation)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Fare offer }, '401': { description: Not authenticated }, '422': { description: Offer out of bounds } }
  /mobility/rides/{id}/accept-counter:
    post:
      tags: [mobility-customer]
      summary: Rider accepts a driver's counter (re-escrows delta) — money mutation
      description: Money mutation — re-escrows the fare delta. Requires an Idempotency-Key (idempotent).
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Updated trip }, '401': { description: Not authenticated } }
  /mobility/rides/{id}/cancel:
    post:
      tags: [mobility-customer]
      summary: Cancel a ride (refunds escrow per policy)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Cancelled trip }, '401': { description: Not authenticated } }
  /mobility/rides/{id}:
    get:
      tags: [mobility-customer]
      summary: Get a trip by id
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Trip }, '401': { description: Not authenticated }, '404': { description: Not found } }
  /mobility/rides/{id}/share:
    post:
      tags: [mobility-customer]
      summary: Generate a share link for a trip
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Share link }, '401': { description: Not authenticated } }
  /mobility/rides/{id}/sos:
    post:
      tags: [mobility-customer]
      summary: Trigger an SOS safety incident on a trip
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Incident opened }, '401': { description: Not authenticated } }
  /mobility/rides/{id}/rate:
    post:
      tags: [mobility-customer]
      summary: Rate a completed trip (tip is a money mutation)
      description: Rating + optional tip. When a tip is present this is a money mutation — requires an Idempotency-Key.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Rating }, '401': { description: Not authenticated } }
  /mobility/parcel/{id}/rate:
    post:
      tags: [mobility-customer]
      summary: Rate the courier on a delivered parcel (tip is a money mutation)
      description: Sender rates the courier; optional tip (100% to courier). Requires an Idempotency-Key when a tip is present.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Rating }, '401': { description: Not authenticated }, '403': { description: Not the sender / not delivered } }
  /mobility/towing/{id}/rate:
    post:
      tags: [mobility-customer]
      summary: Rate the operator on a completed tow (tip is a money mutation)
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Rating }, '401': { description: Not authenticated }, '403': { description: Not the customer / not completed } }
  /mobility/movers/{id}/rate:
    post:
      tags: [mobility-customer]
      summary: Rate the provider on a completed move (tip is a money mutation)
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Rating }, '401': { description: Not authenticated }, '403': { description: Not the customer / not completed } }
  /mobility/bus/schedules/{id}/seats:
    get:
      tags: [mobility-customer]
      summary: Seat map for a bus schedule
      description: >-
        Returns total seats plus the set of taken seat numbers so the client can render seat
        selection, AND the server-owned per-seat fare (integer kobo) and departure time so the
        client never has to guess the price. Seats freed by a cancelled/refunded ticket are
        reported as available (and can be re-booked).
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200':
          description: Seat map
          content:
            application/json:
              schema:
                type: object
                required: [schedule_id, total_seats, taken, available, fare_kobo]
                properties:
                  schedule_id: { type: string, format: uuid }
                  total_seats: { type: integer }
                  taken: { type: array, items: { type: integer } }
                  available: { type: integer }
                  fare_kobo: { type: integer, format: int64, description: Per-seat fare in kobo }
                  departure_time: { type: string, format: date-time }
                  currency: { type: string, example: NGN }
        '401': { description: Not authenticated }
  /mobility/history:
    get:
      tags: [mobility-customer]
      summary: Trip history
      responses: { '200': { description: Trip list }, '401': { description: Not authenticated } }
  /mobility/profile:
    get:
      tags: [mobility-customer]
      summary: Get mobility profile
      responses: { '200': { description: Profile }, '401': { description: Not authenticated } }
    put:
      tags: [mobility-customer]
      summary: Update mobility profile
      responses: { '200': { description: Profile }, '401': { description: Not authenticated } }
  /mobility/trusted-contacts:
    get:
      tags: [mobility-customer]
      summary: List trusted safety contacts
      responses: { '200': { description: Contacts }, '401': { description: Not authenticated } }
    post:
      tags: [mobility-customer]
      summary: Add a trusted safety contact
      responses: { '200': { description: Created contact }, '401': { description: Not authenticated } }
  /mobility/trusted-contacts/{id}:
    delete:
      tags: [mobility-customer]
      summary: Delete a trusted safety contact
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '204': { description: Deleted }, '401': { description: Not authenticated } }

  # ═══════════════════════════════════════════════════════════════════════════
  # DRIVER — Ride-hailing (/driver/*)   [FeatureTransportEnabled]
  # ═══════════════════════════════════════════════════════════════════════════
  /driver/onboarding/submit:
    post:
      tags: [mobility-driver]
      summary: Submit driver onboarding
      responses: { '200': { description: Driver profile }, '401': { description: Not authenticated } }
  /driver/documents:
    post:
      tags: [mobility-driver]
      summary: Upload/replace a driver document
      responses: { '200': { description: Updated profile }, '401': { description: Not authenticated } }
  /driver/vehicle:
    post:
      tags: [mobility-driver]
      summary: Add a driver vehicle
      responses: { '200': { description: Updated profile }, '401': { description: Not authenticated } }
  /driver/me:
    get:
      tags: [mobility-driver]
      summary: Get the authenticated driver's profile
      responses: { '200': { description: Driver profile }, '401': { description: Not authenticated } }
  /driver/status:
    patch:
      tags: [mobility-driver]
      summary: Set driver online/offline status (+ optional location)
      responses: { '200': { description: Updated profile }, '401': { description: Not authenticated }, '403': { description: Driver not approved } }
  /driver/requests:
    get:
      tags: [mobility-driver]
      summary: List ride requests offered to the driver
      responses: { '200': { description: Requests }, '401': { description: Not authenticated } }
  /driver/requests/{id}/accept:
    post:
      tags: [mobility-driver]
      summary: Accept a ride request — money mutation
      description: Money mutation (binds escrow to driver). Requires an Idempotency-Key.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Trip }, '401': { description: Not authenticated } }
  /driver/requests/{id}/counter:
    post:
      tags: [mobility-driver]
      summary: Driver counters a rider's fare offer
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Fare offer }, '401': { description: Not authenticated } }
  /driver/trips/{id}/arrive:
    post:
      tags: [mobility-driver]
      summary: Mark driver arrived at pickup
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Trip }, '401': { description: Not authenticated } }
  /driver/trips/{id}/verify-pin:
    post:
      tags: [mobility-driver]
      summary: Verify the rider's 4-digit trip PIN
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Trip }, '401': { description: Not authenticated }, '422': { description: Invalid PIN } }
  /driver/trips/{id}/start:
    post:
      tags: [mobility-driver]
      summary: Start the trip
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Trip }, '401': { description: Not authenticated } }
  /driver/trips/{id}/complete:
    post:
      tags: [mobility-driver]
      summary: Complete the trip (settles driver split) — money mutation
      description: >
        Money mutation — releases escrow and settles the driver split via the
        settlement service. Idempotency-Key recommended; backend treats completion
        as idempotent.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Trip }, '401': { description: Not authenticated } }
  /driver/earnings:
    get:
      tags: [mobility-driver]
      summary: Driver earnings summary
      responses: { '200': { description: Earnings }, '401': { description: Not authenticated } }
  /driver/sos:
    post:
      tags: [mobility-driver]
      summary: Driver SOS safety incident
      responses: { '200': { description: Incident }, '401': { description: Not authenticated } }

  # ═══════════════════════════════════════════════════════════════════════════
  # ADMIN — control plane (/admin/transport/*)   [FeatureTransportEnabled]
  #   RBAC: mobility.view (GET) / mobility[.area].manage (mutations). Audited.
  # ═══════════════════════════════════════════════════════════════════════════
  /admin/transport/dashboard:
    get: { tags: [mobility-admin], summary: Admin dashboard, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
  /admin/transport/drivers:
    get: { tags: [mobility-admin], summary: List drivers, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
  /admin/transport/drivers/{id}:
    get:
      tags: [mobility-admin]
      summary: Driver detail
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: OK }, '403': { description: Missing mobility.view } }
  /admin/transport/drivers/{id}/verification:
    patch:
      tags: [mobility-admin]
      summary: Set driver verification status
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: OK }, '403': { description: Missing mobility.ride.manage } }
  /admin/transport/vehicles:
    get: { tags: [mobility-admin], summary: List vehicles, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
  /admin/transport/vehicles/{id}/status:
    patch:
      tags: [mobility-admin]
      summary: Set vehicle status
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: OK }, '403': { description: Missing mobility.ride.manage } }
  /admin/transport/trips:
    get: { tags: [mobility-admin], summary: List trips, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
  /admin/transport/dispatch/live:
    get: { tags: [mobility-admin], summary: Live dispatch board, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
  /admin/transport/dispatch/{trip_id}/assign:
    post:
      tags: [mobility-admin]
      summary: Manually assign a trip to a driver
      parameters: [{ name: trip_id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '403': { description: Missing mobility.ride.manage } }
  /admin/transport/pricing:
    get: { tags: [mobility-admin], summary: Get pricing config, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
    patch: { tags: [mobility-admin], summary: Update pricing config, responses: { '200': { description: OK }, '403': { description: Missing mobility.manage } } }
  /admin/transport/commission:
    get: { tags: [mobility-admin], summary: List commission tiers, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
  /admin/transport/commission/{tier}:
    patch:
      tags: [mobility-admin]
      summary: Update a commission tier
      parameters: [{ name: tier, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '403': { description: Missing mobility.manage } }
  /admin/transport/safety/incidents:
    get: { tags: [mobility-admin], summary: List safety incidents, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
  /admin/transport/safety/incidents/{id}:
    patch:
      tags: [mobility-admin]
      summary: Update a safety incident
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: OK }, '403': { description: Missing mobility.manage } }
  /admin/transport/reports/summary:
    get: { tags: [mobility-admin], summary: Reports summary, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
  /admin/transport/audit:
    get: { tags: [mobility-admin], summary: Admin audit feed, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }

  # ═══════════════════════════════════════════════════════════════════════════
  # CAR HIRE   [FeatureTransportModesEnabled]
  # ═══════════════════════════════════════════════════════════════════════════
  /mobility/car-hire/quote:
    post:
      tags: [car-hire]
      summary: Quote a car-hire booking (no money moves)
      responses: { '200': { description: Quote }, '401': { description: Not authenticated } }
  /mobility/car-hire/book:
    post:
      tags: [car-hire]
      summary: Book a car hire (escrows fare + deposit) — money mutation
      description: >
        Money mutation — escrows fare + deposit FROM THE WALLET (KYC-tier gated). Requires an Idempotency-Key;
        keys starting `carhireorder:` are reserved for the card-direct rail (400 INVALID_IDEMPOTENCY_KEY).
        `hire_type` must be one of hourly, daily, airport, event, executive (400 invalid_input otherwise —
        refused BEFORE any money moves). To pay by debit card without the wallet gate use
        POST /mobility/car-hire/paystack/initiate.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Booking }, '400': { description: 'invalid_input or INVALID_IDEMPOTENCY_KEY' }, '401': { description: Not authenticated }, '402': { description: Insufficient balance } }
  /mobility/car-hire:
    get:
      tags: [car-hire]
      summary: List car-hire bookings
      responses: { '200': { description: Bookings }, '401': { description: Not authenticated } }
  /mobility/car-hire/{id}:
    get:
      tags: [car-hire]
      summary: Get a car-hire booking
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Booking }, '401': { description: Not authenticated }, '404': { description: Not found } }
  /mobility/car-hire/{id}/activate:
    post:
      tags: [car-hire]
      summary: Activate (start) a car-hire booking
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Booking }, '401': { description: Not authenticated } }
  /mobility/car-hire/{id}/extend:
    post:
      tags: [car-hire]
      summary: Extend a car hire (escrows delta) — money mutation
      description: >
        Money mutation — escrows the additional-hours delta from the WALLET. Requires an Idempotency-Key.
        A CARD-funded booking cannot be extended (a card-direct rental has no second charge): 409
        EXTENSION_NOT_AVAILABLE_FOR_CARD, and no wallet is debited. Rebook for a longer hire.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Booking }, '401': { description: Not authenticated }, '409': { description: 'EXTENSION_NOT_AVAILABLE_FOR_CARD (card-funded booking) or invalid state' } }
  /mobility/car-hire/{id}/complete:
    post:
      tags: [car-hire]
      summary: Complete a car hire (settle split, release deposit) — money mutation
      description: >
        Money mutation — settles the provider split and releases the deposit. For a CARD-funded booking the
        deposit goes back to the CARD (a gateway refund of exactly the deposit; never the wallet) and the
        call is re-POSTable: completing an already-completed card booking finishes a deposit refund that
        failed after the status flip. A card booking with no driver assigned is refused (409 CARD_HIRE_NO_DRIVER)
        BEFORE anything changes. `deposit_refund_status` is the honest answer to "is my deposit back?":
        none | refunded (the gateway accepted the refund; the bank may take days) | pending (not yet; retried
        by re-POSTing complete and by the reconciler) | failed (wallet refund failed; manual).
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Completed, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, status: { type: string }, deposit_refund_status: { type: string, enum: [none, refunded, pending, failed] } } } } } }
        '401': { description: Not authenticated }
        '409': { description: 'CARD_HIRE_NO_DRIVER or invalid state' }
  /mobility/car-hire/{id}/cancel:
    post:
      tags: [car-hire]
      summary: Cancel a car-hire booking (refund per policy)
      description: >
        Refunds the fare AND the deposit. A CARD-funded booking is refunded to the card (two gateway refunds,
        one per settlement — never the wallet) and can only be cancelled BEFORE activation: while active or
        extended it is 409 CARD_HIRE_ACTIVE_USE_RETURN (complete the hire to get the deposit back). Re-POSTing
        cancel on an already-cancelled card booking finishes a refund that failed after the status flip.
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200': { description: 'Cancelled. refund_status = whether the money is back: none | refunded | pending (card refund not yet complete; retried by re-POSTing cancel and by the reconciler) | failed (wallet refund failed; manual)', content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, status: { type: string }, refund_status: { type: string, enum: [none, refunded, pending, failed] } } } } } }
        '401': { description: Not authenticated }
        '409': { description: 'CARD_HIRE_ACTIVE_USE_RETURN (card-funded, already active) or invalid state' }
        '503': { description: 'refund_unavailable - card refunds are not wired; NOTHING was cancelled, retry shortly' }
  # ── Card-direct (pay by debit card; never the wallet KYC-tier gate) ──────────
  # [FeatureTransportPaystackCheckoutEnabled AND FeatureTransportPaystackCarHireEnabled AND
  #  FeatureTransportModesEnabled]. See docs/adr/ADR-PR522-mobility-card-direct.md
  # ("Partial refunds (car hire)"). ONE card charge = fare + deposit, held as TWO settlements.
  /mobility/car-hire/paystack/initiate:
    post:
      tags: [car-hire]
      summary: Start a card-direct car-hire checkout (server-quoted fare + deposit as ONE charge; no wallet debit) — money mutation
      description: >
        Body is the SAME as POST /mobility/car-hire/book (hire_type, vehicle_class, start_at, duration_hours,
        chauffeur, pickup_address, special_request) plus optional `email` and `callback_url` (gateway-only;
        stripped before the request is frozen). There is NO amount field: the server prices the hire
        (fare = base + hours x hourly rate, floored at the minimum fare; deposit = one base period), freezes the
        quote AND the pricing config it used, and asks Paystack for fare + deposit in NGN kobo (integers, no
        rounding). `hire_type` must be one of hourly, daily, airport, event, executive; `start_at` RFC3339 and
        not more than a day in the past nor more than a year ahead; `duration_hours` 1-720. An invalid request is
        a 400 BEFORE any gateway call. Idempotency-Key is REQUIRED as a header (8-100 chars of A-Z a-z 0-9 . _ = -).
        Replays behave as for the other card-direct services. No wallet is debited, so the KYC-tier gate never runs;
        the wallet rail (POST /mobility/car-hire/book) keeps it and refuses keys starting `carhireorder:`.
        The deposit is refundable: it returns to the SAME CARD on completion (days, not instant) and the whole
        charge returns to the card on cancel before activation.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201':
          description: Checkout created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [reference, amountKobo, status]
                    properties:
                      reference: { type: string, description: 'carhireorder:<Idempotency-Key>' }
                      authorizationUrl: { type: string, description: Empty when status is not pending }
                      accessCode: { type: string }
                      amountKobo: { type: integer, format: int64, description: 'Server-quoted fare + deposit in kobo' }
                      status: { type: string, enum: [pending, processing, confirmed, amount_mismatch, order_failed, refunding, refunded] }
        '400': { description: 'invalid_input, idempotency_key_required or invalid_idempotency_key' }
        '401': { description: Not authenticated }
        '404': { description: 'service_disabled - the service flag is off (new checkouts refused; status/confirm/refund for money already collected stay live)' }
        '409': { description: 'idempotency_conflict, or authorization_unavailable' }
        '429': { description: Per-user rate limit on checkout creation (rate_limited) }
  /mobility/car-hire/paystack/{reference}/status:
    get:
      tags: [car-hire]
      summary: Poll a card-direct car-hire checkout (also drives confirmation — self-heals a late/missing webhook)
      description: >
        Owner-only (another user's reference is 404). While pending/processing this verifies the charge with
        Paystack server-side and, once successful, books the hire and escrows fare and deposit as two external
        settlements (settlement.EscrowExternal). The booking is made exactly once however webhook and polls race.
        A charge that cannot back a booking is refunded at the gateway in full (`refunded` = accepted by the
        gateway; `refunding` = in flight). Cancelling a card-funded booking before activation refunds the
        card — never the wallet.
      parameters:
        - { name: reference, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [reference, status]
                    properties:
                      reference: { type: string }
                      status: { type: string, enum: [pending, processing, confirmed, amount_mismatch, order_failed, refunding, refunded] }
                      amountKobo: { type: integer, format: int64 }
                      bookingId: { type: string, format: uuid, description: Present once confirmed }
        '401': { description: Not authenticated }
        '404': { description: 'unknown_reference (also returned for a reference that is not yours)' }

  # ═══════════════════════════════════════════════════════════════════════════
  # PARCEL DELIVERY   [FeatureTransportModesEnabled]
  # ═══════════════════════════════════════════════════════════════════════════
  /mobility/parcels/estimate:
    post:
      tags: [parcel]
      summary: Estimate a parcel delivery (no money moves)
      responses: { '200': { description: Estimate }, '401': { description: Not authenticated } }
  /mobility/parcels:
    post:
      tags: [parcel]
      summary: Book a parcel delivery (escrows fare) — money mutation
      description: >
        Money mutation — escrows the fare. Requires an Idempotency-Key. Keys beginning with a
        namespace owned by the card-direct / Paystack checkouts (`parcelorder:`, `rideorder:`,
        `foodorder:`, `duespay:`, `feespay:`, `towingorder:`, `moversorder:`, `carhireorder:`,
        `busorder:`, `eventorder:`; case-insensitive) are refused with 400 INVALID_IDEMPOTENCY_KEY.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Parcel }, '400': { description: INVALID_IDEMPOTENCY_KEY (reserved key namespace) }, '401': { description: Not authenticated }, '402': { description: Insufficient balance } }
    get:
      tags: [parcel]
      summary: List parcels
      responses: { '200': { description: Parcels }, '401': { description: Not authenticated } }
  /mobility/parcels/{id}:
    get:
      tags: [parcel]
      summary: Get a parcel
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Parcel }, '401': { description: Not authenticated }, '404': { description: Not found } }
  /mobility/parcels/{id}/cancel:
    post:
      tags: [parcel]
      summary: Cancel a parcel (refund per policy)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: 'Cancelled. refund_status = whether the money is back: none | refunded | pending (card refund not yet complete; retried by re-POSTing cancel and by the reconciler) | failed (wallet refund failed; manual)', content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, status: { type: string }, refund_status: { type: string, enum: [none, refunded, pending, failed] } } } } } }, '503': { description: 'refund_unavailable - card refunds are not wired; NOTHING was cancelled, retry shortly' }, '401': { description: Not authenticated } }
  # ── Card-direct (pay by debit card; never the wallet KYC-tier gate) ──────────
  # [FeatureTransportPaystackCheckoutEnabled AND FeatureTransportPaystackParcelEnabled AND
  #  FeatureTransportModesEnabled]. See docs/adr/ADR-PR522-mobility-card-direct.md.
  /mobility/parcels/paystack/initiate:
    post:
      tags: [parcel]
      summary: Start a card-direct parcel checkout (server-quoted amount; no wallet debit) — money mutation
      description: >
        Body is the SAME as POST /mobility/parcels (pickup, dropoff, receiver_name, receiver_phone,
        category, size, speed, declared_value_kobo, prohibited_ack) plus optional `email` and
        `callback_url` (gateway-only; stripped before the request is frozen). There is NO amount
        field: the server prices the parcel (fare only; the indicative insurance premium is never
        charged at booking), freezes the quote, and asks Paystack for exactly that amount.
        Idempotency-Key is REQUIRED as a header (8-100 chars of A-Z a-z 0-9 . _ = -). Replaying a key
        with the same request returns the same reference (and the stored authorization URL while
        unpaid; the terminal status once processed); the same key with a different request or
        a different user is 409 idempotency_conflict. No wallet is debited, so the KYC-tier gate
        never runs; the wallet rail (POST /mobility/parcels) keeps it.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201':
          description: Checkout created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [reference, amountKobo, status]
                    properties:
                      reference: { type: string, description: 'parcelorder:<Idempotency-Key>' }
                      authorizationUrl: { type: string, description: Empty when status is not pending }
                      accessCode: { type: string }
                      amountKobo: { type: integer, format: int64, description: Server-quoted amount in kobo }
                      status: { type: string, enum: [pending, processing, confirmed, amount_mismatch, order_failed, refunding, refunded] }
        '400': { description: 'invalid_input, idempotency_key_required or invalid_idempotency_key' }
        '401': { description: Not authenticated }
        '404': { description: 'service_disabled - the service flag is off (new checkouts refused; status/confirm/refund for money already collected stay live)' }
        '409': { description: 'idempotency_conflict, or authorization_unavailable (the checkout URL was never persisted and Paystack will not initialize the reference twice: start a new checkout; a payment already made still confirms automatically)' }
        '422': { description: Prohibited-items acknowledgement missing (PROHIBITED_ACK_REQUIRED) }
        '429': { description: Per-user rate limit on checkout creation (rate_limited) }
  /mobility/parcels/paystack/{reference}/status:
    get:
      tags: [parcel]
      summary: Poll a card-direct parcel checkout (also drives confirmation — self-heals a late/missing webhook)
      description: >
        Owner-only (another user's reference is 404). While the intent is pending/processing this
        verifies the charge with Paystack server-side and, once successful, books the parcel and
        escrows it (settlement.EscrowExternal). Safe to poll concurrently with the webhook: the
        parcel is booked exactly once. A charge that cannot back a booking (amount/currency
        mismatch, booking failure) is refunded at the gateway; `refunded` means the gateway
        accepted the refund, `refunding` means a refund is in flight (outcome being verified with the
        gateway), `amount_mismatch`/`order_failed` mean the gateway definitively did not refund yet
        and the reconciler is retrying. Always safe to poll; a `refunded` status never reverts.
      parameters:
        - { name: reference, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [reference, status]
                    properties:
                      reference: { type: string }
                      status: { type: string, enum: [pending, processing, confirmed, amount_mismatch, order_failed, refunding, refunded] }
                      amountKobo: { type: integer, format: int64 }
                      parcelId: { type: string, format: uuid, description: Present once confirmed }
        '401': { description: Not authenticated }
        '404': { description: 'unknown_reference (also returned for a reference that is not yours)' }
  /driver/parcels/requests:
    get:
      tags: [parcel]
      summary: Courier — list parcel requests
      responses: { '200': { description: Requests }, '401': { description: Not authenticated } }
  /driver/parcels/{id}/accept:
    post:
      tags: [parcel]
      summary: Courier — accept a parcel request — money mutation
      description: Money mutation (binds escrow to courier). Requires an Idempotency-Key.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Parcel }, '401': { description: Not authenticated } }
  /driver/parcels/{id}/verify-pickup-pin:
    post:
      tags: [parcel]
      summary: Courier — verify the sender's pickup PIN
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Parcel }, '401': { description: Not authenticated }, '422': { description: Invalid PIN } }
  /driver/parcels/{id}/picked-up:
    post:
      tags: [parcel]
      summary: Courier — mark parcel picked up
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Parcel }, '401': { description: Not authenticated } }
  /driver/parcels/{id}/verify-dropoff:
    post:
      tags: [parcel]
      summary: Courier — verify the receiver's dropoff PIN (settles on delivery)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Parcel }, '401': { description: Not authenticated }, '422': { description: Invalid PIN } }

  # ═══════════════════════════════════════════════════════════════════════════
  # BUS BOOKING   [FeatureTransportModesEnabled]
  # ═══════════════════════════════════════════════════════════════════════════
  /mobility/bus/routes:
    get:
      tags: [bus]
      summary: Search bus routes
      parameters:
        - { name: origin, in: query, schema: { type: string } }
        - { name: dest, in: query, schema: { type: string } }
      responses: { '200': { description: Routes }, '401': { description: Not authenticated } }
  /mobility/bus/schedules:
    get:
      tags: [bus]
      summary: List schedules for a route (+ seats left)
      parameters:
        - { name: route_id, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, schema: { type: string } }
      responses: { '200': { description: Schedules }, '400': { description: route_id required }, '401': { description: Not authenticated } }
  /mobility/bus/book:
    post:
      tags: [bus]
      summary: Book a bus seat — money mutation
      description: >-
        Money mutation — escrows the fare in the wallet (tier-gated, fail-closed) and issues a QR
        ticket. Requires an Idempotency-Key. Replaying the same key returns the SAME ticket (the
        ticket id is derived deterministically from the key) and never double-charges or refunds
        an issued ticket. seat_number is an INTEGER. Booking is refused unless the departure is at
        least the minimum lead time away, the schedule is scheduled/boarding with an approved fare,
        and (for marketplace routes) the provider is verified+active with a resolvable payout owner.
        Settlement: with FEATURE_TRANSPORT_BUS_DEFERRED_SETTLEMENT off the operator is paid on issue
        (legacy); with it on the fare stays in escrow until departure + grace, the provider/platform
        split being FROZEN on the ticket at booking time.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedule_id, seat_number, passenger_name]
              properties:
                schedule_id: { type: string, format: uuid }
                seat_number: { type: integer, minimum: 1 }
                passenger_name: { type: string }
                passenger_phone: { type: string }
      responses:
        '201': { description: Ticket (BusTicket) }
        '401': { description: Not authenticated }
        '402': { description: Insufficient balance }
        '403': { description: Tier / spending limit gate }
        '409': { description: SEAT_TAKEN (another active ticket holds the seat), INVALID_STATE (schedule closed / departure too close / provider not bookable), or IDEMPOTENCY_KEY_CONFLICT (key already used for a different booking) }
        '422': { description: INVALID_SEAT or FARE_NOT_APPROVED }
  /mobility/bus/tickets:
    get:
      tags: [bus]
      summary: List the caller's bus tickets
      responses: { '200': { description: 'Tickets ({ tickets: [BusTicket] })' }, '401': { description: Not authenticated } }
  /mobility/bus/tickets/{id}:
    get:
      tags: [bus]
      summary: Get one of the caller's bus tickets (owner only)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200': { description: BusTicket }
        '401': { description: Not authenticated }
        '403': { description: Not your ticket }
        '404': { description: Ticket not found }
  /mobility/bus/tickets/{id}/cancel:
    post:
      tags: [bus]
      summary: Cancel a bus ticket and (when possible) refund the wallet
      description: >-
        TRUTHFUL refund contract: the ticket is only marked payment_status=refunded after the
        wallet credit has actually posted. The response carries refund_status: refunded (money is
        back in the wallet), pending / failed (ticket cancelled, refund will be retried - NOT yet
        refunded, HTTP 202), or none. A ticket whose fare was already paid out to the operator
        (legacy immediate-settlement ticket) is NOT cancelled: 409 REFUND_REQUIRES_SUPPORT. With
        deferred settlement, cancelling inside the per-schedule cutoff (default 120 min before
        departure, bounded 60-1440) is refused with 409 CANCEL_WINDOW_CLOSED. Boarded tickets
        cannot be cancelled (409 INVALID_STATE). Idempotent: repeating a cancel resumes/returns
        the same outcome.
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        '200':
          description: Cancelled and refunded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusCancelResult' }
        '202':
          description: Cancelled; refund pending/failed and being retried (not yet returned to the wallet)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusCancelResult' }
        '401': { description: Not authenticated }
        '403': { description: Not your ticket }
        '404': { description: Ticket not found }
        '409': { description: 'CANCEL_WINDOW_CLOSED, REFUND_REQUIRES_SUPPORT or INVALID_STATE' }
  /mobility/bus/provider/schedules/{id}/cancel:
    post:
      tags: [bus]
      summary: Provider - cancel one of the caller's schedules and refund every active ticket
      description: >-
        Owner-gated (the schedule's route provider must be the caller's). Refused (409) once the
        departure time has passed. Marks the schedule
        cancelled and refunds each active ticket whose fare is still in escrow via the settlement
        refund path. Tickets already paid out to the operator (legacy settlement) are cancelled
        with refund_status=manual_required and are NEVER reported as refunded. Idempotent and
        resumable: re-calling processes only tickets not yet finished.
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        '200':
          description: Schedule cancellation summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusScheduleCancelResult' }
        '401': { description: Not authenticated }
        '403': { description: Not your schedule }
        '404': { description: Schedule not found }
        '409': { description: Schedule already departed/completed }
  /driver/bus/validate:
    post:
      tags: [bus]
      summary: Operator — validate a bus ticket QR at boarding
      description: >-
        Only the route operator may validate. The scan is accepted only inside the boarding window
        (3 h before departure until the schedule end + grace) and never for a cancelled/refunded
        ticket or a cancelled schedule.
      responses: { '200': { description: Validation result }, '401': { description: Not authenticated } }

