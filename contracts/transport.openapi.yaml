      summary: List towing jobs
      responses: { '200': { description: Jobs }, '401': { description: Not authenticated } }
  /mobility/towing/{id}:
    get:
      tags: [towing]
      summary: Get a towing job
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Job }, '401': { description: Not authenticated }, '404': { description: Not found } }
  /mobility/towing/{id}/cancel:
    post:
      tags: [towing]
      summary: Cancel a towing job (refund per policy)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Job }, '401': { description: Not authenticated } }
  /driver/towing/requests:
    get:
      tags: [towing]
      summary: Operator — list towing requests
      responses: { '200': { description: Requests }, '401': { description: Not authenticated } }
  /driver/towing/{id}/accept:
    post:
      tags: [towing]
      summary: Operator — accept a towing request — money mutation
      description: Money mutation (binds escrow to operator). Requires an Idempotency-Key.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Job }, '401': { description: Not authenticated } }
  /driver/towing/{id}/en-route:
    post:
      tags: [towing]
      summary: Operator — mark en route
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Job }, '401': { description: Not authenticated } }
  /driver/towing/{id}/verify-pin:
    post:
      tags: [towing]
      summary: Operator — verify the customer's PIN
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Job }, '401': { description: Not authenticated }, '422': { description: Invalid PIN } }
  /driver/towing/{id}/start:
    post:
      tags: [towing]
      summary: Operator — start the tow
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
