        Idempotency-Key is REQUIRED as a header (8-100 chars of A-Z a-z 0-9 . _ = -). Replaying a key with
        the same request returns the same reference (and the stored authorization URL while unpaid; the
        terminal status once processed); the same key with a different request or a different user is 409
        idempotency_conflict. No wallet is debited, so the KYC-tier gate never runs; the wallet rail
        (POST /mobility/towing) keeps it and refuses keys starting `towingorder:` (400 INVALID_IDEMPOTENCY_KEY).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201':
          description: Checkout created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
