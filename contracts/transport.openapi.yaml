                      status: { type: string, enum: [pending, processing, confirmed, amount_mismatch, order_failed, refunding, refunded] }
        '400': { description: 'invalid_input, idempotency_key_required or invalid_idempotency_key' }
        '401': { description: Not authenticated }
        '404': { description: 'service_disabled - the service flag is off (new checkouts refused; status/confirm/refund for money already collected stay live)' }
        '409': { description: 'idempotency_conflict, or authorization_unavailable (the checkout URL was never persisted and Paystack will not initialize the reference twice: start a new checkout; a payment already made still confirms automatically)' }
        '429': { description: Per-user rate limit on checkout creation (rate_limited) }
  /mobility/towing/paystack/{reference}/status:
    get:
      tags: [towing]
      summary: Poll a card-direct towing checkout (also drives confirmation — self-heals a late/missing webhook)
      description: >
        Owner-only (another user's reference is 404). While the intent is pending/processing this verifies
        the charge with Paystack server-side and, once successful, books the towing job and escrows it
        (settlement.EscrowExternal). Safe to poll concurrently with the webhook: the job is booked exactly
        once. A charge that cannot back a booking (amount/currency mismatch, booking failure) is refunded
        at the gateway; `refunded` means the gateway accepted the refund, `refunding` means a refund is in
        flight (outcome being verified with the gateway), `amount_mismatch`/`order_failed` mean the gateway
        definitively did not refund yet and the reconciler is retrying. Always safe to poll; a `refunded`
        status never reverts. Cancelling a card-funded job (POST /mobility/towing/{id}/cancel) refunds the
        card via the gateway — never the wallet — and is re-POSTable to finish a refund that failed after
        the status flip.
      parameters:
        - { name: reference, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [reference, status]
                    properties:
                      reference: { type: string }
                      status: { type: string, enum: [pending, processing, confirmed, amount_mismatch, order_failed, refunding, refunded] }
                      amountKobo: { type: integer, format: int64 }
                      towingJobId: { type: string, format: uuid, description: Present once confirmed }
        '401': { description: Not authenticated }
        '404': { description: 'unknown_reference (also returned for a reference that is not yours)' }
  /driver/towing/requests:
    get:
      tags: [towing]
      summary: Operator — list towing requests
      responses: { '200': { description: Requests }, '401': { description: Not authenticated } }
  /driver/towing/{id}/accept:
    post:
      tags: [towing]
      summary: Operator — accept a towing request — money mutation
      description: Money mutation (binds escrow to operator). Requires an Idempotency-Key.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Job }, '401': { description: Not authenticated } }
  /driver/towing/{id}/en-route:
    post:
      tags: [towing]
      summary: Operator — mark en route
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Job }, '401': { description: Not authenticated } }
  /driver/towing/{id}/verify-pin:
    post:
