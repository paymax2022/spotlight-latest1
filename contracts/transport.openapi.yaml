        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Mover job }, '401': { description: Not authenticated } }
  /mobility/movers/{id}/cancel:
    post:
      tags: [movers]
      summary: Cancel a mover job (refund per policy)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: 'Cancelled. refund_status = whether the money is back: none | refunded | pending (card refund not yet complete; retried by re-POSTing cancel and by the reconciler) | failed (wallet refund failed; manual)', content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, status: { type: string }, refund_status: { type: string, enum: [none, refunded, pending, failed] } } } } } }, '503': { description: 'refund_unavailable - card refunds are not wired; NOTHING was cancelled, retry shortly' }, '401': { description: Not authenticated } }
  # ── Card-direct (pay the accepted bid by debit card; never the wallet KYC-tier gate) ──
  # [FeatureTransportPaystackCheckoutEnabled AND FeatureTransportPaystackMoversEnabled AND
  #  FeatureTransportModesEnabled]. See docs/adr/ADR-PR522-mobility-card-direct.md.
  /mobility/movers/paystack/initiate:
    post:
      tags: [movers]
      summary: Start a card-direct checkout for ACCEPTING a mover bid (server-read amount; no wallet debit) — money mutation
      description: >
        Charged at BID ACCEPTANCE, not at quote time. Body is `{ job_id, bid_id }` plus optional `email` and
        `callback_url` (gateway-only; stripped before the request is frozen). There is NO amount field and any
        client-sent amount is ignored: the server reads the bid's amount itself, requires that the job belongs
        to the caller, is still open (quote_requested / bids_received) and unfunded, and that the bid belongs to
        the job and is still `submitted`, freezes {bid, provider, amount}, and asks Paystack for exactly that
        amount. Anything else is refused before any gateway call (403 not your job, 404 job/bid not found,
        409 job not open / already funded / bid not available).
        When the charge confirms, the server RE-CHECKS the job and bid; if the bid was withdrawn or replaced,
        its amount or provider changed, or the job was cancelled / funded by another path in the meantime, the
        charge is REFUNDED at the gateway in full and nothing is accepted or escrowed (status `refunded`).
        Idempotency-Key is REQUIRED as a header (8-100 chars of A-Z a-z 0-9 . _ = -). Replaying a key with the
        same request returns the same reference (stored authorization URL while unpaid; terminal status once
        processed); the same key with a different request or user is 409 idempotency_conflict. No wallet is
        debited, so the KYC-tier gate never runs; the wallet rail (POST /mobility/movers/{id}/accept-bid)
        keeps it and refuses keys starting `moversorder:` (400 INVALID_IDEMPOTENCY_KEY).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_id, bid_id]
              properties:
                job_id: { type: string, format: uuid }
                bid_id: { type: string, format: uuid }
                email: { type: string }
                callback_url: { type: string }
      responses:
        '201':
          description: Checkout created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [reference, amountKobo, status]
                    properties:
                      reference: { type: string, description: 'moversorder:<Idempotency-Key>' }
                      authorizationUrl: { type: string, description: Empty when status is not pending }
                      accessCode: { type: string }
                      amountKobo: { type: integer, format: int64, description: The accepted bid, read server-side, in kobo }
                      status: { type: string, enum: [pending, processing, confirmed, amount_mismatch, order_failed, refunding, refunded] }
        '400': { description: 'invalid_input (job_id/bid_id missing), idempotency_key_required or invalid_idempotency_key' }
        '401': { description: Not authenticated }
        '403': { description: Not your job }
        '404': { description: 'job/bid not found, or service_disabled - the service flag is off (new checkouts refused; status/confirm/refund for money already collected stay live)' }
        '409': { description: 'job not open / already funded / bid not available, idempotency_conflict, or authorization_unavailable (start a new checkout; a payment already made still confirms automatically)' }
        '429': { description: Per-user rate limit on checkout creation (rate_limited) }
  /mobility/movers/paystack/{reference}/status:
    get:
      tags: [movers]
      summary: Poll a card-direct mover checkout (also drives confirmation — self-heals a late/missing webhook)
      description: >
        Owner-only (another user's reference is 404). While the intent is pending/processing this verifies the
        charge with Paystack server-side and, once successful, accepts the bid and escrows it
        (settlement.EscrowExternal) — job becomes bid_accepted, escrow funded. Safe to poll concurrently with
        the webhook: the bid is accepted exactly once. A charge that cannot back an acceptance (amount/currency
        mismatch, bid withdrawn/changed, job no longer open) is refunded at the gateway; `refunded` means the
        gateway accepted the refund, `refunding` means a refund is in flight (outcome being verified),
        `amount_mismatch`/`order_failed` mean the gateway definitively did not refund yet and the reconciler
        is retrying. Cancelling a card-funded move (POST /mobility/movers/{id}/cancel) refunds the card via the
        gateway — never the wallet — and is re-POSTable to finish a refund that failed after the status flip.
      parameters:
        - { name: reference, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [reference, status]
                    properties:
                      reference: { type: string }
                      status: { type: string, enum: [pending, processing, confirmed, amount_mismatch, order_failed, refunding, refunded] }
                      amountKobo: { type: integer, format: int64 }
                      moveId: { type: string, format: uuid, description: The mover job id; present once confirmed }
        '401': { description: Not authenticated }
        '404': { description: 'unknown_reference (also returned for a reference that is not yours)' }
  /driver/movers/open:
    get:
      tags: [movers]
      summary: Provider — list open mover jobs to bid on
      responses: { '200': { description: Open jobs }, '401': { description: Not authenticated } }
  /driver/movers/{id}/bid:
    post:
