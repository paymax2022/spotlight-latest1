openapi: 3.1.0
info:
  title: Paymax × Spotlight Transport / Mobility API (drift-closing fragment)
  version: 1.0.0
  description: >
    Standalone OpenAPI fragment documenting the live Transport / Mobility
    endpoints served by the Go backend (Gin) under /api/finance. These routes are
    registered in backend/internal/app/finance_routes.go inside the
    FeatureTransportEnabled block (customer /mobility/*, driver /driver/*, admin
    /api/finance/admin/transport/*) and the nested FeatureTransportModesEnabled
    block (car-hire, parcel, bus, towing, movers, event transport, business
    logistics). Handler signatures live in backend/internal/transport/*_handler.go.

    All monetary amounts are integers in minor units (kobo). Every financial
    mutation that escrows, settles, refunds, or tips MUST carry an
    `Idempotency-Key` header (prevents duplicate retries / double charge), posts
    balanced double-entry ledger entries via the shared settlement service, and
    emits an audit event. Endpoints that require the key are marked below with the
    `IdempotencyKey` parameter; read-only GETs and non-money mutations omit it.

    Auth: every route requires a Bearer JWT (bearerAuth). Customer + driver routes
    use requireUserID(); admin routes add RequireAdmin(AdminAPIKey) plus per-area
    RBAC permission slugs (mobility.view for reads, mobility[.area].manage for
    mutations) seeded by supabase/migrations/20260621090000_mobility_rbac.sql.

    NOTE: This fragment is kept SEPARATE to avoid clobbering the large master
    contract. Merge these `paths:` and `components:` into the master
    `contracts/openapi.yaml` paths block when integrating. Same style/auth/component
    conventions as contracts/voting.openapi.yaml.

servers:
  - url: /api/finance
    description: Go backend (Gin) — transport / mobility module

security:
  - bearerAuth: []

tags:
  - name: mobility-customer
    description: Rider-facing ride-hailing endpoints (/mobility/*)
  - name: mobility-driver
    description: Driver-facing endpoints (/driver/*)
  - name: mobility-admin
    description: Admin control plane (/admin/transport/*) — RBAC-gated, audited
  - name: car-hire
    description: Car hire mode (FeatureTransportModesEnabled)
  - name: parcel
    description: Parcel delivery mode (FeatureTransportModesEnabled)
  - name: bus
    description: Bus booking mode (FeatureTransportModesEnabled)
  - name: towing
    description: Towing / roadside mode (FeatureTransportModesEnabled)
  - name: movers
    description: Movers (bid-based) mode (FeatureTransportModesEnabled)
  - name: event-transport
    description: Event transport mode (FeatureTransportModesEnabled)
  - name: business-logistics
    description: Business logistics mode (FeatureTransportModesEnabled)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: Globally unique key per financial mutation (prevents duplicate retries / double charge).
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string }
    TripIdParam:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Trip id.
  schemas:
    Money: { type: integer, format: int64, description: Amount in kobo (minor units) }
    LatLng:
      type: object
      properties:
        lat: { type: number }
        lng: { type: number }
    Error:
      type: object
      properties:
        error: { type: string }
    Ok:
      type: object
      description: Generic success envelope. Most handlers wrap the payload in a `data` key or a named key (trip/offers/schedules/…).
      additionalProperties: true

paths:
  # ═══════════════════════════════════════════════════════════════════════════
  # CUSTOMER — Ride-hailing (/mobility/*)   [FeatureTransportEnabled]
  # ═══════════════════════════════════════════════════════════════════════════
  /mobility/ws:
    get:
      tags: [mobility-customer]
      summary: Real-time trip tracking WebSocket (rider/driver channel)
      description: Upgrades to a WebSocket; driver GPS is snapped to road and fanned out to rider + driver via Redis pub/sub.
      responses: { '101': { description: Switching Protocols (WS upgrade) }, '401': { description: Not authenticated } }
  /mobility/trips/{id}/track:
    post:
      tags: [mobility-customer]
      summary: Ingest a driver GPS position for a trip
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Accepted }, '401': { description: Not authenticated } }
  /mobility/home:
    get:
      tags: [mobility-customer]
      summary: Mobility home (wallet balance, active trip, saved/recent places, quick tiles)
      responses: { '200': { description: Home payload }, '401': { description: Not authenticated } }
  /mobility/config/pricing:
    get:
      tags: [mobility-customer]
      summary: Server-owned pricing config (fare floors/ceilings/commission) for a service type + zone
      parameters:
        - { name: service_type, in: query, schema: { type: string } }
        - { name: zone, in: query, schema: { type: string } }
      responses: { '200': { description: Pricing config }, '401': { description: Not authenticated } }
  /mobility/rides/estimate:
    post:
      tags: [mobility-customer]
      summary: Estimate fare/distance/duration for a ride (no money moves)
      responses: { '200': { description: Estimate }, '401': { description: Not authenticated } }
  /mobility/rides/request:
    post:
      tags: [mobility-customer]
      summary: Request a ride (escrows fare) — money mutation
      description: Money mutation — escrows the fare and posts balanced ledger entries. Requires an Idempotency-Key.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Trip created }
        '401': { description: Not authenticated }
        '402': { description: Insufficient wallet balance }
        '422': { description: Offer out of allowed range / validation error }
  /mobility/rides/active:
    get:
      tags: [mobility-customer]
      summary: Get the caller's active trip (or null)
      responses: { '200': { description: Active trip or null }, '401': { description: Not authenticated } }
  /mobility/rides/{id}/offer:
    post:
      tags: [mobility-customer]
      summary: Rider makes/updates a fare offer (negotiation)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Fare offer }, '401': { description: Not authenticated }, '422': { description: Offer out of bounds } }
  /mobility/rides/{id}/accept-counter:
    post:
      tags: [mobility-customer]
      summary: Rider accepts a driver's counter (re-escrows delta) — money mutation
      description: Money mutation — re-escrows the fare delta. Requires an Idempotency-Key (idempotent).
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Updated trip }, '401': { description: Not authenticated } }
  /mobility/rides/{id}/cancel:
    post:
      tags: [mobility-customer]
      summary: Cancel a ride (refunds escrow per policy)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Cancelled trip }, '401': { description: Not authenticated } }
  /mobility/rides/{id}:
    get:
      tags: [mobility-customer]
      summary: Get a trip by id
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Trip }, '401': { description: Not authenticated }, '404': { description: Not found } }
  /mobility/rides/{id}/share:
    post:
      tags: [mobility-customer]
      summary: Generate a share link for a trip
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Share link }, '401': { description: Not authenticated } }
  /mobility/rides/{id}/sos:
    post:
      tags: [mobility-customer]
      summary: Trigger an SOS safety incident on a trip
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Incident opened }, '401': { description: Not authenticated } }
  /mobility/rides/{id}/rate:
    post:
      tags: [mobility-customer]
      summary: Rate a completed trip (tip is a money mutation)
      description: Rating + optional tip. When a tip is present this is a money mutation — requires an Idempotency-Key.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Rating }, '401': { description: Not authenticated } }
  /mobility/parcel/{id}/rate:
    post:
      tags: [mobility-customer]
      summary: Rate the courier on a delivered parcel (tip is a money mutation)
      description: Sender rates the courier; optional tip (100% to courier). Requires an Idempotency-Key when a tip is present.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Rating }, '401': { description: Not authenticated }, '403': { description: Not the sender / not delivered } }
  /mobility/towing/{id}/rate:
    post:
      tags: [mobility-customer]
      summary: Rate the operator on a completed tow (tip is a money mutation)
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Rating }, '401': { description: Not authenticated }, '403': { description: Not the customer / not completed } }
  /mobility/movers/{id}/rate:
    post:
      tags: [mobility-customer]
      summary: Rate the provider on a completed move (tip is a money mutation)
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Rating }, '401': { description: Not authenticated }, '403': { description: Not the customer / not completed } }
  /mobility/bus/schedules/{id}/seats:
    get:
      tags: [mobility-customer]
      summary: Seat map for a bus schedule
      description: Returns total seats plus the set of taken seat numbers so the client can render seat selection.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200':
          description: '{ schedule_id, total_seats, taken: [int], available }'
        '401': { description: Not authenticated }
  /mobility/history:
    get:
      tags: [mobility-customer]
      summary: Trip history
      responses: { '200': { description: Trip list }, '401': { description: Not authenticated } }
  /mobility/profile:
    get:
      tags: [mobility-customer]
      summary: Get mobility profile
      responses: { '200': { description: Profile }, '401': { description: Not authenticated } }
    put:
      tags: [mobility-customer]
      summary: Update mobility profile
      responses: { '200': { description: Profile }, '401': { description: Not authenticated } }
  /mobility/trusted-contacts:
    get:
      tags: [mobility-customer]
      summary: List trusted safety contacts
      responses: { '200': { description: Contacts }, '401': { description: Not authenticated } }
    post:
      tags: [mobility-customer]
      summary: Add a trusted safety contact
      responses: { '200': { description: Created contact }, '401': { description: Not authenticated } }
  /mobility/trusted-contacts/{id}:
    delete:
      tags: [mobility-customer]
      summary: Delete a trusted safety contact
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '204': { description: Deleted }, '401': { description: Not authenticated } }

  # ═══════════════════════════════════════════════════════════════════════════
  # DRIVER — Ride-hailing (/driver/*)   [FeatureTransportEnabled]
  # ═══════════════════════════════════════════════════════════════════════════
  /driver/onboarding/submit:
    post:
      tags: [mobility-driver]
      summary: Submit driver onboarding
      responses: { '200': { description: Driver profile }, '401': { description: Not authenticated } }
  /driver/documents:
    post:
      tags: [mobility-driver]
      summary: Upload/replace a driver document
      responses: { '200': { description: Updated profile }, '401': { description: Not authenticated } }
  /driver/vehicle:
    post:
      tags: [mobility-driver]
      summary: Add a driver vehicle
      responses: { '200': { description: Updated profile }, '401': { description: Not authenticated } }
  /driver/me:
    get:
      tags: [mobility-driver]
      summary: Get the authenticated driver's profile
      responses: { '200': { description: Driver profile }, '401': { description: Not authenticated } }
  /driver/status:
    patch:
      tags: [mobility-driver]
      summary: Set driver online/offline status (+ optional location)
      responses: { '200': { description: Updated profile }, '401': { description: Not authenticated }, '403': { description: Driver not approved } }
  /driver/requests:
    get:
      tags: [mobility-driver]
      summary: List ride requests offered to the driver
      responses: { '200': { description: Requests }, '401': { description: Not authenticated } }
  /driver/requests/{id}/accept:
    post:
      tags: [mobility-driver]
      summary: Accept a ride request — money mutation
      description: Money mutation (binds escrow to driver). Requires an Idempotency-Key.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Trip }, '401': { description: Not authenticated } }
  /driver/requests/{id}/counter:
    post:
      tags: [mobility-driver]
      summary: Driver counters a rider's fare offer
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Fare offer }, '401': { description: Not authenticated } }
  /driver/trips/{id}/arrive:
    post:
      tags: [mobility-driver]
      summary: Mark driver arrived at pickup
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Trip }, '401': { description: Not authenticated } }
  /driver/trips/{id}/verify-pin:
    post:
      tags: [mobility-driver]
      summary: Verify the rider's 4-digit trip PIN
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Trip }, '401': { description: Not authenticated }, '422': { description: Invalid PIN } }
  /driver/trips/{id}/start:
    post:
      tags: [mobility-driver]
      summary: Start the trip
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Trip }, '401': { description: Not authenticated } }
  /driver/trips/{id}/complete:
    post:
      tags: [mobility-driver]
      summary: Complete the trip (settles driver split) — money mutation
      description: >
        Money mutation — releases escrow and settles the driver split via the
        settlement service. Idempotency-Key recommended; backend treats completion
        as idempotent.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Trip }, '401': { description: Not authenticated } }
  /driver/earnings:
    get:
      tags: [mobility-driver]
      summary: Driver earnings summary
      responses: { '200': { description: Earnings }, '401': { description: Not authenticated } }
  /driver/sos:
    post:
      tags: [mobility-driver]
      summary: Driver SOS safety incident
      responses: { '200': { description: Incident }, '401': { description: Not authenticated } }

  # ═══════════════════════════════════════════════════════════════════════════
  # ADMIN — control plane (/admin/transport/*)   [FeatureTransportEnabled]
  #   RBAC: mobility.view (GET) / mobility[.area].manage (mutations). Audited.
  # ═══════════════════════════════════════════════════════════════════════════
  /admin/transport/dashboard:
    get: { tags: [mobility-admin], summary: Admin dashboard, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
  /admin/transport/drivers:
    get: { tags: [mobility-admin], summary: List drivers, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
  /admin/transport/drivers/{id}:
    get:
      tags: [mobility-admin]
      summary: Driver detail
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: OK }, '403': { description: Missing mobility.view } }
  /admin/transport/drivers/{id}/verification:
    patch:
      tags: [mobility-admin]
      summary: Set driver verification status
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: OK }, '403': { description: Missing mobility.ride.manage } }
  /admin/transport/vehicles:
    get: { tags: [mobility-admin], summary: List vehicles, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
  /admin/transport/vehicles/{id}/status:
    patch:
      tags: [mobility-admin]
      summary: Set vehicle status
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: OK }, '403': { description: Missing mobility.ride.manage } }
  /admin/transport/trips:
    get: { tags: [mobility-admin], summary: List trips, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
  /admin/transport/dispatch/live:
    get: { tags: [mobility-admin], summary: Live dispatch board, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
  /admin/transport/dispatch/{trip_id}/assign:
    post:
      tags: [mobility-admin]
      summary: Manually assign a trip to a driver
      parameters: [{ name: trip_id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '403': { description: Missing mobility.ride.manage } }
  /admin/transport/pricing:
    get: { tags: [mobility-admin], summary: Get pricing config, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
    patch: { tags: [mobility-admin], summary: Update pricing config, responses: { '200': { description: OK }, '403': { description: Missing mobility.manage } } }
  /admin/transport/commission:
    get: { tags: [mobility-admin], summary: List commission tiers, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
  /admin/transport/commission/{tier}:
    patch:
      tags: [mobility-admin]
      summary: Update a commission tier
      parameters: [{ name: tier, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '403': { description: Missing mobility.manage } }
  /admin/transport/safety/incidents:
    get: { tags: [mobility-admin], summary: List safety incidents, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
  /admin/transport/safety/incidents/{id}:
    patch:
      tags: [mobility-admin]
      summary: Update a safety incident
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: OK }, '403': { description: Missing mobility.manage } }
  /admin/transport/reports/summary:
    get: { tags: [mobility-admin], summary: Reports summary, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }
  /admin/transport/audit:
    get: { tags: [mobility-admin], summary: Admin audit feed, responses: { '200': { description: OK }, '403': { description: Missing mobility.view } } }

  # ═══════════════════════════════════════════════════════════════════════════
  # CAR HIRE   [FeatureTransportModesEnabled]
  # ═══════════════════════════════════════════════════════════════════════════
  /mobility/car-hire/quote:
    post:
      tags: [car-hire]
      summary: Quote a car-hire booking (no money moves)
      responses: { '200': { description: Quote }, '401': { description: Not authenticated } }
  /mobility/car-hire/book:
    post:
      tags: [car-hire]
      summary: Book a car hire (escrows fare + deposit) — money mutation
      description: Money mutation — escrows fare + deposit. Requires an Idempotency-Key.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Booking }, '401': { description: Not authenticated }, '402': { description: Insufficient balance } }
  /mobility/car-hire:
    get:
      tags: [car-hire]
      summary: List car-hire bookings
      responses: { '200': { description: Bookings }, '401': { description: Not authenticated } }
  /mobility/car-hire/{id}:
    get:
      tags: [car-hire]
      summary: Get a car-hire booking
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Booking }, '401': { description: Not authenticated }, '404': { description: Not found } }
  /mobility/car-hire/{id}/activate:
    post:
      tags: [car-hire]
      summary: Activate (start) a car-hire booking
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Booking }, '401': { description: Not authenticated } }
  /mobility/car-hire/{id}/extend:
    post:
      tags: [car-hire]
      summary: Extend a car hire (escrows delta) — money mutation
      description: Money mutation — escrows the additional-hours delta. Requires an Idempotency-Key.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Booking }, '401': { description: Not authenticated } }
  /mobility/car-hire/{id}/complete:
    post:
      tags: [car-hire]
      summary: Complete a car hire (settle split, release deposit) — money mutation
      description: Money mutation — settles the provider split and releases the deposit. Requires an Idempotency-Key.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Booking }, '401': { description: Not authenticated } }
  /mobility/car-hire/{id}/cancel:
    post:
      tags: [car-hire]
      summary: Cancel a car-hire booking (refund per policy)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Booking }, '401': { description: Not authenticated } }

  # ═══════════════════════════════════════════════════════════════════════════
  # PARCEL DELIVERY   [FeatureTransportModesEnabled]
  # ═══════════════════════════════════════════════════════════════════════════
  /mobility/parcels/estimate:
    post:
      tags: [parcel]
      summary: Estimate a parcel delivery (no money moves)
      responses: { '200': { description: Estimate }, '401': { description: Not authenticated } }
  /mobility/parcels:
    post:
      tags: [parcel]
      summary: Book a parcel delivery (escrows fare) — money mutation
      description: Money mutation — escrows the fare. Requires an Idempotency-Key.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Parcel }, '401': { description: Not authenticated }, '402': { description: Insufficient balance } }
    get:
      tags: [parcel]
      summary: List parcels
      responses: { '200': { description: Parcels }, '401': { description: Not authenticated } }
  /mobility/parcels/{id}:
    get:
      tags: [parcel]
      summary: Get a parcel
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Parcel }, '401': { description: Not authenticated }, '404': { description: Not found } }
  /mobility/parcels/{id}/cancel:
    post:
      tags: [parcel]
      summary: Cancel a parcel (refund per policy)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Parcel }, '401': { description: Not authenticated } }
  /driver/parcels/requests:
    get:
      tags: [parcel]
      summary: Courier — list parcel requests
      responses: { '200': { description: Requests }, '401': { description: Not authenticated } }
  /driver/parcels/{id}/accept:
    post:
      tags: [parcel]
      summary: Courier — accept a parcel request — money mutation
      description: Money mutation (binds escrow to courier). Requires an Idempotency-Key.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Parcel }, '401': { description: Not authenticated } }
  /driver/parcels/{id}/verify-pickup-pin:
    post:
      tags: [parcel]
      summary: Courier — verify the sender's pickup PIN
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Parcel }, '401': { description: Not authenticated }, '422': { description: Invalid PIN } }
  /driver/parcels/{id}/picked-up:
    post:
      tags: [parcel]
      summary: Courier — mark parcel picked up
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Parcel }, '401': { description: Not authenticated } }
  /driver/parcels/{id}/verify-dropoff:
    post:
      tags: [parcel]
      summary: Courier — verify the receiver's dropoff PIN (settles on delivery)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Parcel }, '401': { description: Not authenticated }, '422': { description: Invalid PIN } }

  # ═══════════════════════════════════════════════════════════════════════════
  # BUS BOOKING   [FeatureTransportModesEnabled]
  # ═══════════════════════════════════════════════════════════════════════════
  /mobility/bus/routes:
    get:
      tags: [bus]
      summary: Search bus routes
      parameters:
        - { name: origin, in: query, schema: { type: string } }
        - { name: dest, in: query, schema: { type: string } }
