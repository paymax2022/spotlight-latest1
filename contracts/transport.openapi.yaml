  # ═══════════════════════════════════════════════════════════════════════════
  # EVENT TRANSPORT   [FeatureTransportModesEnabled]
  #   NOTE: list is GET /mobility/events/transport?event_id=… (query param, NOT
  #   a path segment) so the static /events/transport tree stays unambiguous.
  # ═══════════════════════════════════════════════════════════════════════════
  /mobility/events/transport:
    get:
      tags: [event-transport]
      summary: List event-transport offers for an event
      parameters:
        - { name: event_id, in: query, required: true, schema: { type: string } }
      responses: { '200': { description: Offers }, '400': { description: event_id required }, '401': { description: Not authenticated } }
    post:
      tags: [event-transport]
      summary: Create an event-transport offer (organizer) — money mutation
      description: Organizer creates an offer. Carries an Idempotency-Key (escrow/settlement-bearing flow).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Offer }, '401': { description: Not authenticated } }
  /mobility/events/transport/{id}:
    get:
      tags: [event-transport]
      summary: Get an event-transport offer
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Offer }, '401': { description: Not authenticated }, '404': { description: Not found } }
  /mobility/events/transport/{id}/book:
    post:
      tags: [event-transport]
      summary: Book seats on an offer (escrow → settle organizer → QR) — money mutation
      description: Money mutation — escrows the fare and settles the organizer on issue. Requires an Idempotency-Key.
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Booking }, '401': { description: Not authenticated }, '409': { description: Offer full } }
  /mobility/events/bookings:
    get:
      tags: [event-transport]
      summary: List the caller's event-transport bookings
      responses: { '200': { description: Bookings }, '401': { description: Not authenticated } }
  /mobility/events/bookings/{id}/cancel:
    post:
      tags: [event-transport]
      summary: Cancel an event-transport booking (refund per policy)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Booking }, '401': { description: Not authenticated } }
  /driver/events/validate:
    post:
      tags: [event-transport]
      summary: Organizer/driver — validate an event-transport ticket QR
      responses: { '200': { description: Validation result }, '401': { description: Not authenticated } }

