openapi: 3.1.0
info:
  title: Paymax × Spotlight Voting API (drift-closing fragment)
  version: 1.0.0
  description: >
    Standalone OpenAPI fragment documenting the live-but-undocumented voting
    endpoints (wallet-paid votes, open-mic Paystack pay flow, and admin vote
    reversal). These routes ship in the Next.js app under `frontend-web/app/api/`
    but were missing from the master `contracts/openapi.yaml`.

    All monetary amounts are integers in minor units (kobo). Every financial
    mutation requires an `Idempotency-Key` (sent either as a header or, for the
    legacy v2 wallet route, as an `idempotencyKey` body field — noted per path)
    and posts balanced double-entry ledger entries + an audit event.

    NOTE: This fragment is kept separate to avoid clobbering the large master
    contract. Merge these `paths:` and `components:` into the master
    `contracts/openapi.yaml` when integrating. Same style/auth/component
    conventions as `contracts/invest.openapi.yaml`.

servers:
  - url: /api
    description: Next.js route handlers (frontend-web) — voting module

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: Globally unique key per financial mutation (prevents duplicate retries / double charge).
  schemas:
    Money: { type: integer, format: int64, description: Amount in kobo (minor units) }
    Error:
      type: object
      properties:
        error: { type: string }
    # ── /api/v2/votes/wallet ────────────────────────────────────────────────
    V2WalletVoteRequest:
      type: object
      required: [contestId, contestantId, voteCount, costKobo, idempotencyKey]
      properties:
        contestId: { type: string }
        contestantId: { type: string }
        voteCount: { type: integer, minimum: 1 }
        costKobo: { $ref: '#/components/schemas/Money' }
        idempotencyKey:
          type: string
          description: >
            Idempotency key for this wallet mutation. This legacy v2 route accepts
            the key in the JSON body (not the Idempotency-Key header).
    V2WalletVoteResponse:
      type: object
      properties:
        success: { type: boolean }
        votesAdded: { type: integer }
        newTotalVotes: { type: integer }
        costKobo: { $ref: '#/components/schemas/Money' }
    # ── /api/votes/paid/wallet ──────────────────────────────────────────────
    PaidWalletVoteRequest:
      type: object
      required: [contestId, contestantId, packageId, voterEmail, voterName]
      properties:
        contestId: { type: string }
        contestantId: { type: string }
        packageId:
          type: string
          description: Vote package id. Price is resolved server-side; client-supplied price is never trusted.
        voterEmail: { type: string, format: email }
        voterName: { type: string }
    PaidWalletVoteResponse:
      type: object
      properties:
        success: { type: boolean }
        transactionId: { type: string }
        paymentReference: { type: string }
        votesCredited: { type: integer }
        amountKobo: { $ref: '#/components/schemas/Money' }
    # ── /api/open-mic/votes/pay/initiate ────────────────────────────────────
    OpenMicPayInitiateRequest:
      type: object
      required: [contestId, submissionId, votes, votePriceNgn]
      properties:
        contestId: { type: string }
        submissionId: { type: string }
        stageName: { type: string }
        votes: { type: integer, minimum: 1 }
        votePriceNgn: { type: number, minimum: 1, description: Price per vote in naira (whole currency units). }
    OpenMicPayInitiateResponse:
      type: object
      properties:
        reference: { type: string, description: Paystack payment reference to use on the verify call. }
        amountKobo: { $ref: '#/components/schemas/Money' }
        amountNgn: { type: number }
        email: { type: string, format: email }
        publicKey: { type: string, description: Paystack public key for the inline checkout. }
        metadata:
          type: object
          properties:
            contestId: { type: string }
            submissionId: { type: string }
            stageName: { type: string }
            votes: { type: integer }
            votePriceNgn: { type: number }
            userId: { type: string }
    # ── /api/open-mic/votes/pay/verify ──────────────────────────────────────
    OpenMicPayVerifyRequest:
      type: object
      required: [reference, contestId, submissionId, votes]
      properties:
        reference: { type: string, description: Paystack reference returned by initiate. }
        contestId: { type: string }
        submissionId: { type: string }
        votes: { type: integer, minimum: 1 }
    OpenMicPayVerifyResponse:
      type: object
      properties:
        success: { type: boolean }
        newCount: { type: integer, description: Updated vote count for the submission after crediting. }
    # ── /api/admin/voting/votes/{voteId}/reverse ────────────────────────────
    VoteReverseRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, description: Audit reason for the reversal (>= 5 chars). }
    VoteReverseResponse:
      type: object
      properties:
        success: { type: boolean }
        voteId: { type: string }
        reversedQuantity: { type: integer }
    # ── Contest stages & eviction ────────────────────────────────────────────
    EvictionRequest:
      type: object
      required: [stage_number]
      properties:
        stage_number: { type: integer, minimum: 1, description: Stage number to trigger evictions for }
        eviction_percentage: { type: integer, minimum: 1, maximum: 99, default: 20, description: Bottom percentage to evict }
        grace_period_hours: { type: integer, minimum: 1, default: 24, description: Hours before eviction is finalized }
    EvictionResponse:
      type: object
      properties:
        contestant_id: { type: string }
        vote_count: { type: integer }
        eviction_rank: { type: integer }
        eviction_id: { type: string }
        evicted_at: { type: string, format: date-time }
        grace_period_end: { type: string, format: date-time }
    SaveRequest:
      type: object
      required: [eviction_id]
      properties:
        eviction_id: { type: string }
        reason: { type: string, description: Reason for saving the contestant }
    SaveResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        save_record_id: { type: string }
    ExtendGracePeriodRequest:
      type: object
      required: [eviction_id]
      properties:
        eviction_id: { type: string }
        additional_hours: { type: integer, minimum: 1, default: 24, description: Additional hours to extend }
    StageContestant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        photo_url: { type: string }
        vote_count: { type: integer }
        eviction_status: { type: string, enum: [none, pending, saved] }
        eviction_template: { type: string, enum: [normal, evicted, saved] }
        eviction_id: { type: string, nullable: true }
        grace_period_end: { type: string, format: date-time, nullable: true }
    AdminVoteRequest:
      type: object
      required: [contestant_id, vote_quantity]
      properties:
        contestant_id: { type: string }
        vote_quantity: { type: integer, minimum: 1, description: Number of votes to cast (admin unlimited) }

paths:
  # ── Wallet-paid votes (in-app wallet debit, no Paystack redirect) ──────────
  /v2/votes/wallet:
    post:
      summary: Cast votes paid from the in-app wallet (v2 bridge)
      description: >
        Debits the user's wallet via the Go vote-bridge endpoint, then credits
        votes through the legacy voting service. Feature-flagged behind
        FEATURE_VOTE_BRIDGE_ENABLED. **Financial mutation — requires an
        idempotency key**; this legacy route reads it from the `idempotencyKey`
        body field rather than the Idempotency-Key header. Duplicate keys return
        the cached result (no double debit).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/V2WalletVoteRequest' }
      responses:
        '200':
          description: Votes credited (or cached idempotent result returned)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/V2WalletVoteResponse' }
        '400':
          description: Missing/invalid body field (incl. missing idempotencyKey)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { description: Not authenticated }
        '403': { description: Wallet voting not enabled, or KYC gate failed }
  /votes/paid/wallet:
    post:
      summary: Cast votes paid from the in-app wallet (atomic debit)
      description: >
        Debits the authenticated user's wallet via the `debit_wallet_atomic` RPC
        (balance check + tier daily cap), writes a double-entry ledger entry,
        records the vote transaction, credits votes, and appends an audit log.
        **Financial mutation — requires an `Idempotency-Key` header.** On a
        transaction-record failure after the debit, the debit is reversed
        best-effort before returning 500.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaidWalletVoteRequest' }
      responses:
        '201':
          description: Votes credited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaidWalletVoteResponse' }
        '400':
          description: Missing Idempotency-Key header, missing body field, or paid voting disabled
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { description: Not authenticated }
        '402': { description: Insufficient wallet balance }
        '403': { description: Tier daily limit exceeded }
        '404': { description: Vote package not found or inactive }
        '500': { description: Failed to record vote transaction (wallet debit reversed) }
        '503': { description: Wallet feature not available }
  # ── Open-mic Paystack pay flow ─────────────────────────────────────────────
  /open-mic/votes/pay/initiate:
    post:
      summary: Initiate a Paystack payment for open-mic votes
      description: >
        Computes the kobo amount (votes × votePriceNgn) and returns the Paystack
        reference + public key for inline checkout. No money moves yet; the
        wallet/ledger mutation happens on verify. The returned `reference` is the
        idempotency anchor for the subsequent verify call (one credit per
        reference).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenMicPayInitiateRequest' }
      responses:
        '200':
          description: Payment initiated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenMicPayInitiateResponse' }
        '400':
          description: Missing/invalid body field
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { description: Not authenticated }
  /open-mic/votes/pay/verify:
    post:
      summary: Verify a Paystack payment and credit open-mic votes
      description: >
        Verifies the payment with Paystack and credits votes for the submission.
        **Financial mutation — idempotent on the Paystack `reference`.** A
        duplicate verify of an already-credited reference returns the cached
        success result (and must NOT double-credit). Vote is only cast if
        Paystack confirms the charge succeeded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenMicPayVerifyRequest' }
      responses:
        '200':
          description: Payment verified, votes credited (or cached idempotent success returned)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenMicPayVerifyResponse' }
        '400':
          description: Missing/invalid body field
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { description: Not authenticated }
        '402': { description: Payment not confirmed by Paystack }
  # ── Admin vote reversal ────────────────────────────────────────────────────
  /admin/voting/votes/{voteId}/reverse:
    post:
      summary: Reverse a vote (admin)
      description: >
        Marks a confirmed vote as reversed, decrements running totals, and
        appends an audit log. Requires the `votes:manage` permission. For a
        wallet-paid vote this is a **financial mutation that refunds the wallet**
        via a reversing ledger entry — it requires an `Idempotency-Key` and is
        idempotent (re-running a reversal must NOT refund twice). Corrections are
        reversing entries only; ledger entries are never mutated.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - name: voteId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoteReverseRequest' }
      responses:
        '200':
          description: Vote reversed (and wallet refunded if it was wallet-paid)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoteReverseResponse' }
        '400':
          description: Reason missing/too short, or vote already reversed
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { description: Not authenticated }
        '403': { description: Missing votes:manage permission }
        '404': { description: Vote not found }
  # ── Contest stage eviction management ──────────────────────────────────────
  /v1/connect/contests/{id}/stages/{stageNum}/evict:
    post:
      summary: Trigger evictions for a stage (admin only)
      description: >
        Marks the bottom N% (default 20%) of contestants for eviction based on vote count.
        Contestants are given a grace period (default 24 hours) before eviction is finalized.
        Judges/admins can save contestants during the grace period.
        Requires `contests:manage` permission.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Contest ID
        - name: stageNum
          in: path
          required: true
          schema: { type: integer }
          description: Stage number
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvictionRequest' }
      responses:
        '200':
          description: Evictions triggered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EvictionResponse' }
                  message: { type: string }
        '400':
          description: Invalid stage number or eviction percentage
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { description: Not authenticated }
        '403': { description: Missing contests:manage permission }
        '404': { description: Contest or stage not found }
  /v1/connect/contests/{id}/save:
    post:
      summary: Save a contestant from eviction (judge/admin)
      description: >
        Saves a contestant marked for eviction during the grace period.
        Judges can save one contestant per stage; admins can save unlimited.
        Requires `contests:manage` or `contests:judge` permission.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Contest ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveRequest' }
      responses:
        '200':
          description: Contestant saved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveResponse' }
        '400':
          description: Judge already saved one contestant this stage, or eviction not found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { description: Not authenticated }
        '403': { description: Missing judge/manage permission }
  /v1/connect/contests/{id}/extend-grace-period:
    post:
      summary: Extend grace period for evictions (admin only)
      description: >
        Extends the grace period for evictions before finalization.
        Only admins can extend grace periods.
        Requires `contests:manage` permission.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Contest ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtendGracePeriodRequest' }
      responses:
        '200':
          description: Grace period extended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveResponse' }
        '400':
          description: Eviction not found or already resolved
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { description: Not authenticated }
        '403': { description: Missing contests:manage permission }
  /v1/connect/contests/{id}/stages/{stageNum}/finalize-evictions:
    post:
      summary: Finalize evictions after grace period (admin only)
      description: >
        Finalizes evictions for a stage after the grace period has ended.
        Removes unsaved contestants from the stage.
        Requires `contests:manage` permission.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Contest ID
        - name: stageNum
          in: path
          required: true
          schema: { type: integer }
          description: Stage number
      responses:
        '200':
          description: Evictions finalized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveResponse' }
        '401': { description: Not authenticated }
        '403': { description: Missing contests:manage permission }
        '404': { description: Contest or stage not found }
  /v1/connect/contests/{id}/stages/{stageNum}/contestants:
    get:
      summary: Get contestants in a stage with eviction status (public)
      description: >
        Lists all contestants in a specific stage, including eviction status
        and visual template information. Public endpoint.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Contest ID
        - name: stageNum
          in: path
          required: true
          schema: { type: integer }
          description: Stage number
      responses:
        '200':
          description: List of contestants in the stage
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StageContestant' }
        '404': { description: Contest or stage not found }
  /v1/connect/contests/{id}/evictions:
    get:
      summary: Get pending evictions for a contest (admin/judge)
      description: >
        Lists all pending evictions for a contest, optionally filtered by stage.
        Requires `contests:manage` or `contests:judge` permission.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Contest ID
        - name: stage
          in: query
          schema: { type: integer }
          description: Optional stage number filter
      responses:
        '200':
          description: List of pending evictions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        contestant_id: { type: string }
                        contestant_name: { type: string }
                        stage_number: { type: integer }
                        vote_count: { type: integer }
                        eviction_rank: { type: integer }
                        grace_period_ends_at: { type: string, format: date-time }
                        status: { type: string, enum: [pending, saved, finalized] }
                        save_count: { type: integer }
                        can_be_saved: { type: boolean }
        '401': { description: Not authenticated }
        '403': { description: Missing judge/manage permission }
        '404': { description: Contest not found }
  /v1/connect/contests/{id}/admin-vote:
    post:
      summary: Cast unlimited admin votes (admin only)
      description: >
        Allows admins to cast unlimited votes without payment for contestants.
        Votes are recorded without ledger entries or payment processing.
        Requires `contests:manage` permission.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Contest ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminVoteRequest' }
      responses:
        '201':
          description: Admin vote cast successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      contest_id: { type: string }
                      voter_id: { type: string }
                      contestant_id: { type: string }
                      quantity: { type: integer }
                      created_at: { type: string, format: date-time }
        '401': { description: Not authenticated }
        '403': { description: Missing contests:manage permission }
        '404': { description: Contest not found }
