      properties: { id: { type: string }, author: { type: string }, fromSupport: { type: boolean }, body: { type: string }, createdAt: { type: string } }
    CreateTicketInput:
      type: object
      properties: { subject: { type: string }, category: { type: string, enum: [MEMBERSHIP, PAYMENT, TECHNICAL, OTHER] }, message: { type: string } }
      required: [subject, category, message]
    AdminKpis:
      type: object
      properties: { totalMembers: { type: integer }, activeMembers: { type: integer }, pendingApprovals: { type: integer }, unpaidMembers: { type: integer }, duesCollectedKobo: { $ref: '#/components/schemas/Kobo' }, duesOutstandingKobo: { $ref: '#/components/schemas/Kobo' } }
    AdminApplicationSummary:
      type: object
      properties: { id: { type: string }, applicantName: { type: string }, category: { type: string }, chapter: { type: string }, submittedAt: { type: string }, status: { type: string, enum: [PENDING, INFO_REQUESTED] }, jurisdiction: { type: string, enum: [CHAPTER, NATIONAL] }, paid: { type: boolean } }
    AdminApplication:
      allOf:
        - { $ref: '#/components/schemas/AdminApplicationSummary' }
        - type: object
          properties: { email: { type: string }, phone: { type: string }, profession: { type: string }, sponsor: { type: [string, 'null'] }, documents: { type: array, items: { type: object } }, registrationFeeKobo: { $ref: '#/components/schemas/Kobo' }, slaHoursLeft: { type: integer } }
    FinanceSummary:
      type: object
      properties: { collectedKobo: { $ref: '#/components/schemas/Kobo' }, outstandingKobo: { $ref: '#/components/schemas/Kobo' }, paidMembers: { type: integer }, unpaidMembers: { type: integer }, byChapter: { type: array, items: { type: object } }, byCategory: { type: array, items: { type: object } }, offlinePending: { type: integer } }
    OfflinePayment:
      type: object
      properties: { id: { type: string }, memberName: { type: string }, memberId: { type: string }, amountKobo: { $ref: '#/components/schemas/Kobo' }, method: { type: string }, reference: { type: string }, forItem: { type: string }, submittedAt: { type: string }, status: { type: string, enum: [PENDING, APPROVED, REJECTED] } }
    ImportPreview:
      type: object
      properties: { fileName: { type: string }, total: { type: integer }, valid: { type: integer }, duplicates: { type: integer }, invalid: { type: integer }, rows: { type: array, items: { type: object } } }
    ImportResult:
      type: object
      properties: { imported: { type: integer }, skipped: { type: integer }, invited: { type: integer }, batchId: { type: string } }
    AdminAccess:
      type: object
      properties:
        isAdmin: { type: boolean }
        role: { $ref: '#/components/schemas/AdminRole' }
        roleLabel: { type: string }
        jurisdiction: { type: string, enum: [CHAPTER, NATIONAL, GLOBAL] }
        can: { type: object, properties: { approveMembers: { type: boolean }, manageMembers: { type: boolean }, manageFinance: { type: boolean }, importMembers: { type: boolean } } }
    OrgDraft:
      type: object
      properties:
        name: { type: string }
        acronym: { type: string }
        category: { type: string }
        description: { type: string }
        logoUri: { type: [string, 'null'] }
        groupType: { $ref: '#/components/schemas/GroupType' }
        approvalRule: { type: string, enum: [AUTO, ADMIN, CHAPTER_THEN_NATIONAL, PAYMENT_FIRST] }
        registrationFeeKobo: { $ref: '#/components/schemas/Kobo' }
        chapters: { type: array, items: { type: object } }
        categories: { type: array, items: { type: object } }
        restrictions: { type: object }
        acceptedTerms: { type: boolean }
      required: [name, category, groupType, acceptedTerms]
    PublishResult:
      type: object
      properties: { organisationId: { type: string }, name: { type: string } }
