openapi: 3.1.0
info:
  title: Paymax × Spotlight — Associations (Group Membership) API
  version: 1.0.0
  description: >
    Group / Association membership management consumed by the mobile app's live
    data layer (src/features/association/api/*.api.ts). Bare paths are served at
    the app base URL (EXPO_PUBLIC_API_BASE_URL) exactly as the client calls them,
    e.g. GET /associations/me/dashboard. Set EXPO_PUBLIC_ASSOCIATION_USE_MOCK=false
    to switch the client from mock to these endpoints.

    Conventions: every request carries a Supabase Bearer JWT; every state-changing
    request (POST/PUT/PATCH/DELETE) requires an Idempotency-Key header. All monetary
    amounts are integers in minor units (kobo). Standalone module spec (cf.
    contracts/doctor.openapi.yaml, invest.openapi.yaml) to be merged into
    contracts/openapi.yaml. Spec-first per CLAUDE.md.

servers:
  - url: /
    description: frontend-web API base (EXPO_PUBLIC_API_BASE_URL)

security:
  - bearerAuth: []

tags:
  - name: Discovery
  - name: Join
  - name: Member
  - name: Directory
  - name: Dues
  - name: Engagement
  - name: Meetings
  - name: Tasks
  - name: Documents
  - name: Chat
  - name: AI Notes
  - name: Community
  - name: Settings
  - name: Support
  - name: Admin

paths:
  # ── Discovery (B) ───────────────────────────────────────────────────────────
  /associations:
    get:
      tags: [Discovery]
      summary: Search / list organisations
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Organisation summaries
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OrganisationSummary' } } } }
    post:
      tags: [Admin]
      summary: Publish a new organisation (creation wizard)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrgDraft' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/PublishResult' } } }
  /associations/orgs/{id}:
    # Served at /orgs/{id} rather than a bare /{id}: gin cannot route a root path
    # param alongside the many static siblings (/me, /members, /meetings, …).
    get:
      tags: [Discovery]
      summary: Organisation detail
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Organisation' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Join (B) ──────────────────────────────────────────────────────────────
  /associations/invites/validate:
    post:
      tags: [Join]
      summary: Validate an invite code
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { code: { type: string } }, required: [code] } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CodeValidation' } } } } }
  /associations/access-codes/validate:
    post:
      tags: [Join]
      summary: Validate a group/chapter access code
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { code: { type: string } }, required: [code] } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CodeValidation' } } } } }
  /associations/apply:
    # Served at /apply rather than /members/apply: /members is a static collection
    # route with a /{id} param sibling, which conflicts with /members/apply in gin.
    post:
      tags: [Join]
      summary: Submit a membership application
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JoinDraft' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationResult' } } } } }

  # ── Member self (C, D, E, G) ────────────────────────────────────────────────
  /associations/me/dashboard:
    get: { tags: [Member], summary: Member dashboard, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MemberDashboard' } } } } } }
  /associations/me/card:
    get: { tags: [Member], summary: Digital membership card, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MembershipCard' } } } } } }
  /associations/me/profile:
    get: { tags: [Member], summary: My profile, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MyProfile' } } } } } }
    put:
      tags: [Member]
      summary: Update my profile
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileEdit' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MyProfile' } } } } }
  /associations/me/privacy:
    get: { tags: [Member], summary: Privacy settings, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PrivacySettings' } } } } } }
    put:
      tags: [Member]
      summary: Update privacy settings
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PrivacySettings' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PrivacySettings' } } } } }
  /associations/me/activity:
    get: { tags: [Member], summary: My activity history, responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ActivityEntry' } } } } } } }
  /associations/me/dues:
    get: { tags: [Dues], summary: My dues summary, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DuesSummary' } } } } } }
  /associations/me/admin-access:
    get: { tags: [Admin], summary: My admin role + capabilities (RBAC), responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccess' } } } } } }
  /associations/me/notification-prefs:
    get: { tags: [Settings], summary: Notification preferences, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPrefs' } } } } } }
    put:
      tags: [Settings]
      summary: Update notification preferences
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPrefs' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPrefs' } } } } }
  /associations/me/security:
    get: { tags: [Settings], summary: Security settings, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SecuritySettings' } } } } } }
    put:
      tags: [Settings]
      summary: Update security settings
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecuritySettings' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SecuritySettings' } } } } }
  /associations/me/devices:
    get: { tags: [Settings], summary: Active sessions/devices, responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Device' } } } } } } }
    post:
      tags: [Settings]
      summary: Register the caller's device
      description: >-
        assoc_devices had no writer, so GET /me/devices always returned an empty
        list and DELETE always failed on zero rows affected. Idempotent on
        (user, name, platform).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/CreatedId' } }
  /associations/me/devices/{id}:
    delete:
      tags: [Settings]
      summary: Revoke a device session
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ── Directory (F) ───────────────────────────────────────────────────────────
  /associations/members:
    get:
      tags: [Directory]
      summary: Member directory
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: chapterId, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/MemberStatus' } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MemberProfileSummary' } } } } } }
  /associations/members/{id}:
    get:
      tags: [Directory]
      summary: Member profile (respects privacy)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MemberProfile' } } } }, '404': { $ref: '#/components/responses/NotFound' } }

  # ── Dues & payments (G) ───────────────────────────────────────────────────
  /associations/dues/{invoiceId}/pay:
    post:
      tags: [Dues]
      summary: Pay a dues invoice (money mutation)
      description: Posts balanced double-entry ledger entries and emits an audit event. Requires Idempotency-Key.
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { method: { $ref: '#/components/schemas/PaymentMethod' } }, required: [method] } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PayInvoiceResult' } } } } }
  /associations/receipts/{receiptId}:
    get:
      tags: [Dues]
      summary: Payment receipt (with revenue split)
      parameters: [ { name: receiptId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentReceipt' } } } } }

  # ── Announcements & notifications (J, X) ─────────────────────────────────────
  /associations/announcements:
    get: { tags: [Engagement], summary: Announcement feed, responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AnnouncementSummary' } } } } } } }
  /associations/announcements/{id}:
    get:
      tags: [Engagement]
      summary: Announcement detail
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Announcement' } } } } }
  /associations/announcements/{id}/acknowledge:
    post:
      tags: [Engagement]
      summary: Acknowledge an announcement
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /associations/notifications:
    get: { tags: [Engagement], summary: Notification center, responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AppNotification' } } } } } } }
  /associations/notifications/read:
    post: { tags: [Engagement], summary: Mark notifications read, responses: { '200': { $ref: '#/components/responses/Ok' } } }

  # ── Meetings (K) ──────────────────────────────────────────────────────────
  /associations/meetings:
    get: { tags: [Meetings], summary: Meetings list, responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MeetingSummary' } } } } } } }
  /associations/meetings/{id}:
    get:
      tags: [Meetings]
      summary: Meeting detail
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } } }
  /associations/meetings/{id}/rsvp:
    post:
      tags: [Meetings]
      summary: RSVP to a meeting
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { status: { $ref: '#/components/schemas/RsvpStatus' } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /associations/meetings/{id}/attendance:
    post:
      tags: [Meetings]
      summary: Check in to a meeting
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ── Tasks (M) ─────────────────────────────────────────────────────────────
  /associations/tasks:
    get:
      tags: [Tasks]
      summary: Tasks list
      parameters: [ { name: scope, in: query, schema: { type: string, enum: [mine, assigned, overdue, completed] } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TaskSummary' } } } } } }
  /associations/tasks/{id}:
    get:
      tags: [Tasks]
      summary: Task detail
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } } }
    patch:
      tags: [Tasks]
      summary: Update task status
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { status: { $ref: '#/components/schemas/TaskStatus' } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ── Documents (P) ─────────────────────────────────────────────────────────
  /associations/documents:
    get: { tags: [Documents], summary: Document vault, responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } } } } } } }
  /associations/documents/{id}:
    get:
      tags: [Documents]
      summary: Document detail
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentDetail' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/documents/{id}/acknowledge:
    post:
      tags: [Documents]
      summary: Acknowledge a document
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ── Chat (I) ──────────────────────────────────────────────────────────────
  /associations/chat/threads:
    get: { tags: [Chat], summary: Chat thread list, responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChatThreadSummary' } } } } } } }
  /associations/chat/threads/{id}:
    get:
      tags: [Chat]
      summary: Chat thread + messages
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChatThread' } } } } }
  /associations/chat/threads/{id}/messages:
    post:
      tags: [Chat]
      summary: Send a message
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { body: { type: string } }, required: [body] } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ChatMessage' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/chat/threads/{id}/mute:
    post:
      tags: [Chat]
      summary: Mute or unmute a chat thread (persists per-member preference)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { muted: { type: boolean } }, required: [muted] } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ── AI notes (L) ──────────────────────────────────────────────────────────
  /associations/ai-notes:
    get: { tags: [AI Notes], summary: AI note history, responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AiNoteSummary' } } } } } } }
    post:
      tags: [AI Notes]
      summary: Create an AI note job (record/upload)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAiNoteInput' } } } }
      responses: { '202': { description: Accepted, content: { application/json: { schema: { type: object, properties: { id: { type: string }, status: { $ref: '#/components/schemas/AiNoteStatus' } } } } } } }
  /associations/ai-notes/{id}:
    get:
      tags: [AI Notes]
      summary: AI note (minutes draft)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AiNote' } } } } }
  /associations/ai-notes/{id}/status:
    get:
      tags: [AI Notes]
      summary: Poll processing status
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { status: { $ref: '#/components/schemas/AiNoteStatus' } } } } } } }
  /associations/ai-notes/{id}/approve:
    post:
      tags: [AI Notes]
      summary: Approve AI minutes (human gate)
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /associations/ai-notes/{id}/publish:
    post:
      tags: [AI Notes]
      summary: Publish approved minutes
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /associations/ai-notes/{noteId}/action-items/{itemId}/convert:
    post:
      tags: [AI Notes]
      summary: Convert an action item into a Task
      parameters:
        - { name: noteId, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '201': { description: Created, content: { application/json: { schema: { type: object, properties: { taskId: { type: string } } } } } } }

  # ── Community: committees & events (N, O) ────────────────────────────────────
  /associations/committees:
    get: { tags: [Community], summary: Committees, responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CommitteeSummary' } } } } } } }
  /associations/committees/{id}:
    get:
      tags: [Community]
      summary: Committee detail
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Committee' } } } } }
  /associations/committees/{id}/join:
    post:
      tags: [Community]
      summary: Request to join a committee
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /associations/events:
    get: { tags: [Community], summary: Events, responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EventSummary' } } } } } } }
  /associations/events/{id}:
    get:
      tags: [Community]
      summary: Event detail
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } } }
  /associations/events/{id}/rsvp:
    post:
      tags: [Community]
      summary: RSVP to an event
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { rsvp: { $ref: '#/components/schemas/EventRsvp' } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /associations/events/{id}/register:
    post:
      tags: [Community]
      summary: Register for an event (paid events post to the dues/pay flow)
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, ticketCode: { type: string } } } } } } }
  /associations/events/{id}/feedback:
    post:
      tags: [Community]
      summary: Submit post-event feedback
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { rating: { type: integer, minimum: 1, maximum: 5 }, comment: { type: string } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ── Support (W) ───────────────────────────────────────────────────────────
  /associations/support/faqs:
    get: { tags: [Support], summary: FAQs, responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FaqItem' } } } } } } }
  /associations/support/tickets:
    get: { tags: [Support], summary: My tickets, responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SupportTicketSummary' } } } } } } }
    post:
      tags: [Support]
      summary: Create a support ticket
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTicketInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } } }
  /associations/support/tickets/{id}:
    get:
      tags: [Support]
      summary: Ticket detail (thread)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SupportTicket' } } } } }
  /associations/support/tickets/{id}/messages:
    post:
      tags: [Support]
      summary: Reply to a ticket
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { body: { type: string } }, required: [body] } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TicketMessage' } } } } }

  # ── Admin (Q, R, S) ───────────────────────────────────────────────────────
  # Organisation management. assoc_organisations was previously write-once —
  # PublishOrganisation was the only writer in the repo, so every field was
  # immutable after creation and `verified` was unreachable schema.
  /associations/admin/organisations:
    get:
      tags: [Admin]
      summary: List organisations the caller may administer
      parameters:
        - { name: search,    in: query, schema: { type: string } }
        - { name: category,  in: query, schema: { type: string } }
        - { name: status,    in: query, schema: { type: string, enum: [ACTIVE, SUSPENDED, ARCHIVED] } }
        - { name: published, in: query, schema: { type: boolean } }
        - { name: verified,  in: query, schema: { type: boolean } }
        - { name: limit,     in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: offset,    in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminOrgOption' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /associations/admin/organisations/{id}:
    get:
      tags: [Admin]
      summary: Full organisation detail for administration
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminOrganisationDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Not found' }
    patch:
      tags: [Admin]
      summary: Update organisation details (partial; omitted fields are unchanged)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOrganisationRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminOrganisationDetail' } } } }
        '400': { description: 'Invalid field value' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /associations/admin/organisations/{id}/settings:
    get:
      tags: [Admin]
      summary: Per-association custom settings
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin]
      summary: Merge into per-association settings (a null value deletes its key)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /associations/admin/organisations/{id}/verify:
    post:
      tags: [Admin]
      summary: Mark an organisation verified (platform super-admin only)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/organisations/{id}/unverify:
    post:
      tags: [Admin]
      summary: Remove an organisation's verified badge (platform super-admin only)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/organisations/{id}/publish:
    post:
      tags: [Admin]
      summary: Publish an organisation to discovery
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/organisations/{id}/unpublish:
    post:
      tags: [Admin]
      summary: Remove an organisation from discovery
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/organisations/{id}/suspend:
    post:
      tags: [Admin]
      summary: Suspend an organisation
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/organisations/{id}/restore:
    post:
      tags: [Admin]
      summary: Lift an organisation suspension
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/organisations/{id}/chapters:
    post:
      tags: [Admin]
      summary: Add a chapter
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChapterRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/CreatedId' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/organisations/{id}/committees:
    post:
      tags: [Admin]
      summary: Add a committee
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CommitteeRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/CreatedId' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/organisations/{id}/categories:
    post:
      tags: [Admin]
      summary: Add a membership category (dues tier). Amounts are integer kobo.
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/CreatedId' }, '400': { description: 'Missing Idempotency-Key or invalid amount' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/organisations/{id}/rules:
    post:
      tags: [Admin]
      summary: Add a group rule
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RuleRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/CreatedId' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/chapters/{childId}:
    patch:
      tags: [Admin]
      summary: Update a chapter
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChapterRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
    delete:
      tags: [Admin]
      summary: Delete a chapter (refused while members are still assigned to it)
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { description: 'Chapter still in use' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/committees/{childId}:
    patch:
      tags: [Admin]
      summary: Update a committee
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CommitteeRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
    delete:
      tags: [Admin]
      summary: Delete a committee
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/categories/{childId}:
    patch:
      tags: [Admin]
      summary: Re-price a dues tier. Existing unpaid invoices keep their issued amount.
      parameters: [ { $ref: '#/components/parameters/ChildId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { description: 'Missing Idempotency-Key or invalid amount' }, '403': { $ref: '#/components/responses/Forbidden' } }
    delete:
      tags: [Admin]
      summary: Delete a dues tier (refused while members are still on it)
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { description: 'Category still in use' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/rules/{childId}:
    patch:
      tags: [Admin]
      summary: Update a group rule
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RuleRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
    delete:
      tags: [Admin]
      summary: Remove a group rule
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  # ── Content authoring ─────────────────────────────────────────────────────
  # assoc_announcements / meetings / documents / events / tasks / notifications
  # / devices / dues_invoices all had READ endpoints and no writer anywhere in
  # the repo, so they were permanently empty and content could only arrive by
  # hand-written SQL.
  /associations/admin/organisations/{id}/announcements:
    post:
      tags: [Admin]
      summary: Post an announcement (optionally notifying every active member)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AnnouncementRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/CreatedId' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/announcements/{childId}:
    patch:
      tags: [Admin]
      summary: Update an announcement
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AnnouncementRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
    delete:
      tags: [Admin]
      summary: Delete an announcement
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/organisations/{id}/meetings:
    post:
      tags: [Admin]
      summary: Schedule a meeting
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MeetingRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/CreatedId' }, '400': { description: 'Invalid mode, state or timestamp' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/meetings/{childId}:
    patch:
      tags: [Admin]
      summary: Update a meeting
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MeetingRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
    delete:
      tags: [Admin]
      summary: Delete a meeting
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/meetings/{childId}/minutes:
    post:
      tags: [Admin]
      summary: Publish or unpublish meeting minutes
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { published: { type: boolean } }, required: [published] } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/organisations/{id}/documents:
    post:
      tags: [Admin]
      summary: Add a document to the vault
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/CreatedId' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/documents/{childId}:
    patch:
      tags: [Admin]
      summary: Update a document
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
    delete:
      tags: [Admin]
      summary: Delete a document
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/organisations/{id}/events:
    post:
      tags: [Admin]
      summary: Create an event. A paid event must carry a positive feeKobo.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EventRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/CreatedId' }, '400': { description: 'Incoherent pricing or timestamp' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/events/{childId}:
    patch:
      tags: [Admin]
      summary: Update an event
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EventRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
    delete:
      tags: [Admin]
      summary: Delete an event (refused once paid registrations exist)
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { description: 'Event has paid registrations' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/organisations/{id}/tasks:
    post:
      tags: [Admin]
      summary: Create and assign a task
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/CreatedId' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/tasks/{childId}:
    patch:
      tags: [Admin]
      summary: Update a task
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
    delete:
      tags: [Admin]
      summary: Delete a task
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/organisations/{id}/dues/run:
    post:
      tags: [Admin]
      summary: >-
        Raise one dues invoice per active member, priced from each member's own
        membership category. This is the input to the money path — PayInvoice
        had nothing it could settle until a run existed.
      description: >-
        Replay-safe by construction: the Idempotency-Key is a unique index on
        assoc_dues_runs and each invoice is uniquely indexed on
        (run_id, membership_id), so a retried run raises nothing and returns the
        original result with alreadyRaised = true.
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DuesRunRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DuesRunResult' } } } }
        '400': { description: 'Missing Idempotency-Key or invalid scope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /associations/admin/invoices:
    post:
      tags: [Admin]
      summary: Raise a single ad-hoc invoice against one membership
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/CreatedId' }, '400': { description: 'Missing Idempotency-Key or invalid amount' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /associations/admin/audit-log:
    get:
      tags: [Admin]
      summary: Organisation audit log (strictly scoped to one organisation)
      parameters:
        - { name: org_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditLogEntry' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /associations/admin/kpis:
    get: { tags: [Admin], summary: Admin dashboard KPIs, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminKpis' } } } } } }
  /associations/admin/approvals:
    get:
      tags: [Admin]
      summary: Membership approval queue
      parameters: [ { name: jurisdiction, in: query, schema: { type: string, enum: [ALL, CHAPTER, NATIONAL] } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminApplicationSummary' } } } } } }
  /associations/admin/approvals/{id}:
    get:
      tags: [Admin]
      summary: Application detail
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminApplication' } } } } }
  /associations/admin/approvals/{id}/decision:
    post:
      tags: [Admin]
      summary: Approve / reject / request-info (audit-logged)
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { decision: { type: string, enum: [APPROVE, REJECT, REQUEST_INFO] }, note: { type: string } }, required: [decision] } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /associations/admin/finance:
    get: { tags: [Admin], summary: Finance summary, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceSummary' } } } } } }
  /associations/admin/finance/offline:
    get: { tags: [Admin], summary: Pending offline payments, responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OfflinePayment' } } } } } } }
  /associations/admin/finance/offline/{id}/decision:
    post:
      tags: [Admin]
      summary: Approve / reject an offline payment proof (money mutation)
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { approve: { type: boolean } }, required: [approve] } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /associations/admin/import/preview:
    post:
      tags: [Admin]
      summary: Preview a bulk member import file
      description: >
        Upload the CSV (multipart field `file`; columns
        name,email,phone,member_code,category_label,chapter_label). Returns parsed
        rows classified valid / duplicate / invalid. org_id is optional (resolved
        from the caller's membership when omitted).
      parameters:
        - { name: org_id, in: query, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
              required: [file]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ImportPreview' } } } } }
  /associations/admin/import/confirm:
    post:
      tags: [Admin]
      summary: Confirm a bulk member import
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { sendInvites: { type: boolean } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ImportResult' } } } } }
  /associations/admin/members/{id}/suspend:
    post:
      tags: [Admin]
      summary: Suspend a member (audit-logged)
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /associations/admin/members/{id}/restore:
    post:
      tags: [Admin]
      summary: Restore a suspended member
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /associations/admin/members/{id}/transfer:
    post:
      tags: [Admin]
      summary: Transfer a member to another chapter (audit-logged)
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { chapter: { type: string } }, required: [chapter] } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /associations/admin/members/{id}/role:
    post:
      tags: [Admin]
      summary: Assign an admin role to a member (audit-logged)
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { role: { $ref: '#/components/schemas/AdminRole' } }, required: [role] } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    # Sub-entity id. Named childId rather than id because gin allows only one
    # parameter name per path position and :id is already the organisation.
    ChildId: { name: childId, in: path, required: true, schema: { type: string } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on all state-changing requests (IRON RULE).
      schema: { type: string }
  responses:
    Ok:
      description: Success
      content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Access restricted (role or payment-gated)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    CreatedId:
      description: Created
      content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } }
  schemas:
    Error: { type: object, properties: { code: { type: string }, message: { type: string } } }
    OrgRestrictions:
      type: object
      description: Feature gates applied to members in arrears, plus the grace period.
      properties:
        graceDays:     { type: integer, minimum: 0 }
        disableVoting: { type: boolean }
        disableEvents: { type: boolean }
        disableChat:   { type: boolean }
        disableCard:   { type: boolean }
    AdminOrgOption:
      type: object
      description: One row of the admin organisation register.
      properties:
        id:          { type: string }
        name:        { type: string }
        acronym:     { type: [string, 'null'] }
        category:    { type: string }
        status:      { type: string, enum: [ACTIVE, SUSPENDED, ARCHIVED] }
        published:   { type: boolean }
        verified:    { type: boolean }
        memberCount: { type: integer }
        createdAt:   { type: string }
    AdminOrgRule:
      type: object
      properties:
        id:       { type: string }
        body:     { type: string }
        position: { type: integer }
    AdminCommittee:
      type: object
      properties:
        id:          { type: string }
        name:        { type: string }
        description: { type: [string, 'null'] }
        memberCount: { type: integer }
    AdminChapterLeader:
      type: object
