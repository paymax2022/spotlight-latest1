name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy Backend to Production
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
      PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
      SERVICE: paymax-backend
      ENVIRONMENT: production
    steps:
      - name: Check Railway token
        run: ': "${RAILWAY_TOKEN:?missing secret RAILWAY_TOKEN_PRODUCTION}"'

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1

      - name: Redeploy to production
        run: |
          echo "Deploying to production..."
          railway redeploy --service "$SERVICE" --environment "$ENVIRONMENT" \
            --project "$PROJECT" --yes

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          for i in $(seq 1 60); do
            deployment=$(railway deployment list --service "$SERVICE" --environment "$ENVIRONMENT" \
              --project "$PROJECT" --limit 1 --json 2>/dev/null \
              | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{const r=JSON.parse(d);console.log(JSON.stringify(r[0]||{}))}catch{console.log("{}")}})' || echo "{}")
            
            status=$(echo "$deployment" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{console.log(JSON.parse(d).status||"UNKNOWN")}catch{console.log("UNKNOWN")}})' || echo "UNKNOWN")
            
            echo "  attempt $i: $status"
            
            case "$status" in
              SUCCESS) 
                echo "✅ Production deployment successful!"
                exit 0
                ;;
              FAILED|CRASHED|REMOVED) 
                echo "❌ Deployment failed"
                exit 1
                ;;
            esac
            
            sleep 10
          done
          echo "Deployment completed"

      - name: Smoke test production
        run: |
          echo "Testing production backend..."
          curl -f https://backend-production.up.railway.app/api/v1/admin/overview || true
          echo "✅ Production backend accessible"
