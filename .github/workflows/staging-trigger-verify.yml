# ─────────────────────────────────────────────────────────────────────────────
# Staging trigger-lane verification — TEMPORARY, DELETE WITH THE BRANCH.
#
# What it asks: does `scripts/ci/railway-trigger-deploy.sh` — the transport that
# replaces the staging upload in release.yml — actually work from a runner, for all
# three staging services, with the secret release.yml gives those legs?
#
# The unit test next to it (scripts/ci/test-railway-trigger-deploy.sh) proves the
# selectors against a stub. This proves the stub is honest: the same script, the
# same CLI version, the same token, against the live project. Run 44406178859
# already showed `serviceInstanceDeploy` returning true from CI for backend and row
# 9f0d3f7c reaching SUCCESS; what has never been exercised from CI is this script's
# own wait-and-verify shape, and the two frontend services.
#
# It deploys main's tip to staging, which is where staging belongs anyway, so a
# green run is also the thing itself: staging frontends have been sitting on
# 5ec5870ce since the 18:33Z manual pass.
# ─────────────────────────────────────────────────────────────────────────────
name: Staging trigger verify (temporary)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to deploy through the trigger (full sha, must be pushed to main)'
        required: true
        default: '560e4287dd25db5d21a999de4172ca5b6156607f'
        type: string

permissions:
  contents: read

concurrency:
  group: staging-trigger-verify
  cancel-in-progress: false

env:
  RAILWAY_PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
  RAILWAY_ENVIRONMENT_ID_STAGING: 6b5f27a3-a290-4574-a977-363eb21d43ad

jobs:
  verify:
    name: the real script, the real token, three staging services
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Install Railway CLI (the version the legs pin)
        run: npm install --global @railway/cli@5.40.1

      - name: backend — initiate, wait, and verify the served sha
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          SERVICE: backend
          SERVICE_ID: 70de07d8-c058-4221-b645-61c4f1ac7aa5
          RAILWAY_ENV: staging
          ENVIRONMENT_ID: ${{ env.RAILWAY_ENVIRONMENT_ID_STAGING }}
          SHA: ${{ inputs.sha }}
          VERIFY_URL: https://backend-staging-new.up.railway.app/api/v1/public/build
        run: |
          set +e
          bash scripts/ci/railway-trigger-deploy.sh
          rc=$?
          echo "backend_rc=$rc" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: frontend-web — initiate and wait for its own row
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          SERVICE: frontend-web
          SERVICE_ID: dda6372c-0bb7-4014-a2b1-aa646c11a281
          RAILWAY_ENV: staging
          ENVIRONMENT_ID: ${{ env.RAILWAY_ENVIRONMENT_ID_STAGING }}
          SHA: ${{ inputs.sha }}
          VERIFY_URL: ''
        run: |
          set +e
          bash scripts/ci/railway-trigger-deploy.sh
          rc=$?
          echo "frontend_web_rc=$rc" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: frontend-admin — initiate and wait for its own row
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          SERVICE: frontend-admin
          SERVICE_ID: c4f1086e-0a2d-4367-b503-209c14a2ce6f
          RAILWAY_ENV: staging
          ENVIRONMENT_ID: ${{ env.RAILWAY_ENVIRONMENT_ID_STAGING }}
          SHA: ${{ inputs.sha }}
          VERIFY_URL: ''
        run: |
          set +e
          bash scripts/ci/railway-trigger-deploy.sh
          rc=$?
          echo "frontend_admin_rc=$rc" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: what staging answers from outside
        if: always()
        run: |
          echo "--- backend build identity ---" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -s --http1.1 -m 25 https://backend-staging-new.up.railway.app/api/v1/public/build | tee -a "$GITHUB_STEP_SUMMARY"; echo
          echo "--- the receiver-path routes (401 = mounted+gated, 404 = absent) ---" | tee -a "$GITHUB_STEP_SUMMARY"
          for R in /api/finance/social/requests /api/finance/social/requests/zzz/pay; do
            printf '%-40s POST=%s\n' "$R" "$(curl -s --http1.1 -m 25 -o /dev/null -w '%{http_code}' -X POST "https://backend-staging-new.up.railway.app$R")" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo "--- frontends ---" | tee -a "$GITHUB_STEP_SUMMARY"
          for U in https://frontend-web-staging-new.up.railway.app/ https://frontend-admin-staging-new.up.railway.app/admin/login; do
            printf '%-60s %s\n' "$U" "$(curl -s --http1.1 -m 30 -o /dev/null -w '%{http_code}' "$U")" | tee -a "$GITHUB_STEP_SUMMARY"
          done
