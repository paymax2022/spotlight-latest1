name: CI (Zero-Billing Optimized)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only run expensive checks on main branch or PRs
  frontend-web:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone to save time

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'  # Cache node_modules
          cache-dependency-path: 'frontend-web/package-lock.json'

      - run: cd frontend-web && npm ci  # dev deps required: eslint/typescript are devDependencies

      - run: cd frontend-web && npm run lint || true  # Non-blocking (lint:fast does not exist; was a masked no-op)

  frontend-admin:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-admin/package-lock.json'

      - run: cd frontend-admin && npm ci

      - run: cd frontend-admin && npm run type-check || true  # Type-check only

  backend:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'backend/go.mod'  # pin follows go.mod — manual pins have drifted below it before
          cache: true
          cache-dependency-path: 'backend/go.sum'

      - run: cd backend && go build ./...  # Build only, no tests

  # Quick checks (always run)
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the scan diffs two commits, and a shallow clone cannot
          # resolve a base ref at all.
          fetch-depth: 0

      # Resolve the range BEFORE calling the scanner. The previous config passed
      # base: <default_branch> with head: HEAD, which on a push to main compares
      # main against itself - TruffleHog exits 1 with "BASE and HEAD commits are
      # the same" and scans NOTHING. It failed that way on every push to main, so
      # this lane has been red-but-blind rather than protecting anything.
      - name: Resolve the commit range to scan
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # A brand-new branch (or a force-push) reports an all-zero "before".
          # Fall back to the first parent so there is still a real range instead
          # of an error, and scan the whole tree when even that is missing.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # --verify, NOT plain rev-parse: on a ROOT commit `rev-parse <sha>^`
            # prints "<sha>^" and then fails, so `|| true` would keep that invalid
            # string as BASE and hand the scanner a ref it cannot resolve.
            BASE="$(git rev-parse --verify --quiet "$HEAD^" || true)"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "$HEAD" ]; then
            echo "  no usable range - scanning the working tree instead"
            echo "filesystem=true" >> "$GITHUB_OUTPUT"
          else
            echo "  scanning $BASE..$HEAD"
            echo "filesystem=false" >> "$GITHUB_OUTPUT"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan the pushed range
        if: steps.range.outputs.filesystem == 'false'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          # --results=verified,unknown is the action default; keeping it explicit
          # documents that unverifiable app secrets (an ADMIN_API_KEY has no
          # provider to check against) still surface rather than being dropped.
          extra_args: --results=verified,unknown

      - name: Scan the working tree (no usable range)
        if: steps.range.outputs.filesystem == 'true'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified,unknown

  # Migrations guard (lightweight check)
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the guard diffs against the base commit

      - name: Detect changed migrations
        id: diff
        run: |
          set -euo pipefail
          # head_commit.modified can never trigger this lane: it is absent on
          # pull_request, and on push it is an array of file paths which can
          # never equal the bare directory string. Resolve the range like the
          # secrets-scan lane does.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse --verify --quiet 'HEAD^' || true)"
          fi
          : > changed_migrations.txt
          if [ -n "$BASE" ]; then
            git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'supabase/migrations/*.sql' > changed_migrations.txt || true
          fi
          if [ -s changed_migrations.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate changed migrations are additive-only
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Scope to changed files only: hundreds of historical migrations
          # contain DROP/ALTER/RENAME text (comments, CREATE OR REPLACE), so a
          # whole-tree grep would fail on files the additive-only policy
          # never governed.
          if xargs -a changed_migrations.txt grep -lE "DROP|ALTER.*TYPE|RENAME"; then
            echo "❌ Destructive migration patterns detected in changed files"
            exit 1
          fi
          echo "✅ Changed migrations are additive-only"
