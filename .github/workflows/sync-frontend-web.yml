
name: Spotlight Frontend Web Safe Merge

on:
  push:
    branches:
      - main
      - development
    paths:
      - "frontend-web/**"
      - ".github/workflows/sync-frontend-web.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-safe-merge-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge Frontend Web Without Deletions

    if: github.repository == 'paymax2022/spotlight-latest1'

    runs-on: ubuntu-latest

    env:
      SYNC_BRANCH: ${{ github.ref_name }}
      SYNC_ENABLED: ${{ vars.SPOTLIGHT_FRONTEND_SYNC_ENABLED }}

    steps:
      # STEP 1: Checkout source repository
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: paymax2022/spotlight-latest1
          ref: ${{ github.ref_name }}
          path: source
          persist-credentials: false

      # STEP 2: Checkout destination repository
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          repository: paymax2022/spotlight-latest
          ref: ${{ github.ref_name }}
          token: ${{ secrets.SPOTLIGHT_FRONTEND_SYNC_TOKEN }}
          path: destination
          persist-credentials: true

      # STEP 3: Merge additions and updates
      # No --delete option is used
      - name: Merge frontend-web without deleting files
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d source/frontend-web ]]; then
            echo "::error::Source frontend-web directory not found."
            exit 1
          fi

          mkdir -p destination/frontend-web

          rsync -av \
            --exclude=".git" \
            source/frontend-web/ \
            destination/frontend-web/

          echo "Frontend overlay merge prepared."

      # STEP 4: Stage frontend-web changes only
      - name: Stage frontend changes
        shell: bash
        run: |
          set -euo pipefail

          git -C destination add -A -- frontend-web

      # STEP 5: Block all deletions
      - name: Prevent file deletions
        shell: bash
        run: |
          set -euo pipefail

          DELETED_FILES="$(git -C destination diff \
            --cached \
            --name-only \
            --diff-filter=D \
            -- frontend-web)"

          if [[ -n "${DELETED_FILES}" ]]; then
            echo "::error::Deletion detected. Merge blocked."
            printf '%s\n' "${DELETED_FILES}"
            exit 1
          fi

          echo "Deletion safeguard passed."
          echo "No files are scheduled for deletion."

      # STEP 6: Preview merged files
      - name: Preview merged changes
        shell: bash
        run: |
          set -euo pipefail

          echo "Files to be added or updated:"
          git -C destination diff \
            --cached \
            --name-status \
            -- frontend-web

          echo "Change summary:"
          git -C destination diff \
            --cached \
            --stat \
            -- frontend-web

          echo "Merge preview completed."

      # STEP 7: Commit and push when enabled
      - name: Commit and push merged frontend
        if: env.SYNC_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git -C destination config \
            user.name "Spotlight Sync Bot"

          git -C destination config \
            user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git -C destination diff --cached --quiet; then
            echo "No new frontend changes."
            exit 0
          fi

          git -C destination commit \
            -m "merge: update frontend-web without deletions"

          git -C destination push origin \
            "HEAD:refs/heads/${SYNC_BRANCH}"

          echo "Frontend merge completed successfully."

      # STEP 8: Dry-run notification
      - name: Dry-run notification
        if: env.SYNC_ENABLED != 'true'
        run: |
          echo "DRY RUN MODE"
          echo "No files were pushed to spotlight-latest."
          echo "Review additions and modifications."
          echo "All deletions are blocked."
