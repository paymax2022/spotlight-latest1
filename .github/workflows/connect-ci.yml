# Called by ci.yml, which is the single pipeline for a push or PR. This lane no
# longer has its own push/pull_request trigger: fourteen workflows starting on one
# push meant fourteen queued pipelines competing for the same runners. ci.yml now
# decides whether this module changed (scripts/ci/changed-modules.py, driven by
# .github/module-filters.json) and calls this file as a reusable workflow, so its
# jobs report inside that one run. Paths live ONLY in module-filters.json now.
name: Connect CI

# Formal verification gate for the Paymax Connect (dating/networking) module.
# The authoring sandbox had no Go toolchain and no time for a full mobile/admin
# tsc, so the slices were static-verified only — this workflow is the real gate.
# Blocks merges on red. See docs/prd/dating/PHASE-0-PLAN.md §P0-G.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - name: Build (whole backend — catches wiring/import breaks)
        run: go build ./...
      - name: Vet (connect module)
        run: go vet ./internal/connect/...
      - name: Test (connect module — state machines, age gate, validation, hashing)
        run: go test ./internal/connect/... -count=1 -v
      # Repo-wide `go test ./...` removed: ci.yml's ungated `backend` job now runs
      # the whole backend suite against a real Postgres, so this lane repeating it
      # WITHOUT a database was both slower and weaker — every live-DB suite skipped
      # here while reporting "ok". The scoped run above stays: it is fast, it is
      # verbose, and it names this module when it fails.

  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app/reactnative
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Without this the RN dependency tree is installed from scratch every
          # run: npm ci measured 276-421s here against 5-6s for the typecheck it
          # exists to enable. ci.yml's own mobile job has had the cache all along;
          # these lanes were simply never given it.
          cache: npm
          cache-dependency-path: mobile-app/reactnative/package-lock.json
      - run: npm ci
      - name: Typecheck connect module (scoped)
        run: npx tsc --noEmit -p tsconfig.connectcheck.json

  migration-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject destructive DDL in connect migrations (additive-only)
        run: |
          set -e
          FILES=$(ls supabase/migrations/*connect*.sql 2>/dev/null || true)
          if [ -z "$FILES" ]; then echo "no connect migrations"; exit 0; fi
          # Allow idempotent "DROP POLICY/TRIGGER IF EXISTS" (RLS/trigger re-create pattern);
          # reject real destructive DDL. Strip "--" comments first so migration headers
          # that merely document the additive-only rule don't trip the guard.
          FAIL=0
          for f in $FILES; do
            MATCHES=$(sed 's/--.*//' "$f" \
              | grep -iEn '\b(drop\s+(table|column|type)|alter\s+[a-z_."]+\s+drop|drop\s+not\s+null|rename\s+(column|to))\b' \
              | grep -ivE 'drop\s+(policy|trigger)\s+if\s+exists' || true)
            if [ -n "$MATCHES" ]; then
              echo "$MATCHES" | sed "s|^|$f:|"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Destructive DDL found in connect migration (must be additive-only)"; exit 1;
          fi
          echo "Additive-only guard passed for: $FILES"
