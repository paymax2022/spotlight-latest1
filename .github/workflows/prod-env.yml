name: Prod env

# WRITE-capable configuration workflow for the PRODUCTION Railway environment.
# Companion to staging-module-flags.yml, which is deliberately staging-only.
#
# ── SAFETY MODEL (same discipline as the staging twin) ────────────────────────
#   * workflow_dispatch ONLY — never on push
#   * requires typing SET in the confirm input
#   * every job runs on the `production` GitHub environment, which carries the
#     required-reviewers gate — nothing here executes without an approval
#   * `railway variable list --json` only, NEVER --kv (--kv prints raw values;
#     that exact call leaked ADMIN_API_KEY into a log on run 32545670584)
#   * secret VALUES are written via `--stdin`, never placed on a command line,
#     and never echoed or interpolated into error output
#   * `--skip-deploys` on every write + ONE redeploy at the end, so N variable
#     writes do not queue N rolling restarts
#   * read-back verification after writes — a green job means the value is
#     actually live in Railway's config
#
# ── WHAT MAY BE COPIED staging→production ────────────────────────────────────
#   ONLY the non-payment infrastructure whitelist below. Payment-provider keys
#   (PAYSTACK_*, MONNIFY_*, MAPLERAD_*, DOJAH_*, TERMIL_*, EVERSEND*, ALPACA_*,
#   BREVO_*) are EXPLICITLY EXCLUDED: prod must run prod-only payment creds, and
#   staging test keys landing on prod once already caused a wallet-checkout
#   incident. If a payment key is needed on prod it is set by hand, never copied.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SET to confirm writes to the PRODUCTION environment'
        required: true
        type: string
      action:
        description: 'What to do'
        type: choice
        options: [inventory, copy-whitelist, set-flags, rotate-admin-key]
        default: inventory
      flags:
        description: 'For set-flags: comma-separated FEATURE_* names WITHOUT the _ENABLED suffix (e.g. BENEFICIARIES,NOTIFICATIONS). Money-adjacent flags are refused (see BLOCKED list).'
        type: string
        default: ''
      services:
        description: 'For set-flags: which services get the flags'
        type: choice
        options: [backend, frontend-web, both]
        default: backend

permissions:
  contents: read

concurrency:
  group: prod-env
  cancel-in-progress: false

env:
  PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
  ENVIRONMENT: production

jobs:
  inventory:
    # Names-only diff. Answers "what does prod lack that staging has" without
    # ever printing a value. Runs without the SET gate — it writes nothing.
    name: prod var inventory (names only)
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
      RAILWAY_TOKEN_STAGING_READ: ${{ secrets.RAILWAY_TOKEN_STAGING }}
    steps:
      - name: Check tokens
        run: ': "${RAILWAY_TOKEN:?missing RAILWAY_TOKEN_PRODUCTION}"'

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1

      - name: Diff var NAMES staging vs production
        run: |
          set -uo pipefail
          for svc in backend frontend-web frontend-admin; do
            for env in staging production; do
              tok="$RAILWAY_TOKEN"
              [ "$env" = staging ] && tok="$RAILWAY_TOKEN_STAGING_READ"
              RAILWAY_TOKEN="$tok" railway variable list --service "$svc" \
                --environment "$env" --project "$PROJECT" --json > "$svc.$env.json" 2>/dev/null || echo '{}' > "$svc.$env.json"
            done
          done
          node -e '
            const fs = require("fs");
            for (const svc of ["backend","frontend-web","frontend-admin"]) {
              let stg={}, prd={};
              try { stg = JSON.parse(fs.readFileSync(`${svc}.staging.json`,"utf8")); } catch {}
              try { prd = JSON.parse(fs.readFileSync(`${svc}.production.json`,"utf8")); } catch {}
              const sNames = Object.keys(stg).sort(), pNames = Object.keys(prd).sort();
              const missing = sNames.filter(k => !(k in prd));
              const extra   = pNames.filter(k => !(k in stg));
              console.log(`=== ${svc} ===`);
              console.log(`  prod has ${pNames.length} vars; staging has ${sNames.length}`);
              console.log(`  on staging but MISSING on prod: ${missing.length ? missing.join(", ") : "(none)"}`);
              console.log(`  on prod but not on staging:   ${extra.length ? extra.join(", ") : "(none)"}`);
            }
          '
          rm -f backend.*.json frontend-web.*.json frontend-admin.*.json

  copy-whitelist:
    # Copies NON-PAYMENT infrastructure vars from staging to prod only where
    # prod lacks them. Never overwrites an existing prod value.
    name: copy whitelisted infra vars staging→prod
    if: ${{ inputs.confirm == 'SET' && inputs.action == 'copy-whitelist' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
      RAILWAY_TOKEN_STAGING_READ: ${{ secrets.RAILWAY_TOKEN_STAGING }}
      # Non-payment infra only. Payment/provider creds are excluded by design.
      WHITELIST: >-
        R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET
        R2_BUCKET_NAME R2_ENDPOINT R2_PUBLIC_URL
        RESEND_API_KEY
    steps:
      - name: Check tokens
        run: ': "${RAILWAY_TOKEN:?missing RAILWAY_TOKEN_PRODUCTION}"'

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1

      - name: Copy whitelisted vars backend staging→prod (never prints values)
        run: |
          set -euo pipefail
          RAILWAY_TOKEN="$RAILWAY_TOKEN_STAGING_READ" railway variable list \
            --service backend --environment staging --project "$PROJECT" --json > stg.json
          railway variable list --service backend --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > prd.json
          node -e '
            const fs = require("fs");
            const stg = JSON.parse(fs.readFileSync("stg.json","utf8"));
            const prd = JSON.parse(fs.readFileSync("prd.json","utf8"));
            const wl = process.env.WHITELIST.trim().split(/\s+/);
            const todo = wl.filter(k => stg[k] && !(k in prd));
            const skipExisting = wl.filter(k => k in prd);
            const absentOnStaging = wl.filter(k => !(k in stg));
            fs.writeFileSync("copy.env", todo.map(k => `${k}=${stg[k]}`).join("\n") + "\n");
            fs.writeFileSync("todo.json", JSON.stringify(todo));
            console.log("  will copy:", todo.length ? todo.join(", ") : "(none)");
            if (skipExisting.length) console.log("  skip (already on prod):", skipExisting.join(", "));
            if (absentOnStaging.length) console.log("  ABSENT on staging too:", absentOnStaging.join(", "));
          '
          rm -f stg.json prd.json
          # Feed KEY=VALUE pairs without echoing them: read from file into args.
          if [ -s copy.env ]; then
            args=()
            while IFS= read -r line; do args+=("$line"); done < copy.env
            railway variable set "${args[@]}" \
              --service backend --environment "$ENVIRONMENT" --project "$PROJECT" \
              --skip-deploys
            rm -f copy.env
          fi
          node -e 'console.log("copied:", JSON.parse(require("fs").readFileSync("todo.json","utf8")).join(", ") || "(none)")'
          rm -f todo.json

      - name: Verify names landed on prod (names only)
        run: |
          set -euo pipefail
          railway variable list --service backend --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > prd.json
          node -e '
            const v = JSON.parse(require("fs").readFileSync("prd.json","utf8"));
            const wl = process.env.WHITELIST.trim().split(/\s+/);
            const have = wl.filter(k => k in v);
            console.log("  whitelist vars now present on prod backend:", have.length ? have.join(", ") : "(none)");
          '
          rm -f prd.json

      - name: Redeploy backend once
        run: |
          set -euo pipefail
          railway redeploy --service backend --environment "$ENVIRONMENT" \
            --project "$PROJECT" --yes

  set-flags:
    name: set FEATURE_* flags on prod
    if: ${{ inputs.confirm == 'SET' && inputs.action == 'set-flags' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
    steps:
      - name: Check token
        run: ': "${RAILWAY_TOKEN:?missing RAILWAY_TOKEN_PRODUCTION}"'

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1

      # Money-adjacent flags stay OFF until live payment creds are on prod —
      # enabling checkout/transfers against the staging TEST Paystack key that
      # currently sits on prod would run real-user flows through test mode.
      - name: Refuse money-adjacent flags and build the pair list
        run: |
          set -euo pipefail
          FLAGS_IN="${{ inputs.flags }}" node -e '
            const raw = (process.env.FLAGS_IN || "").split(",").map(s=>s.trim().toUpperCase()).filter(Boolean);
            if (!raw.length) { console.error("flags input is empty"); process.exit(1); }
            const BLOCKED = new Set([
              "WALLET_TRANSFERS","BANK_TRANSFERS","P2P_MARKET","RESTAURANT_PAYSTACK_CHECKOUT",
              "VIRTUAL_ACCOUNTS","FX","CRYPTO","INVEST","FRACTIONAL_RE","PAID_VOTES",
              "WALLET_CHECKOUT","SAVINGS",
            ]);
            const bad = raw.filter(k => BLOCKED.has(k));
            if (bad.length) { console.error("refusing money-adjacent flags: " + bad.join(", ")); process.exit(1); }
            const names = raw.map(k => k.startsWith("FEATURE_") ? k : `FEATURE_${k}_ENABLED`);
            require("fs").writeFileSync("flags.json", JSON.stringify(names));
            console.log("  will set:", names.join(", "));
          '
          node -e '
            const fs = require("fs");
            const names = JSON.parse(fs.readFileSync("flags.json","utf8"));
            fs.writeFileSync("pairs.txt", names.map(k => `${k}=true`).join("\n") + "\n");
          '

      - name: Set flags (one write per service, skip-deploys)
        run: |
          set -euo pipefail
          svcs="${{ inputs.services }}"
          [ "$svcs" = both ] && svcs="backend frontend-web"
          while IFS= read -r pair; do PAIRS+=("$pair"); done < pairs.txt
          for svc in $svcs; do
            railway variable set "${PAIRS[@]}" \
              --service "$svc" --environment "$ENVIRONMENT" --project "$PROJECT" \
              --skip-deploys
            echo "  wrote ${#PAIRS[@]} flag(s) to $svc"
          done

      - name: Verify read-back (names + values must be exactly true)
        run: |
          set -euo pipefail
          svcs="${{ inputs.services }}"
          [ "$svcs" = both ] && svcs="backend frontend-web"
          for svc in $svcs; do
            railway variable list --service "$svc" --environment "$ENVIRONMENT" \
              --project "$PROJECT" --json > "v.$svc.json"
            SVC="$svc" node -e '
              const fs = require("fs");
              const svc = process.env.SVC;
              const v = JSON.parse(fs.readFileSync(`v.${svc}.json`,"utf8"));
              const names = JSON.parse(fs.readFileSync("flags.json","utf8"));
              const bad = names.filter(k => v[k] !== "true");
              if (bad.length) { console.error(`  ${svc}: NOT SET -> ${bad.join(", ")}`); process.exit(1); }
              console.log(`  ${svc}: all ${names.length} flag(s) = true`);
            '
          done
          rm -f v.*.json flags.json pairs.txt

      - name: Redeploy affected services once
        run: |
          set -euo pipefail
          svcs="${{ inputs.services }}"
          [ "$svcs" = both ] && svcs="backend frontend-web"
          for svc in $svcs; do
            railway redeploy --service "$svc" --environment "$ENVIRONMENT" \
              --project "$PROJECT" --yes
          done

  rotate-admin-key:
    name: rotate prod ADMIN_API_KEY
    if: ${{ inputs.confirm == 'SET' && inputs.action == 'rotate-admin-key' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
    steps:
      - name: Check token
        run: ': "${RAILWAY_TOKEN:?missing RAILWAY_TOKEN_PRODUCTION}"'

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1

      # Generated here, piped via --stdin: never on a command line, never in a
      # process list, never echoed. RequireAdmin FAILS OPEN on an empty key, so
      # the value is only ever SET, never cleared. Both services get the value
      # BEFORE either restarts.
      - name: Generate and set the new key on backend + frontend-admin
        run: |
          set -euo pipefail
          KEY="$(openssl rand -hex 32)"
          printf '%s' "$KEY" | railway variable set ADMIN_API_KEY --stdin \
            --service backend --environment "$ENVIRONMENT" --project "$PROJECT" --skip-deploys
          printf '%s' "$KEY" | railway variable set ADMIN_API_KEY --stdin \
            --service frontend-admin --environment "$ENVIRONMENT" --project "$PROJECT" --skip-deploys
          unset KEY
          railway variable set ADMIN_API_BASE_URL=http://backend.railway.internal:8080 \
            --service frontend-admin --environment "$ENVIRONMENT" --project "$PROJECT" --skip-deploys
          echo "  key written to backend and frontend-admin (value never printed)"

      - name: Verify both services have a non-empty key (length only)
        run: |
          set -euo pipefail
          for svc in backend frontend-admin; do
            railway variable list --service "$svc" --environment "$ENVIRONMENT" \
              --project "$PROJECT" --json > "v.$svc.json"
            SVC="$svc" node -e '
              const fs = require("fs");
              const svc = process.env.SVC;
              const v = JSON.parse(fs.readFileSync(`v.${svc}.json`,"utf8"));
              if (typeof v.ADMIN_API_KEY !== "string" || v.ADMIN_API_KEY.length !== 64) {
                console.error(`  ${svc}: ADMIN_API_KEY missing or wrong length (${(v.ADMIN_API_KEY||"").length})`); process.exit(1);
              }
              console.log(`  ${svc}: ADMIN_API_KEY present, len 64`);
            '
            rm -f "v.$svc.json"
          done

      - name: Redeploy both services once
        run: |
          set -euo pipefail
          railway redeploy --service backend --environment "$ENVIRONMENT" \
            --project "$PROJECT" --yes
          railway redeploy --service frontend-admin --environment "$ENVIRONMENT" \
            --project "$PROJECT" --yes
