name: DIAG - is the GitHub environment the discriminator?

# Why this exists. Three explanations of the staging upload refusals are still
# standing, and they imply three different fixes:
#
#   T1 transient on Railway's side     -> #1044's retry is the answer
#   T2 the GitHub `environment:` decl  -> stop declaring it on the deploy jobs
#   T3 the staging instances themselves refuse uploads (they carry a connected
#      repo; development's do not) -> build staging from source, don't upload
#
# T1 is already dead: run 43909191817 (16:35:47-16:38:15Z) pushed the three
# staging legs through with-retry.sh and Railway refused 12/12 attempts, each
# inside ~0.7 s of the call. A retry cannot ride out a deterministic refusal.
#
# What separates the accepted from the refused is, so far, one line. Run
# 43910959092 made 6 development + 6 staging uploads ~6 s apart with --verbose and
# ALL TWELVE were accepted — and that job declared no GitHub environment. Every
# refused leg declared `environment: staging`. Nothing else differed: same secret
# (RAILWAY_TOKEN_STAGING), same CLI pin (5.40.1), same project, same
# RAILWAY_HTTP_TIMEOUT, same `--environment staging`, same tree. Environment-level
# secrets are ruled out as the mechanism by direct listing — `staging` and
# `development` each carry zero secrets and zero variables, so declaring an
# environment cannot substitute a different token.
#
# This file holds everything constant except that line. The argv is the refused
# call copied from run 43909191817's log, 40-hex message included. Three arms run
# CHAINED (`needs:`) so no two uploads overlap in time:
#
#   A: 3 uploads, no `environment:`
#   B: 3 uploads, `environment: staging`
#   C: 3 uploads, no `environment:`   (repeat, to exclude a passing moment)
#
# B red with A and C green  -> T2: the declaration is the discriminator.
# A or C red too            -> T3: staging refuses uploads outright; switch
#                              staging to a source build.
# all nine green            -> the refusal needs a loaded project: serialise the
#                              six concurrent uploads in release.yml and keep the
#                              retry as defence in depth.
#
# A call is ACCEPTED when the CLI prints `Indexing...`; the refusal never got past
# a non-JSON answer to the upload-initiate request. Each failure is replayed once
# with --verbose through a redactor so the log carries what Railway actually said.
# No token is ever printed. Staging/development only — this file never reads a
# production secret and never passes `--environment production`.

on:
  workflow_dispatch:
  push:
    branches: [diag/staging-env-differential]

permissions:
  contents: read

concurrency:
  group: diag-env-differential
  cancel-in-progress: false

env:
  RAILWAY_PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
  RAILWAY_HTTP_TIMEOUT: '600'
  # The tree the refused legs uploaded, so the archive content matches as well.
  FIX_REF: f7d1ac277206ce4e7d68628f42fd4d66b3169580

jobs:
  # ─── arm A: no github environment ───────────────────────────────────────────
  arm-a:
    name: arm A - three uploads, NO github environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this branch (carries the arm script)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout the tree the refused legs uploaded
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FIX_REF }}
          path: tree
          fetch-depth: 1

      - name: Install the release chain's pinned CLI
        run: |
          set -euo pipefail
          npm install --global @railway/cli@5.40.1
          railway --version

      - name: Three staging uploads
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          set -uo pipefail
          bash "$GITHUB_WORKSPACE/.github/workflows/scripts/diag-env-arm.sh" A

  # ─── arm B: the same job, with the environment declaration ──────────────────
  arm-b:
    name: arm B - three uploads, environment staging declared
    needs: arm-a
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout this branch (carries the arm script)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout the tree the refused legs uploaded
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FIX_REF }}
          path: tree
          fetch-depth: 1

      - name: Install the release chain's pinned CLI
        run: |
          set -euo pipefail
          npm install --global @railway/cli@5.40.1
          railway --version

      - name: Three staging uploads
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          set -uo pipefail
          bash "$GITHUB_WORKSPACE/.github/workflows/scripts/diag-env-arm.sh" B

  # ─── arm C: repeat of A, after B, so a quiet minute cannot fake a verdict ────
  arm-c:
    name: arm C - three uploads, NO github environment (repeat)
    needs: arm-b
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this branch (carries the arm script)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout the tree the refused legs uploaded
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FIX_REF }}
          path: tree
          fetch-depth: 1

      - name: Install the release chain's pinned CLI
        run: |
          set -euo pipefail
          npm install --global @railway/cli@5.40.1
          railway --version

      - name: Three staging uploads
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          set -uo pipefail
          bash "$GITHUB_WORKSPACE/.github/workflows/scripts/diag-env-arm.sh" C

  verdict:
    name: differential verdict
    needs: [arm-a, arm-b, arm-c]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Read the three arms
        run: |
          set -euo pipefail
          A='${{ needs.arm-a.result }}'
          B='${{ needs.arm-b.result }}'
          C='${{ needs.arm-c.result }}'
          {
            echo "## Differential verdict"
            echo ""
            echo "| arm | github \`environment:\` on the job | result |"
            echo "|---|---|---|"
            echo "| A | not declared | $A |"
            echo "| B | \`staging\` | $B |"
            echo "| C | not declared | $C |"
            echo ""
            if [ "$B" != "success" ] && [ "$A" = "success" ] && [ "$C" = "success" ]; then
              echo '**T2 holds** — the environment declaration on the deploy job is the discriminator.'
            elif [ "$A" != "success" ] || [ "$C" != "success" ]; then
              echo '**T3 holds** — staging refuses the upload whatever the job declares; staging must build from its connected source rather than receive an upload.'
            else
              echo '**All nine accepted** — the refusal needs a loaded project, not a declaration: serialise release.yml's six concurrent uploads and keep the retry as defence in depth.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "A=$A B=$B C=$C"
