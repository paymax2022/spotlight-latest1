# Integration verify — the Postgres-backed end-to-end loop ENVIRONMENT-AND-GOLIVE.md
# §4 flagged as the remaining gap. Complements ci.yml (CLAUDE.md gates: build/vet/
# tsc/openapi/migration-guard) by adding what those can't do without a live DB:
# real migrations apply, `go test -race` against Postgres + FAKE rails, and the
# build-once image. Byte-mirrored locally by `make ci` + `make docker-build`.
name: integration-verify
on:
  # Heaviest workflow in the repo (Postgres service + `go test -race` + full tsc +
  # docker build). Same minute-thrift as ci.yml: gate on PRs + pushes to main only,
  # and skip docs-only changes. It previously ran on every push to every branch.
  # NOTE: if this is ever made a REQUIRED check, drop the pull_request paths-ignore
  # (a path-skipped required check reports as perpetually pending).
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integ-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # NO `services:` block: service images are pulled by the runner BEFORE the
    # first step executes, so a Docker Hub 429/timeout (anonymous rate limit
    # shared across every concurrent PR on hosted runners) failed this job at
    # "Initialize containers" with no chance to retry. postgis/postgis is
    # community-published — Docker Hub only, no official ECR Public/GHCR mirror —
    # so the container is started by a step whose pull is wrapped in bounded
    # retry+backoff (scripts/ci/start-postgres-service.sh). Same image, env,
    # port and pg_isready health gate as the declarative service it replaced.
    env:
      DATABASE_URL: postgres://paymax:paymax@localhost:5432/paymax?sslmode=disable
      # Every live-DB test suite gates on TEST_DATABASE_URL and NONE fall back to
      # DATABASE_URL — they INSERT fixtures and move money, and on a developer
      # machine DATABASE_URL is the PRODUCTION Supabase pooler. Enforced by
      # scripts/ci/check-live-db-gate.sh (runs on every PR via ci.yml).
      #
      # This line is what makes that safe: without it those suites skip silently
      # and gate nothing, which is exactly how internal/savings (9 tests) and
      # internal/handlers (24) sat dead in CI for months. Both names point at the
      # same ephemeral service container.
      TEST_DATABASE_URL: postgres://paymax:paymax@localhost:5432/paymax?sslmode=disable
      RAILS_MODE: fake # FAKEs only — no external provider secrets in CI
    steps:
      - uses: actions/checkout@v4
      # PostGIS-enabled image required: the very first migration
      # (20260101000000_enable_extensions.sql) runs CREATE EXTENSION postgis,
      # which a plain postgres image can't satisfy. PG17 matches production
      # (PostgreSQL 17 via Supabase).
      - name: Start PostGIS service container (pull retried — Docker Hub rate limits)
        run: bash scripts/ci/start-postgres-service.sh postgis/postgis:17-3.4 ci-postgres
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend-web/package-lock.json
            frontend-admin/package-lock.json

      - name: Bootstrap
        run: make bootstrap

      # migrate-reset's `DROP SCHEMA public CASCADE` needs a lock per dropped
      # object; the ~400-migration schema blows the default 64. Needs a server
      # restart to take effect (ALTER SYSTEM + reload is not enough).
      - name: Raise Postgres lock table (full-schema drop in migrate-reset)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET max_locks_per_transaction = 512;"
          docker restart ci-postgres
          timeout 90 bash -c 'until pg_isready -h localhost -p 5432 -U paymax >/dev/null 2>&1; do sleep 1; done'

      # The migrations assume the surface Supabase provides at runtime (auth
      # schema + auth.uid()/role(), storage schema, anon/authenticated/
      # service_role). Shim it in — survives migrate-reset (drops public only).
      - name: Supabase-compat prelude (plain-Postgres shim)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f scripts/ci/supabase-compat-prelude.sql

      - name: Migrations apply cleanly (real Postgres)
        run: make migrate-up

      - name: go build ./...
        run: make build

      # Now covers every TEST_DATABASE_URL-gated live-DB suite (see the job env
      # above), so savings no longer needs a package-scoped step of its own.
      - name: go test ./... -race (Postgres + fakes, incl. live-DB suites)
        run: make test

      # A package whose live-DB tests all SKIP still reports "ok", so a green
      # `make test` does NOT prove the gate above is wired. Re-run one canary per
      # critical live-DB area with -v and assert it actually executed. Without
      # this, a future env change silently returns them to skipping and the lane
      # stays green with zero real coverage — exactly how savings (9 tests) and
      # the admin console (24) sat dead here for months.
      #
      # Generalised from the savings-only assertion that shipped with the
      # (now removed) package-scoped savings step.
      - name: Prove the live-DB suites actually ran (anti-skip canary)
        run: |
          cd backend
          set -o pipefail
          # NOTE: ./tests/voting/... and the Tally/Registration/Mirror canaries were
          # removed here — that package has never existed and those four Go tests are
          # on no branch in this repo. They were added in 1ac4694e alongside 6995b8a7
          # deleting the three frontend-web TypeScript specs that covered the same
          # ground (connect-tally-trigger, vote-package-ladder,
          # one-application-per-contest), i.e. a port that deleted the old tests and
          # never wrote the new ones. `go test` then failed the whole step with
          # "lstat ./tests/voting/: no such file or directory" before any canary ran.
          #
          # A canary naming a test that does not exist gates NOTHING while looking
          # strict — the failure mode this step exists to prevent. So it now asserts
          # only on tests that are real. Do NOT re-add a name here until the test
          # exists; the vote-credit coverage debt is tracked separately, and the
          # deleted connect-tally spec is worth reading first (git show 21f77f8b:
          # frontend-web/tests/integration/voting/connect-tally-trigger.test.ts) —
          # it documents why that projection is driven from vote_transactions rather
          # than a route, since four entry points reach it.
          # HISTORY, so this does not cycle a third time. 1ac4694e first added
          # ./tests/voting/... and the Tally/Registration/Mirror canaries while the
          # package itself was still UNTRACKED in a shared checkout, so the promotion
          # swept the workflow edit and 6995b8a7's spec deletions but not the Go
          # files. main went red with "lstat ./tests/voting/: no such file or
          # directory" — go test failed before a single canary was checked — and
          # 056bd9ff correctly backed the names out, noting: do NOT re-add a name
          # here until the test exists.
          #
          # That condition is now met. backend/tests/voting exists (e1acb5af, 20
          # tests) and carries the reasoning 056bd9ff asked to preserve: why the
          # projection is driven from vote_transactions rather than a route, since
          # four entry points reach it and the route-level files are brownfield-
          # protected. The four names below resolve; `go test ./tests/voting/...`
          # was run under -race against a live Postgres before this landed.
          #
          # The rule stands unchanged for the next person: a canary naming a test
          # that does not exist gates NOTHING while looking strict, which is the
          # exact failure this step was built to catch. Add a name only after the
          # test does.
          go test ./internal/savings/... ./internal/handlers/... ./internal/trading/wallet/... ./tests/voting/... \
            -race -p 1 -v -run 'TestLiveDB_|TestAdminConsole_|TestTally_|TestRegistration_|TestMirror_' 2>&1 | tee /tmp/livedb-test.log
          for t in TestLiveDB_BalanceForOwner_RejectsNonOwner \
                   TestLiveDB_TargetBalanceForMember_RejectsNonMember \
                   TestLiveDB_PenaltyRate_IsServerSideNotCallerSupplied \
                   TestLiveDB_TradingWallet_MoneyPath \
                   TestAdminConsole_Dashboard \
                   TestAdminConsole_GetOrders \
                   TestTally_CountsThePurchaseWhenTheWebhookCreditsIt \
                   TestTally_RefusesToReCreditAfterARefundAndRecordsWhy \
                   TestRegistration_RejectsASecondLiveApplicationForTheSameContest \
                   TestMirror_CreatesTheLegacyRowSoTheContestCanHoldPackages; do
            grep -q -- "--- PASS: $t" /tmp/livedb-test.log \
              || { echo "::error::$t did not run (skipped?) — live-DB coverage is not gating"; exit 1; }
          done

      - name: Full tsc --noEmit (both frontends)
        run: make tsc

      - name: Migration fresh replay from zero (clean-apply + RLS check)
        run: make migrate-reset

      - name: Security / dependency scan
        run: make security-scan

      # `docker build` pulls golang:*-alpine + alpine:* from Docker Hub by tag.
      # public.ecr.aws/docker/library carries the SAME Docker Official Image
      # digests with no anonymous pull quota — pre-pull there, tag under the
      # docker.io names, and the build's FROMs resolve from the local image
      # store without touching Docker Hub. Falls back to a retried docker.io
      # pull inside the script if ECR itself is down. Dockerfile unchanged, so
      # Railway/Render builds behave exactly as before.
      - name: Pre-pull Dockerfile base images via the ECR Public mirror
        run: bash scripts/ci/mirror-docker-base-images.sh backend/Dockerfile
      # Wrapped in bounded retry+backoff — apk/go-mod fetches inside the build
      # can still flake on transient network errors even with bases cached.
      - name: Build-once image (tagged by commit SHA)
        run: SHA=${{ github.sha }} bash scripts/ci/with-retry.sh make docker-build
