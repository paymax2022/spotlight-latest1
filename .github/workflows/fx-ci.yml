# Called by ci.yml, which is the single pipeline for a push or PR. This lane no
# longer has its own push/pull_request trigger: fourteen workflows starting on one
# push meant fourteen queued pipelines competing for the same runners. ci.yml now
# decides whether this module changed (scripts/ci/changed-modules.py, driven by
# .github/module-filters.json) and calls this file as a reusable workflow, so its
# jobs report inside that one run. Paths live ONLY in module-filters.json now.
name: FX CI

# Runs the two environment-blocked verification steps automatically in a
# Go-enabled, network-enabled CI runner: backend compile/vet/test and client
# type-checks. (Authoring sandbox had no Go toolchain and no network.)

on:
  workflow_call:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (orchestration)
        run: go test ./internal/orchestration/... -count=1 -v
      # Repo-wide `go test ./...` removed: ci.yml's ungated `backend` job now runs
      # the whole backend suite against a real Postgres, so this lane repeating it
      # WITHOUT a database was both slower and weaker — every live-DB suite skipped
      # here while reporting "ok". The scoped run above stays: it is fast, it is
      # verbose, and it names this module when it fails.

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate OpenAPI
        run: |
          python3 -c "import yaml; yaml.safe_load(open('contracts/openapi.yaml')); print('OpenAPI YAML valid')"

  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app/reactnative
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Typecheck FX module
        run: npx tsc --noEmit -p tsconfig.fxcheck.json
