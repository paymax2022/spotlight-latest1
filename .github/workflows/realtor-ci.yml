# Called by ci.yml, which is the single pipeline for a push or PR. This lane no
# longer has its own push/pull_request trigger: fourteen workflows starting on one
# push meant fourteen queued pipelines competing for the same runners. ci.yml now
# decides whether this module changed (scripts/ci/changed-modules.py, driven by
# .github/module-filters.json) and calls this file as a reusable workflow, so its
# jobs report inside that one run. Paths live ONLY in module-filters.json now.
name: Realtor CI

# Verifies the realtor module on a full Node + network runner:
#  - mobile module type-check (scoped tsconfig)
#  - frontend-web type-check + lint (covers the AI route)
#  - SQL migration sanity (additive-only guard)
# (The authoring sandbox cannot complete a full project tsc nor run Postgres.)

on:
  workflow_call:
  workflow_dispatch:

jobs:
  backend:
    name: Go build / vet (realtor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - name: Build (whole backend — catches wiring/import breaks)
        run: go build ./...
      - name: Vet (realtor)
        run: go vet ./internal/realtor/...
      # backend/internal/realtor has no _test.go files yet. When it gains tests,
      # add: go test ./internal/realtor/... -count=1

  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app/reactnative
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Without this the RN dependency tree is installed from scratch every
          # run: npm ci measured 276-421s here against 5-6s for the typecheck it
          # exists to enable. ci.yml's own mobile job has had the cache all along;
          # these lanes were simply never given it.
          cache: npm
          cache-dependency-path: mobile-app/reactnative/package-lock.json
      - run: npm ci
      - name: Typecheck realtor module (scoped)
        run: npx tsc --noEmit -p tsconfig.realtorcheck.json

  migration-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject destructive DDL in realtor migrations (additive-only)
        run: |
          set -e
          FILES=$(ls supabase/migrations/*realtor*.sql 2>/dev/null || true)
          if [ -z "$FILES" ]; then echo "no realtor migrations"; exit 0; fi
          if grep -iE '\b(drop\s+(table|column)|alter\s+column|drop\s+not\s+null)\b' $FILES; then
            echo "::error::Destructive DDL found in realtor migration (must be additive-only)"; exit 1;
          fi
          echo "Additive-only guard passed for: $FILES"

  migration-apply-and-rpc-tests:
    # Applies the realtor migrations to a real Postgres and runs the RPC
    # invariant tests (idempotent pay, no-double-booking, sold-out, dashboard).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: realtor_ci }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      PSQL: psql -h localhost -U postgres -d realtor_ci -v ON_ERROR_STOP=1 -q
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Supabase shim (extensions + auth helpers)
        run: $PSQL -f supabase/tests/_supabase_shim.sql
      - name: Apply realtor migrations (in order)
        run: |
          set -e
          for m in \
            20260620000000_realtor_property_graph \
            20260620010000_realtor_lease_payments \
            20260620020000_realtor_backend_rpcs \
            20260620030000_realtor_maintenance \
            20260620040000_realtor_hotel; do
            echo "applying $m"; $PSQL -f "supabase/migrations/${m}.sql"
          done
      - name: Run RPC invariant tests
        run: $PSQL -f supabase/tests/realtor_rpcs.test.sql
