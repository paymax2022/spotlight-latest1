name: Fix Staging Admin Backend URL

# Manually triggered workflow to update the ADMIN_API_BASE_URL on the staging
# frontend-admin service. This corrects the configuration so the admin dashboard
# points to the correct staging backend (backend-staging-d9bb instead of f5x6).
#
# The admin dashboard uses two environment variables:
# - NEXT_PUBLIC_ADMIN_API_BASE_URL (client-side, inlined at build time)
# - ADMIN_API_BASE_URL (server-side proxy, read at runtime)
#
# Both need to point to: https://backend-staging-d9bb.up.railway.app

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type FIX to confirm updating the staging admin backend URL'
        required: true
        type: string

permissions:
  contents: read

jobs:
  fix-backend-url:
    name: Update Staging Admin Backend Configuration
    if: ${{ inputs.confirm == 'FIX' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
      PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
      SERVICE: frontend-admin
      ENVIRONMENT: staging
    steps:
      - name: Check Railway token is present
        run: ': "${RAILWAY_TOKEN:?missing secret RAILWAY_TOKEN_STAGING}"'

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1

      - name: Update ADMIN_API_BASE_URL to correct backend
        run: |
          set -euo pipefail
          BACKEND_URL="https://backend-staging-d9bb.up.railway.app"
          echo "Setting ADMIN_API_BASE_URL=$BACKEND_URL"
          printf '%s' "$BACKEND_URL" | railway variable set ADMIN_API_BASE_URL --stdin \
            --service "$SERVICE" --environment "$ENVIRONMENT" --project "$PROJECT" \
            --skip-deploys
          echo "✓ ADMIN_API_BASE_URL updated"

      - name: Verify the update was applied
        run: |
          set -euo pipefail
          railway variable list --service "$SERVICE" --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > vars.json
          node -e '
            const vars = JSON.parse(require("fs").readFileSync("vars.json", "utf8"));
            const val = vars.ADMIN_API_BASE_URL;
            if (val === "https://backend-staging-d9bb.up.railway.app") {
              console.log("✓ ADMIN_API_BASE_URL is correctly set to backend-staging-d9bb");
              process.exit(0);
            } else {
              console.error("✗ ADMIN_API_BASE_URL is: " + val);
              process.exit(1);
            }
          '

      - name: Trigger frontend-admin redeploy
        run: |
          set -euo pipefail
          echo "Redeploying frontend-admin to apply new configuration..."
          railway redeploy --service "$SERVICE" --environment "$ENVIRONMENT" \
            --project "$PROJECT" --yes

      - name: Wait for deployment to complete
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            st=$(railway deployment list --service "$SERVICE" --environment "$ENVIRONMENT" \
                   --project "$PROJECT" --limit 5 --json 2>/dev/null \
                 | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{const r=JSON.parse(d);console.log((r[0]&&r[0].status)||"")}catch{console.log("")}})')
            echo "  attempt $i: ${st:-unknown}"
            case "$st" in
              SUCCESS) echo "✓ frontend-admin deployment successful"; break ;;
              FAILED|CRASHED|REMOVED) echo "✗ deployment ended $st"; exit 1 ;;
            esac
            sleep 15
          done

      - name: Verify admin dashboard can reach backend
        run: |
          set -euo pipefail
          echo "Testing admin dashboard connectivity to backend..."
          for i in $(seq 1 10); do
            response=$(curl -s -w "\n%{http_code}" https://frontend-admin-staging-ade6.up.railway.app/api/admin/overview || echo "ERROR")
            status=$(echo "$response" | tail -1)
            echo "  attempt $i: HTTP $status"
            if [ "$status" = "503" ]; then
              # 503 is expected (admin API not configured on backend)
              # but it means connectivity is working
              echo "✓ Admin dashboard successfully connected to backend (503 is expected)"
              exit 0
            elif [ "$status" = "200" ]; then
              echo "✓ Admin dashboard connected to backend"
              exit 0
            fi
            sleep 10
          done
          echo "Could not verify connectivity after retries"
          exit 1

      - name: Summary
        run: |
          echo "✓ Frontend-admin staging configuration fixed!"
          echo "  - ADMIN_API_BASE_URL updated to: https://backend-staging-d9bb.up.railway.app"
          echo "  - Service redeployed"
          echo "  - Connectivity verified"
          echo ""
          echo "The admin dashboard at https://frontend-admin-staging-ade6.up.railway.app"
          echo "should now connect to the correct backend."
