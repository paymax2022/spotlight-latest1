name: admin drift guard

# Spotlight has two admin consoles. frontend-web/app/admin is an unfinished COPY
# of frontend-admin (441 pages byte-identical); frontend-admin is the agreed
# survivor and frontend-web/app/admin is deleted at the end of the migration.
#
# Both surfaces kept receiving work after the copy stalled, and nine pages
# diverged. Anything added to the retiring surface from here on lands in a
# directory scheduled for deletion — it disappears silently at that point.
#
# This guard fails a PR that edits the retiring surface WITHOUT carrying the same
# work to the survivor. Deletions are exempt: removing those files IS the
# retirement. Standalone and path-filtered (same shape as adr-guard.yml) so it
# costs nothing on the vast majority of PRs that touch neither directory.

on:
  pull_request:
    paths:
      - 'frontend-web/app/admin/**'
      - 'frontend-admin/app/admin/**'

permissions:
  contents: read

jobs:
  guard:
    name: admin surfaces (no stranded work)
    runs-on: ubuntu-latest
    steps:
      # Full history: the check diffs the PR against its merge base, which a
      # shallow clone would not contain.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the retiring admin surface is not edited in isolation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/check-admin-surface-drift.sh
