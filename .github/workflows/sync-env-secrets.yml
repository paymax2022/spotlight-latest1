name: Sync environment secrets

# Brings the backend's signing secrets and provider keys to the same SHAPE in
# Development, Staging and Production - same variable names everywhere, per-
# environment VALUES. Run it once per target.
#
# ── WHAT IT DOES ─────────────────────────────────────────────────────────────
#  * Generates, only if ABSENT, ASSOC_CARD_SIGNING_SECRET and the three
#    ARENA_SIGNING_SEED_* (base64 of 32 bytes). Never rotates: rotating the
#    association secret invalidates every membership card already issued.
#    An existing but malformed seed fails the run instead of being replaced.
#  * Copies MAPS_GOOGLE_KEY and PAYSTACK_SECRET_KEY from the repo secrets
#    MAPS_GOOGLE_KEY_<TARGET> / PAYSTACK_SECRET_KEY_<TARGET> (TARGET =
#    DEVELOPMENT | STAGING | PRODUCTION). Written only when the variable is
#    absent, unless `overwrite_provider_keys` is set. Paystack keys are
#    prefix-checked: production must be sk_live_, development/staging sk_test_.
#  * Outside development sets RAILS_MODE=live when it is unset/fake/off.
#  * Refuses to run if APP_ENV on the service does not match the target (a
#    wrong token pointing at the wrong environment).
#  * Does NOT redeploy. The backend reads these at startup, so they take effect
#    on the next deploy - after the backend containing the mock guard
#    (config.go MocksAllowed) is live, which is what makes a missing one fatal.
#
# Mock data lives only in Development: Staging and Production are validated at
# boot by config.Validate and refuse to start on a mock provider or the public
# dev signing key.
#
# ── SAFETY ───────────────────────────────────────────────────────────────────
# workflow_dispatch only. Values never reach a command line, a log or an
# error message - they travel through 0600 files and `--stdin`; only names and
# verdicts are printed. `railway variable list --json` only, never `--kv`
# (raw values leaked ADMIN_API_KEY on run 32545670584).

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which environment to sync'
        required: true
        type: choice
        options: [DEVELOPMENT, STAGING, PRODUCTION]
      confirm:
        description: 'Type SET (or SET PRODUCTION when the target is PRODUCTION)'
        required: true
        type: string
      overwrite_provider_keys:
        description: 'Also replace MAPS_GOOGLE_KEY / PAYSTACK_SECRET_KEY when already set'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-env-secrets-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  sync:
    name: sync ${{ inputs.target }} backend secrets
    if: ${{ (inputs.target != 'PRODUCTION' && inputs.confirm == 'SET') || (inputs.target == 'PRODUCTION' && inputs.confirm == 'SET PRODUCTION') }}
    runs-on: ubuntu-latest
    environment: ${{ fromJSON('{"DEVELOPMENT":"development","STAGING":"staging","PRODUCTION":"production"}')[inputs.target] }}
    env:
      RAILWAY_TOKEN: ${{ secrets[format('RAILWAY_TOKEN_{0}', inputs.target)] }}
      MAPS_GOOGLE_KEY_NEW: ${{ secrets[format('MAPS_GOOGLE_KEY_{0}', inputs.target)] }}
      PAYSTACK_SECRET_KEY_NEW: ${{ secrets[format('PAYSTACK_SECRET_KEY_{0}', inputs.target)] }}
      TARGET: ${{ inputs.target }}
      OVERWRITE: ${{ inputs.overwrite_provider_keys }}
      PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
      SERVICE: backend
    steps:
      - name: Check the Railway token is present
        run: ': "${RAILWAY_TOKEN:?missing secret RAILWAY_TOKEN_${TARGET}}"'

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1

      - name: Plan - what is missing, what is wrong
        run: |
          set -euo pipefail
          ENVIRONMENT=$(printf '%s' "$TARGET" | tr '[:upper:]' '[:lower:]')
          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_ENV"
          railway variable list --service "$SERVICE" --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > vars.json
          umask 077; mkdir -p vals
          ENVIRONMENT="$ENVIRONMENT" node - <<'JS'
          const fs = require("fs");
          const crypto = require("crypto");
          let vars;
          try { vars = JSON.parse(fs.readFileSync("vars.json", "utf8")); }
          catch { console.error("Could not parse the variable list as JSON. Refusing to print it."); process.exit(1); }
          const has = (k) => typeof vars[k] === "string" && vars[k].trim() !== "";
          const b64of32 = (v) => typeof v === "string" && /^[A-Za-z0-9+\/]+={0,2}$/.test(v.trim()) && Buffer.from(v.trim(), "base64").length === 32;
          const target = process.env.TARGET;
          const overwrite = process.env.OVERWRITE === "true";

          const expectEnv = { DEVELOPMENT: ["development"], STAGING: ["staging"], PRODUCTION: ["production", "prod"] }[target];
          const appEnv = (vars.APP_ENV || "").toLowerCase();
          console.log("  APP_ENV on the service: " + (vars.APP_ENV || "(unset)"));
          if (!expectEnv.includes(appEnv)) {
            console.error("APP_ENV does not match target " + target + " (expected " + expectEnv.join(" or ") + "). Wrong token or environment - nothing written.");
            process.exit(1);
          }

          const toSet = {};      // name -> file holding the value
          const plain = {};      // non-secret name -> value
          const failures = [];
          const report = [];
          const put = (name, value) => { fs.writeFileSync("vals/" + name, value, { mode: 0o600 }); toSet[name] = true; };

          // Generated, never rotated.
          if (has("ASSOC_CARD_SIGNING_SECRET")) report.push("ASSOC_CARD_SIGNING_SECRET: present (kept)");
          else { put("ASSOC_CARD_SIGNING_SECRET", crypto.randomBytes(48).toString("base64url")); report.push("ASSOC_CARD_SIGNING_SECRET: will generate"); }
          for (const s of ["THEORY", "PRACTICAL", "FIRSTAID"]) {
            const k = "ARENA_SIGNING_SEED_" + s;
            if (has(k)) {
              if (b64of32(vars[k])) report.push(k + ": present (kept)");
              else { failures.push(k + " is set but not base64 of exactly 32 bytes - fix or delete it by hand; refusing to overwrite"); }
            } else { put(k, crypto.randomBytes(32).toString("base64")); report.push(k + ": will generate"); }
          }

          // Provider keys come from repo secrets.
          const provider = (name, incoming, check) => {
            const cur = has(name);
            if (!incoming) {
              report.push(name + ": " + (cur ? "present on service (no repo secret supplied)" : "MISSING - add repo secret " + name + "_" + target));
              return;
            }
            const why = check(incoming.trim());
            if (why) { failures.push(name + " from repo secret rejected: " + why); return; }
            if (cur && !overwrite) { report.push(name + ": present (kept; set overwrite_provider_keys to replace)"); return; }
            put(name, incoming.trim());
            report.push(name + ": will " + (cur ? "replace" : "set"));
          };
          provider("MAPS_GOOGLE_KEY", process.env.MAPS_GOOGLE_KEY_NEW, (v) => v.length < 20 ? "shorter than a Google API key" : "");
          provider("PAYSTACK_SECRET_KEY", process.env.PAYSTACK_SECRET_KEY_NEW, (v) => {
            const want = target === "PRODUCTION" ? "sk_live_" : "sk_test_";
            return v.startsWith(want) ? "" : "must start with " + want + " for " + target + " (a test and a live key must never swap environments)";
          });
          if (has("PAYSTACK_SECRET_KEY") && !process.env.PAYSTACK_SECRET_KEY_NEW) {
            const want = target === "PRODUCTION" ? "sk_live_" : "sk_test_";
            if (!vars.PAYSTACK_SECRET_KEY.startsWith(want)) failures.push("PAYSTACK_SECRET_KEY on the service does not start with " + want + " for " + target);
          }

          if (target !== "DEVELOPMENT") {
            const rails = (vars.RAILS_MODE || "").toLowerCase();
            if (rails === "" || rails === "fake" || rails === "off") { plain.RAILS_MODE = "live"; report.push("RAILS_MODE: '" + (rails || "unset") + "' -> live"); }
            else report.push("RAILS_MODE: " + rails + " (kept)");
          }

          for (const r of report) console.log("  " + r);
          if (failures.length) { for (const f of failures) console.error("ERROR " + f); process.exit(1); }
          fs.writeFileSync("plan.json", JSON.stringify({ secrets: Object.keys(toSet), plain }));
          console.log("  plan: " + Object.keys(toSet).length + " secret(s), " + Object.keys(plain).length + " plain variable(s) to write");
          JS

      # --stdin keeps every value off the command line, as the signup-code
      # workflow does. --skip-deploys on every write: no restart is triggered.
      - name: Write the planned variables
        run: |
          set -euo pipefail
          for name in $(node -e 'for (const n of JSON.parse(require("fs").readFileSync("plan.json","utf8")).secrets) console.log(n)'); do
            railway variable set "$name" --stdin --service "$SERVICE" --environment "$ENVIRONMENT" \
              --project "$PROJECT" --skip-deploys < "vals/$name"
            echo "  wrote $name (value never printed)"
          done
          for pair in $(node -e 'const p=JSON.parse(require("fs").readFileSync("plan.json","utf8")).plain; for (const k in p) console.log(k+"="+p[k])'); do
            railway variable set "$pair" --service "$SERVICE" --environment "$ENVIRONMENT" \
              --project "$PROJECT" --skip-deploys
            echo "  wrote ${pair%%=*}"
          done
          rm -rf vals

      - name: Verify the end state
        run: |
          set -euo pipefail
          railway variable list --service "$SERVICE" --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > vars.json
          node - <<'JS'
          const fs = require("fs");
          let vars;
          try { vars = JSON.parse(fs.readFileSync("vars.json", "utf8")); }
          catch { console.error("Unparseable - refusing to print."); process.exit(1); }
          const has = (k) => typeof vars[k] === "string" && vars[k].trim() !== "";
          const b64of32 = (v) => typeof v === "string" && /^[A-Za-z0-9+\/]+={0,2}$/.test(v.trim()) && Buffer.from(v.trim(), "base64").length === 32;
          const target = process.env.TARGET;
          const checks = [
            ["ASSOC_CARD_SIGNING_SECRET", has("ASSOC_CARD_SIGNING_SECRET")],
            ["ARENA_SIGNING_SEED_THEORY", b64of32(vars.ARENA_SIGNING_SEED_THEORY)],
            ["ARENA_SIGNING_SEED_PRACTICAL", b64of32(vars.ARENA_SIGNING_SEED_PRACTICAL)],
            ["ARENA_SIGNING_SEED_FIRSTAID", b64of32(vars.ARENA_SIGNING_SEED_FIRSTAID)],
            ["MAPS_GOOGLE_KEY", has("MAPS_GOOGLE_KEY")],
            ["PAYSTACK_SECRET_KEY", has("PAYSTACK_SECRET_KEY") && vars.PAYSTACK_SECRET_KEY.startsWith(target === "PRODUCTION" ? "sk_live_" : "sk_test_")],
          ];
          if (target !== "DEVELOPMENT") checks.push(["RAILS_MODE (not fake/off)", has("RAILS_MODE") && !["fake", "off"].includes(vars.RAILS_MODE.toLowerCase())]);
          let bad = 0;
          for (const [n, ok] of checks) { if (!ok) bad++; console.log("  " + (ok ? "OK  " : "MISSING ") + n); }
          if (bad) { console.error("\n" + bad + " item(s) still missing - add the matching repo secret(s) (MAPS_GOOGLE_KEY_" + target + ", PAYSTACK_SECRET_KEY_" + target + ") and re-run. Red here means NOT in sync, not that a write failed."); process.exit(1); }
          console.log("\n" + target + " is in sync.");
          JS
