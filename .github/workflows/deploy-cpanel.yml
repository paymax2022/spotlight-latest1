name: Deploy to Namecheap cPanel (SSH)

# Status: inert lane IN THIS REPO. It has never completed a run (0 successes in
# 843 runs since 2026-05-30) because the five secrets below have never existed at
# repo level, which is the only level this job can read (it declares no
# `environment:`).
#
# Do NOT read that as "spotlightng.com is updated by hand" — it isn't, and this
# job is not the writer either. The production release path for frontend-web is:
# push to main here -> `.github/workflows/sync-frontend-web.yml`
# ("Spotlight Frontend Web Safe Merge", gated on
# vars.SPOTLIGHT_FRONTEND_SYNC_ENABLED) copies frontend-web/ into
# paymax2022/spotlight-latest main -> that repo's own UNGATED
# "Deploy to Namecheap cPanel (SSH)" job (which does hold CPANEL_SSH_* +
# DEPLOY_PATH) builds, rsyncs, purges .next/server/route-cache and restarts
# Passenger. That lane has been green on every sync, most recently 2026-11-11.
# So a push to main here IS a production release; turning the gate below on would
# only add a second, env-less writer to the same host.
# See docs/devops/deployment-matrix.md.
#
# Required config to activate:
#   secrets:   CPANEL_SSH_HOST, CPANEL_SSH_USER, CPANEL_SSH_KEY,
#              CPANEL_SSH_PORT, DEPLOY_PATH
#   variable:  CPANEL_DEPLOY_ENABLED = true
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-cpanel-main
  cancel-in-progress: true

jobs:
  deploy:
    # Skip (not fail) unless the deploy is explicitly switched on — same pattern as
    # deploy.yml's GCP gate. Set repo variable CPANEL_DEPLOY_ENABLED=true to activate.
    #
    # Why this exists: this job uploads a built frontend straight onto the live host
    # and restarts the app, with no environment/approval gate. It had been failing
    # harmlessly at `npm ci` (main's lockfile was out of sync) since 2026-08-10, so
    # a fix to that lockfile would silently resume real production deploys on every
    # push to main. The gate makes going live a deliberate act instead of a
    # side effect of an unrelated merge.
    #
    # It was removed on 2026-10-28 (1e1e44f45), and every push to main has carried
    # this lane's red check ever since. Before switching it back on, note that the
    # build below has no `.env.production` in the checkout: `npm run build` would
    # bake every NEXT_PUBLIC_* fallback — the client bundle would call
    # http://localhost:8080/api/v1 on the live site (frontend-web/src/config/env.ts
    # line 1; frontend-web/.env.production.example lists what a real build needs).
    if: ${{ vars.CPANEL_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Build frontend on GitHub
        working-directory: frontend-web
        run: |
          npm ci
          npm run build

      - name: Upload built frontend to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          source: frontend-web
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0
          overwrite: true
          rm: false

      - name: Finalize on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          script_stop: true
          script: |
            set -eo pipefail

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            APP_DIR="${DEPLOY_PATH}/frontend-web"

            printf '%s\n' \
              '# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION BEGIN' \
              'PassengerAppRoot "/home/specenpo/public_html/spotlightng_v2/frontend-web"' \
              'PassengerBaseURI "/"' \
              'PassengerNodejs "/home/specenpo/nodevenv/public_html/spotlightng_v2/frontend-web/20/bin/node"' \
              'PassengerAppType node' \
              'PassengerStartupFile server.js' \
              '# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION END' \
              > "${APP_DIR}/.htaccess"

            mkdir -p "${APP_DIR}/tmp"
            touch "${APP_DIR}/tmp/restart.txt"

            echo "Deployed to: ${APP_DIR}"
            echo "Passenger .htaccess written and app restart triggered."
