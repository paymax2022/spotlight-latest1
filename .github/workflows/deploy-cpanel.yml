name: Deploy to Namecheap cPanel (SSH)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-cpanel-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Build frontend on GitHub
        working-directory: frontend-web
        run: |
          npm ci
          npm run build

      - name: Upload built frontend to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          source: frontend-web
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0
          overwrite: true
          rm: false

      - name: Finalize on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          script_stop: true
          script: |
            set -eo pipefail

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            APP_DIR="${DEPLOY_PATH}/frontend-web"

            echo "Deployed to: ${APP_DIR}"
            echo "Build was completed on GitHub Actions (cPanel shared hosting cannot run next build)."
            echo ""
            echo "Next: restart the Node.js app in cPanel (Setup Node.js App -> Restart)."
