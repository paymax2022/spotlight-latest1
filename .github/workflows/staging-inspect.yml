name: Staging inspect

# READ-ONLY diagnostics for the staging environment. Writes nothing, deploys
# nothing, and never prints a variable's VALUE.
#
# Answers the three things that cannot be determined from the repo:
#   1. the public domains (needed for EXPO_PUBLIC_API_BASE_URL — the mobile app
#      talks to frontend-web, which proxies to Go, NOT to the backend directly)
#   2. whether frontend-web has the variables its Go proxy needs
#   3. what the module gate is actually refusing, from the backend's own logs
#
# ── ON PRINTING ──────────────────────────────────────────────────────────────
# `railway variable list --kv` prints RAW VALUES and leaked ADMIN_API_KEY into a
# job log once already (run 32545670584). This workflow uses --json and reports
# only NAMES and boolean shape checks. Nothing here echoes a value, and the
# parse-failure path refuses to print the unparsed input.
#
# Log output is filtered to modulegate lines rather than dumped, so application
# logs cannot spill arbitrary content into a job log either.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which Railway environment to inspect (READ-ONLY either way)'
        type: choice
        options: [staging, production]
        default: staging
      log_lines:
        description: 'How many recent backend log lines to scan for gate refusals'
        type: string
        default: '500'
      auth_probe:
        description: 'Mint a throwaway confirmed user and call the module endpoints THROUGH frontend-web with a real Bearer, exactly as the APK does (status + shape only; user deleted afterwards)'
        type: boolean
        default: false
      fix_database_url:
        description: 'PRODUCTION ONLY: verify SUPABASE_DB_PASSWORD against the pooler and rewrite backend DATABASE_URL with it if the check passes'
        type: boolean
        default: false
      fix_staging_frontends:
        description: 'STAGING ONLY: set rootDirectory=frontend-web / frontend-admin on the two UI services (they currently build the repo-root Dockerfile = Go backend) and redeploy'
        type: boolean
        default: false
      fix_env_parity:
        description: 'Apply the staging->prod baseline fixes: sync FEATURE_* + APP_ENV onto backend, apply missing bridge/otp DDL via Supabase Management API, and READ the GoTrue auth config (signup budget) for diagnosis. Values are never printed.'
        type: boolean
        default: false
      fix_vote_bridge:
        description: 'Set VOTES_BRIDGE_ENABLED=true on frontend-web of the target env. ONLY after the kyc-gate schema fix is deployed there — the bridged path 404s votes without it.'
        type: boolean
        default: false
      copy_staging_to_prod:
        description: 'COPY staging service variables -> production, per service. Excludes Railway built-ins, anything Supabase/DB-related (prod keeps its own), ports/env names; rewrites staging railway domains to prod domains; forces *_USE_MOCK=false. Values never printed; Paystack key MODE (test/live) is reported.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-inspect
  cancel-in-progress: true

jobs:
  inspect:
    name: inspect staging (read-only)
    runs-on: ubuntu-latest
    # Tracks the inspected environment so SUPABASE_DB_PASSWORD resolves from the
    # `production` environment when that is the target. Inspecting production
    # therefore also answers to the Production environment's required reviewers.
    environment: ${{ inputs.environment }}
    env:
      # Same Railway project for both; only the environment and token differ.
      RAILWAY_TOKEN: ${{ inputs.environment == 'production' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_STAGING }}
      PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Check the Railway token is present
        run: ': "${RAILWAY_TOKEN:?missing secret RAILWAY_TOKEN_STAGING}"'

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1

      - name: Public domains
        run: |
          set -uo pipefail
          for svc in frontend-web backend frontend-admin; do
            echo "--- $svc ---"
            railway domain list --service "$svc" --environment "$ENVIRONMENT" \
              --project "$PROJECT" 2>&1 | sed 's/^/    /' || echo "    (no domains, or the service has none generated)"
          done

      # Names only. A missing GO_BACKEND_URL is the failure that makes every API
      # call fail while looking like an app bug: the Next proxy falls back to
      # http://localhost:8080, which resolves to nothing on Railway.
      - name: frontend-web variables (names + shape checks, never values)
        run: |
          set -uo pipefail
          railway variable list --service frontend-web --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > fw.json || true
          node -e '
            let v;
            try { v = JSON.parse(require("fs").readFileSync("fw.json","utf8")); }
            catch { console.error("Unparseable output - refusing to print it (it would contain values)."); process.exit(1); }
            console.log("  variable NAMES set on frontend-web:");
            for (const k of Object.keys(v).sort()) console.log(`    ${k}`);
            const shape = (k, test) => {
              const raw = v[k];
              if (raw === undefined) return `${k}: NOT SET`;
              return `${k}: set, ${test(String(raw)) ? "looks right" : "SET BUT LOOKS WRONG"}`;
            };
            // GO_BACKEND_URL host+port ONLY. An internal Railway hostname is not a
            // credential, and the port is the whole diagnosis: the Go server binds
            // :$APP_PORT (default 8080), so a private URL naming any other port
            // hangs rather than errors. userinfo/path/query are dropped in case a
            // credential was ever embedded.
            try {
              const u = new URL(String(v.GO_BACKEND_URL));
              console.log(`\n  GO_BACKEND_URL target: ${u.protocol}//${u.hostname}:${u.port || "(default)"}`);
            } catch { console.log("\n  GO_BACKEND_URL: unset or unparseable"); }
            console.log("  backend APP_PORT is checked separately below.");
            console.log("\n  shape checks (values not printed):");
            console.log("    " + shape("GO_BACKEND_URL", (s) => /^https?:\/\//.test(s) && !/localhost|127\.0\.0\.1/.test(s)));
            console.log("    " + shape("NEXT_PUBLIC_SUPABASE_URL", (s) => /^https:\/\/[a-z0-9]{20}\.supabase\.co/.test(s)));
            console.log("    " + shape("SUPABASE_SERVICE_ROLE_KEY", (s) => s.length > 20));
            for (const k of ["GO_API_BASE_URL","GO_BACKEND_WS_URL","NEXT_PUBLIC_API_URL"]) {
              console.log(`    ${k}: ${v[k] === undefined ? "NOT SET" : "set"}`);
            }
            // PAYSTACK_SECRET_KEY: wallet topup (frontend-web/src/server/wallet/service.ts,
            // POST /api/v1/wallet/topup) and voting/transfers payment code call Paystack
            // directly FROM frontend-web, using frontend-web own process.env — a
            // separate Railway service from backend, which has its own separate
            // PAYSTACK_SECRET_KEY (checked below). Missing here throws "Paystack is not
            // configured" (500) on every topup even when backend has the key.
            console.log("    " + shape("PAYSTACK_SECRET_KEY", (s) => s.length > 20));
          '

      # NEXT_PUBLIC_SUPABASE_ANON_KEY is publishable by design — it ships to every
      # browser and mobile client and is bound by RLS, so printing it leaks nothing.
      # The mobile production build needs this exact value for eas.json.
      - name: frontend-web publishable Supabase key (PUBLIC value — safe to print)
        if: inputs.environment == 'production'
        run: |
          set -uo pipefail
          railway variable list --service frontend-web --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > fw-pub.json || true
          node -e '
            const v = JSON.parse(require("fs").readFileSync("fw-pub.json","utf8"));
            const k = String(v.NEXT_PUBLIC_SUPABASE_ANON_KEY ?? "");
            if (!/^(eyJ|sb_publishable_)/.test(k)) { console.log("  publishable key NOT SET or unexpected shape"); process.exit(0); }
            console.log("  NEXT_PUBLIC_SUPABASE_ANON_KEY (public, publishable):");
            console.log("    " + k);
          ' || echo "  (could not read publishable key)"
          rm -f fw-pub.json

      - name: backend APP_PORT (name + value; a port is not a secret)
        run: |
          set -uo pipefail
          railway variable list --service backend --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > be.json || true
          node -e '
            let v; try { v = JSON.parse(require("fs").readFileSync("be.json","utf8")); }
            catch { console.error("Unparseable - refusing to print."); process.exit(1); }
            // RequireAdmin now FAILS CLOSED: an unset ADMIN_API_KEY refuses admin
            // routes unless APP_ENV is exactly "development". Presence + APP_ENV is
            // all that is needed to predict that, and the value is never printed.
            const keySet = v.ADMIN_API_KEY !== undefined && String(v.ADMIN_API_KEY).length > 0;
            const env = v.APP_ENV ?? "NOT SET";
            console.log("  ADMIN_API_KEY = " + (keySet ? "set" : "NOT SET"));
            console.log("  APP_ENV       = " + env);
            if (keySet) console.log("  -> admin routes ENFORCE the key.");
            else if (env === "development") console.log("  -> admin routes are UNGATED (development exception).");
            else console.log("  -> admin routes will return 503 after the next deploy (fail-closed).");
            console.log("  APP_PORT   = " + (v.APP_PORT ?? "NOT SET (Go binds :8080 by default)"));
            console.log("  PORT       = " + (v.PORT ?? "NOT SET"));
            console.log("  APP_ENV    = " + (v.APP_ENV ?? "NOT SET"));
            // Insurance provider credentials: PRESENCE, LENGTH and a short SHA256
            // prefix only — never the value. The digest is the point: comparing it
            // against the same digest of the intended key proves whether staging
            // holds the right secret WITHOUT either side printing one. Length
            // catches a trailing newline, which shows as one character more than
            // expected — exactly how the last one hid.
            const crypto = require("crypto");
            const shape = (name) => {
              const raw = v[name];
              if (raw === undefined || String(raw).length === 0) return name + " = NOT SET";
              const str = String(raw);
              const dig = crypto.createHash("sha256").update(str).digest("hex").slice(0, 12);
              const ws = /\s$/.test(str) ? "  !! ENDS IN WHITESPACE" : "";
              return name + " = set (len " + str.length + ", sha256 " + dig + ")" + ws;
            };
            for (const n of ["INSURANCE_MYCOVER_API_KEY","INSURANCE_MYCOVER_WEBHOOK_SECRET","INSURANCE_MYCOVER_BASE_URL","FEATURE_INSURANCE_ENABLED"]) {
              console.log("  " + shape(n));
            }
            // MapService (address autocomplete/geocode). FEATURE_MAPS_ENABLED gates
            // whether /api/finance/maps/* is mounted at all (401 vs 404 from outside
            // — see staging-environment-topology memory). MAPS_GOOGLE_KEY gates
            // whether the "google" autocomplete adapter is the REAL Google Places API
            // or a deterministic MockProvider standing in under the same name
            // (internal/maps/routes.go buildRegistry) — the route still answers 200
            // either way, so this is the only way to tell them apart without a live
            // user token.
            console.log("\n  FEATURE_MAPS_ENABLED = " + (v.FEATURE_MAPS_ENABLED ?? "NOT SET (defaults false)"));
            console.log("  " + shape("MAPS_GOOGLE_KEY"));
            // Same presence/length/hash-only pattern for the Paystack secret —
            // confirms a rotation actually landed on this Railway service
            // without ever printing or comparing the real value here.
            console.log("  " + shape("PAYSTACK_SECRET_KEY"));
          '

      # Hostnames ONLY for the services the backend points at — a hostname is
      # not a credential (same justification as the GO_BACKEND_URL print above)
      # and it is the single field that answers "is prod pointed at the prod or
      # the staging Supabase project", which cannot be determined from the repo
      # or from HTTP probes. userinfo (the DB password) and path are dropped.
      - name: backend upstream hosts (SUPABASE_URL / DATABASE_URL / REDIS_URL — hosts only)
        run: |
          set -uo pipefail
          railway variable list --service backend --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > be2.json || true
          node -e '
            let v; try { v = JSON.parse(require("fs").readFileSync("be2.json","utf8")); }
            catch { console.error("Unparseable - refusing to print."); process.exit(1); }
            const hostOnly = (name) => {
              const raw = v[name];
              if (raw === undefined || String(raw).length === 0) return name + " -> NOT SET";
              let s = String(raw);
              // normalise postgresql:// / postgres:// / rediss?:// / plain URLs
              if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = "https://" + s;
              try {
                const u = new URL(s);
                // Pooler DSNs share one host across projects — the project ref
                // lives in the USERNAME (postgres.<ref>). Print user@host; the
                // username is an identifier, not a credential — the password
                // (u.password) is never touched.
                const user = u.username ? decodeURIComponent(u.username) + "@" : "";
                return name + " -> " + user + u.hostname + (u.port ? ":" + u.port : "");
              } catch { return name + " -> set but unparseable (value not printed)"; }
            };
            for (const n of ["SUPABASE_URL","DATABASE_URL","REDIS_URL","SUPABASE_DB_URL","DIRECT_URL","SUPABASE_DIRECT_URL"]) {
              console.log("  " + hostOnly(n));
            }
            // Cross-check the frontends the same way: NEXT_PUBLIC_SUPABASE_URL
            // should name the same project as the backend SUPABASE_URL.
          '

      # Separates "wrong password" (SQLSTATE 28P01) from "pooler circuit breaker"
      # (XX000) — the two need opposite fixes and the host print above cannot
      # tell them apart. The DSN VALUE is never printed, never masked-into-logs:
      # it lives only in a shell variable feeding psql, and only the error class
      # comes back. The same check covers "backend can't reach it at all" —
      # a refused/timeout signature here points at network, not auth.
      - name: DATABASE_URL live connection test (error class only)
        run: |
          set -uo pipefail
          railway variable list --service backend --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > be-dsn.json || true
          DSN="$(node -e 'try{const v=JSON.parse(require("fs").readFileSync("be-dsn.json","utf8"));process.stdout.write(String(v.DATABASE_URL??""))}catch{}')"
          rm -f be-dsn.json
          if [ -z "$DSN" ]; then echo "  DATABASE_URL not set on backend"; exit 0; fi
          out="$(PGCONNECT_TIMEOUT=10 psql "$DSN" -w -c 'select 1' 2>&1)" && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "  CONNECT OK — credentials accepted, database reachable"
          else
            echo "  CONNECT FAILED (exit $rc)"
            echo "$out" | grep -oiE "password authentication failed[^\"]*|too many authentication failures[^\"]*|timeout|timed out|Connection refused|no route to host|could not translate host|Name or service|sslmode|self.signed|certificate" | head -3 | sed 's/^/    /' || true
            echo "$out" | grep -oE "SQLSTATE [A-Z0-9]{5}|\(28P01\)|\(XX000\)|\(08006\)|\(08001\)" | head -2 | sed 's/^/    /' || true
          fi
          # WHY the password fails, told apart without printing it:
          #   - a literal [YOUR-PASSWORD] paste   -> placeholder fingerprint
          #   - an API key where a DB password belongs -> starts eyJ / sbp_ / sk_
          #   - raw @ # / : ? & % splitting the DSN -> parse reports a different
          #     host:port than the pooler, or a mangled password length
          #   - a DIFFERENT project's password    -> length/sha only; the owner
          #     compares the digest against the intended value off-channel.
          # sha256 prefix(12) + length identify a secret without exposing it.
          DSN_CHECK="$DSN" node -e '
            const crypto = require("crypto");
            const dsn = process.env.DSN_CHECK;
            let u;
            try { u = new URL(dsn.match(/^[a-z][a-z0-9+.-]*:\/\//i) ? dsn : "postgres://" + dsn); }
            catch { console.log("  dsn: UNPARSEABLE as a URL — that alone can be the bug"); process.exit(0); }
            const safeDecode = (s) => { try { return decodeURIComponent(s); } catch { return null; } };
            let pass = safeDecode(u.password);
            const user = safeDecode(u.username) ?? u.username;
            console.log(`  parsed: user=${user} host=${u.hostname}:${u.port || "(none)"}`);
            if (pass === null) {
              // Malformed %XX in the stored password — psql/pgx send the raw
              // bytes to the server, so what the dashboard thinks the password
              // is and what arrives differ. This alone explains a 28P01.
              console.log("  !! password contains MALFORMED percent-encoding — the stored DSN sends different bytes than intended");
              pass = u.password;
            }
            console.log(`  password: length=${pass.length} sha256[0:12]=${crypto.createHash("sha256").update(pass).digest("hex").slice(0,12)}`);
            if (/^\[?(your[-_ ]?password|password)\]?$/i.test(pass)) console.log("  !! password is a PLACEHOLDER, not a real one");
            if (/^(eyJ|sbp_|sk_|service_role|anon)/i.test(pass)) console.log("  !! password looks like an API KEY, not the DB password");
            if (pass.length === 0) console.log("  !! password is EMPTY in the DSN");
            if (/[:@#?&%]/.test(u.password)) console.log("  !! password contains UNENCODED reserved chars — URL-encode it (or reset to letters+digits)");
          ' || echo "  (fingerprint script failed — non-fatal)"
          unset DSN DSN_CHECK
          # Diagnostic step: never fail the job over a failed probe — the fix
          # step after this one must still get its turn.
          exit 0

      # Remediation for the 28P01 above. SUPABASE_DB_PASSWORD only resolves when
      # this job runs in the `production` environment (the input selects it), so
      # a staging inspection can never touch the prod password. The candidate
      # DSN keeps the EXISTING variable's scheme/user/host/port/db and swaps only
      # the password — if the secret rejects too, nothing is written and the
      # report says which side is wrong. --stdin: the value never enters a
      # command line, a log, or this job's output.
      - name: Fix backend DATABASE_URL from SUPABASE(_STAGING)_DB_PASSWORD (verify-then-write)
        if: inputs.environment == 'production' || inputs.environment == 'staging'
        env:
          SB_DB_PW: ${{ inputs.environment == 'production' && secrets.SUPABASE_DB_PASSWORD || secrets.SUPABASE_STAGING_DB_PASSWORD }}
          FIX_DB: ${{ inputs.fix_database_url }}
        run: |
          set -uo pipefail
          [ -n "${SB_DB_PW:-}" ] || { echo "  SUPABASE(_STAGING)_DB_PASSWORD not visible in this environment — nothing to do"; exit 0; }
          railway variable list --service backend --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > be-dsn2.json || true
          CAND="$(SB_DB_PW="$SB_DB_PW" node -e '
            const v = JSON.parse(require("fs").readFileSync("be-dsn2.json","utf8"));
            const raw = String(v.DATABASE_URL ?? "");
            if (!raw) { process.exit(3); }
            const u = new URL(raw.match(/^[a-z][a-z0-9+.-]*:\/\//i) ? raw : "postgres://" + raw);
            u.password = process.env.SB_DB_PW;   // setter percent-encodes; do NOT pre-encode
            if (!u.pathname || u.pathname === "/") u.pathname = "/postgres";
            process.stdout.write(u.toString());
          ')" || { echo "  DATABASE_URL missing/unparseable — cannot rebuild"; exit 1; }
          rm -f be-dsn2.json
          out="$(PGCONNECT_TIMEOUT=10 psql "$CAND" -w -c 'select 1' 2>&1)" && rc=0 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "  candidate REJECTED — SUPABASE_DB_PASSWORD itself fails auth:"
            echo "$out" | grep -oiE "password authentication failed[^\"]*|too many authentication failures[^\"]*|timeout|could not translate" | head -2 | sed 's/^/    /' || true
            exit 0
          fi
          echo "  candidate verified — SUPABASE_DB_PASSWORD connects cleanly"
          if [ "$FIX_DB" = "true" ]; then
            printf '%s' "$CAND" | railway variable set DATABASE_URL --stdin \
              --service backend --environment "$ENVIRONMENT" --project "$PROJECT" \
              && echo "  DATABASE_URL rewritten on backend — Railway will redeploy"
          else
            echo "  fix_database_url=false — verified only, variable left as-is"
          fi
          unset SB_DB_PW CAND

      # STAGING-ONLY remediation for the misdeployed UI services: with
      # rootDirectory unset they build the repo-root Dockerfile (the Go
      # backend), which is why every page route 404s in text/plain while
      # /readyz answers with Go JSON. Prod services already carry the correct
      # root directories — this replicates that on staging. GraphQL errors are
      # printed verbatim; they carry no secrets.
      #
      # Project tokens must authenticate via the `Project-Access-Token` header
      # (NOT `Authorization: Bearer` — that yields "Not Authorized" on every
      # query). The token is also scoped to ONE environment, so
      # `projectToken { projectId environmentId }` resolves the environment id
      # directly without an account-level `project` query.
      - name: Fix staging frontend services (rootDirectory + redeploy)
        if: inputs.environment == 'staging' && inputs.fix_staging_frontends
        run: |
          set -uo pipefail
          API=https://backboard.railway.app/graphql/v2
          gql() { curl -sS -m 30 "$API" -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H 'content-type: application/json' -d "$1"; }
          echo "--- projectToken scope ---"
          gql '{"query":"{ projectToken { projectId environmentId } }"}' | head -c 400; echo
          IDS="$(gql '{"query":"{ project(id: \"'"$PROJECT"'\") { environments { edges { node { id name } } } services { edges { node { id name } } } } }"}')" || true
          echo "$IDS" | node -e '
            let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
              let j;
              try { j=JSON.parse(d); }
              catch { console.log("  raw API response (not JSON):", d.slice(0,300)); process.exit(0); }
              if (j.errors) { console.log("  project query errors:", JSON.stringify(j.errors).slice(0,500)); process.exit(0); }
              const env=j.data.project.environments.edges.map(e=>e.node).find(n=>n.name==="'"$ENVIRONMENT"'");
              const svcs=j.data.project.services.edges.map(e=>e.node);
              const want=["frontend-web","frontend-admin"];
              for (const w of want) {
                const s=svcs.find(n=>n.name===w);
                console.log((env&&s)?`${w} ${s.id} env=${env.id}`:`MISSING ${w} or env`);
              }
            });' > ids.txt || true
          cat ids.txt | sed 's/^/    /'
          if grep -q "MISSING\|errors:\|not JSON" ids.txt; then
            echo "  project query failed — falling back to deployments listing for service ids"
            EID="$(gql '{"query":"{ projectToken { environmentId } }"}' \
              | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).data.projectToken.environmentId)}catch{console.log("")}})')"
            echo "    token environmentId: ${EID:-unresolved}"
            [ -n "$EID" ] && gql "{\"query\":\"{ deployments(first: 30, input: { projectId: \\\"$PROJECT\\\", environmentId: \\\"$EID\\\" }) { edges { node { id serviceId service { id name } } } } }\"}" \
              | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
                  let j; try{j=JSON.parse(d)}catch{console.log("  deployments resp not JSON:",d.slice(0,300));process.exit(0)}
                  if (j.errors){console.log("  deployments errors:",JSON.stringify(j.errors).slice(0,400));process.exit(0)}
                  const seen={};
                  for (const e of j.data.deployments.edges){
                    const n=e.node; const name=n.service?n.service.name:"?"; const sid=n.serviceId||(n.service&&n.service.id);
                    if (["frontend-web","frontend-admin"].includes(name) && sid && !seen[name]){seen[name]=1;console.log(`${name} ${sid}`)}
                  }}' > ids2.txt || true
            cat ids2.txt | sed 's/^/    /'
            [ -n "$EID" ] && while read -r SVC SID; do
              [ -n "$SVC" ] && [ -n "$SID" ] && echo "$SVC $SID env=$EID" >> ids.fixed.txt
            done < ids2.txt
            [ -f ids.fixed.txt ] && mv ids.fixed.txt ids.txt
          fi
          grep -q "env=" ids.txt || { echo "  could not resolve service/env ids — aborting fix"; exit 0; }
          while read -r SVC SID REST; do
            EID="${REST#env=}"
            echo "  -> $SVC ($SID) rootDirectory=$SVC (env $EID)"
            RESP="$(node -e '
              const body = JSON.stringify({
                query: "mutation($s:String!,$e:String!,$d:String!){ serviceInstanceUpdate(serviceId:$s, environmentId:$e, input:{ rootDirectory:$d }) }",
                variables: { s: process.argv[1], e: process.argv[2], d: process.argv[3] },
              });
              fetch("https://backboard.railway.app/graphql/v2", {
                method: "POST",
                headers: { "Project-Access-Token": process.env.RAILWAY_TOKEN, "content-type": "application/json" },
                body,
              }).then(r => r.text()).then(t => process.stdout.write(t.slice(0, 400)));
            ' "$SID" "$EID" "$SVC")"
            echo "    $RESP" | head -c 400; echo
          done < ids.txt
          # Redeploy re-runs the build pipeline on the same commit, and the
          # build reads the freshly-set rootDirectory. Verify with the domain
          # probes below — a reused image would still serve Gin.
          # If the latest deployment is in a terminal state (e.g. REMOVED),
          # `railway redeploy` fails — fall back to a fresh deploymentTrigger.
          for SVC in frontend-web frontend-admin; do
            if railway redeploy --service "$SVC" --environment "$ENVIRONMENT" --project "$PROJECT" --yes; then
              echo "  redeploy triggered: $SVC"
            else
              SID="$(grep -E "^${SVC} " ids.txt | awk '{print $2}')"
              echo "  redeploy failed, trying deploymentTriggerCreate for $SVC ($SID)"
              RESP="$(node -e '
                const body = JSON.stringify({
                  query: "mutation($i:DeploymentTriggerCreateInput!){ deploymentTriggerCreate(input:$i){ id } }",
                  variables: { i: { projectId: process.env.PROJECT, environmentId: process.argv[1], serviceId: process.argv[2] } },
                });
                fetch("https://backboard.railway.app/graphql/v2", {
                  method: "POST",
                  headers: { "Project-Access-Token": process.env.RAILWAY_TOKEN, "content-type": "application/json" },
                  body,
                }).then(r => r.text()).then(t => process.stdout.write(t.slice(0, 400)));
              ' "$(grep -E "^${SVC} " ids.txt | sed -E 's/.*env=//')" "$SID")"
              echo "    $RESP" | head -c 400; echo
            fi
          done
          rm -f ids.txt ids2.txt

      # ── fix_env_parity ────────────────────────────────────────────────────
      # Replicates the staging-proven environment onto the TARGET environment.
      # Safe by construction: FEATURE_* are booleans, APP_ENV is set to the
      # target name literally, and no credential values are copied or printed.
      - name: "Fix: VOTES_BRIDGE_ENABLED on frontend-web"
        if: inputs.fix_vote_bridge
        run: |
          set -uo pipefail
          # frontend-web runs the /api/v2/votes/free Next.js route; without this
          # flag bridgedCastFreeVote falls through to legacy castFreeVote, which
          # performs NO idempotency dedup (replay = second vote counted).
          railway variable set VOTES_BRIDGE_ENABLED=true \
            --service frontend-web --environment "$ENVIRONMENT" --project "$PROJECT" \
            && echo "  VOTES_BRIDGE_ENABLED=true set on frontend-web ($ENVIRONMENT) — triggers redeploy"

      - name: "Fix: sync FEATURE_* + APP_ENV onto backend (from staging)"
        if: inputs.fix_env_parity
        env:
          RAILWAY_TOKEN_STG: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          set -uo pipefail
          # Read staging backend's var map with the STAGING token (project tokens
          # are environment-scoped), then write the same FEATURE_* set onto the
          # TARGET backend with this run's token. When the target IS staging the
          # loop is a no-op (values identical), which is fine.
          RAILWAY_TOKEN="$RAILWAY_TOKEN_STG" railway variable list \
            --service backend --environment staging --project "$PROJECT" \
            --json > stg-be.json || { echo "  could not read staging backend vars"; exit 0; }
          node -e '
            const v = JSON.parse(require("fs").readFileSync("stg-be.json","utf8"));
            const names = Object.keys(v).filter(k => /^FEATURE_[A-Z0-9_]+$/.test(k));
            require("fs").writeFileSync("flags.env",
              names.map(k => k + "\t" + String(v[k])).join("\n") + "\n");
            console.log("  staging backend FEATURE_* count: " + names.length);'
          rm -f stg-be.json
          # Dependency-aware promotion: config.Validate() is FATAL under
          # APP_ENV=production — a flag whose backing credential is absent on
          # the target aborts boot and the healthcheck fails (observed: 9
          # consecutive FAILED backend redeploys). Force such flags OFF on the
          # target instead of copying staging's value.
          railway variable list --service backend --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > tgt-be.json || echo '{}' > tgt-be.json
          node -e '
            const fs = require("fs");
            const tgt = JSON.parse(fs.readFileSync("tgt-be.json","utf8"));
            const present = (k) => {
              const v = String(tgt[k] ?? "");
              return v.length > 0 && !/xxxx|change_me|changeme|your_|your-|placeholder|todo/i.test(v);
            };
            const force = {};  // flag -> reason
            const paystack = present("PAYSTACK_SECRET_KEY");
            if (!paystack) {
              force.FEATURE_WALLET_ENABLED = "PAYSTACK_SECRET_KEY missing on target";
              force.FEATURE_BANK_TRANSFERS_ENABLED = "PAYSTACK_SECRET_KEY missing on target";
            }
            if (!present("MONNIFY_SECRET_KEY")) force.FEATURE_BANK_TRANSFERS_ENABLED = "MONNIFY_SECRET_KEY missing on target";
            if (!present("MAPLERAD_SECRET_KEY")) force.FEATURE_MAPLERAD_ENABLED = "MAPLERAD_SECRET_KEY missing on target";
            const anyKyc = present("DOJAH_SECRET_KEY") || present("DOJAH_APP_ID") ||
              (present("SMILE_ID_PARTNER_ID") && present("SMILE_ID_API_KEY")) || present("YOUVERIFY_TOKEN");
            if (!anyKyc || !present("KYC_PII_ENC_KEY")) force.FEATURE_KYC_VERIFY_ENABLED = "no KYC provider + KYC_PII_ENC_KEY on target";
            const anySeed = ["ARENA_SIGNING_SEED_THEORY","ARENA_SIGNING_SEED_PRACTICAL","ARENA_SIGNING_SEED_FIRSTAID"].some(present);
            if (!anySeed) force.FEATURE_ARENA_ENABLED = "no ARENA_SIGNING_SEED_* on target";
            if (!present("MAPS_GOOGLE_KEY")) force.FEATURE_MAPS_ENABLED = "MAPS_GOOGLE_KEY missing on target";
            // finance_routes.go:2000: FEATURE_TRANSPORT_ENABLED fatals in prod
            // when no real MapService is wired (MockMaps fabricates fares).
            if (!present("MAPS_GOOGLE_KEY")) force.FEATURE_TRANSPORT_ENABLED = "transport requires a real MapService (needs MAPS_GOOGLE_KEY)";
            if (!present("BREVO_API_KEY") || !present("OTP_PEPPER") || !present("BREVO_OTP_TEMPLATE_ID"))
              force.FEATURE_OTP_EMAIL_ENABLED = "Brevo/OTP creds missing on target";
            const rows = fs.readFileSync("flags.env","utf8").split("\n").filter(Boolean)
              .map(l => l.split("\t"));
            const out = rows.map(([k,v]) => {
              if (force[k] && v === "true") { console.log("  FORCE OFF " + k + " — " + force[k]); return [k,"false"]; }
              return [k,v];
            });
            // Also ensure forced-off flags exist on target even if staging lacks them.
            for (const k of Object.keys(force)) if (!rows.some(r => r[0] === k)) out.push([k,"false"]);
            fs.writeFileSync("flags.env", out.map(r => r.join("\t")).join("\n") + "\n");'
          rm -f tgt-be.json
          # APP_ENV is the target's own name — never copied across environments.
          # --skip-deploys on every set: 48+ sets each triggering a redeploy
          # queue a storm of superseding builds that all fail, leaving the OLD
          # container live. One explicit `railway redeploy` at the end instead.
          SKIP="--skip-deploys"
          railway variable set --help 2>&1 | grep -q "skip-deploys" || SKIP=""
          railway variable set APP_ENV="$ENVIRONMENT" \
            --service backend --environment "$ENVIRONMENT" --project "$PROJECT" $SKIP \
            && echo "  APP_ENV=$ENVIRONMENT set on backend"
          COUNT=0
          while IFS=$'\t' read -r NAME VAL; do
            [ -z "$NAME" ] && continue
            # Booleans only: refuse to write anything that is not true/false so
            # a credential can never travel through this path.
            case "$VAL" in true|false) ;; *) echo "  skip $NAME (non-boolean value)"; continue;; esac
            if railway variable set "$NAME"="$VAL" \
              --service backend --environment "$ENVIRONMENT" --project "$PROJECT" $SKIP >/dev/null; then
              COUNT=$((COUNT+1))
            else
              echo "  failed to set $NAME"
            fi
          done < flags.env
          rm -f flags.env
          echo "  applied $COUNT FEATURE_* flags to backend ($ENVIRONMENT)"
          # finance_routes.go:1080 — FEATURE_ASSOCIATIONS_ENABLED log.Fatalf's
          # outside development when ASSOC_CARD_SIGNING_SECRET is unset. The
          # secret is self-generated HMAC material (not a vendor credential):
          # provision a fresh random one on the target if absent.
          railway variable list --service backend --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > assoc-check.json 2>/dev/null || echo '{}' > assoc-check.json
          if node -e 'const v=JSON.parse(require("fs").readFileSync("assoc-check.json","utf8")); process.exit(v.ASSOC_CARD_SIGNING_SECRET ? 1 : 0)'; then
            openssl rand -hex 32 | railway variable set ASSOC_CARD_SIGNING_SECRET --stdin \
              --service backend --environment "$ENVIRONMENT" --project "$PROJECT" $SKIP \
              && echo "  generated ASSOC_CARD_SIGNING_SECRET on backend ($ENVIRONMENT)"
          else
            echo "  ASSOC_CARD_SIGNING_SECRET already set"
          fi
          rm -f assoc-check.json
          # frontend-web carries its OWN FEATURE_* gate map
          # (src/lib/feature-flags.ts ~40 flags, incl. FEATURE_ASSOCIATION_ENABLED
          # singular — the BFF route 503s without it). Sync staging→target with
          # --skip-deploys; they activate on the next deploy, so a stale build
          # never runs new flags (e.g. VOTES_BRIDGE_ENABLED only activates once
          # the kyc-gate fix is serving). The same force-off map as the backend
          # keeps the BFF honest about missing credentials.
          RAILWAY_TOKEN="$RAILWAY_TOKEN_STG" railway variable list \
            --service frontend-web --environment staging --project "$PROJECT" \
            --json > stg-fw.json || { echo "  could not read staging frontend-web vars"; exit 0; }
          railway variable list --service backend --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > tgt-creds.json || echo '{}' > tgt-creds.json
          node -e '
            const fs = require("fs");
            const stg = JSON.parse(fs.readFileSync("stg-fw.json","utf8"));
            const tgt = JSON.parse(fs.readFileSync("tgt-creds.json","utf8"));
            const present = (k) => {
              const v = String(tgt[k] ?? "");
              return v.length > 0 && !/xxxx|change_me|changeme|your_|your-|placeholder|todo/i.test(v);
            };
            const force = {};
            if (!present("PAYSTACK_SECRET_KEY")) {
              force.FEATURE_WALLET_ENABLED = 1; force.FEATURE_BANK_TRANSFERS_ENABLED = 1;
            }
            if (!present("MONNIFY_SECRET_KEY")) force.FEATURE_BANK_TRANSFERS_ENABLED = 1;
            if (!present("MAPLERAD_SECRET_KEY")) force.FEATURE_MAPLERAD_ENABLED = 1;
            if (!present("KYC_PII_ENC_KEY")) { force.FEATURE_KYC_VERIFY_ENABLED = 1; force.FEATURE_KYC_ENABLED = 1; }
            if (!present("ARENA_SIGNING_SEED_THEORY") && !present("ARENA_SIGNING_SEED_PRACTICAL") && !present("ARENA_SIGNING_SEED_FIRSTAID"))
              force.FEATURE_ARENA_ENABLED = 1;
            if (!present("MAPS_GOOGLE_KEY")) { force.FEATURE_MAPS_ENABLED = 1; force.FEATURE_TRANSPORT_ENABLED = 1; }
            if (!present("BREVO_API_KEY") || !present("OTP_PEPPER") || !present("BREVO_OTP_TEMPLATE_ID"))
              force.FEATURE_OTP_EMAIL_ENABLED = 1;
            const names = Object.keys(stg).filter(k =>
              /^(FEATURE_[A-Z0-9_]+|VOTES_BRIDGE_ENABLED)$/.test(k));
            const out = names.map(k => {
              const v = String(stg[k]);
              if (force[k] && v === "true") { console.log("  FORCE OFF fw " + k); return [k,"false"]; }
              return [k,v];
            });
            fs.writeFileSync("fw-flags.env", out.map(r => r.join("\t")).join("\n") + "\n");
            console.log("  staging frontend-web flag count: " + names.length);'
          rm -f stg-fw.json tgt-creds.json
          COUNT=0
          while IFS=$'\t' read -r NAME VAL; do
            [ -z "$NAME" ] && continue
            case "$VAL" in true|false) ;; *) echo "  skip fw $NAME (non-boolean)"; continue;; esac
            if railway variable set "$NAME"="$VAL" \
              --service frontend-web --environment "$ENVIRONMENT" --project "$PROJECT" $SKIP >/dev/null; then
              COUNT=$((COUNT+1))
            else
              echo "  failed to set fw $NAME"
            fi
          done < fw-flags.env
          rm -f fw-flags.env
          echo "  applied $COUNT flags to frontend-web ($ENVIRONMENT) — no redeploy (activates on next deploy)"
          # ADMIN_API_KEY is the shared backend<->frontend-admin secret. Re-pair
          # it from THIS env's backend value in case an earlier var copy left
          # them divergent (value never printed).
          railway variable list --service backend --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > be-ak.json || true
          node -e 'try{const v=JSON.parse(require("fs").readFileSync("be-ak.json","utf8"));if(v.ADMIN_API_KEY)require("fs").writeFileSync("ak.txt",String(v.ADMIN_API_KEY))}catch{}' || true
          rm -f be-ak.json
          if [ -f ak.txt ]; then
            if railway variable set ADMIN_API_KEY --stdin --service frontend-admin \
              --environment "$ENVIRONMENT" --project "$PROJECT" $SKIP < ak.txt >/dev/null 2>&1; then
              echo "  frontend-admin ADMIN_API_KEY <- $ENVIRONMENT backend value"
            else
              echo "  WARN: ADMIN_API_KEY write failed"
            fi
            rm -f ak.txt
          fi
          # Supabase session-mode pooler is capped at pool_size:15 (EMAXCONNSESSION
          # observed in prod boot log → pgx-backed endpoints 500). Cap the pgx
          # pool well under the ceiling so a rolling deploy (old+new pools) and
          # PostgREST/GoTrue tenants still fit. SET ROLE requires session mode,
          # so shrinking the pool is the fix — not switching to 6543.
          if railway variable set DB_POOL_MAX_CONNS=4 \
            --service backend --environment "$ENVIRONMENT" --project "$PROJECT" $SKIP >/dev/null; then
            echo "  DB_POOL_MAX_CONNS=4 set on backend ($ENVIRONMENT)"
          else
            echo "  WARN: DB_POOL_MAX_CONNS set failed"
          fi
          if railway redeploy --service backend --environment "$ENVIRONMENT" --project "$PROJECT" --yes; then
            echo "  single redeploy triggered to pick up the new vars"
          else
            echo "  WARN: backend redeploy trigger failed"
          fi

      - name: "Diag: GoTrue auth config (read-only; signup policy + rate budgets)"
        if: inputs.fix_env_parity
        env:
          SB_MGMT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SB_REF: ${{ inputs.environment == 'production' && secrets.SUPABASE_PROJECT_ID || secrets.SUPABASE_STAGING_PROJECT_ID }}
        run: |
          set -uo pipefail
          [ -n "$SB_MGMT" ] && [ -n "$SB_REF" ] || { echo "  management token or project ref missing"; exit 0; }
          curl -sS -m 30 "https://api.supabase.com/v1/projects/$SB_REF/config/auth" \
            -H "Authorization: Bearer $SB_MGMT" | node -e '
            let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
              let j; try{j=JSON.parse(d)}catch{console.log("  auth config response not JSON:",d.slice(0,200));process.exit(0)}
              // Print ONLY the signup/rate/mailer-relevant fields — never secrets.
              const keys=["disable_signup","external_email_enabled","mailer_autoconfirm",
                "enable_signup","rate_limit_sign_in_sign_ups","rate_limit_email_sent",
                "rate_limit_anonymous_users","rate_limit_token_refresh","smtp_admin_email",
                "smtp_host","smtp_port","smtp_user","mailer_secure_email_change_enabled"];
              const out={};
              for (const k of Object.keys(j)) {
                if (keys.includes(k)) out[k]=j[k];
                else if (/rate_limit|signup|mailer|smtp/i.test(k) && !/pass|secret|key|token/i.test(k)) out[k]=j[k];
              }
              console.log(JSON.stringify(out,null,1).slice(0,3000));
            });'

      - name: "Fix: apply missing bridge/otp DDL via Management API"
        if: inputs.fix_env_parity
        env:
          SB_MGMT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SB_REF: ${{ inputs.environment == 'production' && secrets.SUPABASE_PROJECT_ID || secrets.SUPABASE_STAGING_PROJECT_ID }}
        run: |
          set -uo pipefail
          [ -n "$SB_MGMT" ] && [ -n "$SB_REF" ] || { echo "  management token or project ref missing"; exit 0; }
          q() { curl -sS -m 60 "https://api.supabase.com/v1/projects/$SB_REF/database/query" \
            -H "Authorization: Bearer $SB_MGMT" -H 'content-type: application/json' -d "{\"query\":\"$1\"}"; }
          echo "--- presence check ---"
          q "select to_regclass('public.bridge_idempotency_keys') as bik, to_regclass('public.bridge_outbox') as bo, to_regclass('public.otp_codes') as oc" | head -c 400; echo
          echo "--- applying DDL (IF NOT EXISTS — additive only) ---"
          q "CREATE TABLE IF NOT EXISTS public.bridge_idempotency_keys (key text PRIMARY KEY, response jsonb NOT NULL DEFAULT '{}', created_at timestamptz NOT NULL DEFAULT now());" | head -c 300; echo
          q "CREATE TABLE IF NOT EXISTS public.bridge_outbox (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), event_type text NOT NULL, payload jsonb NOT NULL, status text NOT NULL DEFAULT 'pending' CHECK (status IN ('pending','processing','done','failed')), attempts integer NOT NULL DEFAULT 0, last_error text, created_at timestamptz NOT NULL DEFAULT now(), processed_at timestamptz);" | head -c 300; echo
          q "CREATE INDEX IF NOT EXISTS idx_bridge_outbox_pending ON public.bridge_outbox (status, created_at) WHERE status = 'pending';" | head -c 300; echo
          # otp_codes + otp_rate_limits — verbatim from migration
          # 20270193000000_otp_codes.sql (additive, RLS deny-by-default).
          q "CREATE TABLE IF NOT EXISTS public.otp_codes (key TEXT PRIMARY KEY, code_hash TEXT NOT NULL, purpose TEXT NOT NULL, attempts INT NOT NULL DEFAULT 0 CHECK (attempts >= 0), created_at TIMESTAMPTZ NOT NULL DEFAULT now(), expires_at TIMESTAMPTZ NOT NULL);" | head -c 300; echo
          q "CREATE INDEX IF NOT EXISTS otp_codes_expires_idx ON public.otp_codes (expires_at);" | head -c 300; echo
          q "CREATE TABLE IF NOT EXISTS public.otp_rate_limits (key TEXT PRIMARY KEY, count INT NOT NULL DEFAULT 0 CHECK (count >= 0), window_start TIMESTAMPTZ NOT NULL DEFAULT now(), expires_at TIMESTAMPTZ NOT NULL);" | head -c 300; echo
          q "CREATE INDEX IF NOT EXISTS otp_rate_limits_expires_idx ON public.otp_rate_limits (expires_at);" | head -c 300; echo
          q "ALTER TABLE public.otp_codes ENABLE ROW LEVEL SECURITY;" | head -c 300; echo
          q "ALTER TABLE public.otp_rate_limits ENABLE ROW LEVEL SECURITY;" | head -c 300; echo
          echo "--- re-check ---"
          q "select to_regclass('public.bridge_idempotency_keys') as bik, to_regclass('public.bridge_outbox') as bo, to_regclass('public.otp_codes') as oc, to_regclass('public.otp_rate_limits') as orl" | head -c 400; echo

      # Copies staging variables into production per service. Runs inside a
      # production-scoped job (input environment=production) but reads staging
      # with the repo-level staging token. Guarded by env below so a staging
      # inspect run can never write production.
      - name: Copy staging vars -> production (per service, env-specific excluded)
        if: inputs.copy_staging_to_prod && inputs.environment == 'production'
        env:
          STG_TOK: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          PRD_TOK: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          set -uo pipefail
          for SVC in frontend-web frontend-admin backend; do
            echo "=== $SVC: staging -> production ==="
            RAILWAY_TOKEN="$STG_TOK" railway variable list --service "$SVC" \
              --environment staging --project "$PROJECT" --json > stg.json \
              || { echo "  could not read staging vars for $SVC"; continue; }
            RAILWAY_TOKEN="$PRD_TOK" railway variable list --service "$SVC" \
              --environment production --project "$PROJECT" --json > prd.json \
              || { echo "  could not read production vars for $SVC"; continue; }
            node -e '
              const fs = require("fs");
              const stg = JSON.parse(fs.readFileSync("stg.json", "utf8"));
              const prd = JSON.parse(fs.readFileSync("prd.json", "utf8"));
              // Prod owns these — never overwritten by staging values.
              const SKIP_NAME = /^RAILWAY_|SUPABASE|^DATABASE_URL$|^DIRECT_URL$|^PG[A-Z_]*$|^POSTGRES|^PORT$|^APP_PORT$|^APP_ENV$|^NODE_ENV$/;
              const DOMAIN_MAP = {
                "frontend-web-staging-ec46.up.railway.app": "frontend-web-production-9259.up.railway.app",
                "backend-staging-d9bb.up.railway.app": "backend-production-1b33d.up.railway.app",
                "frontend-admin-staging-ade6.up.railway.app": "frontend-admin-production-5b0c.up.railway.app",
              };
              const jwtIss = (s) => {
                try {
                  const p = JSON.parse(Buffer.from(String(s).split(".")[1], "base64url").toString());
                  return p.iss || "";
                } catch { return ""; }
              };
              const plan = {}, report = [];
              for (const [k, raw] of Object.entries(stg)) {
                const v = String(raw);
                if (SKIP_NAME.test(k)) { report.push(`  skip ${k} (env-specific)`); continue; }
                if (v.includes("wnicsubiznmishkmunsv") || jwtIss(v).includes("wnicsubiznmishkmunsv")) {
                  report.push(`  skip ${k} (value references staging Supabase)`); continue;
                }
                let nv = v;
                for (const [a, b] of Object.entries(DOMAIN_MAP)) nv = nv.split(a).join(b);
                if (/_USE_MOCK$/.test(k)) nv = "false";            // never mock on prod
                if (/ENV(IRONMENT)?$/.test(k) && nv.trim() === "staging") nv = "production";
                if (prd[k] === nv) { report.push(`  same ${k}`); continue; }
                plan[k] = nv;
                report.push(`  ${k in prd ? "update" : "new"}   ${k}` + (k.startsWith("PAYSTACK_SECRET") ? ` [mode=${nv.startsWith("sk_live") ? "LIVE" : nv.startsWith("sk_test") ? "TEST" : "?"}]` : k.startsWith("PAYSTACK_PUBLIC") ? ` [mode=${nv.startsWith("pk_live") ? "LIVE" : nv.startsWith("pk_test") ? "TEST" : "?"}]` : ""));
              }
              fs.writeFileSync("plan.json", JSON.stringify(plan));
              fs.writeFileSync("keys.txt", Object.keys(plan).join("\n") + (Object.keys(plan).length ? "\n" : ""));
              console.log(report.join("\n"));
            '
            while IFS= read -r K; do
              [ -z "$K" ] && continue
              node -e 'const p=require("./plan.json");process.stdout.write(p[process.argv[1]])' "$K" \
                | RAILWAY_TOKEN="$PRD_TOK" railway variable set "$K" --stdin \
                    --service "$SVC" --environment production --project "$PROJECT" >/dev/null 2>&1 \
                && echo "  wrote $K" || echo "  FAILED $K"
            done < keys.txt
          done
          # ADMIN_API_KEY is a shared backend<->admin secret; prod must use the
          # PRODUCTION backend value, not staging's.
          RAILWAY_TOKEN="$PRD_TOK" railway variable list --service backend \
            --environment production --project "$PROJECT" --json > be-prd.json || true
          node -e '
            const fs=require("fs");
            try { const v=JSON.parse(fs.readFileSync("be-prd.json","utf8"));
              if (v.ADMIN_API_KEY) fs.writeFileSync("ak.txt", String(v.ADMIN_API_KEY)); } catch {}
          '
          if [ -f ak.txt ]; then
            RAILWAY_TOKEN="$PRD_TOK" railway variable set ADMIN_API_KEY --stdin \
              --service frontend-admin --environment production --project "$PROJECT" < ak.txt >/dev/null 2>&1 \
              && echo "frontend-admin ADMIN_API_KEY <- prod backend value" || echo "ADMIN_API_KEY write failed"
            rm -f ak.txt
          fi
          rm -f stg.json prd.json plan.json keys.txt be-prd.json
          for SVC in frontend-web frontend-admin backend; do
            railway redeploy --service "$SVC" --environment production --project "$PROJECT" --yes \
              && echo "  redeploy triggered (prod): $SVC" || echo "  redeploy failed (prod): $SVC"
          done

      - name: frontend-web supabase host (host only)
        run: |
          set -uo pipefail
          node -e '
            let v; try { v = JSON.parse(require("fs").readFileSync("fw.json","utf8")); }
            catch { console.log("  (fw.json missing/unparseable)"); process.exit(0); }
            try { console.log("  NEXT_PUBLIC_SUPABASE_URL -> " + new URL(String(v.NEXT_PUBLIC_SUPABASE_URL)).hostname); }
            catch { console.log("  NEXT_PUBLIC_SUPABASE_URL: unset or unparseable"); }
          '

      # Deployment STATE first. `railway redeploy` returns once a build is
      # TRIGGERED, not once it succeeds, so a job can go green while the build
      # that followed it failed - leaving the previous image serving. That
      # matters doubly here because next.config rewrites() bakes GO_BACKEND_URL
      # at BUILD time: if the rebuild failed, the old proxy target is still live
      # and every fix looks like it did nothing.
      #
      # It also explains an empty log fetch: `railway logs` targets the most
      # recent deployment, which may be a failed build with almost no output.
      # frontend-admin is in this loop because it is the service that is DOWN:
      # a SUCCESS here with a 502 on the domain means the deployment Railway kept
      # is not the one being routed to, or the container died after the status was
      # written. URL-ish fields are printed so the deployment can be probed
      # directly, bypassing the domain. Keys named like credentials are skipped.
      - name: Deployment status per service
        run: |
          set -uo pipefail
          for svc in frontend-web backend frontend-admin; do
            echo "--- $svc ---"
            railway deployment list --service "$svc" --environment "$ENVIRONMENT" \
              --project "$PROJECT" --limit 5 --json 2>/dev/null \
              | node -e '
                let d = "";
                process.stdin.on("data", (c) => (d += c));
                process.stdin.on("end", () => {
                  let rows;
                  try { rows = JSON.parse(d); } catch { console.log("    (unreadable)"); return; }
                  if (!rows.length) { console.log("    (no deployments returned)"); return; }
                  console.log("    row keys: " + Object.keys(rows[0]).join(", "));
                  for (const r of rows.slice(0, 5)) {
                    console.log(`    ${r.status ?? "?"}  created=${r.createdAt ?? "?"}  updated=${r.updatedAt ?? "?"}  msg=${(r.meta && r.meta.cliMessage) ? String(r.meta.cliMessage).slice(0, 12) : "-"}`);
                    for (const [k, val] of Object.entries(r)) {
                      if (/token|secret|key|password/i.test(k)) continue;
                      if (typeof val === "string" && /^https?:\/\//.test(val)) console.log(`        ${k}: ${val}`);
                    }
                  }
                });
              ' || echo "    (could not list)"
          done

      # The admin service is the one returning 502 with x-railway-fallback, and the
      # two candidate causes are separated by its own variables:
      #   PORT set here  -> the image default (3001) survives into the container and
      #                     the process listens where the edge target does not point.
      #                     A port is not a credential, so PORT is printed by value.
      #   PORT not set   -> Railway injects its own, and the cause is elsewhere.
      # Everything else is NAMES ONLY, plus presence/shape checks.
      # Every deployment Railway lists, with its trigger metadata, plus the BUILD
      # log of the latest one. A row stuck in BUILDING/DEPLOYING for an hour
      # blocks that service's whole queue (new uploads sit in WAITING and the ops
      # workflows time out), and `meta` says what created it - a `railway up`
      # (cliMessage = commit sha) or a GitHub-triggered build. Keys named like
      # credentials are skipped; build logs are redacted like every other log here.
      - name: Deployment queue per service (all rows + trigger meta + latest build log)
        run: |
          set -uo pipefail
          for svc in backend frontend-admin frontend-web; do
            echo "--- $svc: deployments (newest first) ---"
            railway deployment list --service "$svc" --environment "$ENVIRONMENT" \
              --project "$PROJECT" --limit 10 --json 2>/dev/null \
              | node -e '
                let d = "";
                process.stdin.on("data", (c) => (d += c));
                process.stdin.on("end", () => {
                  let rows; try { rows = JSON.parse(d); } catch { console.log("    (unreadable)"); return; }
                  if (!Array.isArray(rows)) rows = rows.deployments ?? rows.edges ?? [rows];
                  console.log("    " + rows.length + " row(s) returned");
                  for (const r of rows) {
                    const meta = {};
                    for (const [k, val] of Object.entries(r.meta ?? {})) {
                      if (/token|secret|key|password/i.test(k)) continue;
                      meta[k] = typeof val === "string" ? val.slice(0, 60) : val;
                    }
                    console.log(`    ${r.status ?? "?"}  created=${r.createdAt ?? "?"}  id=${String(r.id ?? "").slice(0, 8)}  meta=${JSON.stringify(meta)}`);
                  }
                });
              ' || echo "    (could not list)"
            echo "--- $svc: latest deployment BUILD log (tail, redacted) ---"
            railway logs --build --latest --service "$svc" --environment "$ENVIRONMENT" \
              --project "$PROJECT" --lines 80 2>&1 \
              | sed -E 's#eyJ[A-Za-z0-9._-]{20,}#<jwt-redacted>#g; s#(sk_|pk_)[A-Za-z0-9_-]{10,}#<key-redacted>#g' \
              | tail -25 | sed 's/^/    /' || echo "    (no build log)"
          done

      - name: frontend-admin variables (names, plus PORT by value)
        run: |
          set -uo pipefail
          railway variable list --service frontend-admin --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > fa.json || true
          node -e '
            let v;
            try { v = JSON.parse(require("fs").readFileSync("fa.json","utf8")); }
            catch { console.error("Unparseable output - refusing to print it (it would contain values)."); process.exit(1); }
            console.log("  PORT      = " + (v.PORT === undefined ? "NOT SET (Railway injects its own)" : v.PORT));
            console.log("  APP_PORT  = " + (v.APP_PORT ?? "NOT SET"));
            console.log("\n  variable NAMES set on frontend-admin:");
            for (const k of Object.keys(v).sort()) console.log("    " + k);
            const shape = (k, test) => {
              const raw = v[k];
              if (raw === undefined) return `${k}: NOT SET`;
              return `${k}: set, ${test(String(raw)) ? "looks right" : "SET BUT LOOKS WRONG"}`;
            };
            console.log("\n  shape checks (values not printed):");
            console.log("    " + shape("NEXT_PUBLIC_SUPABASE_URL", (s) => /^https:\/\/[a-z0-9]{20}\.supabase\.co/.test(s)));
            console.log("    " + shape("SUPABASE_SERVICE_ROLE_KEY", (s) => s.length > 20));
            console.log("    " + shape("NEXT_PUBLIC_WEB_APP_BASE_URL", (s) => /^https?:\/\//.test(s) && !/localhost|127\.0\.0\.1/.test(s)));
            for (const k of ["NEXT_PUBLIC_SUPABASE_ANON_KEY","ADMIN_API_KEY","NEXT_PUBLIC_FX_ADMIN_USE_MOCK","NEXT_PUBLIC_GROUPS_ADMIN_USE_MOCK"]) {
              console.log(`    ${k}: ${v[k] === undefined ? "NOT SET" : "set"}`);
            }
          '

      # A 502 with x-railway-fallback is an edge answer, so it says nothing about
      # whether the container is up. These probes separate container health from
      # routing: frontend-web is the control (same edge, same project, known good),
      # and the admin deployment URL is fetched from Railway because it answers even
      # when the public domain has no upstream.
      - name: frontend-admin reachability probes
        run: |
          set -uo pipefail
          ADMIN_URL="$(railway deployment list --service frontend-admin --environment "$ENVIRONMENT" \
            --project "$PROJECT" --limit 3 --json 2>/dev/null \
            | node -e '
                let d = "";
                process.stdin.on("data", (c) => (d += c));
                process.stdin.on("end", () => {
                  let rows; try { rows = JSON.parse(d); } catch { return; }
                  const hit = rows.find((r) => Object.entries(r).some(([k, val]) => /url/i.test(k) && typeof val === "string" && /^https?:\/\//.test(val)));
                  if (!hit) return;
                  const [, val] = Object.entries(hit).find(([k, v]) => /url/i.test(k) && typeof v === "string" && /^https?:\/\//.test(v));
                  process.stdout.write(val);
                });
              ' || true)"
          echo "  admin deployment URL: ${ADMIN_URL:-<none reported by the API>}"
          ADMIN_DEPLOY_URL="$ADMIN_URL" node -e '
            const https = require("https");
            const probe = (label, url) => new Promise((resolve) => {
              const req = https.get(url, { timeout: 20000 }, (res) => {
                const h = res.headers;
                console.log(`  ${label}: HTTP ${res.statusCode}  x-railway-fallback: ${h["x-railway-fallback"] ?? "absent"}  location: ${h.location ?? "-"}  server: ${h.server ?? "-"}`);
                res.resume(); resolve();
              });
              req.on("timeout", () => { console.log(`  ${label}: TIMEOUT (nothing answered)`); req.destroy(); resolve(); });
              req.on("error", (e) => { console.log(`  ${label}: error ${e.code ?? e.message}`); resolve(); });
            });
            (async () => {
              await probe("frontend-web  (control)", "https://frontend-web-staging.up.railway.app/");
              await probe("frontend-admin (domain) ", "https://frontend-admin-staging.up.railway.app/");
              if (process.env.ADMIN_DEPLOY_URL) await probe("frontend-admin (deploy) ", process.env.ADMIN_DEPLOY_URL);
            })();
          '

      # Admin logs, filtered and redacted. The filter is not cosmetic: a container
      # that dies on boot prints the reason once, and runtime logs can echo
      # environment values. JWT-shaped strings are masked as a second line of
      # defence behind the filter, the same doctrine as the frontend-web step below.
      - name: frontend-admin logs - boot, listen and build failures
        run: |
          set -uo pipefail
          adm="admin.log"
          railway logs --deployment --service frontend-admin --environment "$ENVIRONMENT" \
            --project "$PROJECT" --lines "${{ inputs.log_lines }}" > "$adm" 2>&1 || true
          railway logs --build --service frontend-admin --environment "$ENVIRONMENT" \
            --project "$PROJECT" --lines 200 >> "$adm" 2>&1 || true
          echo "  scanned $(wc -l < "$adm") log lines"
          echo "  --- boot / listen / crash / build-failure lines ---"
          grep -aiE "listening|Ready in|started server|HOSTNAME|EADDRINUSE|EACCES|MODULE_NOT_FOUND|Cannot find module|out of memory|out-of-memory|heap|Killed|SIGABRT|SIGKILL|unhandled|npm ERR|exit code|Failed to compile|Type error|no space|port" "$adm" \
            | tail -60 \
            | sed -E 's#eyJ[A-Za-z0-9._-]{20,}#<jwt-redacted>#g' \
            | sed 's/^/    /' || echo "    (none found)"
          echo "  --- counts by signature ---"
          for sig in EADDRINUSE "Cannot find module" "out of memory" Killed "npm ERR" "Type error" "port"; do
            printf "    %-20s %s\n" "$sig" "$(grep -aic -- "$sig" "$adm" || true)"
          done
          echo "  --- redaction check (must be 0) ---"
          echo "    JWT-shaped strings left in the fetched log: $(grep -acE 'eyJ[A-Za-z0-9._-]{20,}' "$adm" || true)"

      # frontend-web runtime logs, filtered to the signatures that identify WHY the
      # proxy to Go hangs. The distinction matters and each error names a different
      # cause:
      #   ENOTFOUND / EAI_AGAIN -> the internal hostname does not resolve (wrong
      #                            service name, or private networking is off)
      #   ETIMEDOUT / no error  -> DNS resolved but nothing answered. On Railway
      #                            that is usually the IPv6-only private network:
      #                            a service is only reachable on *.railway.internal
      #                            if it listens on :: , not just 0.0.0.0
      #   ECONNREFUSED          -> resolved and reachable, but nothing on that PORT
      #
      # Filtered rather than dumped: application logs can contain anything, and a
      # raw dump into a job log is how a secret escapes (run 32545670584).
      - name: frontend-web logs - proxy/network errors only
        run: |
          set -uo pipefail
          railway logs --deployment --service frontend-web --environment "$ENVIRONMENT" \
            --project "$PROJECT" --lines "${{ inputs.log_lines }}" > fw.log 2>&1 || true
          railway logs --network --service frontend-web --environment "$ENVIRONMENT" \
            --project "$PROJECT" --lines 100 >> fw.log 2>&1 || true
          echo "  scanned $(wc -l < fw.log) log lines"
          echo "  --- network / proxy error lines ---"
          grep -aiE "go-backend|TIMED OUT|ENOTFOUND|EAI_AGAIN|ETIMEDOUT|ECONNREFUSED|ECONNRESET|EHOSTUNREACH|ENETUNREACH|fetch failed|socket hang up|railway\.internal|upstream|AggregateError|UND_ERR" fw.log \
            | tail -40 | sed 's/^/    /' || echo "    (none found)"
          echo "  --- counts by signature ---"
          for sig in ENOTFOUND EAI_AGAIN ETIMEDOUT ECONNREFUSED "fetch failed" "railway.internal"; do
            printf "    %-18s %s\n" "$sig" "$(grep -aic -- "$sig" fw.log || true)"
          done

      # The observe-only question from before enforcement went on, and the
      # "is anything 503ing now" question after. Filtered to modulegate lines so
      # arbitrary application log content cannot land in this job log.
      - name: Module gate activity in the backend logs
        run: |
          set -uo pipefail
          railway logs --deployment --service backend --environment "$ENVIRONMENT" \
            --project "$PROJECT" --lines "${{ inputs.log_lines }}" > be.log 2>&1 || true
          echo "  scanned $(wc -l < be.log) log lines"
          echo "  --- modulegate lines ---"
          grep -aiE "modulegate|WOULD refuse|not available yet" be.log | tail -40 | sed 's/^/    /' || true
          echo "  --- counts ---"
          echo "    WOULD refuse (observe-only, refused nothing): $(grep -aic 'WOULD refuse' be.log || true)"
          echo "    startup lines mentioning the gate:            $(grep -aic 'modulegate' be.log || true)"

      # A backend deployment can build and start DEPLOYING, then still end FAILED
      # a couple minutes later -- that is a runtime crash after startup, not a
      # build failure, and the deploy job's own log only reports the Railway
      # deployment STATUS, never why. Filtered to crash/panic signatures for the
      # same reason every other step here filters rather than dumps: application
      # logs can contain anything, and a raw dump is how a secret escapes (see
      # the --kv incident in this workflow's header).
      - name: Backend crash signatures (panic / fatal / listen errors)
        run: |
          set -uo pipefail
          # --latest: without it, `railway logs` defaults to the most recent
          # SUCCESSFUL deployment — exactly the OLD, still-serving one a failed
          # deploy attempt never replaces — so a genuine crash-after-build would
          # silently report unrelated old traffic instead. `--latest` targets
          # the latest deployment "even if it failed or is still building".
          railway logs --deployment --latest --service backend --environment "$ENVIRONMENT" \
            --project "$PROJECT" --lines "${{ inputs.log_lines }}" > be-crash.log 2>&1 || true
          echo "  scanned $(wc -l < be-crash.log) log lines"
          echo "  --- panic / fatal / crash lines ---"
          grep -aiE "panic:|fatal error|nil pointer|runtime error|goroutine [0-9]+ \[|listen tcp|bind: address already in use|Validate\(\)|refusing to start|exit status|SIGSEGV|SIGABRT" be-crash.log \
            | tail -60 | sed 's/^/    /' || echo "    (none found)"
          echo "  --- last 20 lines of the deployment log (context) ---"
          tail -20 be-crash.log | sed 's/^/    /'

      # A --lines window is useless once the process has served traffic for a
      # while: request lines push the boot summary out of any window size. The
      # CLI's --filter does the selection server-side, so these come back even
      # hours after boot. Each line names WHICH gate refused a module group
      # ("DATABASE_URL not set" vs "no database pool" vs "routes registered"),
      # which is the difference between a missing variable and a failed
      # connection. Filtered by construction; nothing here is a raw dump.
      - name: Backend boot summary (server-side filtered)
        run: |
          set -uo pipefail
          # NOT --latest: on this CLI version --latest resolved to a target with
          # zero lines while the plain form (serving deployment) returned 500 —
          # observed in the same run. --since spans the serving deployment's
          # whole life so a boot from hours ago is still inside the window.
          # "router]" not "[router]": Railway's filter syntax treats [...] as a
          # character class, so the bracketed form matched nothing even on a
          # healthy boot. The trailing-bracket form is a plain substring.
          for f in "router]" "finance]" "routes registered" "skipping" "/api/finance/restaurant"; do
            echo "  --- lines matching: $f ---"
            railway logs --deployment --service backend --environment "$ENVIRONMENT" \
              --project "$PROJECT" --since 24h --lines 60 --filter "$f" 2>&1 \
              | sed -E 's#eyJ[A-Za-z0-9._-]{20,}#<jwt-redacted>#g; s#(sk_|pk_)[A-Za-z0-9_-]{10,}#<key-redacted>#g' \
              | tail -40 | sed 's/^/    /' || echo "    (none)"
          done

      # Tried and rejected: reading a REMOVED deployment's log by its positional
      # DEPLOYMENT_ID. On @railway/cli 5.40.1 the positional form combined with
      # --filter returned zero lines for every deployment, including the one
      # currently serving (whose lines the step above had just printed), so it
      # cannot be relied on for post-incident forensics. Capture the boot
      # summary above while the deployment is still serving instead.

      # frontend-web's HTTP access log is the one place that shows EVERY inbound
      # request to a module endpoint, whoever sent it: the APK, a curl, a browser.
      # @clientUa distinguishes them (okhttp / ReactNative vs curl), @httpStatus
      # is what the caller actually received (the Go backend's own log only shows
      # what the PROXY received from Go, which can differ on a proxy timeout).
      # If the APK's calls never show up here, the failure is before frontend-web:
      # device connectivity, DNS, or a build with the wrong base URL baked in.
      - name: frontend-web HTTP access log for the restaurant endpoint (last 6h)
        run: |
          set -uo pipefail
          for p in "/api/finance/restaurant" "/api/v1/marketplace" "/api/finance/associations"; do
            echo "  --- inbound requests to $p (status, duration, UA, path) ---"
            railway logs --http --service frontend-web --environment "$ENVIRONMENT" \
              --project "$PROJECT" --since 6h --lines 40 --path "$p" --json 2>/dev/null \
              | node -e '
                  const rl = require("readline").createInterface({ input: process.stdin });
                  rl.on("line", (l) => {
                    let o; try { o = JSON.parse(l); } catch { return; }
                    const a = o.attributes ?? o;
                    const ua = String(a.clientUa ?? a["@clientUa"] ?? "").slice(0, 40);
                    console.log(`    ${o.timestamp ?? ""} ${a.httpStatus ?? a["@httpStatus"] ?? "?"} ${a.totalDuration ?? a["@totalDuration"] ?? "?"}ms ua=${ua} ${a.method ?? ""} ${a.path ?? a["@path"] ?? ""}`);
                  });
                ' | tail -25 || echo "    (none)"
          done

  # Calls the module endpoints THROUGH frontend-web with a real Bearer, exactly as
  # the APK does — the unauthenticated probes above can only prove a route EXISTS
  # (401 vs 404); they cannot show what a signed-in user actually receives. A
  # throwaway confirmed user is minted with the backend's service-role key and
  # deleted at the end. The key and the token live only in this step's process
  # environment: never on a command line, never echoed; only HTTP status codes
  # and the first characters of a REDACTED body are printed.
  auth-probe:
    name: authenticated module probe (throwaway user, through frontend-web)
    if: ${{ inputs.auth_probe }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      RAILWAY_TOKEN: ${{ inputs.environment == 'production' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_STAGING }}
      PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
      ENVIRONMENT: ${{ inputs.environment }}
      WEB_BASE: ${{ inputs.environment == 'production' && 'https://frontend-web-production-9259.up.railway.app' || 'https://frontend-web-staging-ec46.up.railway.app' }}
    steps:
      - name: Check the Railway token is present
        run: ': "${RAILWAY_TOKEN:?missing Railway token secret}"'
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1
      - name: Probe
        run: |
          set -uo pipefail
          railway variable list --service backend --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > be.json
          export SB_URL="$(node -e 'const v=JSON.parse(require("fs").readFileSync("be.json","utf8")); process.stdout.write(String(v.SUPABASE_URL||""))')"
          export SB_KEY="$(node -e 'const v=JSON.parse(require("fs").readFileSync("be.json","utf8")); process.stdout.write(String(v.SUPABASE_SERVICE_ROLE_KEY||""))')"
          rm -f be.json
          echo "  backend SUPABASE_URL host: $(node -e 'try{console.log(new URL(process.env.SB_URL).host)}catch{console.log("(unparseable)")}')"
          [ -n "$SB_KEY" ] || { echo "  SUPABASE_SERVICE_ROLE_KEY not set on backend — cannot mint a user"; exit 1; }
          EMAIL="diag-probe-$(date +%s)@spotlightng.com"
          PW="$(openssl rand -hex 16)Aa1!"
          UID_="$(node -e '
            const [url,key,email,pw]=[process.env.SB_URL,process.env.SB_KEY,process.argv[1],process.argv[2]];
            fetch(url+"/auth/v1/admin/users",{method:"POST",headers:{apikey:key,Authorization:"Bearer "+key,"Content-Type":"application/json"},
              body:JSON.stringify({email,password:pw,email_confirm:true,user_metadata:{full_name:"Diag Probe"}})})
              .then(r=>r.json()).then(j=>process.stdout.write(j.id||"")).catch(()=>process.stdout.write(""));
          ' "$EMAIL" "$PW")"
          [ -n "$UID_" ] || { echo "  user creation failed"; exit 1; }
          echo "  minted throwaway user (id ${UID_:0:8}…)"
          export TOKEN="$(node -e '
            const [url,key,email,pw]=[process.env.SB_URL,process.env.SB_KEY,process.argv[1],process.argv[2]];
            fetch(url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:key,"Content-Type":"application/json"},
              body:JSON.stringify({email,password:pw})}).then(r=>r.json()).then(j=>process.stdout.write(j.access_token||"")).catch(()=>process.stdout.write(""));
          ' "$EMAIL" "$PW")"
          [ -n "$TOKEN" ] || { echo "  password grant returned no access_token"; }
          echo "  token issuer: $(node -e 'try{const p=JSON.parse(Buffer.from(process.env.TOKEN.split(".")[1],"base64url"));console.log(p.iss, "aud="+p.aud, "role="+p.role)}catch{console.log("(none)")}')"
          probe() {
            local path="$1"
            local out; out="$(curl -s -o /tmp/body -w "%{http_code} %{time_total}s" -H "Authorization: Bearer $TOKEN" --max-time 45 "$WEB_BASE$path")"
            local body; body="$(head -c 220 /tmp/body | tr '\n' ' ' | sed -E 's#eyJ[A-Za-z0-9._-]{20,}#<jwt>#g')"
            printf "  %-62s -> %s  %s\n" "$path" "$out" "$body"
          }
          echo "  --- real login through the BFF (POST /api/auth/login) ---"
          LOGIN_OUT="$(curl -s -o /tmp/lb -w "%{http_code} %{time_total}s" --max-time 45 -X POST "$WEB_BASE/api/auth/login" \
            -H 'Content-Type: application/json' -d "{\"email\":\"$EMAIL\",\"password\":\"$PW\"}")"
          LOGIN_BODY="$(head -c 220 /tmp/lb | tr '\n' ' ' | sed -E 's#eyJ[A-Za-z0-9._-]{20,}#<jwt>#g')"
          printf "  %-62s -> %s  %s\n" "/api/auth/login (POST)" "$LOGIN_OUT" "$LOGIN_BODY"
          echo "  --- through frontend-web, with Bearer (as the APK) ---"
          probe "/api/finance/restaurant?limit=20&offset=0"
          probe "/api/finance/restaurant?featured=1&sort=likes&limit=10&offset=0"
          probe "/api/finance/restaurant?sort=eta&limit=10&offset=0"
          probe "/api/finance/restaurant?sort=distance&near_lat=6.5244&near_lng=3.3792&limit=10&offset=0"
          probe "/api/finance/restaurant/mine"
          probe "/api/finance/associations"
          probe "/api/v1/marketplace/my-listings"
          probe "/api/finance/wallet/balance"
          probe "/api/registration/contests"
          probe "/api/v1/contests?limit=2"
          echo "  --- free-vote smoke (seeded contestant + voting_settings, cleaned up after) ---"
          # Prefer a contest with NO existing voting_settings: seeded settings
          # use limit=3/day, so a same-key replay returning the CACHED success
          # proves the bridge dedup fired — a contest limited to 1/day would 429
          # on the second vote either way and prove nothing.
          CONTEST_ID="$(node -e '
            const [web,url,key]=[process.env.WEB_BASE,process.env.SB_URL,process.env.SB_KEY];
            (async()=>{
              const j=await fetch(web+"/api/v1/contests?limit=10").then(r=>r.json()).catch(()=>[]);
              for (const c of (j||[])) {
                const s=await fetch(url+"/rest/v1/voting_settings?contest_id=eq."+c.id+"&select=id",{headers:{apikey:key,Authorization:"Bearer "+key}}).then(r=>r.json()).catch(()=>[1]);
                if (Array.isArray(s) && s.length===0) { process.stdout.write(c.id); return; }
              }
              process.stdout.write((j&&j[0]&&j[0].id)||"");
            })();')"
          echo "  contest: ${CONTEST_ID:-none-found}"
          CTID=""
          VS_OK=""
          if [ -n "$CONTEST_ID" ]; then
            CTID="$(node -e '
              const [url,key,cid]=[process.env.SB_URL,process.env.SB_KEY,process.argv[1]];
              fetch(url+"/rest/v1/contestants",{method:"POST",headers:{apikey:key,Authorization:"Bearer "+key,"Content-Type":"application/json",Prefer:"return=representation"},
                body:JSON.stringify({name:"Diag Vote Smoke",contest_id:cid,status:"approved",is_active:true,category:"diagnostic"})})
                .then(r=>r.json()).then(j=>process.stdout.write((j&&j[0]&&j[0].id)||"")).catch(()=>process.stdout.write(""));' "$CONTEST_ID")"
            VS_PRE="$(node -e '
              const [url,key,cid]=[process.env.SB_URL,process.env.SB_KEY,process.argv[1]];
              fetch(url+"/rest/v1/voting_settings?contest_id=eq."+cid+"&select=id",{headers:{apikey:key,Authorization:"Bearer "+key}})
                .then(r=>r.json()).then(j=>process.stdout.write(j&&j.length?"yes":"no")).catch(()=>process.stdout.write("unknown"));' "$CONTEST_ID")"
            if [ "$VS_PRE" = "no" ]; then
              VS_OK="$(node -e '
                const [url,key,cid]=[process.env.SB_URL,process.env.SB_KEY,process.argv[1]];
                fetch(url+"/rest/v1/voting_settings",{method:"POST",headers:{apikey:key,Authorization:"Bearer "+key,"Content-Type":"application/json",Prefer:"return=representation"},
                  body:JSON.stringify({contest_id:cid,voting_enabled:true,status:"active",voting_type:"free",free_voting_enabled:true,free_votes_per_day:3,require_login_for_free_vote:true,allow_anonymous_free_vote:false})})
                  .then(r=>process.stdout.write(String(r.status))).catch(()=>process.stdout.write(""));' "$CONTEST_ID")"
            fi
            echo "  seeded: contestant=${CTID:0:8}… voting_settings_pre=$VS_PRE seed_http=${VS_OK:-skipped}"
          fi
          export VS_PRE
          IDEM="diag-vote-$(date +%s)"
          if [ -n "$CTID" ]; then
            VOTE_OUT="$(curl -s -o /tmp/vb -w "%{http_code} %{time_total}s" --max-time 45 -X POST "$WEB_BASE/api/v2/votes/free" \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -H "X-Idempotency-Key: $IDEM" \
              -d "{\"contestId\":\"$CONTEST_ID\",\"contestantId\":\"$CTID\",\"voteQuantity\":1}")"
            printf "  %-62s -> %s  %s\n" "POST /api/v2/votes/free" "$VOTE_OUT" "$(head -c 220 /tmp/vb | tr '\n' ' ')"
            VOTE2_OUT="$(curl -s -o /tmp/vb2 -w "%{http_code} %{time_total}s" --max-time 45 -X POST "$WEB_BASE/api/v2/votes/free" \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -H "X-Idempotency-Key: $IDEM" \
              -d "{\"contestId\":\"$CONTEST_ID\",\"contestantId\":\"$CTID\",\"voteQuantity\":1}")"
            printf "  %-62s -> %s  %s\n" "POST /api/v2/votes/free (same idem-key)" "$VOTE2_OUT" "$(head -c 220 /tmp/vb2 | tr '\n' ' ')"
            node -e '
              const [url,key,cid,ctid]=[process.env.SB_URL,process.env.SB_KEY,process.argv[1],process.argv[2]];
              const h={apikey:key,Authorization:"Bearer "+key};
              Promise.all([
                fetch(url+"/rest/v1/votes?contestant_id=eq."+ctid,{method:"DELETE",headers:h}),
                fetch(url+"/rest/v1/voter_daily_limits?contest_id=eq."+cid,{method:"DELETE",headers:h}),
                fetch(url+"/rest/v1/vote_totals?contest_id=eq."+cid,{method:"DELETE",headers:h}),
                fetch(url+"/rest/v1/contestants?id=eq."+ctid,{method:"DELETE",headers:h}),
                (process.env.VS_PRE==="no"?fetch(url+"/rest/v1/voting_settings?contest_id=eq."+cid,{method:"DELETE",headers:h}):Promise.resolve({status:"kept"})),
              ]).then(rs=>console.log("  vote smoke cleanup: "+rs.map(r=>r.status).join(","))).catch(e=>console.log("  cleanup partial:",e.message));
            ' "$CONTEST_ID" "$CTID"
          fi
          echo "  --- cleanup ---"
          node -e '
            const [url,key,id]=[process.env.SB_URL,process.env.SB_KEY,process.argv[1]];
            fetch(url+"/auth/v1/admin/users/"+id,{method:"DELETE",headers:{apikey:key,Authorization:"Bearer "+key}}).then(r=>console.log("  deleted throwaway user: HTTP "+r.status)).catch(e=>console.log("  delete failed: "+e.message));
          ' "$UID_"
          # Schema drift check: the bridge dedup table and OTP store gate real
          # behaviour. A missing table makes checkAndClaimIdempotencyKey fail
          # OPEN (vote double-counts) and disables the OTP register path.
          echo "  --- schema presence (PostgREST 200=exists, 404/PGRST205=missing) ---"
          for t in bridge_idempotency_keys bridge_outbox otp_codes votes vote_totals voter_daily_limits voting_settings user_profiles ledger_accounts ledger_entries restaurants restaurant_likes restaurant_promos featured_campaign; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
              "$SB_URL/rest/v1/$t?limit=0")
            printf "  %-28s %s\n" "$t" "$code"
          done
          unset TOKEN SB_KEY
