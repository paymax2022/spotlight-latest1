# Mobile release via EAS (Expo Application Services).
# - Tag `mobile-v*` → production build (+ optional store submit).
# - workflow_dispatch → choose profile/platform, or push an OTA JS update.
# OTA (eas update) ships JS-only fixes instantly on the matching channel; native
# changes require a full build + store review.
#
# Prereqs (one-time, see docs/launch blueprint §14):
#   - Real bundle IDs in app.json (replace com.anonymous.*), `eas init` (projectId)
#   - Repo secret EXPO_TOKEN (Expo access token)
#   - Store creds in EAS (Apple ASC API key / Play service account) for submit
#   - Sentry source maps: SENTRY_ORG/SENTRY_PROJECT/SENTRY_AUTH_TOKEN as EAS secrets
name: mobile-eas

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        options: [preview, production]
        default: preview
      platform:
        description: "Platform"
        type: choice
        options: [all, ios, android]
        default: all
      ota_only:
        description: "Publish an OTA JS update instead of a full build"
        type: boolean
        default: false

defaults:
  run:
    working-directory: mobile-app/reactnative

permissions:
  contents: read

jobs:
  eas:
    # Skip (not fail) until EAS is configured. Set repo variable EAS_ENABLED=true
    # (and the EXPO_TOKEN secret) to activate.
    if: ${{ vars.EAS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/reactnative/package-lock.json
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install deps
        run: npm ci

      # `eas update` bundles JS on this runner. The EXPO_PUBLIC_* values in
      # eas.json's build profiles apply to `eas build` only, so without this step
      # the OTA bundle has no EXPO_PUBLIC_APP_ENV: the mock policy treats it as
      # development (mock data on money modules), the API base falls back to
      # localhost and the Supabase client throws — on every install on the channel.
      - name: Export the profile's public env for the OTA bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ota_only }}
        env:
          PROFILE: ${{ inputs.profile }}
        run: node scripts/export-eas-profile-env.mjs "$PROFILE" >> "$GITHUB_ENV"

      - name: OTA update (JS only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ota_only }}
        run: eas update --branch ${{ inputs.profile }} --message "${{ github.sha }}" --non-interactive

      - name: Build (+ submit on tag)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.ota_only) }}
        run: |
          PROFILE="${{ github.event_name == 'push' && 'production' || inputs.profile }}"
          PLATFORM="${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}"
          # Full build; on a production tag also auto-submit to the stores.
          SUBMIT_FLAG=""
          if [ "${{ github.event_name }}" = "push" ]; then SUBMIT_FLAG="--auto-submit"; fi
          eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait $SUBMIT_FLAG
