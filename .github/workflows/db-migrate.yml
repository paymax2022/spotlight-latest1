name: DB Migrate (Supabase db push)

# OPERATOR TOOL ONLY. This workflow no longer fires on a push: release.yml owns
# every automatic apply, one per environment, in the right order relative to the
# code that needs it. What is left here is the manual path — a one-off apply, a
# dry run to see what is pending, or an --include-all repair.
#
# Both routes go through _reusable-db-apply.yml, so there is exactly one way each
# database gets written and one pin (supabase CLI 2.114.0) that writes it.
#
# DO NOT re-add required reviewers to the `production` environment. An earlier
# version of this header recommended it. The reviewers were removed on
# 2026-11-15 as the whole point of the auto-release change
# (docs/superpowers/specs/2026-11-15-auto-deploy-release-pipeline-design.md), and
# a reviewer on `production` would silently re-gate every automatic production
# apply — including from release.yml, because a reusable-workflow job that
# declares `environment:` inherits that environment's protection rules.
#
# ── SAFETY / ENABLEMENT ──────────────────────────────────────────────────────
# This workflow is DORMANT until you opt in, because a `db push` against a
# DRIFTED remote fails (already-applied migrations collide). Do NOT enable it
# until the reconciliation runbook has brought the remote to `pending: 0`.
#
# To enable (after reconciliation):
#   1. Add repo secrets (Settings → Secrets and variables → Actions):
#        SUPABASE_ACCESS_TOKEN   personal/CI access token (account API)
#        SUPABASE_PROJECT_ID     the project ref (20-char, e.g. ptczqwfokydsdafpscex)
#        SUPABASE_DB_PASSWORD    the database password
#   2. Add repo variable:  DB_MIGRATE_ENABLED = true
#
# ── STAGING ──────────────────────────────────────────────────────────────────
# The staging apply is the same shape, gated on its own secrets/variable so it
# can go live independently of production:
#        SUPABASE_STAGING_PROJECT_ID    the staging project ref
#        SUPABASE_STAGING_DB_PASSWORD   the staging database password
#      repo variable:  DB_MIGRATE_STAGING_ENABLED = true
#      GitHub environment: `staging`
# SUPABASE_ACCESS_TOKEN is shared (it is an account token, not per-project).

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which database to act on'
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: 'List pending migrations only — do not apply'
        type: boolean
        default: true
      include_all:
        description: 'Staging only: pass --include-all so migrations older than the last applied one are applied too (needed when a back-dated migration was skipped; plain db push refuses)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: db-migrate-${{ github.ref }}
  cancel-in-progress: false # never interrupt a migration mid-apply

jobs:
  # Reuse the additive-only guard (no DROP / RENAME / type-narrowing) as a gate
  # before anything touches the remote.
  guard:
    name: additive-only guard
    uses: ./.github/workflows/_reusable-migration-guard.yml

  # STALE-REF GUARD, extracted from the old "Refuse a stale or unapproved ref"
  # step (carried across unchanged in substance): a dispatch, or a re-run of an
  # old run, checks out the commit that run was CREATED from, not the branch tip.
  # `supabase db push` then compares the remote against an out-of-date
  # supabase/migrations and aborts with "remote migration versions not found in
  # local migrations directory" (or, worse, applies against a tree that is
  # missing newer files).
  #
  # Staleness is an OUTPUT feeding skip_apply, not a job-level failure: the
  # reusable apply workflow DECIDES (a skip is a green no-op that still lets
  # downstream jobs run). The old "push → skip quietly" branch is gone because
  # this workflow is dispatch-only now. The hard assertions stay hard: the ref
  # must be a branch, an APPLY (dry_run=false) must be dispatched from main or
  # prod, and the branch tip must be readable.
  fresh:
    name: refuse a stale ref
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is this dispatch still the newest?
        id: check
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "stale=false" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" != "branch" ]; then
            echo "::error::Run ref '$REF_NAME' is a $REF_TYPE, not a branch - dispatch from a branch tip."
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ]; then
            case "$REF_NAME" in
              main|prod) ;;
              *) echo "::error::Applying migrations is only allowed from main or prod (got '$REF_NAME'). Use dry_run for other refs."; exit 1 ;;
            esac
          fi
          TIP=$(git ls-remote origin "refs/heads/$REF_NAME" | cut -f1)
          if [ -z "$TIP" ]; then
            echo "::error::Could not read the tip of origin/$REF_NAME."
            exit 1
          fi
          if [ "$RUN_SHA" = "$TIP" ]; then
            echo "Ref is current: $REF_NAME @ $RUN_SHA"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::this dispatch is not $REF_NAME's tip ($TIP) — a newer push superseded it. Nothing will be applied."
          fi

  apply:
    name: supabase db push (production)
    needs: [guard, fresh]
    if: inputs.target == 'production'
    uses: ./.github/workflows/_reusable-db-apply.yml
    permissions:
      contents: read
    # REQUIRED. A reusable workflow does not receive the caller's secrets
    # automatically; without this every secrets.SUPABASE_* below resolves empty.
    # The failure mode is safe — the :?missing guard fires before any db push —
    # but it fails, and it fails looking like a credentials problem.
    secrets: inherit
    with:
      target: production
      dry_run: ${{ inputs.dry_run }}
      # Deliberate asymmetry: --include-all is staging-only. An unattended
      # --include-all against production is how an old, superseded migration
      # gets applied out of order.
      include_all: false
      skip_apply: ${{ needs.fresh.outputs.stale == 'true' }}
      skip_reason: 'superseded by a newer push'

  apply-staging:
    name: supabase db push (staging)
    needs: [guard, fresh]
    if: inputs.target == 'staging'
    uses: ./.github/workflows/_reusable-db-apply.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      target: staging
      dry_run: ${{ inputs.dry_run }}
      include_all: ${{ inputs.include_all }}
      skip_apply: ${{ needs.fresh.outputs.stale == 'true' }}
      skip_reason: 'superseded by a newer push'
