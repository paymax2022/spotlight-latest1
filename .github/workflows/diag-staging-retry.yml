name: DIAG - staging legs with the retry fix

# Verdict of the run this file replaced (43909191817, 16:35:47-16:38:15Z): the
# #1044 retry fired exactly as designed - three legs, four attempts each, 12
# attempts spread over 150 s - and ALL TWELVE were refused. So "a short blip the
# chain rides out" is falsified, and #1044 as written is not sufficient to make
# a push reach production. What is left is to find out what the refusal IS.
#
# Two facts narrow it hard:
#   - 16:23:25Z: development's three legs called `railway up` within 1.7 s of
#     each other and all three got `Indexing...` immediately (run 43905969462).
#     Seven seconds later staging's three legs, same CLI, same project, equally
#     concurrent, were all refused. So concurrency is exonerated and the
#     discriminator is the ENVIRONMENT.
#   - Measured through `railway api`: all three STAGING instances carry
#     `source.repo = paymax2022/spotlight-latest1` (plus rootDirectory on the two
#     frontends); every development instance has `source.repo = null`; production
#     has `source = null` outright. Uploads are reliable where there is no
#     connected source and flaky where there is one.
#
# This job interleaves the identical upload call between development and staging,
# one pair every ~12 s, with `--verbose`, so time is held constant across the two
# environments and a refusal is captured with whatever the CLI reveals about it.
# It stops as soon as it holds one refusal and one acceptance side by side.
#
# Never prints a token: both secrets are masked for the job and every line is
# passed through a redactor before it reaches the log.

on:
  workflow_dispatch:
  push:
    branches: [diag/railway-up-probe]

permissions:
  contents: read

concurrency:
  group: diag-staging-retry
  cancel-in-progress: false

env:
  RAILWAY_PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
  RAILWAY_HTTP_TIMEOUT: '600'

jobs:
  probe:
    name: interleaved dev/staging upload probe
    runs-on: ubuntu-latest
    steps:
      - name: Mask both tokens, keep only their lengths
        env:
          TOK_STAGING: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          TOK_DEVELOPMENT: ${{ secrets.RAILWAY_TOKEN_DEVELOPMENT }}
        run: |
          set -euo pipefail
          for pair in "staging:$TOK_STAGING" "development:$TOK_DEVELOPMENT"; do
            n="${pair%%:*}"; v="${pair#*:}"
            if [ -z "$v" ]; then echo "::error::RAILWAY_TOKEN_${n^^} is empty"; exit 1; fi
            echo "::add-mask::$v"
            printf '%s' "$v" > "/tmp/tok_$n"
            chmod 600 "/tmp/tok_$n"
            echo "$n token length (never value): ${#v}"
          done

      - name: Checkout a real backend tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install the release chain's pinned CLI
        run: |
          set -euo pipefail
          npm install --global @railway/cli@5.40.1
          railway --version

      - name: Interleave the same upload across both environments
        run: |
          set -uo pipefail
          SHORT="$(git rev-parse --short HEAD)"
          redact() {
            sed -E 's#eyJ[A-Za-z0-9._-]{10,}#<jwt-redacted>#g;
                    s#(rlwy_[A-Za-z0-9_-]{4})[A-Za-z0-9_-]+#\1<redacted>#g;
                    s#([Aa]uthorization[^:]*:).*#\1 <header-redacted>#g'
          }
          got_refusal=0; got_accept=0
          : > /tmp/table.tsv
          for i in 1 2 3 4 5 6; do
            for n in development staging; do
              start=$(date +%H:%M:%S)
              export RAILWAY_TOKEN="$(cat "/tmp/tok_$n")"
              # Written to a file, not a command substitution: `out="$(cmd | head)"`
              # reports head's status, which would record every refusal as exit 0.
              railway up backend --path-as-root --no-gitignore \
                --service backend --environment "$n" --project "$RAILWAY_PROJECT" \
                --detach --verbose \
                --message "vp-$i-$n-$SHORT" > /tmp/raw.txt 2>&1
              rc=$?
              out="$(redact < /tmp/raw.txt | head -c 1200)"
              echo "=== pair $i / $n -> exit=$rc at $start ==="
              printf '%s\n' "$out" | sed 's/^/    /'
              printf '%s\t%s\t%s\t%s\n' "$i" "$n" "$start" "$rc" >> /tmp/table.tsv
              if [ "$rc" -eq 0 ]; then got_accept=1; else got_refusal=1; fi
              unset RAILWAY_TOKEN
              sleep 6
            done
            if [ "$got_refusal" -eq 1 ] && [ "$got_accept" -eq 1 ]; then
              echo "=== hold both outcomes: stopping early ==="
              break
            fi
            sleep 6
          done
          echo "=== outcome table (pair, environment, clock, exit) ==="
          column -t /tmp/table.tsv
