name: DIAG - staging legs with the retry fix

# Where the investigation stands when this file runs.
#
# The proximate cause is settled: Railway answers its OWN `railway up`
# upload-initiate request with a non-JSON body, so the CLI dies in ~0.5 s with
# "error decoding response body / expected value at line 1 column 1" before it
# even prints `Indexing...`. No deployment row is created, and nothing local
# changes it.
#
# What is NOT settled is what makes it answer that way. Exonerated by measurement
# so far: token value/scope, CLI version (5.40.1 / 5.71.0 / 5.74.1), CI=true and
# the runner image, upload shape, tree size, `environment: staging` protection
# rules, and request *rate* (two accepted 3 s apart, then refused 62 s later).
#
# A mid-investigation hypothesis - "the staging instances' connected git source is
# the discriminator" - was falsified by run 43910959092: staging accepted 12 of 12
# uploads serially at 16:45:29-16:47:40, alongside development, same project, same
# CLI. That run killed concurrency as a blanket excuse, but it only ever made
# serial calls, so it could not test the other direction.
#
# What remains is the one shape that fits all 39 observations: a cap on how many
# `railway up` calls are IN FLIGHT at once, answered with a garbage body rather
# than a 429. 15 of 15 refusals came from jobs whose three matrix legs fired
# within 5 s of each other; 24 of 24 acceptances came from serial calls or from the
# first three slots of a six-way pile-up.
#
# This job tests exactly that, staging-only, with itself as the control:
#   HALF S - six identical calls, one after another   (model predicts 6/6 accepted)
#   HALF C - the same six calls within ~5 s           (model predicts a pile-up loss)
# Serial runs first so the concurrent half's build queue cannot pollute the
# control. Both halves are the same command, service, token and tree - only the
# arrival pattern differs.
#
# Caveat recorded up front: the fault is time-boxed (12/12 refused at 16:35,
# 12/12 accepted at 16:45), so "both halves accepted" means the window was shut
# while this ran and is NOT evidence against the model. Only S-accepted plus
# C-refused is decisive.
#
# Never prints a token: the secret is masked for the job and every line goes
# through a redactor before it reaches the log. Production is never referenced.

on:
  workflow_dispatch:
  push:
    branches: [diag/railway-up-probe]

permissions:
  contents: read

concurrency:
  group: diag-staging-retry
  cancel-in-progress: false

env:
  # railway-deploy.sh hard-requires RAILWAY_PROJECT (`: "${RAILWAY_PROJECT:?}"`),
  # which release.yml sets workflow-wide. Naming this PROJECT instead is the exact
  # instrumentation mistake that made an earlier probe die before `railway up`.
  RAILWAY_PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
  RAILWAY_HTTP_TIMEOUT: '600'

jobs:
  probe:
    name: serial-vs-concurrent upload A/B (staging)
    runs-on: ubuntu-latest
    steps:
      - name: Mask the staging token, keep only its length
        env:
          TOK_STAGING: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          set -euo pipefail
          if [ -z "$TOK_STAGING" ]; then echo "::error::RAILWAY_TOKEN_STAGING is empty"; exit 1; fi
          echo "::add-mask::$TOK_STAGING"
          printf '%s' "$TOK_STAGING" > /tmp/tok_staging
          chmod 600 /tmp/tok_staging
          echo "staging token length (never value): ${#TOK_STAGING}"

      - name: Checkout a real backend tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install the release chain's pinned CLI
        run: |
          set -euo pipefail
          npm install --global @railway/cli@5.40.1
          railway --version

      - name: Six calls one at a time, then six at once
        run: |
          set -uo pipefail
          SHORT="$(git rev-parse --short HEAD)"
          export RAILWAY_TOKEN="$(cat /tmp/tok_staging)"

          # $1 = label, $2 = seconds to wait before firing. Every call appends one
          # complete line to a shared table, because a shell glob over
          # /tmp/"$1"*.txt inside a function mis-counted in the local dry run.
          # `refused` is decided by the error text, not the exit code: a refusal
          # returns in ~0.5 s before `Indexing...`, while an accepted upload takes
          # seconds-to-minutes, so the duration column is itself evidence.
          one() {
            local label="$1" lead="$2" t0 rc dur verdict
            sleep "$lead"
            t0=$SECONDS
            railway up backend --path-as-root --no-gitignore \
              --service backend --environment staging --project "$RAILWAY_PROJECT" \
              --detach --message "ab-$label-$SHORT" > "/tmp/$label.txt" 2>&1
            rc=$?
            dur=$((SECONDS - t0))
            if grep -q 'error decoding response body' "/tmp/$label.txt"; then
              verdict=refused
            elif grep -q 'Indexing' "/tmp/$label.txt"; then
              verdict=accepted
            else
              verdict="unknown-exit-$rc"
            fi
            printf '%s\t%s\t%s\t%ss\texit=%s\n' \
              "$label" "$verdict" "$(date -u +%H:%M:%S)" "$dur" "$rc" >> /tmp/outcomes.tsv
          }

          refused_in() {
            awk -v p="$1" 'substr($1,1,length(p))==p && $2=="refused" {n++} END {print n+0}' \
              /tmp/outcomes.tsv
          }

          : > /tmp/outcomes.tsv
          echo "=== HALF S (control): six identical calls, one after another ==="
          for i in 1 2 3 4 5 6; do one "S$i" 0; sleep 6; done
          S_REFUSE=$(refused_in S)
          echo "serial refusals: ${S_REFUSE}/6"

          echo "--- 60 s pause so nothing from the control is still in flight ---"
          sleep 60

          echo "=== HALF C (test): the same six calls fired within ~5 s ==="
          for i in 1 2 3 4 5 6; do one "C$i" "$((i - 1))" & done
          wait
          C_REFUSE=$(refused_in C)
          echo "concurrent refusals: ${C_REFUSE}/6"

          echo "=== outcome table (label, verdict, utc clock, duration, exit) ==="
          sort /tmp/outcomes.tsv | column -t

          echo "=== verdict ==="
          if [ "$S_REFUSE" -eq 0 ] && [ "$C_REFUSE" -gt 0 ]; then
            echo "DECISIVE FOR THE IN-FLIGHT MODEL: serial accepted, concurrent refused."
          elif [ "$S_REFUSE" -gt 0 ] && [ "$C_REFUSE" -gt 0 ]; then
            echo "BOTH REFUSED: window open regardless of shape - arrival pattern is not it."
          elif [ "$S_REFUSE" -eq 0 ] && [ "$C_REFUSE" -eq 0 ]; then
            echo "INCONCLUSIVE: no refusals - the fault window was shut during this run."
          else
            echo "BACKWARDS: serial refused while concurrent was accepted. Model is wrong."
          fi

      - name: Show each refusal's raw tail (redacted)
        if: always()
        run: |
          set -uo pipefail
          redact() {
            sed -E 's#eyJ[A-Za-z0-9._-]{10,}#<jwt-redacted>#g;
                    s#(rlwy_[A-Za-z0-9_-]{4})[A-Za-z0-9_-]+#\1<redacted>#g;
                    s#([Aa]uthorization[^:]*:).*#\1 <header-redacted>#g'
          }
          for f in /tmp/S*.txt /tmp/C*.txt; do
            [ -f "$f" ] || continue
            if grep -q 'error decoding response body' "$f"; then
              echo "=== $(basename "$f" .txt) refused - last 15 lines ==="
              tail -15 "$f" | redact
            fi
          done
