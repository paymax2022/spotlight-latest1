name: Health CI

# Verification gate for the Health verticals (shared platform + Pharmacy, Lab,
# Vet). No Go toolchain in the authoring sandbox, so packages were verified
# static-only; this is the real gate: full go build/vet/test, mobile + admin +
# web typecheck, additive-only migration guard. Blocks merges on red.

on:
  push:
    paths:
      # NOTE: backend/internal/app/finance_routes.go is deliberately NOT listed.
      # It is the shared finance router that EVERY module registers into, so any
      # module's change touches it and used to wake all nine module CIs at once.
      # Compile/vet/full `go test ./...` coverage for such a change still runs via
      # fx-ci (paths: backend/**) and connect-ci (bare pull_request), and ci.yml
      # builds+vets on every PR — so nothing here is the only thing catching it.
      - 'backend/internal/health/**'
      - 'backend/internal/app/health_*.go'
      - 'backend/internal/config/config.go'
      - 'supabase/migrations/*health_*.sql'
      - 'frontend-admin/app/admin/health/**'
      - 'frontend-admin/src/services/health*AdminService.ts'
      - 'frontend-admin/src/types/health*Admin.ts'
      - 'frontend-admin/src/components/layouts/AdminSidebar.tsx'
      - 'frontend-web/app/api/v1/health/**'
      - 'frontend-web/src/lib/feature-flags.ts'
      - 'mobile-app/reactnative/app/health/**'
      - 'mobile-app/reactnative/src/features/health/**'
      - 'mobile-app/reactnative/src/constants/modules.ts'
      - '.github/workflows/health-ci.yml'
  pull_request:
    # Mirrors the push filter: this module's CI no longer runs on PRs that
    # do not touch it. Repo-wide coverage still runs on every PR (ci.yml,
    # connect-ci full go test ./..., integration-verify, security).
    paths:
      - 'backend/internal/health/**'
      - 'backend/internal/app/health_*.go'
      - 'backend/internal/config/config.go'
      - 'supabase/migrations/*health_*.sql'
      - 'frontend-admin/app/admin/health/**'
      - 'frontend-admin/src/services/health*AdminService.ts'
      - 'frontend-admin/src/types/health*Admin.ts'
      - 'frontend-admin/src/components/layouts/AdminSidebar.tsx'
      - 'frontend-web/app/api/v1/health/**'
      - 'frontend-web/src/lib/feature-flags.ts'
      - 'mobile-app/reactnative/app/health/**'
      - 'mobile-app/reactnative/src/features/health/**'
      - 'mobile-app/reactnative/src/constants/modules.ts'
      - '.github/workflows/health-ci.yml'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - name: Build (whole backend — catches wiring/import breaks)
        run: go build ./...
      - name: Vet (health platform + verticals)
        run: go vet ./internal/health/...
      - name: Test (state machines, dispense-once, chain-of-custody, critical escalation, escrow hold/release/refund, NDPA access)
        run: go test ./internal/health/... -count=1 -v
      - name: Test (all — regression)
        run: go test ./... -count=1

  admin-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run type-check

  web-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npx tsc --noEmit

  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app/reactnative
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json

  migration-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject destructive DDL in health migrations (additive-only)
        run: |
          set -e
          FILES=$(ls supabase/migrations/*health_*.sql 2>/dev/null || true)
          if [ -z "$FILES" ]; then echo "no health migrations"; exit 0; fi
          if echo "$FILES" | xargs sed 's/--.*$//' | grep -iEn '\b(drop\s+(table|column|type)|alter\s+[a-z_."]+\s+drop|drop\s+not\s+null|rename\s+(column|to))\b' | grep -ivE 'drop\s+(policy|trigger)\s+if\s+exists'; then
            echo "::error::Destructive DDL found in health migration (must be additive-only)"; exit 1;
          fi
          echo "Additive-only guard passed."
