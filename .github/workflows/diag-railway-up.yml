name: Diag - railway up pre-flight

# DIAGNOSTIC ONLY. Writes nothing to any environment that takes production traffic.
#
# WHY THIS EXISTS
# release.yml's `deploy Staging (*)` legs die 384 ms into `railway up` with
#   Failed to fetch: error decoding response body
#     0: error decoding response body
#     1: expected value at line 1 column 1
# while `deploy Development (*)` succeeds in the same run, on the same runner
# image, with the same CLI pin. `railway up` is not piped or swallowed by the
# script, and no `Indexing...` line reaches the log — so the CLI fails on a
# request that happens BEFORE it builds an archive.
#
# Measured facts already established (2026-11-16):
#   * the credential — the same secret value serves two READ-ONLY lanes in CI
#     (Staging inspect, Ops - list Railway variable names) that pass;
#   * the CLI version — `railway --version` on the runner prints 5.40.1 (run
#     43899596110), the same build used in a local linux/x86_64 container;
#   * the CI flag — CI=true in that container changes nothing;
#   * the runner's egress for reads — `railway status --environment staging
#     --json` returned 40632 bytes of valid JSON from the runner;
#   * service resolution on the runner — a nonexistent service name returns the
#     clean `Service not found` in 260 ms, so the environment lookup and the
#     service lookup are both healthy against staging.
#
# That leaves exactly two untested variables, and the probes below separate them:
#   A. the ENVIRONMENT/INSTANCE (staging vs development) for the request that
#      runs after service resolution;
#   B. the UPLOAD TREE. The staging legs pass no positional path, so they upload
#      the repository root: 201.3 MB over 11,267 files. The dev and prod legs
#      pass `frontend-web` / `frontend-admin` + `--path-as-root`: 110.3 MB and
#      7.8 MB. Probes 4/5 upload one 6-byte file; Probe 6 uploads the real
#      checkout with the real (pathless) shape.
#
# Reading the matrix:
#   4 fails, 5 passes -> the staging instance/environment breaks that request,
#                        independent of tree size and of the runner in general.
#   4 passes, 6 fails -> the tree/size decides it; the fix is to stop uploading
#                        the repo root (per-environment upload shape, like dev/prod).
#   4 passes, 6 passes-> nothing here reproduces it; the difference is in the
#                        release job's own inputs, not the runner.
#
# SAFETY
# Probes 1/2 name a service that does not exist, so `up` stops at service
# resolution BEFORE it indexes or uploads (measured: no deployment is created).
# Probes 4/5/6 use a real service and therefore DO create a deployment attempt.
# 4 and 5 upload a single 6-byte file, so their build cannot succeed and they can
# never become the serving deployment (five of these already ran on staging
# frontend-admin on 2026-11-16; none took traffic). Probe 6 uploads the real
# checkout to staging `frontend-admin`, where a build is legitimate: if it
# succeeds it becomes staging's admin deployment, which is what the release chain
# intends anyway, and it never touches production. No secret value is ever
# printed: tokens are masked and every reply is shown as a byte count plus a
# schema-shaped prefix.

on:
  workflow_dispatch: {}
  push:
    branches:
      - diag/railway-up-probe

permissions:
  contents: read

concurrency:
  group: diag-railway-up
  cancel-in-progress: false

jobs:
  probe:
    name: pre-flight probes
    runs-on: ubuntu-latest
    env:
      PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
      API: https://backboard.railway.app/graphql/v2
    steps:
      - name: Resolve tokens without printing them
        env:
          TOK_STAGING: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          TOK_DEVELOPMENT: ${{ secrets.RAILWAY_TOKEN_DEVELOPMENT }}
        run: |
          set -euo pipefail
          len_staging=0; len_development=0
          for pair in "STAGING:$TOK_STAGING" "DEVELOPMENT:$TOK_DEVELOPMENT"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if [ -z "$val" ]; then
              echo "::error::RAILWAY_TOKEN_${name} is empty"
              exit 1
            fi
            echo "::add-mask::$val"
            printf '%s' "$val" > "/tmp/tok_$name"
            eval "len_${name,,}=\${#val}"
          done
          chmod 600 /tmp/tok_STAGING /tmp/tok_DEVELOPMENT
          echo "token lengths (never values): staging=$len_staging development=$len_development"

      - name: Checkout the real tree (Probe 6 uploads this)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Runner facts that could matter
        run: |
          set -uo pipefail
          uname -a
          echo "node: $(node --version)"
          echo "curl: $(curl --version | head -1)"
          echo "HOME=$HOME  .railway dir: $([ -d "$HOME/.railway" ] && echo present || echo absent)"
          echo "--- proxy-ish env (names only) ---"
          env | grep -iE 'proxy|no_proxy|http_' | cut -d= -f1 | sort || echo "(none)"
          echo "--- railway-ish env (names only) ---"
          env | grep -E '^RAILWAY[A-Z_]*' | cut -d= -f1 | sort || echo "(none)"
          echo "--- what a repo-root upload would contain ---"
          echo "checkout bytes (du, no .git): $(du -sb --exclude=.git . | cut -f1)"
          echo "file count: $(find . -path ./.git -prune -o -type f -print | wc -l)"
          echo "frontend-web subdir bytes: $(du -sb frontend-web | cut -f1)"

      - name: Install the pinned Railway CLI
        run: |
          set -euo pipefail
          npm install --global @railway/cli@5.40.1
          railway --version

      - name: 'Probe 1 - staging pre-flight with a nonexistent service (zero write)'
        continue-on-error: true
        run: |
          set -uo pipefail
          export RAILWAY_TOKEN="$(cat /tmp/tok_STAGING)"
          echo "--- staging / nonexistent service ---"
          railway up --verbose --no-gitignore \
            --service definitely-not-a-service-xyz \
            --environment staging --project "$PROJECT" \
            --detach --message diag-preflight-staging > /tmp/p1.log 2>&1
          echo "exit=$?"
          sed -n '1,60p' /tmp/p1.log

      - name: 'Probe 2 - development pre-flight with the same shape (control)'
        continue-on-error: true
        run: |
          set -uo pipefail
          export RAILWAY_TOKEN="$(cat /tmp/tok_DEVELOPMENT)"
          echo "--- development / nonexistent service ---"
          railway up --verbose --no-gitignore \
            --service definitely-not-a-service-xyz \
            --environment development --project "$PROJECT" \
            --detach --message diag-preflight-development > /tmp/p2.log 2>&1
          echo "exit=$?"
          sed -n '1,60p' /tmp/p2.log

      - name: 'Probe 3 - raw API reply from the runner (transport)'
        continue-on-error: true
        run: |
          set -uo pipefail
          body='{"query":"query { __schema { queryType { name } } }"}'
          code="$(curl -sS -o /tmp/raw.json -w '%{http_code}' -m 60 \
            -X POST "$API" \
            -H "Authorization: Bearer $(cat /tmp/tok_STAGING)" \
            -H 'Content-Type: application/json' \
            --data "$body" || echo 000)"
          echo "staging token -> HTTP $code, bytes $(wc -c </tmp/raw.json)"
          head -c 120 /tmp/raw.json; echo
          echo "--- same request with no Authorization header (baseline) ---"
          code="$(curl -sS -o /tmp/raw2.json -w '%{http_code}' -m 60 -X POST "$API" \
            -H 'Content-Type: application/json' --data "$body" || echo 000)"
          echo "anonymous -> HTTP $code, bytes $(wc -c </tmp/raw2.json)"
          head -c 120 /tmp/raw2.json; echo

      - name: 'Probe 4 - staging, real service, 1-file archive (variable A)'
        continue-on-error: true
        run: |
          set -uo pipefail
          export RAILWAY_TOKEN="$(cat /tmp/tok_STAGING)"
          rm -rf /tmp/onesvc && mkdir -p /tmp/onesvc && printf 'probe\n' > /tmp/onesvc/probe.txt
          cd /tmp/onesvc
          echo "cwd: $(pwd)  bytes: $(du -sb . | cut -f1)"
          start=$(date +%s%3N)
          RUST_LOG=debug railway up --verbose --no-gitignore \
            --service frontend-admin --environment staging --project "$PROJECT" \
            --detach --message "diag-tiny-${GITHUB_RUN_ID}" > /tmp/p4.log 2>&1
          rc=$?
          echo "exit=$rc elapsed_ms=$(( $(date +%s%3N) - start ))"
          sed -n '1,80p' /tmp/p4.log
          echo "...(tail)..."
          tail -n 40 /tmp/p4.log

      - name: 'Probe 5 - development, real service, 1-file archive (variable A control)'
        continue-on-error: true
        run: |
          set -uo pipefail
          export RAILWAY_TOKEN="$(cat /tmp/tok_DEVELOPMENT)"
          rm -rf /tmp/onesvc2 && mkdir -p /tmp/onesvc2 && printf 'probe\n' > /tmp/onesvc2/probe.txt
          cd /tmp/onesvc2
          echo "cwd: $(pwd)  bytes: $(du -sb . | cut -f1)"
          start=$(date +%s%3N)
          RUST_LOG=debug railway up --verbose --no-gitignore \
            --service frontend-admin --environment development --project "$PROJECT" \
            --detach --message "diag-tiny-dev-${GITHUB_RUN_ID}" > /tmp/p5.log 2>&1
          rc=$?
          echo "exit=$rc elapsed_ms=$(( $(date +%s%3N) - start ))"
          sed -n '1,80p' /tmp/p5.log
          echo "...(tail)..."
          tail -n 40 /tmp/p5.log

      - name: 'Probe 6 - staging, real service, FULL repo root (variable B, exact release shape)'
        continue-on-error: true
        run: |
          set -uo pipefail
          export RAILWAY_TOKEN="$(cat /tmp/tok_STAGING)"
          cd "$GITHUB_WORKSPACE"
          echo "cwd: $(pwd)  bytes(no .git): $(du -sb --exclude=.git . | cut -f1)"
          start=$(date +%s%3N)
          railway up --verbose --no-gitignore \
            --service frontend-admin --environment staging --project "$PROJECT" \
            --detach --message "diag-tree-${GITHUB_RUN_ID}" > /tmp/p6.log 2>&1
          rc=$?
          echo "exit=$rc elapsed_ms=$(( $(date +%s%3N) - start ))"
          sed -n '1,80p' /tmp/p6.log
          echo "...(tail)..."
          tail -n 40 /tmp/p6.log
