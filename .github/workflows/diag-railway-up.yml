name: Diag - staging backend upload, CLI version as the last variable

# DIAGNOSTIC ONLY. Two uploads to staging `backend`, one read-only production call.
# Nothing here writes to development or production.
#
# WHAT IS NOW SETTLED (all measured 2026-11-16, run 43904662033 unless noted)
# Inside ONE job, 21 seconds apart, same runner, same pinned CLI 5.40.1, same
# staging token, same checkout tree:
#   `railway up --no-gitignore --service frontend-web --environment staging`
#       (no positional path, no --path-as-root)  -> exit 0 in 15738 ms,
#       deployment d5825eff, and 7f7efc20 from the identical leg at 16:04 reached
#       SUCCESS with meta.configFile=/frontend-web/railway.json; staging
#       frontend-web then served HTTP 200 with the "Loading Spotlight" literal.
#   `railway up backend --path-as-root --no-gitignore --service backend
#       --environment staging`                   -> exit 1 in 400 ms with
#       Failed to fetch: error decoding response body / expected value at line 1
#       column 1.
# Run 43886555996 (14:31, push, ee58728e0) shows the SAME script and the SAME
# `backend --path-as-root` shape passing as `deploy Development (backend)`.
# Local CLI 5.71.0 runs that same shape against staging backend successfully at
# 15:29 (d3bfd45e, SUCCESS, configFile=/railway.json).
#
# So the failure needs staging AND --path-as-root AND the pinned 5.40.1 at once.
# The two candidate causes cannot be separated by reads; they can by one job that
# runs the identical command under both CLI versions:
#   A fails, B succeeds -> the CLI pin is the defect; bump it in release.yml.
#   A fails, B fails    -> it is the staging backend service/environment, not the
#                          CLI; the next probe is the service's rootDirectory.
#   A succeeds          -> the window closed; nothing here is reproducible and the
#                          chain should simply be re-run for real.
#
# SAFETY
# staging backend is currently serving d3bfd45e built from origin/main's backend/;
# this branch's backend/ is byte-identical to origin/main (verified with
# `git diff --stat origin/main HEAD -- backend/` -> empty), so a successful upload
# here puts the same code on staging that the release chain intends to put there.
# The production probe is `railway deployment list` - a read. It cannot deploy.
# Tokens are masked with ::add-mask::, never printed (lengths only), and every CLI
# reply is passed through the same redaction sed the deploy script uses.

on:
  workflow_dispatch: {}
  push:
    branches:
      - diag/railway-up-probe

permissions:
  contents: read

concurrency:
  group: diag-railway-up
  cancel-in-progress: false

jobs:
  probe:
    name: staging backend under two CLI versions
    runs-on: ubuntu-latest
    # Same environment declaration as release.yml's deploy-staging job.
    environment: staging
    env:
      PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
      RAILWAY_HTTP_TIMEOUT: '600'
    steps:
      - name: Resolve both tokens without printing either
        env:
          TOK_STAGING: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          TOK_PRODUCTION: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          set -euo pipefail
          for pair in STAGING:"$TOK_STAGING" PRODUCTION:"$TOK_PRODUCTION"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ -z "$value" ]; then echo "::error::RAILWAY_TOKEN_$name is empty"; exit 1; fi
            echo "::add-mask::$value"
            printf '%s' "$value" > "/tmp/tok_$name"
            chmod 600 "/tmp/tok_$name"
            echo "$name token length (never value): ${#value}"
          done

      - name: Checkout the tree the release chain would upload
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install the Railway CLI version release.yml pins
        run: |
          set -euo pipefail
          npm install --global @railway/cli@5.40.1
          railway --version

      - name: 'Probe A - staging backend, --path-as-root, on the pinned CLI'
        continue-on-error: true
        run: |
          set -uo pipefail
          export RAILWAY_TOKEN="$(cat /tmp/tok_STAGING)"
          SHA="$(git rev-parse HEAD)"
          echo "tree: $(du -sb --exclude=.git . | cut -f1) bytes, message $SHA"
          start=$(date +%s%3N)
          railway up backend --path-as-root --no-gitignore \
            --service backend --environment staging --project "$PROJECT" \
            --detach --message "diagA-$SHA" > /tmp/a.log 2>&1
          echo "exit=$? elapsed_ms=$(( $(date +%s%3N) - start ))"
          sed -E 's#eyJ[A-Za-z0-9._-]{20,}#<jwt-redacted>#g; s#(sk_|pk_)[A-Za-z0-9_-]{10,}#<key-redacted>#g' /tmp/a.log

      - name: Install the latest Railway CLI
        run: |
          set -euo pipefail
          npm install --global @railway/cli@latest
          railway --version

      - name: 'Probe B - the identical command, one variable changed: the CLI'
        continue-on-error: true
        run: |
          set -uo pipefail
          export RAILWAY_TOKEN="$(cat /tmp/tok_STAGING)"
          SHA="$(git rev-parse HEAD)"
          start=$(date +%s%3N)
          railway up backend --path-as-root --no-gitignore \
            --service backend --environment staging --project "$PROJECT" \
            --detach --message "diagB-$SHA" > /tmp/b.log 2>&1
          echo "exit=$? elapsed_ms=$(( $(date +%s%3N) - start ))"
          sed -E 's#eyJ[A-Za-z0-9._-]{20,}#<jwt-redacted>#g; s#(sk_|pk_)[A-Za-z0-9_-]{10,}#<key-redacted>#g' /tmp/b.log

      - name: 'Probe C - the production token, read-only, no deploy'
        continue-on-error: true
        run: |
          set -uo pipefail
          export RAILWAY_TOKEN="$(cat /tmp/tok_PRODUCTION)"
          echo "--- production deployment list (read only) ---"
          railway deployment list --service backend --environment production \
            --project "$PROJECT" --limit 3 --json 2>&1 \
            | sed -E 's#eyJ[A-Za-z0-9._-]{20,}#<jwt-redacted>#g' \
            | jq -r 'if type=="array" then (.[] | "\(.createdAt) \(.id[0:8]) \(.status) cfg=\(.meta.configFile)") else . end' 2>&1 | head -6

      - name: Read back what the two probes created on staging
        if: always()
        run: |
          set -uo pipefail
          export RAILWAY_TOKEN="$(cat /tmp/tok_STAGING)"
          sleep 15
          railway deployment list --service backend --environment staging \
            --project "$PROJECT" --limit 4 --json \
            | jq -r '.[] | "\(.createdAt) \(.id[0:8]) \(.status) msg=\(.meta.cliMessage[0:18]) cfg=\(.meta.configFile)"'
