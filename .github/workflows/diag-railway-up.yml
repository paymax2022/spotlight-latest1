name: Diag - railway up pre-flight

# STAGING ONLY. Replays release.yml's two unproven staging legs from CI. Production is untouched.
#
# WHY THIS EXISTS
# release.yml's `deploy Staging (*)` legs died ~400 ms into `railway up` with
#   Failed to fetch: error decoding response body
#     0: error decoding response body
#     1: expected value at line 1 column 1
# while `deploy Development (*)` succeeded in the same run, on the same runner
# image, with the same CLI pin. `railway up` is not piped or swallowed by the
# script, and no `Indexing...` line reaches the log — so the CLI failed on a
# request that happens BEFORE it builds an archive. Development prints
# `Indexing...` 146 ms after start, so ~400 ms with nothing printed is a
# pre-flight failure, not an upload failure.
#
# ELIMINATED BY DIRECT MEASUREMENT (2026-11-16, runs 43899596110 / 43901783148):
#   * the credential — the same secret serves two read-only CI lanes that pass,
#     and `railway status --environment staging --json` returned 40632 bytes of
#     valid JSON from the runner;
#   * the CLI version — the runner prints `railway 5.40.1`, the same build used
#     in a local linux/x86_64 container;
#   * the CI flag — CI=true in that container changes nothing;
#   * service/environment resolution — a nonexistent service returns the clean
#     `Service not found` in 260 ms against staging on the runner;
#   * THE UPLOAD SHAPE AND SIZE — Probe 6 ran the staging frontends' exact
#     pathless repo-root upload (211,130,595 bytes on disk, a 133,423,024-byte
#     archive) from a GitHub runner and finished exit=0 in 16,055 ms, producing
#     deployment e4670d96 which built to SUCCESS. A 6-byte archive succeeded
#     against both staging and development.
#   * the staging instance — a 1-file upload to staging `frontend-admin`
#     succeeded (ca5f227a), as did development's (6f5f5666).
#
# So nothing about the runner, the shape, the tree or the credential explains the
# 15:10 reds. What is left is that those legs ran inside a job declaring
# `environment: staging`, and this job now declares it too. The two legs below
# replay the real thing: the pathless frontend-web upload with a SHA-shaped
# message and RAILWAY_HTTP_TIMEOUT=600, and the backend leg through
# scripts/ci/railway-deploy.sh itself.
#
# SAFETY
# Staging only. Both legs upload real archives, so they create real staging
# deployments — which is what the release chain does on every push to main, and
# staging is meant to hold main. Nothing here can reach production: production is
# a different Railway environment that this workflow's token is not scoped to.
# No secret value is ever printed; the token is masked and used from a 0600 file.

on:
  workflow_dispatch: {}
  push:
    branches:
      - diag/railway-up-probe

permissions:
  contents: read

concurrency:
  group: diag-railway-up
  cancel-in-progress: false

jobs:
  probe:
    name: staging legs, inside the staging environment
    runs-on: ubuntu-latest
    # The release chain's deploy-staging job declares `environment: staging`.
    # This job now does too, so the one input that differed between the red
    # 15:10 legs and the green 15:56 probes is no longer a variable.
    environment: staging
    env:
      PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
      # Same value release.yml sets workflow-wide.
      RAILWAY_HTTP_TIMEOUT: '600'
    steps:
      - name: Resolve the staging token without printing it
        env:
          TOK_STAGING: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          set -euo pipefail
          if [ -z "$TOK_STAGING" ]; then echo "::error::RAILWAY_TOKEN_STAGING is empty"; exit 1; fi
          echo "::add-mask::$TOK_STAGING"
          printf '%s' "$TOK_STAGING" > /tmp/tok_STAGING
          chmod 600 /tmp/tok_STAGING
          echo "staging token length (never value): ${#TOK_STAGING}"

      - name: Checkout the tree the release chain would upload
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install the pinned Railway CLI
        run: |
          set -euo pipefail
          npm install --global @railway/cli@5.40.1
          railway --version

      # release.yml's staging frontend legs: NO positional path, NO --path-as-root,
      # because staging's frontend instances carry rootDirectory=frontend-web /
      # frontend-admin, so the archive must be the whole repo. frontend-web had
      # never completed a `railway up` from CI; five local attempts at 15:31-15:58
      # all ended FAILED with no build, so the leg is unproven, not the shape.
      - name: 'Leg 1 - frontend-web, pathless repo-root upload (exact release shape)'
        continue-on-error: true
        run: |
          set -uo pipefail
          export RAILWAY_TOKEN="$(cat /tmp/tok_STAGING)"
          SHA="$(git rev-parse HEAD)"
          echo "uploading $GITHUB_WORKSPACE ($(du -sb --exclude=.git . | cut -f1) bytes) as $SHA"
          start=$(date +%s%3N)
          railway up --no-gitignore \
            --service frontend-web --environment staging --project "$PROJECT" \
            --detach --message "$SHA" > /tmp/leg1.log 2>&1
          echo "exit=$? elapsed_ms=$(( $(date +%s%3N) - start ))"
          cat /tmp/leg1.log

      - name: 'Leg 1 readback - did the deployment appear?'
        continue-on-error: true
        run: |
          set -uo pipefail
          export RAILWAY_TOKEN="$(cat /tmp/tok_STAGING)"
          sleep 20
          railway deployment list --service frontend-web --environment staging \
            --project "$PROJECT" --limit 3 --json \
            | jq -r '.[] | "\(.createdAt) \(.id[0:8]) \(.status) \(.meta.cliMessage)"'

      # The backend leg is the same script the chain runs, with the same inputs.
      - name: 'Leg 2 - backend, the real scripts/ci/railway-deploy.sh'
        continue-on-error: true
        env:
          RAILWAY_TOKEN_FILE: /tmp/tok_STAGING
        run: |
          set -uo pipefail
          export RAILWAY_TOKEN="$(cat /tmp/tok_STAGING)"
          export SERVICE=backend RAILWAY_ENV=staging SHA="$(git rev-parse HEAD)" \
                 UPLOAD_PATH=backend ROOT_FLAG='--path-as-root' BUILD_DIR=backend ATTEMPTS=6
          bash scripts/ci/railway-deploy.sh
