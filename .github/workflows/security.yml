name: security

# Supply-chain + code security gate. Runs on PRs, pushes to main, and weekly.
# Complements ci.yml (correctness gates) with SAST, dependency/vuln, secret, and
# container scanning. High/critical findings fail the PR.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # upload SARIF to code scanning

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory during launch — flip to blocking once the backlog is clean
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  govulncheck:
    name: govulncheck (Go)
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory during launch — flip to blocking once the backlog is clean
    strategy:
      matrix:
        module: [backend, mobile-app/reactnative/backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory during launch — flip to blocking once the backlog is clean
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: trivy (filesystem — deps + IaC misconfig)
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory during launch — flip to blocking once the backlog is clean
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-fs.sarif
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  npm-audit:
    name: npm audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory during launch — flip to blocking once the backlog is clean
    strategy:
      fail-fast: false
      matrix:
        dir: [frontend-web, frontend-admin, mobile-app/reactnative]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit (fail on high/critical)
        working-directory: ${{ matrix.dir }}
        run: npm audit --audit-level=high || (echo "::warning::npm audit found high/critical vulns in ${{ matrix.dir }}" && exit 1)
