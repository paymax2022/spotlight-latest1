name: security

# Supply-chain + code security gate. Runs on PRs, pushes to main, and weekly.
# Complements ci.yml (correctness gates) with SAST, dependency/vuln, secret, and
# container scanning. High/critical findings fail the PR.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # upload SARIF to code scanning

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory during launch — flip to blocking once the backlog is clean
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  govulncheck:
    name: govulncheck (Go)
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory during launch — flip to blocking once the backlog is clean
    strategy:
      matrix:
        module: [backend, mobile-app/reactnative/backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory during launch — flip to blocking once the backlog is clean
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # v3 is a Node 20 -> Node 24 runtime migration with no behaviour change.
      # Not optional for long: GitHub removes Node 20 from hosted runners on
      # 2026-09-16, which would break @v2 outright.
      #
      # ⚠️ This does NOT fix the current failure. gitleaks-action requires a
      # licence for ORGANISATION accounts ("[paymax2022] is an organization"),
      # and no GITLEAKS_LICENSE secret exists — so the scan aborts before
      # looking at anything. Set that secret, or replace this action with the
      # gitleaks CLI, which is free. Until then this job is a placeholder that
      # reports a failure indistinguishable from a clean scan.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: trivy (filesystem — deps + IaC misconfig)
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory during launch — flip to blocking once the backlog is clean
    steps:
      - uses: actions/checkout@v7
      # 0.24.0 NEVER EXISTED — the tag 404s, so this step failed at "Set up job"
      # and trivy scanned nothing at all while the run still showed a job for it.
      # Upstream tags are v-prefixed; v0.36.0 is the current release.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-fs.sarif
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  npm-audit:
    name: npm audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    # Now BLOCKING. It was advisory ("flip once the backlog is clean") because it
    # could never pass: every residual advisory needs a framework major. It is now
    # a DIFFERENTIAL gate against an explicit baseline, so it passes today and
    # fails the moment a NEW advisory appears — which is the signal that was
    # missing while it sat permanently red.
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: frontend-web
            baseline: frontend-web
          - dir: frontend-admin
            baseline: frontend-admin
          - dir: mobile-app/reactnative
            baseline: mobile-app-reactnative
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install (production dependencies only)
        working-directory: ${{ matrix.dir }}
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      # Scoped to PRODUCTION dependencies: the gate reflects what ships, not the
      # build/test toolchain. Known-and-accepted advisories live in
      # .github/npm-audit-baseline/, each with a reason; the gate fails on anything
      # not listed, and ALSO on a baselined entry that has disappeared, so the
      # baseline cannot rot into a list of things that stopped being true.
      - name: Audit production dependencies against the baseline
        run: node .github/scripts/npm-audit-gate.mjs "${{ matrix.dir }}" ".github/npm-audit-baseline/${{ matrix.baseline }}.json"
