name: _reusable frontend-web

# Reusable: all frontend-web gates required by CLAUDE.md.
# Called by ci.yml. Can also be called from module workflows.
#
# Scripts live in frontend-web/package.json:
#   test:regression -> golden-path suite (tests/unit/golden-path) — see note below
#   test:money      -> vitest run tests/unit/estate tests/unit/wallet tests/unit/tiers
#   contract:check  -> node scripts/contract-check.mjs (impl vs contracts/openapi.yaml)
#   lint            -> next lint
#
# NOTE: CLAUDE.md references `npm run test:regression`, but the current
# frontend-web/package.json has no `test:regression` script — the golden-path
# specs live in tests/unit/golden-path/. We invoke them directly so the gate is
# real today; add a `test:regression` script that points at that folder to make
# this a one-word command. Tracked in docs/ops/CI_GATES.md.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Regression (golden-path suite — must always be green)
        run: |
          if npm run | grep -qE '^\s*test:regression'; then
            npm run test:regression
          else
            npx vitest run tests/unit/golden-path
          fi

      - name: Money invariants (ledger / idempotency / limits)
        run: npm run test:money

      - name: Contract check (implementation vs openapi.yaml)
        run: npm run contract:check

      - name: TypeScript (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint (ESLint via next lint)
        run: npm run lint
