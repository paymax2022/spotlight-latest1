name: _reusable frontend-web

# Reusable: all frontend-web gates required by CLAUDE.md.
# Called by ci.yml. Can also be called from module workflows.
#
# Scripts live in frontend-web/package.json:
#   test:regression -> vitest run tests/unit/golden-path
#   test:money      -> vitest run tests/unit/estate tests/unit/wallet tests/unit/tiers
#   contract:check  -> node scripts/contract-check.mjs (estate impl vs
#                      contracts/estate.openapi.yaml — estate only, NOT openapi.yaml)
#   lint            -> next lint
#
# The `test:regression` script now exists, so the regression step below takes its
# first branch. The fallback that invokes tests/unit/golden-path directly is kept
# deliberately: it is what made this gate real during the period the script was
# missing, and it keeps the gate honest on any branch or worktree predating it
# rather than failing with "Missing script".

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Regression (golden-path suite — must always be green)
        run: |
          if npm run | grep -qE '^\s*test:regression'; then
            npm run test:regression
          else
            npx vitest run tests/unit/golden-path
          fi

      - name: Money invariants (ledger / idempotency / limits)
        run: npm run test:money

      # tests/unit/config holds contracts about how the APP ITSELF is wired —
      # feature-flag defaults, and that the middleware sits where Next will load
      # it. Both guard failures that are SILENT: a flag defaulting open, or
      # middleware that never runs (which is exactly how CORS for /api/* and the
      # Supabase session refresh stayed broken unnoticed).
      #
      # It needs its own step because the steps above run a hand-listed set of
      # directories — golden-path, estate, wallet, tiers — so this directory was
      # never executed by CI at all, in spite of a green tick.
      - name: Config contracts (feature-flag defaults + middleware placement)
        run: npx vitest run tests/unit/config

      # Same blind spot as the step above, found from the other end: the contest
      # suite sat in tests/unit/contests and in ONE file of tests/unit/voting, and
      # nothing on main ran either — `git grep tests/unit/voting origin/main --
      # .github/workflows` returns no hits, and neither does `test:voting`. So the
      # guards written for the "price to be won" feature (route projects
      # contests.prize_pool as `prize`; /voting renders it only when it is set)
      # were only ever run on a laptop, and every break in that chain is silent: a
      # field renamed on one side of the fetch boundary renders nothing and throws
      # nothing, and tsc cannot see it because the page's own interface declares
      # the field optional.
      #
      # Scoped to six files when this step was written, because tests/unit/voting
      # looked permanently red: 2 failed / 495 passed, and --no-file-parallelism
      # still left 1 red. That was never product rot and never contention — the two
      # failures were ad004-free-vote-rules-sync and settings-contest-sync calling
      # `await import()` on the admin settings route INSIDE the first `it()`, which
      # put the route graph's cold load on a clock that stops at vitest's default
      # 5000 ms. Measured per module with a throwaway probe: src/lib/api/responses
      # 5032 ms (it imports @sentry/nextjs for a single captureException call),
      # src/server/admin/auth 1439 ms, the route itself 24 ms once warm, 0 ms for
      # every re-import. Both specs now import statically at the top, as every green
      # sibling route spec already did (contest-prizes-admin-api.test.ts and eleven
      # others), so the same cost lands in file load, where it is not timed. That is
      # the whole fix: no timeout was raised and no assertion was weakened.
      #
      # Re-measured on the fixed tree, twice: tests/unit/voting alone is 62 files /
      # 498 tests green at default parallelism in 60-66 s (it was 102 s with two
      # reds, so widening also made it faster — the Sentry load no longer repeats
      # per worker). The command below runs contests + voting = 67 files / 532 tests
      # in 107 s. Note the positional arg is a SUBSTRING filter, so this also
      # selects tests/unit/voting-bridge; those are voting wiring too and wanted.
      - name: Contest and voting guards (prize projection, settings sync, bridge)
        run: npx vitest run tests/unit/contests tests/unit/voting

      # Same blind spot a third time: tests/unit/registration is 38 files and no
      # lane above runs it, so the locality cascade (state -> LGA -> village, and
      # the /api/admin/contests write boundary that gives "local contest" its
      # meaning) was only ever executed on a laptop. Every break there is silent:
      # a column dropped from the store mapping still saves, and the phone just
      # stops being filterable.
      #
      # Two SUBSTRING filters, not a directory: the locality story spans six specs
      # (cascade rules, picker resets, the lgas and villages routes, the admin write
      # boundary, the /api/admin/villages CRUD), and the sibling registration specs are
      # not yet triaged. Measured on this tree: 6 files / 63 tests, green.
      - name: Locality guards (village cascade, villages route, admin write boundary)
        run: npx vitest run locality villages

      - name: Contract check (implementation vs openapi.yaml)
        run: npm run contract:check

      - name: TypeScript (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint (ESLint via next lint)
        run: npm run lint

      # The production build, LAST because it is the slowest step — everything
      # cheap has already failed by here.
      #
      # This lane ran tsc + lint + tests and called that "verified", but none of
      # them build. `tsc --noEmit` type-checks modules in isolation; `next build`
      # additionally compiles the route graph, and Turbopack statically parses
      # things type-checking never looks at. That gap shipped a broken deploy:
      # the Next 15 -> 16 upgrade turned the root middleware's re-exported
      # `config` into a hard build error, every check here stayed green, and the
      # first thing to actually run `next build` was Railway — in the deploy.
      #
      # It costs a few minutes per run. A deploy that fails after ~21 upstream
      # jobs costs more.
      - name: Production build (next build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: --max-old-space-size=3072
