name: _reusable frontend-web

# Reusable: all frontend-web gates required by CLAUDE.md.
# Called by ci.yml. Can also be called from module workflows.
#
# Scripts live in frontend-web/package.json:
#   test:regression -> golden-path suite (tests/unit/golden-path) — see note below
#   test:money      -> vitest run tests/unit/estate tests/unit/wallet tests/unit/tiers
#   contract:check  -> node scripts/contract-check.mjs (impl vs contracts/openapi.yaml)
#   lint            -> next lint
#
# NOTE: CLAUDE.md references `npm run test:regression`, but the current
# frontend-web/package.json has no `test:regression` script — the golden-path
# specs live in tests/unit/golden-path/. We invoke them directly so the gate is
# real today; add a `test:regression` script that points at that folder to make
# this a one-word command. Tracked in docs/ops/CI_GATES.md.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Regression (golden-path suite — must always be green)
        run: |
          if npm run | grep -qE '^\s*test:regression'; then
            npm run test:regression
          else
            npx vitest run tests/unit/golden-path
          fi

      - name: Money invariants (ledger / idempotency / limits)
        run: npm run test:money

      # tests/unit/config holds contracts about how the APP ITSELF is wired —
      # feature-flag defaults, and that the middleware sits where Next will load
      # it. Both guard failures that are SILENT: a flag defaulting open, or
      # middleware that never runs (which is exactly how CORS for /api/* and the
      # Supabase session refresh stayed broken unnoticed).
      #
      # It needs its own step because the steps above run a hand-listed set of
      # directories — golden-path, estate, wallet, tiers — so this directory was
      # never executed by CI at all, in spite of a green tick.
      - name: Config contracts (feature-flag defaults + middleware placement)
        run: npx vitest run tests/unit/config

      - name: Contract check (implementation vs openapi.yaml)
        run: npm run contract:check

      - name: TypeScript (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint (ESLint via next lint)
        run: npm run lint

      # The production build, LAST because it is the slowest step — everything
      # cheap has already failed by here.
      #
      # This lane ran tsc + lint + tests and called that "verified", but none of
      # them build. `tsc --noEmit` type-checks modules in isolation; `next build`
      # additionally compiles the route graph, and Turbopack statically parses
      # things type-checking never looks at. That gap shipped a broken deploy:
      # the Next 15 -> 16 upgrade turned the root middleware's re-exported
      # `config` into a hard build error, every check here stayed green, and the
      # first thing to actually run `next build` was Railway — in the deploy.
      #
      # It costs a few minutes per run. A deploy that fails after ~21 upstream
      # jobs costs more.
      - name: Production build (next build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: --max-old-space-size=3072
