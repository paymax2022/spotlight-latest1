# Called by ci.yml, which is the single pipeline for a push or PR. This lane no
# longer has its own push/pull_request trigger: fourteen workflows starting on one
# push meant fourteen queued pipelines competing for the same runners. ci.yml now
# decides whether this module changed (scripts/ci/changed-modules.py, driven by
# .github/module-filters.json) and calls this file as a reusable workflow, so its
# jobs report inside that one run. Paths live ONLY in module-filters.json now.
name: Stays CI

# Formal verification gate for the Paymax Hotel Booking / Stays module (Property
# Suite): supply-gateway + bedbank/direct adapters, ari-svc, prebook→book saga,
# hotelier extranet, settlement/reconciliation. The authoring sandbox has no Go
# toolchain (proxy blocked), so the Go packages were verified static-only
# (gofmt-form + structural checks). This workflow is the real gate: full
# go build/vet/test, mobile + admin + web typecheck, and an additive-only
# migration guard. Blocks merges on red.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - name: Build (whole backend — catches wiring/import breaks)
        run: go build ./...
      - name: Vet (stays module)
        run: go vet ./internal/stays/...
      - name: Test (stays — booking saga, auto-release, row-locked allotment, review gating)
        run: go test ./internal/stays/... -count=1 -v
      # Repo-wide `go test ./...` removed: ci.yml's ungated `backend` job now runs
      # the whole backend suite against a real Postgres, so this lane repeating it
      # WITHOUT a database was both slower and weaker — every live-DB suite skipped
      # here while reporting "ok". The scoped run above stays: it is fast, it is
      # verbose, and it names this module when it fails.

  migration-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject destructive DDL in stays migrations (additive-only)
        run: |
          set -e
          FILES=$(ls supabase/migrations/*stays*.sql 2>/dev/null || true)
          if [ -z "$FILES" ]; then echo "no stays migrations"; exit 0; fi
          if echo "$FILES" | xargs sed 's/--.*$//' | grep -iEn '\b(drop\s+(table|column|type)|alter\s+[a-z_."]+\s+drop|drop\s+not\s+null|rename\s+(column|to))\b' | grep -ivE 'drop\s+(policy|trigger)\s+if\s+exists'; then
            echo "::error::Destructive DDL found in stays migration (must be additive-only)"; exit 1;
          fi
          echo "Additive-only guard passed for: $FILES"
