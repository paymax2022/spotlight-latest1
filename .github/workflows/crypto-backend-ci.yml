# Called by ci.yml, the single pipeline for a push or PR — see the note in the
# other *-ci.yml lanes. This is a SEPARATE Go module (paymax/crypto-backend, its
# own Postgres), but it is routed the same way so one push stays one pipeline.
name: Crypto Backend CI

# CI for the standalone `paymax/crypto-backend` Go module
# (mobile-app/reactnative/backend) — the crypto + stocks + invest trading service.
# The Phase-1 audit flagged that this module had NO CI at all: its ~15+ tests never
# ran in a gate. This workflow builds, vets and runs the FULL test suite on every
# change, giving the green baseline the trading-module work depends on.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app/reactnative/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: mobile-app/reactnative/backend/go.sum
      - name: Build (whole module)
        run: go build ./...
      - name: Vet (static analysis)
        run: go vet ./...
      - name: Test (all, race detector)
        run: go test ./... -count=1 -race
