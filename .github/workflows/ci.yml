name: CI — CLAUDE.md gates
# Deployment-trigger commit: this workflow change intentionally starts a fresh Development CI run.

# Single PR gate that runs every quality gate required by CLAUDE.md.
# Per-module workflows (doctor-ci.yml, connect-ci.yml, …) remain as scoped,
# path-filtered fast lanes; this workflow is the repo-wide always-on gate that
# blocks merges to any branch.
#
# Gates enforced (see CLAUDE.md "Commands you should know"):
#   - frontend-web: golden-path regression (test:regression), money invariants
#     (test:money), contract:check, tsc --noEmit, ESLint
#   - frontend-admin: type-check (tsc --noEmit, strict)
#   - backend (Go 1.25): go build ./... && go vet ./...
#   - OpenAPI: YAML validity for every contract in contracts/
#   - migrations: additive-only guard (no DROP / RENAME / type-narrowing)
#
# Pushes run CI checks only. Railway deployment is an explicit manual release
# action, and is locked to the matching promotion branch/environment pair.

on:
  # CI runs only on the deployable promotion branches. Railway performs native
  # GitHub deployments from these branches after its per-environment branch mapping
  # is configured: develop -> Development, staging -> Staging, prod -> Production.
  # Docs-only changes are skipped to conserve private-repository Actions minutes.
  # NOTE: if ci.yml is ever made a REQUIRED status check, drop the pull_request
  # paths-ignore — GitHub reports a path-skipped required check as perpetually
  # pending, which would block docs-only PRs from merging.
  push:
    branches: [develop, staging, prod]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [develop, staging, prod]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Railway environment to deploy'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      confirm_deploy:
        description: 'Type DEPLOY to confirm the selected release'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-web:
    name: frontend-web (regression + money + contract + tsc + lint)
    uses: ./.github/workflows/_reusable-frontend-web.yml

  frontend-admin:
    name: frontend-admin (type-check)
    uses: ./.github/workflows/_reusable-node-typecheck.yml
    with:
      working-directory: frontend-admin
      typecheck-command: npm run type-check

  backend:
    name: backend (go build + vet)
    uses: ./.github/workflows/_reusable-go-verify.yml

  openapi:
    name: openapi (validate all contracts)
    uses: ./.github/workflows/_reusable-openapi-validate.yml

  migration-guard:
    name: migrations (additive-only guard)
    uses: ./.github/workflows/_reusable-migration-guard.yml

  # Two cheap repo-wide grep gates share one runner: both are sub-second, and a
  # second job would cost a full runner start for no benefit (see the
  # paths-ignore note above on conserving private-repo Actions minutes).
  # The job id stays `secret-hygiene` — it is internal, and the deploy jobs below
  # reference it in `needs:`.
  secret-hygiene:
    name: hygiene (client secrets + live-DB test gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets in client bundles
        run: bash scripts/check-client-secrets.sh
      # No Go test may read DATABASE_URL — it is the production pooler, and the
      # live-DB suites insert fixtures and move money.
      - name: Check live-DB tests gate on TEST_DATABASE_URL only
        run: bash scripts/ci/check-live-db-gate.sh

  # Catches workflow-level startup failures — a run that dies before any job
  # exists, so it reports no annotation and no check-run and looks like an
  # unexplained red X. deploy-web.yml failed this way 198 times in 11 days
  # (invalid `matrix` context in a workflow-level `concurrency.group`) before
  # anyone traced it. actionlint validates context availability statically.
  workflow-lint:
    name: workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      # Pinned version, built from source — no curl|bash installer.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # shellcheck/pyflakes integration is off: this gate is scoped to workflow
      # validity (context availability, expression syntax, action versions),
      # which is the class that produces a jobless red run. Linting the `run:`
      # shell of all 27 workflows is a separate, larger cleanup — enable by
      # dropping the two empty flags once that backlog is clear.
      - name: Lint workflows
        run: actionlint -no-color -oneline -shellcheck= -pyflakes=

  # Railway deployment is deliberately manual. The repository variable remains
  # an emergency kill switch, while the inputs and branch tests prevent an
  # environment from being deployed from the wrong promotion branch.
  deploy-development:
    name: deploy Development (${{ matrix.service }})
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_environment == 'development' &&
      inputs.confirm_deploy == 'DEPLOY' &&
      github.ref == 'refs/heads/develop' &&
      vars.RAILWAY_DEPLOY_ENABLED == 'true'
    needs: [frontend-web, frontend-admin, backend, openapi, migration-guard, secret-hygiene, workflow-lint]
    runs-on: ubuntu-latest
    environment: development
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            path: backend
          - service: frontend-web
            path: frontend-web
          - service: frontend-admin
            path: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1
      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEVELOPMENT }}
        run: |
          railway up ${{ matrix.path }} --path-as-root --no-gitignore \
            --service ${{ matrix.service }} \
            --environment development \
            --project e7dca861-3667-4d9a-8090-6d2f4d179ec2 \
            --detach \
            --message "${{ github.sha }}"
          for attempt in {1..40}; do
            status="$(railway deployment list --service ${{ matrix.service }} --environment development --project e7dca861-3667-4d9a-8090-6d2f4d179ec2 --limit 10 --json | jq -r --arg message "${{ github.sha }}" '[.[] | select(.meta.cliMessage == $message)] | first | .status // empty')"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|REMOVED) echo "Railway deployment ended with $status"; exit 1 ;;
              *) echo "Waiting for Railway deployment (attempt $attempt/40; status: ${status:-not-found})"; sleep 15 ;;
            esac
          done
          echo "Timed out waiting for Railway deployment"
          exit 1

  deploy-staging:
    name: deploy Staging (${{ matrix.service }})
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_environment == 'staging' &&
      inputs.confirm_deploy == 'DEPLOY' &&
      github.ref == 'refs/heads/staging' &&
      vars.RAILWAY_DEPLOY_ENABLED == 'true'
    needs: [frontend-web, frontend-admin, backend, openapi, migration-guard, secret-hygiene, workflow-lint]
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            path: backend
          - service: frontend-web
            path: frontend-web
          - service: frontend-admin
            path: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1
      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          railway up ${{ matrix.path }} --path-as-root --no-gitignore \
            --service ${{ matrix.service }} \
            --environment staging \
            --project e7dca861-3667-4d9a-8090-6d2f4d179ec2 \
            --detach \
            --message "${{ github.sha }}"
          for attempt in {1..40}; do
            status="$(railway deployment list --service ${{ matrix.service }} --environment staging --project e7dca861-3667-4d9a-8090-6d2f4d179ec2 --limit 10 --json | jq -r --arg message "${{ github.sha }}" '[.[] | select(.meta.cliMessage == $message)] | first | .status // empty')"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|REMOVED) echo "Railway deployment ended with $status"; exit 1 ;;
              *) echo "Waiting for Railway deployment (attempt $attempt/40; status: ${status:-not-found})"; sleep 15 ;;
            esac
          done
          echo "Timed out waiting for Railway deployment"
          exit 1

  deploy-production:
    name: deploy Production (${{ matrix.service }})
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_environment == 'production' &&
      inputs.confirm_deploy == 'DEPLOY' &&
      github.ref == 'refs/heads/prod' &&
      vars.RAILWAY_DEPLOY_ENABLED == 'true'
    needs: [frontend-web, frontend-admin, backend, openapi, migration-guard, secret-hygiene, workflow-lint]
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            path: backend
          - service: frontend-web
            path: frontend-web
          - service: frontend-admin
            path: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1
      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          railway up ${{ matrix.path }} --path-as-root --no-gitignore \
            --service ${{ matrix.service }} \
            --environment production \
            --project e7dca861-3667-4d9a-8090-6d2f4d179ec2 \
            --detach \
            --message "${{ github.sha }}"
          for attempt in {1..40}; do
            status="$(railway deployment list --service ${{ matrix.service }} --environment production --project e7dca861-3667-4d9a-8090-6d2f4d179ec2 --limit 10 --json | jq -r --arg message "${{ github.sha }}" '[.[] | select(.meta.cliMessage == $message)] | first | .status // empty')"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|REMOVED) echo "Railway deployment ended with $status"; exit 1 ;;
              *) echo "Waiting for Railway deployment (attempt $attempt/40; status: ${status:-not-found})"; sleep 15 ;;
            esac
          done
          echo "Timed out waiting for Railway deployment"
          exit 1
