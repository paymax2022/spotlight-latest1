name: CI — CLAUDE.md gates
# Deployment-trigger commit: this workflow change intentionally starts a fresh Development CI run.

# The single pipeline. One push or PR starts THIS workflow and nothing else:
# the per-module lanes (doctor-ci.yml, connect-ci.yml, …) no longer carry their
# own push/pull_request triggers. They are reusable workflows called from the
# jobs below, gated on which modules the change actually touched, so their jobs
# report inside this one run instead of queueing fifteen rival pipelines.
#
# Module paths live in ONE place — .github/module-filters.json — read by
# scripts/ci/changed-modules.py. Before, each lane repeated its path list under
# both `push:` and `pull_request:`, two hand-synced copies per lane with nothing
# checking them for drift.
#
# Gates enforced (see CLAUDE.md "Commands you should know"):
#   - frontend-web: golden-path regression (test:regression), money invariants
#     (test:money), contract:check, tsc --noEmit, ESLint
#   - frontend-admin: type-check (tsc --noEmit, strict)
#   - backend (Go 1.25): go build ./... && go vet ./...
#   - OpenAPI: YAML validity for every contract in contracts/
#   - migrations: additive-only guard (no DROP / RENAME / type-narrowing)
#
# Pushes run CI checks. Railway deployment is a manual, typed release action —
# EXCEPT the production backend on `prod`, which ships automatically on a green
# push when scripts/ci/prod-ship-scope.sh says the image changed or production is
# behind the branch it came from. See the two jobs at the foot of this file, and
# docs/devops/deployment-matrix.md for which writer owns which environment.

on:
  # CI runs only on the deployable promotion branches. Railway performs native
  # GitHub deployments from these branches after its per-environment branch mapping
  # is configured: develop -> Development, staging -> Staging, prod -> Production.
  # Docs-only PUSHES are skipped to conserve private-repository Actions minutes.
  #
  # `pull_request` deliberately has NO paths-ignore. This workflow's jobs are
  # required status checks on develop AND main (.github/required-checks.txt),
  # and GitHub reports a path-SKIPPED required check as perpetually "Expected —
  # waiting for status", not as passed. With a paths-ignore here, a docs-only
  # PR would never start this workflow and could never merge. Docs-only PRs are
  # cheap now: the router skips every module lane, leaving only the core gates.
  #
  # `main` IS included: AUD-TEST-003 — merges land on main (it's the default
  # branch) and AUD-BE-001 shipped a compile break because no required check
  # ran on main-bound PRs. The deploy lanes below still only fire via
  # workflow_dispatch, so a main push here is CI-only.
  push:
    branches: [develop, staging, prod, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [develop, staging, prod, main]
  # Manual dispatch still works for re-running this pipeline against any
  # branch, but `main` is covered by push/pull_request above (AUD-TEST-003).
  # Both deploy inputs are
  # optional: leave them blank to run CI only (against whichever branch you
  # pick in the dispatch UI/API `ref`), or fill both in to also deploy — the
  # deploy jobs below still gate strictly on confirm_deploy being the exact
  # string 'DEPLOY', so a CI-only dispatch can never trigger a release.
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Railway environment to deploy (leave unset to just run CI)'
        required: false
        type: choice
        options:
          - development
          - staging
          - production
      confirm_deploy:
        description: 'Type DEPLOY to confirm the selected release (leave blank to just run CI)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # `prod` queues instead of cancelling, because on this lineage the deploy legs
  # live INSIDE this workflow (main moved its own to release.yml and made that one
  # non-cancelling for the same reason). With a blanket `true`, the second push to
  # prod kills the run that is mid-`railway up`, which is how a production deploy
  # gets stranded half-uploaded by a job that is no longer there to report it:
  # "a release that the next push can cancel leaves a service half-updated"
  # (release.yml). Every other ref keeps cancelling — that is the point of the
  # flag on a busy branch. deploy-production-backend adds its own non-cancelling
  # group on top of this so two prod deploys can never overlap either.
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

jobs:
  # The three whole-app gates below run ONCE, here, unconditionally. Module lanes
  # must not repeat them: a whole-app check cannot say anything module-specific,
  # so N copies just report the same failure N times (eight lanes once died on
  # the same two lines of one telemedicine screen). Lanes keep only work that is
  # actually theirs — scoped tsconfigs, module Go tests, module migration guards.
  frontend-web:
    name: frontend-web (regression + money + contract + tsc + lint)
    uses: ./.github/workflows/_reusable-frontend-web.yml

  frontend-admin:
    # NAME IS LOAD-BEARING: .github/required-checks.txt pins this exact string
    # for branch protection on develop. Renaming it means the old context never
    # reports and every PR sits on "Expected — waiting for status" forever, so
    # the extra gate below is described in the command, not in the job name.
    name: frontend-admin (type-check)
    uses: ./.github/workflows/_reusable-node-typecheck.yml
    with:
      working-directory: frontend-admin
      # NODE_ENV=production makes the gate model PRODUCTION resolution, which is
      # the case that matters: an unset flag must resolve LIVE there. Chained
      # here rather than added to the reusable workflow because that one also
      # runs the mobile app, which has no such script.
      typecheck-command: npm run type-check && NODE_ENV=production npm run check:mock-flags

  # The mobile app's whole-app tsc, ONCE. Ten module lanes each ran this same
  # `tsc --noEmit -p tsconfig.json` over the entire RN app, so a single broken
  # file failed all ten identically — two missing style keys in one telemedicine
  # screen turned into eight red lanes on 415c0710, saying nothing extra after
  # the first. The lanes keep their SCOPED tsconfigs, which do say something
  # per-module. Unconditional, like the frontend-web and frontend-admin gates
  # above: a change anywhere in the app can break a whole-app typecheck.
  mobile-typecheck:
    name: mobile (whole-app tsc)
    uses: ./.github/workflows/_reusable-node-typecheck.yml
    with:
      working-directory: mobile-app/reactnative
      typecheck-command: npx tsc --noEmit -p tsconfig.json

  backend:
    name: backend (go build + vet)
    uses: ./.github/workflows/_reusable-go-verify.yml

  openapi:
    name: openapi (validate all contracts)
    uses: ./.github/workflows/_reusable-openapi-validate.yml

  migration-guard:
    name: migrations (additive-only guard)
    uses: ./.github/workflows/_reusable-migration-guard.yml

  # Cheap repo-wide gates share one runner: each is sub-second, and a separate
  # job per gate would cost a full runner start for no benefit (see the
  # paths-ignore note above on conserving private-repo Actions minutes).
  # The job id stays `secret-hygiene` — it is internal, and the deploy jobs below
  # reference it in `needs:`.
  secret-hygiene:
    name: hygiene (client secrets + live-DB test gate + migration versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets in client bundles
        run: bash scripts/check-client-secrets.sh
      # No Go test may read DATABASE_URL — it is the production pooler, and the
      # live-DB suites insert fixtures and move money.
      - name: Check live-DB tests gate on TEST_DATABASE_URL only
        run: bash scripts/ci/check-live-db-gate.sh
      # schema_migrations is keyed on the version alone, so two migrations
      # sharing a timestamp abort `supabase start` / `db reset` partway through
      # the chain. The collision is invisible to the author — it appears on the
      # base branch only AFTER the merge — so it must be caught at PR time.
      - name: Check the email sender is the one verified identity
        # Spotlight's Resend account verifies exactly one domain. A sender on any
        # other domain is rejected, and every send path swallows that failure —
        # so a wrong sender is silent. It had drifted to three domains.
        run: python3 scripts/ci/check-email-sender.py

      - name: Check admin services do not fake writes
        # A mutation whose fixture branch returns success tells the operator the
        # action was applied when nothing happened — found four times by accident
        # (creator payouts, escrow fraud, KYC bypass, crypto withdrawals). Ratchets
        # against a baseline: existing debt is recorded, additions fail.
        run: python3 scripts/ci/check-simulated-writes.py

      - name: Check migration versions are unique
        run: bash scripts/ci/check-migration-versions.sh
      # Pins the module router's glob semantics, its fail-open behaviour, and its
      # rejection of brace patterns. Sub-second, so it shares this runner.
      - name: Test the module router
        run: python3 scripts/ci/test-changed-modules.py
      # The two gates below are the production deploy machinery's own tests, and
      # they belong on the same bar as the deploy they control: `ship-scope` decides
      # whether prod gets a new image, and the retry ladder is what stops Railway's
      # transient upload refusal from reading as a broken release chain. Both are
      # ~3 s (measured), so they share this runner rather than costing a runner each.
      - name: Test the production ship-scope gate
        run: bash scripts/ci/test-prod-ship-scope.sh
      - name: Test the Railway upload retry ladder
        run: bash scripts/ci/test-railway-deploy-retry.sh

  # Which module lanes does this change need? One shared filter file
  # (.github/module-filters.json) drives the gating below, so a module's paths
  # are written once instead of once per trigger per workflow.
  # Fail-open: if the diff cannot be established, every lane is selected.
  changes:
    name: which modules changed
    runs-on: ubuntu-latest
    outputs:
      association: ${{ steps.route.outputs.association }}
      connect: ${{ steps.route.outputs.connect }}
      commerce: ${{ steps.route.outputs.commerce }}
      live_db: ${{ steps.dbscope.outputs.hit }}
      crowdfunding: ${{ steps.route.outputs.crowdfunding }}
      crypto_backend: ${{ steps.route.outputs.crypto_backend }}
      doctor: ${{ steps.route.outputs.doctor }}
      fx: ${{ steps.route.outputs.fx }}
      health: ${{ steps.route.outputs.health }}
      insurance: ${{ steps.route.outputs.insurance }}
      maps: ${{ steps.route.outputs.maps }}
      realtor: ${{ steps.route.outputs.realtor }}
      referral: ${{ steps.route.outputs.referral }}
      stays: ${{ steps.route.outputs.stays }}
      top5: ${{ steps.route.outputs.top5 }}
      visitor_election: ${{ steps.route.outputs.visitor_election }}
    steps:
      # Full history: the PR diff is taken against the merge base, and a push
      # diff needs the previous tip, which a shallow clone would not contain.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route
        id: route
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.base_ref }}
        run: |
          python3 scripts/ci/changed-modules.py \
            --event "$EVENT" \
            --before "$BEFORE" \
            --sha "$GITHUB_SHA" \
            --base "$BASE"

      # Gates the live-DB job below. Deliberately NOT a module filter: those are
      # keyed to a <module>-ci.yml lane (scripts/ci/test-changed-modules.py
      # enforces the pairing) and this is a job, not a lane. Mirrors
      # changed-modules.py's range logic INCLUDING its fail-open behaviour — if
      # the diff cannot be established we run the job rather than silently skip
      # the only thing that executes the live-DB suites.
      - name: Does this push touch Go, migrations or CI itself?
        id: dbscope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.base_ref }}
        run: |
          set -u
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ] && [ -n "${BASE:-}" ] \
             && git rev-parse --verify "origin/$BASE" >/dev/null 2>&1; then
            FILES=$(git diff --name-only "origin/$BASE...HEAD")
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$ZERO" ] \
             && git rev-parse --verify "$BEFORE" >/dev/null 2>&1; then
            FILES=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            echo "::warning::could not determine changed files; running the live-DB job"
            echo "hit=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Makefile (migrate-up), scripts/ci (the compat prelude) and the
          # workflows themselves are included so a change to the machinery
          # exercises it, rather than shipping an unrun job.
          if printf '%s\n' "$FILES" | grep -qE '^(backend/|supabase/migrations/|Makefile|scripts/ci/|[.]github/workflows/)'; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

  # ── live-DB suites ──────────────────────────────────────────────────────────
  # The gap this closes: every live-DB suite gates on TEST_DATABASE_URL and none
  # falls back to DATABASE_URL (enforced by scripts/ci/check-live-db-gate.sh), but
  # nothing in this pipeline SET it — so ~124 test files skipped on every push and
  # gated nothing. integration-verify.yml does set it, but triggers on push to
  # main + pull_request, and work here lands by pushing straight to develop, so in
  # practice those suites first ran at promotion, with days of accumulated
  # regressions surfacing at once against whoever happened to promote.
  #
  # A lighter cousin of integration-verify: same Postgres recipe, but no -race,
  # no docker build and no frontend bootstrap, so it can afford to run per push.
  # integration-verify stays the heavier gate on main.
  live-db:
    name: live-DB suites (Postgres + migrations)
    needs: changes
    if: needs.changes.outputs.live_db == 'true'
    runs-on: ubuntu-latest
    # NO `services:` block: the runner pulls service images BEFORE the first
    # step executes, so a Docker Hub 429/timeout (rate-limited anonymous pulls —
    # ~10 concurrent PRs share the hosted-runner egress pool) failed this job at
    # "Initialize containers" with no chance to retry. postgis/postgis is
    # community-published — Docker Hub only, no official ECR Public/GHCR mirror —
    # so the container is started by a step whose pull is wrapped in bounded
    # retry+backoff (scripts/ci/start-postgres-service.sh). Same image, env,
    # port and pg_isready health gate as the declarative service it replaced.
    env:
      DATABASE_URL: postgres://paymax:paymax@localhost:5432/paymax?sslmode=disable
      # The whole point of this job. Both names address the same ephemeral
      # container — never a developer's DATABASE_URL, which is the production
      # pooler.
      TEST_DATABASE_URL: postgres://paymax:paymax@localhost:5432/paymax?sslmode=disable
      RAILS_MODE: fake # FAKEs only — no external provider secrets in CI
    steps:
      - uses: actions/checkout@v4
      # PostGIS image: the first migration (20260101000000_enable_extensions)
      # runs CREATE EXTENSION postgis, which plain postgres cannot satisfy.
      # PG17 matches production.
      - name: Start PostGIS service container (pull retried — Docker Hub rate limits)
        run: bash scripts/ci/start-postgres-service.sh postgis/postgis:17-3.4 ci-postgres
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # A full-schema drop needs a lock per object and the ~400-migration schema
      # blows the default 64. ALTER SYSTEM needs a restart to take effect.
      - name: Raise Postgres lock table
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET max_locks_per_transaction = 512;"
          docker restart ci-postgres
          timeout 90 bash -c 'until pg_isready -h localhost -p 5432 -U paymax >/dev/null 2>&1; do sleep 1; done'
      # Migrations assume the surface Supabase provides at runtime (auth schema,
      # auth.uid()/role(), storage, anon/authenticated/service_role).
      - name: Supabase-compat prelude (plain-Postgres shim)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f scripts/ci/supabase-compat-prelude.sql
      - name: Migrations apply cleanly (real Postgres)
        run: make migrate-up
      # -p 1: serialize package-level test execution — several live-DB suites
      # read a shared standing account's absolute balance before/after their
      # own action, which races against a DIFFERENT package's test binary
      # touching the same account concurrently against this one shared
      # Postgres container. See _reusable-go-verify.yml's identical comment.
      - name: go test ./... (live-DB suites now execute)
        working-directory: backend
        run: go test ./... -p 1 -count=1
      # Without this the job could go green while every live-DB test skipped —
      # the exact failure being fixed, just relocated. Assert at least one really
      # ran and that nothing skipped for want of the variable.
      - name: Assert the live-DB suites actually ran
        working-directory: backend
        run: |
          set -o pipefail
          go test ./tests/marketplace/... -run TestLiveDB -count=1 -v 2>&1 | tee /tmp/livedb.log
          if grep -q "TEST_DATABASE_URL not set" /tmp/livedb.log || grep -q "no TEST_DATABASE_URL" /tmp/livedb.log; then
            echo "::error::live-DB tests skipped despite TEST_DATABASE_URL being set"; exit 1
          fi
          RAN=$(grep -c "^=== RUN   TestLiveDB" /tmp/livedb.log || true)
          echo "live-DB tests executed: $RAN"
          if [ "$RAN" -lt 1 ]; then
            echo "::error::no live-DB test executed — the gate is not doing anything"; exit 1
          fi

  # The module lanes, called as reusable workflows so their jobs report inside
  # THIS run. One push = one pipeline, instead of fourteen queued in parallel.
  # NOTE: GitHub allows at most 20 unique reusable workflows per caller. This
  # file uses 19 (5 shared + 14 module) — ONE slot left. The router test asserts
  # the count so a 21st addition fails loudly here instead of breaking the run.
  association:
    name: Association CI
    needs: changes
    if: needs.changes.outputs.association == 'true'
    uses: ./.github/workflows/association-ci.yml

  connect:
    name: Connect CI
    needs: changes
    if: needs.changes.outputs.connect == 'true'
    uses: ./.github/workflows/connect-ci.yml

  commerce:
    name: Commerce CI
    needs: changes
    if: needs.changes.outputs.commerce == 'true'
    uses: ./.github/workflows/commerce-ci.yml

  crowdfunding:
    name: Crowdfunding CI
    needs: changes
    if: needs.changes.outputs.crowdfunding == 'true'
    uses: ./.github/workflows/crowdfunding-ci.yml

  crypto-backend:
    name: Crypto Backend CI
    needs: changes
    if: needs.changes.outputs.crypto_backend == 'true'
    uses: ./.github/workflows/crypto-backend-ci.yml

  doctor:
    name: Doctor CI
    needs: changes
    if: needs.changes.outputs.doctor == 'true'
    uses: ./.github/workflows/doctor-ci.yml

  fx:
    name: FX CI
    needs: changes
    if: needs.changes.outputs.fx == 'true'
    uses: ./.github/workflows/fx-ci.yml

  health:
    name: Health CI
    needs: changes
    if: needs.changes.outputs.health == 'true'
    uses: ./.github/workflows/health-ci.yml

  insurance:
    name: Insurance CI
    needs: changes
    if: needs.changes.outputs.insurance == 'true'
    uses: ./.github/workflows/insurance-ci.yml

  maps:
    name: Maps CI
    needs: changes
    if: needs.changes.outputs.maps == 'true'
    uses: ./.github/workflows/maps-ci.yml

  realtor:
    name: Realtor CI
    needs: changes
    if: needs.changes.outputs.realtor == 'true'
    uses: ./.github/workflows/realtor-ci.yml

  referral:
    name: Referral CI
    needs: changes
    if: needs.changes.outputs.referral == 'true'
    uses: ./.github/workflows/referral-ci.yml

  stays:
    name: Stays CI
    needs: changes
    if: needs.changes.outputs.stays == 'true'
    uses: ./.github/workflows/stays-ci.yml

  top5:
    name: Top5 CI
    needs: changes
    if: needs.changes.outputs.top5 == 'true'
    uses: ./.github/workflows/top5-ci.yml

  visitor-election:
    name: Visitor & Election CI
    needs: changes
    if: needs.changes.outputs.visitor_election == 'true'
    uses: ./.github/workflows/visitor-election-ci.yml

  # Catches workflow-level startup failures — a run that dies before any job
  # exists, so it reports no annotation and no check-run and looks like an
  # unexplained red X. deploy-web.yml failed this way 198 times in 11 days
  # (invalid `matrix` context in a workflow-level `concurrency.group`) before
  # anyone traced it. actionlint validates context availability statically.
  workflow-lint:
    name: workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'backend/go.mod'
      # Pinned version, built from source — no curl|bash installer.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # shellcheck/pyflakes integration is off: this gate is scoped to workflow
      # validity (context availability, expression syntax, action versions),
      # which is the class that produces a jobless red run. Linting the `run:`
      # shell of all 27 workflows is a separate, larger cleanup — enable by
      # dropping the two empty flags once that backlog is clear.
      - name: Lint workflows
        run: actionlint -no-color -oneline -shellcheck= -pyflakes=

  # These three legs stay deliberately manual: a typed DEPLOY, the matching
  # promotion branch, and the repository variable as an emergency kill switch.
  # The one automatic writer is the production backend at the foot of this file.
  deploy-development:
    name: deploy Development (${{ matrix.service }})
    # The module lanes are CONDITIONAL (`if: needs.changes.outputs.X == 'true'`),
    # and GitHub skips a job whose dependency was skipped — so a plain `needs:`
    # on them would skip every deploy, since most lanes sit out any given change.
    # `!cancelled()` opts out of that implicit gating; the two `contains` tests
    # then re-impose the part we actually want — no dependency may be red.
    # Without them, `!cancelled()` would deploy straight through a failed gate.
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_environment == 'development' &&
      inputs.confirm_deploy == 'DEPLOY' &&
      github.ref == 'refs/heads/develop' &&
      vars.RAILWAY_DEPLOY_ENABLED == 'true'
    needs:
      - frontend-web
      - frontend-admin
      - backend
      - openapi
      - migration-guard
      - secret-hygiene
      - workflow-lint
      - changes
      - association
      - connect
      - crowdfunding
      - crypto-backend
      - doctor
      - fx
      - health
      - insurance
      - maps
      - realtor
      - referral
      - stays
      - top5
      - visitor-election
    runs-on: ubuntu-latest
    environment: development
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            path: backend
          - service: frontend-web
            path: frontend-web
          - service: frontend-admin
            path: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1
      # Railway builds backend/Dockerfile itself from the directory `railway up`
      # uploads, so we cannot pass it --build-arg. Writing the SHA into the build
      # context is the way in: the Dockerfile reads BUILD_COMMIT and bakes it into
      # the binary via -ldflags, and GET /api/v1/public/build then reports it.
      # Without this a deployed server cannot say what it is running — /public/health
      # returns the same bytes on every build, so it can never distinguish
      # "deployed" from "did not deploy".
      - name: Stamp the build commit (backend image only)
        if: matrix.service == 'backend'
        run: printf '%s' "${{ github.sha }}" > backend/BUILD_COMMIT
      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEVELOPMENT }}
        run: |
          railway up ${{ matrix.path }} --path-as-root --no-gitignore \
            --service ${{ matrix.service }} \
            --environment development \
            --project e7dca861-3667-4d9a-8090-6d2f4d179ec2 \
            --detach \
            --message "${{ github.sha }}"
          for attempt in {1..40}; do
            status="$(railway deployment list --service ${{ matrix.service }} --environment development --project e7dca861-3667-4d9a-8090-6d2f4d179ec2 --limit 10 --json | jq -r --arg message "${{ github.sha }}" '[.[] | select(.meta.cliMessage == $message)] | first | .status // empty')"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|REMOVED) echo "Railway deployment ended with $status"; exit 1 ;;
              *) echo "Waiting for Railway deployment (attempt $attempt/40; status: ${status:-not-found})"; sleep 15 ;;
            esac
          done
          echo "Timed out waiting for Railway deployment"
          exit 1

  deploy-staging:
    name: deploy Staging (${{ matrix.service }})
    # See deploy-development for why `!cancelled()` + the `contains` tests.
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_environment == 'staging' &&
      inputs.confirm_deploy == 'DEPLOY' &&
      github.ref == 'refs/heads/staging' &&
      vars.RAILWAY_DEPLOY_ENABLED == 'true'
    needs:
      - frontend-web
      - frontend-admin
      - backend
      - openapi
      - migration-guard
      - secret-hygiene
      - workflow-lint
      - changes
      - association
      - connect
      - crowdfunding
      - crypto-backend
      - doctor
      - fx
      - health
      - insurance
      - maps
      - realtor
      - referral
      - stays
      - top5
      - visitor-election
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            path: backend
            root_flag: --path-as-root
          # The staging frontend services carry a Railway `rootDirectory` of
          # their own folder, so they must be uploaded from the repo root —
          # but with NO positional path argument at all: `railway up .` dies
          # client-side with "prefix not found" during indexing (CLI bug with
          # an explicit `.` when rootDirectory is set), and
          # `frontend-web --path-as-root` makes Railway look for `frontend-*/`
          # inside an archive that already IS that folder.
          - service: frontend-web
            path: ''
            root_flag: ''
          - service: frontend-admin
            path: ''
            root_flag: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1
      # Railway builds backend/Dockerfile itself from the directory `railway up`
      # uploads, so we cannot pass it --build-arg. Writing the SHA into the build
      # context is the way in: the Dockerfile reads BUILD_COMMIT and bakes it into
      # the binary via -ldflags, and GET /api/v1/public/build then reports it.
      # Without this a deployed server cannot say what it is running — /public/health
      # returns the same bytes on every build, so it can never distinguish
      # "deployed" from "did not deploy".
      - name: Stamp the build commit (backend image only)
        if: matrix.service == 'backend'
        run: printf '%s' "${{ github.sha }}" > backend/BUILD_COMMIT
      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          railway up ${{ matrix.path }} ${{ matrix.root_flag }} --no-gitignore \
            --service ${{ matrix.service }} \
            --environment staging \
            --project e7dca861-3667-4d9a-8090-6d2f4d179ec2 \
            --detach \
            --message "${{ github.sha }}"
          for attempt in {1..40}; do
            row="$(railway deployment list --service ${{ matrix.service }} --environment staging --project e7dca861-3667-4d9a-8090-6d2f4d179ec2 --limit 10 --json | jq -c --arg message "${{ github.sha }}" '[.[] | select(.meta.cliMessage == $message)] | first // {}')"
            status="$(echo "$row" | jq -r '.status // empty')"
            id="$(echo "$row" | jq -r '.id // empty')"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|REMOVED)
                echo "Railway deployment ended with $status"
                # This deployment never became the one serving traffic, so
                # `railway logs --deployment` (which targets the CURRENT/active
                # deployment) reports the OLD, still-running deployment's logs
                # instead — silently pointing at the wrong process. Target this
                # exact deployment id so a crash-after-build actually surfaces
                # its own reason instead of unrelated old traffic.
                #
                # Filtered, never dumped: application logs can contain anything,
                # and a raw dump into a job log is how a secret escapes (see the
                # --kv incident documented in staging-inspect.yml's header).
                echo "--- crash signatures for deployment $id ---"
                # `railway logs --help`: DEPLOYMENT_ID is a bare POSITIONAL
                # argument, not a value for --deployment (which is a boolean
                # flag selecting deploy-logs over build-logs) — `--deployment
                # "$id"` silently failed with "No service linked" because $id
                # was consumed as if it were --deployment's value, leaving
                # --service/--environment/--project all unset. `--latest`
                # ("show logs from the latest deployment, even if it failed or
                # is still building") is simpler and more robust than passing
                # the id at all, so use that instead of the positional form.
                # stderr is KEPT (redacted below, never discarded): a CLI usage
                # error looks identical to "zero log lines exist" otherwise,
                # and those are very different problems to chase.
                railway logs --deployment --latest --service "${{ matrix.service }}" \
                  --environment staging --project e7dca861-3667-4d9a-8090-6d2f4d179ec2 \
                  --lines 300 > dep.log 2>&1 || true
                echo "  fetched $(wc -l < dep.log) log lines for this deployment"
                echo "  --- raw output (redacted) ---"
                sed -E 's#eyJ[A-Za-z0-9._-]{20,}#<jwt-redacted>#g; s#(sk_|pk_)[A-Za-z0-9_-]{10,}#<key-redacted>#g' dep.log | head -20
                if grep -qaiE "panic:|fatal error|nil pointer|runtime error|goroutine [0-9]+ \[|listen tcp|bind: address already in use|Validate\(\)|refusing to start|exit status|SIGSEGV|SIGABRT" dep.log; then
                  grep -aiE "panic:|fatal error|nil pointer|runtime error|goroutine [0-9]+ \[|listen tcp|bind: address already in use|Validate\(\)|refusing to start|exit status|SIGSEGV|SIGABRT" dep.log | tail -60
                else
                  # No known crash signature — most likely a startup HANG that
                  # never reached "listening" before Railway's healthcheck timed
                  # it out, which prints no panic at all. Show whatever DID print
                  # (redacted, same doctrine as staging-inspect.yml) so a stuck
                  # init step is visible instead of a bare "no match".
                  echo "  no crash signature matched — last lines emitted before the deployment ended:"
                  tail -40 dep.log | sed -E 's#eyJ[A-Za-z0-9._-]{20,}#<jwt-redacted>#g; s#(sk_|pk_)[A-Za-z0-9_-]{10,}#<key-redacted>#g'
                fi
                exit 1
                ;;
              *) echo "Waiting for Railway deployment (attempt $attempt/40; status: ${status:-not-found})"; sleep 15 ;;
            esac
          done
          echo "Timed out waiting for Railway deployment"
          exit 1

  deploy-production:
    name: deploy Production (${{ matrix.service }})
    # See deploy-development for why `!cancelled()` + the `contains` tests.
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_environment == 'production' &&
      inputs.confirm_deploy == 'DEPLOY' &&
      github.ref == 'refs/heads/prod' &&
      vars.RAILWAY_DEPLOY_ENABLED == 'true'
    needs:
      - frontend-web
      - frontend-admin
      - backend
      - openapi
      - migration-guard
      - secret-hygiene
      - workflow-lint
      - changes
      - association
      - connect
      - crowdfunding
      - crypto-backend
      - doctor
      - fx
      - health
      - insurance
      - maps
      - realtor
      - referral
      - stays
      - top5
      - visitor-election
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            path: backend
          - service: frontend-web
            path: frontend-web
          - service: frontend-admin
            path: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1
      # Railway builds backend/Dockerfile itself from the directory `railway up`
      # uploads, so we cannot pass it --build-arg. Writing the SHA into the build
      # context is the way in: the Dockerfile reads BUILD_COMMIT and bakes it into
      # the binary via -ldflags, and GET /api/v1/public/build then reports it.
      # Without this a deployed server cannot say what it is running — /public/health
      # returns the same bytes on every build, so it can never distinguish
      # "deployed" from "did not deploy".
      - name: Stamp the build commit (backend image only)
        if: matrix.service == 'backend'
        run: printf '%s' "${{ github.sha }}" > backend/BUILD_COMMIT
      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          railway up ${{ matrix.path }} --path-as-root --no-gitignore \
            --service ${{ matrix.service }} \
            --environment production \
            --project e7dca861-3667-4d9a-8090-6d2f4d179ec2 \
            --detach \
            --message "${{ github.sha }}"
          for attempt in {1..40}; do
            status="$(railway deployment list --service ${{ matrix.service }} --environment production --project e7dca861-3667-4d9a-8090-6d2f4d179ec2 --limit 10 --json | jq -r --arg message "${{ github.sha }}" '[.[] | select(.meta.cliMessage == $message)] | first | .status // empty')"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|REMOVED) echo "Railway deployment ended with $status"; exit 1 ;;
              *) echo "Waiting for Railway deployment (attempt $attempt/40; status: ${status:-not-found})"; sleep 15 ;;
            esac
          done
          echo "Timed out waiting for Railway deployment"
          exit 1

  # ── automatic production backend ─────────────────────────────────────────────
  # Everything above this line is CI unless a human dispatches it with a typed
  # DEPLOY. The two jobs below are the exception: a green push to `prod` that
  # changes the backend — or finds the deployed image older than the branch it came
  # from — puts that backend in front of production with nobody at the keyboard. It
  # exists because the alternative was a hand-run `railway up backend`, which is not a
  # release process: it is an unlogged build from whatever the operator's working
  # tree happened to contain, it is invisible to the next person, and in practice it
  # gets forgotten. Measured 2026-11-21: production served d3401f574 while `prod`
  # carried three merges it had never been given, `bb59c7129` among them (the
  # referral-code uniqueness fix, `backend/**` and all).
  #
  # WHAT MOVES FROM HUMAN TO MACHINE: not the decision, the choreography. A person
  # still merges the PR, and the PR page is where integration-verify (the -race
  # suite, which does not run on a prod push — see its own triggers) is visible.
  # This file automates "and then the code actually gets to production".
  #
  # THE DECISION HAS TWO INPUTS, because one of them is not enough:
  #   1. did this push change `backend/**`?  — the image's own dependency set.
  #   2. does the commit production serves build a DIFFERENT `backend/`? The served
  #      sha is read live from /api/v1/public/build and compared as a tree diff.
  # (2) is what turns this from an event handler into a reconciliation. Diff-only
  # would have failed the change that introduces it: the PR installing these two jobs
  # touches no `backend/**` file, so it would merge, announce "nothing to ship", and
  # leave production on the build from before the referral fix. With (2), the merge
  # that installs the gate also ships what the gate exists to stop losing.
  #
  # WHY (2) COMPARES THE IMAGE AND NOT THE SHA
  # "Ship when the served sha differs from this sha" fires on every push that gets
  # this far, because a new commit is by definition a different sha. It would roll a
  # fresh container in front of live traffic for a workflow-only or console-only
  # change — quietly voiding the reason `backend/**` is the predicate in the first
  # place. The question worth asking is whether the artifact production RUNS is older
  # than the artifact production would BUILD, which is a diff of `backend/` between
  # two commits. `git diff` compares trees, not history, so a production uploaded from
  # a divergent lineage still gets a correct answer (case 23 of
  # scripts/ci/test-prod-ship-scope.sh). When the two trees match, the served sha
  # being different is not staleness and nothing ships (cases 13/21).
  #
  # WHERE THE RECONCILIATION DOES NOT REACH: this workflow ignores docs-only pushes
  # (`paths-ignore` above), so a gap is closed by the next push that touches
  # something CI watches — not by the clock. A `schedule:` cannot close it on this
  # branch alone: GitHub only runs scheduled workflows from the repository's DEFAULT
  # branch (measured 2026-11-21: `main`), so the cron would have to live there and
  # dispatch this one, or `paths-ignore` would have to widen. Both are bigger
  # decisions than fixing the release path, so neither is made here.
  #
  # KNOWN GAPS, on purpose, so nobody has to rediscover them:
  #   * `security` cannot be added to `needs:` — it is a DIFFERENT WORKFLOW, and
  #     `needs:` only reaches jobs in this file (same reason as `integration-verify`
  #     below). Gating an unattended deploy on the audits means either running them
  #     as jobs here or having ship-scope query the check rollup for $GITHUB_SHA and
  #     refuse on a red. Until one of those exists, this leg's bar is the 25 lanes of
  #     this workflow and nothing else.
  #   * security.yml's lanes as of the next@16.4.6 + go@1.27.4 port: `npm audit
  #     (frontend-web)`, `(frontend-admin)`, `gitleaks` and both `govulncheck`
  #     matrices are green on prod content. `npm audit (mobile-app/reactnative)` and
  #     `trivy` are not. The mobile red is NOT a baseline problem: prod's mobile tree
  #     predates main's expo/RN arc, so its transitive node-forge, undici,
  #     follow-redirects and decode-uri-component sit behind, and clearing `zod`
  #     means the 3 → 4 major main already took. Do not baseline those 30 entries for
  #     a green badge — main proves they clear by upgrading, and npm's own suggested
  #     fixes here are wrong twice over (it offers `axios@0.7.0`, a 2015 downgrade,
  #     and `expo-router@58`, a SDK major). `trivy` is marked
  #     `continue-on-error: # advisory` in security.yml, so its row is advisory only.
  #   * integration-verify is a different workflow, so `needs:` cannot reach it. It
  #     gates the merge, not this push.
  #   * the production DATABASE is not migrated by anything here. That is why
  #     scripts/ci/prod-ship-scope.sh refuses a push carrying supabase/migrations/**
  #     instead of shipping code that expects an unapplied schema.
  #
  # KILL SWITCH: gh variable set PROD_BACKEND_AUTO_DEPLOY_ENABLED --body false
  # (or the shared vars.RAILWAY_DEPLOY_ENABLED, which also stops main's chain).
  # A FAILED deploy leaves the previous Railway deployment serving traffic, so a bad
  # build cannot take production down; it only leaves this job red. ROLLBACK: re-run
  # this job on an older prod push, or dispatch the manual deploy-production leg.
  ship-scope:
    name: production ship scope
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/prod' &&
      vars.PROD_BACKEND_AUTO_DEPLOY_ENABLED == 'true' &&
      vars.RAILWAY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      ship: ${{ steps.scope.outputs.ship }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The decision is a diff against the tip this push replaced, and a
          # shallow clone would not contain it — the same reason the `changes` job
          # above says fetch-depth: 0. Without it every push would take the
          # fail-open branch and the scope gate would silently do nothing.
          fetch-depth: 0
      - name: Read what production serves today
        id: served
        # Never fails this job, and that is the point: the read only makes the
        # decision smarter, and it makes it smarter in BOTH directions. With it, a
        # docs-only push still ships a backend production was never handed (the merge
        # that installs this gate, and every forgotten manual upload since), and a
        # push that leaves `backend/` byte-identical does not restart live traffic.
        # Without it the gate falls back to classifying the push — cases
        # 14/15/19/20 of scripts/ci/test-prod-ship-scope.sh.
        # A 20-second blip on a public endpoint must not turn into a red release;
        # that is how a gate earns being switched off.
        run: |
          . scripts/ci/railway-urls.sh
          base="$(railway_url production backend)"
          served=''
          if [ -n "$base" ]; then
            served="$(curl -s -m 20 "$base/api/v1/public/build" | jq -r '.commit // empty' 2>/dev/null || true)"
          fi
          echo "served=${served:-unknown}" >> "$GITHUB_OUTPUT"
          echo "production backend reports ${served:-<unreadable>} from ${base:-no url in railway-urls.sh}"
      - name: Decide whether this push ships the backend
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          SERVED: ${{ steps.served.outputs.served }}
        run: bash scripts/ci/prod-ship-scope.sh --before "$BEFORE" --sha "$GITHUB_SHA" --serving "$SERVED"

  deploy-production-backend:
    name: deploy Production backend (automatic)
    # The bar is: nothing in this workflow may be red, and the scope gate must say
    # ship. `!cancelled()` is here because most lanes are conditional and GitHub
    # skips a job whose dependency was skipped (see deploy-development). The two
    # `contains` tests re-impose the part actually wanted — no red dependency — and
    # they also cover a FAILED ship-scope, which is the migration refusal: a
    # refused release must not deploy.
    #
    # `commerce` is in this list and in no other deploy leg, on purpose: it is a
    # backend lane, and an unattended writer should not ship over a red one.
    needs:
      - frontend-web
      - frontend-admin
      - mobile-typecheck
      - backend
      - openapi
      - migration-guard
      - secret-hygiene
      - live-db
      - workflow-lint
      - changes
      - ship-scope
      - association
      - commerce
      - connect
      - crowdfunding
      - crypto-backend
      - doctor
      - fx
      - health
      - insurance
      - maps
      - realtor
      - referral
      - stays
      - top5
      - visitor-election
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.ship-scope.outputs.ship == 'true'
    runs-on: ubuntu-latest
    # Nine upload attempts with the measured backoff, plus a Railway build (~150 s
    # for this image) and the read-back poll (up to 5 min). Comfortably inside this.
    timeout-minutes: 45
    # The `Production` environment: no required reviewers and the branch policy
    # already allows `prod` (measured 2026-11-21: 0 reviewers, can_admins_bypass
    # true), so it never holds an unattended deploy waiting. It is here for the
    # deployment record and for whatever protection is added later — NOT for secret
    # scoping: RAILWAY_TOKEN_PRODUCTION is a repository-level secret
    # (environment_ids is null), so any job in this repo could already read it, and
    # the `Production` environment itself holds only SUPABASE_DB_PASSWORD.
    environment: production
    concurrency:
      group: deploy-production-backend
      cancel-in-progress: false
    env:
      RAILWAY_PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
      # The CLI's default HTTP timeout is 90 s; backend/ is 25.6 MB across 2594
      # files and does not upload inside that (scripts/ci/railway-deploy.sh).
      RAILWAY_HTTP_TIMEOUT: '600'
      SERVICE: backend
      RAILWAY_ENV: production
      SHA: ${{ github.sha }}
      # production/backend has rootDirectory unset, so the archive root must BE
      # backend/ — THE UPLOAD RULE in scripts/ci/railway-deploy.sh, and the reason
      # a repo-root upload here would build the monorepo and 404 everything.
      UPLOAD_PATH: backend
      ROOT_FLAG: --path-as-root
      # Writes SHA into backend/BUILD_COMMIT so the image can say what it is
      # running; the read-back step is what proves production is answering with it.
      BUILD_DIR: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1
      - name: Deploy backend to production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: bash scripts/ci/railway-deploy.sh
      # A green job is not evidence. Poll /api/v1/public/build until production
      # echoes THIS commit, then check /healthz and /readyz — the failure this
      # catches is the deployment that reports SUCCESS while the old process keeps
      # serving the traffic.
      - name: Read back what production is serving
        run: bash scripts/ci/railway-smoke.sh
