# Called by ci.yml, which is the single pipeline for a push or PR. This lane no
# longer has its own push/pull_request trigger: fourteen workflows starting on one
# push meant fourteen queued pipelines competing for the same runners. ci.yml now
# decides whether this module changed (scripts/ci/changed-modules.py, driven by
# .github/module-filters.json) and calls this file as a reusable workflow, so its
# jobs report inside that one run. Paths live ONLY in module-filters.json now.
name: Visitor & Election CI

# Verifies the Visitor/Gate + Estate Election module on a full Node runner:
#  - scoped mobile type-check (visitor + election features, screens, libs)
#  - whole-app type-check (belt-and-braces, cross-module)
#  - OpenAPI validation (module spec + main spec)
#  - additive-only guard for any visitor/election SQL migrations
# (The authoring sandbox cannot complete a full project tsc/bundle.)

on:
  workflow_call:
  workflow_dispatch:

jobs:
  backend:
    name: Go build / vet / test (estate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - name: Build (whole backend — catches wiring/import breaks)
        run: go build ./...
      - name: Vet (estate)
        run: go vet ./internal/estate/...
      # 15 test files, none gated on TEST_DATABASE_URL, so no Postgres service
      # is needed here — they run in seconds.
      - name: Test (estate — dues/levies money invariants, allocation, guards)
        run: go test ./internal/estate/... -count=1

  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app/reactnative
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Without this the RN dependency tree is installed from scratch every
          # run: npm ci measured 276-421s here against 5-6s for the typecheck it
          # exists to enable. ci.yml's own mobile job has had the cache all along;
          # these lanes were simply never given it.
          cache: npm
          cache-dependency-path: mobile-app/reactnative/package-lock.json
      - run: npm ci
      - name: Typecheck visitor + election module (scoped)
        run: npx tsc --noEmit -p tsconfig.visitorcheck.json

  expo-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app/reactnative
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Export bundle (verifies Metro can resolve all imports)
        run: npx expo export --platform ios --output-dir /tmp/visitor-export

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI (modules + main)
        run: |
          python3 - <<'PY'
          import yaml, sys
          for p in ['contracts/visitor.openapi.yaml', 'contracts/estate.openapi.yaml', 'contracts/openapi.yaml']:
              try:
                  d = yaml.safe_load(open(p))
                  print(f"{p}: valid ({len(d.get('paths', {}))} paths)")
              except Exception as e:
                  print(f"{p}: INVALID -> {e}"); sys.exit(1)
          PY

  contract-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Estate implementation ↔ OpenAPI drift guard
        run: node scripts/contract-check.mjs

  estate-money-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Dues money-path invariants + AI-notes summariser
        run: npm run test:money

  migration-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject destructive DDL in visitor/election migrations (additive-only)
        run: |
          set -e
          FILES=$(ls supabase/migrations/*visitor*.sql supabase/migrations/*election*.sql supabase/migrations/*estate_modules*.sql supabase/migrations/*estate_modules_38_46*.sql supabase/migrations/*estate_indexes*.sql 2>/dev/null || true)
          if [ -z "$FILES" ]; then echo "no visitor/election migrations yet"; exit 0; fi
          if grep -iE '\b(drop\s+(table|column)|alter\s+column|drop\s+not\s+null)\b' $FILES; then
            echo "::error::Destructive DDL found (must be additive-only)"; exit 1;
          fi
          echo "Additive-only guard passed for: $FILES"
