name: F2 staging upload probe (branch-only, no production path)

# Diagnostic only. Runs on pushes to `f2-staging-token-probe` and nowhere else;
# it never reads a production secret and never passes `--environment production`.
# Delete this file with its branch.
#
# What is still open about F2, and what this measures.
#
# Release's `deploy Staging (*)` legs die before the upload starts:
# `Failed to fetch: error decoding response body` / `expected value at line 1
# column 1`, zero `Indexing...` lines, 9 attempts, ~19 minutes, no deployment row.
# Measured cells so far (all the same command shape
# `railway up backend --path-as-root --no-gitignore --service backend
#  --environment <env> --project <id> --detach --message <sha>`):
#
#   auth      host    CLI      env         result
#   session   macOS   5.71.0   staging     SUCCESS  31f94499  13:42Z 11-18
#   session   macOS   5.40.1   staging     SUCCESS  8f3446d0  14:03Z 11-18
#   session   Linux   5.40.1   staging     SUCCESS  7cdb5b31  14:1xZ 11-18
#   secret    CI      5.40.1   development SUCCESS  every release run
#   secret    CI      5.40.1   staging     FAIL     27/27, 11-17 .. 11-18
#   secret    CI      5.74.1*  staging     SUCCESS  diagA/diagB 16:34Z 11-16
#             (* that diagnostic run printed `railway 5.74.1` between its own
#              attempts, i.e. the CLI had auto-updated itself off the 5.40.1
#              pin mid-job, which is why that cell is not a clean
#              same-version comparison.)
#
# So platform is out, the staging environment is out, and the staging secret is
# not simply invalid (it performs every read from a runner, and a deliberate
# garbage token produces the CLI's clean `Unauthorized`, not a decode error). The
# one variable that has never been held still is the CLI version, on the CI side,
# with the staging secret. This file measures exactly that: pinned 5.40.1 first,
# then the current CLI after `railway upgrade --yes`, both against staging.
#
#   cell A fails and cell B succeeds  => Release's pin is the fault. Fix = raise
#       the `@railway/cli@5.40.1` pin in release.yml (three places) to a version
#       that survives the current upload API. Repo-side, shippable, no secrets.
#   both cells fail                   => the pin is innocent and the staging
#       secret's own permission on the code-snapshot call is the last variable
#       left. Fix = create a fresh Railway token and replace
#       RAILWAY_TOKEN_STAGING.
#   cell A succeeds                   => the fault is intermittent, and the retry
#       wrapper in scripts/ci/railway-deploy.sh is the right mitigation.

on:
  push:
    branches:
      - f2-staging-token-probe

permissions:
  contents: read

concurrency:
  group: f2-staging-upload-probe
  cancel-in-progress: false

jobs:
  probe:
    name: staging upload, pinned vs current CLI
    runs-on: ubuntu-latest
    # Same GitHub environment as Release's staging legs, so secret resolution
    # matches the path being diagnosed.
    environment: staging
    env:
      PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
      RAILWAY_HTTP_TIMEOUT: '600'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Release's exact pin
        run: |
          set -uo pipefail
          npm install --global @railway/cli@5.40.1 >/dev/null 2>&1
          railway --version

      - name: Cell A - staging secret, pinned 5.40.1, environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          set -uo pipefail
          printf '%s' "$GITHUB_SHA" > backend/BUILD_COMMIT
          start=$(date +%s%3N)
          railway up backend --path-as-root --no-gitignore \
            --service backend --environment staging --project "$PROJECT" \
            --detach --message "f2A-$GITHUB_SHA" > /tmp/a.log 2>&1
          rc=$?
          echo "exit=$rc elapsed_ms=$(( $(date +%s%3N) - start ))"
          sed -E 's#eyJ[A-Za-z0-9._-]{20,}#<jwt-redacted>#g; s#(sk_|pk_)[A-Za-z0-9_-]{10,}#<key-redacted>#g' /tmp/a.log
          case "$(cat /tmp/a.log)" in
            *Indexing*)                       echo "::notice::CELL_A_UPLOADED" ;;
            *"error decoding response body"*) echo "::notice::CELL_A_DECODE_ERROR (Release signature reproduced)" ;;
            *Unauthorized*)                   echo "::notice::CELL_A_UNAUTHORIZED" ;;
            *)                                echo "::notice::CELL_A_OTHER exit=$rc" ;;
          esac

      - name: Raise the CLI to the current release
        run: |
          set -uo pipefail
          railway upgrade --yes 2>&1 | tail -5 || npm install --global @railway/cli@latest >/dev/null 2>&1
          railway --version

      - name: Cell B - staging secret, current CLI, environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          set -uo pipefail
          printf '%s' "$GITHUB_SHA" > backend/BUILD_COMMIT
          start=$(date +%s%3N)
          railway up backend --path-as-root --no-gitignore \
            --service backend --environment staging --project "$PROJECT" \
            --detach --message "f2B-$GITHUB_SHA" > /tmp/b.log 2>&1
          rc=$?
          echo "exit=$rc elapsed_ms=$(( $(date +%s%3N) - start ))"
          sed -E 's#eyJ[A-Za-z0-9._-]{20,}#<jwt-redacted>#g; s#(sk_|pk_)[A-Za-z0-9_-]{10,}#<key-redacted>#g' /tmp/b.log
          case "$(cat /tmp/b.log)" in
            *Indexing*)                       echo "::notice::CELL_B_UPLOADED (pin bump is the fix)" ;;
            *"error decoding response body"*) echo "::notice::CELL_B_DECODE_ERROR (pin is innocent)" ;;
            *Unauthorized*)                   echo "::notice::CELL_B_UNAUTHORIZED" ;;
            *)                                echo "::notice::CELL_B_OTHER exit=$rc" ;;
          esac

      - name: Cell C - staging secret, current CLI, environment development (control)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          set -uo pipefail
          printf '%s' "$GITHUB_SHA" > backend/BUILD_COMMIT
          start=$(date +%s%3N)
          railway up backend --path-as-root --no-gitignore \
            --service backend --environment development --project "$PROJECT" \
            --detach --message "f2C-$GITHUB_SHA" > /tmp/c.log 2>&1
          rc=$?
          echo "exit=$rc elapsed_ms=$(( $(date +%s%3N) - start ))"
          sed -E 's#eyJ[A-Za-z0-9._-]{20,}#<jwt-redacted>#g; s#(sk_|pk_)[A-Za-z0-9_-]{10,}#<key-redacted>#g' /tmp/c.log
          case "$(cat /tmp/c.log)" in
            *Indexing*)                       echo "::notice::CELL_C_UPLOADED (this token can upload elsewhere)" ;;
            *"error decoding response body"*) echo "::notice::CELL_C_DECODE_ERROR (token cannot upload anywhere)" ;;
            *Unauthorized*)                   echo "::notice::CELL_C_UNAUTHORIZED" ;;
            *)                                echo "::notice::CELL_C_OTHER exit=$rc" ;;
          esac
