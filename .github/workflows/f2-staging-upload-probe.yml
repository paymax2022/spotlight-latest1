name: F2 staging upload probe (branch-only, no production path)

# Diagnostic only. Runs on pushes to `f2-staging-token-probe` and nowhere else;
# it never reads a production secret and never passes `--environment production`.
# Delete this file with its branch.
#
# Why this file exists now.
#
# F2 was the fault that made a green Release impossible: Release's three
# `deploy Staging (*)` legs died ~0.5 s after printing UPLOAD_PATH with
# `Failed to fetch: error decoding response body` / `expected value at line 1
# column 1`, zero `Indexing...` lines, 9 retries each, no deployment row. It
# refused 27/27 calls across two main tips on 2026-11-18 and had kept staging
# dark since 2026-11-16.
#
# The cells measured while chasing it, all with the same command shape
# `railway up backend --path-as-root --no-gitignore --service backend
#  --environment <env> --project <id> --detach --message <sha>`:
#
#   auth      host    CLI     env         result
#   session   macOS   5.71.0  staging     SUCCESS  31f94499  11-18 13:42Z
#   session   macOS   5.40.1  staging     SUCCESS  8f3446d0  11-18 14:03Z
#   session   Linux   5.40.1  staging     SUCCESS  7cdb5b31  11-18 14:1xZ
#   secret    CI      5.40.1  development SUCCESS  every release run
#   secret    CI      5.40.1  staging     FAIL     27/27, 11-17 .. 11-18 14:00Z
#   secret    CI      5.40.1  staging     SUCCESS  77811006  11-18 14:23:32Z
#   secret    CI      5.75.0  staging     SUCCESS  dc99dbca  11-18 14:23:35Z
#   secret    CI      5.40.1  staging     FAIL     27/27 again, run
#                                                 44324715298, 14:29:14 ..
#                                                 14:48:57Z (episode 9)
#
# What the run above (44323670370) did NOT settle, and what this revision tests.
#
# Run 44324715298 (the previous revision of this file, pushed 14:28:58Z) is
# episode 9, and it reproduced the fault 27/27 - six minutes after CI's own
# serial uploads were accepted:
#
#   14:23:32.640Z  CI, staging secret, CLI 5.40.1, `railway up backend
#                  --path-as-root … --environment staging`            ACCEPTED
#                  exit 0 after 2,733 ms, `Indexing...`, `Uploading...`,
#                  row 77811006 / cliMessage f2A-058101dfa, no cliCaller
#   14:23:35.695Z  the same upload again, CLI 5.75.0                  ACCEPTED
#                  exit 0 after 1,958 ms, row dc99dbca / cliMessage
#                  f2B-058101dfa, status SUCCESS, configFile /railway.json,
#                  builder DOCKERFILE, rootDirectory null
#   14:29:15Z      backend, same secret, same pin, same script,       REFUSED 9/9
#   14:29:17Z      frontend-admin, same shape                         REFUSED 9/9
#   14:29:22Z      frontend-web, same shape                           REFUSED 9/9
#                  (main's tip 6057b0d3c; zero `Indexing...` lines; last
#                   attempts 14:48:20.074Z frontend-web, 14:48:22.342Z backend,
#                   14:48:57.578Z frontend-admin — 27 refusals over 1,183 s)
#
# So the 14:23 success did not mean the fault had cleared; it meant one shape
# was accepted and another was not. That leaves exactly one structural
# difference never exercised inside the fault window, which the earlier packs
# measured only on 2026-11-16 (before it opened): **three services uploading
# concurrently from three matrix legs**. Cell A/B were single serial one-shot
# uploads. Episode 9 was a 3-way matrix.
#
# This revision therefore holds everything from episode 9 identical - checkout
# `ref: main`, the pin, `environment: staging`, the staging secret,
# `scripts/ci/railway-deploy.sh`, all three services - and changes one thing:
# `max-parallel: 1`, so the three uploads happen one after another and never
# overlap. `RETRY_ATTEMPTS=2` with a 20 s base delay so a refusal costs 2
# attempts instead of 9 and this run finishes in minutes either way.
#
# Verdict table for this run:
#   all three legs land  -> the refusal is shaped by concurrent staging
#                           uploads; `max-parallel: 1` on release.yml's
#                           deploy-staging is a repo-side fix, and staging gets
#                           current on main's tip as a by-product.
#   legs still refuse    -> concurrency is falsified too; the fault is a
#                           time-windowed Railway-side refusal that no repo-side
#                           change survives, and the evidence pack is the
#                           deliverable.

on:
  push:
    branches:
      - f2-staging-token-probe

permissions:
  contents: read

concurrency:
  group: f2-staging-upload-probe
  cancel-in-progress: false

env:
  # release.yml's workflow-wide pair, copied so this tests the same call.
  RAILWAY_PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
  RAILWAY_HTTP_TIMEOUT: '600'

jobs:
  deploy-staging:
    name: deploy Staging (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: staging
    strategy:
      # Same as release.yml: fail-fast false, so one red service still produces a
      # complete picture instead of two cancelled legs.
      fail-fast: false
      # THE ONE VARIABLE THIS REVISION MOVES. release.yml's deploy-staging leaves
      # this unset (unbounded = all three legs at once), which is the shape that
      # refused 27/27 in episodes 7, 8 and 9 while CI's serial one-shot uploads
      # at 14:23:32Z and 14:23:35Z were accepted.
      max-parallel: 1
      matrix:
        # Copied verbatim from release.yml's deploy-staging matrix.
        include:
          - service: backend
            upload_path: backend
            root_flag: --path-as-root
            build_dir: backend
          - service: frontend-web
            upload_path: ''
            root_flag: ''
            build_dir: ''
          - service: frontend-admin
            upload_path: ''
            root_flag: ''
            build_dir: ''
    steps:
      # main's tree, so what lands on staging is what a real release would put
      # there, and BUILD_COMMIT matches a commit that exists on main.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1

      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          SERVICE: ${{ matrix.service }}
          RAILWAY_ENV: staging
          UPLOAD_PATH: ${{ matrix.upload_path }}
          ROOT_FLAG: ${{ matrix.root_flag }}
          BUILD_DIR: ${{ matrix.build_dir }}
          # Fail fast: two attempts, 20 s base delay, so a refusal costs this run
          # ~40 s rather than the 20 minutes Release's nine attempts burn. The
          # wrapper itself is unchanged, so the retry path is still exercised.
          RETRY_ATTEMPTS: '2'
          RETRY_BASE_DELAY_S: '20'
        run: |
          set -uo pipefail
          export SHA="$(git rev-parse HEAD)"
          echo "uploading main's tip $SHA for $SERVICE (serial leg)"
          rc=0
          bash scripts/ci/railway-deploy.sh 2>&1 | tee /tmp/leg.log || rc=$?
          echo "--- evidence ---"
          echo "exit=$rc"
          echo "Indexing lines: $(grep -c 'Indexing' /tmp/leg.log)"
          echo "Uploading lines: $(grep -c 'Uploading' /tmp/leg.log)"
          echo "decode-error lines: $(grep -c 'error decoding response body' /tmp/leg.log)"
          echo "wrapper retries: $(grep -c 'with-retry' /tmp/leg.log)"
          echo "deployed line: $(grep -c 'deployed' /tmp/leg.log)"
          exit "$rc"
