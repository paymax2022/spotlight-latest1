name: F2 staging upload probe (token scope discriminator)

# Why this file exists.
#
# Release's `deploy Staging (*)` legs die before the upload even starts:
# `railway up` prints `Failed to fetch: error decoding response body` /
# `expected value at line 1 column 1` in under a second, with zero
# `Indexing...` lines, so Railway refused the code-snapshot call and no
# deployment row is ever created. 9 attempts per leg, ~19 minutes per leg.
#
# Everything the repo controls has now been measured out of the equation:
#
#   * the pinned CLI is NOT it — `@railway/cli@5.40.1`, Release's exact pin, ran
#     the exact same command against staging from a laptop and produced
#     `Indexing... Uploading...` and deployment 8f3446d0 = SUCCESS
#     (2026-11-18 14:03Z, build = main's tip).
#   * the stale GitHub DeploymentTriggers that pointed at the unused
#     `staging-Old` environment were deleted on 2026-11-18; the laptop upload
#     worked afterwards, Release's did not. Not the cause.
#   * the token is not simply dead — `Staging inspect` (run 44320572419,
#     2026-11-18 14:06Z, `environment: staging`, same secret) called
#     `railway domain list`, `variable list` and `deployment list` against
#     staging with it and every read returned data with zero decode errors.
#   * an invalid token does not produce this signature either — a deliberate
#     garbage RAILWAY_TOKEN gets the CLI's clean `Unauthorized. Please check
#     that your RAILWAY_TOKEN is valid …`, not a JSON decode error.
#   * runner-side uploads are possible: `deploy Development (*)` legs run the
#     identical command on the identical image and succeed every release.
#
# That leaves exactly one untested intersection: RAILWAY_TOKEN_STAGING *the
# code-snapshot call*. Reads work with it; dev uploads work with a different
# token; staging uploads work with a different credential. This workflow
# separates "what the staging token is allowed to do" from "which environment
# it is being pointed at", in one run, on the same image Release uses.
#
# Verdicts:
#   probe A (staging token -> development) SUCCEEDS and
#   probe B (staging token -> staging)     FAILS
#       => the token can create snapshots; Railway's staging side refuses this
#          token for that environment. Escalate to Railway with both logs.
#   probe A FAILS too
#       => RAILWAY_TOKEN_STAGING lacks the scope/permission the upload needs.
#          Fix = create a fresh full-scope Railway token and replace the secret;
#          no repo change required.
#
# Writes only to development and staging. It has no production path at all, and
# it is `workflow_dispatch`-only, so it cannot run on a push to main.
#
# Delete this file once one Release run shows a real `Indexing... / Uploading...`
# on the staging legs.

run-name: F2 staging upload probe (${{ inputs.cli_version }})

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: 'Railway CLI version to install (Release pins 5.40.1)'
        type: string
        default: '5.40.1'
      ref:
        description: 'Commit to build and upload'
        type: string
        default: 'main'

permissions:
  contents: read

concurrency:
  group: f2-staging-upload-probe
  cancel-in-progress: false

jobs:
  probe:
    name: probe upload auth (${{ inputs.cli_version }})
    runs-on: ubuntu-latest
    # Same GitHub environment as Release's staging legs, so secret resolution is
    # identical to the path being diagnosed.
    environment: staging
    env:
      PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
      CLI_VERSION: ${{ inputs.cli_version }}
      UPLOAD_MESSAGE: f2-probe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install the CLI under test
        run: |
          npm install --global "@railway/cli@${CLI_VERSION}" >/dev/null
          railway --version

      - name: Control read with RAILWAY_TOKEN_STAGING (proves the token authenticates)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          set +e
          out="$(railway deployment list --service backend --environment staging \
                  --project "$PROJECT" --limit 1 2>&1)"; rc=$?
          echo "$out" | sed 's/^/    /'
          echo "read_exit=$rc"
          case "$out" in
            *"error decoding response body"*) echo "::notice::CONTROL READ DECODED-ERROR" ;;
            *Unauthorized*) echo "::notice::CONTROL READ UNAUTHORIZED" ;;
            *) echo "::notice::CONTROL READ OK" ;;
          esac

      - name: Probe A - RAILWAY_TOKEN_STAGING uploading to DEVELOPMENT
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          RAILWAY_HTTP_TIMEOUT: '600'
        run: |
          set +e
          printf '%s' "$GITHUB_SHA" > backend/BUILD_COMMIT
          out="$(railway up backend --path-as-root --no-gitignore \
                  --service backend --environment development --project "$PROJECT" \
                  --detach --message "$UPLOAD_MESSAGE" 2>&1)"; rc=$?
          echo "$out" | sed 's/^/    /'
          echo "exit=$rc"
          case "$out" in
            *Indexing*)                 echo "::notice::PROBE_A_UPLOADED (token can create snapshots)" ;;
            *"error decoding response body"*) echo "::notice::PROBE_A_DECODE_ERROR" ;;
            *Unauthorized*)             echo "::notice::PROBE_A_UNAUTHORIZED" ;;
            *)                          echo "::notice::PROBE_A_OTHER" ;;
          esac

      - name: Probe B - RAILWAY_TOKEN_STAGING uploading to STAGING (reproduce Release)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          RAILWAY_HTTP_TIMEOUT: '600'
        run: |
          set +e
          printf '%s' "$GITHUB_SHA" > backend/BUILD_COMMIT
          out="$(railway up backend --path-as-root --no-gitignore \
                  --service backend --environment staging --project "$PROJECT" \
                  --detach --message "$UPLOAD_MESSAGE" 2>&1)"; rc=$?
          echo "$out" | sed 's/^/    /'
          echo "exit=$rc"
          case "$out" in
            *Indexing*)                 echo "::notice::PROBE_B_UPLOADED (staging upload works from a runner)" ;;
            *"error decoding response body"*) echo "::notice::PROBE_B_DECODE_ERROR (Release signature reproduced)" ;;
            *Unauthorized*)             echo "::notice::PROBE_B_UNAUTHORIZED" ;;
            *)                          echo "::notice::PROBE_B_OTHER" ;;
          esac
