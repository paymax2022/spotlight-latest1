# Deploy backend — build once → promote the SAME image dev→staging→prod.
# Auth to GCP via Workload Identity Federation (OIDC): no long-lived keys.
# Prod is human-gated (GitHub Environment "production" → required reviewers).
# Rollback = re-run with workflow_dispatch sha=<prior>, or shift Cloud Run traffic
# to the previous revision (one gcloud command; see docs/launch blueprint §5).
#
# Required per-Environment config (see infra/terraform/README.md + BRANCH-PROTECTION.md):
#   secrets:   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT
#   variables: GCP_PROJECT_ID, GCP_REGION, GCP_ARTIFACT_REGISTRY
name: deploy

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to (re)deploy — used for rollback"
        required: false

permissions:
  contents: read
  id-token: write # OIDC — short-lived cloud creds

env:
  SERVICE: paymax-backend
  IMAGE_NAME: paymax/backend

jobs:
  build:
    # Skip (not fail) until GCP is configured. `vars` is allowed in job-level if;
    # set repo/Environment variable GCP_PROJECT_ID to activate the pipeline.
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    environment: staging # build with staging identity; the image is env-agnostic
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha || github.sha }}
      - id: meta
        run: |
          SHA="${{ github.event.inputs.sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.GCP_ARTIFACT_REGISTRY }}/${IMAGE_NAME}:$SHA" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      # Resolve the backend Dockerfile's FROM bases via the ECR Public mirror of
      # the Docker Official Images (same digests, no anonymous pull quota) so
      # the build does not depend on Docker Hub's shared hosted-runner rate
      # limit. Falls back to a retried docker.io pull inside the script.
      - name: Pre-pull Dockerfile base images via the ECR Public mirror
        run: bash scripts/ci/mirror-docker-base-images.sh backend/Dockerfile
      - name: Build & push (immutable, SHA-tagged)
        run: |
          bash scripts/ci/with-retry.sh docker build -t "${{ steps.meta.outputs.image }}" backend
          docker push "${{ steps.meta.outputs.image }}"

  staging:
    needs: build
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      # Migrations run expand-first, decoupled from code that needs them (§10).
      # Staging migrations are applied by the `apply-staging` job in
      # db-migrate.yml (push to `staging`, gated on DB_MIGRATE_STAGING_ENABLED),
      # NOT here. Keeping the apply in one workflow means a single reviewed CLI
      # pin governs both databases; a second apply path would let staging and
      # production drift on how a migration applies.
      - name: Deploy to Cloud Run (staging)
        run: |
          gcloud run deploy "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${{ needs.build.outputs.image }}" \
            --quiet
      - name: Smoke test (/healthz + /readyz)
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --format='value(status.url)')
          curl -fsS "$URL/healthz" >/dev/null && echo "healthz OK"
          curl -fsS "$URL/readyz"  >/dev/null && echo "readyz OK"
          # TODO(you): add a sandbox money-path round-trip (e.g. payout) and fail on red.

  production:
    needs: [build, staging]
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    environment: production # protected: required reviewers = human gate
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      # TODO(you): apply the (already staging-verified, additive) migrations to PROD
      # BEFORE routing traffic to code that requires them.
      - name: Deploy canary (no traffic yet)
        run: |
          gcloud run deploy "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${{ needs.build.outputs.image }}" \
            --no-traffic --tag "sha-${{ needs.build.outputs.sha }}" \
            --quiet
      - name: Shift 10% to canary
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --to-tags "sha-${{ needs.build.outputs.sha }}=10" --quiet
      - name: Watch canary golden signals
        # AUD-INFRA-008: was `sleep 30` + TODO — a hollow gate that promoted
        # anything. Tagged revisions get their own URL (<tag>---<service>),
        # so we can probe the canary directly regardless of its 10% share.
        # The probe is /readyz (not /healthz): liveness is a static 200, while
        # /readyz actually pings the shared DB pool (admin_overview.go Ready),
        # so a booted-but-DB-dead revision (bad env, unreachable Supabase)
        # fails this gate instead of promoting. Successes must be CONSECUTIVE —
        # a crash-looping revision that serves intermittently resets the count.
        # Still missing vs a full golden-signal gate: error-rate/latency under
        # live traffic (needs Cloud Monitoring wiring) — tracked in the audit.
        run: |
          TAG="sha-${{ needs.build.outputs.sha }}"
          BASE=$(gcloud run services describe "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --format='value(status.url)')
          # Cloud Run tag-URL convention: https://<tag>---<service-host>
          URL="https://${TAG}---${BASE#https://}"
          echo "Probing canary tag URL: $URL/readyz"
          ok=0
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$URL/readyz" >/dev/null; then
              ok=$((ok + 1))
              echo "canary /readyz OK ($ok/3 consecutive required)"
              [ "$ok" -ge 3 ] && break
            else
              ok=0
              echo "canary /readyz failed (attempt $i) — consecutive count reset"
            fi
            sleep 15
          done
          if [ "$ok" -lt 3 ]; then
            echo "::error::canary revision never sustained /readyz — halting promotion (traffic stays on stable revision)"
            exit 1
          fi
      - name: Promote to 100%
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --to-latest --quiet
      - name: Post-deploy health check
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --format='value(status.url)')
          curl -fsS "$URL/healthz" >/dev/null && echo "prod healthz OK"
