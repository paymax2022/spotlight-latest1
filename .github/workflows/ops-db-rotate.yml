name: Ops - rotate DB password + repair backend DATABASE_URL

# Incident repair: the Supabase DB password was rotated outside this repo's
# control — every consumer holding the old value (Railway DATABASE_URL, the
# SUPABASE_DB_PASSWORD repo secret) began failing auth, and the shared pooler
# circuit-breaker now blocks new connections for the backend.
#
# This workflow performs the full recovery in one guarded run:
#   1. PATCHes the Management API with the NEW password (input — generated by
#      the dispatcher, treated as disclosed to repo collaborators).
#   2. Waits for propagation, then psql-verifies the pooler accepts it.
#   3. Writes the composed pooler DSN to the backend service's DATABASE_URL
#      via --stdin (masked, never logged) and redeploys.
#
# The dispatcher must then update the SUPABASE_DB_PASSWORD repo secret to the
# same value (workflow input panes are visible to repo collaborators; the
# secret write itself is a separate deliberate act done outside CI).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Railway environment to repair'
        required: true
        type: choice
        options: [production, staging]
      new_password:
        description: 'New DB password (letters+digits only, >= 32 chars). Disclosed to repo collaborators — rotate again later if needed.'
        required: true
        type: string
      confirm:
        description: 'Type ROTATE to confirm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ops-db-rotate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rotate:
    name: rotate DB password + repair backend (${{ inputs.environment }})
    if: ${{ inputs.confirm == 'ROTATE' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      PROJECT: e7dca861-3667-4d9a-8090-6d2f4d179ec2
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Resolve tokens + validate the new password shape
        env:
          TOK_PRODUCTION: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          TOK_STAGING: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          PROD_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          STG_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
          SB_ACCESS: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEW_PW: ${{ inputs.new_password }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            production)  tok="$TOK_PRODUCTION";  ref="$PROD_PROJECT_ID"; pooler="aws-0-eu-north-1.pooler.supabase.com" ;;
            staging)     tok="$TOK_STAGING";     ref="$STG_PROJECT_ID"; pooler="aws-1-eu-west-1.pooler.supabase.com" ;;
            *) echo "::error::unknown environment $ENVIRONMENT"; exit 1 ;;
          esac
          [ -n "$tok" ] || { echo "::error::missing RAILWAY_TOKEN for $ENVIRONMENT"; exit 1; }
          [ -n "$ref" ] || { echo "::error::missing SUPABASE project ref for $ENVIRONMENT"; exit 1; }
          [ -n "$SB_ACCESS" ] || { echo "::error::missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          if [ "$ENVIRONMENT" = staging ] && [ "$ref" = "$PROD_PROJECT_ID" ]; then
            echo "::error::staging ref equals production ref — refusing"
            exit 1
          fi
          if ! printf '%s' "$NEW_PW" | grep -qE '^[A-Za-z0-9]{32,128}$'; then
            echo "::error::new_password must be 32-128 chars of letters+digits only"
            exit 1
          fi
          printf 'RAILWAY_TOKEN=%s\n' "$tok" >> "$GITHUB_ENV"
          printf 'PROJECT_REF=%s\n' "$ref" >> "$GITHUB_ENV"
          printf 'SB_ACCESS=%s\n' "$SB_ACCESS" >> "$GITHUB_ENV"
          printf 'POOLER_HOST=%s\n' "$pooler" >> "$GITHUB_ENV"
          echo "::add-mask::$NEW_PW"
          printf 'NEW_PW=%s\n' "$NEW_PW" >> "$GITHUB_ENV"
          unset tok ref
          echo "  resolved for $ENVIRONMENT (values never printed)"

      - name: Rotate the database password (Management API)
        run: |
          set -euo pipefail
          # PATCH /v1/projects/{ref}/database/password — response is empty on
          # success. Status code is the only thing printed.
          code="$(curl -sS -o /tmp/rot.out -w '%{http_code}' -m 30 -X PATCH \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/password" \
            -H "Authorization: Bearer ${SB_ACCESS}" \
            -H 'Content-Type: application/json' \
            -d "$(node -e 'console.log(JSON.stringify({password: process.env.NEW_PW}))')")"
          echo "  management API status: $code"
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            sed -E 's#postgres[^ ]*#<redacted>#g' /tmp/rot.out | head -5
            echo "::error::rotation rejected by the Management API"
            exit 1
          fi
          echo "  password rotated on project ${PROJECT_REF}"

      - name: Wait for propagation, then verify pooler auth
        run: |
          set -euo pipefail
          url="postgres://postgres.${PROJECT_REF}:${NEW_PW}@${POOLER_HOST}:5432/postgres?sslmode=require"
          echo "::add-mask::$url"
          printf 'DATABASE_URL_VALUE=%s\n' "$url" >> "$GITHUB_ENV"
          ok=0
          for i in 1 2 3 4 5 6; do
            sleep 15
            if psql "$url" -w -c 'SELECT 1' >/dev/null 2>&1; then ok=1; break; fi
            echo "  attempt $i: pooler not accepting yet (propagation)"
          done
          [ "$ok" = 1 ] || { echo "::error::pooler still rejects the new password after 90s"; exit 1; }
          echo "  pooler auth OK with the new password"

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.1

      - name: Write DATABASE_URL + redeploy backend
        env:
          DATABASE_URL_VALUE: ${{ env.DATABASE_URL_VALUE }}
        run: |
          set -euo pipefail
          printf '%s' "$DATABASE_URL_VALUE" | railway variable set DATABASE_URL --stdin \
            --service backend --environment "$ENVIRONMENT" --project "$PROJECT" --skip-deploys
          echo "  wrote DATABASE_URL"
          railway redeploy --service backend --environment "$ENVIRONMENT" --project "$PROJECT" --yes || true
          echo "  redeploy triggered"

      - name: Verify (hash only)
        env:
          EXPECT: ${{ env.DATABASE_URL_VALUE }}
        run: |
          set -euo pipefail
          railway variable list --service backend --environment "$ENVIRONMENT" \
            --project "$PROJECT" --json > vars.json
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const vars = JSON.parse(fs.readFileSync("vars.json", "utf8"));
            const v = vars["DATABASE_URL"];
            if (!v) { console.error("  DATABASE_URL not present after write"); process.exit(1); }
            const got = crypto.createHash("sha256").update(String(v)).digest("hex").slice(0, 8);
            const want = crypto.createHash("sha256").update(process.env.EXPECT).digest("hex").slice(0, 8);
            console.log("  DATABASE_URL hash " + got + (got === want ? " — matches" : " — MISMATCH"));
            if (got !== want) process.exit(1);
          '
          echo "  NOTE: update the SUPABASE_DB_PASSWORD repo secret to the same value — ops-db-push depends on it"
