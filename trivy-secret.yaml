# Trivy secret-scanning config — auto-discovered by `trivy fs` when it runs
# from the repo root (the security.yml trivy-fs lane and any local run from
# the root both pick this up; no --secret-config flag needed).
#
# Scope: ONLY allow-rules that exempt one specific value in one specific
# file. All built-in rules remain enabled (verified: backend/.env still
# reports its dev-secret findings with this config loaded).
allow-rules:
  # Supabase legacy JWT-format anon key in mobile-app/reactnative/eas.json.
  #
  # This is the PUBLIC publishable key (role: "anon") — the client-side
  # credential every Expo/web bundle must carry; access control is enforced
  # by Postgres RLS, not by secrecy of this value. It is the JWT-format
  # predecessor of the `sb_publishable_*` keys that both gitleaks
  # (.gitleaks.toml) and trivy already exempt as public-by-design. The
  # EXPO_PUBLIC_ prefix marks it for bundling into the shipped app binary.
  #
  # Scoped as tightly as this trivy version allows: the allow-rule fires on
  # `path` (only eas.json), and `regexes` pins the exact token value for
  # versions that evaluate it — a DIFFERENT secret in eas.json still trips
  # the blocking gitleaks lane (which allowlists only this exact JWT), and
  # the same JWT in any other file still trips trivy (verified locally).
  - id: supabase-anon-key-public
    description: >-
      Supabase legacy JWT-format anon (publishable) key — public by design,
      RLS-gated. See .gitleaks.toml for the matching gitleaks exemption.
    path: eas\.json$
    regexes:
      - 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InduaWNzdWJpem5taXNoa211bnN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5OTc1OTYsImV4cCI6MjA5MDU3MzU5Nn0\.Mjyylv7IA_8PQ2gLo-hmxRNl2Csbm5wOmo5lStf1g5g'
