# Self-hosted OSRM — routing / distance-matrix / map-matching for MapService.
# This is the OpenStack routing backend the MapService OSRM adapter calls.
#
# SECURITY: bound to 127.0.0.1 only — OSRM has no auth and must NEVER be exposed
# publicly. The Go backend reaches it via MAPS_OSRM_BASE_URL (same host, or a
# private network / overlay). All client traffic goes through our authenticated
# /api/finance/maps proxy, never to OSRM directly.
#
# Prereq: build the graph first →  ./prepare-graph.sh ./data
services:
  osrm:
    image: osrm/osrm-backend:v5.27.1
    container_name: spotlight-osrm
    # MLD pipeline. --max-table-size must be >= (origins x destinations) of the
    # largest dispatch matrix we request; 10000 covers 100x100.
    command: >
      osrm-routed --algorithm mld --max-table-size 10000
      --max-matching-size 1000 /data/nigeria.osrm
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:5000:5000"   # localhost only — do not publish to 0.0.0.0
    restart: unless-stopped
    # Heap scales with the extract; Nigeria fits comfortably in ~2–4 GB.
    mem_limit: 4g
    healthcheck:
      # osrm-routed answers /health on newer builds; fall back to a tiny route.
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:5000/route/v1/driving/3.3792,6.5244;3.3892,6.5344?overview=false' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
