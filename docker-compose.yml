services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - backend/.env
    environment:
      APP_PORT: "8080"
      # Enable the §7A Referral Earning system so /api/finance/referral/* is
      # mounted (my-rewards / withdraw-eligible / withdraw / config). Off by
      # default (FEATURE_REFERRALS_ENABLED). frontend-web already sets its own
      # FEATURE_REFERRALS_ENABLED=true and proxies /api/v1/referral/* here — this
      # flag mismatch was leaving /my-rewards unmounted (404/500 on the client).
      # Distinct from FEATURE_REFERRAL_REWARDS_ENABLED (the Direct-Rewards engine).
      FEATURE_REFERRALS_ENABLED: "true"
      # Publish the Utility Bills module so /api/finance/utilitybills/* mounts and
      # the registry lists `utilityPayments` at /api/v1/modules/visibility — without
      # it the mobile services grid hides every utility tile (airtime, data,
      # electricity, cable-tv, bills). config.go reads FEATURE_UTILITY_BILLS_ENABLED
      # (default false) and migration 20270320000000 set the module's env_flag to the
      # same name; the stale FEATURE_UTILITY_PAYMENTS_ENABLED in backend/.env is read
      # by no Go code. Same flag-mismatch class as FEATURE_REFERRALS_ENABLED above.
      FEATURE_UTILITY_BILLS_ENABLED: "true"
      # Platform-managed menu categories (taxonomy). Mounts
      # /api/finance/restaurant/menu-taxonomy/* (owner reads + admin management) and
      # switches item creation to the taxonomy path. The mobile merchant "manage"
      # page and the frontend-admin taxonomy console call menu-taxonomy/categories
      # unconditionally, so with this off (config.go default) that page 404s with
      # "No API route matches …/menu-taxonomy/categories". Same flag-gating class as
      # the flags above.
      FEATURE_RESTAURANT_ADMIN_CATEGORIES: "true"
      # Customer taxonomy browsing (needs the flag above). Off = customers see the legacy
      # food home / menu; merchant and admin taxonomy are unaffected.
      FEATURE_RESTAURANT_TAXONOMY_BROWSE: "true"
      # The provider portal capabilities route is mounted unconditionally and answers
      # 503 "provider portal disabled" while this is off (capabilities.go Register,
      # staging-module-flags.yml sets it for staging). The mobile ProviderRouteGuard
      # reads GET /health/provider-portal/me to decide whether any /food/restaurant,
      # /health/* or /stays/host console renders, and it treats every rejection as a
      # failed check — so with the flag off locally those consoles showed "Couldn't
      # check your provider access" with a Retry that could never succeed. Same
      # local/staging flag-parity class as FEATURE_REFERRALS_ENABLED above.
      FEATURE_PROVIDER_PORTAL_ENABLED: "true"
      # Symptom-based medication search addon, AND'd with FEATURE_HEALTH_PHARMACY_ENABLED
      # (finance_routes.go). Off = the whole /api/health/pharmacy/admin/symptom/* group is
      # never registered, so the admin symptom-mappings console 404s rather than answering
      # fail-closed. Default false in config.go, and neither staging nor production sets it:
      # measured 2026-11-19, GET /api/health/pharmacy/admin/symptom/mappings is 401 on
      # development (variable true) and 404 on staging 773fe0285 and production d3401f574
      # (variable absent in both). The sentence this one replaces claimed staging-module-flags.yml
      # sets it — it does not: that workflow names neither PHARMACY_SYMPTOM_SEARCH nor
      # HEALTH_TRIAGE in its SET list or its verify list, while development-module-flags.yml's
      # MODULES default has both. So local is ahead of staging AND production here.
      FEATURE_PHARMACY_SYMPTOM_SEARCH_ENABLED: "true"
      # AI Symptom Checker (triage & navigation). Off = /api/health/triage/admin/* is not
      # mounted and every admin triage console (content, red-flag rules, validation,
      # escalations) 404s. No API keys are needed locally: with TRIAGE_ENGINE and
      # ANTHROPIC_API_KEY unset the module runs its deterministic engine + keyword
      # extractor (health_triage_routes.go), which is what the governance consoles exercise.
      # Same measured state as the flag above: development-only. GET
      # /api/finance/health/triage/profiles is 401 on development and 404 on staging and
      # production, and FEATURE_HEALTH_TRIAGE_ENABLED exists only in the development env.
      FEATURE_HEALTH_TRIAGE_ENABLED: "true"
      # Property role registration (estate manager / developer / agent). Off =
      # propertyroles.RegisterMember never runs (finance_routes.go gates it on
      # cfg.FeaturePropertyRolesEnabled AND a rolesTablesReady() probe), so the whole
      # /api/finance/property/roles/* group is absent and the mobile /property/roles
      # screen's POST 404s instead of registering the role. The tables
      # (property_role_profiles/documents/events) already exist locally, and staging
      # sets this in staging-module-flags.yml — same local/staging parity gap as the
      # flags above.
      FEATURE_PROPERTY_ROLES_ENABLED: "true"
      # Point at the host-side local Supabase Postgres (supabase start → port 54322).
      # Override in CI/prod with a real DATABASE_URL.
      DATABASE_URL: postgres://postgres:postgres@host.docker.internal:54322/postgres?sslmode=disable
      REDIS_URL: redis://redis:6379
      # Local Supabase REST API
      SUPABASE_URL: http://host.docker.internal:54321
      # E2E-PERF-061 (local close): verify JWTs locally instead of a per-request
      # GoTrue GET /auth/v1/user — the per-request call opens a fresh Postgres
      # connection through GoTrue every request and was the measured authed
      # ceiling (~50–100 req/s, ephemeral-port exhaustion at ~25 VU). ES256
      # verifies against the JWKS at SUPABASE_URL above. Safe locally: the only
      # trade-off is GoTrue logout/password-change staleness bounded by the
      # access-token TTL, and platform_users status still gates per request.
      # PROD stays a deliberate decision — see jwt_local.go's revocation note.
      # E2E-SEC-055 residual: FEATURE_SESSION_HARDENING stays OFF even with
      # local verify — turning it on without a session-sync-on-refresh design
      # 401s every token minted outside Login (GoTrue refresh rotation,
      # password grants) since ValidateAccess fails closed on a missing row.
      AUTH_JWT_LOCAL_VERIFY: "true"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/public/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Marketplace search read model (Agent B) ──────────────────────────────────
  # Single-node Elasticsearch 8.x. The search client (backend/internal/marketplace/
  # search/client.go) is dependency-free net/http and targets composable index
  # templates (_index_template, ES 7.8+) + function_score ranking — both native to
  # 8.x. Security is disabled for local/dev only; a managed cluster with TLS + auth
  # is expected in staging/prod (see docs/prd/marketplace/RUNBOOK.md).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # ── Marketplace ES indexer (Agent B) — drains mkt_listings_outbox → ES ────────
  # Feature-flag gated: only starts under the `marketplace` compose profile so it
  # never runs unless the marketplace is being exercised (mirrors
  # FEATURE_MARKETPLACE_ENABLED). Reuses the same immutable ./backend image build.
  marketplace-indexer:
    profiles: ["marketplace"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/marketplace-indexer"]
    environment:
      FEATURE_MARKETPLACE_ENABLED: "true"
      DATABASE_URL: postgres://postgres:postgres@host.docker.internal:54322/postgres?sslmode=disable
      # The indexer binary reads ES_URL (cmd/marketplace-indexer/main.go).
      ES_URL: http://elasticsearch:9200
      MARKETPLACE_INDEXER_INTERVAL_MS: "2000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ── Marketplace cron (Agent B) — auto-expire / auto-release / reconciliation ──
  # The hourly escrow-reconciliation job asserts the §2.2 invariant
  # SUM(escrow ledger balance) == SUM(open-escrow orders) and logs drift loudly.
  marketplace-cron:
    profiles: ["marketplace"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/marketplace-cron"]
    environment:
      FEATURE_MARKETPLACE_ENABLED: "true"
      DATABASE_URL: postgres://postgres:postgres@host.docker.internal:54322/postgres?sslmode=disable
    restart: unless-stopped

  # ── Transport Trip Scheduling worker ─────────────────────────────────────────
  # Materializes user-scheduled future rides/parcels/bus at lead time, sends 24h/1h
  # reminders, and safety-net-expires past-due bookings — every 60s runLoops
  # (dispatch-due / reminders / expire-stale), mirroring marketplace-cron.
  #
  # Feature-flag gated two ways: (1) only starts under the `transport-scheduling`
  # compose profile so it never runs unless the feature is being exercised, and
  # (2) the binary itself exits immediately unless FEATURE_TRANSPORT_SCHEDULING_ENABLED
  # is true (cmd/transport-scheduler/main.go). Reuses the SAME immutable ./backend
  # image build. Redis is NOT required: the worker passes a nil redis client to the
  # ledger (idempotency is keyed on the DB-unique settlements/ledger keys), the same
  # graceful-degradation contract marketplace-cron uses — REDIS_URL is passed only so
  # config validation matches the api service and future redis-backed features work.
  transport-scheduler:
    profiles: ["transport-scheduling"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/transport-scheduler"]
    environment:
      FEATURE_TRANSPORT_SCHEDULING_ENABLED: "true"
      DATABASE_URL: postgres://postgres:postgres@host.docker.internal:54322/postgres?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Notification delivery worker ───────────────────────────────────────────
  # Consumes the notification:push/email/sms asynq tasks the api enqueues —
  # health appointment/vaccination reminders, wallet events, estate notices.
  # E2E-BE-031: nothing local consumed the queue, so enqueued tasks sat
  # pending forever (the scheduler poller writes them; this drains them).
  # Render already runs the same binary in prod (render.yaml
  # spotlight-notification-worker). Profile-gated so it only runs when
  # notification delivery is being exercised locally:
  #   docker compose --profile notifications up notification-worker
  # Provider creds (RESEND_API_KEY / TERMII_API_KEY / Expo) are unset locally —
  # provider calls fail and the task retries, which is the observable behavior
  # you want when testing enqueue→consume without real delivery.
  notification-worker:
    profiles: ["notifications"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/notification-worker"]
    environment:
      # Local-only dev fixture (postgres:postgres on the Supabase CLI sidecar
      # port), same DSN the other compose services carry.
      DATABASE_URL: postgres://postgres:postgres@host.docker.internal:54322/postgres?sslmode=disable # trufflehog:ignore
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  es_data:
