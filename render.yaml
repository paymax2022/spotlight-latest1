services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend API Service
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: spotlight-backend
    plan: standard
    runtime: docker
    region: ohio
    startCommand: /app/server
    healthCheckPath: /api/v1/public/health
    healthCheckInterval: 30
    dockerfile: ./Dockerfile
    dockerContext: ./
    autoDeploy: true
    maxInstances: 3
    minInstances: 1

    envVars:
      - key: APP_PORT
        value: 8080
      - key: FEATURE_REFERRALS_ENABLED
        value: "true"
      - key: FEATURE_MARKETPLACE_ENABLED
        value: "true"
      - key: FEATURE_TRANSPORT_SCHEDULING_ENABLED
        value: "false"
      - key: RUN_WORKERS_INPROCESS
        value: "false"

      # Database (Supabase PostgreSQL)
      - key: DATABASE_URL
        fromDatabase:
          name: spotlight-db
          property: connectionString

      # Redis (optional - for idempotency cache, Redlock, asynq queue)
      - key: REDIS_URL
        fromService:
          name: spotlight-redis
          property: connectionString

      # Supabase REST API
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Logging & monitoring
      - key: LOG_LEVEL
        value: info
      - key: ENVIRONMENT
        value: production

  # ─────────────────────────────────────────────────────────────────────────────
  # Admin Dashboard (Next.js 15.1) — MOVED TO RAILWAY
  #
  # The spotlight-admin service was removed from Render. It now deploys from
  # frontend-admin/railway.json using frontend-admin/Dockerfile. Leaving the
  # service defined here would have both platforms building the same app on
  # every push to main.
  #
  # The build-memory guard that service carried lives on in the new home:
  # experimental.cpus=1 in frontend-admin/next.config.mjs, and NODE_OPTIONS in
  # the Dockerfile's builder stage.
  #
  # Delete the existing spotlight-admin service in the Render dashboard —
  # removing it from this file does not tear down an already-created service.
  # ─────────────────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend Web (Next.js 14.2)
  # Note: Alternatively deploy to cPanel Passenger with frontend-web/server.js
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: spotlight-frontend
    plan: standard
    runtime: node
    region: ohio
    rootDir: frontend-web
    startCommand: npm run start
    buildCommand: npm install && npm run build
    buildFilter:
      paths:
        - frontend-web/**
        - package*.json
    healthCheckPath: /
    healthCheckInterval: 30
    autoDeploy: true
    maxInstances: 2
    minInstances: 1

    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: spotlight-backend
          property: url
          path: /api/v1
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_ENVIRONMENT
        value: production
      - key: NODE_ENV
        value: production
      # Same SIGABRT guard as spotlight-admin: this build peaked at 2.63 GiB
      # uncapped, well over the instance's 2 GB. Paired with experimental.cpus=1
      # and conditional source maps in frontend-web/next.config.mjs.
      - key: NODE_OPTIONS
        value: --max-old-space-size=1024

  # ─────────────────────────────────────────────────────────────────────────────
  # Mobile Web (React Native/Expo Web)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: spotlight-mobile
    plan: standard
    region: ohio
    rootDir: mobile-app/reactnative
    # Static export — `expo start --web` is the Metro dev server (unminified,
    # HMR websocket, not production-sized). `build:web` does not exist; SDK 54
    # exports to dist/.
    runtime: static
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: dist
    buildFilter:
      paths:
        - mobile-app/reactnative/**
        - package*.json
    healthCheckPath: /
    healthCheckInterval: 30
    autoDeploy: true
    maxInstances: 1
    minInstances: 1

    envVars:
      # Expo only inlines EXPO_PUBLIC_* vars at build time — REACT_APP_* keys
      # never reach the bundle (the client would fall back to localhost).
      - key: EXPO_PUBLIC_API_BASE_URL
        fromService:
          name: spotlight-backend
          property: url
          path: /api/v1
      - key: EXPO_PUBLIC_APP_ENV
        value: production
      - key: NODE_ENV
        value: production

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis (for idempotency, Redlock, asynq queue)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: redis
    name: spotlight-redis
    plan: starter
    region: ohio
    # Empty allowlist = private-network only. The backend reaches it via the
    # fromService connectionString above; no public endpoint is needed.
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL Database (Supabase managed)
  # Note: If using self-managed Postgres on Render instead:
  # ─────────────────────────────────────────────────────────────────────────────
  # - type: pserv
  #   name: spotlight-db
  #   plan: starter
  #   region: ohio
  #   database: spotlight
  #   user: postgres
  #   ipAllowList: []  # private-network only — never expose Postgres publicly
  #   preDeployCommand: supabase migration up

databases:
  - name: spotlight-db
    plan: starter
    region: ohio
    version: 15
    databaseName: spotlight
    databaseUser: postgres
    # Private-network only — the backend connects via the internal
    # connectionString (envVars above). A public Postgres endpoint is not needed.
    ipAllowList: []

# ─────────────────────────────────────────────────────────────────────────────
# Environment Groups (optional - for shared config across services)
# ─────────────────────────────────────────────────────────────────────────────
envGroups:
  - name: api-config
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info

  - name: frontend-config
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_ENVIRONMENT
        value: production
