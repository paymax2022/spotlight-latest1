# Render Blueprint — free-tier hosting for the Paymax super-app (dev/testing).
# See docs/adr/ADR-026-free-tier-hosting.md for the full topology + rationale.
#
# What lives WHERE (free-tier hybrid — NOT everything on Render):
#   - Go API + both Next apps ....... Render Web Services (this file)
#   - Redis (idempotency/Redlock/asynq) Render Key Value (this file)
#   - Postgres + Auth ............... SUPABASE free  (NOT here — Auth/RLS dependency,
#                                     and Render's free Postgres is deleted after 90d)
#   - Object storage ................ Cloudflare R2 free   (set R2_* below)
#   - Email ......................... Resend free          (set RESEND_* below)
#   - Payments ...................... Paystack test        (set PAYSTACK_* below)
#   - Search (Elasticsearch) ........ DISABLED on free tier (ELASTICSEARCH_URL empty)
#   - Routing (OSRM)/Transport ...... DISABLED on free tier (FEATURE_TRANSPORT_ENABLED=false)
#   - Background workers (cron/indexer/scheduler) .. NOT free on Render — see the ADR;
#                                     run in-process in dev or trigger via external cron.
#
# All values marked `sync: false` are SECRETS: set them in the Render dashboard (or an
# Env Group) after first apply — they are never committed here.

services:
  # ── Go API (cmd/server) — built from backend/Dockerfile ──────────────────────
  - type: web
    name: paymax-backend
    runtime: docker
    repo: https://github.com/paymax2022/spotlight-latest1
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free                 # 512MB / 0.1CPU; SPINS DOWN after 15min idle (cold start)
    region: oregon
    healthCheckPath: /api/v1/public/health
    autoDeploy: false          # deploys are triggered by .github/workflows/deploy.yml
    envVars:
      - key: APP_ENV
        value: staging
      # Render injects PORT=10000 and routes to it; the API reads APP_PORT — bind them.
      - key: APP_PORT
        value: "10000"
      # Postgres stays on Supabase (session-pooler URL, port 6543, sslmode=require).
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Redis — wired from the Render Key Value service below (internal connection).
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: paymax-redis
          property: connectionString
      # Email (Resend free)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # Payments (Paystack test)
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      # Object storage (Cloudflare R2, S3-compatible)
      - key: R2_ACCOUNT_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_REGION
        value: auto
      - key: CORS_ALLOW_ORIGINS
        sync: false            # e.g. https://paymax-web.onrender.com,https://paymax-admin.onrender.com
      # ── Heavy externals OFF on free tier (code falls back safely) ────────────
      - key: ELASTICSEARCH_URL
        value: ""              # empty → marketplace search uses the Postgres fallback
      - key: FEATURE_MAPS_ENABLED
        value: "false"
      - key: FEATURE_TRANSPORT_ENABLED
        value: "false"
      - key: FEATURE_TRANSPORT_SCHEDULING_ENABLED
        value: "false"
      # Money-path & new modules default OFF until explicitly enabled per environment.
      - key: FEATURE_RESTAURANT_WITHDRAWALS_ENABLED
        value: "false"

  # ── Customer web app (frontend-web — Next.js 14) ─────────────────────────────
  - type: web
    name: paymax-web
    runtime: node
    repo: https://github.com/paymax2022/spotlight-latest1
    branch: main
    rootDir: frontend-web
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    # `next start` binds Render's $PORT automatically (do NOT hardcode a port here).
    startCommand: npm start
    autoDeploy: false
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Full https:// URL of the backend — set after the backend's first deploy
      # (Render cannot compose a scheme onto a service host, so this is manual).
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false            # e.g. https://paymax-backend.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        sync: false            # e.g. https://paymax-web.onrender.com
      - key: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
        sync: false

  # ── Admin console (frontend-admin — Next.js 15) ──────────────────────────────
  - type: web
    name: paymax-admin
    runtime: node
    repo: https://github.com/paymax2022/spotlight-latest1
    branch: main
    rootDir: frontend-admin
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    # package.json `start` hardcodes -p 3001; override to bind Render's $PORT.
    startCommand: npx next start -p $PORT
    autoDeploy: false
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

  # ── Redis (Render Key Value, free 25MB) — idempotency / Redlock / asynq ───────
  - type: keyvalue
    name: paymax-redis
    plan: free
    region: oregon
    # Empty allow-list = internal-only (reachable from the services above, not public).
    ipAllowList: []
    maxmemoryPolicy: noeviction   # asynq/idempotency must not silently drop keys
