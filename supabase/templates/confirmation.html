<!--
  Sign-up confirmation — OTP CODE, not a link (decided 2026-08-25).

  Supabase's DEFAULT template body is {{ .ConfirmationURL }}, i.e. a link. With
  codes chosen as the paradigm, that default silently defeats the whole flow: the
  app shows a code entry screen and the email contains no code to enter. Proved
  locally — the confirmation mail carried only a URL.

  {{ .Token }} is the digits. Its length is the project's mailer_otp_length
  (staging/local 6, prod 8) and must equal EXPO_PUBLIC_OTP_LENGTH in the app.

  This file configures LOCAL only. The two cloud projects each carry their own
  copy of this template and must be updated in the dashboard
  (Authentication → Email Templates → Confirm signup) or they keep sending links.
-->
<div style="font-family:Arial,Helvetica,sans-serif;color:#111827;max-width:480px">
  <h2 style="margin:0 0 8px">Confirm your email</h2>
  <p style="margin:0 0 20px;color:#4b5563">
    Enter this code in the app to finish creating your Spotlight account.
  </p>
  <p style="font-size:32px;font-weight:700;letter-spacing:6px;margin:0 0 20px;color:#111827">
    {{ .Token }}
  </p>
  <p style="margin:0;color:#6b7280;font-size:13px">
    This code expires shortly. If you didn't create an account, you can ignore this email.
  </p>
</div>
